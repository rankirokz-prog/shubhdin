<script>
/* Language tables must load BEFORE the page's own script runs. A dynamically
   appended <script> does not block the parser, so the chosen-language file
   arrived after the page had already painted and every A() call fell through
   to Hindi — verified by snapshotting all 46 screens, where every English
   screen came back in Hindi. document.write during initial parse IS parser-
   blocking, which is the ordering guarantee needed here.
   Hindi always loads as the fallback; the chosen language loads beside it. */
window.SD_LANG=(function(){try{return sdSafeProfile().lang||'hi';}catch(e){return 'hi';}})();
document.write('<scr'+'ipt src="app-strings-hi.js"></scr'+'ipt>');
if(window.SD_LANG&&window.SD_LANG!=='hi')
  document.write('<scr'+'ipt src="app-strings-'+window.SD_LANG+'.js"></scr'+'ipt>');
document.write('<scr'+'ipt src="app-strings-loader.js"></scr'+'ipt>');
/* If app-strings-loader.js itself fails to arrive, A() is undefined and EVERY
   call site throws — the page half-renders and stops. Verified by blocking the
   file: "A is not defined", and the screen died partway. This shim defines the
   minimum so the page completes; the real loader overwrites it when it lands. */
window.addEventListener('DOMContentLoaded',function(){},false);
if(typeof window.A!=='function'){
  window.A=function(k){return String(k).replace(/^[a-z]+\./,'').replace(/_/g,' ')
                        .replace(/^./,function(c){return c.toUpperCase();});};
  window.AF=function(k,v){return String(window.A(k)).replace(/\{(\w+)\}/g,function(_,n){
                        return (v&&v[n]!=null)?v[n]:'';});};
  window.AP=function(k,n,v){var o={};if(v)for(var p in v)o[p]=v[p];o.n=n;return window.AF(k,o);};
}
</script>

   MY REPORTS — Door 2 of owned-contract.md

   Unlike premium.html (localStorage only, deliberately), this page IS allowed
   to hit the server: it is where the authoritative answer lives. If the local
   record is empty but the buyer has an account, ?list=1 restores it.

   Rules taken straight from the contract:
     · sdOwnedRead() is copied verbatim (it lives in report-catalog.js) — a
       corrupt record reads as [] and never throws.
     · pdf_url ABSENT does not mean no PDF. It means this device has not
       fetched the URL yet, so "Open" asks the server, which returns the
       cached PDF instantly when one exists.
     · "Open" never routes into the buy flow. A paid report must never send
       its owner back to a payment page.
   ══════════════════════════════════════════════════════════════════ */
var SB_URL='https://dulfiljhfchkccqwqniv.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bGZpbGpoZmNoa2NjcXdxbml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTQ0OTQsImV4cCI6MjA5MDYzMDQ5NH0.et_SeR8w5nLbWMIbIHvix8EYpvPI8-dPHmXQr78ocnM';
/* The owned list is local-first, so the page must render even if the Supabase
   CDN is slow, blocked or offline. Creating the client unguarded threw and
   killed the whole script — a buyer on a bad connection saw a blank page
   instead of the reports already on their phone. Auth is an enhancement here,
   not a prerequisite. */
var sb=null;
try{ if(window.supabase&&window.supabase.createClient) sb=window.supabase.createClient(SB_URL,SB_ANON); }
catch(e){ sb=null; }
var U=sdSafeProfile();
var H=
(U.lang||'hi')==='hi';
/* Date locale follows the reader's language. Every call passed H?'hi-IN':'en-IN',
   so a Telugu reader saw "Sun, 23 Aug" in English on a fully Telugu screen.
   Inserted after the H STATEMENT — an earlier attempt anchored on "var H=" and
   spliced itself between the equals sign and the value, which broke the whole
   script. Anchor on a complete statement, never a fragment. */
function sdLocale(){
  var l = (typeof window!=='undefined' && window.SD_LANG) || 'hi';
  return { hi:'hi-IN', en:'en-IN', te:'te-IN', kn:'kn-IN', ta:'ta-IN',
           bn:'bn-IN', mr:'mr-IN', gu:'gu-IN', as:'as-IN' }[l] || 'hi-IN';

function sdFmt(tpl,vals){return String(tpl).replace(/\{(\w+)\}/g,function(_,k){
  return (vals&&vals[k]!==undefined&&vals[k]!==null)?vals[k]:'';});}

/* Same read-body-first guard buy.html uses: the service worker answers /api/
   with an empty 503 when offline, so a bare r.json() throws parser noise
   instead of a reason the buyer can act on. */
async function apiJson(r){
  var txt='';
  try{txt=await r.text();}catch(e){}
  if(!txt) throw new Error(A('report.could_not_reach_the_server_check_y'));
  try{return JSON.parse(txt);}
  catch(e){ throw new Error(A('report.unexpected_response_from_the_serve')); }
}

/* ══ SD-REPORT-LANG ══
   The language a report was BOUGHT in. My Reports had no idea reports even
   had a language: it re-rendered PDFs as Hindi-or-English and opened the
   on-screen view with no language at all. Both are fixed below; this is the
   single place that answers "which language is this report?".
     1. the ownership record   (written by buy.html and by list=1)
     2. the purchase details still on this device (sd_buy_<report>)
     3. the app language
     4. Hindi
   Never guesses from the UI language alone when better evidence exists. */
function reportLang(id){
  var OK=['en','hi','te','kn','ta','bn','mr','gu','as'];
  var rec=null, det=null;
  try{ rec=sdOwnedRead().filter(function(x){return x.report===id;})[0]; }catch(e){}
  try{ det=sdReportDetails(id); }catch(e){}
  var picks=[rec&&rec.lang, det&&det.lang, window.SD_LANG, 'hi'];
  for(var i=0;i<picks.length;i++) if(OK.indexOf(picks[i])>=0) return picks[i];
  return 'hi';
}

/* Merge semantics per the contract: never overwrite an existing pdf_url. */
function ownedWrite(report,orderCode,pdfUrl,date,lang,pdfExpiresAt,dispatchStatus,generationStatus){
  try{
    var a=sdOwnedRead(), f=null;
    for(var i=0;i<a.length;i++) if(a[i].report===report){f=a[i];break;}
    if(!f){ f={report:report,date:date||new Date().toISOString().slice(0,10)}; a.push(f); }
    if(orderCode) f.order_code=orderCode;
    if(pdfUrl){ f.pdf_url=pdfUrl; f.pdf_expires_at=pdfExpiresAt||null; }
    if(lang) f.lang=lang;   /* remembered so a re-render never guesses */
    if(dispatchStatus) f.dispatch_status=dispatchStatus;
    if(generationStatus) f.generation_status=generationStatus;
    sdAccountWriteOwned(a);
  }catch(e){}
}
/* Is this URL still good? A HEAD is enough and costs nothing. Anything other
   than a clear "no" is treated as alive — a CORS-opaque or network-blipped
   response must not throw away a URL that actually works. */
/* The server existence-checks pdf_url before returning it in list=1, so a
   present URL opens. The client-side HEAD probe that used to sit here is gone:
   it duplicated a check the server already does, cost a round trip on every
   tap, and could only ever fail open. */
function dropPdfUrl(id){
  try{
    var a=sdOwnedRead(), changed=false;
    for(var i=0;i<a.length;i++) if(a[i].report===id && a[i].pdf_url){ delete a[i].pdf_url; delete a[i].pdf_expires_at; changed=true; }
    if(changed) sdAccountWriteOwned(a);
  }catch(e){}
}

  }catch(e){ return d; }
}

      +(o.date?esc(sdFmt(A('report.purchased_date'),{date:fmtDate(o.date)})):'')
      +(o.order_code?' · '+esc(o.order_code):'')+'</div>'
      +'<div class="delivery-status" style="margin-top:14px;font-size:15px;font-weight:600;color:#E8BE5A;">'+esc(state.title)+'</div>'
      +'<div style="margin-top:7px;font-size:13px;line-height:1.7;color:rgba(255,244,222,.82);">'+esc(state.description)+'</div>'
      +(state.canOpen?'<button class="btn" id="open-'+r.id+'" onclick="openReport(\''+r.id+'\')">📄 '+esc(sdDeliveryText(13))+'</button>':'')
      +'<button class="btn sec" id="again-'+r.id+'" onclick="checkAgain(\''+r.id+'\')">↻ '+esc(sdDeliveryText(12))+'</button>'
      +'<div id="manual-'+r.id+'" style="display:none;"></div>'

  if(location.hash){

/* ── open: PDF first, exactly as the contract decides ── */
async function openReport(id){
  if(OPEN_BUSY)return;
  if(!SESSION){showErr($('err-'+id),sdDeliveryText(14));return;}
  var account=SESSION.user.id;OPEN_BUSY=true;
  var btn=$('open-'+id);if(btn){btn.disabled=true;btn.textContent=sdDeliveryText(0);}
  try{
    var fresh=await restoreFromServer();
    if(!fresh||!SESSION||SESSION.user.id!==account||sdReportAccount()!==account)return;
    var rec=sdOwnedRead().filter(function(o){return o.report===id;})[0];
    if(!rec||rec.dispatch_status!=='sent'||rec.pdf_ready!==true||!rec.pdf_url)return;
    if(!rec.pdf_expires_at||Date.parse(rec.pdf_expires_at)<=Date.now())return;
    openPdf(id,rec.pdf_url);
  }finally{OPEN_BUSY=false;}
}

/* ══════════════════════════════════════════════════════════════════
   OPENING A PDF FROM AN INSTALLED PWA

   `location.href = pdfUrl` works in a browser tab and SILENTLY DOES NOTHING
   once the app is launched from the home-screen icon. It is a well-documented
   standalone-PWA behaviour, not something wrong with the file: the same URL
   downloads fine when the site is opened in Chrome. The app "loads" and no
   file ever arrives — exactly the reported symptom, and the same reason the
   free Kundli download fails.

   An anchor with target=_blank hands the URL to the browser/OS instead of
   trying to navigate the app shell. There is no reliable way to detect that
   it failed, so a visible manual link is ALWAYS left behind — a paid report
   must never depend on a mechanism we cannot verify.
   ══════════════════════════════════════════════════════════════════ */
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone===true;
}
function openPdf(id,url){
  try{
    var a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    try{ window.open(url,'_blank','noopener'); }catch(e2){ location.href=url; }
  }
  showManualLink(id,url);
}
/* Shown after every open attempt. Cheap insurance: if the tap did nothing,
   this is a real <a> the user can long-press or tap, which the OS handles. */
function showManualLink(id,url){
  var box=$('manual-'+id); if(!box) return;
  box.innerHTML='<div style="font-size:10.5px;color:rgba(255,244,222,0.55);line-height:1.6;margin-top:9px;">'
    +A('kundli.if_the_download_did_not_start_tap_')+'</div>'
    +'<a href="'+url+'" target="_blank" rel="noopener" '
    +'style="display:block;margin-top:6px;padding:10px;border-radius:11px;text-align:center;'
    +'text-decoration:none;font-size:13px;font-weight:600;color:#BFEFD0;'
    +'background:rgba(74,124,89,0.18);border:1px solid rgba(120,200,150,0.35);">'
    +'📥 '+A('kundli.open_the_pdf_in_your_browser')+'</a>'
    +(isStandalone()
      ? '<div style="font-size:10px;color:rgba(255,244,222,0.40);margin-top:7px;line-height:1.55;">'
        +A('kundli.downloads_sometimes_do_not_run_fro')+'</div>' : '');
  box.style.display='block';
}
// Compatibility for any old caller: same fresh server gate as PDF opening.
function viewOnScreen(id){return openReport(id);}
async function checkAgain(id){
  if(!SESSION){showErr($('err-'+id),sdDeliveryText(14));return;}
  var btn=$('again-'+id);if(btn){btn.disabled=true;btn.textContent=sdDeliveryText(0);}
  await restoreFromServer();
}
function showErr(el,msg){ if(!el)return; el.textContent=msg; el.style.display='block'; }

/* ── sign-in and server restore ── */
function signIn(){
  if(!sb){ showErr($('errTop'),A('report.sign_in_is_unavailable_right_now_c')); return; }
  var rto=location.origin+location.pathname;
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:rto,
    /* GOOGLE'S OWN SIGN-IN PAGE IS NOT OUR TEXT.
     A Telugu user was shown the consent screen in HINDI. No leak gate could
     ever catch that — the words come from Google, and Google picks the
     language from the user's Google account, not from our app. Indian
     accounts very often default to Hindi.
     `hl` is Google's interface-language parameter; Supabase passes
     queryParams straight through to the provider URL. Unsupported codes fall
     back on Google's side, so this can only improve matters. */
  queryParams:{hl:(window.SD_LANG||'en')}}})
   .then(function(r){ if(r.error) showErr($('errTop'),r.error.message); });
}
function absorbHash(){
  if(!sb) return Promise.resolve(null);
  if(location.hash.indexOf('access_token=')>-1){
    try{ var hp=new URLSearchParams(location.hash.slice(1));
      var at=hp.get('access_token'), rt=hp.get('refresh_token');
      if(at&&rt) return sb.auth.setSession({access_token:at,refresh_token:rt});
    }catch(e){}
  }
  return Promise.resolve(null);
}
/* Reconcile this account's authoritative list, including an empty list.
   Failed requests leave only this same account's offline cache intact. */
async function restoreFromServer(){
  VERIFIED_ACCOUNT=null;
  if(!SESSION){render();return false;}
  var session=SESSION;
  try{
    var r=await sdFetch('/api/order?list=1&uid='+session.user.id,
                      {headers:{Authorization:'Bearer '+session.access_token}});
    var j=await apiJson(r);
    if(!SESSION||SESSION.user.id!==session.user.id||sdReportAccount()!==session.user.id)return;
    if(j && Array.isArray(j.reports)){
      VERIFIED_ACCOUNT=session.user.id;
      sdReportReconcile(j.reports,session.user.id);
      j.reports.forEach(function(o){
        /* pdf_url now comes from list=1: the server HEAD-checks the deterministic
           storage path and returns a URL only when a PDF genuinely exists, so its
           presence means "openable right now". Passing null here silently threw
           that away — "Check again" fetched the answer and discarded it. */
        ownedWrite(o.report,o.order_code,o.pdf_url||null,(o.paid_at||'').slice(0,10),o.lang,
                   o.pdf_expires_at,o.dispatch_status,o.generation_status);
        // A URL the server no longer returns is a file that no longer exists.
        // Without this, one written in an older session could never be cleared
        // and the buyer would tap a dead link forever with no way back.
        if(!o.pdf_url) dropPdfUrl(o.report);
      });
      render();
      return true;
    }
    render();return false;
  }catch(e){
    VERIFIED_ACCOUNT=null;render();
    /* A devotee on a village connection should not be shown a raw exception
       string like "Failed to fetch" or "network down". Say what it means and
       what still works: their reports are safe, this device just could not
       reach the account this minute. */
    var m=$('syncMsg');
    if(m) m.textContent=A('report.could_not_reach_your_account_just_');
    return false;
  }
}
/* Exactly what this device holds, per report. Turns "it isn't downloading"
   into a fact that can be read out over WhatsApp instead of guessed at. */
function showDiag(){
  var lines=[];
  lines.push('signed in : '+(SESSION?('yes · '+SESSION.user.id.slice(0,8)):'no'));
  lines.push('supabase  : '+(sb?'client ok':'CDN did not load'));
  lines.push('');
  var owned=sdOwnedRead();
  lines.push('sd_owned_reports ('+owned.length+' entries)');
  owned.forEach(function(o){
    var known=!!reportById(o.report);
    lines.push('  '+o.report+(known?'':'  [UNKNOWN ID]'));
    lines.push('     date       : '+(o.date||'—'));
    lines.push('     order_code : '+(o.order_code||'—'));
    lines.push('     pdf_url    : '+(o.pdf_url?o.pdf_url:'ABSENT  → Open must ask the server'));
    lines.push('     sd_buy_'+o.report+' : '+(buyDetails(o.report)?'present':'ABSENT  → cannot render here'));
  });
  lines.push('');
  var strays=[];
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
        if(k&&k.indexOf('sd_buy_')===0&&k!=='sd_buy_last') strays.push(k); } }catch(e){}
  lines.push('sd_buy_* keys on device: '+(strays.join(', ')||'none'));
  document.getElementById('diagTxt').textContent=lines.join('\n');
  document.getElementById('diagWrap').style.display='block';
}
/* ── boot ── */
/* Account helper reads only the account selected by the auth session. */
render();
absorbHash().then(function(){
  return sb ? sb.auth.getSession() : null;   // no client → stay local-only
}).then(function(r){
  SESSION=(r&&r.data&&r.data.session)||null;
  if(sb)sdReportSetSession(SESSION);

  /* Repaint the moment the session is known, on BOTH branches.
     The old code repainted only when signed OUT. When signed IN it went
     straight to restoreFromServer(), which repaints only if its fetch
     succeeds AND returns a reports array — so after the Google redirect the
     page kept showing the first paint, made while SESSION was still null,
     which offers "Sign in to restore". The person had in fact signed in;
     the screen simply never caught up, and leaving and reopening Settings →
     Reports made it look correct because by then the session was ready
     before the first paint. */
  render();

  if(SESSION){
    /* Strip the WHOLE auth fragment, not just access_token. Removing one
       parameter left refresh_token sitting in the address bar and in history. */
    if(/(?:^#|&)(?:access_token|refresh_token|error)=/.test(location.hash)){
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    }
    restoreFromServer();
  }
}).catch(function(){
  /* Even if auth fails outright, the person must not be left looking at a
     stale paint. Cached records never grant access without a verified session. */
  render();
});
</script>

});
