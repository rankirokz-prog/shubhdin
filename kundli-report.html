<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubh Din — Kundli Report</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada:wght@400;500;600;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#5C1A1B;--gold:#B8860B;--gold2:#D4A843;--paper:#FFFDF6;--soft:#8B5A2B;--saffron:#E8730C;}
*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#EFE9DC;font-family:'Noto Serif Devanagari','Cormorant Garamond','Noto Serif Devanagari',serif;color:var(--ink);}
.screen{max-width:760px;margin:24px auto;background:var(--paper);border:1px solid var(--gold2);border-radius:12px;padding:28px;}
h1.brand{font-size:26px;text-align:center;color:var(--ink);}
.sub{text-align:center;color:var(--soft);font-size:13px;margin:4px 0 18px;}
label{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px;}
input,select,button{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--gold2);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
button{background:linear-gradient(135deg,#8B2B33,#5C1A1B);color:#FFE8C8;border:none;cursor:pointer;margin-top:16px;font-size:16px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.confirm{background:#FFF6E3;border:1px dashed var(--gold);border-radius:10px;padding:14px;margin-top:16px;display:none;}
.confirm b{color:#8B2B33;}
.langToggle{display:flex;gap:8px;margin-top:10px;}
.langToggle button{margin:0;background:#fff;color:var(--ink);border:1px solid var(--gold2);}
.langToggle button.on{background:var(--ink);color:#FFE8C8;}
/* ---------- REPORT ---------- */
#report{display:none;}
.page{max-width:794px;margin:16px auto;background:var(--paper);padding:48px 52px;box-shadow:0 2px 14px rgba(92,26,27,0.12);position:relative;min-height:1000px;}
.page::before{content:"";position:absolute;inset:14px;border:1.5px solid var(--gold2);border-radius:4px;pointer-events:none;}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.om{font-size:54px;color:var(--gold);}
.cover h1{font-size:38px;margin:12px 0 4px;}
.cover .name{font-size:30px;color:#8B2B33;margin:26px 0 6px;font-weight:700;}
.cover .bd{font-size:16px;color:var(--soft);}
.tagfree{margin-top:34px;font-size:14px;color:var(--gold);border-top:1px solid var(--gold2);border-bottom:1px solid var(--gold2);padding:8px 18px;}
h2.sec{font-size:22px;color:var(--saffron);border-bottom:2px solid var(--gold2);padding-bottom:6px;margin:6px 0 16px;}
.dyk{background:#FFF9EE;border:1px solid var(--gold2);border-left:5px solid var(--saffron);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px;line-height:1.7;}
.dyk b{color:var(--saffron);}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 18px;}
th,td{border:1px solid #E4D3AE;padding:6px 9px;text-align:left;}
th{background:#F8EFD8;color:#5C1A1B;font-weight:600;}
tr:nth-child(even) td{background:#FDF8EC;}
.prose{font-size:15.5px;line-height:1.85;text-align:justify;margin-bottom:14px;}
.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.idcard{background:#FFF6E3;border:1px solid var(--gold2);border-radius:10px;padding:12px 14px;}
.idcard .t{font-size:12px;color:var(--soft);}
.idcard .v{font-size:18px;color:#8B2B33;font-weight:700;margin-top:2px;}
.chartwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:10px 0 18px;}
.chartbox{text-align:center;}
.chartbox .cap{font-size:13px;color:var(--soft);margin-top:6px;}
.yog{background:#FDF8EC;border-left:4px solid var(--gold);padding:10px 14px;margin-bottom:10px;font-size:15px;line-height:1.7;}
.dos{background:#FFF3F0;border-left:4px solid #B8434A;padding:10px 14px;margin-bottom:10px;font-size:15px;line-height:1.7;}
.dos.ok{background:#F2F8EF;border-left-color:#5A8B2B;}
.rem{display:grid;grid-template-columns:110px 1fr;gap:10px;border:1px solid #E4D3AE;border-radius:8px;padding:10px 12px;margin-bottom:9px;font-size:14px;align-items:center;}
.rem .m{color:#8B2B33;font-weight:700;}
.foot{font-size:12.5px;color:var(--soft);border-top:1px solid var(--gold2);padding-top:10px;margin-top:22px;line-height:1.7;}
.savhot{background:#EAF3E2 !important;font-weight:700;}
.savcold{background:#F9E9E7 !important;}
.antar{font-size:12px;color:var(--soft);}
.printbar{max-width:794px;margin:10px auto;text-align:center;}
.printbar button{width:auto;padding:10px 28px;}
@media print{
  body{background:#fff;}
  .screen,.printbar{display:none !important;}
  #report{display:block !important;}
  .page{box-shadow:none;margin:0;page-break-after:always;min-height:auto;padding:34px 40px;}
  .page:last-child{page-break-after:auto;}
}
@page{size:A4;margin:10mm;}

/* devanagari-print-safety: letter-spacing splits matras/conjuncts (दि ल). Never apply to Indic text. */
body,.page,.prose,.idcard,.yog,td,th,h1,h2,div,span{letter-spacing:normal;}
.stars,.scorepill{letter-spacing:2px;}
@media print{*{-webkit-font-feature-settings:"liga" 1,"kern" 1;font-feature-settings:"liga" 1,"kern" 1;}}

/* ── DEVANAGARI SHAPING SAFETY ──────────────────────────────────────────────
   A Latin-first font stack (e.g. 'Cormorant Garamond' first) forces the browser
   into PER-CHARACTER font fallback for Hindi. Shaping a syllable cluster across
   two font runs splits matras/conjuncts:  करियर → "करि यर",  बातचीत → "बा तची त".
   Fix: when the report renders in Hindi, use ONE complete Devanagari font for
   everything, and disable anything that can insert space inside a cluster. */
#report.lang-hi, #report.lang-hi *{
  font-family:'Noto Serif Devanagari','Nirmala UI','Mangal','Kokila',serif !important;
  letter-spacing:normal !important;
  word-spacing:normal !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-synthesis:none;               /* faux-bold can break conjunct shaping */
  text-rendering:auto;
}
#report.lang-hi .prose{text-align:left;}   /* justify stretches Indic awkwardly */
@media print{
  #report.lang-hi, #report.lang-hi *{
    font-family:'Noto Serif Devanagari','Nirmala UI','Mangal',serif !important;
    letter-spacing:normal !important;
  }
}

/* Telugu: same single-font shaping law as Devanagari (§10.2 / §T6) */
#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-te .prose{text-align:left;}
@media print{#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;letter-spacing:normal !important;}}

/* Indic print hardening: some print engines duplicate glyph clusters when
   ligature/kerning features are re-resolved. Lock them and disable synthesis. */
@media print{
  #report.lang-hi, #report.lang-hi *, #report.lang-te, #report.lang-te *{
    text-rendering:auto !important;
    font-variant-ligatures:normal !important;
    font-feature-settings:normal !important;
    font-synthesis:none !important;
    -webkit-font-smoothing:antialiased;
  }
}

/* Kannada: same single-font shaping law as Devanagari/Telugu (§10.2 / §K6) */
#report.lang-kn, #report.lang-kn *{
  font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-kn .prose{text-align:left;}
@media print{
  #report.lang-kn, #report.lang-kn *{
    font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}
</style>
</head>

<div class="screen" id="inputScreen">
  <h1 class="brand">🕉️ शुभ दिन — Kundli Report</h1>
  <div class="sub">Free · Drik-Ganita Accurate · No gemstone selling, ever</div>
  <div class="row">
    <div><label>Name / नाम</label><input id="pname" type="text" value="" placeholder="Full name"></div>

  </div>
  <div class="row">

  </div>
  <label>Birth Place (label only) / जन्म स्थान</label><input id="bplace" type="text" value="Narasapur, AP">

  <button onclick="confirmStep()">Check Birth Details → जाँचें</button>
  <div class="confirm" id="confirmBox">
    <div id="confirmText" style="font-size:15px;line-height:1.9;"></div>
    <div class="row">
      <button style="background:#5A8B2B;" onclick="generate()">✓ Correct — Generate Report</button>
      <button style="background:#B8434A;" onclick="document.getElementById('confirmBox').style.display='none'">✗ Fix details</button>
    </div>
  </div>
</div>

<div class="printbar" id="printbar" style="display:none;"><button onclick="sdPrint()">🖨️ Print / Save as PDF</button></div>
<div id="report"></div>

U.love={"loveChart":{"en":"YOUR LOVE CHART","hi":"आपकी प्रेम कुंडली","te":"మీ ప్రేమ జాతకం","kn":"ನಿಮ್ಮ ಪ್ರೀತಿಯ ಜಾತಕ"},"heartUpClose":{"en":"Your Heart, Up Close","hi":"आपका दिल, क़रीब से","te":"మీ మనసు — దగ్గరగా","kn":"ನಿಮ್ಮ ಮನಸ್ಸು — ಹತ್ತಿರದಿಂದ"},"dnaSignature":{"en":"Your relationship personality, derived from your birth chart.","hi":"आपका प्रेम व्यक्तित्व — आपकी जन्म कुंडली से लिया गया।","te":"మీ జన్మ జాతకాన్ని ఆధారంగా చేసుకుని రూపొందించిన మీ ప్రేమ వ్యక్తిత్వం.","kn":"ನಿಮ್ಮ ಜನ್ಮ ಜಾತಕದ ಆಧಾರದ ಮೇಲೆ ರೂಪಿಸಿದ ನಿಮ್ಮ ಪ್ರೀತಿಯ ವ್ಯಕ್ತಿತ್ವ."},"revealCheck":{"en":"If correct, reveal your love story (check AM/PM)","hi":"सही हो तो प्रेम कहानी देखें (AM/PM जाँचें)","te":"సరిగ్గా ఉంటే మీ ప్రేమ కథ చూడండి (AM/PM చూడండి)","kn":"ಸರಿಯಾಗಿದ್ದರೆ ನಿಮ್ಮ ಪ್ರೀತಿಯ ಕಥೆ ನೋಡಿ (AM/PM ಪರಿಶೀಲಿಸಿ)"},"correctReveal":{"en":"✓ Correct — Reveal","hi":"✓ सही है — दिखाएँ","te":"✓ సరైనది — చూపించండి","kn":"✓ ಸರಿ — ತೋರಿಸಿ"},"moonRestsPre":{"en":"Your Moon rests in ","hi":"आपका चंद्रमा ","te":"మీ చంద్రుడు ","kn":"ನಿಮ್ಮ ಚಂದ್ರ "},"moonRestsPost":{"en":" — the deep language of your heart. While your outward love expression is ","hi":"में है — यही आपके दिल की गहरी भाषा है। आपके प्यार जताने का तरीक़ा ","te":"లో ఉన్నారు — ఇదే మీ మనసు లోతైన భాష. మీరు ప్రేమను బయటికి చూపించే తీరు ","kn":"ದಲ್ಲಿದ್ದಾರೆ — ಇದೇ ನಿಮ್ಮ ಮನಸ್ಸಿನ ಆಳವಾದ ಭಾಷೆ. ನೀವು ಪ್ರೀತಿಯನ್ನು ಹೊರಗೆ ತೋರಿಸುವ ರೀತಿ "},"moonMid":{"en":" in nature, your inner heart feels in a ","hi":"स्वभाव का है, जबकि आपका मन ","te":"స్వభావానికి చెందినది, కానీ మీ మనసు లోపల ","kn":" ಸ್ವಭಾವದ್ದು, ಆದರೆ ನಿಮ್ಮ ಒಳಮನಸ್ಸು "},"moonEnd":{"en":" way. The meeting of these two gives your love both depth and colour.","hi":"स्वभाव से महसूस करता है। इन दोनों का मेल आपके प्यार को गहराई भी देता है और रंग भी।","te":" స్వభావంతో అనుభవిస్తుంది. ఈ రెండింటి కలయికే మీ ప్రేమకు లోతునూ, అందాన్నీ ఇస్తుంది.","kn":" ಸ್ವಭಾವದಿಂದ ಅನುಭವಿಸುತ್ತದೆ. ಈ ಎರಡರ ಸಂಗಮವೇ ನಿಮ್ಮ ಪ್ರೀತಿಗೆ ಆಳವನ್ನೂ ಬಣ್ಣವನ್ನೂ ಕೊಡುತ್ತದೆ."},"venusStrong":{"en":"Your Venus is especially strong — love, attraction and beauty flow naturally through your life.","hi":"आपका शुक्र बहुत मज़बूत है — प्यार, आकर्षण और सुंदरता आपकी ज़िंदगी में सहज बहते हैं।","te":"మీ జాతకంలో శుక్రుడు బలంగా ఉన్నాడు — ప్రేమ, ఆకర్షణ, అందం మీ జీవితంలో సహజంగా ప్రవహిస్తాయి.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಬಲವಾಗಿದ್ದಾರೆ — ಪ್ರೀತಿ, ಆಕರ್ಷಣೆ, ಸೌಂದರ್ಯ ನಿಮ್ಮ ಬದುಕಿನಲ್ಲಿ ಸಹಜವಾಗಿ ಹರಿಯುತ್ತವೆ."},"venusWeak":{"en":"Your Venus rests in a tender placement — offering white or pink flowers on Fridays and cultivating beauty strengthens it.","hi":"आपका शुक्र थोड़ी कोमल स्थिति में है — शुक्रवार को सफ़ेद या गुलाबी फूल चढ़ाना और सुंदरता को अपनाना इसे मज़बूत करता है।","te":"మీ జాతకంలో శుక్రుడు కొంచెం సున్నితమైన స్థితిలో ఉన్నాడు — శుక్రవారం తెలుపు లేదా గులాబీ పూలు సమర్పించడం, అందాన్ని ఆదరించడం దీన్ని బలపరుస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸ್ವಲ್ಪ ಸೂಕ್ಷ್ಮ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ — ಶುಕ್ರವಾರ ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸುವುದು, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸುವುದು ಅದನ್ನು ಬಲಪಡಿಸುತ್ತದೆ."},"venusNeutral":{"en":"Your Venus holds a balanced placement, giving love a steady foundation.","hi":"आपका शुक्र संतुलित स्थिति में है, जो प्यार को मज़बूत नींव देता है।","te":"మీ జాతకంలో శుక్రుడు సమతుల్య స్థితిలో ఉన్నాడు, ఇది ప్రేమకు స్థిరమైన పునాది ఇస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸಮತೋಲಿತ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ, ಇದು ಪ್ರೀತಿಗೆ ಸ್ಥಿರ ಅಡಿಪಾಯ ಕೊಡುತ್ತದೆ."},"venusRemedyIntro":{"en":"Venus is the planet of love, beauty and sweetness. Honouring it brings tenderness to your relationships:","hi":"शुक्र प्यार, सुंदरता और मिठास का ग्रह है। इसे प्रसन्न रखना रिश्तों में मिठास लाता है:","te":"శుక్రుడు ప్రేమ, అందం, మాధుర్యానికి అధిపతి. ఆయనను ఆరాధించడం బంధాల్లో మాధుర్యాన్ని తెస్తుంది:","kn":"ಶುಕ್ರ ಪ್ರೀತಿ, ಸೌಂದರ್ಯ ಮತ್ತು ಮಾಧುರ್ಯದ ಅಧಿಪತಿ. ಅವರನ್ನು ಆರಾಧಿಸುವುದು ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ತರುತ್ತದೆ:"},"closingQuote":{"en":"\"The stars incline; they do not compel. Your open heart writes the truest love story of all.\"","hi":"\"सितारे राह दिखाते हैं, मजबूर नहीं करते। सबसे सच्ची प्रेम कहानी आपका खुला दिल ही लिखता है।\"","te":"\"గ్రహాలు దారి చూపిస్తాయి, బలవంతం చేయవు. అత్యంత నిజమైన ప్రేమ కథను రాసేది మీ తెరిచిన మనసే.\"","kn":"\"ಗ್ರಹಗಳು ದಾರಿ ತೋರಿಸುತ್ತವೆ, ಒತ್ತಾಯ ಮಾಡುವುದಿಲ್ಲ. ಅತ್ಯಂತ ನಿಜವಾದ ಪ್ರೀತಿಯ ಕಥೆಯನ್ನು ಬರೆಯುವುದು ನಿಮ್ಮ ತೆರೆದ ಮನಸ್ಸೇ.\""}};

U.remedy={"sun":{"te":"ఆదివారం సూర్యుడికి నమస్కరించండి, ఉదయపు ఎండలో కొద్దిసేపు నిలబడండి. ఆత్మవిశ్వాసం, గౌరవం పెరుగుతాయి."},"moon":{"te":"సోమవారం శివుడిని ఆరాధించండి, తెల్లని వస్తువులు దానం చేయండి. మనసుకు ప్రశాంతత కలుగుతుంది."},"mars":{"te":"మంగళవారం హనుమంతుడిని ఆరాధించండి, ఓపికను అలవరచుకోండి. ధైర్యం సరైన దిశలో పని చేస్తుంది."},"mercury":{"te":"బుధవారం విష్ణువును స్మరించండి, పచ్చని వస్తువులు దానం చేయండి. మాటలో, వ్యవహారంలో స్పష్టత వస్తుంది."},"jupiter":{"te":"గురువారం గురువును ఆరాధించండి, పసుపు పచ్చని వస్తువులు దానం చేయండి, పెద్దలను గౌరవించండి. జ్ఞానం, అదృష్టం పెరుగుతాయి."},"venus":{"te":"శుక్రవారం లక్ష్మీదేవిని ఆరాధించండి, తెలుపు లేదా గులాబీ పూలు సమర్పించండి, అందాన్ని ఆదరించండి, ఉదారంగా ఇవ్వండి. ప్రేమలో, బంధాల్లో మాధుర్యం పెరుగుతుంది."},"saturn":{"te":"శనివారం శనిదేవుడిని ఆరాధించండి, నల్ల నువ్వులు దానం చేయండి, పేదలకు సాయం చేయండి. ఓపిక ఫలిస్తుంది."},"rahu":{"te":"దుర్గాదేవిని ఆరాధించండి, శనివారం దానం చేయండి, నిజాయితీగా ఉండండి. అనవసర గందరగోళం తగ్గుతుంది."},"ketu":{"te":"గణపతిని ఆరాధించండి, ధ్యానం అలవరచుకోండి, సాధువులకు సేవ చేయండి. మనసు స్థిరపడుతుంది."}};

U.manglik={"none":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం లేదు — ఈ సంబంధానికి కుజుడి వల్ల ఎలాంటి అడ్డంకీ లేదు.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇಲ್ಲ — ಈ ಸಂಬಂಧಕ್ಕೆ ಕುಜನಿಂದ ಯಾವ ಅಡ್ಡಿಯೂ ಇಲ್ಲ."},"neutralized":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం ఉంది — శాస్త్ర నియమం ప్రకారం దోషం పరస్పరం తొలగిపోతుంది.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ — ಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ದೋಷ ಪರಸ್ಪರ ನಿವಾರಣೆಯಾಗುತ್ತದೆ."},"softened":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, కానీ కింద చెప్పిన శాస్త్ర పరిహార కారణాల వల్ల అది తగ్గింది; సంప్రదాయ పరిహారాలతో ఈ సంబంధం ముందుకు సాగవచ్చు.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ಆದರೆ ಕೆಳಗೆ ಹೇಳಿದ ಶಾಸ್ತ್ರೀಯ ಪರಿಹಾರ ಕಾರಣಗಳಿಂದ ಅದು ಕಡಿಮೆಯಾಗಿದೆ; ಸಂಪ್ರದಾಯದ ಪರಿಹಾರಗಳೊಂದಿಗೆ ಈ ಸಂಬಂಧ ಮುಂದುವರಿಯಬಹುದು."},"present":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, తొలగించే కారణాలేవీ లేవు — ముందుకు వెళ్లేముందు కుజ శాంతి (హనుమాన్ ఉపాసన, మంగళవార వ్రతం) చేసి పెద్దల సలహా తీసుకోవాలని సంప్రదాయం చెబుతోంది.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ನಿವಾರಣೆಯ ಕಾರಣಗಳಿಲ್ಲ — ಮುಂದುವರಿಯುವ ಮೊದಲು ಕುಜ ಶಾಂತಿ (ಹನುಮಂತನ ಉಪಾಸನೆ, ಮಂಗಳವಾರದ ವ್ರತ) ಮಾಡಿ ಹಿರಿಯರ ಸಲಹೆ ಪಡೆಯಬೇಕೆಂದು ಸಂಪ್ರದಾಯ ಹೇಳುತ್ತದೆ."},"note":{"en":"Note: Mangal Dosha strength reflects Mars’ house position and aggravating or softening factors — which is why we show it as Mild / Moderate / Strong rather than a raw number.","hi":"नोट: मंगल दोष की तीव्रता मंगल की भाव-स्थिति से आँकी जाती है; एकाधिक कारक इसे बढ़ा या घटा सकते हैं।","te":"గమనిక: కుజ దోష తీవ్రత కుజుడి భావ స్థితిని బట్టి, దాన్ని పెంచే లేదా తగ్గించే అంశాలను బట్టి లెక్కిస్తారు — అందుకే దీన్ని ఒక సంఖ్యగా కాకుండా అల్ప / మధ్యమ / తీవ్ర అని చూపిస్తున్నాం.","kn":"ಗಮನಿಸಿ: ಕುಜ ದೋಷದ ತೀವ್ರತೆಯನ್ನು ಕುಜನ ಭಾವ ಸ್ಥಿತಿ ಮತ್ತು ಅದನ್ನು ಹೆಚ್ಚಿಸುವ ಅಥವಾ ಕಡಿಮೆ ಮಾಡುವ ಅಂಶಗಳಿಂದ ಲೆಕ್ಕ ಹಾಕುತ್ತಾರೆ — ಆದ್ದರಿಂದ ಇದನ್ನು ಸಂಖ್ಯೆಯಾಗಿ ಅಲ್ಲದೆ ಅಲ್ಪ / ಮಧ್ಯಮ / ತೀವ್ರ ಎಂದು ತೋರಿಸಿದ್ದೇವೆ."},"Mild":{"en":"Mild","hi":"अल्प","te":"అల్ప","kn":"ಅಲ್ಪ"},"Moderate":{"en":"Moderate","hi":"मध्यम","te":"మధ్యమ","kn":"ಮಧ್ಯಮ"},"Strong":{"en":"Strong","hi":"प्रबल","te":"తీవ్ర","kn":"ತೀವ್ರ"}};
U.career={"barLeadership":{"en":"Leadership Ability","hi":"नेतृत्व क्षमता","te":"నాయకత్వ శక్తి","kn":"ನಾಯಕತ್ವ ಸಾಮರ್ಥ್ಯ"},"barEntre":{"en":"Entrepreneurship","hi":"अपना काम शुरू करने की क्षमता","te":"సొంత వ్యాపార శక్తి","kn":"ಸ್ವಂತ ಉದ್ಯಮ ಶಕ್ತಿ"},"barWealth":{"en":"Wealth Potential","hi":"धन संभावना","te":"సంపద అవకాశం","kn":"ಸಂಪತ್ತಿನ ಸಾಧ್ಯತೆ"},"barGovt":{"en":"Govt Sector Fit","hi":"सरकारी नौकरी में सफलता","te":"ప్రభుత్వ ఉద్యోగంలో విజయం","kn":"ಸರ್ಕಾರಿ ಉದ್ಯೋಗದಲ್ಲಿ ಯಶಸ್ಸು"},"barPriv":{"en":"Private Sector Fit","hi":"प्राइवेट सेक्टर में सफलता","te":"ప్రైవేట్ సెక్టార్‌లో విజయం","kn":"ಪ್ರೈವೇಟ್ ಸೆಕ್ಟರ್‌ನಲ್ಲಿ ಯಶಸ್ಸು"},"confirmGen":{"en":"If correct, generate (check AM/PM)","hi":"सही हो तो रिपोर्ट बनाएँ (AM/PM जाँचें)","te":"సరిగ్గా ఉంటే రిపోర్ట్ తయారు చేయండి (AM/PM చూడండి)","kn":"ಸರಿಯಾಗಿದ್ದರೆ ವರದಿ ತಯಾರಿಸಿ (AM/PM ಪರಿಶೀಲಿಸಿ)"},"primarySig":{"en":"PRIMARY CAREER SIGNATURE","hi":"आपकी करियर पहचान","te":"మీ కెరీర్ స్వభావం","kn":"ನಿಮ್ಮ ಕೆರಿಯರ್ ಸ್ವಭಾವ"},"topFields":{"en":"TOP FIELDS","hi":"सबसे अच्छे क्षेत्र","te":"ఉత్తమ రంగాలు","kn":"ಅತ್ಯುತ್ತಮ ಕ್ಷೇತ್ರಗಳು"},"keyIndicators":{"en":"KEY INDICATORS","hi":"मुख्य संकेत","te":"ముఖ్య సూచికలు","kn":"ಮುಖ್ಯ ಸೂಚಕಗಳು"},"leadership":{"en":"Leadership","hi":"नेतृत्व","te":"నాయకత్వం","kn":"ನಾಯಕತ್ವ"},"entrepreneurship":{"en":"Entrepreneurship","hi":"अपना काम","te":"సొంత వ్యాపారం","kn":"ಸ್ವಂತ ಉದ್ಯಮ"},"wealth":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು"},"recommendation":{"en":"RECOMMENDATION","hi":"सलाह","te":"సలహా","kn":"ಸಲಹೆ"},"leadStrong":{"en":"Your leadership potential is strong — people accept your guidance naturally. Management, team-lead or founder roles suit you well.","hi":"आपमें स्वाभाविक नेतृत्व-क्षमता प्रबल है — लोग आपका मार्गदर्शन सहज स्वीकार करते हैं। प्रबंधन, टीम-नेतृत्व या संस्थापक भूमिकाएँ आपके अनुकूल हैं।","te":"మీలో సహజమైన నాయకత్వ శక్తి బలంగా ఉంది — మీ మార్గదర్శనాన్ని జనం సులభంగా అంగీకరిస్తారు. మేనేజ్‌మెంట్, టీమ్ లీడ్ లేదా వ్యవస్థాపక పాత్రలు మీకు బాగా సరిపోతాయి.","kn":"ನಿಮ್ಮಲ್ಲಿ ಸಹಜ ನಾಯಕತ್ವ ಶಕ್ತಿ ಬಲವಾಗಿದೆ — ನಿಮ್ಮ ಮಾರ್ಗದರ್ಶನವನ್ನು ಜನ ಸಹಜವಾಗಿ ಒಪ್ಪುತ್ತಾರೆ. ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್, ಟೀಮ್ ಲೀಡ್ ಅಥವಾ ಸಂಸ್ಥಾಪಕ ಪಾತ್ರಗಳು ನಿಮಗೆ ಚೆನ್ನಾಗಿ ಹೊಂದುತ್ತವೆ."},"leadMid":{"en":"You have solid leadership ability that grows with experience. Starting with a small team and building toward larger responsibility suits you.","hi":"आपमें अच्छी नेतृत्व-क्षमता है जो अनुभव के साथ निखरती है। छोटी टीम से आरंभ कर बड़ी ज़िम्मेदारी की ओर बढ़ना उपयुक्त रहेगा।","te":"మీలో మంచి నాయకత్వ శక్తి ఉంది, అది అనుభవంతో మెరుగవుతుంది. చిన్న టీమ్‌తో మొదలుపెట్టి పెద్ద బాధ్యతల వైపు వెళ్లడం మీకు సరిపోతుంది.","kn":"ನಿಮ್ಮಲ್ಲಿ ಒಳ್ಳೆಯ ನಾಯಕತ್ವ ಶಕ್ತಿ ಇದೆ, ಅದು ಅನುಭವದೊಂದಿಗೆ ಬೆಳೆಯುತ್ತದೆ. ಸಣ್ಣ ತಂಡದಿಂದ ಆರಂಭಿಸಿ ದೊಡ್ಡ ಜವಾಬ್ದಾರಿಯತ್ತ ಸಾಗುವುದು ನಿಮಗೆ ಸರಿ."},"leadExpert":{"en":"Your strength lies more in expertise than command — leading through deep skill is your natural path. Leadership can be learned, but you shine most as a specialist.","hi":"आपकी शक्ति नेतृत्व से अधिक विशेषज्ञता में है — गहरी दक्षता से प्रभाव बनाना आपका स्वाभाविक मार्ग है। नेतृत्व सीखा जा सकता है, पर विशेषज्ञ के रूप में आप अधिक चमकते हैं।","te":"మీ బలం ఆజ్ఞాపించడంలో కాదు, నైపుణ్యంలో ఉంది — లోతైన నైపుణ్యంతో ప్రభావం చూపడమే మీ సహజ మార్గం. నాయకత్వం నేర్చుకోవచ్చు, కానీ నిపుణుడిగానే మీరు ఎక్కువ మెరుస్తారు.","kn":"ನಿಮ್ಮ ಬಲ ಆಜ್ಞೆ ಮಾಡುವುದರಲ್ಲಿ ಅಲ್ಲ, ಪರಿಣತಿಯಲ್ಲಿ — ಆಳವಾದ ಕೌಶಲದಿಂದ ಪ್ರಭಾವ ಬೀರುವುದೇ ನಿಮ್ಮ ಸಹಜ ದಾರಿ. ನಾಯಕತ್ವ ಕಲಿಯಬಹುದು, ಆದರೆ ಪರಿಣಿತರಾಗಿಯೇ ನೀವು ಹೆಚ್ಚು ಮಿಂಚುತ್ತೀರಿ."},"whatToDo":{"en":"What to do in each period — direct guidance on putting astrology to use:","hi":"हर अवधि में क्या करें — ज्योतिष को काम में लाने की सीधी सलाह:","te":"ప్రతి కాలంలో ఏమి చేయాలి — జ్యోతిష్యాన్ని ఆచరణలో పెట్టే స్పష్టమైన సూచనలు:","kn":"ಪ್ರತಿ ಕಾಲದಲ್ಲಿ ಏನು ಮಾಡಬೇಕು — ಜ್ಯೋತಿಷ್ಯವನ್ನು ಆಚರಣೆಗೆ ತರುವ ಸ್ಪಷ್ಟ ಸಲಹೆಗಳು:"},"avoidFields":{"en":"These fields rest mainly on the same less-supported planet(s) in your chart, which is why they group together.","hi":"ये क्षेत्र मुख्यतः उन्हीं ग्रहों पर आधारित हैं जो आपकी कुंडली में कम बली हैं — इसलिए एक साथ समूहित हैं।","te":"ఈ రంగాలు మీ జాతకంలో తక్కువ బలం ఉన్న గ్రహాల మీదే ఆధారపడతాయి — అందుకే ఇవి U.forecast={"subtitle":{"en":"Your Next 10 Years — dasha, transits and what to do","hi":"आपके अगले 10 वर्ष — दशा, गोचर और क्या करें","te":"మీ రాబోయే 10 సంవత్సరాలు — దశ, గోచారం, ఏమి చేయాలి","kn":"ನಿಮ್ಮ ಮುಂದಿನ 10 ವರ್ಷಗಳು — ದಶಾ, ಗೋಚಾರ, ಏನು ಮಾಡಬೇಕು"},"titleCover":{"en":"Your Life Roadmap","hi":"जीवन रोडमैप","te":"మీ జీవిత రోడ్‌మ్యాప్","kn":"ನಿಮ್ಮ ಬದುಕಿನ ರೋಡ್‌ಮ್ಯಾಪ್"},"moonSign":{"en":"Moon sign","hi":"चंद्र राशि","te":"చంద్ర రాశి","kn":"ಚಂದ್ರ ರಾಶಿ"},"confirmYears":{"en":"If correct, generate 10 years from ","hi":"सही हो तो यहाँ से 10 वर्ष बनाएँ ","te":"సరిగ్గా ఉంటే ఇక్కడి నుంచి 10 సంవత్సరాలు తయారు చేయండి ","kn":"ಸರಿಯಾಗಿದ್ದರೆ ಇಲ್ಲಿಂದ 10 ವರ್ಷ ತಯಾರಿಸಿ "},"stratBest":{"en":"Ride this year’s momentum fully — make big decisions, investments and initiatives now. The window of opportunity is open.","hi":"इस वर्ष की गति का पूरा लाभ लें — बड़े निर्णय, निवेश और पहल अभी करें। अवसर की खिड़की खुली है।","te":"ఈ సంవత్సరపు వేగాన్ని పూర్తిగా వాడుకోండి — పెద్ద నిర్ణయాలు, పెట్టుబడులు, కొత్త ప్రయత్నాలు ఇప్పుడే చేయండి. అవకాశాల ద్వారం తెరిచి ఉంది.","kn":"ಈ ವರ್ಷದ ವೇಗವನ್ನು ಪೂರ್ತಿ ಬಳಸಿಕೊಳ್ಳಿ — ದೊಡ್ಡ ನಿರ್ಧಾರಗಳು, ಹೂಡಿಕೆಗಳು, ಹೊಸ ಪ್ರಯತ್ನಗಳು ಈಗಲೇ ಮಾಡಿ. ಅವಕಾಶದ ಬಾಗಿಲು ತೆರೆದಿದೆ."},"stratCaution":{"en":"Protect your gains, increase savings, prioritize health, and avoid big risks. This is a year to cross with patience.","hi":"लाभ सुरक्षित रखें, बचत बढ़ाएँ, स्वास्थ्य को प्राथमिकता दें और बड़े जोखिम टालें। यह वर्ष धैर्य से पार करने का है।","te":"మీ లాభాలను కాపాడుకోండి, పొదుపు పెంచండి, ఆరోగ్యానికి ప్రాధాన్యం ఇవ్వండి, పెద్ద రిస్క్‌లు వద్దు. ఈ సంవత్సరాన్ని ఓపికతో దాటాల్సి ఉంది.","kn":"ನಿಮ್ಮ ಲಾಭಗಳನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಿ, ಉಳಿತಾಯ ಹೆಚ್ಚಿಸಿ, ಆರೋಗ್ಯಕ್ಕೆ ಆದ್ಯತೆ ಕೊಡಿ, ದೊಡ್ಡ ರಿಸ್ಕ್ ಬೇಡ. ಈ ವರ್ಷವನ್ನು ತಾಳ್ಮೆಯಿಂದ ದಾಟಬೇಕು."},"age":{"en":"Age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು"},"ageLower":{"en":"age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು"},"alsoJoin":{"en":"; also ","hi":"; साथ ही ","te":"; అలాగే ","kn":"; ಜೊತೆಗೆ "},"yearByYear":{"en":"Year by Year","hi":"वर्ष-दर-वर्ष","te":"సంవత్సరం వారీగా","kn":"ವರ್ಷವಾರು"},"yearByYearContd":{"en":"Year by Year (contd.)","hi":"वर्ष-दर-वर्ष (क्रमशः)","te":"సంవత్సరం వారీగా (కొనసాగింపు)","kn":"ವರ್ಷವಾರು (ಮುಂದುವರಿಕೆ)"},"closing":{"en":"Closing","hi":"समापन","te":"ముగింపు","kn":"ಮುಕ್ತಾಯ"},"closingText":{"en":"This decade blends auspicious and testing years — as every life does. Move boldly in the bright years, lean on patience and remedies in the testing ones. Astrology shows the road; the walking is yours.","hi":"यह दशक शुभ और परीक्षा दोनों वर्षों का मिश्रण है — जैसा हर जीवन होता है। शुभ वर्षों में साहस से आगे बढ़ें, परीक्षा के वर्षों में धैर्य और उपायों का सहारा लें। ज्योतिष मार्ग दिखाता है; चलना आपको है।","te":"ఈ దశాబ్దంలో శుభ సంవత్సరాలూ, పరీక్షించే సంవత్సరాలూ రెండూ ఉన్నాయి — ప్రతి జీవితంలో ఉన్నట్టే. మంచి సంవత్సరాల్లో ధైర్యంగా ముందుకు వెళ్లండి, పరీక్షా కాలంలో ఓపిక, పరిహారాల ఆసరా తీసుకోండి. జ్యోతిష్యం దారి చూపిస్తుంది; నడవాల్సింది మీరే.","kn":"ಈ ದಶಕದಲ್ಲಿ ಶುಭ ವರ್ಷಗಳೂ ಪರೀಕ್ಷಿಸುವ ವರ್ಷಗಳೂ ಎರಡೂ ಇವೆ — ಪ್ರತಿ ಬದುಕಿನಲ್ಲೂ ಇರುವಂತೆ. ಒಳ್ಳೆಯ ವರ್ಷಗಳಲ್ಲಿ ಧೈರ್ಯದಿಂದ ಮುಂದೆ ಹೋಗಿ, ಪರೀಕ್ಷೆಯ ಕಾಲದಲ್ಲಿ ತಾಳ್ಮೆ ಮತ್ತು ಪರಿಹಾರಗಳ ಆಸರೆ ಪಡೆಯಿರಿ. ಜ್ಯೋತಿಷ್ಯ ದಾರಿ ತೋರಿಸುತ್ತದೆ; ನಡೆಯಬೇಕಾದವರು ನೀವೇ."}};

U.kundli={"k001":{"en":"CHAPTER","hi":"अध्याय","te":"అధ్యాయం","kn":"ಅಧ್ಯಾಯ"},"k002":{"en":"Your Spiritual Snapshot","hi":"आपका आध्यात्मिक दर्पण","te":"మీ ఆధ్యాత్మిక చిత్రం","kn":"ನಿಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಚಿತ್ರ"},"k003":{"en":"The essence of your chart at a glance — every rating below is derived from your actual planetary dignities, house strengths (Ashtakavarga) and yogas. Nothing is invented.","hi":"आपकी कुंडली से गणना से निकाला गया सार — हर अंक ग्रह-गरिमा, भाव-बल और योगों से व्युत्पन्न है।","te":"మీ జాతకం సారాంశం ఒక్క చూపులో — కింద ఇచ్చిన ప్రతి రేటింగూ మీ అసలు గ్రహ స్థితులు, భావ బలాలు (అష్టకవర్గం), యోగాల ఆధారంగా వచ్చినది. ఏదీ ఊహించి రాసినది కాదు.","kn":"ನಿಮ್ಮ ಜಾತಕದ ಸಾರಾಂಶ ಒಂದೇ ನೋಟದಲ್ಲಿ — ಕೆಳಗಿನ ಪ್ರತಿ ರೇಟಿಂಗ್ ಕೂಡ ನಿಮ್ಮ ನಿಜವಾದ ಗ್ರಹ ಸ್ಥಿತಿಗಳು, ಭಾವ ಬಲಗಳು (ಅಷ್ಟಕವರ್ಗ), ಯೋಗಗಳ ಆಧಾರದ ಮೇಲೆ ಬಂದಿದೆ. ಯಾವುದೂ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ."},"k004":{"en":"YOUR STRONGEST QUALITIES","hi":"आपकी प्रबल शक्तियाँ","te":"మీ బలమైన లక్షణాలు","kn":"ನಿಮ್ಮ ಪ್ರಬಲ ಗುಣಗಳು"},"k005":{"en":"CURRENT LIFE PHASE","hi":"वर्तमान जीवन-चरण","te":"ప్రస్తుత జీవిత దశ","kn":"ಪ್ರಸ್ತುತ ಜೀವನ ಹಂತ"},"k006":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ"},"k007":{"en":"Antar","hi":"अंतर","te":"అంతర్దశ","kn":"ಅಂತರ್ದಶಾ"},"k008":{"en":"OVERALL LIFE ENERGY","hi":"समग्र जीवन-ऊर्जा","te":"మొత్తం జీవన శక్తి","kn":"ಒಟ್ಟು ಜೀವನ ಶಕ್ತಿ"},"k009":{"en":"Formula: Ashtakavarga strength of your 1st, 9th and 10th houses + auspicious yogas + planetary dignities — every input verifiable in the chapters ahead.","hi":"सूत्र: लग्न-भाग्य-कर्म भावों का अष्टकवर्ग बल + शुभ योग","te":"సూత్రం: మీ 1వ, 9వ, 10వ భావాల అష్టకవర్గ బలం + శుభ యోగాలు + గ్రహ స్థితులు — ప్రతి అంశాన్నీ ముందున్న అధ్యాయాల్లో సరిచూసుకోవచ్చు.","kn":"ಸೂತ್ರ: ನಿಮ್ಮ 1, 9, 10ನೇ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಶುಭ ಯೋಗಗಳು + ಗ್ರಹ ಸ್ಥಿತಿಗಳು — ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು."},"k010":{"en":"Career","hi":"करियर","te":"కెరీర్","kn":"ಕೆರಿಯರ್"},"k011":{"en":"Marriage & Love","hi":"विवाह व संबंध","te":"వివాహం, ప్రేమ","kn":"ಮದುವೆ, ಪ್ರೀತಿ"},"k012":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು"},"k013":{"en":"Health & Vitality","hi":"स्वास्थ्य","te":"ఆరోగ్యం, శక్తి","kn":"ಆರೋಗ್ಯ, ಶಕ್ತಿ"},"k014":{"en":"Learning & Children","hi":"विद्या-संतान","te":"విద్య, సంతానం","kn":"ವಿದ್ಯೆ, ಮಕ್ಕಳು"},"k015":{"en":"Spiritual Growth","hi":"आध्यात्म","te":"ఆధ్యాత్మిక ఎదుగుదల","kn":"ಆಧ್ಯಾತ್ಮಿಕ ಬೆಳವಣಿಗೆ"},"k016":{"en":"Your Life Dashboard","hi":"जीवन डैशबोर्ड","te":"మీ జీవిత డాష్‌బోర్డ్","kn":"ನಿಮ್ಮ ಜೀವನ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್"},"k017":{"en":"Each score = Ashtakavarga strength of the relevant houses + house-lord dignity + karaka planet condition. Every input is verifiable in the tables that follow — no score is invented.","hi":"प्रत्येक अंक = संबंधित भावों का अष्टकवर्ग बल + भावेश गरिमा + कारक ग्रह स्थिति — सभी आंकड़े आगे की सारणियों में सत्यापन-योग्य।","te":"ప్రతి స్కోరు = సంబంధిత భావాల అష్టకవర్గ బలం + భావాధిపతి స్థితి + కారక గ్రహ స్థితి. ప్రతి అంశాన్నీ తర్వాతి పట్టికల్లో సరిచూసుకోవచ్చు — ఏ స్కోరూ ఊహించి రాసినది కాదు.","kn":"ಪ್ರತಿ ಸ್ಕೋರ್ = ಸಂಬಂಧಿತ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಭಾವಾಧಿಪತಿಯ ಸ್ಥಿತಿ + ಕಾರಕ ಗ್ರಹದ ಸ್ಥಿತಿ. ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಕೋಷ್ಟಕಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು — ಯಾವ ಸ್ಕೋರ್ ಕೂಡ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ."},"k018":{"en":"Table of Contents","hi":"विषय-सूची","te":"విషయ సూచిక","kn":"ಪರಿವಿಡಿ"},"k019":{"en":"Graha","hi":"ग्रह","te":"గ్రహం","kn":"ಗ್ರಹ"},"k020":{"en":"Nakshatra","hi":"नक्षत्र","te":"నక్షత్రం","kn":"ನಕ್ಷತ್ರ"},"k021":{"en":"Retro","hi":"वक्री","te":"వక్రం","kn":"ವಕ್ರ"},"k022":{"en":"Combust","hi":"अस्त","te":"అస్తం","kn":"ಅಸ್ತ"},"k023":{"en":"Houses scoring 30+ are your power zones; those below 22 reward conscious effort. (Grand total 337 — the classical checksum.)","hi":"30+ बिंदु वाले भाव जीवन के प्रबल क्षेत्र हैं; 22 से कम वाले भावों में सचेत प्रयास फलदायी होता है। (कुल 337 — शास्त्रीय मानक)","te":"30కి పైగా బిందువులున్న భావాలు మీ బలమైన రంగాలు; 22 కంటే తక్కువ ఉన్నవి శ్రద్ధతో కృషి చేస్తే ఫలిస్తాయి. (మొత్తం 337 — శాస్త్రీయ లెక్క.)","kn":"30ಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಿಂದುಗಳಿರುವ ಭಾವಗಳು ನಿಮ್ಮ ಬಲದ ಕ್ಷೇತ್ರಗಳು; 22ಕ್ಕಿಂತ ಕಡಿಮೆ ಇರುವವು ಶ್ರದ್ಧೆಯಿಂದ ಶ್ರಮಿಸಿದರೆ ಫಲ ಕೊಡುತ್ತವೆ. (ಒಟ್ಟು 337 — ಶಾಸ್ತ್ರೀಯ ಲೆಕ್ಕ.)"},"k024":{"en":"House ","hi":"भाव ","te":"భావం ","kn":"ಭಾವ "},"k025":{"en":"bindus","hi":"बिंदु","te":"బిందువులు","kn":"ಬಿಂದುಗಳು"},"k026":{"en":"House-Strength Reading (Sarvashtakavarga)","hi":"भाव-बल विवेचन (सर्वाष्टकवर्ग)","te":"భావ బల విశ్లేషణ (సర్వాష్టకవర్గం)","kn":"ಭಾವ ಬಲ ವಿಶ್ಲೇಷಣೆ (ಸರ್ವಾಷ್ಟಕವರ್ಗ)"},"k027":{"en":"Retrograde","hi":"वक्री","te":"వక్ర గతి","kn":"ವಕ್ರ ಗತಿ"},"k028":{"en":"Combust","hi":"अस्त","te":"అస్తంగతం","kn":"ಅಸ್ತಂಗತ"},"k029":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ"},"k030":{"en":"Planet Strength Cards","hi":"ग्रह-शक्ति कार्ड","te":"గ్రహ బల కార్డులు","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು"},"k031":{"en":"Star ratings derived from dignity + Ashtakavarga + combustion state.","hi":"तारांकन = गरिमा + अष्टकवर्ग + अस्त/वक्री स्थिति से","te":"స్థితి + అష్టకవర్గం + అస్తంగత స్థితి ఆధారంగా ఇచ్చిన నక్షత్ర రేటింగ్‌లు.","kn":"ಸ್ಥಿತಿ + ಅಷ್ಟಕವರ್ಗ + ಅಸ್ತಂಗತ ಸ್ಥಿತಿಯ ಆಧಾರದ ಮೇಲೆ ನೀಡಿದ ನಕ್ಷತ್ರ ರೇಟಿಂಗ್‌ಗಳು."},"k032":{"en":"Planet Strength Cards (contd.)","hi":"ग्रह-शक्ति कार्ड (क्रमशः)","te":"గ్రహ బల కార్డులు (కొనసాగింపు)","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು (ಮುಂದುವರಿಕೆ)"},"k033":{"en":"no planets","hi":"कोई ग्रह नहीं","te":"గ్రహాలు లేవు","kn":"ಗ್ರಹಗಳಿಲ್ಲ"},"k034":{"en":"Lord","hi":"भावेश","te":"అధిపతి","kn":"ಅಧಿಪತಿ"},"k035":{"en":"house","hi":"भाव","te":"భావం","kn":"ಭಾವ"},"k036":{"en":"Occupants","hi":"स्थित ग्रह","te":"ఉన్న గ్రహాలు","kn":"ಇರುವ ಗ್ರಹಗಳು"},"k037":{"en":"The Twelve Bhavas — Domains of Life","hi":"द्वादश भाव — जीवन के बारह क्षेत्र","te":"పన్నెండు భావాలు — జీవిత రంగాలు","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು — ಜೀವನದ ಕ್ಷೇತ್ರಗಳು"},"k038":{"en":"Twelve Bhavas (contd.)","hi":"द्वादश भाव (क्रमशः)","te":"పన్నెండు భావాలు (కొనసాగింపు)","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು (ಮುಂದುವರಿಕೆ)"},"k039":{"en":"Ancient Note","hi":"प्राचीन संकेत","te":"ప్రాచీన విశేషం","kn":"ಪ್ರಾಚೀನ ವಿಶೇಷ"},"k040":{"en":"The Sarvashtakavarga of every chart always totals exactly 337 bindus — verified in your own tables here; count them yourself!","hi":"अष्टकवर्ग का सर्वयोग सदा 337 बिंदु होता है — यह आपकी रिपोर्ट में भी सत्यापित है, गिनकर देख सकते हैं!","te":"ఏ జాతకంలోనైనా సర్వాష్టకవర్గం మొత్తం సరిగ్గా 337 బిందువులే — మీ పట్టికల్లోనే సరిచూసుకోవచ్చు; మీరే లెక్కించి చూడండి!","kn":"ಯಾವುದೇ ಜಾತಕದಲ್ಲೂ ಸರ್ವಾಷ್ಟಕವರ್ಗದ ಒಟ್ಟು ನಿಖರವಾಗಿ 337 ಬಿಂದುಗಳೇ — ನಿಮ್ಮ ಕೋಷ್ಟಕಗಳಲ್ಲೇ ಪರಿಶೀಲಿಸಬಹುದು; ನೀವೇ ಲೆಕ್ಕ ಹಾಕಿ ನೋಡಿ!"},"k041":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ"},"k042":{"en":"Graha Phala — House Placements","hi":"ग्रह फल — भाव स्थिति","te":"గ్రహ ఫలం — భావ స్థితులు","kn":"ಗ್ರಹ ಫಲ — ಭಾವ ಸ್ಥಿತಿಗಳು"},"k043":{"en":"Graha Phala (contd.)","hi":"ग्रह फल (क्रमशः)","te":"గ్రహ ఫలం (కొనసాగింపు)","kn":"ಗ್ರಹ ಫಲ (ಮುಂದುವರಿಕೆ)"},"k044":{"en":"Did You Know?","hi":"क्या आप जानते हैं?","te":"మీకు తెలుసా?","kn":"ನಿಮಗೆ ಗೊತ್ತೇ?"},"k045":{"en":"In the Parashara tradition, Venus rules the longest mahadasha (20 years) and the Sun the shortest (6 years) — the full cycle spans exactly 120 years.","hi":"पराशर परंपरा में शुक्र की महादशा सबसे लंबी (20 वर्ष) और सूर्य की सबसे छोटी (6 वर्ष) होती है — पूरा चक्र ठीक 120 वर्ष का है।","te":"పరాశర సంప్రదాయంలో శుక్రుడికి అత్యధిక మహాదశ (20 సంవత్సరాలు), సూర్యుడికి అత్యల్పం (6 సంవత్సరాలు) — మొత్తం చక్రం సరిగ్గా 120 సంవత్సరాలు.","kn":"ಪರಾಶರ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಶುಕ್ರನಿಗೆ ಅತಿ ಹೆಚ್ಚು ಮಹಾದಶಾ (20 ವರ್ಷ), ಸೂರ್ಯನಿಗೆ ಅತಿ ಕಡಿಮೆ (6 ವರ್ಷ) — ಒಟ್ಟು ಚಕ್ರ ನಿಖರವಾಗಿ 120 ವರ್ಷ."},"k046":{"en":"Marriage Matching, done properly","hi":"विवाह मिलान गहन विश्लेषण","te":"వివాహ మ్యాచింగ్ — సరైన పద్ధతిలో","kn":"ವಿವಾಹ ಹೊಂದಾಣಿಕೆ — ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ"},"k047":{"en":"Free tools stop at the Guna score. The paid Marriage Report adds classical dosha-CANCELLATION analysis, two-chart Manglik matching and marriage-timing windows — what no free tool checks.","hi":"निःशुल्क गुण-मिलान अंक देता है। सशुल्क विवाह रिपोर्ट दोष-परिहार नियम, दोनों कुंडलियों का मंगल-मिलान और विवाह-समय खिड़कियाँ जोड़ती है — जो कोई निःशुल्क टूल नहीं जाँचता।","te":"ఉచిత సాధనాలు గుణ స్కోరు దగ్గరే ఆగిపోతాయి. చెల్లింపు వివాహ రిపోర్ట్ శాస్త్రీయ దోష-పరిహార విశ్లేషణ, రెండు జాతకాల కుజ దోష పరిశీలన, వివాహ శుభ సమయాలు కూడా ఇస్తుంది — ఏ ఉచిత సాధనమూ చూడని అంశాలు.","kn":"ಉಚಿತ ಸಾಧನಗಳು ಗುಣ ಸ್ಕೋರ್‌ನಲ್ಲೇ ನಿಲ್ಲುತ್ತವೆ. ಪಾವತಿಸಿದ ವಿವಾಹ ವರದಿ ಶಾಸ್ತ್ರೀಯ ದೋಷ-ಪರಿಹಾರ ವಿಶ್ಲೇಷಣೆ, ಎರಡೂ ಜಾತಕಗಳ ಕುಜ ದೋಷ ಪರಿಶೀಲನೆ, ವಿವಾಹಕ್ಕೆ ಶುಭ ಸಮಯಗಳನ್ನೂ ಕೊಡುತ್ತದೆ — ಯಾವ ಉಚಿತ ಸಾಧನವೂ ನೋಡದ ಅಂಶಗಳು."},"k048":{"en":"Classical significance","hi":"शास्त्रीय महत्त्व","te":"శాస్త్రీయ ప్రాముఖ్యత","kn":"ಶಾಸ್ತ್ರೀಯ ಮಹತ್ವ"},"k049":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ"},"k050":{"en":"Kaal Sarpa","hi":"कालसर्प","te":"కాల సర్ప","kn":"ಕಾಲ ಸರ್ಪ"},"k051":{"en":"Sade Sati","hi":"साढ़े साती","te":"సాడే సాతి","kn":"ಸಾಡೇ ಸಾತಿ"},"k052":{"en":"Phase","hi":"चरण","te":"దశ","kn":"ದಶಾ"},"k053":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ"},"k054":{"en":"balance","hi":"शेष","te":"మిగిలిన కాలం","kn":"ಉಳಿದ ಕಾಲ"},"k055":{"en":"Today","hi":"आज","te":"ఈరోజు","kn":"ಇಂದು"},"k056":{"en":"Birth nakshatra","hi":"जन्म नक्षत्र","te":"జన్మ నక్షత్రం","kn":"ಜನ್ಮ ನಕ್ಷತ್ರ"},"k057":{"en":"Period Predictions","hi":"दशा फल","te":"దశా ఫలితాలు","kn":"ದಶಾ ಫಲಗಳು"},"k058":{"en":"Mahadasha and Antardasha, fully dated","hi":"महादशा एवं अंतर्दशा — तिथियों सहित","te":"మహాదశ, అంతర్దశ — పూర్తి తేదీలతో","kn":"ಮಹಾದಶಾ, ಅಂತರ್ದಶಾ — ಪೂರ್ಣ ದಿನಾಂಕಗಳೊಂದಿಗೆ"},"k059":{"en":"Want decision-grade timing?","hi":"निर्णय-स्तर का समय जानना चाहते हैं?","te":"నిర్ణయాలకు సరిపోయే కచ్చితమైన సమయం కావాలా?","kn":"ನಿರ್ಧಾರಗಳಿಗೆ ಸರಿಯಾದ ನಿಖರ ಸಮಯ ಬೇಕೇ?"},"k060":{"en":"This free report shows every dated period with general guidance. The paid 10-Year Deep Prediction weaves your specific house-lords, yogas and transits into each pratyantar — a personal consultant on paper.","hi":"यह निःशुल्क रिपोर्ट हर अवधि तिथियों सहित देती है। सशुल्क 10-वर्षीय गहन फलादेश प्रत्येक प्रत्यंतर में आपके भावेश-योग-गोचर बुनता है।","te":"ఈ ఉచిత రిపోర్ట్ ప్రతి కాలాన్నీ తేదీలతో, సాధారణ సూచనలతో చూపిస్తుంది. చెల్లింపు 10 సంవత్సరాల లోతైన అంచనా మీ భావాధిపతులు, యోగాలు, గోచారాలను ప్రతి ప్రత్యంతర దశలోనూ కలిపి చెబుతుంది — కాగితం మీద ఒక వ్యక్తిగత సలహాదారు.","kn":"ಈ ಉಚಿತ ವರದಿ ಪ್ರತಿ ಕಾಲವನ್ನೂ ದಿನಾಂಕಗಳೊಂದಿಗೆ, ಸಾಮಾನ್ಯ ಸೂಚನೆಗಳೊಂದಿಗೆ ತೋರಿಸುತ್ತದೆ. ಪಾವತಿಸಿದ 10 ವರ್ಷಗಳ ಆಳವಾದ ಅಂದಾಜು ನಿಮ್ಮ ಭಾವಾಧ function southSVG(lagnaR,place,title){
  var W=330,cs=W/4,s='<svg width="'+W+'" height="'+W+'" viewBox="0 0 '+W+' '+W+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect x="1" y="1" width="'+(W-2)+'" height="'+(W-2)+'" fill="#FFFDF6" stroke="#B8860B" stroke-width="2"/>';
  for(var r=0;r<12;r++){
    var p=SOUTH_POS[r],x=(p[1]-1)*cs,y=(p[0]-1)*cs;
    s+='<rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="'+(r===lagnaR?'#F8EFD8':'none')+'" stroke="#D4A843" stroke-width="1"/>';
    if(r===lagnaR)s+='<line x1="'+x+'" y1="'+(y+14)+'" x2="'+(x+14)+'" y2="'+y+'" stroke="#8B2B33" stroke-width="1.5"/>';
    var items=place[r]||[];

      s+='<text x="'+(x+cs/2)+'" y="'+(y+18+i*15)+'" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5C1A1B" font-family="serif">'+items[i]+'</text>';
    }
  }
  s+='<text x="'+(W/2)+'" y="'+(W/2-6)+'" text-anchor="middle" font-size="14" fill="#8B2B33" font-weight="700" font-family="serif">'+title+'</text>';
  s+='<text x="'+(W/2)+'" y="'+(W/2+14)+'" text-anchor="middle" font-size="11" fill="#8B5A2B">'+U('brand.name')+'</text></svg>';

    for(var i=0;i<yearBlocks.length;i+=3){
      pg('<h2 class="sec">'+U('kundli.k097')+(y0+i)+' – '+Math.min(y0+i+2,y0+29)+'</h2>'+yearBlocks.slice(i,i+3).join(''));
    }
  })();
  cover(6,U('kundli.k098'),U('kundli.k099'));
  // ---- REMEDIES + FOOTER ----
  var glossRows=C.glossary.map(function(g4){return '<tr><th style="width:26%">'+term('glossTerm',g4.t)+'</th><td>'+T(g4)+'</td></tr>';});
  for(var gi=0;gi<glossRows.length;gi+=12){
    pg('<h2 class="sec">'+U('kundli.k100')+(glossRows.length>12?' ('+(Math.floor(gi/12)+1)+')':'')+'</h2><table>'+glossRows.slice(gi,gi+12).join('')+'</table>');
  }
  var remKeys=['sun','moon','mars','mercury','jupiter','venus','saturn','rahu','ketu'];
  var remH=remKeys.map(function(k){var r=C.remedy[k];return '<div class="rem"><div><b>'+(U('mantraLabel.'+k)||r.name)+'</b><br><span class="m">'+r.mantra+'</span></div><div>'+((window.SD_UI&&SD_UI.remedy&&SD_UI.remedy[k]&&SD_UI.remedy[k][LANG])||T(r))+'</div></div>';}).join('');
  pg('<h2 class="sec">\uD83D\uDE4F '+T(L.remedies)+'</h2><div class="prose" style="color:#5A8B2B;">'+T(L.remedyNote)+'</div>'+remH
    +'<div class="foot">'+T(L.verify)+'<br><b>'+U('brand.name')+' · shubhdin.app</b> · '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+'</div>');
  document.getElementById('report').innerHTML=H;
  var rep=document.getElementById('report');
  rep.className='lang-'+LANG;
  rep.setAttribute('lang',LANG);
  rep.style.display='block';
  document.getElementById('printbar').style.display='block';
  document.getElementById('inputScreen').style.display='none';
  window.scrollTo(0,0);
}
</script>
