<title>Shubh Din — Kundli Report</title>

<style>
:root{--ink:#5C1A1B;--gold:#B8860B;--gold2:#D4A843;--paper:#FFFDF6;--soft:#8B5A2B;--saffron:#E8730C;}
*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#EFE9DC;font-family:'Noto Serif Devanagari','Cormorant Garamond','Noto Serif Devanagari',serif;color:var(--ink);}
.screen{max-width:760px;margin:24px auto;background:var(--paper);border:1px solid var(--gold2);border-radius:12px;padding:28px;}
h1.brand{font-size:26px;text-align:center;color:var(--ink);}
.sub{text-align:center;color:var(--soft);font-size:13px;margin:4px 0 18px;}
label{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px;}
input,select,button{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--gold2);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
button{background:linear-gradient(135deg,#8B2B33,#5C1A1B);color:#FFE8C8;border:none;cursor:pointer;margin-top:16px;font-size:16px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.confirm{background:#FFF6E3;border:1px dashed var(--gold);border-radius:10px;padding:14px;margin-top:16px;display:none;}
.confirm b{color:#8B2B33;}
.langToggle{display:flex;gap:8px;margin-top:10px;}
.langToggle button{margin:0;background:#fff;color:var(--ink);border:1px solid var(--gold2);}
.langToggle button.on{background:var(--ink);color:#FFE8C8;}
/* ---------- REPORT ---------- */
#report{display:none;}
.page{max-width:794px;margin:16px auto;background:var(--paper);padding:48px 52px;box-shadow:0 2px 14px rgba(92,26,27,0.12);position:relative;min-height:1000px;}
.page::before{content:"";position:absolute;inset:14px;border:1.5px solid var(--gold2);border-radius:4px;pointer-events:none;}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.om{font-size:54px;color:var(--gold);}
.cover h1{font-size:38px;margin:12px 0 4px;}
.cover .name{font-size:30px;color:#8B2B33;margin:26px 0 6px;font-weight:700;}
.cover .bd{font-size:16px;color:var(--soft);}
.tagfree{margin-top:34px;font-size:14px;color:var(--gold);border-top:1px solid var(--gold2);border-bottom:1px solid var(--gold2);padding:8px 18px;}
h2.sec{font-size:22px;color:var(--saffron);border-bottom:2px solid var(--gold2);padding-bottom:6px;margin:6px 0 22px;}
.prhead{display:block;margin-bottom:5px;}
.dyk{background:#FFF9EE;border:1px solid var(--gold2);border-left:5px solid var(--saffron);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px;line-height:1.7;}
.dyk b{color:var(--saffron);}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 18px;}
th,td{border:1px solid #E4D3AE;padding:6px 9px;text-align:left;}
th{background:#F8EFD8;color:#5C1A1B;font-weight:600;}
tr:nth-child(even) td{background:#FDF8EC;}
.prose{font-size:15.5px;line-height:1.85;text-align:justify;margin-bottom:14px;}
.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.idcard{background:#FFF6E3;border:1px solid var(--gold2);border-radius:10px;padding:12px 14px;}
.idcard .t{font-size:12px;color:var(--soft);}
.idcard .v{font-size:18px;color:#8B2B33;font-weight:700;margin-top:2px;}
.chartwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:10px 0 18px;}
.chartbox{text-align:center;}
.chartbox .cap{font-size:13px;color:var(--soft);margin-top:6px;}
.yog{background:#FDF8EC;border-left:4px solid var(--gold);padding:10px 14px;margin-bottom:10px;font-size:15px;line-height:1.7;}
.dos{background:#FFF3F0;border-left:4px solid #B8434A;padding:10px 14px;margin-bottom:10px;font-size:15px;line-height:1.7;}
.dos.ok{background:#F2F8EF;border-left-color:#5A8B2B;}
.rem{display:grid;grid-template-columns:110px 1fr;gap:10px;border:1px solid #E4D3AE;border-radius:8px;padding:10px 12px;margin-bottom:9px;font-size:14px;align-items:center;}
.rem .m{color:#8B2B33;font-weight:700;}
.foot{font-size:12.5px;color:var(--soft);border-top:1px solid var(--gold2);padding-top:10px;margin-top:22px;line-height:1.7;}
.savhot{background:#EAF3E2 !important;font-weight:700;}
.savcold{background:#F9E9E7 !important;}
.antar{font-size:12px;color:var(--soft);}
.printbar{max-width:794px;margin:10px auto;text-align:center;}
.printbar button{width:auto;padding:10px 28px;}
@media print{
  body{background:#fff;}
  .screen,.printbar{display:none !important;}
  #report{display:block !important;}
  .page{box-shadow:none;margin:0;page-break-after:always;min-height:auto;padding:34px 40px;}
  .page:last-child{page-break-after:auto;}
}
@page{size:A4;margin:10mm;}

/* devanagari-print-safety: letter-spacing splits matras/conjuncts (दि ल). Never apply to Indic text. */
body,.page,.prose,.idcard,.yog,td,th,h1,h2,div,span{letter-spacing:normal;}
.stars,.scorepill{letter-spacing:2px;}
@media print{*{-webkit-font-feature-settings:"liga" 1,"kern" 1;font-feature-settings:"liga" 1,"kern" 1;}}

/* ── DEVANAGARI SHAPING SAFETY ──────────────────────────────────────────────
   A Latin-first font stack (e.g. 'Cormorant Garamond' first) forces the browser
   into PER-CHARACTER font fallback for Hindi. Shaping a syllable cluster across
   two font runs splits matras/conjuncts:  करियर → "करि यर",  बातचीत → "बा तची त".
   Fix: when the report renders in Hindi, use ONE complete Devanagari font for
   everything, and disable anything that can insert space inside a cluster. */
#report.lang-hi, #report.lang-hi *{
  font-family:'Noto Serif Devanagari','Nirmala UI','Mangal','Kokila',serif !important;
  letter-spacing:normal !important;
  word-spacing:normal !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-synthesis:none;               /* faux-bold can break conjunct shaping */
  text-rendering:auto;
}
#report.lang-hi .prose{text-align:left;}   /* justify stretches Indic awkwardly */
@media print{
  #report.lang-hi, #report.lang-hi *{
    font-family:'Noto Serif Devanagari','Nirmala UI','Mangal',serif !important;
    letter-spacing:normal !important;
  }
}

/* Telugu: same single-font shaping law as Devanagari (§10.2 / §T6) */
#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-te .prose{text-align:left;}
@media print{#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;letter-spacing:normal !important;}}

/* Indic print hardening: some print engines duplicate glyph clusters when
   ligature/kerning features are re-resolved. Lock them and disable synthesis. */
@media print{
  #report.lang-hi, #report.lang-hi *, #report.lang-te, #report.lang-te *{
    text-rendering:auto !important;
    font-variant-ligatures:normal !important;
    font-feature-settings:normal !important;
    font-synthesis:none !important;
    -webkit-font-smoothing:antialiased;
  }
}

/* Kannada: same single-font shaping law as Devanagari/Telugu (§10.2 / §K6) */
#report.lang-kn, #report.lang-kn *{
  font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-kn .prose{text-align:left;}
@media print{
  #report.lang-kn, #report.lang-kn *{
    font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}

/* Tamil: same single-font shaping law as Devanagari/Telugu/Kannada (§10.2 / §K6) */
#report.lang-ta, #report.lang-ta *{
  font-family:'Noto Serif Tamil','Latha','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-ta .prose{text-align:left;}
@media print{
  #report.lang-ta, #report.lang-ta *{
    font-family:'Noto Serif Tamil','Latha','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}

/* bn: single-font shaping law (§10.2 / §K6) */
#report.lang-bn, #report.lang-bn *{
  font-family:'Noto Serif Bengali','Vrinda','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-bn .prose{text-align:left;}
@media print{
  #report.lang-bn, #report.lang-bn *{
    font-family:'Noto Serif Bengali','Vrinda','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}

/* mr: single-font shaping law (§10.2 / §K6) */
#report.lang-mr, #report.lang-mr *{
  font-family:'Noto Serif Devanagari','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-mr .prose{text-align:left;}
@media print{
  #report.lang-mr, #report.lang-mr *{
    font-family:'Noto Serif Devanagari','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}
</style>

<div class="screen" id="inputScreen">
  <h1 class="brand">🕉️ शुभ दिन — Kundli Report</h1>
  <div class="sub">Free · Drik-Ganita Accurate · No gemstone selling, ever</div>
  <div class="row">
    <div><label>Name / नाम</label><input id="pname" type="text" value="" placeholder="Full name"></div>
    <div><label>Gender / लिंग</label><select id="pgender"><option>Male</option><option>Female</option></select></div>
  </div>
  <div class="row">

  </div>
  <label>Birth Place (label only) / जन्म स्थान</label><input id="bplace" type="text" value="Narasapur, AP">

  <button onclick="confirmStep()">Check Birth Details → जाँचें</button>
  <div class="confirm" id="confirmBox">
    <div id="confirmText" style="font-size:15px;line-height:1.9;"></div>
    <div class="row">
      <button style="background:#5A8B2B;" onclick="generate()">✓ Correct — Generate Report</button>
      <button style="background:#B8434A;" onclick="document.getElementById('confirmBox').style.display='none'">✗ Fix details</button>
    </div>
  </div>
</div>

<div class="printbar" id="printbar" style="display:none;"><button onclick="sdPrint()">🖨️ Print / Save as PDF</button></div>
<div id="report"></div>

सफ़ेद या गुलाबी फूल चढ़ाना और सुंदरता को अपनाना इसे मज़बूत करता है।","te":"మీ జాతకంలో శుక్రుడు కొంచెం సున్నితమైన స్థితిలో ఉన్నాడు — శుక్రవారం తెలుపు లేదా గులాబీ పూలు సమర్పించడం, అందాన్ని ఆదరించడం దీన్ని బలపరుస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸ್ವಲ್ಪ ಸೂಕ್ಷ್ಮ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ — ಶುಕ್ರವಾರ ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸುವುದು, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸುವುದು ಅದನ್ನು ಬಲಪಡಿಸುತ್ತದೆ.","ta":"உங்கள் சுக்கிரன் மென்மையான நிலையில் இருக்கிறார் — வெள்ளிக்கிழமைகளில் வெள்ளை அல்லது இளஞ்சிவப்பு மலர்களை அர்ப்பணிப்பதும், அழகை வளர்ப்பதும் அதை பலப்படுத்தும்.","bn":"আপনার শুক্র একটু কোমল অবস্থানে — শুক্রবারে সাদা বা গোলাপি ফুল নিবেদন করলে আর সৌন্দর্যের যত্ন নিলে তা শক্তিশালী হয়।","mr":"तुमचा शुक्र थोडा नाजूक स्थितीत आहे — शुक्रवारी पांढरी किंवा गुलाबी फुले अर्पण केल्याने आणि सौंदर्याची काळजी घेतल्याने तो बळकट होतो."},"venusNeutral":{"en":"Your Venus holds a balanced placement, giving love a steady foundation.","hi":"आपका शुक्र संतुलित स्थिति में है, जो प्यार को मज़बूत नींव देता है।","te":"మీ జాతకంలో శుక్రుడు సమతుల్య స్థితిలో ఉన్నాడు, ఇది ప్రేమకు స్థిరమైన పునాది ఇస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸಮತೋಲಿತ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ, ಇದು ಪ್ರೀತಿಗೆ ಸ್ಥಿರ ಅಡಿಪಾಯ ಕೊಡುತ್ತದೆ.","ta":"உங்கள் சுக்கிரன் சமநிலையில் இருக்கிறார், காதலுக்கு ஒரு உறுதியான அடித்தளத்தைத் தருகிறார்.","bn":"আপনার শুক্র একটি সমতল অবস্থানে রয়েছে, যা ভালোবাসাকে একটি স্থির ভিত্তি দেয়।","mr":"तुमचा शुक्र संतुलित स्थितीत आहे, ज्यामुळे प्रेमाला स्थिर पाया मिळतो."},"venusRemedyIntro":{"en":"Venus is the planet of love, beauty and sweetness. Honouring it brings tenderness to your relationships:","hi":"शुक्र प्यार, सुंदरता और मिठास का ग्रह है। इसे प्रसन्न रखना रिश्तों में मिठास लाता है:","te":"శుక్రుడు ప్రేమ, అందం, మాధుర్యానికి అధిపతి. ఆయనను ఆరాధించడం బంధాల్లో మాధుర్యాన్ని తెస్తుంది:","kn":"ಶುಕ್ರ ಪ್ರೀತಿ, ಸೌಂದರ್ಯ ಮತ್ತು ಮಾಧುರ್ಯದ ಅಧಿಪತಿ. ಅವರನ್ನು ಆರಾಧಿಸುವುದು ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ತರುತ್ತದೆ:","ta":"சுக்கிரன் காதல், அழகு, இனிமையின் கிரகம். அவரை வழிபடுவது உங்கள் உறவுகளுக்கு மென்மையைக் கொண்டு வரும்:","bn":"শুক্র ভালোবাসা, সৌন্দর্য আর মাধুর্যের গ্রহ। তাঁকে সম্মান জানালে সম্পর্কে কোমলতা আসে:","mr":"शुक्र हा प्रेम, सौंदर्य आणि गोडव्याचा ग्रह. त्याचा मान राखल्याने नात्यांत मृदुता येते:"},"closingQuote":{"en":"\"The stars incline; they do not compel. Your open heart writes the truest love story of all.\"","hi":"\"सितारे राह दिखाते हैं, मजबूर नहीं करते। सबसे सच्ची प्रेम कहानी आपका खुला दिल ही लिखता है।\"","te":"\"గ్రహాలు దారి చూపిస్తాయి, బలవంతం చేయవు. అత్యంత నిజమైన ప్రేమ కథను రాసేది మీ తెరిచిన మనసే.\"","kn":"\"ಗ್ರಹಗಳು ದಾರಿ ತೋರಿಸುತ್ತವೆ, ಒತ್ತಾಯ ಮಾಡುವುದಿಲ್ಲ. ಅತ್ಯಂತ ನಿಜವಾದ ಪ್ರೀತಿಯ ಕಥೆಯನ್ನು ಬರೆಯುವುದು ನಿಮ್ಮ ತೆರೆದ ಮನಸ್ಸೇ.\"","ta":"\"நட்சத்திரங்கள் வழிகாட்டுகின்றன; கட்டாயப்படுத்துவதில்லை. உங்கள் திறந்த மனமே எல்லாவற்றிலும் உண்மையான காதல் கதையை எழுதுகிறது.\"","bn":"\"তারা পথ দেখায়, বাধ্য করে না। আপনার খোলা মনই সবচেয়ে সত্যি ভালোবাসার গল্প লেখে।\"","mr":"\"तारे वाट दाखवतात, सक्ती करत नाहीत. तुमचे मोकळे मनच सर्वात खरी प्रेमकथा लिहिते.\""}},"reason":{"d7fifth":{"en":"D7 5th lord","hi":"सप्तांश पंचमेश","te":"సప్తాంశ పంచమాధిపతి","kn":"ಸಪ್ತಾಂಶ ಪಂಚಮಾಧಿಪತಿ","ta":"D7 5ஆம் அதிபதி","bn":"D7 পঞ্চমাধিপতি","mr":"D7 पंचमाधिपती"},"d7lagna":{"en":"D7 lagna lord","hi":"सप्तांश लग्नेश","te":"సప్తాంశ లగ్నాధిపతి","kn":"ಸಪ್ತಾಂಶ ಲಗ್ನಾಧಿಪತಿ","ta":"D7 லக்ன அதிபதி","bn":"D7 লগ্নাধিপতি","mr":"D7 लग्नाधिपती"},"occupies5":{"en":"occupies your 5th house","hi":"आपके पाँचवें भाव में स्थित","te":"మీ ఐదవ భావంలో ఉన్నారు","kn":"ನಿಮ್ಮ ಐದನೇ ಭಾವದಲ್ಲಿದ್ದಾರೆ","ta":"உங்கள் 5ஆம் பாவத்தில் அமர்ந்துள்ளார்","bn":"আপনার পঞ্চম ভাবে রয়েছেন","mr":"तुमच्या पंचम भावात आहेत"},"fifthLordRole":{"en":"lord of your 5th house","hi":"आपके पाँचवें भाव का स्वामी","te":"మీ ఐదవ భావ అధిపతి","kn":"ನಿಮ್ಮ ಐದನೇ ಭಾವದ ಅಧಿಪತಿ","ta":"உங்கள் 5ஆம் பாவ அதிபதி","bn":"আপনার পঞ্চম ভাবের অধিপতি","mr":"तुमच्या पंचम भावाचा अधिपती"},"ageWindow":{"en":"Within the traditional age window","hi":"पारंपरिक आयु-सीमा के भीतर","te":"సంప్రదాయ వయో పరిధిలో","kn":"ಸಂಪ್ರದಾಯದ ವಯೋಮಿತಿಯಲ್ಲಿ","ta":"பாரம்பரிய வயது எல்லைக்குள்","bn":"শাস্ত্রীয় বয়সসীমার মধ্যে","mr":"शास्त्रीय वयोमर्यादेत"},"antarLord":{"en":"Antar lord","hi":"अंतर्दशा ம் மதிப்பும் வளரும்.","bn":"রবিবার উদীয়মান সূর্যকে অর্ঘ্য দিন, বাবা আর গুরুজনদের সম্মান করুন, গম বা গুড় দান করুন। আত্মবিশ্বাস আর সম্মান বাড়ে।","mr":"रविवारी उगवत्या सूर्याला अर्घ्य द्या; वडील आणि वडीलधाऱ्यांचा मान राखा; गहू किंवा गूळ दान करा. आत्मविश्वास आणि सन्मान वाढतो."},"moon":{"te":"సోమవారం శివుడిని ఆరాధించండి, తెల్లని వస్తువులు దానం చేయండి. మనసుకు ప్రశాంతత కలుగుతుంది.","kn":"ಸೋಮವಾರ ಶಿವನನ್ನು ಆರಾಧಿಸಿ, ಬಿಳಿ ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ. ಮನಸ್ಸಿಗೆ ಶಾಂತಿ ಸಿಗುತ್ತದೆ.","ta":"திங்கட்கிழமையை அமைதியாக, தூய்மையாகக் கழிக்கவும், தாயை மதிக்கவும், அரிசி அல்லது பால் தானம் செய்யவும். மனம் அமைதி பெறும்.","bn":"সোমবার শান্ত আর পরিচ্ছন্নভাবে কাটান, মাকে সম্মান করুন, দুধ বা চাল দান করুন। মন শান্ত থাকে, ঘরে সুখ আসে।","mr":"सोमवार शांत आणि स्वच्छ ठेवा; आईचा मान राखा; सोमवारी गरजूंना दूध किंवा तांदूळ द्या. मन शांत राहते, घरात सुख येते."},"mars":{"te":"మంగళవారం హనుమంతుడిని ఆరాధించండి, ఓపికను అలవరచుకోండి. ధైర్యం సరైన దిశలో పని చేస్తుంది.","kn":"ಮಂಗಳವಾರ ಹನುಮಂತನನ್ನು ಆರಾಧಿಸಿ, ತಾಳ್ಮೆ ಬೆಳೆಸಿಕೊಳ್ಳಿ. ಧೈರ್ಯ ಸರಿಯಾದ ದಿಕ್ಕಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ.","ta":"செவ்வாய்க்கிழமை அனுமன் சாலீசா ஓதவும், உடல் ஒழுக்கம் காக்கவும், துவரம்பருப்பு அல்லது சிவப்பு துணி தானம் செய்யவும். தைரியமும் ஆற்றலும் வளரும்.","bn":"মঙ্গলবার হনুমান চালিসা পাঠ করুন, শরীরচর্চার নিয়ম রাখুন, মসুর ডাল বা লাল কাপড় দান করুন। সাহস বাড়ে, রাগ কমে।","mr":"मंगळवारी हनुमान चालीसा वाचा; व्यायामाचा नियम ठेवा; मसूर डाळ किंवा लाल कापड दान करा. धैर्य वाढते, राग कमी होतो."},"mercury":{"te":"బుధవారం విష్ణువును స్మరించండి, పచ్చని వస్తువులు దానం చేయండి. మాటలో, వ్యవహారంలో స్పష్టత వస్తుంది.","kn":"ಬುಧವಾರ ವಿಷ್ಣುವನ್ನು ಸ್ಮರಿಸಿ, ಹಸಿರು ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ. ಮಾತಿನಲ್ಲಿ, ವ್ಯವಹಾರದಲ್ಲಿ ಸ್ಪಷ್ಟತೆ ಬರುತ್ತದೆ.","ta":"புதன்கிழமை பசுக்களுக்கு பசும்புல் தரவும், பேச்சை உண்மையாகவும் இனிமையாகவும் வைக்கவும், பாசிப்பருப்பு தானம் செய்யவும். புத்திசாலித்தனமும் தொடர்புகளும் வளரும்.","bn":"বুধবার গরুকে সবুজ ঘাস খাওয়ান, কথা সত্য আর মিষ্টি রাখুন, মুগ ডাল দান করুন। বুদ্ধি আর ব্যবসায় উন্নতি হয়।","mr":"बुधवारी गाईला हिरवा चारा द्या; बोलणे खरे आणि गोड ठेवा; मूग डाळ दान करा. बुद्धी आणि व्यवसायात प्रगती होते."},"jupiter":{"te":"గురువారం గురువును ఆరాధించండి, పసుపు పచ్చని వస్తువులు దానం చేయండి, పెద్దలను గౌరవించండి. జ్ఞానం, అదృష్టం పెరుగుతాయి.","kn":"ಗುರುವಾರ ಗುರುವನ್ನು ಆರಾಧಿಸಿ, ಹಳದಿ ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ, ಹಿರಿಯರನ್ನು ಗೌರವಿಸಿ. ಜ್ಞಾನ, ಅದೃಷ್ಟ ಹೆಚ್ಚುತ್ತವೆ.","ta":"வியாழக்கிழமை குருமார்களை சேவிக்கவும், ஞானத்தைப் பகிரவும், மஞ்சள், கடலைப்பருப்பு அல்லது புத்தகம் தானம் செய்யவும். ஞானமும் அதிர்ஷ்டமும் வளரும்.","bn":"বৃহস্পতিবার গুরুজনদের সেবা করুন, জ্ঞান ভাগ করে নিন, হলুদ, ছোলার ডাল বা বই দান করুন। জ্ঞান, সম্মান আর সৌভাগ্য বাড়ে।","mr":"गुरुवारी गुरुजनांची सेवा करा आणि ज्ञान वाटा; हळद, हरभरा डाळ किंवा पुस्तके दान करा. ज्ञान, सन्मान आणि भाग्य वाढते."},"venus":{"te":"శుక్రవారం లక్ష్మీదేవిని ఆరాధించండి, తెలుపు లేదా గులాబీ పూలు సమర్పించండి, అందాన్ని ఆదరించండి, ఉదారంగా ఇవ్వండి. ప్రేమలో, బంధాల్లో మాధుర్యం పెరుగుతుంది.","kn":"ಶುಕ್ರವಾರ ಲಕ್ಷ್ಮಿಯನ್ನು ಆರಾಧಿಸಿ, ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸಿ, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸಿ, ಉದಾರವಾಗಿ ಕೊಡಿ. ಪ್ರೀತಿಯಲ್ಲಿ, ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ಹೆಚ್ಚುತ್ತದೆ.","ta":"வெள்ளிக்கிழமை லக்ஷ்மியை வழிபடவும், வெள்ளை அல்லது இளஞ்சிவப்பு மலர்களை அர்ப்பணிக்கவும், அழகை ஆதரிக்கவும், உதாரமாக கொடுக்கவும். காதலிலும் உறவுகளிலும் இனிமை பெருகும்.","bn":"শুক্রবার লক্ষ্মীর আরাধনা করুন, সাদা বা গোলাপি ফুল নিবেদন করুন, সৌন্দর্যের যত্ন নিন, উদারভাবে দিন। ভালোবাসা আর সম্পর্কে মাধুর্য বাড়ে।","mr":"शुक्रवार कला आणि उदारतेत घालवा; स्त्रियांचा मान राखा; पांढरी मिठाई, तांदूळ किंवा दही दान करा. प्रेम आणि नात्यांत गोडवा वाढतो."},"saturn":{"te":"శనివారం శనిదేవుడిని ఆరాధించండి, నల్ల నువ్వులు దానం చేయండి, పేదలకు సాయం చేయండి. ఓపిక ఫలిస్తుంది.","kn":"ಶನಿವಾರ ಶನಿದೇವರನ್ನು ಆರಾಧಿಸಿ, ಕಪ್ಪು ಎಳ್ಳು ದಾನ ಮಾಡಿ, ಬಡವರಿಗೆ ಸಹಾಯ ಮಾಡಿ. ತಾಳ್ಮೆ ಫಲ ಕೊಡುತ್ತದೆ.","ta":"சனிக்கிழமை முதியோர், தொழிலாளர், மாற்றுத்திறனாளிகளுக்கு சேவை செய்யவும், எள்ளெண்ணெய் விளக்கேற்றவும், கருப்பு எள் அல்லது இரும்பு தானம் செய்யவும். பொறுமையும் நிலைத்த வெற்றியும் கிடைக்கும்.","bn":"শনিবার বয়স্ক, শ্রমজীবী আর বিশেষভাবে সক্ষম মানুষদের সেবা করুন, তিলের তেলের প্রদীপ জ্বালান, কালো তিল বা লোহা দান করুন। ধৈর্য আর স্থায়ী সাফল্য আসে।","mr":"शनिवारी वृद्ध, कष्टकरी आणि दिव्यांग व्यक्तींची सेवा करा; तिळाच्या तेलाचा दिवा लावा; काळे तीळ किंवा लोखंड दान करा. संयम आणि टिकाऊ यश मिळते."},"rahu":{"te":"దుర్గాదేవిని ఆరాధించండి, శనివారం దానం చేయండి, నిజాయితీగా ఉండండి. అనవసర గందరగోళం తగ్గుతుంది.","kn":"ದುರ್ಗಾದೇವಿಯನ್ನು ಆರಾಧಿಸಿ, ಶನಿವಾರ ದಾನ ಮಾಡಿ, ಪ್ರಾಮಾಣಿಕರಾಗಿರಿ. ಅನಗತ್ಯ ಗೊಂದಲ ಕಡಿಮೆಯಾಗುತ್ತದೆ.","ta":"ஆசைகளில் நேர்மையான தெளிவு வைக்கவும், பறவைகளுக்கு உணவளிக்கவும், சனிக்கிழமை ஏழைகளுக்கு போர்வை தானம் செய்யவும். திடீர் தடைகள் விலகும்.","bn":"লক্ষ্য আর উপায়ে নৈতিক স্বচ্ছতা রাখুন, পাখিদের খাবার দিন, শনিবার গরিবদের কম্বল দান করুন। বিভ্রান্তি কমে, পথ পরিষ্কার হয়।","mr":"ध्येयांत नैतिक स्पष्टता ठेवा; पक्ष्यांना अन्न द्या; शनिवारी गरिबांना घोंगडी दान करा. गोंधळ कमी होतो, वाट स्पष्ट होते."},"ketu":{"te":"గణపతిని ఆరాధించండి, ధ్యానం అలవరచుకోండి, సాధువులకు సేవ చేయండి. మనసు స్థిరపడుతుంది.","kn":"ಗಣಪತಿಯನ್ನು ಆರಾಧಿಸಿ, ಧ್ಯಾನ ರೂಢಿಸಿಕೊಳ್ಳಿ, ಸಾಧುಗಳಿಗೆ ಸೇವೆ ಮಾಡಿ. ಮನಸ್ಸು ಸ್ಥಿರವಾಗುತ್ತದೆ.","ta":"தினமும் தியானம் அல்லது ஜபம் செய்யவும், தெரு நாய்களைப் பராமரிக்கவும், பல வண்ணப் போர்வை அல்லது எள் தானம் செய்யவும். ஆன்மிகத் தெளிவு பெருகும்.","bn":"প্রতিদিন ধ্যান বা জপ করুন, পথের কুকুরদের যত্ন নিন, নানা রঙের কম্বল বা তিল দান করুন। মন স্থির হয়, ভিতরের দৃষ্টি খোলে।","mr":"रोज ध्यान किंवा जप करा; भटक्या कुत्र्यांची काळजी घ्या; रंगीबेरंगी घोंगड्या किंवा तीळ दान करा. मन स्थिर होते, आतली दृष्टी उघडते."}},"marriage":{"boyDefault":{"en":"Boy","hi":"वर","te":"వరుడు","kn":"ವರ","ta":"மணமகன்","bn":"পাত্র","mr":"वर"},"girlDefault":{"en":"Girl","hi":"वधू","te":"వధువు","kn":"ವಧು","ta":"மணமகள்","bn":"পাত্রী","mr":"वधू"},"outlookText":{"en":"This is a favourable match according to classical compatibility principles. The emotional foundation is strong, and the identified challenges are manageable through communication, mutual respect, and the suggested remedies.","hi":"शास्त्रीय अनुकूलता सिद्धांतों के अनुसार यह एक शुभ संबंध है। भावनात्मक नींव सुदृढ़ है, और उल्लिखित चुनौतियाँ संवाद, परस्पर सम्मान तथा सुझाए गए उपायों से सहज प्रबंधनीय हैं।","te":"శాస్త్రీయ అనుకూలత సూత్రాల ప్రకారం ఇది ఒక శుభమైన బంధం. మనసుల పునాది బలంగా ఉంది, గుర్తించిన ఇబ్బందులు మాటలతో, పరస్పర గౌరవంతో, సూచించిన పరిహారాలతో సులభంగా సర్దుకుంటాయి.","kn":"ಶಾಸ್ತ್ರೀಯ ಹೊಂದಾಣಿಕೆ ತತ್ವಗಳ ಪ್ರಕಾರ ಇದು ಶುಭ ಸಂಬಂಧ. ಮನಸ್ಸುಗಳ ಅಡಿಪಾಯ ಬಲವಾಗಿದೆ, ಗುರುತಿಸಿದ ತೊಂದರೆಗಳು ಮಾತು, ಪರಸ್ಪರ ಗೌರವ ಮತ್ತು ಸೂಚಿಸಿದ ಪರಿಹಾರಗಳಿಂದ ಸುಲಭವಾಗಿ ಸರಿಹೋಗುತ್ತವೆ.","ta":"பாரம்பரிய பொருத்த விதிகளின்படி இது ஒரு சாதகமான பொருத்தம். உணர்வுபூர்வ அடித்தளம் பலமாக உள்ளது, கண்டறியப்பட்ட சவால்கள் பேச்சு, பரஸ்பர மரியாதை, பரிந்துரைக்கப்பட்ட பரிகாரங்கள் மூலம் சமாளிக்கக்கூடியவை.","bn":"শাস্ত্রীয় মিলনের নীতি অনুসারে এটি একটি শুভ মিল। মনের ভিত্তি মজবুত, আর যে সমস্যাগুলি ধরা পড়েছে সেগুলি কথাবার্তা, পারস্পরিক সম্মান আর বলে দেওয়া প্রতিকারের মাধ্যমে সামলে নেওয়া যায়।","mr":"शास्त्रीय मेलनाच्या तत्त्वांनुसार ही शुभ जुळणी आहे. मनाचा पाया भक्कम आहे, आणि जे मुद्दे समोर आले आहेत ते संवाद, परस्पर आदर आणि सांगितलेल्या परिहारांनी सांभाळता येतात."},"outlookCare":{"en":"According to classical compatibility principles, this match is best approached with care. Because several key areas score low, give importance to mutual understanding, honest family discussion and elder counsel before proceeding.","hi":"शास्त्रीय अनुकूलता सिद्धांतों के अनुसार इस संबंध पर सोच-विचार के साथ आगे बढ़ना बेहतर है। चूँकि कई अहम पहलुओं में अंक कम हैं, आगे बढ़ने से पहले परस्पर समझ, परिवार की खुली बातचीत और बड़ों की सलाह को महत्व दें।","te":"శాస్త్రీయ అనుకూలత సూత్రాల ప్రకారం ఈ సంబంధాన్ని జాగ్రత్తగా పరిశీలించడం ఉత్తమం. కొన్ని ముఖ్యమైన అంశాల్లో స్కోరు తక్కువగా ఉన్నందున, ముందుకు వెళ్లేముందు పరస్పర అవగాహన, కుటుంబ చర్చ, పెద్దల సలహాకు ప్రాధాన్యం ఇవ్వండి.","kn":"ಶಾಸ್ತ್ರೀಯ ಹೊಂದಾಣಿಕೆ ತತ್ವಗಳ ಪ್ರಕಾರ ಈ ಸಂಬಂಧವನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ಪರಿಗಣಿಸುವುದು ಉತ್ತಮ. ಕೆಲವು ಪ್ರಮುಖ ಅಂಶಗಳಲ್ಲಿ ಹೊಂದಾಣಿಕೆ ಕಡಿಮೆ ಇರುವುದರಿಂದ, ಮುಂದುವರಿಯುವ ಮೊದಲು ಪರಸ್ಪರ ಅರಿವು, ಕುಟುಂಬದ ಚರ್ಚೆ ಮತ್ತು ಹಿರಿಯರ ಸಲಹೆಗೆ ಮಹತ್ವ ನೀಡಿ.","ta":"பாரம்பரிய பொருத்த விதிகளின்படி, இந்தப் பொருத்தத்தைக் கவனத்துடன் அணுகுவது நல்லது. சில முக்கிய அம்சங்களில் மதிப்பெண் குறைவாக இருப்பதால், முன்னேறுவதற்கு முன் பரஸ்பர புரிதல், நேர்மையான குடும்பப் பேச்சு, பெரியோர் ஆலோசனைக்கு முக்கியத்துவம் கொடுங்கள்.","bn":"শাস্ত্রীয় মিলনের নীতি অনুসারে এই মিলটি একটু ভেবেচিন্তে এগোনোই ভালো। কয়েকটি গুরুত্বপূর্ণ দিকে নম্বর কম, তাই এগোনোর আগে পারস্পরিক বোঝাপড়া, দুই পরিবারের খোলাখুলি আলোচনা আর গুরুজনদের পরামর্শকে গুরুত্ব দিন।","mr":"शास्त्रीय मेलनाच्या तत्त्वांनुसार या जुळणीचा थोडा विचार करून पुढे जाणे चांगले. काही महत्त्वाच्या बाबींत गुण कमी आहेत, त्यामुळे पुढे जाण्यापूर्वी परस्पर समजूत, दोन्ही कुटुंबांतील मोकळा संवाद आणि वडीलधाऱ्यांचा सल्ला यांना महत्त्व द्या."},"confirmBoth":{"en":"If both match known details, generate. (Do double-check AM/PM!)","hi":"दोनों विवरण सही हों तो रिपोर्ट बनाएँ। (AM/PM ज़रूर जाँचें!)","te":"రెండు వివరాలు సరిగ్గా ఉంటే రిపోర్ట్ తయారు చేయండి. (AM/PM తప్పకుండా చూడండి!)","kn":"ಎರಡೂ ವಿವರಗಳು ಸರಿಯಾಗಿದ್ದರೆ ವರದಿ ತಯಾರಿಸಿ. (AM/PM ತಪ್ಪದೇ ಪರಿಶೀಲಿಸಿ!)","ta":"இரண்டும் தெரிந்த விவரங்களோடு பொருந்தினால், உருவாக்கவும். (AM/PM சரிபார்க்கவும்!)","bn":"দুজনের তথ্যই মিললে রিপোর্ট তৈরি করুন। (AM/PM অবশ্যই মিলিয়ে নিন!)","mr":"दोघांची माहिती जुळत असेल तर अहवाल तयार करा. (AM/PM नक्की तपासा!)"},"effectiveGuna":{"en":"EFFECTIVE GUNA SCORE","hi":"असली गुण अंक","te":"అసలు గుణ స్కోర్","kn":"ನಿಜವಾದ ಗುಣ ಸ್ಕೋರ್","ta":"பயனுள்ள குண மதிப்பெண்","bn":"প্রকৃত গুণ স্কোর","mr":"प्रत्यक्ष गुण"},"noMajor":{"en":"No major challenges ✓","hi":"कोई बड़ी चुनौती नहीं ✓","te":"పెద్ద ఇబ్బందులు లేవు ✓","kn":"ದೊಡ್ಡ ತೊಂದರೆಗಳಿಲ್ಲ ✓","ta":"பெரிய சவால்கள் இல்லை ✓","bn":"বড় কোনো সমস্যা নেই ✓","mr":"मोठी अडचण नाही ✓"},"execSummary":{"en":"Executive Summary","hi":"सारांश","te":"సారాంశం","kn":"ಸಾರಾಂಶ","ta":"சுருக்கம்","bn":"সংক্ষিপ্তসার","mr":"सारांश"},"overallMatch":{"en":"OVERALL MATCH","hi":"कुल मिलान","te":"మొత్తం మ్యాచ్","kn":"ಒಟ್ಟು ಹೊಂದಾಣಿಕೆ","ta":"ஒட்டுமொத்த பொருத்தம்","bn":"সামগ্রিক মিল","mr":"एकूण जुळणी"},"bestQualities":{"en":"BEST QUALITIES","hi":"सबसे अच्छी बातें","te":"అత్యుత్తమ లక్షణాలు","kn":"ಅತ್ಯುತ್ತಮ ಅಂಶಗಳು","ta":"சிறந்த குணங்கள்","bn":"সেরা দিকগুলি","mr":"सर्वात चांगल्या बाजू"},"challenges":{"en":"CHALLENGES","hi":"ध्यान देने योग्य बातें","te":"గమనించాల్సినవి","kn":"ಗಮನಿಸಬೇಕಾದವು","ta":"சவால்கள்","bn":"যেদিকে নজর দিতে হবে","mr":"लक्ष द्यायच्या बाबी"},"outlook":{"en":"MARRIAGE OUTLOOK & RECOMMENDATION","hi":"विवाह का निष्कर्ष एवं सलाह","te":"వివాహ ఫలితం మరియు సలహా","kn":"ವಿವಾಹ ಫಲ ಮತ್ತು ಸಲಹೆ","ta":"திருமண எதிர்நோக்கும் பரிந்துரையும்","bn":"বিবাহের সম্ভাবনা ও পরামর্শ","mr":"विवाहाची शक्यता आणि सल्ला"},"koota":{"en":"Koota","hi":"कूट","te":"కూటం","kn":"ಕೂಟ","ta":"பொருத்தம்","bn":"কূট","mr":"कूट"},"meaning":{"en":"Meaning","hi":"अर्थ","te":"అర్థం","kn":"ಅರ್ಥ","ta":"பொருள்","bn":"অর্থ","mr":"अर्थ"},"points":{"en":"Points","hi":"अंक","te":"పాయింట్లు","kn":"ಅಂಕಗಳು","ta":"புள்ளிகள்","bn":"নম্বর","mr":"गुण"},"dosha":{"en":"Dosha","hi":"दोष","te":"దోషం","kn":"ದೋಷ","ta":"தோஷம்","bn":"দোষ","mr":"दोष"},"nadiBhakoot":{"en":"Nadi and Bhakoot — no dosha ✓","hi":"नाड़ी और भकूट — कोई दोष नहीं ✓","te":"నాడి, భకూట — దోషం లేదు ✓","kn":"ನಾಡಿ ಮತ್ತು ಭಕೂಟ — ದೋಷ ಇಲ್ಲ ✓","ta":"நாடி மற்றும் பகூடம் — தோஷம் இல்லை ✓","bn":"নাড়ী ও ভকূট — কোনো দোষ নেই ✓","mr":"नाडी आणि भकूट — कोणताही दोष नाही ✓"},"mangalDosha":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ","ta":"செவ்வாய் தோஷம்","bn":"মঙ্গলদোষ","mr":"मंगळ दोष"},"cancelFactors":{"en":"Cancellation factors","hi":"दोष कटने के कारण","te":"దోషం తొలగే కారణాలు","kn":"ದೋಷ ನಿವಾರಣೆಯ ಕಾರಣಗಳು","ta":"நீக்கும் காரணிகள்","bn":"দোষ খণ্ডনের কারণ","mr":"दोष परिहाराची कारणे"},"noneSignificant":{"en":"None significant ✓","hi":"कोई बड़ा कारण नहीं ✓","te":"గణనీయమైనవి లేవు ✓","kn":"ಗಮನಾರ್ಹವಾದವು ಇಲ್ಲ ✓","ta":"குறிப்பிடத்தக்கவை இல்லை ✓","bn":"উল্লেখযোগ্য কিছু নেই ✓","mr":"उल्लेखनीय काही नाही ✓"},"yes":{"en":"Yes","hi":"हाँ","te":"అవును","kn":"ಹೌದು","ta":"ஆம்","bn":"হ্যাঁ","mr":"होय"},"no":{"en":"No","hi":"नहीं","te":"లేదు","kn":"ಇಲ್ಲ","ta":"இல்லை","bn":"না","mr":"नाही"}},"manglik":{"none":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం లేదు — ఈ సంబంధానికి కుజుడి వల్ల ఎలాంటి అడ్డంకీ లేదు.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇಲ್ಲ — ಈ ಸಂಬಂಧಕ್ಕೆ ಕುಜನಿಂದ ಯಾವ ಅಡ್ಡಿಯೂ ಇಲ್ಲ.","ta":"இரண்டு ஜாதகங்களிலும் செவ்வாய் தோஷம் இல்லை — இந்த சம்பந்தத்திற்கு செவ்வாயால் எந்தத் தடையும் இல்லை.","bn":"দুই কোষ্ঠীর কোনোটিতেই মঙ্গলদোষ নেই — এই সম্পর্কে মঙ্গলের দিক থেকে কোনো বাধা নেই।","mr":"दोन्ही पत्रिकांपैकी कोणत्याही एकात मंगळ दोष नाही — या नात्यात मंगळाकडून कोणताही अडथळा नाही."},"neutralized":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం ఉంది — శాస్త్ర నియమం ప్రకారం దోషం పరస్పరం తొలగిపోతుంది.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ — ಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ದೋಷ ಪರಸ್ಪರ ನಿವಾರಣೆಯಾಗುತ್ತದೆ.","ta":"இரண்டு ஜாதகங்களிலும் செவ்வாய் தோஷம் உள்ளது — சாஸ்திர விதிப்படி தோஷம் பரஸ்பரம் நீங்குகிறது.","bn":"দুই কোষ্ঠীতেই মঙ্গলদোষ রয়েছে — শাস্ত্রীয় নিয়ম অনুসারে দোষ পরস্পর কেটে যায়।","mr":"दोन्ही पत्रिकांत मंगळ दोष आहे — शास्त्रीय नियमानुसार दोष परस्पर रद्द होतो."},"softened":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, కానీ కింద చెప్పిన శాస్త్ర పరిహార కారణాల వల్ల అది తగ్గింది; సంప్రదాయ పరిహారాలతో ఈ సంబంధం ముందుకు సాగవచ్చు.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ಆದರೆ ಕೆಳಗೆ ಹೇಳಿದ ಶಾಸ್ತ್ರೀಯ ಪರಿಹಾರ ಕಾರಣಗಳಿಂದ ಅದು ಕಡಿಮೆಯಾಗಿದೆ; ಸಂಪ್ರದಾಯದ ಪರಿಹಾರಗಳೊಂದಿಗೆ ಈ ಸಂಬಂಧ ಮುಂದುವರಿಯಬಹುದು.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, ஆனால் கீழே சொல்லப்பட்ட சாஸ்திரப் பரிகார காரணங்களால் அது குறைந்துள்ளது; பாரம்பரியப் பரிகாரங்களுடன் இந்த சம்பந்தம் முன்னேறலாம்.","bn":"একটি কোষ্ঠীতে মঙ্গলদোষ রয়েছে, তবে নিচে বলা শাস্ত্রীয় খণ্ডনের কারণগুলিতে তা অনেকটাই কমে গেছে; প্রচলিত প্রতিকার মেনে এই সম্পর্ক এগোতে পারে।","mr":"एका पत्रिकेत मंगळ दोष आहे, पण खाली दिलेल्या शास्त्रीय परिहारांमुळे तो बराच कमी झाला आहे; प्रचलित उपाय करून हे नाते पुढे जाऊ शकते."},"present":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, తొలగించే కారణాలేవీ లేవు — ముందుకు వెళ్లేముందు కుజ శాంతి (హనుమాన్ ఉపాసన, మంగళవార వ్రతం) చేసి పెద్దల సలహా తీసుకోవాలని సంప్రదాయం చెబుతోంది.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ನಿವಾರಣೆಯ ಕಾರಣಗಳಿಲ್ಲ — ಮುಂದುವರಿಯುವ ಮೊದಲು ಕುಜ ಶಾಂತಿ (ಹನುಮಂತನ ಉಪಾಸನೆ, ಮಂಗಳವಾರದ ವ್ರತ) ಮಾಡಿ ಹಿರಿಯರ ಸಲಹೆ ಪಡೆಯಬೇಕೆಂದು ಸಂಪ್ರದಾಯ ಹೇಳುತ್ತದೆ.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, நீக்கும் காரணங்கள் எதுவும் இல்லை — முன்னேறுவதற்கு முன் செவ்வாய் சாந்தி (அனுமன் உபாசனை, செவ்வாய்க்கிழமை விரதம்) செய்து பெரியோர் ஆலோசனை பெறுமாறு சம்பிரதாயம் கூறுகிறது.","bn":"একটি কোষ্ঠীতে মঙ্গলদোষ রয়েছে, খণ্ডনের কোনো কারণ নেই — এগোনোর আগে মঙ্গল শান্তি (হনুমান উপাসনা, মঙ্গলবারের ব্রত) করে গুরুজনদের পরামর্শ নেওয়ার কথা শাস্ত্র বলে।","mr":"एका पत्रिकेत मंगळ दोष आहे आणि परिहाराचे कारण नाही — पुढे जाण्यापूर्वी मंगळ शांती (हनुमान उपासना, मंगळवारचे व्रत) करून वडीलधाऱ्यांचा सल्ला घ्यावा असे शास्त्र सांगते."},"note":{"en":"Note: Mangal Dosha strength reflects Mars’ house position and aggravating or softening factors — which is why we show it as Mild / Moderate / Strong rather than a raw number.","hi":"नोट: मंगल दोष की तीव्रता मंगल की भाव-स्थिति से आँकी जाती है; एकाधिक कारक इसे बढ़ा या घटा सकते हैं।","te":"గమనిక: కుజ దోష తీవ్రత కుజుడి భావ స్థితిని బట్టి, దాన్ని పెంచే లేదా తగ్గించే అంశాలను బట్టి లెక్కిస్తారు — అందుకే దీన్ని ఒక సంఖ్యగా కాకుండా అల్ప / మధ్యమ / తీవ్ర అని చూపిస్తున్నాం.","kn":"ಗಮನಿಸಿ: ಕುಜ ದೋಷದ ತೀವ್ರತೆಯನ್ನು ಕುಜನ ಭಾವ ಸ್ಥಿತಿ ಮತ್ತು ಅದನ್ನು ಹೆಚ್ಚಿಸುವ ಅಥವಾ ಕಡಿಮೆ ಮಾಡುವ ಅಂಶಗಳಿಂದ ಲೆಕ್ಕ ಹಾಕುತ್ತಾರೆ — ಆದ್ದರಿಂದ ಇದನ್ನು ಸಂಖ್ಯೆಯಾಗಿ ಅಲ್ಲದೆ ಅಲ್ಪ / ಮಧ್ಯಮ / ತೀವ್ರ ಎಂದು ತೋರಿಸಿದ್ದೇವೆ.","ta":"குறிப்பு: செவ்வாய் தோஷத்தின் தீவிரம் செவ்வாயின் பாவ நிலையையும், அதை அதிகரிக்கும் அல்லது குறைக்கும் அம்சங்களையும் பொறுத்தே கணக்கிடப்படுகிறது — அதனால் இதை ஒரு எண்ணாக அல்லாமல் லேசு / மிதம் / தீவிரம் என்று காட்டுகிறோம்.","bn":"টীকা: মঙ্গলদোষের মাত্রা নির্ভর করে মঙ্গলের ভাব-অবস্থান আর তা বাড়ানো বা কমানোর কারণগুলির উপর — সেই কারণেই আমরা এটিকে কাঁচা সংখ্যার বদলে হালকা / মাঝারি / প্রবল হিসেবে দেখাই।","mr":"टीप: मंगळ दोषाची तीव्रता मंगळाच्या भावस्थितीवर आणि तो वाढवणाऱ्या किंवा कमी करणाऱ्या घटकांवर अवलंबून असते — म्हणूनच आम्ही तो कच्च्या आकड्याऐवजी सौम्य / मध्यम / तीव्र असा दाखवतो."},"Mild":{"en":"Mild","hi":"अल्प","te":"అల్ప","kn":"ಅಲ್ಪ","ta":"லேசு","bn":"হালকা","mr":"सौम्य"},"Moderate":{"en":"Moderate","hi":"मध्यम","te":"మధ్యమ","kn":"ಮಧ್ಯಮ","ta":"மிதம்","bn":"মাঝারি","mr":"मध्यम"},"Strong":{"en":"Strong","hi":"प्रबल","te":"తీవ్ర","kn":"ತೀವ್ರ","ta":"தீவிரம்","bn":"প্রবল","mr":"तीव्र"}},"career":{"barLeadership":{"en":"Leadership Ability","hi":"नेतृत्व क्षमता","te":"నాయకత్వ శక్తి","kn":"ನಾಯಕತ್ವ ಸಾಮರ್ಥ್ಯ","ta":"தலைமைத் திறன்","bn":"নেতৃত্বের ক্ষমতা","mr":"नेतृत्वक्षमता"},"barEntre":{"en":"Entrepreneurship","hi":"अपना काम शुरू करने की क्षमता","te":"సొంత వ్యాపార శక్తి","kn":"ಸ್ವಂತ ಉದ್ಯಮ ಶಕ್ತಿ","ta":"தொழில்முனைவு","bn":"ব্যবসার ক্ষমতা","mr":"व्यवसायक्षमता"},"barWealth":{"en":"Wealth Potential","hi":"धन संभावना","te":"సంపద అవకాశం","kn":"ಸಂಪತ್ತಿನ ಸಾಧ್ಯತೆ","ta":"செல்வ வாய்ப்பு","bn":"সম্পদের সম্ভাবনা","mr":"संपत्तीची शक्यता"},"barGovt":{"en":"Govt Sector Fit","hi":"सरकारी नौकरी में सफलता","te":"ప్రభుత్వ ఉద్యోగంలో విజయం","kn":"ಸರ್ಕಾರಿ ಉದ್ಯೋಗದಲ್ಲಿ ಯಶಸ್ಸು","ta":"அரசு துறை பொருத்தம்","bn":"সরকারি ক্ষেত্রে মানানসই","mr":"सरकारी क्षेत्रात योग्यता"},"barPriv":{"en":"Private Sector Fit","hi":"प्राइवेट सेक्टर में सफलता","te":"ప్రైవేట్ సెక్టార్‌లో విజయం","kn":"ಪ್ರೈವೇಟ್ ಸೆಕ್ಟರ್‌ನಲ್ಲಿ ಯಶಸ್ಸು","ta":"தனியார் துறை பொருத்தம்","bn":"প্রাইভেট ক্ষেত্রে মানানসই","mr":"खासगी क्षेत्रात योग्यता"},"confirmGen":{"en":"If correct, generate (check AM/PM)","hi":"सही हो तो रिपोर्ट बनाएँ (AM/PM जाँचें)","te":"సరిగ్గా ఉంటే రిపోర్ట్ తయారు చేయండి (AM/PM చూడండి)","kn":"ಸರಿಯಾಗಿದ್ದರೆ ವರದಿ ತಯಾರಿಸಿ (AM/PM ಪರಿಶೀಲಿಸಿ)","ta":"சரியெனில், உருவாக்கவும் (AM/PM சரிபார்க்கவும்)","bn":"ঠিক থাকলে রিপোর্ট তৈরি করুন (AM/PM মিলিয়ে নিন)","mr":"बरोबर असेल तर अहवाल तयार करा (AM/PM तपासा)"},"primarySig":{"en":"PRIMARY CAREER SIGNATURE","hi":"आपकी करियर पहचान","te":"మీ కెరీర్ స్వభావం","kn":"ನಿಮ್ಮ ಕೆರಿಯರ್ ಸ್ವಭಾವ","ta":"முதன்மை தொழில் சுபாவம்","bn":"আপনার মূল কর্মপ্রকৃতি","mr":"तुमचा मुख्य कर्मस्वभाव"},"topFields":{"en":"TOP FIELDS","hi":"सबसे अच्छे क्षेत्र","te":"ఉత్తమ రంగాలు","kn":"ಅತ್ಯುತ್ತಮ ಕ್ಷೇತ್ರಗಳು","ta":"சிறந்த துறைகள்","bn":"সবচেয়ে উপযুক্ত ক্ষেত্র","mr":"सर्वात योग्य क्षेत्रे"},"keyIndicators":{"en":"KEY INDICATORS","hi":"मुख्य संकेत","te":"ముఖ్య సూచికలు","kn":"ಪ್ರಮುಖ ಸೂಚಕಗಳು","ta":"முக்கிய அறிகுறிகள்","bn":"প্রধান সূচক","mr":"प्रमुख सूचक"},"leadership":{"en":"Leadership","hi":"नेतृत्व","te":"నాయకత్వం","kn":"ನಾಯಕತ್ವ","ta":"தலைமை","bn":"নেতৃত্ব","mr":"नेतृत्व"},"entrepreneurship":{"en":"Entrepreneurship","hi":"अपना काम","te":"సొంత వ్యాపారం","kn":"ಸ್ವಂತ ಉದ್ಯಮ","ta":"தொழில்முனைவு","bn":"ব্যবসা","mr":"व्यवसाय"},"wealth":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು","ta":"செல்வம்","bn":"সম্পদ","mr":"संपत्ती"},"recommendation":{"en":"RECOMMENDATION","hi":"सलाह","te":"సలహా","kn":"ಸಲಹೆ","ta":"பரிந்துரை","bn":"পরামর্শ","mr":"सल्ला"},"leadStrong":{"en":"Your leadership potential is strong — people accept your guidance naturally. Management, team-lead or founder roles suit you well.","hi":"आपमें स्वाभाविक नेतृत्व-क्षमता प्रबल है — लोग आपका मार्गदर्शन सहज स्वीकार करते हैं। प्रबंधन, टीम-नेतृत्व या संस्थापक भूमिकाएँ आपके अनुकूल हैं।","te":"మీలో సహజమైన నాయకత్వ శక్తి బలంగా ఉంది — మీ మార్గదర్శనాన్ని జనం సులభంగా అంగీకరిస్తారు. మేనేజ్‌మెంట్, టీమ్ లీడ్ లేదా వ్యవస్థాపక పాత్రలు మీకు బాగా సరిపోతాయి.","kn":"ನಿಮ್ಮಲ್ಲಿ ಸಹಜ ನಾಯಕತ್ವ ಶಕ್ತಿ ಬಲವಾಗಿದೆ — ನಿಮ್ಮ ಮಾರ್ಗದರ್ಶನವನ್ನು ಜನ ಸಹಜವಾಗಿ ಒಪ್ಪುತ್ತಾರೆ. ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್, ಟೀಮ್ ಲೀಡ್ ಅಥವಾ ಸಂಸ್ಥಾಪಕ ಪಾತ್ರಗಳು ನಿಮಗೆ ಚೆನ್ನಾಗಿ ಹೊಂದುತ್ತವೆ.","ta":"உங்கள் தலைமைத் திறன் பலமானது — மக்கள் இயல்பாகவே உங்கள் வழிகாட்டுதலை ஏற்கிறார்கள். மேலாண்மை, குழுத் தலைமை அல்லது நிறுவனர் பொறுப்புகள் உங்களுக்கு நன்கு பொருந்தும்.","bn":"আপনার নেতৃত্বের ক্ষমতা শক্তিশালী — মানুষ সহজেই আপনার কথা মেনে নেয়। ম্যানেজমেন্ট, টিম-লিড বা প্রতিষ্ঠাতার ভূমিকা আপনার জন্য ভালো মানায়।","mr":"तुमची नेतृत्वक्षमता मजबूत आहे — लोक सहज तुमचे ऐकतात. व्यवस्थापन, टीम-लीड किंवा संस्थापकाची भूमिका तुम्हाला चांगली मानवते."},"leadMid":{"en":"You have solid leadership ability that grows with experience. Starting with a small team and building toward larger responsibility suits you.","hi":"आपमें अच्छी नेतृत्व-क्षमता है जो अनुभव के साथ निखरती है। छोटी टीम से आरंभ कर बड़ी ज़िम्मेदारी की ओर बढ़ना उपयुक्त रहेगा।","te":"మీలో మంచి నాయకత్వ శక్తి ఉంది, అది అనుభవంతో మెరుగవుతుంది. చిన్న టీమ్‌తో మొదలుపెట్టి పెద్ద బాధ్యతల వైపు వెళ్లడం మీకు సరిపోతుంది.","kn":"ನಿಮ್ಮಲ್ಲಿ ಒಳ್ಳೆಯ ನಾಯಕತ್ವ ಶಕ್ತಿ ಇದೆ, ಅದು ಅನುಭವದೊಂದಿಗೆ ಬೆಳೆಯುತ್ತದೆ. ಸಣ್ಣ ತಂಡದಿಂದ ಆರಂಭಿಸಿ ದೊಡ್ಡ ಜವಾಬ್ದಾರಿಯತ್ತ ಸಾಗುವುದು ನಿಮಗೆ ಸರಿ.","ta":"அனுபவத்துடன் வளரும் உறுதியான தலைமைத் திறன் உங்களிடம் உள்ளது. சிறிய குழுவில் தொடங்கி, பெரிய பொறுப்பை நோக்கி வளர்வது உங்களுக்கு ஏற்றது.","bn":"আপনার নেতৃত্বের ক্ষমতা ভালো, অভিজ্ঞতার সঙ্গে তা আরও বাড়বে। ছোট দল দিয়ে শুরু করে ধীরে ধীরে বড় দায়িত্বের দিকে এগোনোই আপনার পক্ষে ভালো।","mr":"तुमची नेतृत्वक्षमता चांगली आहे आणि अनुभवाबरोबर ती अधिक वाढेल. लहान संघापासून सुरुवात करून हळूहळू मोठ्या जबाबदारीकडे जाणे तुमच्यासाठी योग्य."},"leadExpert":{"en":"Your strength lies more in expertise than command — leading through deep skill is your natural path. Leadership can be learned, but you shine most as a specialist.","hi":"आपकी शक्ति नेतृत्व से अधिक विशेषज्ञता में है — गहरी दक्षता से प्रभाव बनाना आपका स्वाभाविक मार्ग है। नेतृत्व सीखा जा सकता है, पर विशेषज्ञ के रूप में आप अधिक चमकते हैं।","te":"మీ బలం ఆజ్ఞాపించడంలో కాదు, నైపుణ్యంలో ఉంది — లోతైన నైపుణ్యంతో ప్రభావం చూపడమే మీ సహజ మార్గం. నాయకత్వం నేర్చుకోవచ్చు, కానీ నిపుణుడిగానే మీరు ఎక్కువ మెరుస్తారు.","kn":"ನಿಮ್ಮ ಬಲ ಆಜ್ಞೆ ಮಾಡುವುದರಲ್ಲಿ ಅಲ್ಲ, ಪರಿಣತಿಯಲ್ಲಿ — ಆಳವಾದ ಕೌಶಲದಿಂದ ಪ್ರಭಾವ ಬೀರುವುದೇ ನಿಮ್ಮ ಸಹಜ ದಾರಿ. ನಾಯಕತ್ವ ಕಲಿಯಬಹುದು, ಆದರೆ ಪರಿಣಿತರಾಗಿಯೇ ನೀವು ಹೆಚ್ಚು ಮಿಂಚುತ್ತೀರಿ.","ta":"உங்கள் பலம் அதிகாரத்தை விட நிபுணத்துவத்திலேயே அதிகம் — ஆழமான திறமையால் வழிநடத்துவதே உங்கள் இயல்பான பாதை. தலைமையைக் கற்றுக்கொள்ளலாம், ஆனால் ஒரு நிபுணராகவே நீங்கள் மிகவும் பிரகாசிக்கிறீர்கள்.","bn":"আপনার শক্তি হুকুম চালানোর চেয়ে দক্ষতায় বেশি — গভীর জ্ঞান দিয়ে পথ দেখানোই আপনার স্বাভাবিক পথ। নেতৃত্ব শেখা যায়, তবে বিশেষজ্ঞ হিসেবেই আপনি সবচেয়ে বেশি উজ্জ্বল।","mr":"तुमचे बळ हुकूम गाजवण्यापेक्षा कौशल्यात जास्त आहे — सखोल ज्ञानाने वाट दाखवणे हा तुमचा स्वाभाविक मार्ग. नेतृत्व शिकता येते, पण तज्ज्ञ म्हणूनच तुम्ही सर्वाधिक चमकता."},"whatToDo":{"en":"What to do in each period — direct guidance on putting astrology to use:","hi":"हर अवधि में क्या करें — ज्योतिष को काम में लाने की सीधी सलाह:","te":"ప్రతి కాలంలో ఏమి చేయాలి — జ్యోతిష్యాన్ని ఆచరణలో పెట్టే స్పష్టమైన సూచనలు:","kn":"ಪ್ರತಿ ಕಾಲದಲ್ಲಿ ಏನು ಮಾಡಬೇಕು — ಜ್ಯೋತಿಷ್ಯವನ್ನು ಆಚರಣೆಗೆ ತರುವ ಸ್ಪಷ್ಟ ಸಲಹೆಗಳು:","ta":"ஒவ்வொரு காலத்திலும் என்ன செய்வது — ஜோதிடத்தை செயலில் பயன்படுத்த ந স","mr":"वय"},"ageLower":{"en":"age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು","ta":"வயது","bn":"বয়স","mr":"वय"},"alsoJoin":{"en":"; also ","hi":"; साथ ही ","te":"; అలాగే ","kn":"; ಜೊತೆಗೆ ","ta":"; மேலும் ","bn":"; সেই সঙ্গে ","mr":"; त्याचबरोबर "},"yearByYear":{"en":"Year by Year","hi":"वर्ष-दर-वर्ष","te":"సంవత్సరం వారీగా","kn":"ವರ್ಷವಾರು","ta":"ஆண்டுவாரியாக","bn":"বছরের পর বছর","mr":"वर्षानुवर्ष"},"yearByYearContd":{"en":"Year by Year (contd.)","hi":"वर्ष-दर-वर्ष (क्रमशः)","te":"సంవత్సరం వారీగా (కొనసాగింపు)","kn":"ವರ್ಷವಾರು (ಮುಂದುವರಿಕೆ)","ta":"ஆண்டுவாரியாக (தொடர்ச்சி)","bn":"বছরের পর বছর (চলছে)","mr":"वर्षानुवर्ष (पुढे चालू)"},"closing":{"en":"Closing","hi":"समापन","te":"ముగింపు","kn":"ಮುಕ್ತಾಯ","ta":"நிறைவாக","bn":"শেষ কথা","mr":"शेवटचे शब्द"},"closingText":{"en":"This decade blends auspicious and testing years — as every life does. Move boldly in the bright years, lean on patience and remedies in the testing ones. Astrology shows the road; the walking is yours.","hi":"यह दशक शुभ और परीक्षा दोनों वर्षों का मिश्रण है — जैसा हर जीवन होता है। शुभ वर्षों में साहस से आगे बढ़ें, परीक्षा के वर्षों में धैर्य और उपायों का सहारा लें। ज्योतिष मार्ग दिखाता है; चलना आपको है।","te":"ఈ దశాబ్దంలో శుభ సంవత్సరాలూ, పరీక్షించే సంవత్సరాలూ రెండూ ఉన్నాయి — ప్రతి జీవితంలో ఉన్నట్టే. మంచి సంవత్సరాల్లో ధైర్యంగా ముందుకు వెళ్లండి, పరీక్షా కాలంలో ఓపిక, పరిహారాల ఆసరా తీసుకోండి. జ్యోతిష్యం దారి చూపిస్తుంది; నడవాల్సింది మీరే.","kn":"ಈ ದಶಕದಲ್ಲಿ ಶುಭ ವರ್ಷಗಳೂ ಪರೀಕ್ಷಿಸುವ ವರ್ಷಗಳೂ ಎರಡೂ ಇವೆ — ಪ್ರತಿ ಬದುಕಿನಲ್ಲೂ ಇರುವಂತೆ. ಒಳ್ಳೆಯ ವರ್ಷಗಳಲ್ಲಿ ಧೈರ್ಯದಿಂದ ಮುಂದೆ ಹೋಗಿ, ಪರೀಕ್ಷೆಯ ಕಾಲದಲ್ಲಿ ತಾಳ್ಮೆ ಮತ್ತು ಪರಿಹಾರಗಳ ಆಸರೆ ಪಡೆಯಿರಿ. ಜ್ಯೋತಿಷ್ಯ ದಾರಿ ತೋರಿಸುತ್ತದೆ; ನಡೆಯಬೇಕಾದವರು ನೀವೇ.","ta":"இந்த தசாப்தம் சுபமான, சோதனையான ஆண்டுகளைக் கலந்திருக்கிறது — ஒவ்வொரு வாழ்க்கையையும் போலவே. பிரகாசமான ஆண்டுகளில் தைரியமாக நகருங்கள், சோதனையான ஆண்டுகளில் பொறுமையையும் பரிகாரங்களையும் சார்ந்திருங்கள். ஜோதிடம் பாதையைக் காட்டுகிறது; நடப்பது உங்கள் கையில்.","bn":"এই দশকে শুভ আর পরীক্ষার বছর মিলেমিশে আছে — প্রতিটি জীবনেই যেমন থাকে। উজ্জ্বল বছরগুলিতে সাহস নিয়ে এগোন, পরীক্ষার বছরে ধৈর্য আর প্রতিকারের উপর ভরসা রাখুন। জ্যোতিষ পথ দেখায়; হাঁটাটা আপনারই।","mr":"या दशकात शुभ आणि परीक्षा घेणारी वर्षे मिसळलेली आहेत — प्रत्येक आयुष्यात असतात तशीच. तेजस्वी वर्षांत धैर्याने पुढे जा, परीक्षेच्या वर्षांत संयम आणि परिहारांवर भरवसा ठेवा. ज्योतिष वाट दाखवते; चालणे तुमचेच."},"yearRange":{"en":"A forecast cannot begin in a past year. Please choose the current year or later.","hi":"भविष्यफल बीते हुए साल से शुरू नहीं हो सकता। कृपया मौजूदा साल या उसके बाद का साल चुनें।","te":"భవిష్యఫలం గడిచిన సంవత్సరం నుండి మొదలవదు. దయచేసి ప్రస్తుత సంవత్సరం లేదా తర్వాతిది ఎంచుకోండి.","kn":"ಭವಿಷ್ಯಫಲ ಕಳೆದ ವರ್ಷದಿಂದ ಆರಂಭವಾಗುವುದಿಲ್ಲ. ದಯವಿಟ್ಟು ಪ್ರಸ್ತುತ ವರ್ಷ ಅಥವಾ ನಂತರದ್ದನ್ನು ಆರಿಸಿ.","ta":"கடந்த ஆண்டிலிருந்து பலன் தொடங்க முடியாது. நடப்பு ஆண்டு அல்லது அதற்குப் பிறகான ஆண்டைத் தேர்ந்தெடுங்கள்.","bn":"গত বছর থেকে ভবিষ্যদ্বাণী শুরু হতে পারে না। চলতি বছর বা তার পরের কোনো বছর বেছে নিন।","mr":"गेल्या वर्षापासून भविष्य सुरू होऊ शकत नाही. कृपया चालू वर्ष किंवा त्यानंतरचे वर्ष निवडा."}},"annual":{"turningAge":{"en":"Turning age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು","ta":"நிறைவடையும் வயது","bn":"যে বয়সে পা দিচ্ছেন","mr":"पूर्ण होणारे वय"},"confirmVarsha":{"en":"Varshaphal (check AM/PM)","hi":"का वर्षफल बनाएँ (AM/PM जाँचें)","te":"వర్షఫలం తయారు చేయండి (AM/PM చూడండి)","kn":"ವರ್ಷಫಲ ತಯಾರಿಸಿ (AM/PM ಪರಿಶೀಲಿಸಿ)","ta":"வர்ஷபலன் (AM/PM சரிபார்க்கவும்)","bn":"বর্ষফল (AM/PM মিলিয়ে নিন)","mr":"वर्षफल (AM/PM तपासा)"},"confirmPre":{"en":"If correct, generate ","hi":"सही हो तो ","te":"సరిగ్గా ఉంటే ","kn":"ಸರಿಯಾಗಿದ್ದರೆ ","ta":"சரியெனில், உருவாக்கு ","bn":"ঠিক থাকলে তৈরি করুন ","mr":"बरोबर असेल तर तयार करा "},"planet":{"en":"Planet","hi":"ग्रह","te":"గ్రహం","kn":"ಗ್ರಹ","ta":"கிரகம்","bn":"গ্রহ","mr":"ग्रह"},"sign":{"en":"Sign","hi":"राशि","te":"రాశి","kn":"ರಾಶಿ","ta":"ராசி","bn":"রাশি","mr":"राशी"},"houseCol":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव"},"nakshatraCol":{"en":"Nakshatra","hi":"नक्षत्र","te":"నక్షత్రం","kn":"ನಕ್ಷತ್ರ","ta":"நட்சத்திரம்","bn ಂಶ ಒಂದೇ ನೋಟದಲ್ಲಿ — ಕೆಳಗಿನ ಪ್ರತಿ ರೇಟಿಂಗ್ ಕೂಡ ನಿಮ್ಮ ನಿಜವಾದ ಗ್ರಹ ಸ್ಥಿತಿಗಳು, ಭಾವ ಬಲಗಳು (ಅಷ್ಟಕವರ್ಗ), ಯೋಗಗಳ ಆಧಾರದ ಮೇಲೆ ಬಂದಿದೆ. ಯಾವುದೂ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ.","ta":"உங்கள் ஜாதகத்தின் சாரம் ஒரே பார்வையில் — கீழே உள்ள ஒவ்வொரு மதிப்பீடும் உங்கள் உண்மையான கிரக நிலைகள், பாவ பலங்கள் (அஷ்டகவர்க்கம்), யோகங்களின் அடிப்படையில் வந்தது. எதுவும் கற்பனையானது அல்ல.","bn":"এক নজরে আপনার কোষ্ঠীর সারকথা — নিচের প্রতিটি মূল্যায়ন এসেছে আপনার প্রকৃত গ্রহবল, ভাববল (অষ্টকবর্গ) আর যোগ থেকে। কিছুই কল্পনা করে লেখা নয়।","mr":"एका दृष्टिक्षेपात तुमच्या पत्रिकेचे सार — खालील प्रत्येक मूल्यमापन तुमच्या प्रत्यक्ष ग्रहस्थिती, भावबल (अष्टकवर्ग) आणि योगांवर आधारित आहे. काहीही काल्पनिक नाही."},"k004":{"en":"YOUR STRONGEST QUALITIES","hi":"आपकी प्रबल शक्तियाँ","te":"మీ బలమైన లక్షణాలు","kn":"ನಿಮ್ಮ ಪ್ರಬಲ ಗುಣಗಳು","ta":"உங்கள் பலமான குணங்கள்","bn":"আপনার সবচেয়ে শক্তিশালী গুণ","mr":"तुमचे सर्वात बलवान गुण"},"k005":{"en":"CURRENT LIFE PHASE","hi":"वर्तमान जीवन-चरण","te":"ప్రస్తుత జీవిత దశ","kn":"ಪ್ರಸ್ತುತ ಜೀವನ ಹಂತ","ta":"தற்போதைய வாழ்க்கை நிலை","bn":"বর্তমান জীবনদশা","mr":"सध्याचा जीवनकाळ"},"k006":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ","ta":"மகாதசை","bn":"মহাদশা","mr":"महादशा"},"k007":{"en":"Antar","hi":"अंतर","te":"అంతర్దశ","kn":"ಅಂತರ್ದಶಾ","ta":"அந்தர்தசை","bn":"অন্তর্দশা","mr":"अंतर्दशा"},"k008":{"en":"OVERALL LIFE ENERGY","hi":"समग्र जीवन-ऊर्जा","te":"మొత్తం జీవన శక్తి","kn":"ಒಟ್ಟು ಜೀವನ ಶಕ್ತಿ","ta":"ஒட்டுமொத்த வாழ்க்கை சக்தி","bn":"সামগ্রিক জীবনশক্তি","mr":"एकूण जीवनशक्ती"},"k009":{"en":"Formula: Ashtakavarga strength of your 1st, 9th and 10th houses + auspicious yogas + planetary dignities — every input verifiable in the chapters ahead.","hi":"सूत्र: लग्न-भाग्य-कर्म भावों का अष्टकवर्ग बल + शुभ योग","te":"సూత్రం: మీ 1వ, 9వ, 10వ భావాల అష్టకవర్గ బలం + శుభ యోగాలు + గ్రహ స్థితులు — ప్రతి అంశాన్నీ ముందున్న అధ్యాయాల్లో సరిచూసుకోవచ్చు.","kn":"ಸೂತ್ರ: ನಿಮ್ಮ 1, 9, 10ನೇ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಶುಭ ಯೋಗಗಳು + ಗ್ರಹ ಸ್ಥಿತಿಗಳು — ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು.","ta":"சூத்திரம்: உங்கள் 1, 9, 10ஆம் பாவங்களின் அஷ்டகவர்க்க பலம் + சுப யோகங்கள் + கிரக நிலைகள் — ஒவ்வொரு அம்சத்தையும் அடுத்த அத்தியாயங்களில் சரிபார்த்துக் கொள்ளலாம்.","bn":"সূত্র: আপনার 1, 9 ও 10 নম্বর ভাবের অষ্টকবর্গ বল + শুভ যোগ + গ্রহবল — প্রতিটি উপাদান পরের অধ্যায়গুলিতে মিলিয়ে দেখা যায়।","mr":"सूत्र: तुमच्या 1, 9 आणि 10 व्या भावांचे अष्टकवर्ग बल + शुभ योग + ग्रहस्थिती — प्रत्येक घटक पुढील अध्यायांत तपासून पाहता येतो."},"k010":{"en":"Career","hi":"करियर","te":"కెరీర్","kn":"ಕೆರಿಯರ್","ta":"தொழில்","bn":"কর্মজীবন","mr":"करिअर"},"k011":{"en":"Marriage & Love","hi":"विवाह व संबंध","te":"వివాహం, ప్రేమ","kn":"ಮದುವೆ, ಪ್ರೀತಿ","ta":"திருமணம், அன்பு","bn":"বিয়ে ও ভালোবাসা","mr":"विवाह आणि प्रेम"},"k012":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು","ta":"செல்வம்","bn":"সম্পদ","mr":"संपत्ती"},"k013":{"en":"Health & Vitality","hi":"स्वास्थ्य","te":"ఆరోగ్యం, శక్తి","kn":"ಆರೋಗ್ಯ, ಶಕ್ತಿ","ta":"ஆரோக்கியம், சக்தி","bn":"স্বাস্থ্য ও শক্তি","mr":"आरोग्य आणि शक्ती"},"k014":{"en":"Learning & Children","hi":"विद्या-संतान","te":"విద్య, సంతానం","kn":"ವಿದ್ಯೆ, ಮಕ್ಕಳು","ta":"கல்வி, குழந்தைகள்","bn":"শিক্ষা ও সন্তান","mr":"शिक्षण आणि संतती"},"k015":{"en":"Spiritual Growth","hi":"आध्यात्म","te":"ఆధ్యాత్మిక ఎదుగుదల","kn":"ಆಧ್ಯಾತ್ಮಿಕ ಬೆಳವಣಿಗೆ","ta":"ஆன்மிக வளர்ச்சி","bn":"আধ্যাত্মিক উন্নতি","mr":"आध्यात्मिक वाढ"},"k016":{"en":"Your Life Dashboard","hi":"जीवन डैशबोर्ड","te":"మీ జీవిత డాష్‌బోర్డ్","kn":"ನಿಮ್ಮ ಜೀವನ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್","ta":"உங்கள் வாழ்க்கை பார்வை","bn":"আপনার জীবনের সারচিত্র","mr":"तुमच्या आयुष्याचा आढावा"},"k017":{"en":"Each score = Ashtakavarga strength of the relevant houses + house-lord dignity + karaka planet condition. Every input is verifiable in the tables that follow — no score is invented.","hi":"प्रत्येक अंक = संबंधित भावों का अष्टकवर्ग बल + भावेश गरिमा + कारक ग्रह स्थिति — सभी आंकड़े आगे की सारणियों में सत्यापन-योग्य।","te":"ప్రతి స్కోరు = సంబంధిత భావాల అష్టకవర్గ బలం + భావాధిపతి స్థితి + కారక గ్రహ స్థితి. ప్రతి అంశాన్నీ తర్వాతి పట్టికల్లో సరిచూసుకోవచ్చు — ఏ స్కోరూ ఊహించి రాసినది కాదు.","kn":"ಪ್ರತಿ ಸ್ಕೋರ್ = ಸಂಬಂಧಿತ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಭಾವಾಧಿಪತಿಯ ಸ್ಥಿತಿ + ಕಾರಕ ಗ್ರಹದ ಸ್ಥಿತಿ. ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಕೋಷ್ಟಕಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು — ಯಾವ ಸ್ಕೋರ್ ಕೂಡ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ.","ta":"ஒவ்வொரு மதிப்பெண்ணும் = சம்பந்தப்பட்ட பாவங்களின் அஷ்டகவர்க்க பலம் + பாவாதிபதி நிலை + காரக கிரக நிலை. ஒவ்வொரு அம்சத்தையும் அடுத்து வரும் அட்டவணைகளில் சரிபார்த்துக் கொள்ளலாம் — எந்த மதிப்பெண்ணும் கற்பனையானது அல்ல.","bn":"প্রতিটি স্কোর = সংশ্লিষ্ট ভাবের অষ্টকবর্গ বল + ভাবাধিপতির অবস্থা + কারক গ্রহের অবস্থা। প্রতিটি উপাদান পরের সারণিগুলিতে মিলিয়ে দেখা যায় — কোনো স্কোরই বানানো নয়।","mr":"प्रत्येक गुण = संबंधित भावांचे अष्टकवर्ग बल + भावाधिपतीची स्थिती + कारक ग्रहाची स्थिती. प्रत्येक घटक पुढील तक्त्यांत तपासता येतो — कोणताही गुण काल्पनिक नाही."},"k018":{"en":"Table of Contents","hi":"विषय-सूची","te":"విషయ సూచిక","kn":"ಪರಿವಿಡಿ","ta":"பொருளடக்கம்","bn":"সূচিপত্র","mr":"अनुक्रमणिका"},"k019":{"en":"Graha","hi":"ग्रह","te":"గ్రహం","kn":"ಗ್ರಹ","ta":"கிரகம்","bn":"গ্রহ","mr":"ग्रह"},"k020":{"en":"Nakshatra","hi":"नक्षत्र","te":"నక్షత్రం","kn":"ನಕ್ಷತ್ರ","ta":"நட்சத்திரம்","bn":"নক্ষত্র","mr":"नक्षत्र"},"k021":{"en":"Retro","hi":"वक्री","te":"వక్రం","kn":"ವಕ್ರ","ta":"வக்ரம்","bn":"বক্রী","mr":"वक्री"},"k022":{"en":"Combust","hi":"अस्त","te":"అస్తం","kn":"ಅಸ್ತ","ta":"அஸ்தம்","bn":"অস্ত","mr":"अस्त"},"k023":{"en":"Houses scoring 30+ are your power zones; those below 22 reward conscious effort. (Grand total 337 — the classical checksum.)","hi":"30+ बिंदु वाले भाव जीवन के प्रबल क्षेत्र हैं; 22 से कम वाले भावों में सचेत प्रयास फलदायी होता है। (कुल 337 — शास्त्रीय मानक)","te":"30కి పైగా బిందువులున్న భావాలు మీ బలమైన రంగాలు; 22 కంటే తక్కువ ఉన్నవి శ్రద్ధతో కృషి చేస్తే ఫలిస్తాయి. (మొత్తం 337 — శాస్త్రీయ లెక్క.)","kn":"30ಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಿಂದುಗಳಿರುವ ಭಾವಗಳು ನಿಮ್ಮ ಬಲದ ಕ್ಷೇತ್ರಗಳು; 22ಕ್ಕಿಂತ ಕಡಿಮೆ ಇರುವವು ಶ್ರದ್ಧೆಯಿಂದ ಶ್ರಮಿಸಿದರೆ ಫಲ ಕೊಡುತ್ತವೆ. (ಒಟ್ಟು 337 — ಶಾಸ್ತ್ರೀಯ ಲೆಕ್ಕ.)","ta":"30க்கு மேல் பிந்துக்கள் உள்ள பாவங்கள் உங்கள் பலமான பகுதிகள்; 22க்கும் குறைவானவை கவனமான முயற்சியால் பலன் தரும். (மொத்தம் 337 — சாஸ்திரக் கணக்கு.)","bn":"30-এর বেশি বিন্দুযুক্ত ভাবগুলিই আপনার শক্তির জায়গা; 22-এর নিচে যেগুলি, সেখানে সচেতন চেষ্টা ফল দেয়। (মোট 337 — শাস্ত্রীয় হিসাব।)","mr":"30 पेक्षा जास्त बिंदू असलेले भाव तुमची बलस्थाने; 22 पेक्षा कमी असलेल्यांना जाणीवपूर्वक प्रयत्न लागतात. (एकूण 337 — शास्त्रीय हिशेब.)"},"k024":{"en":"House ","hi":"भाव ","te":"భావం ","kn":"ಭಾವ ","ta":"பாவம் ","bn":"ভাব ","mr":"भाव "},"k025":{"en":"bindus","hi":"बिंदु","te":"బిందువులు","kn":"ಬಿಂದುಗಳು","ta":"பிந்துக்கள்","bn":"বিন্দু","mr":"बिंदू"},"k026":{"en":"House-Strength Reading (Sarvashtakavarga)","hi":"भाव-बल विवेचन (सर्वाष्टकवर्ग)","te":"భావ బల విశ్లేషణ (సర్వాష్టకవర్గం)","kn":"ಭಾವ ಬಲ ವಿಶ್ಲೇಷಣೆ (ಸರ್ವಾಷ್ಟಕವರ್ಗ)","ta":"பாவ பல ஆய்வு (சர்வாஷ்டகவர்க்கம்)","bn":"ভাববল বিশ্লেষণ (সর্বাষ্টকবর্গ)","mr":"भावबल विश्लेषण (सर्वाष्टकवर्ग)"},"k027":{"en":"Retrograde","hi":"वक्री","te":"వక్ర గతి","kn":"ವಕ್ರ ಗತಿ","ta":"வக்ர கதி","bn":"বক্রগতি","mr":"वक्री गती"},"k028":{"en":"Combust","hi":"अस्त","te":"అస్తంగతం","kn":"ಅಸ್ತಂಗತ","ta":"அஸ்தங்கதம்","bn":"অস্তগত","mr":"अस्तंगत"},"k029":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव"},"k030":{"en":"Planet Strength Cards","hi":"ग्रह-शक्ति कार्ड","te":"గ్రహ బల కార్డులు","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು","ta":"கிரக பல அட்டைகள்","bn":"গ্রহবল কার্ড","mr":"ग्रहबल कार्ड"},"k031":{"en":"Star ratings derived from dignity + Ashtakavarga + combustion state.","hi":"तारांकन = गरिमा + अष्टकवर्ग + अस्त/वक्री स्थिति से","te":"స్థితి + అష్టకవర్గం + అస్తంగత స్థితి ఆధారంగా ఇచ్చిన నక్షత్ర రేటింగ్‌లు.","kn":"ಸ್ಥಿತಿ + ಅಷ್ಟಕವರ್ಗ + ಅಸ್ತಂಗತ ಸ್ಥಿತಿಯ ಆಧಾರದ ಮೇಲೆ ನೀಡಿದ ನಕ್ಷತ್ರ ರೇಟಿಂಗ್‌ಗಳು.","ta":"நிலை + அஷ்டகவர்க்கம் + அஸ்தங்கத நிலையின் அடிப்படையில் தரப்பட்ட நட்சத்திர மதிப்பீடுகள்.","bn":"গ্রহবল, অষ্টকবর্গ ও অস্ত অবস্থা থেকে পাওয়া তারকা রেটিং।","mr":"स्थिती, अष्टकवर्ग आणि अस्तंगत स्थितीवरून दिलेली तारांकित मूल्यमापने."},"k032":{"en":"Planet Strength Cards (contd.)","hi":"ग्रह-शक्ति कार्ड (क्रमशः)","te":"గ్రహ బల కార్డులు (కొనసాగింపు)","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು (ಮುಂದುವರಿಕೆ)","ta":"கிரக பல அட்டைகள் (தொடர்ச்சி)","bn":"গ্রহবল কার্ড (চলছে)","mr":"ग्रहबल कार्ड (पुढे चालू)"},"k033":{"en":"no planets","hi":"कोई ग्रह नहीं","te":"గ్రహాలు లేవు","kn":"ಗ್ರಹಗಳಿಲ್ಲ","ta":"கிரகங்கள் இல்லை","bn":"কোনো গ্রহ নেই","mr":"ग्रह नाहीत"},"k034":{"en":"Lord","hi":"भावेश","te":"అధిపతి","kn":"ಅಧಿಪತಿ","ta":"அதிபதி","bn":"অধিপতি","mr":"अधिपती"},"k035":{"en":"house","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव"},"k036":{"en":"Occupants","hi":"स्थित ग्रह","te":"ఉన్న గ్రహాలు","kn":"ಇರುವ ಗ್ರಹಗಳು","ta":"உள்ள கிரகங்கள்","bn":"অবস্থানকারী গ্রহ","mr":"असलेले ग्रह"},"k037":{"en":"The Twelve Bhavas — Domains of Life","hi":"द्वादश भाव — जीवन के बारह क्षेत्र","te":"పన్నెండు భావాలు — జీవిత రంగాలు","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು — ಜೀವನದ ಕ್ಷೇತ್ರಗಳು","ta":"பன்னிரண்டு பாவங்கள் — வாழ்க்கைப் பகுதிகள்","bn":"দ্বাদশ ভাব — জীবনের ক্ষেত্রসমূহ","mr":"बारा भाव — आयुष्याची क्षेत्रे"},"k038":{"en":"Twelve Bhavas (contd.)","hi":"द्वादश भाव (क्रमशः)","te":"పన్నెండు భావాలు (కొనసాగింపు)","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು (ಮುಂದುವರಿಕೆ)","ta":"பன்னிரண்டு பாவங்கள் (தொடர்ச்சி)","bn":"দ্বাদশ ভাব (চলছে)","mr":"बारा भाव (पुढे चालू)"},"k039":{"en":"Ancient Note","hi":"प्राचीन संकेत","te":"ప్రాచీన విశేషం","kn":"ಪ್ರಾಚೀನ ವಿಶೇಷ","ta":"பாரம்பரியக் குறிப்பு","bn":"শাস্ত্রীয় টীকা","mr":"पारंपरिक टीप"},"k040":{"en":"The Sarvashtakavarga of every chart always totals exactly 337 bindus — verified in your own tables here; count them yourself!","hi":"अष्टकवर्ग का सर्वयोग सदा 337 बिंदु होता है — यह आपकी रिपोर्ट में भी सत्यापित है, गिनकर देख सकते हैं!","te":"ఏ జాతకంలోనైనా సర్వాష్టకవర్గం మొత్తం సరిగ్గా 337 బిందువులే — మీ పట్టికల్లోనే సరిచూసుకోవచ్చు; మీరే లెక్కించి చూడండి!","kn":"ಯಾವುದೇ ಜಾತಕದಲ್ಲೂ ಸರ್ವಾಷ್ಟಕವರ್ಗದ ಒಟ್ಟು ನಿಖರವಾಗಿ 337 ಬಿಂದುಗಳೇ — ನಿಮ್ಮ ಕೋಷ್ಟಕಗಳಲ್ಲೇ ಪರಿಶೀಲಿಸಬಹುದು; ನೀವೇ ಲೆಕ್ಕ ಹಾಕಿ ನೋಡಿ!","ta":"எந்த ஜாதகத்திலும் சர்வாஷ்டகவர்க்கம் மொத்தம் சரியாக 337 பிந்துக்களே — உங்கள் அட்டவணைகளிலேயே சரிபார்த்துக் கொள்ளலாம்; நீங்களே எண்ணிப் பாருங்கள்!","bn":"যেকোনো কোষ্ঠীর সর্বাষ্টকবর্গের মোট সবসময় ঠিক 337 বিন্দু — আপনার নিজের সারণিতেই মিলিয়ে দেখুন, নিজে গুনে দেখুন!","mr":"कोणत्याही पत्रिकेत सर्वाष्टकवर्गाची बेरीज नेमकी 337 बिंदूच येते — तुमच्याच तक्त्यांत तपासून पाहा; स्वतः मोजा!"},"k041":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव"},"k042":{"en":"Graha Phala — House Placements","hi":"ग्रह फल — भाव स्थिति","te":"గ్రహ ఫలం — భావ స్థితులు","kn":"ಗ್ರಹ ಫಲ — ಭಾವ ಸ್ಥಿತಿಗಳು","ta":"கிரக பலன் — பாவ நிலைகள்","bn":"গ্রহফল — ভাবে অবস্থান","mr":"ग्रहफल — भावस्थिती"},"k043":{"en":"Graha Phala (contd.)","hi":"ग्रह फल (क्रमशः)","te":"గ్రహ ఫలం (కొనసాగింపు)","kn":"ಗ್ರಹ ಫಲ (ಮುಂದುವರಿಕೆ)","ta":"கிரக பலன் (தொடர்ச்சி)","bn":"গ্রহফল (চলছে)","mr":"ग्रहफल (पुढे चालू)"},"k044":{"en":"Did You Know?","hi":"क्या आप जानते हैं?","te":"మీకు తెలుసా?","kn":"ನಿಮಗೆ ಗೊತ್ತೇ?","ta":"உங்களுக்குத் தெரியுமா?","bn":"জানেন কি?","mr":"तुम्हाला माहीत आहे का?"},"k045":{"en":"In the Parashara tradition, Venus rules the longest mahadasha (20 years) and the Sun the shortest (6 years) — the full cycle spans exactly 120 years.","hi":"पराशर परंपरा में शुक्र की महादशा सबसे लंबी (20 वर्ष) और सूर्य की सबसे छोटी (6 वर्ष) होती है — पूरा चक्र ठीक 120 वर्ष का है।","te":"పరాశర సంప్రదాయంలో శుక్రుడికి అత్యధిక మహాదశ (20 సంవత్సరాలు), సూర్యుడికి అత్యల్పం (6 సంవత్సరాలు) — మొత్తం చక్రం సరిగ్గా 120 సంవత్సరాలు.","kn":"ಪರಾಶರ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಶುಕ್ರನಿಗೆ ಅತಿ ಹೆಚ್ಚು ಮಹಾದಶಾ (20 ವರ್ಷ), ಸೂರ್ಯನಿಗೆ ಅತಿ ಕಡಿಮೆ (6 ವರ್ಷ) — ಒಟ್ಟು ಚಕ್ರ ನಿಖರವಾಗಿ 120 ವರ್ಷ.","ta":"பராசர சம்பிரதாயத்தில் சுக்கிரனுக்கு மிக நீண்ட மகாதசை (20 ஆண்டுகள்), சூரியனுக்கு மிகக் குறைவு (6 ஆண்டுகள்) — முழு சுழற்சி சரியாக 120 ஆண்டுகள்.","bn":"পরাশর মতে শুক্রের মহাদশা সবচেয়ে দীর্ঘ (20 বছর), সূর্যের সবচেয়ে ছোট (6 বছর) — পুরো চক্র ঠিক 120 বছরের।","mr":"पराशर परंपरेत शुक्राची महादशा सर्वात मोठी (20 वर्षे) आणि सूर्याची सर्वात लहान (6 वर्षे) — पूर्ण चक्र नेमके 120 वर्षांचे."},"k046":{"en":"Marriage Matching, done properly","hi":"विवाह मिलान गहन विश्लेषण","te":"వివాహ మ్యాచింగ్ — సరైన పద్ధతిలో","kn":"ವಿವಾಹ ಹೊಂದಾಣಿಕೆ — ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ","ta":"திருமணப் பொருத்தம் — சரியான முறையில்","bn":"বিবাহ মিলন, সঠিক পদ্ধতিতে","mr":"विवाह जुळणी, योग्य पद्धतीने"},"k047":{"en":"Free tools stop at the Guna score. The paid Marriage Report adds classical dosha-CANCELLATION analysis, two-chart Manglik matching and marriage-timing windows — what no free tool checks.","hi":"निःशुल्क गुण-मिलान अंक देता है। सशुल्क विवाह रिपोर्ट दोष-परिहार नियम, दोनों कुंडलियों का मंगल-मिलान और विवाह-समय खिड़कियाँ जोड़ती है — जो कोई निःशुल्क टूल नहीं जाँचता।","te":"ఉచిత సాధనాలు గుణ స్కోరు దగ్గరే ఆగిపోతాయి. చెల్లింపు వివాహ రిపోర్ట్ శాస్త్రీయ దోష-పరిహార విశ్లేషణ, రెండు జాతకాల కుజ దోష పరిశీలన, వివాహ శుభ సమయాలు కూడా ఇస్తుంది — ఏ ఉచిత సాధనమూ చూడని అంశాలు.","kn":"ಉಚಿತ ಸಾಧನಗಳು ಗುಣ ಸ್ಕೋರ್‌ನಲ್ಲೇ ನಿಲ್ಲುತ್ತವೆ. ಪಾವತಿಸಿದ ವಿವಾಹ ವರದಿ ಶಾಸ್ತ್ರೀಯ ದೋಷ-ಪರಿಹಾರ ವಿಶ್ಲೇಷಣೆ, ಎರಡೂ ಜಾತಕಗಳ ಕುಜ ದೋಷ ಪರಿಶೀಲನೆ, ವಿವಾಹಕ್ಕೆ ಶುಭ ಸಮಯಗಳನ್ನೂ ಕೊಡುತ್ತದೆ — ಯಾವ ಉಚಿತ ಸಾಧನವೂ ನೋಡದ ಅಂಶಗಳು.","ta":"இலவச கருவிகள் குண மதிப்பெண்ணோடு நின்றுவிடுகின்றன. கட்டணத் திருமண அறிக்கை சாஸ்திரப்படி தோஷ-பரிகார ஆய்வு, இரு ஜாதக செவ்வாய் தோஷ பரிசீலனை, திருமணத்திற்கான சுப காலங்கள் ஆகியவற்றையும் தருகிறது — எந்த இலவச கருவியும் பார்க்காத அம்சங்கள்.","bn":"বিনামূল্যের টুল গুণ স্কোরেই থেমে যায়। সবেতন বিবাহ রিপোর্টে থাকে শাস্ত্রীয় দোষ-খণ্ডন বিশ্লেষণ, দুই কোষ্ঠীর মঙ্গলদোষ বিচার আর বিয়ের শুভ সময় — যা কোনো বিনামূল্যের টুল দেখে না।","mr":"मोफत साधने गुण मेलनापाशीच थांबतात. सशुल्क विवाह अहवालात शास्त्रीय दोष-परिहार विश्लेषण, दोन्ही पत्रिकांचा मंगळ दोष विचार आणि विवाहासाठी शुभ काळ यांचाही समावेश आहे — जे कोणतेही मोफत साधन पाहत नाही."},"k048":{"en":"Classical significance","hi":"शास्त्रीय महत्त्व","te":"శాస్త్రీయ ప్రాముఖ్యత","kn":"ಶಾಸ್ತ್ರೀಯ ಮಹತ್ವ","ta":"சாஸ்திர முக்கியத்துவம்","bn":"শাস্ত্রীয় গুরুত্ব","mr":"शास्त्रीय महत्त्व"},"k049":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ","ta":"செவ்வாய் தோஷம்","bn":"মঙ্গলদোষ","mr":"मंगळ दोष"},"k050":{"en":"Kaal Sarpa","hi":"कालसर्प","te":"కాల సర్ప","kn":"ಕಾಲ ಸರ್ಪ","ta":"கால சர்ப்பம்","bn":"কালসর্প","mr":"कालसर्प"},"k051":{"en":"Sade Sati","hi":"साढ़े साती","te":"సాడే సాతి","kn":"ಸಾಡೇ ಸಾತಿ","ta":"ஏழரைச் சனி","bn":"সাড়েসাতি","mr":"साडेसाती"},"k052":{"en":"Phase","hi":"चरण","te":"దశ","kn":"ದಶಾ","ta":"நிலை","bn":"পর্যায়","mr":"टप्पा"},"k053":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ","ta":"மகாதசை","bn":"মহাদশা","mr":"महादशा"},"k054":{"en":"balance","hi":"शेष","te":"మిగిలిన కాలం","kn":"ಉಳಿದ ಕಾಲ","ta":"மீதமுள்ள காலம்","bn":"বাকি সময়","mr":"शिल्लक काळ"},"k055":{"en":"Today","hi":"आज","te":"ఈరోజు","kn":"ಇಂದು","ta":"இன்று","bn":"আজ","mr":"आज"},"k056":{"en":"Birth nakshatra","hi":"जन्म नक्षत्र","te":"జన్మ నక్షత్రం","kn":"ಜನ್ಮ ನಕ್ಷತ್ರ","ta":"பிறப்பு நட்சத்திரம்","bn":"জন্মনক্ষত্র","mr":"जन्मनक्षत्र"},"k057":{"en":"Period Predictions","hi":"दशा फल","te":"దశా ఫలితాలు","kn":"ದಶಾ ಫಲಗಳು","ta":"தசைப் பலன்கள்","bn":"দশাফল","mr":"दशाफल"},"k058":{"en":"Mahadasha and Antardasha, fully dated","hi":"महादशा एवं अंतर्दशा — तिथियों सहित","te":"మహాదశ, అంతర్దశ — పూర్తి తేదీలతో","kn":"ಮಹಾದಶಾ, ಅಂತರ್ದಶಾ — ಪೂರ್ಣ ದಿನಾಂಕಗಳೊಂದಿಗೆ","ta":"மகாதசை, அந்தர்தசை — முழு தேதிகளுடன்","bn":"মহাদশা ও অন্তর্দশা, সম্পূর্ণ তারিখসহ","mr":"महादशा आणि अंतर्दशा, संपूर्ण तारखांसह"},"k059":{"en":"Want decision-grade timing?","hi":"निर्णय-स्तर का समय जानना चाहते हैं?","te":"నిర్ణయాలకు సరిపోయే కచ్చితమైన సమయం కావాలా?","kn":"ನಿರ್ಧಾರಗಳಿಗೆ ಸರಿಯಾದ ನಿಖರ ಸಮಯ ಬೇಕೇ?","ta":"முடிவெடுக்கத் தகுந்த துல்லியமான நேரம் வேண்டுமா?","bn":"সিদ্ধান্ত নেওয়ার মতো নিখুঁত সময় চান?","mr":"निर्णय घेण्याइतकी अचूक वेळ हवी आहे?"},"k060":{"en":"This free report shows every dated period with general guidance. The paid 10-Year Deep Prediction weaves your specific house-lords, yogas and transits into each pratyantar — a personal consultant on paper.","hi":"यह निःशुल्क रिपोर्ट हर अवधि तिथियों सहित देती है। सशुल्क 10-वर्षीय गहन फलादेश प्रत्येक प्रत्यंतर में आपके भावेश-योग-गोचर बुनता है।","te":"ఈ ఉచిత రిపోర్ట్ ప్రతి కాలాన్నీ తేదీలతో, సాధారణ సూచనలతో చూపిస్తుంది. చెల్లింపు 10 సంవత్సరాల లోతైన అంచనా మీ భావాధిపతులు, యోగాలు, గోచారాలను ప్రతి ప్రత్యంతర దశలోనూ కలిపి చెబుతుంది — కాగితం మీద ఒక వ్యక్తిగత సలహాదారు.","kn":"ಈ ಉಚಿತ ವರದಿ ಪ್ರತಿ ಕಾಲವನ್ನೂ ದಿನಾಂಕಗಳೊಂದಿಗೆ, ಸಾಮಾನ್ಯ ಸೂಚನೆಗಳೊಂದಿಗೆ ತೋರಿಸುತ್ತದೆ. ಪಾವತಿಸಿದ 10 ವರ್ಷಗಳ ಆಳವಾದ ಅಂದಾಜು ನಿಮ್ಮ ಭಾವಾಧಿಪತಿಗಳು, ಯೋಗಗಳು, ಗೋಚಾರಗಳನ್ನು ಪ್ರತಿ ಪ್ರತ್ಯಂತರ ದಶೆಯಲ್ಲೂ ಸೇರಿಸಿ ಹೇಳುತ್ತದೆ — ಕಾಗದದ ಮೇಲೊಬ್ಬ ವೈಯಕ್ತಿಕ ಸಲಹೆಗಾರ.","ta":"இந்த இலவச அறிக்கை ஒவ்வொரு காலத்தையும் தேதிகளுடன், பொதுவான வழிகாட்டுதலுடன் காட்டுகிறது. கட்டண 10 ஆண்டு ஆழ்ந்த முன்னறிவிப்பு உங்கள் குறிப்பிட்ட பாவாதிபதிகள், யோகங்கள், கோசாரங்களை ஒவ்வொரு பிரத்யந்தரத்திலும் இணைத்துச் சொல்கிறது — காகிதத்தில் ஒரு தனிப்பட்ட ஆலோசகர்.","bn":"এই বিনামূল্যের রিপোর্টে প্রতিটি সময়কাল তারিখসহ, সাধারণ পরামর্শসহ দেওয়া আছে। সবেতন 10 বছরের গভীর ভবিষ্যদ্বাণীতে আপনার নিজস্ব ভাবাধিপতি, যোগ আর গোচর প্রতিটি প্রত্যন্তরে মিলিয়ে বলা হয় — কাগজে লেখা আপনার ব্যক্তিগত জ্যোতিষ পরামর্শদাতা।","mr":"हा मोफत अहवाल प्रत्येक काळ तारखांसह आणि सर्वसाधारण मार्गदर्शनासह दाखवतो. सशुल्क 10 वर्षांचे सखोल भविष्य तुमचे स्वतःचे भावाधिपती, योग आणि गोचर प्रत्येक प्रत्यंतरात जोडून सांगते — कागदावर लिहिलेला तुमचा वैयक्तिक ज्योतिष सल्लागार."},"k061":{"en":"Period Predictions — ","hi":"दशा फल — ","te":"దశా ఫలితాలు — ","kn":"ದಶಾ ಫಲಗಳು — ","ta":"தசைப் பலன்கள் — ","bn":"দশাফল — ","mr":"दशाफल — "},"k062":{"en":"Mahadasha (contd.)","hi":"महादशा (क्रमशः)","te":"మహాదశ (కొనసాగింపు)","kn":"ಮಹಾದಶಾ (ಮುಂದುವರಿಕೆ)","ta":"மகாதசை (தொடர்ச்சி)","bn":"মহাদশা (চলছে)","mr":"महादशा (पुढे चालू)"},"k063":{"en":"Detailed Period Predictions","hi":"सूक्ष्म दशा फल","te":"వివరమైన దశా ఫలితాలు","kn":"ವಿವರವಾದ ದಶಾ ಫಲಗಳು","ta":"விரிவான தசைப் பலன்கள்","bn":"বিস্তারিত দশাফল","mr":"सविस्तर दशाफल"},"k064":{"en":"Pratyantar level, lifetime coverage","hi":"प्रत्यंतर स्तर — जीवन-पर्यंत","te":"ప్రత్యంతర స్థాయి, జీవితకాల వివరాలు","kn":"ಪ್ರತ್ಯಂತರ ಮಟ್ಟ, ಜೀವಮಾನದ ವಿವರಗಳು","ta":"பிரத்யந்தர நிலை, வாழ்நாள் முழுவதும்","bn":"প্রত্যন্তর স্তর, সারাজীবনের হিসাব","mr":"प्रत्यंतर पातळी, संपूर्ण आयुष्यभर"},"k065":{"en":"In this period, ","hi":"इस अवधि में ","te":"ఈ కాలంలో, ","kn":"ಈ ಕಾಲದಲ್ಲಿ, ","ta":"இந்தக் காலத்தில், ","bn":"এই সময়ে, ","mr":"या काळात, "},"k066":{"en":"Guidance: ","hi":"मार्गदर्शन: ","te":"సూచన: ","kn":"ಸೂಚನೆ: ","ta":"வழிகாட்டுதல்: ","bn":" search no app offers.","hi":"सशुल्क मुहूर्त रिपोर्ट आपकी ताराबल-चंद्रबल सहित आने वाले महीनों को खोजकर गृह-प्रवेश, व्यापार या वाहन हेतु आपके सर्वोत्तम दिन निकालती है।","te":"చెల్లింపు ముహూర్త రిపోర్ట్ మీ తారాబలం, చంద్రబలం ఆధారంగా రాబోయే నెలలను వెతికి గృహ ప్రవేశం, వ్యాపారం లేదా వాహనం కోసం మీ వ్యక్తిగత శుభ దినాలను ఇస్తుంది — ఏ యాప్ ఇవ్వని వ్యక్తిగత శోధన.","kn":"ಪಾವತಿಸಿದ ಮುಹೂರ್ತ ವರದಿ ನಿಮ್ಮ ತಾರಾಬಲ, ಚಂದ್ರಬಲದ ಆಧಾರದ ಮೇಲೆ ಮುಂದಿನ ತಿಂಗಳುಗಳನ್ನು ಹುಡುಕಿ ಗೃಹ ಪ್ರವೇಶ, ವ್ಯಾಪಾರ ಅಥವಾ ವಾಹನಕ್ಕೆ ನಿಮ್ಮ ವೈಯಕ್ತಿಕ ಶುಭ ದಿನಗಳನ್ನು ಕೊಡುತ್ತದೆ — ಯಾವ ಆ್ಯಪ್ ಕೂಡ ಕೊಡದ ವೈಯಕ್ತಿಕ ಹುಡುಕಾಟ.","ta":"கட்டண முகூர்த்த அறிக்கை உங்கள் தாராபலம், சந்திரபலத்தின் அடிப்படையில் வரும் மாதங்களைத் தேடி, கிரகப் பிரவேசம், வணிகம் அல்லது வாகனத்திற்கான உங்கள் தனிப்பட்ட சுப தேதிகளைத் தருகிறது — எந்த ஆப்ஸும் தராத தனிப்பட்ட தேடல்.","bn":"সবেতন মুহূর্ত রিপোর্ট আপনার নিজের তারাবল আর চন্দ্রবল ধরে সামনের মাসগুলি খুঁজে গৃহপ্রবেশ, ব্যবসা বা গাড়ির জন্য আপনার ব্যক্তিগত শুভ দিন বের করে — এমন ব্যক্তিগত অনুসন্ধান আর কোনো অ্যাপ দেয় না।","mr":"सशुल्क मुहूर्त अहवाल तुमचे स्वतःचे ताराबल आणि चंद्रबल घेऊन पुढील महिने शोधतो आणि गृहप्रवेश, व्यवसाय किंवा वाहनासाठी तुमचे वैयक्तिक शुभ दिवस काढतो — असा वैयक्तिक शोध दुसरे कोणतेही ॲप देत नाही."},"k077":{"en":"Transits and Yearly Outlook","hi":"गोचर एवं वार्षिक फल","te":"గోచారాలు, వార్షిక ఫలితం","kn":"ಗೋಚಾರಗಳು, ವಾರ್ಷಿಕ ಫಲ","ta":"கோசாரங்கள், ஆண்டு பலன்","bn":"গোচর ও বার্ষিক ফল","mr":"गोचर आणि वार्षिक फल"},"k078":{"en":"Jupiter, Saturn, Rahu — the years ahead","hi":"गुरु · शनि · राहु — आगामी वर्ष","te":"గురువు, శని, రాహువు — రాబోయే సంవత్సరాలు","kn":"ಗುರು, ಶನಿ, ರಾಹು — ಮುಂದಿನ ವರ್ಷಗಳು","ta":"குரு, சனி, ராகு — வரும் ஆண்டுகள்","bn":"বৃহস্পতি, শনি, রাহু — আগামী বছরগুলি","mr":"गुरु, शनि, राहू — पुढील वर्षे"},"k079":{"en":"House from Moon","hi":"चंद्र से भाव","te":"చంద్రుని నుండి భావం","kn":"ಚಂದ್ರನಿಂದ ಭಾವ","ta":"சந்திரனிலிருந்து பாவம்","bn":"চন্দ্র থেকে ভাব","mr":"चंद्रापासून भाव"},"k080":{"en":"Next 10 Years","hi":"आगामी 10 वर्ष","te":"రాబోయే 10 సంవత్సరాలు","kn":"ಮುಂದಿನ 10 ವರ್ಷಗಳು","ta":"அடுத்த 10 ஆண்டுகள்","bn": function southSVG(lagnaR,place,title){

  s+='<rect x="1" y="1" width="'+(W-2)+'" height="'+(W-2)+'" fill="#FFFDF6" stroke="#B8860B" stroke-width="2"/>';
  for(var r=0;r<12;r++){
    var p=SOUTH_POS[r],x=(p[1]-1)*cs,y=(p[0]-1)*cs;
    s+='<rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="'+(r===lagnaR?'#F8EFD8':'none')+'" stroke="#D4A843" stroke-width="1"/>';

    }
  }

  s+='<text x="'+(W/2)+'" y="'+(W/2+14)+'" text-anchor="middle" font-size="11" fill="#8B5A2B">'+U('brand.name')+'</text></svg>';

      +'<tr><th>'+U('kundli.k092')+'</th><td>'+multiTerm('colour',M.color)+'</td></tr>'
      +'<tr><th>'+U('kundli.k093')+'</th><td>'+multiTerm('deity',M.deity)+'</td></tr></table>');
  })();
  // ---- YEARLY PREDICTIONS (next 30 years, dasha + transit composed) ----
  (function(){
    var y0=new Date().getFullYear();
    var jt=PE.getTransitPeriods('jupiter',new Date(Date.UTC(y0,0,1)),new Date(Date.UTC(y0+30,0,10)));
    var st=PE.getTransitPeriods('saturn',new Date(Date.UTC(y0,0,1)),new Date(Date.UTC(y0+30,0,10)));
    function domHouse(segs,ys,ye){ // dominant rashi during the year -> house from moon
      var best=null,bl=0;
      segs.forEach(function(s2){
        var o=Math.min(s2.end.getTime(),ye)-Math.max(s2.start.getTime(),ys);
        if(o>bl){bl=o;best=s2.rashiIndex;}
      });
      return best===null?null:((best-moonR+12)%12);
    }
    function dashaOf(t){
      var md=dz.mahadashas.find(function(m2){return m2.start<=t&&m2.end>t;});
      if(!md)return null;
      var a=md.antardashas.find(function(a2){return a2.start<=t&&a2.end>t;});
      return {m:md.lord,a:a?a.lord:md.lord};
    }
    var yearBlocks=[];
    for(var y=y0;y<y0+30;y++){
      var ys=Date.UTC(y,0,1),ye=Date.UTC(y+1,0,1);
      var mid=new Date((ys+ye)/2);
      var dsh=dashaOf(mid);
      var jh=domHouse(jt,ys,ye),sh=domHouse(st,ys,ye);
      var blk='<div class="yog" style="border-left-color:#2B6B8B;background:#F5FAFD;">'
        +'<b style="font-size:16px;">'+y+'</b>'
        +(dsh?' <span style="font-size:12px;color:#8B5A2B;">— '+U('kundli.k094')+gname(dsh.m)+' / '+gname(dsh.a)+'</span>':'')+'<br>'
        +(jh!==null?('<b>'+U('kundli.k095')+':</b> '+T(C.jupTransit[jh])+'<br>'):'')
        +(sh!==null?('<b>'+U('kundli.k096')+':</b> '+T(C.satTransit[sh])):'')
        +'</div>';
      yearBlocks.push(blk);
    }
    for(var i=0;i<yearBlocks.length;i+=3){
      pg('<h2 class="sec">'+U('kundli.k097')+(y0+i)+' – '+Math.min(y0+i+2,y0+29)+'</h2>'+yearBlocks.slice(i,i+3).join(''));
    }
  })();
  cover(6,U('kundli.k098'),U('kundli.k099'));
  // ---- REMEDIES + FOOTER ----
  var glossRows=C.glossary.map(function(g4){return '<tr><th style="width:26%">'+term('glossTerm',g4.t)+'</th><td>'+T(g4)+'</td></tr>';});
  for(var gi=0;gi<glossRows.length;gi+=12){
    pg('<h2 class="sec">'+U('kundli.k100')+(glossRows.length>12?' ('+(Math.floor(gi/12)+1)+')':'')+'</h2><table>'+glossRows.slice(gi,gi+12).join('')+'</table>');
  }
  var remKeys=['sun','moon','mars','mercury','jupiter','venus','saturn','rahu','ketu'];
  var remH=remKeys.map(function(k){var r=C.remedy[k];return '<div class="rem"><div><b>'+(U('mantraLabel.'+k)||r.name)+'</b><br><span class="m">'+r.mantra+'</span></div><div>'+((window.SD_UI&&SD_UI.remedy&&SD_UI.remedy[k]&&SD_UI.remedy[k][LANG])||T(r))+'</div></div>';}).join('');
  pg('<h2 class="sec">\uD83D\uDE4F '+T(L.remedies)+'</h2><div class="prose" style="color:#5A8B2B;">'+T(L.remedyNote)+'</div>'+remH
    +'<div class="foot">'+T(L.verify)+'<br><b>'+U('brand.name')+' · shubhdin.app</b> · '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+'</div>');
  document.getElementById('report').innerHTML=H;
  var rep=document.getElementById('report');
  rep.className='lang-'+LANG;
  rep.setAttribute('lang',LANG);
  rep.style.display='block';
  document.getElementById('printbar').style.display='block';
  document.getElementById('inputScreen').style.display='none';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
