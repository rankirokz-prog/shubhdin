<!-- ══ SHUBHDIN KUNDLI-FLOW PREFILL v3 (append-only; re-apply if this file is regenerated) ══ -->
<script>
(function(){
  try{
    var d=JSON.parse(localStorage.getItem('shubhdin_kundli_details')||'null');
    if(d){
      function set(id,v){var e=document.getElementById(id);if(e&&v!==undefined&&v!==null&&v!==''){if(!e.value||id==='blat'||id==='blng')e.value=v;}}
      set('pname',d.name); set('pgender',d.gender);
      set('bdate',d.dob); set('btime',d.time); set('bplace',d.place);
      if(d.lat)set('blat',d.lat); if(d.lng)set('blng',d.lng);
    }
    var wantPdf =location.search.indexOf('autopdf=1')>-1;
    var wantView=location.search.indexOf('autoview=1')>-1;
    if((wantPdf||wantView)&&d){
      /* hide the form instantly + soft loader — no flash before the report */
      var isc=document.getElementById('inputScreen'); if(isc)isc.style.display='none';
      var ov=document.createElement('div');
      ov.id='sdAutoLoader';
      ov.style.cssText='position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(165deg,#0D0500,#241005);color:#E8BE5A;';
      ov.innerHTML='<div style="font-size:56px;font-family:serif;text-shadow:0 0 30px rgba(232,190,90,0.6);">ॐ</div>'
        +'<div style="margin-top:14px;font-size:14px;color:rgba(255,244,222,0.8);font-family:sans-serif;">आपकी कुंडली खुल रही है…</div>';
      document.body.appendChild(ov);
      var rmLoader=function(){var e=document.getElementById('sdAutoLoader');if(e)e.remove();};
      var lw=setInterval(function(){
        var rep=document.getElementById('report');
        if(rep&&rep.innerHTML&&rep.innerHTML.length>10000){clearInterval(lw);setTimeout(rmLoader,250);}
      },300);
      setTimeout(function(){clearInterval(lw);rmLoader();},25000);
      /* auto: confirm → generate → (print only in pdf mode) */
      setTimeout(function(){
        try{confirmStep();}catch(e){return;}
        setTimeout(function(){
          try{generate();}catch(e){return;}
          if(!wantPdf)return; /* view mode: stop here — report is on screen */
          var tries=0, pv=setInterval(function(){
            tries++;
            var rep=document.getElementById('report');
            var ready=rep&&rep.innerHTML&&rep.innerHTML.length>10000;
            if(ready){clearInterval(pv);setTimeout(function(){try{sdPrint();}catch(e){window.print();}},700);}
            else if(tries>40){clearInterval(pv);}
          },400);
        },350);
      },450);
    }
  }catch(e){}
})();
</script>
<!-- ══ END PREFILL ══ -->
