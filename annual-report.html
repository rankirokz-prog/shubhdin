় নেন, তারপর পুরোটাই শোধ করেন।","mr":"शनीचा काळ लांब आहे, आणि टिकणारे उभे करणाराही तोच. प्रगती संथ, जबाबदारी जड, आणि ओळख कमावल्यानंतर उशिरा येते. पण इथे उभे राहिलेले नंतर कोसळत नाही. शास्त्र याबद्दल स्पष्ट आहे: शनी वेळ घेतो, मग पूर्ण फेडतो.","gu":"શનિનો કાળ લાંબો છે, અને ટકે એવું બાંધનારો પણ એ જ. પ્રગતિ ધીમી, જવાબદારી ભારે, અને ઓળખ કમાયા પછી મોડી આવે છે. પણ અહીં બંધાયેલું પછી પડતું નથી. શાસ્ત્ર આ વિશે સ્પષ્ટ છે: શનિ સમય લે છે, પછી પૂરેપૂરું ચૂકવે છે.","as":"শনিৰ কাল দীঘলীয়া, আৰু যিটো টিকে সেয়া গঢ়াও সেইটোৱেই। উন্নতি লাহে, দায়িত্ব গধুৰ, আৰু স্বীকৃতি উপাৰ্জন কৰাৰ পিছত পলমকৈ আহে। কিন্তু ইয়াত গঢ় লোৱাটো পিছত ভাগি নপৰে। শাস্ত্ৰ ইয়াৰ বিষয়ে পোনপটীয়া: শনিয়ে সময় লয়, তাৰ পাছত সম্পূৰ্ণ শুজে।"},"rahu":{"en":"A Rahu period breaks the pattern. Foreign work, technology, unconventional routes, sudden jumps that surprise everyone including you. It rewards nerve and punishes shortcuts. Check the paperwork, keep the ethics clean, and this period can change your standing entirely.","hi":"राहु का काल ढर्रा तोड़ता है। विदेशी काम, प्रौद्योगिकी, अपरंपरागत रास्ते, अचानक छलाँगें जो आपको भी चौंका दें। यह हिम्मत को फल देता है और चोर रास्तों को दंड। कागज़ जाँचिए, नीयत साफ़ रखिए — यह काल आपकी हैसियत पूरी तरह बदल सकता है।","te":"రాహు కాలం అలవాటైన దారిని బద్దలు కొడుతుంది. విదేశీ పని, సాంకేతికత, సంప్రదాయేతర మార్గాలు, మిమ్మల్ని సహా అందరినీ ఆశ్చర్యపరిచే హఠాత్ ఎగబాకుడు. ఇది ధైర్యానికి ఫలమిస్తుంది, అడ్డదారులను శిక్షిస్తుంది. కాగితాలు పరిశీలించండి, నీతిని శుభ్రంగా ఉంచండి — ఈ కాలం మీ స్థానాన్ని పూర్తిగా మార్చగలదు.","kn":"ರಾಹು ಕಾಲ ರೂಢಿಯನ್ನು ಮುರಿಯುತ್ತದೆ. ವಿದೇಶಿ ಕೆಲಸ, ತಂತ್ರಜ್ಞಾನ, ಸಂಪ್ರದಾಯೇತರ ದಾರಿಗಳು, ನಿಮ್ಮನ್ನೂ ಸೇರಿಸಿ ಎಲ್ಲರನ್ನೂ ಆಶ್ಚರ್ಯಗೊಳಿಸುವ ಹಠಾತ್ ನೆಗೆತಗಳು. ಇದು ಧೈರ್ಯಕ್ಕೆ ಫಲ ಕೊಡುತ್ತದೆ, ಅಡ್ಡದಾರಿಗಳನ್ನು ಶಿಕ್ಷಿಸುತ್ತದೆ. ಕಾಗದಪತ್ರ ಪರಿಶೀಲಿಸಿ, ನೀತಿಯನ್ನು ಶುದ್ಧವಾಗಿಡಿ — ಈ ಕಾಲ ನಿಮ್ಮ ಸ್ಥಾನವನ್ನು ಸಂಪೂರ್ಣ ಬದಲಿಸಬಲ್ಲದು.","ta":"ராகு காலம் வழக்கத்தை உடைக்கிறது. வெளிநாட்டு வேலை, தொழில்நுட்பம், மரபுசாரா வழிகள், உங்களையும் சேர்த்து அனைவரையும் ஆச்சரியப்படுத்தும் திடீர் தாவல்கள். இது துணிவுக்குப் பலன் தருகிறது, குறுக்குவழிகளைத் தண்டிக்கிறது. ஆவணங்களைச் சரிபாருங்கள், நேர்மையைத் தூய்மையாக வையுங்கள் — இந்தக் காலம் உங்கள் நிலையை முற்றிலும் மாற்றக்கூடும்.","bn":"রাহুর কাল ছক ভাঙে। বিদেশি কাজ, প্রযুক্তি, অপ্রচলিত পথ, হঠাৎ লাফ যা আপনাকেও চমকে দেয়। এটি সাহসকে ফল দেয় আর শর্টকাটকে শাস্তি। কাগজপত্র যাচাই করুন, নীতি পরিষ্কার রাখুন — এই কাল আপনার অবস্থান পুরোপুরি বদলে দিতে পারে।","mr":"राहूचा काळ साचा मोडतो. परदेशी काम, तंत्रज्ञान, अपारंपरिक मार्ग, तुम्हालाही चकित करणाऱ्या अचानक उड्या. तो धैर्याला फळ देतो आणि शॉर्टकटला शिक्षा. कागदपत्रे तपासा, नीती स्वच्छ ठेवा — हा काळ तुमचे स्थान पूर्णपणे बदलू शकतो.","gu":"રાહુનો કાળ ઢાંચો તોડે છે. વિદેશી કામ, ટેકનોલોજી, અપરંપરાગત રસ્તા, તમને પણ ચોંકાવે એવી અચાનક છલાંગ. એ હિંમતને ફળ આપે છે અને ટૂંકા રસ્તાને સજા. કાગળો તપાસો, નીતિ સાફ રાખો — આ કાળ તમારું સ્થાન સંપૂર્ણ બદલી શકે છે.","as":"ৰাহুৰ কালে চিলাচালু ভাঙে। বিদেশী কাম, প্ৰযুক্তি, অপ্ৰচলিত বাট, আপোনাকো আচৰিত কৰা হঠাৎ জঁপ। ই সাহসক ফল দিয়ে আৰু চুটি বাটক শাস্তি। কাগজ-পত্ৰ পৰীক্ষা কৰক, নীতি চাফা ৰাখক — এই কালে আপোনাৰ স্থান সম্পূৰ্ণৰূপে সলনি কৰিব পাৰে।"},"ketu":{"en":"A Ketu period turns work inward. Research, specialisation, quiet expertise, sometimes a step back from visibility that later proves to have been the right move. Ambition feels thinner here — that is the period doing its work, not the career stalling.","hi":"केतु का काल काम को भीतर की ओर मोड़ता है। शोध, विशेषज्ञता, शांत निपुणता — कभी-कभी दिखने से एक कदम पीछे, जो बाद में सही सिद्ध होता है। यहाँ महत्वाकांक्षा पतली लगती है — यह काल का काम है, कर्मजीवन का रुकना नहीं।","te":"కేతు కాలం పనిని లోపలికి మళ్ళిస్తుంది. పరిశోధన, ప్రత్యేకత, నిశ్శబ్ద నైపుణ్యం — కొన్నిసార్లు కనిపించడం నుండి ఒక అడుగు వెనక్కి, అది తర్వాత సరైన నిర్ణయమని తేలుతుంది. ఇక్కడ ఆశయం పలుచగా అనిపిస్తుంది — అది ఈ కాలం చేసే పని, వృత్తి ఆగిపోవడం కాదు.","kn":"ಕೇತು ಕಾಲ ಕೆಲಸವನ್ನು ಒಳಮುಖವಾಗಿ ತಿರುಗಿಸುತ್ತದೆ. ಸಂಶೋಧನೆ, ವಿಶೇಷತೆ, ಮೌನ ಪರಿಣತಿ — ಕೆಲವೊಮ್ಮೆ ಕಾಣಿಸಿಕೊಳ್ಳುವುದರಿಂದ ಒಂದು ಹೆಜ್ಜೆ ಹಿಂದೆ, ಅದು ನಂತರ ಸರಿಯಾದ ನಿರ್ಧಾರವೆಂದು ಸಾಬೀತಾಗುತ್ತದೆ. ಇಲ್ಲಿ ಮಹತ್ವಾಕಾಂಕ್ಷೆ ತೆಳುವಾಗಿ ಅನಿಸುತ್ತದೆ — ಅದು ಈ ಕಾಲ ಮಾಡುವ ಕೆಲಸ, ವೃತ್ತಿ ನಿಂತುಹೋಗುವುದಲ್ಲ.","ta":"கேது காலம் வேலையை உள்முகமாகத் திருப்புகிறது. ஆராய்ச்சி, சிறப்புத்துறை, அமைதியான நிபுணத்துவம் — சில சமயம் தெரிவதிலிருந்து ஒரு அடி பின்வாங்கல், அது பின்னர் சரியான முடிவென நிரூபணமாகும். இங்கே லட்சியம் மெலிதாகத் தோன்றும் — அது இந்தக் காலம் செய்யும் வேலை, தொழில் நின்றுவிடுவதல்ல.","bn":"কেতুর কাল কাজকে ভিতরের দিকে ঘোরায়। গবেষণা, বিশেষজ্ঞতা, নীরব নৈপুণ্য — কখনও দৃশ্যমানতা থেকে এক পা পিছিয়ে, যা পরে সঠিক প্রমাণিত হয়। এখানে উচ্চাকাঙ্ক্ষা পাতলা লাগে — সেটা এই কালের কাজ, কর্মজীবন থেমে যাওয়া নয়।","mr":"केतूचा काळ काम आतल्या दिशेने वळवतो. संशोधन, विशेषज्ञता, शांत निपुणता — कधी दिसण्यापासून एक पाऊल मागे, जे नंतर योग्य ठरते. इथे महत्त्वाकांक्षा पातळ वाटते — ते या काळाचे काम आहे, कर्मजीवन थांबणे नव्हे.","gu":"કેતુનો કાળ કામને અંદરની તરફ વાળે છે. સંશોધન, વિશેષજ્ઞતા, શાંત નિપુણતા — ક્યારેક દેખાવાથી એક પગલું પાછળ, જે પછી સાચું ઠરે છે. અહીં મહત્ત્વાકાંક્ષા પાતળી લાગે છે — એ આ કાળનું કામ છે, કર્મજીવન અટકવું નહીં.","as":"কেতুৰ কালে কামক ভিতৰৰ ফালে ঘূৰায়। গৱেষণা, বিশেষজ্ঞতা, নিমাত নিপুণতা — কেতিয়াবা দেখা পোৱাৰ পৰা এখোজ পিছুৱাই, যিটো পিছত শুদ্ধ বুলি প্ৰমাণিত হয়। ইয়াত উচ্চাকাংক্ষা পাতল যেন লাগে — সেয়া এই কালৰ কাম, কৰ্মজীৱন ৰৈ যোৱা নহয়।"}},"dashaLbl":{"periodPage":{"en":"Period of {P}","hi":"{P} का काल","te":"{P} కాలం","kn":"{P} ಕಾಲ","ta":"{P} காலம்","bn":"{P}-এর কাল","mr":"{P}चा काळ","gu":"{P}નો કાળ","as":"{P}ৰ কাল"},"subPeriods":{"en":"Sub-periods within it","hi":"इसके भीतर के अंतर्काल","te":"దీనిలోని అంతర్దశలు","kn":"ಇದರೊಳಗಿನ ಅಂತರ್ದಶೆಗಳು","ta":"இதற்குள்ளான அந்தர்தசைகள்","bn":"এর ভিতরের অন্তর্দশা","mr":"यातील अंतर्दशा","gu":"એની અંદરની અંતર્દશા","as":"ইয়াৰ ভিতৰৰ অন্তৰ্দশা"}},"dsh":{"pageTitle":{"en":"{P} Period — What It Asks of Your Work","hi":"{P} की महादशा — यह आपके काम से क्या माँगती है","te":"{P} మహాదశ — ఇది మీ పని నుండి ఏమి కోరుతుంది","kn":"{P} ಮಹಾದಶಾ — ಇದು ನಿಮ್ಮ ಕೆಲಸದಿಂದ ಏನು ಕೇಳುತ್ತದೆ","ta":"{P} மகாதசை — இது உங்கள் வேலையிடம் என்ன கேட்கிறது","bn":"{P} মহাদশা — এটি আপনার কাজের কাছে কী চায়","mr":"{P} महादशा — ती तुमच्या कामाकडून काय मागते","gu":"{P} મહાદશા — એ તમારા કામ પાસેથી શું માંગે છે","as":"{P} মহাদশা — ই আপোনাৰ কামৰ পৰা কি বিচাৰে"},"subPeriods":{"en":"Sub-periods within it","hi":"इसके भीतर की अंतर्दशाएँ","te":"దీనిలోని అంతర్దశలు","kn":"ಇದರೊಳಗಿನ ಅಂತರ್ದಶೆಗಳು","ta":"இதனுள் வரும் அந்தர்தசைகள்","bn":"এর ভেতরের অন্তর্দশা","mr":"यातील अंतर्दशा","gu":"એની અંદરની અંતર્દશા","as":"ইয়াৰ ভিতৰৰ অন্তৰ্দশা"},"emphasis":{"en":"Emphasis","hi":"मुख्य ज़ोर","te":"ప్రధాన దృష్టి","kn":"ಮುಖ್ಯ ಗಮನ","ta":"முக்கியக் கவனம்","bn":"মূল জোর","mr":"मुख्य भर","gu":"મુખ્ય ભાર","as":"মূল গুৰুত্ব"},"guidance":{"en":"What helps","hi":"क्या काम आता है","te":"ఏది ఉపయోగపడుతుంది","kn":"ಏನು ಸಹಾಯ ಮಾಡುತ್ತದೆ","ta":"எது உதவும்","bn":"কী কাজে লাগে","mr":"काय उपयोगी पडते","gu":"શું કામ આવે છે","as":"কি কামত আহে"},"running":{"en":"Running now","hi":"अभी चल रही है","te":"ప్రస్తుతం నడుస్తోంది","kn":"ಈಗ ನಡೆಯುತ್ತಿದೆ","ta":"இப்போது நடக்கிறது","bn":"এখন চলছে","mr":"सध्या चालू आहे","gu":"હાલ ચાલુ છે","as":"এতিয়া চলি আছে"},"intro":{"en":"Vimshottari divides a life into planetary periods, and each period hands the work to a different graha. Below is the maha period itself, then every sub-period inside it that falls in your next ten years — with what each one emphasises and what tends to help during it.","hi":"विंशोत्तरी जीवन को ग्रहों के कालों में बाँटती है, और हर काल काम किसी अलग ग्रह को सौंपता है। नीचे पहले महादशा है, फिर उसके भीतर की हर वह अंतर्दशा जो आपके अगले दस वर्षों में पड़ती है — साथ में यह भी कि हर काल किस पर ज़ोर देता है और उसमें क्या काम आता है।","te":"వింశోత్తరి జీవితాన్ని గ్రహ కాలాలుగా విభజిస్తుంది, ప్రతి కాలం పనిని వేరే గ్రహానికి అప్పగిస్తుంది. క్రింద ముందుగా మహాదశ, ఆ తర్వాత మీ రాబోయే పదేళ్ళలో వచ్చే ప్రతి అంతర్దశ — ఏ కాలం దేనిపై దృష్టి పెడుతుందో, అందులో ఏది ఉపయోగపడుతుందో కూడా.","kn":"ವಿಂಶೋತ್ತರಿ ಬದುಕನ್ನು ಗ್ರಹ ಕಾಲಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ, ಪ್ರತಿ ಕಾಲವೂ ಕೆಲಸವನ್ನು ಬೇರೊಂದು ಗ್ರಹಕ್ಕೆ ಒಪ್ಪಿಸುತ್ತದೆ. ಕೆಳಗೆ ಮೊದಲು ಮಹಾದಶಾ, ನಂತರ ನಿಮ್ಮ ಮುಂದಿನ ಹತ್ತು ವರ್ಷಗಳಲ್ಲಿ ಬರುವ ಪ್ರತಿ ಅಂತರ್ದಶೆ — ಯಾವ ಕಾಲ ಯಾವುದಕ್ಕೆ ಒತ್ತು ನೀಡುತ್ತದೆ, ಅದರಲ್ಲಿ ಏನು ಸಹಾಯ ಮಾಡುತ್ತದೆ ಎಂಬುದರೊಂದಿಗೆ.","ta":"விம்சோத்தரி வாழ்க்கையைக் கிரக காலங்களாகப் பிரிக்கிறது, ஒவ்வொரு காலமும் வேலையை வேறொரு கிரகத்திடம் ஒப்படைக்கிறது. கீழே முதலில் மகாதசை, பிறகு உங்கள் அடுத்த பத்து ஆண்டுகளில் வரும் ஒவ்வொரு அந்தர்தசையும் — எந்தக் காலம் எதற்கு முக்கியத்துவம் தருகிறது, அதில் எது உதவும் என்பதுடன்.","bn":"বিংশোত্তরী জীবনকে গ্রহের কালে ভাগ করে, আর প্রতিটি কাল কাজটা অন্য এক গ্রহের হাতে দেয়। নিচে প্রথমে মহাদশা, তারপর তার ভেতরের সেই প্রতিটি অন্তর্দশা যা আপনার পরের দশ বছরে পড়ে — সঙ্গে কোন কাল কীসের উপর জোর দেয় এবং তাতে কী কাজে লাগে।","mr":"विंशोत्तरी आयुष्याला ग्रहांच्या काळांत विभागते, आणि प्रत्येक काळ काम वेगळ्या ग्रहाकडे सोपवतो. खाली आधी महादशा, मग तिच्यातील प्रत्येक अंतर्दशा जी तुमच्या पुढील दहा वर्षांत येते — सोबत कोणता काळ कशावर भर देतो आणि त्यात काय उपयोगी पडते.","gu":"વિંશોત્તરી જીવનને ગ્રહોના કાળમાં વહેંચે છે, અને દરેક કાળ કામ કોઈ બીજા ગ્રહને સોંપે છે. નીચે પહેલાં મહાદશા, પછી એની અંદરની દરેક અંતર્દશા જે તમારાં આવતાં દસ વર્ષમાં આવે છે — સાથે કયો કાળ શેના પર ભાર મૂકે છે અને એમાં શું કામ આવે છે.","as":"বিংশোত্তৰীয়ে জীৱনক গ্ৰহৰ কালত ভাগ কৰে, আৰু প্ৰতিটো কালে কামটো বেলেগ এটা গ্ৰহৰ হাতত দিয়ে। তলত প্ৰথমে মহাদশা, তাৰ পাছত ইয়াৰ ভিতৰৰ প্ৰতিটো অন্তৰ্দশা যিটো আপোনাৰ অহা দহ বছৰত পৰে — লগতে কোনটো কালে কিহৰ ওপৰত গুৰুত্ব দিয়ে আৰু তাত কি কামত আহে।"},"introV2":{"en":"Vimshottari divides a life into planetary periods, and each period hands the work to a different graha. Below is the maha period itself, then the sub-periods ahead within it — with what each one emphasises and what tends to help during it.","hi":"विंशोत्तरी जीवन को ग्रहों के कालों में बाँटती है, और हर काल काम किसी अलग ग्रह को सौंपता है। नीचे पहले महादशा है, फिर उसके भीतर आगे आने वाली अंतर्दशाएँ — साथ में यह भी कि हर काल किस पर ज़ोर देता है और उसमें क्या काम आता है।","te":"వింశోత్తరి జీవితాన్ని గ్రహ కాలాలుగా విభజిస్తుంది, ప్రతి కాలం పనిని వేరే గ్రహానికి అప్పగిస్తుంది. క్రింద ముందుగా మహాదశ, ఆ తర్వాత దానిలోని రాబోయే అంతర్దశలు — ఏ కాలం దేనిపై దృష్టి పెడుతుందో, అందులో ఏది ఉపయోగపడుతుందో కూడా.","kn":"ವಿಂಶೋತ್ತರಿ ಬದುಕನ್ನು ಗ್ರಹ ಕಾಲಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ, ಪ್ರತಿ ಕಾಲವೂ ಕೆಲಸವನ್ನು ಬೇರೊಂದು ಗ್ರಹಕ್ಕೆ ಒಪ್ಪಿಸುತ್ತದೆ. ಕೆಳಗೆ ಮೊದಲು ಮಹಾದಶಾ, ನಂತರ ಅದರೊಳಗಿನ ಮುಂದಿನ ಅಂತರ್ದಶೆಗಳು — ಯಾವ ಕಾಲ ಯಾವುದಕ್ಕೆ ಒತ್ತು ನೀಡುತ್ತದೆ, ಅದರಲ್ಲಿ ಏನು ಸಹಾಯ ಮಾಡುತ್ತದೆ ಎಂಬುದರೊಂದಿಗೆ.","ta":"விம்சோத்தரி வாழ்க்கையைக் கிரக காலங்களாகப் பிரிக்கிறது, ஒவ்வொரு காலமும் வேலையை வேறொரு கிரகத்திடம் ஒப்படைக்கிறது. கீழே முதலில் மகாதசை, பிறகு அதனுள் வரவிருக்கும் அந்தர்தசைகள் — எந்தக் காலம் எதற்கு முக்கியத்துவம் தருகிறது, அதில் எது உதவும் என்பதுடன்.","bn":"বিংশোত্তরী জীবনকে গ্রহের কালে ভাগ করে, আর প্রতিটি কাল কাজটা অন্য এক গ্রহের হাতে দেয়। নিচে প্রথমে মহাদশা, তারপর তার ভেতরের আসন্ন অন্তর্দশাগুলি — সঙ্গে কোন কাল কীসের উপর জোর দেয় এবং তাতে কী কাজে লাগে।","mr":"विंशोत्तरी आयुष्याला ग्रहांच्या काळांत विभागते, आणि प्रत्येक काळ काम वेगळ्या ग्रहाकडे सोपवतो. खाली आधी महादशा, मग तिच्यातील पुढील अंतर्दशा — सोबत कोणता काळ कशावर भर देतो आणि त्यात काय उपयोगी पडते.","gu":"વિંશોત્તરી જીવનને ગ્રહોના કાળમાં વહેંચે છે, અને દરેક કાળ કામ કોઈ બીજા ગ્રહને સોંપે છે. નીચે પહેલાં મહાદશા, પછી એની અંદરની આગામી અંતર્દશા — સાથે કયો કાળ શેના પર ભાર મૂકે છે અને એમાં શું કામ આવે છે.","as":"বিংশোত্তৰীয়ে জীৱনক গ্ৰহৰ কালত ভাগ কৰে, আৰু প্ৰতিটো কালে কামটো বেলেগ এটা গ্ৰহৰ হাতত দিয়ে। তলত প্ৰথমে মহাদশা, তাৰ পাছত ইয়াৰ ভিতৰৰ অহা অন্তৰ্দশাবোৰ — লগতে কোনটো কালে কিহৰ ওপৰত গুৰুত্ব দিয়ে আৰু তাত কি কামত আহে।"}},"trn":{"title":{"en":"Saturn & Jupiter — The Next Five Years","hi":"शनि और बृहस्पति — अगले पाँच वर्ष","te":"శని, గురువు — రాబోయే ఐదేళ్ళు","kn":"ಶನಿ ಮತ್ತು ಗುರು — ಮುಂದಿನ ಐದು ವರ್ಷ","ta":"சனியும் குருவும் — அடுத்த ஐந்து ஆண்டுகள்","bn":"শনি ও বৃহস্পতি — আগামী পাঁচ বছর","mr":"शनी आणि गुरु — पुढील पाच वर्षे","gu":"શનિ અને ગુરુ — આવતાં પાંચ વર્ષ","as":"শনি আৰু বৃহস্পতি — অহা পাঁচ বছৰ"},"intro":{"en":"These two move slowly enough to shape a career rather than a week. Jupiter changes sign about once a year, Saturn about once in two and a half — so each change below marks a stretch of years, not a mood. Every date is counted from your birth Moon sign, the classical gochara method.","hi":"ये दोनों इतनी धीमी गति से चलते हैं कि किसी सप्ताह को नहीं, पूरे कर्मजीवन को आकार देते हैं। बृहस्पति लगभग वर्ष में एक बार राशि बदलता है, शनि लगभग ढाई वर्ष में — इसलिए नीचे दिया गया हर परिवर्तन किसी मनोदशा का नहीं, वर्षों के एक खंड का चिह्न है। हर तिथि आपकी जन्म चंद्रराशि से गिनी गई है, यही शास्त्रीय गोचर पद्धति है।","te":"ఈ ఇద్దరూ ఒక వారాన్ని కాక మొత్తం వృత్తి జీవితాన్నే తీర్చిదిద్దేంత నెమ్మదిగా కదులుతారు. గురువు దాదాపు ఏడాదికొకసారి రాశి మారితే, శని దాదాపు రెండున్నరేళ్ళకొకసారి — కాబట్టి క్రింది ప్రతి మార్పూ ఒక మనోభావానికి కాదు, కొన్నేళ్ళ కాలానికి గుర్తు. ప్రతి తేదీ మీ జన్మ చంద్రరాశి నుండి లెక్కించినది, ఇదే శాస్త్రీయ గోచార పద్ధతి.","kn":"ಈ ಇಬ್ಬರೂ ಒಂದು ವಾರವನ್ನಲ್ಲ, ಇಡೀ ವೃತ್ತಿ ಬದುಕನ್ನೇ ರೂಪಿಸುವಷ್ಟು ನಿಧಾನವಾಗಿ ಚಲಿಸುತ್ತಾರೆ. ಗುರು ಸುಮಾರು ವರ್ಷಕ್ಕೊಮ್ಮೆ ರಾಶಿ ಬದಲಿಸಿದರೆ, ಶನಿ ಸುಮಾರು ಎರಡೂವರೆ ವರ್ಷಕ್ಕೊಮ್ಮೆ — ಆದ್ದರಿಂದ ಕೆಳಗಿನ ಪ್ರತಿ ಬದಲಾವಣೆಯೂ ಒಂದು ಮನಸ್ಥಿತಿಗಲ್ಲ, ಕೆಲವು ವರ್ಷಗಳ ಕಾಲಕ್ಕೆ ಗುರುತು. ಪ್ರತಿ ದಿನಾಂಕವನ್ನೂ ನಿಮ್ಮ ಜನ್ಮ ಚಂದ್ರರಾಶಿಯಿಂದ ಎಣಿಸಲಾಗಿದೆ, ಇದೇ ಶಾಸ್ತ್ರೀಯ ಗೋಚಾರ ಪದ್ಧತಿ.","ta":"இவ்விருவரும் ஒரு வாரத்தை அல்ல, முழு தொழில் வாழ்க்கையையே வடிவமைக்கும் அளவுக்கு மெதுவாக நகர்கிறார்கள். குரு ஏறத்தாழ ஆண்டுக்கு ஒருமுறை ராசி மாறினால், சனி ஏறத்தாழ இரண்டரை ஆண்டுக்கு ஒருமுறை — எனவே கீழே உள்ள ஒவ்வொரு மாற்றமும் ஒரு மனநிலைக்கு அல்ல, சில ஆண்டுகளுக்கான குறியீடு. ஒவ்வொரு தேதியும் உங்கள் ஜென்ம சந்திர ராசியிலிருந்து கணக்கிடப்பட்டது, இதுவே சாஸ்திரப்படியான கோசார முறை.","bn":"এই দুজন এত ধীরে চলেন যে কোনো সপ্তাহ নয়, গোটা কর্মজীবনকেই গড়ে তোলেন। বৃহস্পতি প্রায় বছরে একবার রাশি বদলান, শনি প্রায় আড়াই বছরে — তাই নিচের প্রতিটি পরিবর্তন কোনো মেজাজের নয়, কয়েক বছরের একটা পর্বের চিহ্ন। প্রতিটি তারিখ আপনার জন্ম চন্দ্ররাশি থেকে গোনা, এটাই শাস্ত্রীয় গোচর পদ্ধতি।","mr":"हे दोघे इतक्या हळू चालतात की एखाद्या आठवड्याला नव्हे, संपूर्ण कर्मजीवनाला आकार देतात. गुरु साधारण वर्षातून एकदा राशी बदलतो, शनी साधारण अडीच वर्षांतून — म्हणून खालील प्रत्येक बदल कोणत्या मनःस्थितीचा नव्हे, काही वर्षांच्या टप्प्याचा निशाणा आहे. प्रत्येक तारीख तुमच्या जन्म चंद्रराशीपासून मोजलेली आहे, हीच शास्त्रीय गोचर पद्धत.","gu":"આ બંને એટલી ધીમે ચાલે છે કે કોઈ અઠવાડિયાને નહીં, આખા કર્મજીવનને ઘડે છે. ગુરુ લગભગ વર્ષે એક વાર રાશિ બદલે છે, શનિ લગભગ અઢી વર્ષે — એટલે નીચેનો દરેક ફેરફાર કોઈ મનોદશાનો નહીં, થોડાં વર્ષોના તબક્કાનો સંકેત છે. દરેક તારીખ તમારી જન્મ ચંદ્રરાશિથી ગણેલી છે, આ જ શાસ્ત્રીય ગોચર પદ્ધતિ.","as":"এই দুজন ইমান লাহে চলে যে কোনো সপ্তাহক নহয়, গোটেই কৰ্মজীৱনকেই গঢ়ি তোলে। বৃহস্পতিয়ে প্ৰায় বছৰত এবাৰ ৰাশি সলনি কৰে, শনিয়ে প্ৰায় আঢ়ৈ বছৰত — সেয়েহে তলৰ প্ৰতিটো সলনি কোনো মনৰ ভাৱৰ নহয়, কেইবাবছৰীয়া এটা পৰ্যায়ৰ চিন। প্ৰতিটো তাৰিখ আপোনাৰ জন্ম চন্দ্ৰৰাশিৰ পৰা গণনা কৰা, এইটোৱেই শাস্ত্ৰীয় গোচৰ পদ্ধতি।"},"timeline":{"en":"Sign Changes Ahead","hi":"आगे आने वाले राशि परिवर्तन","te":"రాబోయే రాశి మార్పులు","kn":"ಮುಂದಿನ ರಾಶಿ ಬದಲಾವಣೆಗಳು","ta":"வரவிருக்கும் ராசி மாற்றங்கள்","bn":"আসন্ন রাশি পরিবর্তন","mr":"पुढील राशी बदल","gu":"આગામી રાશિ પરિવર્તન","as":"অহা ৰাশি সলনি"},"retro":{"en":"retrograde","hi":"वक्री","te":"వక్రం","kn":"ವಕ್ರ","ta":"வக்ரம்","bn":"বক্রী","mr":"वक्री","gu":"વક્રી","as":"বক্ৰী"},"note":{"en":"Favourability follows the classical gochara table counted from the Moon — Jupiter in the 2nd, 5th, 7th, 9th and 11th; Saturn in the 3rd, 6th and 11th. A house not marked favourable is not a bad year; it asks for more deliberate effort in that stretch.","hi":"अनुकूलता चंद्र से गिनी गई शास्त्रीय गोचर तालिका के अनुसार है — बृहस्पति द्वितीय, पंचम, सप्तम, नवम और एकादश में; शनि तृतीय, षष्ठ और एकादश में। जो भाव अनुकूल नहीं दिखाया गया वह बुरा वर्ष नहीं; वह उस खंड में अधिक सोच-समझकर किए गए प्रयास की माँग करता है।","te":"అనుకూలత చంద్రుని నుండి లెక్కించిన శాస్త్రీయ గోచార పట్టిక ప్రకారం — గురువు 2, 5, 7, 9, 11 భావాల్లో; శని 3, 6, 11 భావాల్లో. అనుకూలం అని గుర్తించని భావం చెడ్డ సంవత్సరం కాదు; ఆ కాలంలో మరింత ఆలోచించి చేసే ప్రయత్నాన్ని అది కోరుతుంది.","kn":"ಅನುಕೂಲತೆ ಚಂದ್ರನಿಂದ ಎಣಿಸಿದ ಶಾಸ್ತ್ರೀಯ ಗೋಚಾರ ಕೋಷ್ಟಕದ ಪ್ರಕಾರ — ಗುರು 2, 5, 7, 9, 11ನೇ ಭಾವಗಳಲ್ಲಿ; ಶನಿ 3, 6, 11ನೇ ಭಾವಗಳಲ್ಲಿ. ಅನುಕೂಲ ಎಂದು ಗುರುತಿಸದ ಭಾವ ಕೆಟ್ಟ ವರ್ಷವಲ್ಲ; ಆ ಕಾಲದಲ್ಲಿ ಹೆಚ್ಚು ಯೋಚಿಸಿ ಮಾಡುವ ಪ್ರಯತ್ನವನ್ನು ಅದು ಕೇಳುತ್ತದೆ.","ta":"சாதகத்தன்மை சந்திரனிலிருந்து கணக்கிட்ட சாஸ்திரக் கோசார அட்டவணைப்படி — குரு 2, 5, 7, 9, 11ஆம் பாவங்களில்; சனி 3, 6, 11ஆம் பாவங்களில். சாதகம் எனக் குறிக்கப்படாத பாவம் மோசமான ஆண்டு அல்ல; அந்தக் காலத்தில் மேலும் சிந்தித்துச் செய்யும் முயற்சியை அது கேட்கிறது.","bn":"অনুকূলতা চন্দ্র থেকে গোনা শাস্ত্রীয় গোচর তালিকা অনুযায়ী — বৃহস্পতি 2, 5, 7, 9, 11 নং ভাবে; শনি 3, 6, 11 নং ভাবে। যে ভাব অনুকূল বলে চিহ্নিত নয় সেটা খারাপ বছর নয়; সেই পর্বে আরও ভেবেচিন্তে করা চেষ্টা সে চায়।","mr":"अनुकूलता चंद्रापासून मोजलेल्या शास्त्रीय गोचर तक्त्यानुसार आहे — गुरु 2, 5, 7, 9, 11 भावांत; शनी 3, 6, 11 भावांत. जो भाव अनुकूल दाखवलेला नाही तो वाईट वर्ष नव्हे; त्या टप्प्यात अधिक विचारपूर्वक केलेला प्रयत्न तो मागतो.","gu":"અનુકૂળતા ચંદ્રથી ગણેલા શાસ્ત્રીય ગોચર કોષ્ટક પ્રમાણે — ગુરુ 2, 5, 7, 9, 11 ભાવમાં; શનિ 3, 6, 11 ભાવમાં. જે ભાવ અનુકૂળ દર્શાવ્યો નથી એ ખરાબ વર્ષ નથી; એ તબક્કામાં વધુ વિચારીને કરેલા પ્રયત્નની એ માંગ કરે છે.","as":"অনুকূলতা চন্দ্ৰৰ পৰা গণনা কৰা শাস্ত্ৰীয় গোচৰ তালিকা অনুসৰি — বৃহস্পতি 2, 5, 7, 9, 11 নং ভাৱত; শনি 3, 6, 11 নং ভাৱত। যিটো ভাৱ অনুকূল বুলি চিহ্নিত নহয় সেয়া বেয়া বছৰ নহয়; সেই পৰ্যায়ত অধিক ভাবি-চিন্তি কৰা প্ৰচেষ্টা ই বিচাৰে।"}},"edu":{"title":{"en":"Learning & Skills — the 4th and 5th Houses","hi":"शिक्षा और कौशल — चतुर्थ और पंचम भाव","te":"విద్య, నైపుణ్యం — నాలుగవ, ఐదవ భావాలు","kn":"ಕಲಿಕೆ ಮತ್ತು ಕೌಶಲ — ನಾಲ್ಕನೇ ಮತ್ತು ಐದನೇ ಭಾವ","ta":"கல்வியும் திறனும் — நான்காம், ஐந்தாம் பாவங்கள்","bn":"শিক্ষা ও দক্ষতা — চতুর্থ ও পঞ্চম ভাব","mr":"शिक्षण आणि कौशल्य — चतुर्थ आणि पंचम भाव","gu":"શિક્ષણ અને કૌશલ્ય — ચતુર્થ અને પંચમ ભાવ","as":"শিক্ষা আৰু দক্ষতা — চতুৰ্থ আৰু পঞ্চম ভাৱ"},"intro":{"en":"Classical texts read these two houses differently. The 4th is formal schooling — the years someone else sets the syllabus. The 5th is the mind's own appetite: what you learn because you wanted to. A working life usually leans on one more than the other, and the tables below show which.","hi":"शास्त्र इन दो भावों को अलग-अलग पढ़ते हैं। चतुर्थ औपचारिक शिक्षा है — वे वर्ष जब पाठ्यक्रम कोई और तय करता है। पंचम मन की अपनी भूख है: वह जो आपने इसलिए सीखा क्योंकि आप सीखना चाहते थे। कार्यजीवन प्रायः इनमें से किसी एक पर अधिक टिकता है, और नीचे की तालिकाएँ बताती हैं कि किस पर।","te":"శాస్త్రం ఈ రెండు భావాలనూ వేరువేరుగా చదువుతుంది. నాలుగవది అధికారిక చదువు — పాఠ్యాంశాన్ని మరొకరు నిర్ణయించే సంవత్సరాలు. ఐదవది మనసు సొంత ఆకలి: మీరు నేర్చుకోవాలనుకున్నందుకే నేర్చుకున్నది. పని జీవితం సాధారణంగా వీటిలో ఒకదానిపై ఎక్కువ ఆధారపడుతుంది, ఏదో క్రింది పట్టికలు చూపుతాయి.","kn":"ಶಾಸ್ತ್ರ ಈ ಎರಡು ಭಾವಗಳನ್ನೂ ಬೇರೆ ಬೇರೆಯಾಗಿ ಓದುತ್ತದೆ. ನಾಲ್ಕನೆಯದು ಔಪಚಾರಿಕ ಶಿಕ್ಷಣ — ಪಠ್ಯವನ್ನು ಬೇರೊಬ್ಬರು ನಿರ್ಧರಿಸುವ ವರ್ಷಗಳು. ಐದನೆಯದು ಮನಸ್ಸಿನ ಸ್ವಂತ ಹಸಿವು: ನೀವು ಕಲಿಯಬೇಕೆಂದು ಬಯಸಿದ್ದರಿಂದಲೇ ಕಲಿತದ್ದು. ಕೆಲಸದ ಬದುಕು ಸಾಮಾನ್ಯವಾಗಿ ಇವುಗಳಲ್ಲಿ ಒಂದರ ಮೇಲೆ ಹೆಚ್ಚು ನಿಲ್ಲುತ್ತದೆ, ಯಾವುದರ ಮೇಲೆ ಎಂದು ಕೆಳಗಿನ ಕೋಷ್ಟಕಗಳು ತೋರಿಸುತ್ತವೆ.","ta":"சாஸ்திரம் இந்த இரு பாவங்களையும் வெவ்வேறாகப் படிக்கிறது. நான்காவது முறையான பள்ளிப் படிப்பு — பாடத்திட்டத்தை வேறொருவர் தீர்மானிக்கும் ஆண்டுகள். ஐந்தாவது மனத்தின் சொந்தப் பசி: நீங்கள் கற்க விரும்பியதால் மட்டுமே கற்றது. வேலை வாழ்க்கை பொதுவாக இவற்றில் ஒன்றின் மீது அதிகம் சாய்கிறது, எதன் மீது என்பதைக் கீழ்க்கண்ட அட்டவணைகள் காட்டுகின்றன.","bn":"শাস্ত্র এই দুই ভাবকে আলাদাভাবে পড়ে। চতুর্থ হল প্রাতিষ্ঠানিক শিক্ষা — যে বছরগুলিতে পাঠ্যক্রম অন্য কেউ ঠিক করে। পঞ্চম হল মনের নিজস্ব খিদে: যা আপনি শিখেছেন কারণ শিখতে চেয়েছিলেন। কর্মজীবন সাধারণত এর একটির উপর বেশি ভর করে, কোনটির উপর তা নিচের টেবিল দেখায়।","mr":"शास्त्र या दोन भावांना वेगवेगळे वाचतात. चतुर्थ म्हणजे औपचारिक शिक्षण — ज्या वर्षांत अभ्यासक्रम दुसरे कोणी ठरवते. पंचम म्हणजे मनाची स्वतःची भूक: जे तुम्ही शिकलात कारण तुम्हाला शिकायचे होते. कर्मजीवन सहसा यापैकी एकावर अधिक टेकते, कशावर ते खालील तक्ते दाखवतात.","gu":"શાસ્ત્ર આ બે ભાવને અલગ અલગ વાંચે છે. ચતુર્થ એટલે ઔપચારિક શિક્ષણ — જે વર્ષોમાં અભ્યાસક્રમ બીજું કોઈ નક્કી કરે છે. પંચમ એટલે મનની પોતાની ભૂખ: જે તમે શીખ્યા કારણ કે તમને શીખવું હતું. કર્મજીવન સામાન્ય રીતે આમાંથી એક પર વધુ ટેકે છે, કયા પર એ નીચેનાં કોષ્ટકો બતાવે છે.","as":"শাস্ত্ৰই এই দুটা ভাৱক বেলেগ বেলেগকৈ পঢ়ে। চতুৰ্থটো আনুষ্ঠানিক শিক্ষা — যিবোৰ বছৰত পাঠ্যক্ৰম আন কোনোবাই ঠিক কৰে। পঞ্চমটো মনৰ নিজা ভোক: যিটো আপুনি শিকিলে কাৰণ শিকিব বিচাৰিছিল। কৰ্মজীৱন সাধাৰণতে ইয়াৰে এটাৰ ওপৰত বেছি ভৰ দিয়ে, কোনটোৰ ওপৰত সেয়া তলৰ তালিকাই দেখুৱায়।"},"fourthLbl":{"en":"Formal Schooling (4th)","hi":"औपचारिक शिक्षा (चतुर्थ)","te":"అధికారిక చదువు (నాలుగవ)","kn":"ಔಪಚಾರಿಕ ಶಿಕ್ಷಣ (ನಾಲ್ಕನೇ)","ta":"முறையான கல்வி (நான்காம்)","bn":"প্রাতিষ্ঠানিক শিক্ষা (চতুর্থ)","mr":"औपचारिक शिक्षण (चतुर्थ)","gu":"ઔપચારિક શિક્ષણ (ચતુર્થ)","as":"আনুষ্ঠানিক শিক্ষা (চতুৰ্থ)"},"fifthLbl":{"en":"Self-driven Learning (5th)","hi":"अपनी रुचि से सीखना (पंचम)","te":"సొంత ఆసక్తితో నేర్చుకోవడం (ఐదవ)","kn":"ಸ್ವಂತ ಆಸಕ್ತಿಯ ಕಲಿಕೆ (ಐದನೇ)","ta":"சுய ஆர்வக் கற்றல் (ஐந்தாம்)","bn":"নিজের আগ্রহে শেখা (পঞ্চম)","mr":"स्वतःच्या आवडीचे शिक्षण (पंचम)","gu":"પોતાની રુચિથી શીખવું (પંચમ)","as":"নিজৰ আগ্ৰহত শিকা (পঞ্চম)"},"houseLord":{"en":"Lord","hi":"स्वामी","te":"అధిపతి","kn":"ಅಧಿಪತಿ","ta":"அதிபதி","bn":"অধিপতি","mr":"स्वामी","gu":"સ્વામી","as":"অধিপতি"},"placedIn":{"en":"Placed in house","hi":"स्थित भाव","te":"ఉన్న భావం","kn":"ಇರುವ ಭಾವ","ta":"உள்ள பாவம்","bn":"অবস্থিত ভাব","mr":"स्थित भाव","gu":"સ્થિત ભાવ","as":"অৱস্থিত ভাৱ"},"occupants":{"en":"Grahas in it","hi":"इसमें स्थित ग्रह","te":"అందులోని గ్రహాలు","kn":"ಅದರಲ್ಲಿನ ಗ್ರಹಗಳು","ta":"அதிலுள்ள கிரகங்கள்","bn":"এতে থাকা গ্রহ","mr":"यातील ग्रह","gu":"એમાંના ગ્રહ","as":"ইয়াত থকা গ্ৰহ"},"none":{"en":"none","hi":"कोई नहीं","te":"ఏవీ లేవు","kn":"ಯಾವುದೂ ಇಲ್ಲ","ta":"எதுவும் இல்லை","bn":"কোনোটি নয়","mr":"कोणतेही नाही","gu":"કોઈ નહીં","as":"কোনোটোৱেই নাই"},"strong":{"en":"This house is well supported. Learning of this kind came without unusual resistance, and it is worth leaning on when a new skill is needed.","hi":"इस भाव को अच्छा बल मिला है। इस प्रकार की शिक्षा बिना असाधारण अवरोध के आई, और जब कोई नया कौशल चाहिए तब इसी पर टेक लेना उचित है।","te":"ఈ భావానికి మంచి బలం ఉంది. ఈ రకమైన చదువు అసాధారణ ఆటంకం లేకుండా వచ్చింది, కొత్త నైపుణ్యం కావాల్సినప్పుడు దీనిపైనే ఆధారపడటం మంచిది.","kn":"ಈ ಭಾವಕ್ಕೆ ಒಳ್ಳೆಯ ಬೆಂಬಲವಿದೆ. ಈ ಬಗೆಯ ಕಲಿಕೆ ಅಸಾಧಾರಣ ಅಡ್ಡಿಯಿಲ್ಲದೆ ಬಂದಿದೆ, ಹೊಸ ಕೌಶಲ ಬೇಕಾದಾಗ ಇದನ್ನೇ ಆಶ್ರಯಿಸುವುದು ಸರಿ.","ta":"இந்தப் பாவத்திற்கு நல்ல ஆதரவு உள்ளது. இந்த வகைக் கற்றல் அசாதாரணத் தடையின்றி வந்தது, புதிய திறன் தேவைப்படும்போது இதையே சார்ந்திருப்பது சரி.","bn":"এই ভাব ভালো সমর্থন পেয়েছে। এই ধরনের শেখা অস্বাভাবিক বাধা ছাড়াই এসেছে, নতুন কোনো দক্ষতা দরকার হলে এর উপরেই ভর করা উচিত।","mr":"या भावाला चांगला आधार आहे. या प्रकारचे शिक्षण असामान्य अडथळ्याविना आले, नवीन कौशल्य हवे असेल तेव्हा यावरच टेकणे योग्य.","gu":"આ ભાવને સારો ટેકો છે. આ પ્રકારનું શિક્ષણ અસાધારણ અડચણ વિના આવ્યું, નવું કૌશલ્ય જોઈએ ત્યારે આના પર જ ટેકવું યોગ્ય.","as":"এই ভাৱে ভাল সমৰ্থন পাইছে। এই ধৰণৰ শিকা অসাধাৰণ বাধা নোহোৱাকৈয়ে আহিছে, নতুন দক্ষতা লাগিলে ইয়াৰ ওপৰতেই ভৰ দিয়াটো উচিত।"},"steady":{"en":"This house carries ordinary strength. Learning of this kind works when you give it time, and it rewards steady practice more than sudden effort.","hi":"इस भाव में सामान्य बल है। इस प्रकार की शिक्षा तब चलती है जब आप उसे समय दें, और यह अचानक किए गए प्रयास से अधिक नियमित अभ्यास को फल देती है।","te":"ఈ భావంలో సాధారణ బలం ఉంది. ఈ రకమైన చదువు మీరు దానికి సమయం ఇచ్చినప్పుడు పనిచేస్తుంది, హఠాత్తు ప్రయత్నం కంటే క్రమమైన సాధనకే ఎక్కువ ఫలితం.","kn":"ಈ ಭಾವದಲ್ಲಿ ಸಾಮಾನ್ಯ ಬಲವಿದೆ. ಈ ಬಗೆಯ ಕಲಿಕೆ ನೀವು ಅದಕ್ಕೆ ಸಮಯ ಕೊಟ್ಟಾಗ ಕೆಲಸ ಮಾಡುತ್ತದೆ, ಹಠಾತ್ ಪ್ರಯತ್ನಕ್ಕಿಂತ ನಿಯಮಿತ ಅಭ್ಯಾಸಕ್ಕೇ ಹೆಚ್ಚು ಫಲ.","ta":"இந்தப் பாவத்தில் சாதாரணப் பலம் உள்ளது. இந்த வகைக் கற்றல் நீங்கள் அதற்கு நேரம் தரும்போது வேலை செய்கிறது, திடீர் முயற்சியைவிட வழக்கமான பயிற்சிக்கே அதிக பலன்.","bn":"এই ভাবে সাধারণ বল আছে। এই ধরনের শেখা তখনই চলে যখন আপনি সময় দেন, আর হঠাৎ চেষ্টার চেয়ে নিয়মিত অভ্যাসকেই বেশি ফল দেয়।","mr":"या भावात सामान्य बल आहे. या प्रकारचे शिक्षण तुम्ही वेळ दिल्यावर चालते, आणि अचानक केलेल्या प्रयत्नापेक्षा नियमित सरावाला अधिक फळ देते.","gu":"આ ભાવમાં સામાન્ય બળ છે. આ પ્રકારનું શિક્ષણ તમે સમય આપો ત્યારે ચાલે છે, અને અચાનક કરેલા પ્રયત્ન કરતાં નિયમિત અભ્યાસને વધુ ફળ આપે છે.","as":"এই ভাৱত সাধাৰণ বল আছে। এই ধৰণৰ শিকা আপুনি সময় দিলেহে চলে, আৰু হঠাৎ কৰা চেষ্টাতকৈ নিয়মীয়া অভ্যাসকেই বেছি ফল দিয়ে।"},"effort":{"en":"This house asks for deliberate effort. That is not a statement about ability — it says the learning of this kind came harder, and that structure, a teacher, or a deadline does more for you here than motivation alone.","hi":"यह भाव सचेत प्रयास माँगता है। यह क्षमता के बारे में नहीं है — यह कहता है कि इस प्रकार की शिक्षा कठिनाई से आई, और यहाँ केवल उत्साह से अधिक कोई ढाँचा, कोई शिक्षक या कोई समय-सीमा काम आती है।","te":"ఈ భావం ఉద్దేశపూర్వక ప్రయత్నాన్ని కోరుతుంది. ఇది సామర్థ్యం గురించి కాదు — ఈ రకమైన చదువు కష్టంగా వచ్చిందని, ఇక్కడ కేవలం ఉత్సాహం కంటే ఒక నిర్మాణం, ఒక గురువు లేదా ఒక గడువు ఎక్కువ పనిచేస్తుందని చెబుతుంది.","kn":"ಈ ಭಾವ ಪ್ರಜ್ಞಾಪೂರ್ವಕ ಪ್ರಯತ್ನವನ್ನು ಕೇಳುತ್ತದೆ. ಇದು ಸಾಮರ್ಥ್ಯದ ಬಗ್ಗೆ ಅಲ್ಲ — ಈ ಬಗೆಯ ಕಲಿಕೆ ಕಷ್ಟದಿಂದ ಬಂದಿತು, ಇಲ್ಲಿ ಕೇವಲ ಉತ್ಸಾಹಕ್ಕಿಂತ ಒಂದು ಚೌಕಟ್ಟು, ಒಬ್ಬ ಗುರು ಅಥವಾ ಒಂದು ಗಡುವು ಹೆಚ್ಚು ಕೆಲಸ ಮಾಡುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತದೆ.","ta":"இந்தப் பாவம் உணர்வுபூர்வமான முயற்சியைக் கேட்கிறது. இது திறமை பற்றியது அல்ல — இந்த வகைக் கற்றல் கடினமாக வந்தது, இங்கே வெறும் ஆர்வத்தைவிட ஒரு கட்டமைப்பு, ஒரு ஆசிரியர் அல்லது ஒரு காலக்கெடு அதிகம் உதவும் என்று சொல்கிறது.","bn":"এই ভাব সচেতন চেষ্টা চায়। এটা সামর্থ্যের কথা নয় — এটা বলে যে এই ধরনের শেখা কষ্টে এসেছে, আর এখানে শুধু উৎসাহের চেয়ে একটা কাঠামো, একজন শিক্ষক বা একটা সময়সীমা বেশি কাজে লাগে।","mr":"हा भाव जाणीवपूर्वक प्रयत्न मागतो. हे क्षमतेबद्दल नाही — हे सांगते की या प्रकारचे शिक्षण कष्टाने आले, आणि इथे केवळ उत्साहापेक्षा एखादी रचना, एखादा शिक्षक किंवा एखादी मुदत जास्त उपयोगी पडते.","gu":"આ ભાવ સભાન પ્રયત્ન માંગે છે. આ ક્ષમતા વિશે નથી — આ કહે છે કે આ પ્રકારનું શિક્ષણ મુશ્કેલીથી આવ્યું, અને અહીં માત્ર ઉત્સાહ કરતાં કોઈ માળખું, કોઈ શિક્ષક કે કોઈ સમયમર્યાદા વધુ કામ આવે છે.","as":"এই ভাৱে সচেতন প্ৰচেষ্টা বিচাৰে। এইটো সামৰ্থ্যৰ কথা নহয় — ই কয় যে এই ধৰণৰ শিকা কষ্টেৰে আহিছে, আৰু ইয়াত কেৱল উৎসাহতকৈ এটা গাঁথনি, এজন শিক্ষক বা এটা সময়সীমা বেছি কামত আহে।"},"karakaNote":{"en":"Mercury and Jupiter are the two grahas classical texts weigh most for learning — Mercury for skill and quickness, Jupiter for depth and counsel. Their points in these houses are shown separately.","hi":"बुध और बृहस्पति वे दो ग्रह हैं जिन्हें शास्त्र शिक्षा के लिए सबसे अधिक महत्व देते हैं — बुध कौशल और तीव्रता के लिए, बृहस्पति गहराई और परामर्श के लिए। इन भावों में उनके बिंदु अलग से दिखाए गए हैं।","te":"విద్య కోసం శాస్త్రం ఎక్కువ ప్రాధాన్యమిచ్చే రెండు గ్రహాలు బుధుడు, గురువు — బుధుడు నైపుణ్యం, వేగం కోసం; గురువు లోతు, సలహా కోసం. ఈ భావాల్లో వారి బిందువులు వేరుగా చూపబడ్డాయి.","kn":"ಕಲಿಕೆಗಾಗಿ ಶಾಸ್ತ್ರ ಹೆಚ್ಚು ಮಹತ್ವ ನೀಡುವ ಎರಡು ಗ್ರಹಗಳು ಬುಧ ಮತ್ತು ಗುರು — ಬುಧ ಕೌಶಲ ಮತ್ತು ವೇಗಕ್ಕೆ, ಗುರು ಆಳ ಮತ್ತು ಸಲಹೆಗೆ. ಈ ಭಾವಗಳಲ್ಲಿ ಅವರ ಬಿಂದುಗಳನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.","ta":"கற்றலுக்குச் சாஸ்திரம் அதிக முக்கியத்துவம் தரும் இரு கிரகங்கள் புதனும் குருவும் — புதன் திறனுக்கும் விரைவுக்கும், குரு ஆழத்துக்கும் ஆலோசனைக்கும். இந்தப் பாவங்களில் அவர்களின் புள்ளிகள் தனியாகக் காட்டப்பட்டுள்ளன.","bn":"শিক্ষার জন্য শাস্ত্র যে দুই গ্রহকে সবচেয়ে গুরুত্ব দেয় তারা বুধ ও বৃহস্পতি — বুধ দক্ষতা ও দ্রুততার জন্য, বৃহস্পতি গভীরতা ও পরামর্শের জন্য। এই ভাবগুলিতে তাদের বিন্দু আলাদা করে দেখানো হয়েছে।","mr":"शिक्षणासाठी शास्त्र ज्या दोन ग्रहांना सर्वाधिक महत्त्व देतात ते बुध आणि गुरु — बुध कौशल्य आणि चपळाईसाठी, गुरु खोली आणि सल्ल्यासाठी. या भावांतील त्यांचे बिंदू स्वतंत्रपणे दाखवले आहेत.","gu":"શિક્ષણ માટે શાસ્ત્ર જે બે ગ્રહને સૌથી વધુ મહત્ત્વ આપે છે તે બુધ અને ગુરુ — બુધ કૌશલ્ય અને ઝડપ માટે, ગુરુ ઊંડાણ અને સલાહ માટે. આ ભાવોમાં તેમના બિંદુ અલગથી બતાવ્યા છે.","as":"শিক্ষাৰ বাবে শাস্ত্ৰই যিদুটা গ্ৰহক আটাইতকৈ গুৰুত্ব দিয়ে সেয়া বুধ আৰু বৃহস্পতি — বুধ দক্ষতা আৰু ক্ষিপ্ৰতাৰ বাবে, বৃহস্পতি গভীৰতা আৰু পৰামৰ্শৰ বাবে। এই ভাৱবোৰত সিহঁতৰ বিন্দু পৃথককৈ দেখুওৱা হৈছে।"}},"pev":{"title":{"en":"Why {P} Leads Your Career Chart","hi":"आपके कर्मजीवन में {P} आगे क्यों है","te":"మీ వృత్తి జాతకంలో {P} ఎందుకు ముందున్నారు","kn":"ನಿಮ್ಮ ವೃತ್ತಿ ಜಾತಕದಲ್ಲಿ {P} ಏಕೆ ಮುಂದಿದ್ದಾರೆ","ta":"உங்கள் தொழில் ஜாதகத்தில் {P} ஏன் முன்னிற்கிறார்","bn":"আপনার কর্মজীবনের কোষ্ঠীতে {P} কেন এগিয়ে","mr":"तुमच्या कर्मजीवनाच्या पत्रिकेत {P} पुढे का आहे","gu":"તમારી કર્મજીવન કુંડળીમાં {P} કેમ આગળ છે","as":"আপোনাৰ কৰ্মজীৱনৰ কুণ্ডলীত {P} কিয় আগত"},"intro":{"en":"This report does not pick a career from a list. It counts which grahas actually carry your tenth house, and each one brings its own set of fields. Below is the evidence for this graha — where it sits in your birth chart, where it sits in the D10 career chart, and how many ashtakavarga points it contributes to the tenth.","hi":"यह रिपोर्ट किसी सूची से कर्मक्षेत्र नहीं चुनती। यह गिनती है कि आपके दशम भाव को वास्तव में कौन से ग्रह सँभालते हैं, और हर ग्रह अपने साथ अपने क्षेत्र लाता है। नीचे इसी ग्रह का प्रमाण है — वह आपकी जन्मकुंडली में कहाँ है, दशांश कर्म कुंडली में कहाँ है, और दशम भाव को कितने अष्टकवर्ग बिंदु देता है।","te":"ఈ నివేదిక ఏ జాబితా నుండీ వృత్తిని ఎంచుకోదు. మీ దశమ భావాన్ని నిజంగా ఏ గ్రహాలు మోస్తున్నాయో లెక్కిస్తుంది, ప్రతి గ్రహమూ తనతో తన రంగాలను తెస్తుంది. క్రింద ఈ గ్రహం సాక్ష్యం — అది మీ జన్మ జాతకంలో ఎక్కడుంది, దశాంశ వృత్తి జాతకంలో ఎక్కడుంది, దశమ భావానికి ఎన్ని అష్టకవర్గ బిందువులు ఇస్తోంది.","kn":"ಈ ವರದಿ ಯಾವುದೇ ಪಟ್ಟಿಯಿಂದ ವೃತ್ತಿಯನ್ನು ಆರಿಸುವುದಿಲ್ಲ. ನಿಮ್ಮ ದಶಮ ಭಾವವನ್ನು ನಿಜವಾಗಿ ಯಾವ ಗ್ರಹಗಳು ಹೊತ್ತಿವೆ ಎಂದು ಎಣಿಸುತ್ತದೆ, ಪ್ರತಿ ಗ್ರಹವೂ ತನ್ನೊಂದಿಗೆ ತನ್ನ ಕ್ಷೇತ್ರಗಳನ್ನು ತರುತ್ತದೆ. ಕೆಳಗೆ ಈ ಗ್ರಹದ ಸಾಕ್ಷ್ಯ — ಅದು ನಿಮ್ಮ ಜನ್ಮ ಜಾತಕದಲ್ಲಿ ಎಲ್ಲಿದೆ, ದಶಾಂಶ ವೃತ್ತಿ ಜಾತಕದಲ್ಲಿ ಎಲ್ಲಿದೆ, ದಶಮ ಭಾವಕ್ಕೆ ಎಷ್ಟು ಅಷ್ಟಕವರ್ಗ ಬಿಂದುಗಳನ್ನು ನೀಡುತ್ತದೆ.","ta":"இந்த அறிக்கை எந்தப் பட்டியலிலிருந்தும் தொழிலைத் தேர்வு செய்வதில்லை. உங்கள் பத்தாம் பாவத்தை உண்மையில் எந்தக் கிரகங்கள் தாங்குகின்றன என்று கணக்கிடுகிறது, ஒவ்வொரு கிரகமும் தன்னுடன் தன் துறைகளைக் கொண்டுவருகிறது. கீழே இந்தக் கிரகத்தின் சான்று — அது உங்கள் ஜென்ம ஜாதகத்தில் எங்கே உள்ளது, தசாம்ச தொழில் ஜாதகத்தில் எங்கே உள்ளது, பத்தாம் பாவத்திற்கு எத்தனை அஷ்டகவர்க்கப் புள்ளிகள் தருகிறது.","bn":"এই রিপোর্ট কোনো তালিকা থেকে পেশা বেছে নেয় না। আপনার দশম ভাবকে আসলে কোন গ্রহগুলি বইছে তা গোনে, আর প্রতিটি গ্রহ নিজের সঙ্গে নিজের ক্ষেত্র নিয়ে আসে। নিচে এই গ্রহের প্রমাণ — সে আপনার জন্মকোষ্ঠীতে কোথায়, দশাংশ কর্ম কোষ্ঠীতে কোথায়, আর দশম ভাবকে কত অষ্টকবর্গ বিন্দু দেয়।","mr":"हा अहवाल कोणत्याही यादीतून व्यवसाय निवडत नाही. तुमचा दशम भाव खरोखर कोणते ग्रह पेलतात हे मोजतो, आणि प्रत्येक ग्रह स्वतःसोबत स्वतःची क्षेत्रे आणतो. खाली याच ग्रहाचा पुरावा — तो तुमच्या जन्मपत्रिकेत कुठे आहे, दशांश कर्मपत्रिकेत कुठे आहे, आणि दशम भावाला किती अष्टकवर्ग बिंदू देतो.","gu":"આ અહેવાલ કોઈ યાદીમાંથી કારકિર્દી પસંદ કરતો નથી. તમારો દશમ ભાવ ખરેખર કયા ગ્રહ ઉપાડે છે એ ગણે છે, અને દરેક ગ્રહ પોતાની સાથે પોતાનાં ક્ષેત્રો લાવે છે. નીચે આ ગ્રહનો પુરાવો — એ તમારી જન્મકુંડળીમાં ક્યાં છે, દશાંશ કર્મકુંડળીમાં ક્યાં છે, અને દશમ ભાવને કેટલા અષ્ટકવર્ગ બિંદુ આપે છે.","as":"এই প্ৰতিবেদনে কোনো তালিকাৰ পৰা জীৱিকা বাছি নলয়। আপোনাৰ দশম ভাৱক সঁচাকৈ কোনবোৰ গ্ৰহই বৈ আছে সেয়া গণনা কৰে, আৰু প্ৰতিটো গ্ৰহে নিজৰ লগত নিজৰ ক্ষেত্ৰ লৈ আহে। তলত এই গ্ৰহৰ প্ৰমাণ — সি আপোনাৰ জন্মকুণ্ডলীত ক'ত আছে, দশাংশ কৰ্ম কুণ্ডলীত ক'ত আছে, আৰু দশম ভাৱক কিমান অষ্টকবৰ্গ বিন্দু দিয়ে।"},"evidence":{"en":"The evidence","hi":"प्रमाण","te":"సాక్ష్యం","kn":"ಸಾಕ್ಷ್ಯ","ta":"சான்று","bn":"প্রমাণ","mr":"पुरावा","gu":"પુરાવો","as":"প্ৰমাণ"},"inBirthChart":{"en":"In your birth chart","hi":"जन्मकुंडली में","te":"జన్మ జాతకంలో","kn":"ಜನ್ಮ ಜಾತಕದಲ್ಲಿ","ta":"ஜென்ம ஜாதகத்தில்","bn":"জন্মকোষ্ঠীতে","mr":"जन्मपत्रिकेत","gu":"જન્મકુંડળીમાં","as":"জন্মকুণ্ডলীত"},"inD10":{"en":"In the D10 career chart","hi":"दशांश कर्म कुंडली में","te":"దశాంశ వృత్తి జాతకంలో","kn":"ದಶಾಂಶ ವೃತ್ತಿ ಜಾತಕದಲ್ಲಿ","ta":"தசாம்ச தொழில் ஜாதகத்தில்","bn":"দশাংশ কর্ম কোষ্ঠীতে","mr":"दशांश कर्मपत्रिकेत","gu":"દશાંશ કર્મકુંડળીમાં","as":"দশাংশ কৰ্ম কুণ্ডলীত"},"bavShare":{"en":"Points it gives your 10th house","hi":"आपके दशम भाव को दिए बिंदु","te":"మీ దశమ భావానికి ఇచ్చే బిందువులు","kn":"ನಿಮ್ಮ ದಶಮ ಭಾವಕ್ಕೆ ನೀಡುವ ಬಿಂದುಗಳು","ta":"உங்கள் பத்தாம் பாவத்திற்குத் தரும் புள்ளிகள்","bn":"আপনার দশম ভাবকে দেওয়া বিন্দু","mr":"तुमच्या दशम भावाला दिलेले बिंदू","gu":"તમારા દશમ ભાવને આપેલા બિંદુ","as":"আপোনাৰ দশম ভাৱক দিয়া বিন্দু"},"roleTenthLord":{"en":"Lord of your 10th house — the graha your working life reports to","hi":"आपके दशम भाव का स्वामी — वह ग्रह जिसे आपका कार्यजीवन उत्तर देता है","te":"మీ దశమ భావాధిపతి — మీ పని జీవితం జవాబుదారీగా ఉండే గ్రహం","kn":"ನಿಮ್ಮ ದಶಮ ಭಾವಾಧಿಪತಿ — ನಿಮ್ಮ ಕೆಲಸದ ಬದುಕು ಉತ್ತರಿಸುವ ಗ್ರಹ","ta":"உங்கள் பத்தாம் பாவ அதிபதி — உங்கள் வேலை வாழ்க்கை பதில் சொல்லும் கிரகம்","bn":"আপনার দশম ভাবের অধিপতি — যে গ্রহের কাছে আপনার কর্মজীবন জবাবদিহি","mr":"तुमच्या दशम भावाचा स्वामी — ज्या ग्रहाला तुमचे कर्मजीवन उत्तरदायी आहे","gu":"તમારા દશમ ભાવનો સ્વામી — જે ગ્રહને તમારું કર્મજીવન જવાબ આપે છે","as":"আপোনাৰ দশম ভাৱৰ অধিপতি — যিটো গ্ৰহক আপোনাৰ কৰ্মজীৱনে উত্তৰ দিয়ে"},"roleD10Lagna":{"en":"Lord of the D10 ascendant — it sets the tone of the career chart itself","hi":"दशांश लग्न का स्वामी — यह कर्म कुंडली का स्वर ही तय करता है","te":"దశాంశ లగ్నాధిపతి — వృత్తి జాతకపు స్వరాన్నే ఇది నిర్ణయిస్తుంది","kn":"ದಶಾಂಶ ಲಗ್ನಾಧಿಪತಿ — ವೃತ್ತಿ ಜಾತಕದ ಧ್ವನಿಯನ್ನೇ ಇದು ನಿರ್ಧರಿಸುತ್ತದೆ","ta":"தசாம்ச லக்னாதிபதி — தொழில் ஜாதகத்தின் தொனியையே இது தீர்மானிக்கிறது","bn":"দশাংশ লগ্নের অধিপতি — কর্ম কোষ্ঠীর সুরটাই এ ঠিক করে","mr":"दशांश लग्नाचा स्वामी — कर्मपत्रिकेचा सूरच हा ठरवतो","gu":"દશાંશ લગ્નનો સ્વામી — કર્મકુંડળીનો સૂર જ આ નક્કી કરે છે","as":"দশাংশ লগ্নৰ অধিপতি — কৰ্ম কুণ্ডলীৰ সুৰটোৱেই ই ঠিক কৰে"},"fieldsIt":{"en":"Fields this graha opens","hi":"यह ग्रह जो क्षेत्र खोलता है","te":"ఈ గ్రహం తెరిచే రంగాలు","kn":"ಈ ಗ್ರಹ ತೆರೆಯುವ ಕ್ಷೇತ್ರಗಳು","ta":"இந்தக் கிரகம் திறக்கும் துறைகள்","bn":"এই গ্রহ যে ক্ষেত্র খোলে","mr":"हा ग्रह जी क्षेत्रे उघडतो","gu":"આ ગ્રહ જે ક્ષેત્રો ખોલે છે","as":"এই গ্ৰহই খোলা ক্ষেত্ৰবোৰ"},"weight":{"en":"Weight in the ranking","hi":"क्रम में भार","te":"వరుసలో బరువు","kn":"ಶ್ರೇಣಿಯಲ್ಲಿ ತೂಕ","ta":"தரவரிசையில் எடை","bn":"ক্রমে ভার","mr":"क्रमवारीत वजन","gu":"ક્રમમાં વજન","as":"ক্ৰমত ওজন"},"titleV2":{"en":"Why {P} Matters in Your Career Chart","hi":"आपके कर्मजीवन में {P} क्यों मायने रखता है","te":"మీ వృత్తి జాతకంలో {P} ఎందుకు ముఖ్యం","kn":"ನಿಮ್ಮ ವೃತ್ತಿ ಜಾತಕದಲ್ಲಿ {P} ಏಕೆ ಮುಖ್ಯ","ta":"உங்கள் தொழில் ஜாதகத்தில் {P} ஏன் முக்கியம்","bn":"আপনার কর্মজীবনের কোষ্ঠীতে {P} কেন গুরুত্বপূর্ণ","mr":"तुमच्या कर्मजीवनाच्या पत्रिकेत {P} का महत्त्वाचा आहे","gu":"તમારી કર્મજીવન કુંડળીમાં {P} કેમ મહત્ત્વનો છે","as":"আপোনাৰ কৰ্মজীৱনৰ কুণ্ডলীত {P} কিয় গুৰুত্বপূৰ্ণ"}},"psLbl":{"title":{"en":"This Date, Measured Against Your Own Star","hi":"यह तिथि, आपके अपने नक्षत्र के सापेक्ष","te":"ఈ తేదీ, మీ సొంత నక్షత్రంతో సరిచూసి","kn":"ಈ ದಿನಾಂಕ, ನಿಮ್ಮ ಸ್ವಂತ ನಕ್ಷತ್ರದೊಂದಿಗೆ ಹೋಲಿಸಿ","ta":"இந்த தேதி, உங்கள் சொந்த நட்சத்திரத்துடன் ஒப்பிட்டு","bn":"এই তারিখ, আপনার নিজের নক্ষত্রের সাপেক্ষে","mr":"ही तारीख, तुमच्या स्वतःच्या नक्षत्राच्या तुलनेत","gu":"આ તારીખ, તમારા પોતાના નક્ષત્રની સામે","as":"এই তাৰিখ, আপোনাৰ নিজৰ নক্ষত্ৰৰ সাপেক্ষে"},"intro":{"en":"A date that is auspicious in general is not automatically auspicious for you. Two personal measures decide that, and both are counted from your own birth star and Moon sign — the two rows highlighted on the opening page.","hi":"जो तिथि सामान्य रूप से शुभ है, वह अपने आप आपके लिए भी शुभ नहीं होती। यह दो व्यक्तिगत मापों से तय होता है, और दोनों आपके अपने जन्म नक्षत्र और चंद्रराशि से गिने जाते हैं — वही दो पंक्तियाँ जो पहले पृष्ठ पर रेखांकित हैं।","te":"సాధారణంగా శుభమైన తేదీ మీకూ శుభమని కాదు. దాన్ని రెండు వ్యక్తిగత కొలతలు నిర్ణయిస్తాయి, రెండూ మీ సొంత జన్మ నక్షత్రం, చంద్రరాశి నుండే లెక్కించబడతాయి — మొదటి పేజీలో గుర్తించిన ఆ రెండు వరుసలు.","kn":"ಸಾಮಾನ್ಯವಾಗಿ ಶುಭವಾದ ದಿನಾಂಕ ನಿಮಗೂ ಶುಭವೆಂದಲ್ಲ. ಅದನ್ನು ಎರಡು ವೈಯಕ್ತಿಕ ಅಳತೆಗಳು ನಿರ್ಧರಿಸುತ್ತವೆ, ಎರಡೂ ನಿಮ್ಮ ಸ್ವಂತ ಜನ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ಚಂದ್ರರಾಶಿಯಿಂದಲೇ ಎಣಿಸಲಾಗುತ್ತದೆ — ಮೊದಲ ಪುಟದಲ್ಲಿ ಗುರುತಿಸಿದ ಆ ಎರಡು ಸಾಲುಗಳು.","ta":"பொதுவாக நல்ல தேதி உங்களுக்கும் நல்லது என்பதில்லை. அதை இரு தனிப்பட்ட அளவீடுகள் தீர்மானிக்கின்றன, இரண்டும் உங்கள் சொந்த ஜென்ம நட்சத்திரம் மற்றும் சந்திர ராசியிலிருந்தே கணக்கிடப்படுகின்றன — முதல் பக்கத்தில் குறிக்கப்பட்ட அந்த இரு வரிசைகள்.","bn":"সাধারণভাবে শুভ তারিখ আপনার জন্যও শুভ, এমন নয়। সেটা দুটি ব্যক্তিগত মাপে ঠিক হয়, আর দুটোই আপনার নিজের জন্ম নক্ষত্র ও চন্দ্ররাশি থেকে গোনা — প্রথম পাতায় চিহ্নিত সেই দুটি সারি।","mr":"सर्वसाधारणपणे शुभ असलेली तारीख आपोआप तुमच्यासाठीही शुभ नसते. ते दोन वैयक्तिक मापांनी ठरते, आणि दोन्ही तुमच्या स्वतःच्या जन्म नक्षत्र आणि चंद्रराशीपासून मोजली जातात — पहिल्या पानावर अधोरेखित केलेल्या त्याच दोन ओळी.","gu":"સામાન્ય રીતે શુભ તારીખ આપોઆપ તમારા માટે પણ શુભ નથી હોતી. એ બે વ્યક્તિગત માપથી નક્કી થાય છે, અને બંને તમારા પોતાના જન્મ નક્ષત્ર અને ચંદ્રરાશિથી ગણાય છે — પહેલા પાના પર અધોરેખિત એ જ બે પંક્તિઓ.","as":"সাধাৰণভাৱে শুভ তাৰিখ আপোনাৰ বাবেও শুভ, এনে নহয়। সেয়া দুটা ব্যক্তিগত জোখেৰে ঠিক হয়, আৰু দুয়োটাই আপোনাৰ নিজৰ জন্ম নক্ষত্ৰ আৰু চন্দ্ৰৰাশিৰ পৰা গণনা কৰা — প্ৰথম পৃষ্ঠাত চিহ্নিত সেই দুটা শাৰী।"},"taraGood":{"en":"Your tarabala on this date is favourable. Of the nine taras, classical texts hold that only the 3rd, 5th and 7th are inauspicious; the rest are auspicious, and this one is among them.","hi":"इस तिथि पर आपका ताराबल अनुकूल है। नौ ताराओं में शास्त्र केवल तीसरी, पाँचवीं और सातवीं को अशुभ मानते हैं; शेष सभी शुभ हैं, और यह उन्हीं में से है।","te":"ఈ తేదీన మీ తారాబలం అనుకూలం. తొమ్మిది తారల్లో శాస్త్రం మూడవ, ఐదవ, ఏడవ తారలను మాత్రమే అశుభమని చెబుతుంది; మిగిలినవన్నీ శుభమే, ఇదీ వాటిలోనిదే.","kn":"ಈ ದಿನಾಂಕದಲ್ಲಿ ನಿಮ್ಮ ತಾರಾಬಲ ಅನುಕೂಲ. ಒಂಬತ್ತು ತಾರೆಗಳಲ್ಲಿ ಶಾಸ್ತ್ರ ಮೂರನೇ, ಐದನೇ ಮತ್ತು ಏಳನೇ ತಾರೆಗಳನ್ನು ಮಾತ್ರ ಅಶುಭವೆನ್ನುತ್ತದೆ; ಉಳಿದವೆಲ್ಲ ಶುಭ, ಇದೂ ಅವುಗಳಲ್ಲೊಂದು.","ta":"இந்த தேதியில் உங்கள் தாராபலம் சாதகம். ஒன்பது தாரைகளில் சாஸ்திரம் மூன்றாவது, ஐந்தாவது, ஏழாவது தாரைகளை மட்டுமே அசுபம் என்கிறது; மற்றவை அனைத்தும் சுபமே, இதுவும் அவற்றுள் ஒன்று.","bn":"এই তারিখে আপনার তারাবল অনুকূল। নয়টি তারার মধ্যে শাস্ত্র কেবল তৃতীয়, পঞ্চম ও সপ্তমকে অশুভ বলে; বাকি সব শুভ, আর এটি তাদেরই একটি।","mr":"या तारखेला तुमचे ताराबल अनुकूल आहे. नऊ ताऱ्यांपैकी शास्त्र फक्त तिसरा, पाचवा आणि सातवा अशुभ मानतात; बाकी सर्व शुभ, आणि हा त्यांपैकीच एक.","gu":"આ તારીખે તમારું તારાબળ અનુકૂળ છે. નવ તારામાંથી શાસ્ત્ર ફક્ત ત્રીજી, પાંચમી અને સાતમીને અશુભ ગણે છે; બાકી બધી શુભ, અને આ પણ એમાંની જ એક.","as":"এই তাৰিখত আপোনাৰ তাৰাবল অনুকূল। ন টা তাৰাৰ ভিতৰত শাস্ত্ৰই কেৱল তৃতীয়, পঞ্চম আৰু সপ্তমক অশুভ বোলে; বাকী সকলো শুভ, আৰু এইটোও সিহঁতৰে এটা।"},"taraNeutral":{"en":"This date falls in your Janma tara — the star you were born under. Classical texts treat it as neutral rather than inauspicious: well suited to personal matters, health and quiet observance, traditionally avoided for launching something new.","hi":"यह तिथि आपकी जन्म तारा में पड़ती है — वही नक्षत्र जिसमें आपका जन्म हुआ। शास्त्र इसे अशुभ नहीं, तटस्थ मानते हैं: व्यक्तिगत कार्यों, स्वास्थ्य और शांत साधना के लिए उपयुक्त, किसी नए आरंभ के लिए परंपरागत रूप से टाली जाती है।","te":"ఈ తేదీ మీ జన్మ తారలో పడుతుంది — మీరు పుట్టిన నక్షత్రం. శాస్త్రం దీన్ని అశుభమని కాక తటస్థమని చెబుతుంది: వ్యక్తిగత విషయాలు, ఆరోగ్యం, నిశ్శబ్ద సాధనకు తగినది; కొత్తది మొదలుపెట్టడానికి సంప్రదాయంగా తప్పించుకుంటారు.","kn":"ಈ ದಿನಾಂಕ ನಿಮ್ಮ ಜನ್ಮ ತಾರೆಯಲ್ಲಿ ಬೀಳುತ್ತದೆ — ನೀವು ಹುಟ್ಟಿದ ನಕ್ಷತ್ರ. ಶಾಸ್ತ್ರ ಇದನ್ನು ಅಶುಭವೆನ್ನದೆ ತಟಸ್ಥವೆನ್ನುತ್ತದೆ: ವೈಯಕ್ತಿಕ ವಿಷಯಗಳು, ಆರೋಗ್ಯ ಮತ್ತು ಮೌನ ಸಾಧನೆಗೆ ಸೂಕ್ತ; ಹೊಸದನ್ನು ಆರಂಭಿಸಲು ಸಂಪ್ರದಾಯವಾಗಿ ತಪ್ಪಿಸಲಾಗುತ್ತದೆ.","ta":"இந்த தேதி உங்கள் ஜென்ம தாரையில் விழுகிறது — நீங்கள் பிறந்த நட்சத்திரம். சாஸ்திரம் இதை அசுபம் என்னாமல் நடுநிலை என்கிறது: தனிப்பட்ட விஷயங்கள், உடல்நலம், அமைதியான சாதனைக்கு ஏற்றது; புதிதாக ஒன்றைத் தொடங்க மரபுப்படி தவிர்க்கப்படுகிறது.","bn":"এই তারিখ আপনার জন্ম তারায় পড়ে — যে নক্ষত্রে আপনার জন্ম। শাস্ত্র একে অশুভ নয়, নিরপেক্ষ বলে: ব্যক্তিগত কাজ, স্বাস্থ্য ও শান্ত সাধনার জন্য উপযুক্ত, নতুন কিছু শুরু করার জন্য পরম্পরাগতভাবে এড়ানো হয়।","mr":"ही तारीख तुमच्या जन्म ताऱ्यात येते — ज्या नक्षत्रात तुमचा जन्म झाला. शास्त्र याला अशुभ नव्हे, तटस्थ मानतात: वैयक्तिक कामे, आरोग्य आणि शांत साधनेसाठी योग्य; नवीन काही सुरू करण्यासाठी परंपरेने टाळली जाते.","gu":"આ તારીખ તમારા જન્મ તારામાં પડે છે — જે નક્ષત્રમાં તમારો જન્મ થયો. શાસ્ત્ર એને અશુભ નહીં, તટસ્થ ગણે છે: વ્યક્તિગત કામો, આરોગ્ય અને શાંત સાધના માટે યોગ્ય; નવું કંઈ શરૂ કરવા પરંપરાગત રીતે ટાળવામાં આવે છે.","as":"এই তাৰিখ আপোনাৰ জন্ম তাৰাত পৰে — যিটো নক্ষত্ৰত আপোনাৰ জন্ম। শাস্ত্ৰই ইয়াক অশুভ নহয়, নিৰপেক্ষ বোলে: ব্যক্তিগত কাম, স্বাস্থ্য আৰু শান্ত সাধনাৰ বাবে উপযুক্ত; নতুন কিবা আৰম্ভ কৰিবলৈ পৰম্পৰাগতভাৱে এৰাই চলা হয়।"},"taraCare":{"en":"This date falls in one of the three taras classical texts hold inauspicious. That does not make the day unusable — the traditional remedy is simple charity before beginning — but if the date can be moved, the other windows in this report are the better choice.","hi":"यह तिथि उन तीन ताराओं में से एक में पड़ती है जिन्हें शास्त्र अशुभ मानते हैं। इससे दिन अनुपयोगी नहीं हो जाता — परंपरागत उपाय आरंभ से पहले सरल दान है — पर यदि तिथि बदली जा सकती हो, तो इस रिपोर्ट के अन्य मुहूर्त बेहतर विकल्प हैं।","te":"ఈ తేదీ శాస్త్రం అశుభమని చెప్పే మూడు తారల్లో ఒకదానిలో పడుతుంది. దీనివల్ల ఆ రోజు పనికిరాదని కాదు — మొదలుపెట్టే ముందు సరళమైన దానం సంప్రదాయ పరిహారం — కానీ తేదీ మార్చగలిగితే, ఈ నివేదికలోని ఇతర ముహూర్తాలే మేలు.","kn":"ಈ ದಿನಾಂಕ ಶಾಸ್ತ್ರ ಅಶುಭವೆನ್ನುವ ಮೂರು ತಾರೆಗಳಲ್ಲಿ ಒಂದರಲ್ಲಿ ಬೀಳುತ್ತದೆ. ಇದರಿಂದ ದಿನ ನಿರುಪಯುಕ್ತವಾಗುವುದಿಲ್ಲ — ಆರಂಭಿಸುವ ಮೊದಲು ಸರಳ ದಾನ ಸಂಪ್ರದಾಯದ ಪರಿಹಾರ — ಆದರೆ ದಿನಾಂಕ ಬದಲಿಸಲು ಸಾಧ್ಯವಿದ್ದರೆ, ಈ ವರದಿಯ ಇತರ ಮುಹೂರ್ತಗಳೇ ಉತ್ತಮ.","ta":"இந்த தேதி சாஸ்திரம் அசுபம் என்னும் மூன்று தாரைகளில் ஒன்றில் விழுகிறது. இதனால் அந்நாள் பயனற்றதாகிவிடாது — தொடங்கும் முன் எளிய தானம் மரபுவழிப் பரிகாரம் — ஆனால் தேதியை மாற்ற முடிந்தால், இந்த அறிக்கையின் மற்ற முகூர்த்தங்களே சிறந்தவை.","bn":"এই তারিখ শাস্ত্র যে তিনটি তারাকে অশুভ বলে তারই একটিতে পড়ে। এতে দিনটি অব্যবহার্য হয়ে যায় না — শুরু করার আগে সাধারণ দান পরম্পরাগত প্রতিকার — তবে তারিখ বদলানো গেলে, এই রিপোর্টের অন্য মুহূর্তগুলিই ভালো।","mr":"ही तारीख शास्त्र अशुभ मानतात त्या तीन ताऱ्यांपैकी एकात येते. यामुळे दिवस निरुपयोगी होत नाही — सुरुवातीपूर्वी साधे दान हा परंपरागत परिहार — पण तारीख बदलता येत असेल, तर या अहवालातील इतर मुहूर्त अधिक चांगले.","gu":"આ તારીખ શાસ્ત્ર અશુભ ગણે છે એ ત્રણ તારામાંની એકમાં પડે છે. એથી દિવસ નકામો થઈ જતો નથી — શરૂ કરતાં પહેલાં સાદું દાન પરંપરાગત પરિહાર છે — પણ તારીખ બદલી શકાય તો, આ અહેવાલનાં બીજાં મુહૂર્ત વધુ સારાં.","as":"এই তাৰিখ শাস্ত্ৰই অশুভ বোলা তিনিটা তাৰাৰ এটাত পৰে। ইয়াৰ বাবে দিনটো অকামিলা নহয় — আৰম্ভ কৰাৰ আগতে সৰল দান পৰম্পৰাগত প্ৰতিকাৰ — কিন্তু তাৰিখ সলনি কৰিব পাৰিলে, এই প্ৰতিবেদনৰ আন মুহূৰ্তবোৰেই ভাল।"},"chandraGood":{"en":"Your chandrabala is favourable on this date — the Moon stands in one of the positions counted auspicious from your birth Moon sign.","hi":"इस तिथि पर आपका चंद्रबल अनुकूल है — चंद्रमा आपकी जन्म चंद्रराशि से शुभ मानी गई स्थितियों में से एक में है।","te":"ఈ తేదీన మీ చంద్రబలం అనుకూలం — మీ జన్మ చంద్రరాశి నుండి శుభమని లెక్కించే స్థానాల్లో ఒకదానిలో చంద్రుడు ఉన్నాడు.","kn":"ಈ ದಿನಾಂಕದಲ್ಲಿ ನಿಮ್ಮ ಚಂದ್ರಬಲ ಅನುಕೂಲ — ನಿಮ್ಮ ಜನ್ಮ ಚಂದ್ರರಾಶಿಯಿಂದ ಶುಭವೆಂದು ಎಣಿಸುವ ಸ್ಥಾನಗಳಲ್ಲಿ ಒಂದರಲ್ಲಿ ಚಂದ್ರನಿದ್ದಾನೆ.","ta":"இந்த தேதியில் உங்கள் சந்திரபலம் சாதகம் — உங்கள் ஜென்ம சந்திர ராசியிலிருந்து சுபம் எனக் கணக்கிடப்படும் இடங்களில் ஒன்றில் சந்திரன் உள்ளார்.","bn":"এই তারিখে আপনার চন্দ্রবল অনুকূল — আপনার জন্ম চন্দ্ররাশি থেকে শুভ বলে গোনা স্থানগুলির একটিতে চন্দ্র আছেন।","mr":"या तारखेला तुमचे चंद्रबल अनुकूल आहे — तुमच्या जन्म चंद्रराशीपासून शुभ मानल्या जाणाऱ्या स्थानांपैकी एकात चंद्र आहे.","gu":"આ તારીખે તમારું ચંદ્રબળ અનુકૂળ છે — તમારી જન્મ ચંદ્રરાશિથી શુભ ગણાતાં સ્થાનોમાંના એકમાં ચંદ્ર છે.","as":"এই তাৰিখত আপোনাৰ চন্দ্ৰবল অনুকূল — আপোনাৰ জন্ম চন্দ্ৰৰাশিৰ পৰা শুভ বুলি গণনা কৰা স্থানবোৰৰ এটাত চন্দ্ৰ আছে।"},"chandraCare":{"en":"Your chandrabala is not favourable on this date. It is a lesser consideration than tarabala and does not by itself rule a date out; treat it as a reason to prefer one of the stronger windows if you have the choice.","hi":"इस तिथि पर आपका चंद्रबल अनुकूल नहीं है। यह ताराबल से कम महत्व का है और अकेले किसी तिथि को अस्वीकार नहीं करता; यदि विकल्प हो तो इसे किसी अधिक बलवान मुहूर्त को चुनने का कारण मानिए।","te":"ఈ తేదీన మీ చంద్రబలం అనుకూలం కాదు. ఇది తారాబలం కంటే తక్కువ ప్రాధాన్యమైనది, ఒక్కటే ఒక తేదీని తోసిపుచ్చదు; అవకాశం ఉంటే మరింత బలమైన ముహూర్తాన్ని ఎంచుకోవడానికి కారణంగా చూడండి.","kn":"ಈ ದಿನಾಂಕದಲ್ಲಿ ನಿಮ್ಮ ಚಂದ್ರಬಲ ಅನುಕೂಲವಲ್ಲ. ಇದು ತಾರಾಬಲಕ್ಕಿಂತ ಕಡಿಮೆ ಮಹತ್ವದ್ದು, ಒಂದೇ ಒಂದು ದಿನಾಂಕವನ್ನು ತಳ್ಳಿಹಾಕುವುದಿಲ್ಲ; ಆಯ್ಕೆ ಇದ್ದರೆ ಹೆಚ್ಚು ಬಲವಾದ ಮುಹೂರ್ತವನ್ನು ಆರಿಸಲು ಕಾರಣವಾಗಿ ನೋಡಿ.","ta":"இந்த தேதியில் உங்கள் சந்திரபலம் சாதகமில்லை. இது தாராபலத்தைவிடக் குறைந்த முக்கியத்துவம் உள்ளது, தனியாக ஒரு தேதியை நிராகரிக்காது; வாய்ப்பிருந்தால் வலிமையான முகூர்த்தத்தைத் தேர்வு செய்யக் காரணமாகக் கொள்ளுங்கள்.","bn":"এই তারিখে আপনার চন্দ্রবল অনুকূল নয়। এটি তারাবলের চেয়ে কম গুরুত্বের এবং একা কোনো তারিখ বাতিল করে না; সুযোগ থাকলে আরও শক্তিশালী মুহূর্ত বেছে নেওয়ার কারণ হিসেবে দেখুন।","mr":"या तारखेला तुमचे चंद्रबल अनुकूल नाही. हे ताराबलापेक्षा कमी महत्त्वाचे आहे आणि एकटे कोणतीही तारीख बाद करत नाही; पर्याय असल्यास अधिक बलवान मुहूर्त निवडण्याचे कारण म्हणून पाहा.","gu":"આ તારીખે તમારું ચંદ્રબળ અનુકૂળ નથી. એ તારાબળ કરતાં ઓછા મહત્ત્વનું છે અને એકલું કોઈ તારીખ રદ કરતું નથી; વિકલ્પ હોય તો વધુ બળવાન મુહૂર્ત પસંદ કરવાનું કારણ ગણો.","as":"এই তাৰিখত আপোনাৰ চন্দ্ৰবল অনুকূল নহয়। ই তাৰাবলতকৈ কম গুৰুত্বৰ আৰু অকলে কোনো তাৰিখ বাতিল নকৰে; সুবিধা থাকিলে অধিক বলৱান মুহূৰ্ত বাছি লোৱাৰ কাৰণ হিচাপে চাওক।"},"chandrashtama":{"en":"Chandrashtama — the Moon stands in the 8th sign from your birth Moon. Classical practice treats this as a day to postpone anything new, whatever the general panchang says. Of everything on this page, this is the one worth acting on.","hi":"चंद्राष्टम — चंद्रमा आपकी जन्म चंद्रराशि से आठवीं राशि में है। शास्त्रीय परंपरा इसे ऐसा दिन मानती है जब कोई भी नया कार्य टाल देना चाहिए, सामान्य पंचांग चाहे जो कहे। इस पृष्ठ की सब बातों में यही एक है जिस पर वास्तव में ध्यान देना चाहिए।","te":"చంద్రాష్టమ — మీ జన్మ చంద్రరాశి నుండి ఎనిమిదవ రాశిలో చంద్రుడు ఉన్నాడు. సాధారణ పంచాంగం ఏమి చెప్పినా, కొత్తది ఏదైనా వాయిదా వేయవలసిన రోజుగా శాస్త్ర సంప్రదాయం దీన్ని చూస్తుంది. ఈ పేజీలోని అన్నిటిలో నిజంగా పాటించవలసినది ఇదే.","kn":"ಚಂದ್ರಾಷ್ಟಮ — ನಿಮ್ಮ ಜನ್ಮ ಚಂದ್ರರಾಶಿಯಿಂದ ಎಂಟನೇ ರಾಶಿಯಲ್ಲಿ ಚಂದ್ರನಿದ್ದಾನೆ. ಸಾಮಾನ್ಯ ಪಂಚಾಂಗ ಏನೇ ಹೇಳಲಿ, ಹೊಸದೇನನ್ನೂ ಮುಂದೂಡಬೇಕಾದ ದಿನವೆಂದು ಶಾಸ್ತ್ರ ಸಂಪ್ರದಾಯ ಇದನ್ನು ಪರಿಗಣಿಸುತ್ತದೆ. ಈ ಪುಟದ ಎಲ್ಲದರಲ್ಲಿ ನಿಜವಾಗಿ ಪಾಲಿಸಬೇಕಾದದ್ದು ಇದೇ.","ta":"சந்திராஷ்டம — உங்கள் ஜென்ம சந்திர ராசியிலிருந்து எட்டாம் ராசியில் சந்திரன் உள்ளார். பொதுப் பஞ்சாங்கம் என்ன சொன்னாலும், புதிதாக எதையும் தள்ளிப்போட வேண்டிய நாளாக சாஸ்திர மரபு இதைக் கருதுகிறது. இந்தப் பக்கத்தில் உள்ள அனைத்திலும் உண்மையில் கடைப்பிடிக்க வேண்டியது இதுவே.","bn":"চন্দ্রাষ্টম — আপনার জন্ম চন্দ্ররাশি থেকে অষ্টম রাশিতে চন্দ্র আছেন। সাধারণ পঞ্জিকা যাই বলুক, নতুন কিছু স্থগিত রাখার দিন হিসেবেই শাস্ত্রীয় রীতি একে দেখে। এই পাতার সবকিছুর মধ্যে সত্যিই মেনে চলার মতো এটিই।","mr":"चंद्राष्टम — तुमच्या जन्म चंद्रराशीपासून आठव्या राशीत चंद्र आहे. सर्वसाधारण पंचांग काहीही म्हणो, नवीन काहीही पुढे ढकलावे असा दिवस म्हणून शास्त्रीय परंपरा याकडे पाहते. या पानावरील सर्वांत खरोखर पाळण्यासारखे हेच.","gu":"ચંદ્રાષ્ટમ — તમારી જન્મ ચંદ્રરાશિથી આઠમી રાશિમાં ચંદ્ર છે. સામાન્ય પંચાંગ ગમે તે કહે, નવું કંઈ પણ મુલતવી રાખવાનો દિવસ ગણીને શાસ્ત્રીય પરંપરા આને જુએ છે. આ પાનાની બધી વાતોમાં ખરેખર પાળવા જેવું આ જ છે.","as":"চন্দ্ৰাষ্টম — আপোনাৰ জন্ম চন্দ্ৰৰাশিৰ পৰা অষ্টম ৰাশিত চন্দ্ৰ আছে। সাধাৰণ পঞ্জিকাই যিয়েই নকওক, নতুন কিবা পিছুৱাই দিব লগা দিন হিচাপেই শাস্ত্ৰীয় ৰীতিয়ে ইয়াক চায়। এই পৃষ্ঠাৰ সকলোবোৰৰ ভিতৰত সঁচাকৈ মানি চলিব লগীয়া এইটোৱেই।"},"yourStar":{"en":"Your birth star","hi":"आपका जन्म नक्षत्र","te":"మీ జన్మ నక్షత్రం","kn":"ನಿಮ್ಮ ಜನ್ಮ ನಕ್ಷತ್ರ","ta":"உங்கள் ஜென்ம நட்சத்திரம்","bn":"আপনার জন্ম নক্ষত্র","mr":"तुमचे जन्म नक्षत्र","gu":"તમારું જન્મ નક્ષત્ર","as":"আপোনাৰ জন্ম নক্ষত্ৰ"},"dayStar":{"en":"Star on this date","hi":"इस तिथि का नक्षत्र","te":"ఈ తేదీ నక్షత్రం","kn":"ಈ ದಿನಾಂಕದ ನಕ್ಷತ್ರ","ta":"இந்த தேதியின் நட்சத்திரம்","bn":"এই তারিখের নক্ষত্র","mr":"या तारखेचे नक्षत्र","gu":"આ તારીખનું નક્ષત્ર","as":"এই তাৰিখৰ নক্ষত্ৰ"},"countFrom":{"en":"Count from your star","hi":"आपके नक्षत्र से गणना","te":"మీ నక్షత్రం నుండి లెక్క","kn":"ನಿಮ್ಮ ನಕ್ಷತ್ರದಿಂದ ಎಣಿಕೆ","ta":"உங்கள் நட்சத்திரத்திலிருந்து எண்ணிக்கை","bn":"আপনার নক্ষত্র থেকে গণনা","mr":"तुमच्या नक्षत्रापासून मोजणी","gu":"તમારા નક્ષત્રથી ગણતરી","as":"আপোনাৰ নক্ষত্ৰৰ পৰা গণনা"}},"d7Lbl":{"title":{"en":"Saptamsha (D7) — The Children's Chart","hi":"सप्तांश (D7) — संतान की कुंडली","te":"సప్తాంశ (D7) — సంతాన జాతకం","kn":"ಸಪ್ತಾಂಶ (D7) — ಸಂತಾನ ಜಾತಕ","ta":"சப்தாம்சம் (D7) — சந்ததி ஜாதகம்","bn":"সপ্তাংশ (D7) — সন্তানের কোষ্ঠী","mr":"सप्तांश (D7) — संततीची पत्रिका","gu":"સપ્તાંશ (D7) — સંતાનની કુંડળી","as":"সপ্তাংশ (D7) — সন্তানৰ কুণ্ডলী"},"intro":{"en":"Classical practice reads the seventh divisional chart for children specifically — the birth chart shows the promise, the D7 shows how it unfolds. Below is your D7 with its ascendant and the nine grahas as they stand in it.","hi":"शास्त्रीय परंपरा में सप्तम वर्ग कुंडली विशेष रूप से संतान के लिए देखी जाती है — जन्मकुंडली संभावना दिखाती है, सप्तांश दिखाता है कि वह कैसे खुलती है। नीचे आपका सप्तांश है, उसके लग्न और नौ ग्रहों की स्थिति के साथ।","te":"శాస్త్ర సంప్రదాయంలో సప్తమ వర్గ జాతకాన్ని ప్రత్యేకంగా సంతానం కోసం చూస్తారు — జన్మ జాతకం వాగ్దానాన్ని చూపితే, సప్తాంశ అది ఎలా విప్పుకుంటుందో చూపుతుంది. క్రింద మీ సప్తాంశ, దాని లగ్నం, అందులోని తొమ్మిది గ్రహాలతో సహా.","kn":"ಶಾಸ್ತ್ರ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಸಪ್ತಮ ವರ್ಗ ಜಾತಕವನ್ನು ವಿಶೇಷವಾಗಿ ಸಂತಾನಕ್ಕಾಗಿ ನೋಡಲಾಗುತ್ತದೆ — ಜನ್ಮ ಜಾತಕ ಭರವಸೆಯನ್ನು ತೋರಿಸಿದರೆ, ಸಪ್ತಾಂಶ ಅದು ಹೇಗೆ ತೆರೆದುಕೊಳ್ಳುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ. ಕೆಳಗೆ ನಿಮ್ಮ ಸಪ್ತಾಂಶ, ಅದರ ಲಗ್ನ ಮತ್ತು ಒಂಬತ್ತು ಗ್ರಹಗಳ ಸ್ಥಿತಿಯೊಂದಿಗೆ.","ta":"சாஸ்திர மரபில் ஏழாம் வர்க ஜாதகம் சந்ததிக்கெனவே பார்க்கப்படுகிறது — ஜென்ம ஜாதகம் வாக்குறுதியைக் காட்டினால், சப்தாம்சம் அது எப்படி விரிகிறது என்பதைக் காட்டுகிறது. கீழே உங்கள் சப்தாம்சம், அதன் லக்னம் மற்றும் ஒன்பது கிரகங்களின் நிலையுடன்.","bn":"শাস্ত্রীয় রীতিতে সপ্তম বর্গ কোষ্ঠী বিশেষভাবে সন্তানের জন্য দেখা হয় — জন্মকোষ্ঠী সম্ভাবনা দেখায়, সপ্তাংশ দেখায় সেটা কীভাবে খোলে। নিচে আপনার সপ্তাংশ, তার লগ্ন ও নয়টি গ্রহের অবস্থান সহ।","mr":"शास्त्रीय परंपरेत सप्तम वर्ग पत्रिका विशेषतः संततीसाठी पाहिली जाते — जन्मपत्रिका शक्यता दाखवते, सप्तांश ती कशी उलगडते ते दाखवते. खाली तुमचा सप्तांश, त्याच्या लग्नासह आणि नऊ ग्रहांच्या स्थितीसह.","gu":"શાસ્ત્રીય પરંપરામાં સપ્તમ વર્ગ કુંડળી ખાસ કરીને સંતાન માટે જોવાય છે — જન્મકુંડળી શક્યતા બતાવે છે, સપ્તાંશ એ કેવી રીતે ખૂલે છે તે બતાવે છે. નીચે તમારો સપ્તાંશ, તેના લગ્ન અને નવ ગ્રહોની સ્થિતિ સાથે.","as":"শাস্ত্ৰীয় পৰম্পৰাত সপ্তম বৰ্গ কুণ্ডলী বিশেষকৈ সন্তানৰ বাবে চোৱা হয় — জন্মকুণ্ডলীয়ে সম্ভাৱনা দেখুৱায়, সপ্তাংশই দেখুৱায় সেয়া কেনেকৈ মেলে। তলত আপোনাৰ সপ্তাংশ, ইয়াৰ লগ্ন আৰু ন টা গ্ৰহৰ অৱস্থানৰ সৈতে।"},"favNakTitle":{"en":"Birth Stars That Suit This Chart","hi":"इस कुंडली के अनुकूल जन्म नक्षत्र","te":"ఈ జాతకానికి అనుకూలమైన జన్మ నక్షత్రాలు","kn":"ಈ ಜಾತಕಕ್ಕೆ ಅನುಕೂಲವಾದ ಜನ್ಮ ನಕ್ಷತ್ರಗಳು","ta":"இந்த ஜாதகத்திற்கு ஏற்ற ஜென்ம நட்சத்திரங்கள்","bn":"এই কোষ্ঠীর অনুকূল জন্ম নক্ষত্র","mr":"या पत्रिकेला अनुकूल जन्म नक्षत्रे","gu":"આ કુંડળીને અનુકૂળ જન્મ નક્ષત્રો","as":"এই কুণ্ডলীৰ অনুকূল জন্ম নক্ষত্ৰ"},"favNakNote":{"en":"These are the birth stars classical texts associate most favourably with the fifth house of this chart. They are not a prediction of when a child will be born — they are the stars under which the naming syllables on the next page are drawn.","hi":"ये वे जन्म नक्षत्र हैं जिन्हें शास्त्र इस कुंडली के पंचम भाव के लिए सबसे अनुकूल मानते हैं। यह इस बात की भविष्यवाणी नहीं है कि संतान कब होगी — ये वे नक्षत्र हैं जिनसे अगले पृष्ठ के नामाक्षर निकाले गए हैं।","te":"ఈ జాతకపు పంచమ భావానికి శాస్త్రం అత్యంత అనుకూలమని చెప్పే జన్మ నక్షత్రాలు ఇవి. సంతానం ఎప్పుడు కలుగుతుందనే జోస్యం ఇది కాదు — తర్వాతి పేజీలోని నామాక్షరాలు ఈ నక్షత్రాల నుండే తీసుకోబడ్డాయి.","kn":"ಈ ಜಾತಕದ ಪಂಚಮ ಭಾವಕ್ಕೆ ಶಾಸ್ತ್ರ ಅತ್ಯಂತ ಅನುಕೂಲವೆನ್ನುವ ಜನ್ಮ ನಕ್ಷತ್ರಗಳಿವು. ಸಂತಾನ ಯಾವಾಗ ಎಂಬ ಭವಿಷ್ಯವಾಣಿಯಲ್ಲ ಇದು — ಮುಂದಿನ ಪುಟದ ನಾಮಾಕ್ಷರಗಳನ್ನು ಈ ನಕ್ಷತ್ರಗಳಿಂದಲೇ ತೆಗೆದುಕೊಳ್ಳಲಾಗಿದೆ.","ta":"இந்த ஜாதகத்தின் ஐந்தாம் பாவத்திற்குச் சாஸ்திரம் மிகவும் ஏற்றவை என்று சொல்லும் ஜென்ம நட்சத்திரங்கள் இவை. குழந்தை எப்போது பிறக்கும் என்ற கணிப்பு அல்ல — அடுத்த பக்கத்தின் நாமாட்சரங்கள் இந்த நட்சத்திரங்களிலிருந்தே எடுக்கப்பட்டவை.","bn":"এই কোষ্ঠীর পঞ্চম ভাবের জন্য শাস্ত্র যে জন্ম নক্ষত্রগুলিকে সবচেয়ে অনুকূল বলে, সেগুলি এই। সন্তান কবে হবে তার ভবিষ্যদ্বাণী এটি নয় — পরের পাতার নামাক্ষরগুলি এই নক্ষত্র থেকেই নেওয়া।","mr":"या पत्रिकेच्या पंचम भावासाठी शास्त्र सर्वाधिक अनुकूल मानतात ती ही जन्म नक्षत्रे. संतती कधी होईल याचे भाकीत हे नाही — पुढील पानावरील नामाक्षरे याच नक्षत्रांतून घेतलेली आहेत.","gu":"આ કુંડળીના પંચમ ભાવ માટે શાસ્ત્ર સૌથી અનુકૂળ ગણે છે એ જન્મ નક્ષત્રો આ છે. સંતાન ક્યારે થશે એની આગાહી આ નથી — આગલા પાનાનાં નામાક્ષર આ જ નક્ષત્રોમાંથી લીધેલાં છે.","as":"এই কুণ্ডলীৰ পঞ্চম ভাৱৰ বাবে শাস্ত্ৰই আটাইতকৈ অনুকূল বুলি কোৱা জন্ম নক্ষত্ৰবোৰ এইবোৰ। সন্তান কেতিয়া হ'ব তাৰ ভৱিষ্যদ্বাণী এইটো নহয় — পিছৰ পৃষ্ঠাৰ নামাক্ষৰবোৰ এই নক্ষত্ৰবোৰৰ পৰাই লোৱা।"},"lagnaNote":{"en":"D7 ascendant","hi":"सप्तांश लग्न","te":"సప్తాంశ లగ్నం","kn":"ಸಪ್ತಾಂಶ ಲಗ್ನ","ta":"சப்தாம்ச லக்னம்","bn":"সপ্তাংশ লগ্ন","mr":"सप्तांश लग्न","gu":"સપ્તાંશ લગ્ન","as":"সপ্তাংশ লগ্ন"}},"tblLbl":{"sign":{"en":"Sign","hi":"राशि","te":"రాశి","kn":"ರಾಶಿ","ta":"ராசி","bn":"রাশি","mr":"राशी","gu":"રાશિ","as":"ৰাশি"},"from":{"en":"From","hi":"से","te":"నుండి","kn":"ಇಂದ","ta":"முதல்","bn":"থেকে","mr":"पासून","gu":"થી","as":"পৰা"},"to":{"en":"To","hi":"तक","te":"వరకు","kn":"ವರೆಗೆ","ta":"வரை","bn":"পর্যন্ত","mr":"पर्यंत","gu":"સુધી","as":"লৈকে"}},"annU3":{"muddaTitle":{"en":"Mudda Dasha — The Year, Period by Period","hi":"मुद्दा दशा — वर्ष, काल दर काल","te":"ముద్దా దశ — సంవత్సరం, కాలం వారీగా","kn":"ಮುದ್ದಾ ದಶಾ — ವರ್ಷ, ಕಾಲದಿಂದ ಕಾಲಕ್ಕೆ","ta":"முத்தா தசை — ஆண்டு, காலம் வாரியாக","bn":"মুদ্দা দশা — বছর, কাল ধরে কাল","mr":"मुद्दा दशा — वर्ष, काळानुसार","gu":"મુદ્દા દશા — વર્ષ, કાળ પ્રમાણે","as":"মুদ্দা দশা — বছৰ, কাল অনুসৰি"},"muddaIntro":{"en":"Vimshottari spreads a lifetime across nine planetary periods. Mudda compresses the same nine into a single solar year, so each graha governs a stretch of days rather than years. The periods below run from your solar return to the next one, and each carries its own nine sub-periods.","hi":"विंशोत्तरी पूरे जीवन को नौ ग्रह-कालों में फैलाती है। मुद्दा उन्हीं नौ को एक सौर वर्ष में समेट देती है, जिससे हर ग्रह वर्षों के बजाय कुछ दिनों पर शासन करता है। नीचे दिए काल आपके वर्ष प्रवेश से अगले वर्ष प्रवेश तक चलते हैं, और हर काल के भीतर उसकी अपनी नौ अंतर्दशाएँ हैं।","te":"వింశోత్తరి జీవితమంతటినీ తొమ్మిది గ్రహ కాలాలుగా విస్తరిస్తుంది. ముద్దా అదే తొమ్మిదింటినీ ఒకే సౌర సంవత్సరంలో ఇముడుస్తుంది, తద్వారా ప్రతి గ్రహమూ సంవత్సరాలకు బదులు కొన్ని రోజులను పాలిస్తుంది. క్రింది కాలాలు మీ వర్ష ప్రవేశం నుండి తర్వాతి వర్ష ప్రవేశం వరకు నడుస్తాయి, ప్రతి కాలంలోనూ దాని సొంత తొమ్మిది అంతర్దశలు ఉంటాయి.","kn":"ವಿಂಶೋತ್ತರಿ ಇಡೀ ಬದುಕನ್ನು ಒಂಬತ್ತು ಗ್ರಹ ಕಾಲಗಳಲ್ಲಿ ಹರಡುತ್ತದೆ. ಮುದ್ದಾ ಅದೇ ಒಂಬತ್ತನ್ನೂ ಒಂದೇ ಸೌರ ವರ್ಷದಲ್ಲಿ ಸಂಕುಚಿಸುತ್ತದೆ, ಹಾಗಾಗಿ ಪ್ರತಿ ಗ್ರಹವೂ ವರ್ಷಗಳ ಬದಲು ಕೆಲವು ದಿನಗಳನ್ನು ಆಳುತ್ತದೆ. ಕೆಳಗಿನ ಕಾಲಗಳು ನಿಮ್ಮ ವರ್ಷ ಪ್ರವೇಶದಿಂದ ಮುಂದಿನ ವರ್ಷ ಪ್ರವೇಶದವರೆಗೆ ನಡೆಯುತ್ತವೆ, ಪ್ರತಿ ಕಾಲದಲ್ಲೂ ಅದರ ಸ್ವಂತ ಒಂಬತ್ತು ಅಂತರ್ದಶೆಗಳಿವೆ.","ta":"விம்சோத்தரி வாழ்நாள் முழுவதையும் ஒன்பது கிரக காலங்களாக விரிக்கிறது. முத்தா அதே ஒன்பதையும் ஒரே சூரிய ஆண்டுக்குள் சுருக்குகிறது, எனவே ஒவ்வொரு கிரகமும் ஆண்டுகளுக்குப் பதிலாகச் சில நாட்களை ஆள்கிறது. கீழ்க்கண்ட காலங்கள் உங்கள் வர்ஷ பிரவேசத்திலிருந்து அடுத்த வர்ஷ பிரவேசம் வரை இயங்குகின்றன, ஒவ்வொரு காலத்திலும் அதன் சொந்த ஒன்பது அந்தர்தசைகள் உள்ளன.","bn":"বিংশোত্তরী গোটা জীবনকে নয়টি গ্রহ-কালে ছড়িয়ে দেয়। মুদ্দা সেই নয়টিকেই একটি সৌর বছরে গুটিয়ে আনে, ফলে প্রতিটি গ্রহ বছরের বদলে কয়েকটি দিন শাসন করে। নিচের কালগুলি আপনার বর্ষ প্রবেশ থেকে পরের বর্ষ প্রবেশ পর্যন্ত চলে, আর প্রতিটি কালের ভেতরে তার নিজস্ব নয়টি অন্তর্দশা আছে।","mr":"विंशोत्तरी संपूर्ण आयुष्य नऊ ग्रह-काळांत पसरवते. मुद्दा त्याच नऊ काळांना एका सौर वर्षात आवळते, त्यामुळे प्रत्येक ग्रह वर्षांऐवजी काही दिवसांवर राज्य करतो. खालील काळ तुमच्या वर्ष प्रवेशापासून पुढच्या वर्ष प्रवेशापर्यंत चालतात, आणि प्रत्येक काळात त्याच्या स्वतःच्या नऊ अंतर्दशा आहेत.","gu":"વિંશોત્તરી આખા જીવનને નવ ગ્રહ-કાળમાં ફેલાવે છે. મુદ્દા એ જ નવને એક સૌર વર્ષમાં સમાવી લે છે, જેથી દરેક ગ્રહ વર્ષોને બદલે થોડા દિવસો પર શાસન કરે છે. નીચેના કાળ તમારા વર્ષ પ્રવેશથી આગલા વર્ષ પ્રવેશ સુધી ચાલે છે, અને દરેક કાળમાં એની પોતાની નવ અંતર્દશા છે.","as":"বিংশোত্তৰীয়ে গোটেই জীৱনক ন টা গ্ৰহ-কালত বিয়পাই দিয়ে। মুদ্দাই সেই ন টাকেই এটা সৌৰ বছৰত সামৰি লয়, ফলত প্ৰতিটো গ্ৰহই বছৰৰ সলনি কেইদিনমান শাসন কৰে। তলৰ কালবোৰ আপোনাৰ বৰ্ষ প্ৰৱেশৰ পৰা পিছৰ বৰ্ষ প্ৰৱেশলৈ চলে, আৰু প্ৰতিটো কালৰ ভিতৰত তাৰ নিজা ন টা অন্তৰ্দশা আছে।"},"muddaNote":{"en":"Two conventions exist for the opening period. This report uses the nine-full method, where each graha takes a complete period — the same method the widely used online calculators follow, so the rows here can be compared against them directly. The textbook alternative splits the first lord by the portion of the birth nakshatra already elapsed.","hi":"प्रारंभिक काल के लिए दो परंपराएँ हैं। यह रिपोर्ट नौ-पूर्ण पद्धति का उपयोग करती है, जिसमें हर ग्रह पूरा काल लेता है — वही पद्धति जो व्यापक रूप से प्रयुक्त ऑनलाइन गणकों में है, इसलिए यहाँ की पंक्तियाँ उनसे सीधे मिलाई जा सकती हैं। पाठ्यपुस्तक का विकल्प पहले स्वामी को जन्म नक्षत्र के बीते हुए भाग के अनुसार बाँटता है।","te":"ప్రారంభ కాలానికి రెండు సంప్రదాయాలున్నాయి. ఈ నివేదిక తొమ్మిది-పూర్ణ పద్ధతిని వాడుతుంది, అందులో ప్రతి గ్రహమూ పూర్తి కాలాన్ని తీసుకుంటుంది — విస్తృతంగా వాడే ఆన్‌లైన్ లెక్కింపులు అనుసరించే అదే పద్ధతి, కాబట్టి ఇక్కడి వరుసలను వాటితో నేరుగా పోల్చవచ్చు. పాఠ్యపుస్తక ప్రత్యామ్నాయం మొదటి అధిపతిని జన్మ నక్షత్రంలో గడిచిన భాగం ప్రకారం విభజిస్తుంది.","kn":"ಆರಂಭಿಕ ಕಾಲಕ್ಕೆ ಎರಡು ಸಂಪ್ರದಾಯಗಳಿವೆ. ಈ ವರದಿ ಒಂಬತ್ತು-ಪೂರ್ಣ ಪದ್ಧತಿಯನ್ನು ಬಳಸುತ್ತದೆ, ಅದರಲ್ಲಿ ಪ್ರತಿ ಗ್ರಹವೂ ಪೂರ್ಣ ಕಾಲವನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ — ವ್ಯಾಪಕವಾಗಿ ಬಳಸುವ ಆನ್‌ಲೈನ್ ಗಣಕಗಳು ಅನುಸರಿಸುವ ಅದೇ ಪದ್ಧತಿ, ಆದ್ದರಿಂದ ಇಲ್ಲಿನ ಸಾಲುಗಳನ್ನು ಅವುಗಳೊಂದಿಗೆ ನೇರವಾಗಿ ಹೋಲಿಸಬಹುದು. ಪಠ್ಯಪುಸ್ತಕದ ಪರ್ಯಾಯ ಮೊದಲ ಅಧಿಪತಿಯನ್ನು ಜನ್ಮ ನಕ್ಷತ್ರದಲ್ಲಿ ಕಳೆದ ಭಾಗದ ಪ್ರಕಾರ ವಿಭಜಿಸುತ್ತದೆ.","ta":"தொடக்கக் காலத்திற்கு இரு மரபுகள் உள்ளன. இந்த அறிக்கை ஒன்பது-முழு முறையைப் பயன்படுத்துகிறது, அதில் ஒவ்வொரு கிரகமும் முழுக் காலத்தை எடுக்கிறது — பரவலாகப் பயன்படுத்தப்படும் ஆன்லைன் கணிப்பான்கள் பின்பற்றும் அதே முறை, எனவே இங்குள்ள வரிசைகளை அவற்றுடன் நேரடியாக ஒப்பிடலாம். பாடநூல் மாற்று முதல் அதிபதியை ஜென்ம நட்சத்திரத்தில் கழிந்த பகுதிக்கேற்பப் பிரிக்கிறது.","bn":"শুরুর কালের জন্য দুটি রীতি আছে। এই রিপোর্ট নয়-পূর্ণ পদ্ধতি ব্যবহার করে, যেখানে প্রতিটি গ্রহ একটি সম্পূর্ণ কাল নেয় — ব্যাপকভাবে ব্যবহৃত অনলাইন গণকগুলি যে পদ্ধতিই অনুসরণ করে, তাই এখানকার সারিগুলি সেগুলির সঙ্গে সরাসরি মেলানো যায়। পাঠ্যপুস্তকের বিকল্পটি প্রথম অধিপতিকে জন্ম নক্ষত্রের অতিবাহিত অংশ অনুযায়ী ভাগ করে।","mr":"सुरुवातीच्या काळासाठी दोन परंपरा आहेत. हा अहवाल नऊ-पूर्ण पद्धत वापरतो, ज्यात प्रत्येक ग्रह पूर्ण काळ घेतो — व्यापकपणे वापरली जाणारी ऑनलाइन गणके हीच पद्धत वापरतात, त्यामुळे इथल्या ओळी त्यांच्याशी थेट ताडून पाहता येतात. पाठ्यपुस्तकातील पर्याय पहिल्या स्वामीला जन्म नक्षत्रातील उलटलेल्या भागानुसार विभागतो.","gu":"શરૂઆતના કાળ માટે બે પરંપરાઓ છે. આ અહેવાલ નવ-પૂર્ણ પદ્ધતિ વાપરે છે, જેમાં દરેક ગ્રહ પૂરો કાળ લે છે — વ્યાપક રીતે વપરાતાં ઓનલાઇન ગણક એ જ પદ્ધતિ અનુસરે છે, એટલે અહીંની પંક્તિઓ એમની સાથે સીધી મેળવી શકાય. પાઠ્યપુસ્તકનો વિકલ્પ પહેલા સ્વામીને જન્મ નક્ષત્રમાં વીતેલા ભાગ પ્રમાણે વહેંચે છે.","as":"আৰম্ভণিৰ কালৰ বাবে দুটা ৰীতি আছে। এই প্ৰতিবেদনে ন-পূৰ্ণ পদ্ধতি ব্যৱহাৰ কৰে, য'ত প্ৰতিটো গ্ৰহই এটা সম্পূৰ্ণ কাল লয় — ব্যাপকভাৱে ব্যৱহৃত অনলাইন গণকবোৰে সেই পদ্ধতিয়েই মানে, সেয়েহে ইয়াৰ শাৰীবোৰ সিহঁতৰ সৈতে পোনপটীয়াকৈ মিলাব পাৰি। পাঠ্যপুথিৰ বিকল্পই প্ৰথম অধিপতিক জন্ম নক্ষত্ৰত পাৰ হোৱা ভাগ অনুসৰি ভাগ কৰে।"},"sahamTitle":{"en":"Sixteen Sahams — The Year's Sensitive Points","hi":"सोलह सहम — वर्ष के संवेदनशील बिंदु","te":"పదహారు సహమ్‌లు — సంవత్సరపు సున్నిత బిందువులు","kn":"ಹದಿನಾರು ಸಹಮ್‌ಗಳು — ವರ್ಷದ ಸೂಕ್ಷ್ಮ ಬಿಂದುಗಳು","ta":"பதினாறு ஸஹம் — ஆண்டின் நுட்பமான புள்ளிகள்","bn":"ষোলোটি সহম — বছরের সংবেদনশীল বিন্দু","mr":"सोळा सहम — वर्षाचे संवेदनशील बिंदू","gu":"સોળ સહમ — વર્ષના સંવેદનશીલ બિંદુ","as":"ষোল্লটা সহম — বছৰৰ সংবেদনশীল বিন্দু"},"sahamIntro":{"en":"A saham is not a planet and not a prediction. It is a calculated point in the zodiac, derived from the positions of two grahas and the ascendant at your solar return, and each one marks a theme the year touches. Sixteen are computed here; classical Tajika lists run longer, and the rest are omitted rather than guessed.","hi":"सहम न ग्रह है न भविष्यवाणी। यह राशिचक्र में गणना किया गया एक बिंदु है, जो आपके वर्ष प्रवेश के समय दो ग्रहों और लग्न की स्थिति से निकाला जाता है, और हर सहम उस विषय को दर्शाता है जिसे वर्ष छूता है। यहाँ सोलह की गणना है; शास्त्रीय ताजिक सूचियाँ इससे लंबी हैं, और शेष का अनुमान लगाने के बजाय उन्हें छोड़ दिया गया है।","te":"సహమ్ గ్రహమూ కాదు, జోస్యమూ కాదు. ఇది రాశిచక్రంలో లెక్కించిన ఒక బిందువు, మీ వర్ష ప్రవేశ సమయంలో రెండు గ్రహాల, లగ్నం స్థానాల నుండి తీసుకున్నది, ప్రతి సహమ్ ఆ సంవత్సరం స్పృశించే ఒక అంశాన్ని సూచిస్తుంది. ఇక్కడ పదహారు లెక్కించబడ్డాయి; శాస్త్రీయ తాజిక జాబితాలు దీనికంటే పొడవైనవి, మిగిలినవి ఊహించే బదులు వదిలివేయబడ్డాయి.","kn":"ಸಹಮ್ ಗ್ರಹವೂ ಅಲ್ಲ, ಭವಿಷ್ಯವಾಣಿಯೂ ಅಲ್ಲ. ಇದು ರಾಶಿಚಕ್ರದಲ್ಲಿ ಲೆಕ್ಕಿಸಿದ ಒಂದು ಬಿಂದು, ನಿಮ್ಮ ವರ್ಷ ಪ್ರವೇಶದ ಸಮಯದಲ್ಲಿ ಎರಡು ಗ್ರಹಗಳ ಮತ್ತು ಲಗ್ನದ ಸ್ಥಾನಗಳಿಂದ ಪಡೆದದ್ದು, ಪ್ರತಿ ಸಹಮ್ ವರ್ಷ ಸ್ಪರ್ಶಿಸುವ ಒಂದು ವಿಷಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಇಲ್ಲಿ ಹದಿನಾರು ಲೆಕ್ಕಿಸಲಾಗಿದೆ; ಶಾಸ್ತ್ರೀಯ ತಾಜಿಕ ಪಟ್ಟಿಗಳು ಇದಕ್ಕಿಂತ ಉದ್ದವಾಗಿವೆ, ಉಳಿದವನ್ನು ಊಹಿಸುವ ಬದಲು ಬಿಡಲಾಗಿದೆ.","ta":"ஸஹம் ஒரு கிரகமும் அல்ல, கணிப்பும் அல்ல. இது ராசிச்சக்கரத்தில் கணக்கிடப்பட்ட ஒரு புள்ளி, உங்கள் வர்ஷ பிரவேச நேரத்தில் இரு கிரகங்கள் மற்றும் லக்னத்தின் நிலைகளிலிருந்து பெறப்பட்டது, ஒவ்வொரு ஸஹமும் ஆண்டு தொடும் ஒரு கருப்பொருளைக் குறிக்கிறது. இங்கே பதினாறு கணக்கிடப்பட்டுள்ளன; சாஸ்திர தாஜிக பட்டியல்கள் இதைவிட நீளமானவை, மீதமுள்ளவை ஊகிக்கப்படாமல் விடப்பட்டுள்ளன.","bn":"সহম গ্রহও নয়, ভবিষ্যদ্বাণীও নয়। এটি রাশিচক্রে গণনা করা একটি বিন্দু, আপনার বর্ষ প্রবেশের সময় দুটি গ্রহ ও লগ্নের অবস্থান থেকে পাওয়া, আর প্রতিটি সহম বছর যে বিষয়টি ছোঁয় তা চিহ্নিত করে। এখানে ষোলোটি গণনা করা; শাস্ত্রীয় তাজিক তালিকা এর চেয়ে দীর্ঘ, আর বাকিগুলি অনুমান না করে বাদ দেওয়া হয়েছে।","mr":"सहम ना ग्रह आहे ना भाकीत. हा राशिचक्रातील एक मोजलेला बिंदू आहे, तुमच्या वर्ष प्रवेशाच्या वेळी दोन ग्रह आणि लग्नाच्या स्थानांवरून काढलेला, आणि प्रत्येक सहम वर्ष ज्या विषयाला स्पर्श करते तो दर्शवतो. इथे सोळा मोजले आहेत; शास्त्रीय ताजिक याद्या याहून मोठ्या आहेत, आणि उरलेल्यांचा अंदाज न लावता त्या वगळल्या आहेत.","gu":"સહમ ન તો ગ્રહ છે ન આગાહી. એ રાશિચક્રમાં ગણેલો એક બિંદુ છે, તમારા વર્ષ પ્રવેશ સમયે બે ગ્રહ અને લગ્નનાં સ્થાનોમાંથી કાઢેલો, અને દરેક સહમ વર્ષ જે વિષયને સ્પર્શે છે એ દર્શાવે છે. અહીં સોળ ગણ્યાં છે; શાસ્ત્રીય તાજિક યાદીઓ આનાથી લાંબી છે, અને બાકીનાંનું અનુમાન કરવાને બદલે એ છોડી દીધાં છે.","as":"সহম গ্ৰহও নহয়, ভৱিষ্যদ্বাণীও নহয়। ই ৰাশিচক্ৰত গণনা কৰা এটা বিন্দু, আপোনাৰ বৰ্ষ প্ৰৱেশৰ সময়ত দুটা গ্ৰহ আৰু লগ্নৰ অৱস্থানৰ পৰা পোৱা, আৰু প্ৰতিটো সহমে বছৰে স্পৰ্শ কৰা এটা বিষয় চিহ্নিত কৰে। ইয়াত ষোল্লটা গণনা কৰা হৈছে; শাস্ত্ৰীয় তাজিক তালিকা ইয়াতকৈ দীঘল, আৰু বাকীবোৰ অনুমান নকৰাকৈ বাদ দিয়া হৈছে।"},"days":{"en":"days","hi":"दिन","te":"రోజులు","kn":"ದಿನ","ta":"நாட்கள்","bn":"দিন","mr":"दिवस","gu":"દિવસ","as":"দিন"},"degree":{"en":"Degree","hi":"अंश","te":"అంశ","kn":"ಅಂಶ","ta":"பாகை","bn":"অংশ","mr":"अंश","gu":"અંશ","as":"অংশ"},"running":{"en":"Running now","hi":"अभी चल रहा है","te":"ప్రస్తుతం నడుస్తోంది","kn":"ಈಗ ನಡೆಯುತ್ತಿದೆ","ta":"இப்போது நடக்கிறது","bn":"এখন চলছে","mr":"सध्या चालू","gu":"હાલ ચાલુ","as":"এতিয়া চলি আছে"},"antarTitle":{"en":"Inside Each Period — Week by Week","hi":"हर काल के भीतर — सप्ताह दर सप्ताह","te":"ప్రతి కాలం లోపల — వారం వారం","kn":"ಪ್ರತಿ ಕಾಲದ ಒಳಗೆ — ವಾರದಿಂದ ವಾರಕ್ಕೆ","ta":"ஒவ்வொரு காலத்தினுள்ளும் — வாரம் வாரமாக","bn":"প্রতিটি কালের ভেতরে — সপ্তাহে সপ্তাহে","mr":"प्रत्येक काळाच्या आत — आठवड्यामागून आठवडा","gu":"દરેક કાળની અંદર — અઠવાડિયે અઠવાડિયે","as":"প্ৰতিটো কালৰ ভিতৰত — সপ্তাহে সপ্তাহে"},"antarIntro":{"en":"Each of the nine periods above divides again into nine, so the year resolves into eighty-one stretches of a few days each. This is the level at which a year stops being a mood and starts being a calendar — the shortest here runs under a day, the longest a little over a week.","hi":"ऊपर दिए नौ कालों में से हर एक फिर नौ में बँटता है, जिससे वर्ष इक्यासी छोटे खंडों में खुलता है, हर एक कुछ दिनों का। यही वह स्तर है जहाँ वर्ष एक मनोदशा नहीं रह जाता और एक पंचांग बन जाता है — यहाँ सबसे छोटा खंड एक दिन से भी कम का है, सबसे बड़ा एक सप्ताह से कुछ अधिक।","te":"పైన ఉన్న తొమ్మిది కాలాల్లో ప్రతి ఒక్కటీ మళ్ళీ తొమ్మిదిగా విడిపోతుంది, తద్వారా సంవత్సరం ఎనభై ఒక్క చిన్న భాగాలుగా విడుతుంది, ఒక్కొక్కటీ కొన్ని రోజులది. సంవత్సరం ఒక భావన కాకుండా ఒక పంచాంగంగా మారే స్థాయి ఇదే — ఇక్కడ అతి చిన్నది ఒక రోజు కంటే తక్కువ, అతి పెద్దది వారం కంటే కొంచెం ఎక్కువ.","kn":"ಮೇಲಿನ ಒಂಬತ್ತು ಕಾಲಗಳಲ್ಲಿ ಪ್ರತಿಯೊಂದೂ ಮತ್ತೆ ಒಂಬತ್ತಾಗಿ ವಿಭಜನೆಯಾಗುತ್ತದೆ, ಹಾಗಾಗಿ ವರ್ಷ ಎಂಬತ್ತೊಂದು ಸಣ್ಣ ಭಾಗಗಳಾಗಿ ಬಿಡಿಸಿಕೊಳ್ಳುತ್ತದೆ, ಪ್ರತಿಯೊಂದೂ ಕೆಲವು ದಿನಗಳದ್ದು. ವರ್ಷ ಒಂದು ಭಾವನೆಯಾಗಿ ಉಳಿಯದೆ ಪಂಚಾಂಗವಾಗುವ ಮಟ್ಟ ಇದೇ — ಇಲ್ಲಿ ಅತಿ ಚಿಕ್ಕದು ಒಂದು ದಿನಕ್ಕಿಂತ ಕಡಿಮೆ, ಅತಿ ದೊಡ್ಡದು ವಾರಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಹೆಚ್ಚು.","ta":"மேலே உள்ள ஒன்பது காலங்களில் ஒவ்வொன்றும் மீண்டும் ஒன்பதாகப் பிரிகிறது, எனவே ஆண்டு எண்பத்தொரு சிறு பகுதிகளாக விரிகிறது, ஒவ்வொன்றும் சில நாட்கள். ஆண்டு ஒரு மனநிலையாக இல்லாமல் ஒரு பஞ்சாங்கமாக மாறும் நிலை இதுவே — இங்கே மிகச் சிறியது ஒரு நாளுக்கும் குறைவு, மிகப் பெரியது ஒரு வாரத்துக்குச் சற்று மேல்.","bn":"উপরের নয়টি কালের প্রতিটি আবার নয়ে ভাগ হয়, ফলে বছরটি একাশিটি ছোট পর্বে খুলে যায়, প্রতিটি কয়েক দিনের। এই স্তরেই বছর আর একটা মেজাজ থাকে না, একটা পঞ্জিকা হয়ে ওঠে — এখানে সবচেয়ে ছোটটি একদিনেরও কম, সবচেয়ে বড়টি সপ্তাহের চেয়ে সামান্য বেশি।","mr":"वरील नऊ काळांपैकी प्रत्येक पुन्हा नऊत विभागतो, त्यामुळे वर्ष एक्याऐंशी लहान टप्प्यांत उलगडते, प्रत्येक काही दिवसांचा. याच पातळीवर वर्ष एक मनःस्थिती राहत नाही आणि पंचांग बनते — इथे सर्वात लहान एका दिवसापेक्षा कमी, सर्वात मोठा आठवड्यापेक्षा थोडा जास्त.","gu":"ઉપરના નવ કાળમાંથી દરેક ફરી નવમાં વહેંચાય છે, જેથી વર્ષ એક્યાસી નાના તબક્કામાં ખૂલે છે, દરેક થોડા દિવસનો. આ જ સ્તરે વર્ષ એક મનોદશા રહેતું નથી અને પંચાંગ બની જાય છે — અહીં સૌથી નાનો એક દિવસથી પણ ઓછો, સૌથી મોટો અઠવાડિયાથી થોડો વધુ.","as":"ওপৰৰ ন টা কালৰ প্ৰতিটোৱে পুনৰ ন টাত ভাগ হয়, ফলত বছৰটো একাশীটা সৰু পৰ্যায়ত মেলে, প্ৰতিটো কেইদিনমানৰ। এই স্তৰতেই বছৰ এটা মনৰ ভাৱ হৈ নাথাকে, এখন পঞ্জিকা হৈ পৰে — ইয়াত আটাইতকৈ সৰুটো এদিনতকৈও কম, আটাইতকৈ ডাঙৰটো এসপ্তাহতকৈ অলপ বেছি।"}},"annGo":{"title":{"en":"Month by Month Through the Year","hi":"वर्ष भर, माह दर माह","te":"నెల నెలకూ, సంవత్సరమంతా","kn":"ವರ್ಷವಿಡೀ, ತಿಂಗಳಿಂದ ತಿಂಗಳಿಗೆ","ta":"ஆண்டு முழுவதும், மாதம் மாதமாக","bn":"মাসে মাসে, সারা বছর","mr":"महिन्यामागून महिना, वर्षभर","gu":"મહિને મહિને, આખું વર્ષ","as":"মাহে মাহে, গোটেই বছৰ"},"intro":{"en":"This table runs from your solar return to the next one — the same year the rest of this report describes, not the calendar year. Each row counts how many planetary movements sit in favourable houses from your birth Moon that month, and flags the two slow planets separately, since those set the tone for weeks at a time rather than days.","hi":"यह तालिका आपके वर्ष प्रवेश से अगले वर्ष प्रवेश तक चलती है — वही वर्ष जिसका वर्णन यह रिपोर्ट करती है, कैलेंडर वर्ष नहीं। हर पंक्ति गिनती है कि उस माह कितने ग्रह-गोचर आपकी जन्म चंद्रराशि से शुभ भावों में हैं, और दोनों मंदगामी ग्रहों को अलग दिखाती है, क्योंकि वे दिनों नहीं, हफ्तों का स्वर तय करते हैं।","te":"ఈ పట్టిక మీ వర్ష ప్రవేశం నుండి తర్వాతి వర్ష ప్రవేశం వరకు నడుస్తుంది — ఈ నివేదిక వర్ణించే అదే సంవత్సరం, క్యాలెండర్ సంవత్సరం కాదు. ఆ నెలలో మీ జన్మ చంద్రరాశి నుండి ఎన్ని గ్రహ చలనాలు శుభ భావాల్లో ఉన్నాయో ప్రతి వరుస లెక్కిస్తుంది, రెండు మందగామి గ్రహాలను వేరుగా చూపుతుంది — అవి రోజులకు కాక వారాలకు స్వరాన్ని నిర్ణయిస్తాయి కాబట్టి.","kn":"ಈ ಕೋಷ್ಟಕ ನಿಮ್ಮ ವರ್ಷ ಪ್ರವೇಶದಿಂದ ಮುಂದಿನ ವರ್ಷ ಪ್ರವೇಶದವರೆಗೆ ನಡೆಯುತ್ತದೆ — ಈ ವರದಿ ವಿವರಿಸುವ ಅದೇ ವರ್ಷ, ಕ್ಯಾಲೆಂಡರ್ ವರ್ಷವಲ್ಲ. ಆ ತಿಂಗಳಲ್ಲಿ ನಿಮ್ಮ ಜನ್ಮ ಚಂದ್ರರಾಶಿಯಿಂದ ಎಷ್ಟು ಗ್ರಹ ಚಲನೆಗಳು ಶುಭ ಭಾವಗಳಲ್ಲಿವೆ ಎಂದು ಪ್ರತಿ ಸಾಲು ಎಣಿಸುತ್ತದೆ, ಎರಡು ಮಂದಗಾಮಿ ಗ್ರಹಗಳನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ತೋರಿಸುತ್ತದೆ — ಅವು ದಿನಗಳಲ್ಲ, ವಾರಗಳ ಧ್ವನಿಯನ್ನು ನಿರ್ಧರಿಸುತ್ತವೆ.","ta":"இந்த அட்டவணை உங்கள் வர்ஷ பிரவேசத்திலிருந்து அடுத்த வர்ஷ பிரவேசம் வரை இயங்குகிறது — இந்த அறிக்கை விவரிக்கும் அதே ஆண்டு, நாட்காட்டி ஆண்டு அல்ல. அந்த மாதத்தில் உங்கள் ஜென்ம சந்திர ராசியிலிருந்து எத்தனை கிரக நகர்வுகள் சுப பாவங்களில் உள்ளன என்பதை ஒவ்வொரு வரிசையும் கணக்கிடுகிறது, இரு மந்தகதி கிரகங்களைத் தனியாகக் காட்டுகிறது — அவை நாட்களுக்கல்ல, வாரங்களுக்குத் தொனியை அமைக்கின்றன.","bn":"এই টেবিল আপনার বর্ষ প্রবেশ থেকে পরের বর্ষ প্রবেশ পর্যন্ত চলে — এই রিপোর্ট যে বছরের কথা বলে সেই বছর, ক্যালেন্ডার বছর নয়। প্রতিটি সারি গোনে সেই মাসে আপনার জন্ম চন্দ্ররাশি থেকে কতগুলি গ্রহচলন শুভ ভাবে আছে, আর দুটি মন্দগামী গ্রহকে আলাদা করে দেখায়, কারণ তারা দিনের নয়, সপ্তাহের সুর ঠিক করে।","mr":"हा तक्ता तुमच्या वर्ष प्रवेशापासून पुढच्या वर्ष प्रवेशापर्यंत चालतो — हा अहवाल ज्या वर्षाचे वर्णन करतो तेच वर्ष, कॅलेंडर वर्ष नव्हे. प्रत्येक ओळ मोजते की त्या महिन्यात तुमच्या जन्म चंद्रराशीपासून किती ग्रहगती शुभ भावांत आहेत, आणि दोन मंदगती ग्रह वेगळे दाखवते, कारण ते दिवसांचा नव्हे तर आठवड्यांचा सूर ठरवतात.","gu":"આ કોષ્ટક તમારા વર્ષ પ્રવેશથી આગલા વર્ષ પ્રવેશ સુધી ચાલે છે — આ અહેવાલ જે વર્ષનું વર્ણન કરે છે એ જ વર્ષ, કૅલેન્ડર વર્ષ નહીં. દરેક પંક્તિ ગણે છે કે એ મહિનામાં તમારી જન્મ ચંદ્રરાશિથી કેટલી ગ્રહગતિ શુભ ભાવોમાં છે, અને બે મંદગતિ ગ્રહ અલગ બતાવે છે, કારણ કે એ દિવસોનો નહીં પણ અઠવાડિયાંનો સૂર નક્કી કરે છે.","as":"এই তালিকা আপোনাৰ বৰ্ষ প্ৰৱেশৰ পৰা পিছৰ বৰ্ষ প্ৰৱেশলৈ চলে — এই প্ৰতিবেদনে যি বছৰৰ কথা কয় সেই বছৰ, কেলেণ্ডাৰ বছৰ নহয়। প্ৰতিটো শাৰীয়ে গণনা কৰে সেই মাহত আপোনাৰ জন্ম চন্দ্ৰৰাশিৰ পৰা কিমান গ্ৰহচলন শুভ ভাৱত আছে, আৰু দুটা মন্দগামী গ্ৰহক পৃথককৈ দেখুৱায়, কাৰণ সিহঁতে দিনৰ নহয়, সপ্তাহৰ সুৰ ঠিক কৰে।"},"month":{"en":"Month","hi":"माह","te":"నెల","kn":"ತಿಂಗಳು","ta":"மாதம்","bn":"মাস","mr":"महिना","gu":"મહિનો","as":"মাহ"},"fav":{"en":"Favourable","hi":"अनुकूल","te":"అనుకూలం","kn":"ಅನುಕೂಲ","ta":"சாதகம்","bn":"অনুকূল","mr":"अनुकूल","gu":"અનુકૂળ","as":"অনুকূল"},"care":{"en":"Needs care","hi":"ध्यान अपेक्षित","te":"శ్రద్ధ అవసరం","kn":"ಗಮನ ಬೇಕು","ta":"கவனம் தேவை","bn":"যত্ন প্রয়োজন","mr":"लक्ष हवे","gu":"ધ્યાન જોઈએ","as":"যতন লাগে"},"slowNote":{"en":"A tick beside Jupiter or Saturn means that planet sits in a house classical texts count favourable from your Moon that month. A month with neither is not a bad month — it simply has no slow-planet support, and the faster movements decide its texture.","hi":"बृहस्पति या शनि के आगे का चिह्न बताता है कि उस माह वह ग्रह आपके चंद्र से शुभ मानी गई भाव-स्थिति में है। जिस माह दोनों में से कोई नहीं, वह बुरा माह नहीं — बस उसमें मंदगामी ग्रहों का सहारा नहीं, और उसका स्वरूप तेज़ चलने वाले ग्रह तय करते हैं।","te":"గురువు లేదా శని పక్కన ఉన్న గుర్తు ఆ నెలలో ఆ గ్రహం మీ చంద్రుని నుండి శుభమని లెక్కించే భావంలో ఉందని సూచిస్తుంది. రెండూ లేని నెల చెడ్డ నెల కాదు — దానికి మందగామి గ్రహాల మద్దతు లేదంతే, దాని స్వరూపాన్ని వేగంగా కదిలే గ్రహాలు నిర్ణయిస్తాయి.","kn":"ಗುರು ಅಥವಾ ಶನಿಯ ಪಕ್ಕದ ಗುರುತು ಆ ತಿಂಗಳಲ್ಲಿ ಆ ಗ್ರಹ ನಿಮ್ಮ ಚಂದ್ರನಿಂದ ಶುಭವೆಂದು ಎಣಿಸುವ ಭಾವದಲ್ಲಿದೆ ಎಂದು ಸೂಚಿಸುತ್ತದೆ. ಎರಡೂ ಇಲ್ಲದ ತಿಂಗಳು ಕೆಟ್ಟ ತಿಂಗಳಲ್ಲ — ಅದಕ್ಕೆ ಮಂದಗಾಮಿ ಗ್ರಹಗಳ ಬೆಂಬಲವಿಲ್ಲ ಅಷ್ಟೆ, ಅದರ ಸ್ವರೂಪವನ್ನು ವೇಗವಾಗಿ ಚಲಿಸುವ ಗ್ರಹಗಳು ನಿರ್ಧರಿಸುತ್ತವೆ.","ta":"குரு அல்லது சனிக்கு அருகில் உள்ள குறி, அந்த மாதத்தில் அந்தக் கிரகம் உங்கள் சந்திரனிலிருந்து சுபம் எனக் கணக்கிடப்படும் பாவத்தில் உள்ளது என்பதைக் காட்டுகிறது. இரண்டும் இல்லாத மாதம் மோசமான மாதம் அல்ல — அதற்கு மந்தகதி கிரகங்களின் ஆதரவு இல்லை அவ்வளவே, அதன் தன்மையை வேகமாக நகரும் கிரகங்கள் தீர்மானிக்கின்றன.","bn":"বৃহস্পতি বা শনির পাশের চিহ্ন বোঝায় সেই মাসে ওই গ্রহ আপনার চন্দ্র থেকে শুভ বলে গোনা ভাবে আছে। যে মাসে দুটির একটিও নেই সেটি খারাপ মাস নয় — কেবল মন্দগামী গ্রহের সমর্থন নেই, আর তার চরিত্র দ্রুতগামী গ্রহগুলি ঠিক করে।","mr":"गुरु किंवा शनीच्या शेजारील खूण दर्शवते की त्या महिन्यात तो ग्रह तुमच्या चंद्रापासून शुभ मानल्या जाणाऱ्या भावात आहे. ज्या महिन्यात दोन्हींपैकी एकही नाही तो वाईट महिना नव्हे — फक्त त्याला मंदगती ग्रहांचा आधार नाही, आणि त्याचे स्वरूप वेगाने चालणारे ग्रह ठरवतात.","gu":"ગુરુ કે શનિની બાજુની નિશાની બતાવે છે કે એ મહિનામાં એ ગ્રહ તમારા ચંદ્રથી શુભ ગણાતા ભાવમાં છે. જે મહિનામાં બેમાંથી એકેય નથી એ ખરાબ મહિનો નથી — ફક્ત એને મંદગતિ ગ્રહોનો ટેકો નથી, અને એનું સ્વરૂપ ઝડપથી ચાલતા ગ્રહો નક્કી કરે છે.","as":"বৃহস্পতি বা শনিৰ কাষৰ চিনটোৱে বুজায় সেই মাহত সেই গ্ৰহ আপোনাৰ চন্দ্ৰৰ পৰা শুভ বুলি গণনা কৰা ভাৱত আছে। যিমাহত দুয়োটাৰে এটাও নাই সেয়া বেয়া মাহ নহয় — কেৱল মন্দগামী গ্ৰহৰ সমৰ্থন নাই, আৰু তাৰ ৰূপ দ্ৰুতগামী গ্ৰহবোৰে ঠিক কৰে।"}},"sahamMean":{"punya":{"en":"Merit, good fortune, and the fruit of past action","hi":"पुण्य, सौभाग्य और पूर्वकृत कर्म का फल","te":"పుణ్యం, సౌభాగ్యం, పూర్వ కర్మ ఫలం","kn":"ಪುಣ್ಯ, ಸೌಭಾಗ್ಯ ಮತ್ತು ಪೂರ್ವ ಕರ್ಮದ ಫಲ","ta":"புண்ணியம், நல்வாய்ப்பு, முன்வினைப் பயன்","bn":"পুণ্য, সৌভাগ্য ও পূর্বকৃত কর্মের ফল","mr":"पुण्य, सौभाग्य आणि पूर्वकर्माचे फळ","gu":"પુણ્ય, સૌભાગ્ય અને પૂર્વકર્મનું ફળ","as":"পুণ্য, সৌভাগ্য আৰু পূৰ্বকৃত কৰ্মৰ ফল"},"vidya":{"en":"Learning, study, and the mind's capacity to absorb","hi":"विद्या, अध्ययन और मन की ग्रहणशीलता","te":"విద్య, అధ్యయనం, మనసు గ్రహణ శక్తి","kn":"ವಿದ್ಯೆ, ಅಧ್ಯಯನ ಮತ್ತು ಮನಸ್ಸಿನ ಗ್ರಹಣ ಶಕ್ತಿ","ta":"கல்வி, படிப்பு, மனத்தின் கிரகிக்கும் திறன்","bn":"বিদ্যা, অধ্যয়ন ও মনের গ্রহণক্ষমতা","mr":"विद्या, अध्ययन आणि मनाची ग्रहणशक्ती","gu":"વિદ્યા, અધ્યયન અને મનની ગ્રહણશક્તિ","as":"বিদ্যা, অধ্যয়ন আৰু মনৰ গ্ৰহণ ক্ষমতা"},"yasas":{"en":"Reputation, standing, and how the world speaks of you","hi":"यश, प्रतिष्ठा और लोक में आपकी चर्चा","te":"కీర్తి, ప్రతిష్ఠ, లోకంలో మీ గురించిన మాట","kn":"ಕೀರ್ತಿ, ಪ್ರತಿಷ್ಠೆ ಮತ್ತು ಲೋಕದಲ್ಲಿ ನಿಮ್ಮ ಬಗ್ಗೆ ಮಾತು","ta":"புகழ், மதிப்பு, உலகம் உங்கள
