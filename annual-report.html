<style>
:root{--ink:#5C1A1B;--gold:#B8860B;--gold2:#D4A843;--paper:#FFFDF6;--soft:#8B5A2B;--saffron:#E8730C;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
body{background:#EFE9DC;font-family:'Noto Serif Devanagari',serif;color:var(--ink);}
.screen{max-width:720px;margin:24px auto;background:var(--paper);border:1px solid var(--gold2);border-radius:12px;padding:28px;}
h1.brand{font-size:23px;text-align:center;}
.sub{text-align:center;color:var(--soft);font-size:13px;margin:4px 0 16px;}
label{display:block;font-size:12px;color:var(--soft);margin:8px 0 3px;}
input,select,button{font-family:inherit;font-size:14px;padding:8px 9px;border:1px solid var(--gold2);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
button{background:linear-gradient(135deg,#8B2B33,#5C1A1B);color:#FFE8C8;border:none;cursor:pointer;margin-top:14px;font-size:15px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.note{font-size:12px;color:var(--soft);border-top:1px dashed var(--gold2);margin:14px 0 4px;padding-top:10px;}
.confirm{background:#FFF6E3;border:1px dashed var(--gold);border-radius:10px;padding:12px;margin-top:14px;display:none;font-size:14px;line-height:1.8;}
.langToggle{display:flex;gap:8px;margin-top:8px;}
.langToggle button{margin:0;background:#fff;color:var(--ink);border:1px solid var(--gold2);}
.langToggle button.on{background:var(--ink);color:#FFE8C8;}
#report{display:none;}
.page{max-width:794px;margin:16px auto;background:var(--paper);padding:46px 50px;box-shadow:0 2px 14px rgba(92,26,27,.12);position:relative;min-height:1000px;}
.page::before{content:"";position:absolute;inset:14px;border:1.5px solid var(--gold2);border-radius:4px;pointer-events:none;}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
h2.sec{font-size:21px;color:var(--saffron);border-bottom:2px solid var(--gold2);padding-bottom:6px;margin:6px 0 14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 16px;}
th,td{border:1px solid #E4D3AE;padding:7px 9px;text-align:left;}
th{background:#F8EFD8;font-weight:600;}
tr:nth-child(even) td{background:#FDF8EC;}
.prose{font-size:15px;line-height:1.85;text-align:justify;margin-bottom:12px;}
.idcard{background:#FFF6E3;border:1px solid var(--gold2);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.idcard .t{font-size:11.5px;color:var(--soft);}
.idcard .v{font-size:18px;color:#8B2B33;font-weight:700;margin-top:2px;}
.yog{background:#FDF8EC;border-left:4px solid var(--gold);padding:10px 13px;margin-bottom:10px;font-size:14.5px;line-height:1.75;}
.ok{background:#F2F8EF;border-left-color:#5A8B2B;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mcard{border:1px solid var(--gold2);border-radius:9px;padding:9px 11px;font-size:13px;background:#FDF8EC;}
.mcard .mh{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#8B2B33;margin-bottom:3px;}
.mdot{width:11px;height:11px;border-radius:50%;display:inline-block;}
.foot{font-size:12px;color:var(--soft);border-top:1px solid var(--gold2);padding-top:10px;margin-top:20px;line-height:1.7;}
.printbar{max-width:794px;margin:10px auto;text-align:center;}
.printbar button{width:auto;padding:10px 26px;}
@media print{body{background:#fff;}.screen,.printbar{display:none !important;}#report{display:block !important;}
.page{box-shadow:none;margin:0;page-break-after:always;min-height:auto;padding:34px 40px;}.page:last-child{page-break-after:auto;}
.mcard,.yog{page-break-inside:avoid;}}
@page{size:A4;margin:10mm;}

/* devanagari-print-safety: letter-spacing splits matras/conjuncts (दि ल). Never apply to Indic text. */
body,.page,.prose,.idcard,.yog,td,th,h1,h2,div,span{letter-spacing:normal;}
.stars,.scorepill{letter-spacing:2px;}
@media print{*{-webkit-font-feature-settings:"liga" 1,"kern" 1;font-feature-settings:"liga" 1,"kern" 1;}}

/* ── DEVANAGARI SHAPING SAFETY ──────────────────────────────────────────────
   A Latin-first font stack (e.g. 'Cormorant Garamond' first) forces the browser
   into PER-CHARACTER font fallback for Hindi. Shaping a syllable cluster across
   two font runs splits matras/conjuncts:  करियर → "करि यर",  बातचीत → "बा तची त".
   Fix: when the report renders in Hindi, use ONE complete Devanagari font for
   everything, and disable anything that can insert space inside a cluster. */
#report.lang-hi, #report.lang-hi *{
  font-family:'Noto Serif Devanagari','Nirmala UI','Mangal','Kokila',serif !important;
  letter-spacing:normal !important;
  word-spacing:normal !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-synthesis:none;               /* faux-bold can break conjunct shaping */
  text-rendering:auto;
}
#report.lang-hi .prose{text-align:left;}   /* justify stretches Indic awkwardly */
@media print{
  #report.lang-hi, #report.lang-hi *{
    font-family:'Noto Serif Devanagari','Nirmala UI','Mangal',serif !important;
    letter-spacing:normal !important;
  }
}

/* Telugu: same single-font shaping law as Devanagari (§10.2 / §T6) */
#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-te .prose{text-align:left;}
@media print{#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;letter-spacing:normal !important;}}

/* Indic print hardening: some print engines duplicate glyph clusters when
   ligature/kerning features are re-resolved. Lock them and disable synthesis. */
@media print{
  #report.lang-hi, #report.lang-hi *, #report.lang-te, #report.lang-te *{
    text-rendering:auto !important;
    font-variant-ligatures:normal !important;
    font-feature-settings:normal !important;
    font-synthesis:none !important;
    -webkit-font-smoothing:antialiased;
  }
}

/* Kannada: same single-font shaping law as Devanagari/Telugu (§10.2 / §K6) */
#report.lang-kn, #report.lang-kn *{
  font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;

#report.lang-kn .prose{text-align:left;}
@media print{

    font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}

/* Tamil: same single-font shaping law as Devanagari/Telugu/Kannada (§10.2 / §K6) */
#report.lang-ta, #report.lang-ta *{
  font-family:'Noto Serif Tamil','Latha','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;

}
#report.lang-ta .prose{text-align:left;}
@media print{

    font-family:'Noto Serif Tamil','Latha','Nirmala UI',serif !important;

#report.lang-bn .prose{text-align:left;}

    font-family:'Noto Serif Bengali','Vrinda','Nirmala UI',serif !important;

<div class="screen" id="inputScreen">

  <button onclick="confirmStep()">Generate My Year → बनाएँ</button>
  <div class="confirm" id="confirmBox">
    <div id="confirmText"></div>
    <div class="row">
      <button style="background:#5A8B2B;" onclick="generate()">✓ Correct — Generate</button>
      <button style="background:#B8434A;" onclick="document.getElementById('confirmBox').style.display='none'">✗ Fix details</button>

ৰ আছে "},"moonRestsPost":{"en":" — the deep language of your heart. While your outward love expression is ","hi":"में है — यही आपके दिल की गहरी भाषा है। आपके प्यार जताने का तरीक़ा ","te":"లో ఉన్నారు — ఇదే మీ మనసు లోతైన భాష. మీరు ప్రేమను బయటికి చూపించే తీరు ","kn":"ದಲ್ಲಿದ್ದಾರೆ — ಇದೇ ನಿಮ್ಮ ಮನಸ್ಸಿನ ಆಳವಾದ ಭಾಷೆ. ನೀವು ಪ್ರೀತಿಯನ್ನು ಹೊರಗೆ ತೋರಿಸುವ ರೀತಿ ","ta":" ராசியில் அமர்ந்திருக்கிறார் — இது உங்கள் மனதின் ஆழமான மொழி. உங்கள் வெளிப்படையான காதல் வெளிப்பாடு ","bn":" — এটিই আপনার মনের গভীর ভাষা। বাইরে আপনার ভালোবাসা প্রকাশ পায় ","mr":" — हीच तुमच्या मनाची खोल भाषा. बाहेरून तुमचे प्रेम दिसते ","gu":" — એ જ તમારા મનની ઊંડી ભાષા. બહારથી તમારો પ્રેમ દેખાય છે ","as":" — এইটোৱেই আপোনাৰ মনৰ গভীৰ ভাষা। বাহিৰৰ পৰা আপোনাৰ প্ৰেম দেখা যায় "},"moonMid":{"en":" in nature, your inner heart feels in a ","hi":"स्वभाव का है, जबकि आपका मन ","te":"స్వభావానికి చెందినది, కానీ మీ మనసు లోపల ","kn":" ಸ್ವಭಾವದ್ದು, ಆದರೆ ನಿಮ್ಮ ಒಳಮನಸ್ಸು ","ta":" சுபாவம் கொண்டது; உங்கள் உள்மனம் ","bn":" ধরনে, কিন্তু ভিতরের মন অনুভব করে ","mr":" पद्धतीने, पण आतले मन अनुभवते ","gu":" રીતે, પણ અંદરનું મન અનુભવે છે ","as":" ধৰণে, কিন্তু ভিতৰৰ মনে অনুভৱ কৰে "},"moonEnd":{"en":" way. The meeting of these two gives your love both depth and colour.","hi":"स्वभाव से महसूस करता है। इन दोनों का मेल आपके प्यार को गहराई भी देता है और रंग भी।","te":" స్వభావంతో అనుభవిస్తుంది. ఈ రెండింటి కలయికే మీ ప్రేమకు లోతునూ, అందాన్నీ ఇస్తుంది.","kn":" ಸ್ವಭಾವದಿಂದ ಅನುಭವಿಸುತ್ತದೆ. ಈ ಎರಡರ ಸಂಗಮವೇ ನಿಮ್ಮ ಪ್ರೀತಿಗೆ ಆಳವನ್ನೂ ಬಣ್ಣವನ್ನೂ ಕೊಡುತ್ತದೆ.","ta":" விதமாக உணர்கிறது. இந்த இரண்டும் சேர்வது உங்கள் காதலுக்கு ஆழத்தையும் நிறத்தையும் தருகிறது.","bn":" ভাবে। এই দুইয়ের মিলনেই আপনার ভালোবাসা পায় গভীরতা আর রং।","mr":" असे. या दोघांच्या मिलनातूनच तुमच्या प्रेमाला खोली आणि रंग मिळतो.","gu":" એવું. આ બંનેના મિલનમાંથી જ તમારા પ્રેમને ઊંડાણ અને રંગ મળે છે.","as":" এনেকৈ। এই দুয়োটাৰ মিলনৰ পৰাই আপোনাৰ প্ৰেমে গভীৰতা আৰু ৰং পায়।"},"venusStrong":{"en":"Your Venus is especially strong — love, attraction and beauty flow naturally through your life.","hi":"आपका शुक्र बहुत मज़बूत है — प्यार, आकर्षण और सुंदरता आपकी ज़िंदगी में सहज बहते हैं।","te":"మీ జాతకంలో శుక్రుడు బలంగా ఉన్నాడు — ప్రేమ, ఆకర్షణ, అందం మీ జీవితంలో సహజంగా ప్రవహిస్తాయి.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಬಲವಾಗಿದ್ದಾರೆ — ಪ್ರೀತಿ, ಆಕರ್ಷಣೆ, ಸೌಂದರ್ಯ ನಿಮ್ಮ ಬದುಕಿನಲ್ಲಿ ಸಹಜವಾಗಿ ಹರಿಯುತ್ತವೆ.","ta":"உங்கள் சுக்கிரன் மிகவும் பலமாக இருக்கிறார் — காதல், கவர்ச்சி, அழகு உங்கள் வாழ்க்கையில் இயல்பாக வெளிப்படுகின்றன.","bn":"আপনার শুক্র বিশেষভাবে শক্তিশালী — ভালোবাসা, আকর্ষণ আর সৌন্দর্য আপনার জীবনে সহজেই আসে।","mr":"तुमचा शुक्र विशेष बलवान आहे — प्रेम, आकर्षण आणि सौंदर्य तुमच्या आयुष्यात सहज येते.","gu":"તમારો શુક્ર ખાસ બળવાન છે — પ્રેમ, આકર્ષણ અને સૌંદર્ય તમારા જીવનમાં સહજ આવે છે.","as":"আপোনাৰ শুক্ৰ বিশেষভাৱে বলৱান — প্ৰেম, আকৰ্ষণ আৰু সৌন্দৰ্য আপোনাৰ জীৱনত সহজেই আহে।"},"venusWeak":{"en":"Your Venus rests in a tender placement — offering white or pink flowers on Fridays and cultivating beauty strengthens it.","hi":"आपका शुक्र थोड़ी कोमल स्थिति में है — शुक्रवार को सफ़ेद या गुलाबी फूल चढ़ाना और सुंदरता को अपनाना इसे मज़बूत करता है।","te":"మీ జాతకంలో శుక్రుడు కొంచెం సున్నితమైన స్థితిలో ఉన్నాడు — శుక్రవారం తెలుపు లేదా గులాబీ పూలు సమర్పించడం, అందాన్ని ఆదరించడం దీన్ని బలపరుస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸ್ವಲ್ಪ ಸೂಕ್ಷ್ಮ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ — ಶುಕ್ರವಾರ ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸುವುದು, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸುವುದು ಅದನ್ನು ಬಲಪಡಿಸುತ್ತದೆ.","ta":"உங்கள் சுக்கிரன் மென்மையான நிலையில் இருக்கிறார் — வெள்ளிக்கிழமைகளில் வெள்ளை அல்லது இளஞ்சிவப்பு மலர்களை அர்ப்பணிப்பதும், அழகை வளர்ப்பதும் அதை பலப்படுத்தும்.","bn":"আপনার শুক্র একটু কোমল অবস্থানে — শুক্রবারে সাদা বা গোলাপি ফুল নিবেদন করলে আর সৌন্দর্যের যত্ন নিলে তা শক্তিশালী হয়।","mr":"तुमचा शुक्र थोडा नाजूक स्थितीत आहे — शुक्रवारी पांढरी किंवा गुलाबी फुले अर्पण केल्याने आणि सौंदर्याची काळजी घेतल्याने तो बळकट होतो.","gu":"તમારો શુક્ર થોડી નાજુક સ્થિતિમાં છે — શુક્રવારે સફેદ કે ગુલાબી ફૂલ અર્પણ કરવાથી અને સૌંદર્યની કાળજી લેવાથી તે મજબૂત થાય છે.","as":"আপোনাৰ শুক্ৰ অলপ কোমল অৱস্থাত আছে — শুক্ৰবাৰে বগা বা গুলপীয়া ফুল অৰ্পণ কৰিলে আৰু সৌন্দৰ্যৰ যত্ন ল'লে ই বলৱান হয়।"},"venusNeutral":{"en":"Your Venus holds a balanced placement, giving love a steady foundation.","hi":"आपका शुक्र संतुलित स्थिति में है, जो प्यार को मज़बूत नींव देता है।","te":"మీ జాతకంలో శుక్రుడు సమతుల్య స్థితిలో ఉన్నాడు, ఇది ప్రేమకు స్థిరమైన పునాది ఇస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸಮತೋಲಿತ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ, ಇದು ಪ್ರೀತಿಗೆ ಸ್ಥಿರ ಅಡಿಪಾಯ ಕೊಡುತ್ತದೆ.","ta":"உங்கள் சுக்கிரன் சமநிலையில் இருக்கிறார், காதலுக்கு ஒரு உறுதியான அடித்தளத்தைத் தருகிறார்.","bn":"আপনার শুক্র একটি সমতল অবস্থানে রয়েছে, যা ভালোবাসাকে একটি স্থির ভিত্তি দেয়।","mr":"तुमचा शुक्र संतुलित स्थितीत आहे, ज्यामुळे प्रेमाला स्थिर पाया मिळतो.","gu":"તમારો શુક્ર સંતુલિત સ્થિતિમાં છે, જેથી પ્રેમને સ્થિર પાયો મળે છે.","as":"আপোনাৰ শুক্ৰ সন্তুলিত অৱস্থাত আছে, যাৰ ফলত প্ৰেমে স্থিৰ ভেটি পায়।"},"venusRemedyIntro":{"en":"Venus is the planet of love, beauty and sweetness. Honouring it brings tenderness to your relationships:","hi":"शुक्र प्यार, सुंदरता और मिठास का ग्रह है। इसे प्रसन्न रखना रिश्तों में मिठास लाता है:","te":"శుక్రుడు ప్రేమ, అందం, మాధుర్యానికి అధిపతి. ఆయనను ఆరాధించడం బంధాల్లో మాధుర్యాన్ని తెస్తుంది:","kn":"ಶುಕ್ರ ಪ್ರೀತಿ, ಸೌಂದರ್ಯ ಮತ್ತು ಮಾಧುರ್ಯದ ಅಧಿಪತಿ. ಅವರನ್ನು ಆರಾಧಿಸುವುದು ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ತರುತ್ತದೆ:","ta":"சுக்கிரன் காதல், அழகு, இனிமையின் கிரகம். அவரை வழிபடுவது உங்கள் உறவுகளுக்கு மென்மையைக் கொண்டு வரும்:","bn":"শুক্র ভালোবাসা, সৌন্দর্য আর মাধুর্যের গ্রহ। তাঁকে সম্মান জানালে সম্পর্কে কোমলতা আসে:","mr":"शुक्र हा प्रेम, सौंदर्य आणि गोडव्याचा ग्रह. त्याचा मान राखल्याने नात्यांत मृदुता येते:","gu":"શુક્ર એ પ્રેમ, સૌંદર્ય અને મીઠાશનો ગ્રહ. તેનું માન રાખવાથી સંબંધોમાં કોમળતા આવે છે:","as":"শুক্ৰ হৈছে প্ৰেম, সৌন্দৰ্য আৰু মাধুৰ্যৰ গ্ৰহ। তাক সন্মান কৰিলে সম্পৰ্কত কোমলতা আহে:"},"closingQuote":{"en":"\"The stars incline; they do not compel. Your open heart writes the truest love story of all.\"","hi":"\"सितारे राह दिखाते हैं, मजबूर नहीं करते। सबसे सच्ची प्रेम कहानी आपका खुला दिल ही लिखता है।\"","te":"\"గ్రహాలు దారి చూపిస్తాయి, బలవంతం చేయవు. అత్యంత నిజమైన ప్రేమ కథను రాసేది మీ తెరిచిన మనసే.\"","kn":"\"ಗ್ರಹಗಳು ದಾರಿ ತೋರಿಸುತ್ತವೆ, ಒತ್ತಾಯ ಮಾಡುವುದಿಲ್ಲ. ಅತ್ಯಂತ ನಿಜವಾದ ಪ್ರೀತಿಯ ಕಥೆಯನ್ನು ಬರೆಯುವುದು ನಿಮ್ಮ ತೆರೆದ ಮನಸ್ಸೇ.\"","ta":"\"நட்சத்திரங்கள் வழிகாட்டுகின்றன; கட்டாயப்படுத்துவதில்லை. உங்கள் திறந்த மனமே எல்லாவற்றிலும் உண்மையான காதல் கதையை எழுதுகிறது.\"","bn":"\"তারা পথ দেখায়, বাধ্য করে না। আপনার খোলা মনই সবচেয়ে সত্যি ভালোবাসার গল্প লেখে।\"","mr":"\"तारे वाट दाखवतात, सक्ती करत नाहीत. तुमचे मोकळे मनच सर्वात खरी प्रेमकथा लिहिते.\"","gu":"\"તારાઓ રસ્તો બતાવે છે, ફરજ પાડતા નથી. તમારું ખુલ્લું મન જ સૌથી સાચી પ્રેમકથા લખે છે.\"","as":"\"তৰাবোৰে বাট দেখুৱায়, বলপূৰ্বক নকৰে। আপোনাৰ মুকলি মনেই আটাইতকৈ সঁচা প্ৰেমকাহিনী লিখে।\""}},"reason":{"d7fifth":{"en":"D7 5th lord","hi":"सप्तांश पंचमेश","te":"సప్తాంశ పంచమాధిపతి","kn":"ಸಪ್ತಾಂಶ ಪಂಚಮಾಧಿಪತಿ","ta":"D7 5ஆம் அதிபதி","bn":"D7 পঞ্চমাধিপতি","mr":"D7 पंचमाधिपती","gu":"D7 પંચમાધિપતિ","as":"D7 পঞ্চমাধিপতি"},"d7lagna":{"en":"D7 lagna lord","hi":"सप्तांश लग्नेश","te":"సప్తాంశ లగ్నాధిపతి","kn":"ಸಪ್ತಾಂಶ ಲಗ್ನಾಧಿಪತಿ","ta":"D7 லக்ன அதிபதி","bn":"D7 লগ্নাধিপতি","mr":"D7 लग्नाधिपती","gu":"D7 લગ્નાધિપતિ","as":"D7 লগ্নাধিপতি"},"occupies5":{"en":"occupies your 5th house","hi":"आपके पाँचवें भाव में स्थित","te":"మీ ఐదవ భావంలో ఉన్నారు","kn":"ನಿಮ್ಮ ಐದನೇ ಭಾವದಲ್ಲಿದ್ದಾರೆ","ta":"உங்கள் 5ஆம் பாவத்தில் அமர்ந்துள்ளார்","bn":"আপনার পঞ্চম ভাবে রয়েছেন","mr":"तुमच्या पंचम भावात आहेत","gu":"તમારા પંચમ ભાવમાં છે","as":"আপোনাৰ পঞ্চম ভাৱত আছে"},"fifthLordRole":{"en":"lord of your 5th house","hi":"आपके पाँचवें भाव का स्वामी","te":"మీ ఐదవ భావ అధిపతి","kn":"ನಿಮ್ಮ ಐದನೇ ಭಾವದ ಅಧಿಪತಿ","ta":"உங்கள் 5ஆம் பாவ அதிபதி","bn":"আপনার পঞ্চম ভাবের অধিপতি","mr":"तुमच्या पंचम भावाचा अधिपती","gu":"તમારા પંચમ ભાવનો અધિપતિ","as":"আপোনাৰ পঞ্চম ভাৱৰ অধিপতি"},"ageWindow":{"en":"Within the traditional age window","hi":"पारंपरिक आयु-सीमा के भीतर","te":"సంప్రదాయ వయో పరిధిలో","kn":"ಸಂಪ್ರದಾಯದ ವಯೋಮಿತಿಯಲ್ಲಿ","ta":"பாரம்பரிய வயது எல்லைக்குள்","bn":"শাস্ত্রীয় বয়সসীমার মধ্যে","mr":"शास्त्रीय वयोमर्यादेत","gu":"શાસ્ત્રીય વયમર્યાદામાં","as":"শাস্ত্ৰীয় বয়সসীমাৰ ভিতৰত"},"antarLord":{"en":"Antar lord","hi":"अंतर्दशा स्वामी","te":" edy":{"sun":{"te":"ఆదివారం సూర్యుడికి నమస్కరించండి, ఉదయపు ఎండలో కొద్దిసేపు నిలబడండి. ఆత్మవిశ్వాసం, గౌరవం పెరుగుతాయి.","kn":"ಭಾನುವಾರ ಸೂರ್ಯನಿಗೆ ನಮಸ್ಕರಿಸಿ, ಬೆಳಗಿನ ಬಿಸಿಲಿನಲ್ಲಿ ಸ್ವಲ್ಪ ಹೊತ್ತು ನಿಲ್ಲಿ. ಆತ್ಮವಿಶ್ವಾಸ, ಗೌರವ ಹೆಚ್ಚುತ್ತವೆ.","ta":"ஞாயிற்றுக்கிழமை உதயசூரியனுக்கு அர்க்கியம் தரவும், தந்தை மற்றும் பெரியோரை மதிக்கவும், கோதுமை அல்லது வெல்லம் தானம் செய்யவும். தன்னம்பிக்கையும் மதிப்பும் வளரும்.","bn":"রবিবার উদীয়মান সূর্যকে অর্ঘ্য দিন, বাবা আর গুরুজনদের সম্মান করুন, গম বা গুড় দান করুন। আত্মবিশ্বাস আর সম্মান বাড়ে।","mr":"रविवारी उगवत्या सूर्याला अर्घ्य द्या; वडील आणि वडीलधाऱ्यांचा मान राखा; गहू किंवा गूळ दान करा. आत्मविश्वास आणि सन्मान वाढतो.","gu":"રવિવારે ઊગતા સૂર્યને અર્ઘ્ય આપો; પિતા અને વડીલોનું માન રાખો; ઘઉં કે ગોળનું દાન કરો. આત્મવિશ્વાસ અને સન્માન વધે છે.","as":"দেওবাৰে উদীয়মান সূৰ্যক অৰ্ঘ্য দিয়ক; দেউতাক আৰু বয়োজ্যেষ্ঠসকলক সন্মান কৰক; ঘেঁহু বা গুড় দান কৰক। আত্মবিশ্বাস আৰু সন্মান বাঢ়ে।"},"moon":{"te":"సోమవారం శివుడిని ఆరాధించండి, తెల్లని వస్తువులు దానం చేయండి. మనసుకు ప్రశాంతత కలుగుతుంది.","kn":"ಸೋಮವಾರ ಶಿವನನ್ನು ಆರಾಧಿಸಿ, ಬಿಳಿ ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ. ಮನಸ್ಸಿಗೆ ಶಾಂತಿ ಸಿಗುತ್ತದೆ.","ta":"திங்கட்கிழமையை அமைதியாக, தூய்மையாகக் கழிக்கவும், தாயை மதிக்கவும், அரிசி அல்லது பால் தானம் செய்யவும். மனம் அமைதி பெறும்.","bn":"সোমবার শান্ত আর পরিচ্ছন্নভাবে কাটান, মাকে সম্মান করুন, দুধ বা চাল দান করুন। মন শান্ত থাকে, ঘরে সুখ আসে।","mr":"सोमवार शांत आणि स्वच्छ ठेवा; आईचा मान राखा; सोमवारी गरजूंना दूध किंवा तांदूळ द्या. मन शांत राहते, घरात सुख येते.","gu":"સોમવાર શાંત અને સ્વચ્છ રાખો; માતાનું માન રાખો; સોમવારે જરૂરિયાતમંદને દૂધ કે ચોખા આપો. મન શાંત રહે છે, ઘરમાં સુખ આવે છે.","as":"সোমবাৰ শান্ত আৰু পৰিষ্কাৰ ৰাখক; মাতৃক সন্মান কৰক; সোমবাৰে অভাৱীক গাখীৰ বা চাউল দিয়ক। মন শান্ত থাকে, ঘৰত সুখ আহে।"},"mars":{"te":"మంగళవారం హనుమంతుడిని ఆరాధించండి, ఓపికను అలవరచుకోండి. ధైర్యం సరైన దిశలో పని చేస్తుంది.","kn":"ಮಂಗಳವಾರ ಹನುಮಂತನನ್ನು ಆರಾಧಿಸಿ, ತಾಳ್ಮೆ ಬೆಳೆಸಿಕೊಳ್ಳಿ. ಧೈರ್ಯ ಸರಿಯಾದ ದಿಕ್ಕಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ.","ta":"செவ்வாய்க்கிழமை அனுமன் சாலீசா ஓதவும், உடல் ஒழுக்கம் காக்கவும், துவரம்பருப்பு அல்லது சிவப்பு துணி தானம் செய்யவும். தைரியமும் ஆற்றலும் வளரும்.","bn":"মঙ্গলবার হনুমান চালিসা পাঠ করুন, শরীরচর্চার নিয়ম রাখুন, মসুর ডাল বা লাল কাপড় দান করুন। সাহস বাড়ে, রাগ কমে।","mr":"मंगळवारी हनुमान चालीसा वाचा; व्यायामाचा नियम ठेवा; मसूर डाळ किंवा लाल कापड दान करा. धैर्य वाढते, राग कमी होतो.","gu":"મંગળવારે હનુમાન ચાલીસા વાંચો; વ્યાયામનો નિયમ રાખો; મસૂર દાળ કે લાલ કાપડનું દાન કરો. હિંમત વધે છે, ગુસ્સો ઓછો થાય છે.","as":"মঙ্গলবাৰে হনুমান চালিছা পঢ়ক; ব্যায়ামৰ নিয়ম ৰাখক; মচুৰ দাইল বা ৰঙা কাপোৰ দান কৰক। সাহস বাঢ়ে, খং কমে।"},"mercury":{"te":"బుధవారం విష్ణువును స్మరించండి, పచ్చని వస్తువులు దానం చేయండి. మాటలో, వ్యవహారంలో స్పష్టత వస్తుంది.","kn":"ಬುಧವಾರ ವಿಷ್ಣುವನ್ನು ಸ್ಮರಿಸಿ, ಹಸಿರು ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ. ಮಾತಿನಲ್ಲಿ, ವ್ಯವಹಾರದಲ್ಲಿ ಸ್ಪಷ್ಟತೆ ಬರುತ್ತದೆ.","ta":"புதன்கிழமை பசுக்களுக்கு பசும்புல் தரவும், பேச்சை உண்மையாகவும் இனிமையாகவும் வைக்கவும், பாசிப்பருப்பு தானம் செய்யவும். புத்திசாலித்தனமும் தொடர்புகளும் வளரும்.","bn":"বুধবার গরুকে সবুজ ঘাস খাওয়ান, কথা সত্য আর মিষ্টি রাখুন, মুগ ডাল দান করুন। বুদ্ধি আর ব্যবসায় উন্নতি হয়।","mr":"बुधवारी गाईला हिरवा चारा द्या; बोलणे खरे आणि गोड ठेवा; मूग डाळ दान करा. बुद्धी आणि व्यवसायात प्रगती होते.","gu":"બુધવારે ગાયને લીલો ચારો આપો; બોલવાનું સાચું અને મીઠું રાખો; મગ દાળનું દાન કરો. બુદ્ધિ અને વ્યવસાયમાં પ્રગતિ થાય છે.","as":"বুধবাৰে গৰুক কেঁচা ঘাঁহ দিয়ক; কথা সত্য আৰু মধুৰ ৰাখক; মগু দাইল দান কৰক। বুদ্ধি আৰু ব্যৱসায়ত উন্নতি হয়।"},"jupiter":{"te":"గురువారం గురువును ఆరాధించండి, పసుపు పచ్చని వస్తువులు దానం చేయండి, పెద్దలను గౌరవించండి. జ్ఞానం, అదృష్టం పెరుగుతాయి.","kn":"ಗುರುವಾರ ಗುರುವನ್ನು ಆರಾಧಿಸಿ, ಹಳದಿ ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ, ಹಿರಿಯರನ್ನು ಗೌರವಿಸಿ. ಜ್ಞಾನ, ಅದೃಷ್ಟ ಹೆಚ್ಚುತ್ತವೆ.","ta":"வியாழக்கிழமை குருமார்களை சேவிக்கவும், ஞானத்தைப் பகிரவும், மஞ்சள், கடலைப்பருப்பு அல்லது புத்தகம் தானம் செய்யவும். ஞானமும் அதிர்ஷ்டமும் வளரும்.","bn":"বৃহস্পতিবার গুরুজনদের সেবা করুন, জ্ঞান ভাগ করে নিন, হলুদ, ছোলার ডাল বা বই দান করুন। জ্ঞান, সম্মান আর সৌভাগ্য বাড়ে।","mr":"गुरुवारी गुरुजनांची सेवा करा आणि ज्ञान वाटा; हळद, हरभरा डाळ किंवा पुस्तके दान करा. ज्ञान, सन्मान आणि भाग्य वाढते.","gu":"ગુરુવારે વડીલોની સેવા કરો અને જ્ઞાન વહેંચો; હળદર, ચણાની દાળ કે પુસ્તકોનું દાન કરો. જ્ઞાન, સન્માન અને ભાગ્ય વધે છે.","as":"বৃহস্পতিবাৰে গুৰুজনৰ সেৱা কৰক আৰু জ্ঞান বিলাওক; হালধি, বুট দাইল বা কিতাপ দান কৰক। জ্ঞান, সন্মান আৰু ভাগ্য বাঢ়ে।"},"venus":{"te":"శుక్రవారం లక్ష్మీదేవిని ఆరాధించండి, తెలుపు లేదా గులాబీ పూలు సమర్పించండి, అందాన్ని ఆదరించండి, ఉదారంగా ఇవ్వండి. ప్రేమలో, బంధాల్లో మాధుర్యం పెరుగుతుంది.","kn":"ಶುಕ್ರವಾರ ಲಕ್ಷ್ಮಿಯನ್ನು ಆರಾಧಿಸಿ, ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸಿ, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸಿ, ಉದಾರವಾಗಿ ಕೊಡಿ. ಪ್ರೀತಿಯಲ್ಲಿ, ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ಹೆಚ್ಚುತ್ತದೆ.","ta":"வெள்ளிக்கிழமை லக்ஷ்மியை வழிபடவும், வெள்ளை அல்லது இளஞ்சிவப்பு மலர்களை அர்ப்பணிக்கவும், அழகை ஆதரிக்கவும், உதாரமாக கொடுக்கவும். காதலிலும் உறவுகளிலும் இனிமை பெருகும்.","bn":"শুক্রবার লক্ষ্মীর আরাধনা করুন, সাদা বা গোলাপি ফুল নিবেদন করুন, সৌন্দর্যের যত্ন নিন, উদারভাবে দিন। ভালোবাসা আর সম্পর্কে মাধুর্য বাড়ে।","mr":"शुक्रवार कला आणि उदारतेत घालवा; स्त्रियांचा मान राखा; पांढरी मिठाई, तांदूळ किंवा दही दान करा. प्रेम आणि नात्यांत गोडवा वाढतो.","gu":"શુક્રવાર કલા અને ઉદારતામાં ગાળો; સ્ત્રીઓનું માન રાખો; સફેદ મીઠાઈ, ચોખા કે દહીંનું દાન કરો. પ્રેમ અને સંબંધોમાં મીઠાશ વધે છે.","as":"শুক্ৰবাৰ শিল্প আৰু উদাৰতাত কটাওক; মহিলাসকলক সন্মান কৰক; বগা মিঠাই, চাউল বা দৈ দান কৰক। প্ৰেম আৰু সম্পৰ্কত মাধুৰ্য বাঢ়ে।"},"saturn":{"te":"శనివారం శనిదేవుడిని ఆరాధించండి, నల్ల నువ్వులు దానం చేయండి, పేదలకు సాయం చేయండి. ఓపిక ఫలిస్తుంది.","kn":"ಶನಿವಾರ ಶನಿದೇವರನ್ನು ಆರಾಧಿಸಿ, ಕಪ್ಪು ಎಳ್ಳು ದಾನ ಮಾಡಿ, ಬಡವರಿಗೆ ಸಹಾಯ ಮಾಡಿ. ತಾಳ್ಮೆ ಫಲ ಕೊಡುತ್ತದೆ.","ta":"சனிக்கிழமை முதியோர், தொழிலாளர், மாற்றுத்திறனாளிகளுக்கு சேவை செய்யவும், எள்ளெண்ணெய் விளக்கேற்றவும், கருப்பு எள் அல்லது இரும்பு தானம் செய்யவும். பொறுமையும் நிலைத்த வெற்றியும் கிடைக்கும்.","bn":"শনিবার বয়স্ক, শ্রমজীবী আর বিশেষভাবে সক্ষম মানুষদের সেবা করুন, তিলের তেলের প্রদীপ জ্বালান, কালো তিল বা লোহা দান করুন। ধৈর্য আর স্থায়ী সাফল্য আসে।","mr":"शनिवारी वृद्ध, कष्टकरी आणि दिव्यांग व्यक्तींची सेवा करा; तिळाच्या तेलाचा दिवा लावा; काळे तीळ किंवा लोखंड दान करा. संयम आणि टिकाऊ यश मिळते.","gu":"શનિવારે વૃદ્ધ, મજૂર અને દિવ્યાંગ વ્યક્તિઓની સેવા કરો; તલના તેલનો દીવો કરો; કાળા તલ કે લોખંડનું દાન કરો. ધીરજ અને ટકાઉ સફળતા મળે છે.","as":"শনিবাৰে বৃদ্ধ, শ্ৰমিক আৰু দিব্যাংগ ব্যক্তিক সেৱা কৰক; তিলৰ তেলৰ চাকি জ্বলাওক; ক'লা তিল বা লো দান কৰক। ধৈৰ্য আৰু স্থায়ী সফলতা আহে।"},"rahu":{"te":"దుర్గాదేవిని ఆరాధించండి, శనివారం దానం చేయండి, నిజాయితీగా ఉండండి. అనవసర గందరగోళం తగ్గుతుంది.","kn":"ದುರ್ಗಾದೇವಿಯನ್ನು ಆರಾಧಿಸಿ, ಶನಿವಾರ ದಾನ ಮಾಡಿ, ಪ್ರಾಮಾಣಿಕರಾಗಿರಿ. ಅನಗತ್ಯ ಗೊಂದಲ ಕಡಿಮೆಯಾಗುತ್ತದೆ.","ta":"ஆசைகளில் நேர்மையான தெளிவு வைக்கவும், பறவைகளுக்கு உணவளிக்கவும், சனிக்கிழமை ஏழைகளுக்கு போர்வை தானம் செய்யவும். திடீர் தடைகள் விலகும்.","bn":"লক্ষ্য আর উপায়ে নৈতিক স্বচ্ছতা রাখুন, পাখিদের খাবার দিন, শনিবার গরিবদের কম্বল দান করুন। বিভ্রান্তি কমে, পথ পরিষ্কার হয়।","mr":"ध्येयांत नैतिक स्पष्टता ठेवा; पक्ष्यांना अन्न द्या; शनिवारी गरिबांना घोंगडी दान करा. गोंधळ कमी होतो, वाट स्पष्ट होते.","gu":"ધ્યેયોમાં નૈતિક સ્પષ્ટતા રાખો; પક્ષીઓને દાણા નાખો; શનિવારે ગરીબોને ધાબળાનું દાન કરો. ગૂંચવણ ઓછી થાય છે, રસ્તો સાફ થાય છે.","as":"লক্ষ্যত নৈতিক স্পষ্টতা ৰাখক; চৰাইক আহাৰ দিয়ক; শনিবাৰে দুখীয়াক কম্বল দান কৰক। বিভ্ৰান্তি কমে, বাট পৰিষ্কাৰ হয়।"},"ketu":{"te":"గణపతిని ఆరాధించండి, ధ్యానం అలవరచుకోండి, సాధువులకు సేవ చేయండి. మనసు స్థిరపడుతుంది.","kn":"ಗಣಪತಿಯನ್ನು ಆರಾಧಿಸಿ, ಧ್ಯಾನ ರೂಢಿಸಿಕೊಳ್ಳಿ, ಸಾಧುಗಳಿಗೆ ಸೇವೆ ಮಾಡಿ. ಮನಸ್ಸು ಸ್ಥಿರವಾಗುತ್ತದೆ.","ta":"தினமும் தியானம் அல்லது ஜபம் செய்யவும், தெரு நாய்களைப் பராமரிக்கவும், பல வண்ணப் போர்வை அல்லது எள் தானம் செய்யவும். ஆன்மிகத் தெளிவு பெருகும்.","bn":"প্রতিদিন ধ্যান বা জপ করুন, পথের কুকুরদের যত্ন নিন, নানা রঙের কম্বল বা তিল দান করুন। মন স্থির হয়, ভিতরের দৃষ্টি খোলে।","mr":"रोज ध्यान किंवा जप करा; भटक्या कुत्र्यांची काळजी घ्या; रंगीबेरंगी घोंगड्या किंवा तीळ दान करा. मन स्थिर होते, आतली दृष्टी उघडते.","gu":"રોજ ધ્યાન કે જપ કરો; રખડતાં કૂતરાંની સંભાળ રાખો; રંગબેરંગી ધાબળા કે તલનું દાન કરો. મન સ્થિર થાય છે, અંદરની દૃષ્ટિ ખૂલે છે.","as":"দৈনিক ধ্যান বা জপ কৰক; পথৰ কুকুৰৰ যত্ন লওক; ৰঙীন কম্বল বা তিল দান কৰক। মন স্থিৰ হয়, ভিতৰৰ দৃষ্টি খোল খায়।"}},"marriage":{"boyDefault":{"en":"Boy","hi":"वर","te":"వరుడు","kn":"ವರ","ta":"மணமகன்","bn":"পাত্র","mr":"वर","gu":"વર","as":"পাত্ৰ"},"girlDefault":{"en":"Girl","hi":"वधू","te":"వధువు","kn":"ವಧು","ta":"மணமகள்","bn":"পাত্রী","mr":"वधू","gu":"કન્યા","as":"পাত্ৰী"},"outlookText":{"en":"This is a favourable match according to classical compatibility principles. The emotional foundation is strong, and the identified challenges are manageable through communication, mutual respect, and the suggested remedies.","hi":"शास्त्रीय अनुकूलता सिद्धांतों के अनुसार यह एक शुभ संबंध है। भावनात्मक नींव सुदृढ़ है, और उल्लिखित चुनौतियाँ संवाद, परस्पर सम्मान तथा सुझाए गए उपायों से सहज प्रबंधनीय हैं।","te":"శాస్త్రీయ అనుకూలత సూత్రాల ప్రకారం ఇది ఒక శుభమైన బంధం. మనసుల పునాది బలంగా ఉంది, గుర్తించిన ఇబ్బందులు మాటలతో, పరస్పర గౌరవంతో, సూచించిన పరిహారాలతో సులభంగా సర్దుకుంటాయి.","kn":"ಶಾಸ್ತ್ರೀಯ ಹೊಂದಾಣಿಕೆ ತತ್ವಗಳ ಪ್ರಕಾರ ಇದು ಶುಭ ಸಂಬಂಧ. ಮನಸ್ಸುಗಳ ಅಡಿಪಾಯ ಬಲವಾಗಿದೆ, ಗುರುತಿಸಿದ ತೊಂದರೆಗಳು ಮಾತು, ಪರಸ್ಪರ ಗೌರವ ಮತ್ತು ಸೂಚಿಸಿದ ಪರಿಹಾರಗಳಿಂದ ಸುಲಭವಾಗಿ ಸರಿಹೋಗುತ್ತವೆ.","ta":"பாரம்பரிய பொருத்த விதிகளின்படி இது ஒரு சாதகமான பொருத்தம். உணர்வுபூர்வ அடித்தளம் பலமாக உள்ளது, கண்டறியப்பட்ட சவால்கள் பேச்சு, பரஸ்பர மரியாதை, பரிந்துரைக்கப்பட்ட பரிகாரங்கள் மூலம் சமாளிக்கக்கூடியவை.","bn":"শাস্ত্রীয় মিলনের নীতি অনুসারে এটি একটি শুভ মিল। মনের ভিত্তি মজবুত, আর যে সমস্যাগুলি ধরা পড়েছে সেগুলি কথাবার্তা, পারস্পরিক সম্মান আর বলে দেওয়া প্রতিকারের মাধ্যমে সামলে নেওয়া যায়।","mr":"शास्त्रीय मेलनाच्या तत्त्वांनुसार ही शुभ जुळणी आहे. मनाचा पाया भक्कम आहे, आणि जे मुद्दे समोर आले आहेत ते संवाद, परस्पर आदर आणि सांगितलेल्या परिहारांनी सांभाळता येतात.","gu":"શાસ્ત્રીય મેળાપકના સિદ્ધાંતો પ્રમાણે આ શુભ મેળ છે. મનનો પાયો મજબૂત છે, અને જે મુદ્દા સામે આવ્યા છે તે સંવાદ, પરસ્પર આદર અને જણાવેલા પરિહારોથી સંભાળી શકાય છે.","as":"শাস্ত্ৰীয় মিলনৰ নীতি অনুসৰি এইটো শুভ মিল। মনৰ ভেটি দৃঢ়, আৰু যিবোৰ কথা ওলাই আহিছে সেয়া কথা-বতৰা, পাৰস্পৰিক সন্মান আৰু কোৱা প্ৰতিকাৰেৰে সামৰি ল'ব পাৰি।"},"outlookCare":{"en":"According to classical compatibility principles, this match is best approached with care. Because several key areas score low, give importance to mutual understanding, honest family discussion and elder counsel before proceeding.","hi":"शास्त्रीय अनुकूलता सिद्धांतों के अनुसार इस संबंध पर सोच-विचार के साथ आगे बढ़ना बेहतर है। चूँकि कई अहम पहलुओं में अंक कम हैं, आगे बढ़ने से पहले परस्पर समझ, परिवार की खुली बातचीत और बड़ों की सलाह को महत्व दें।","te":"శాస్త్రీయ అనుకూలత సూత్రాల ప్రకారం ఈ సంబంధాన్ని జాగ్రత్తగా పరిశీలించడం ఉత్తమం. కొన్ని ముఖ్యమైన అంశాల్లో స్కోరు తక్కువగా ఉన్నందున, ముందుకు వెళ్లేముందు పరస్పర అవగాహన, కుటుంబ చర్చ, పెద్దల సలహాకు ప్రాధాన్యం ఇవ్వండి.","kn":"ಶಾಸ್ತ್ರೀಯ ಹೊಂದಾಣಿಕೆ ತತ್ವಗಳ ಪ್ರಕಾರ ಈ ಸಂಬಂಧವನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ಪರಿಗಣಿಸುವುದು ಉತ್ತಮ. ಕೆಲವು ಪ್ರಮುಖ ಅಂಶಗಳಲ್ಲಿ ಹೊಂದಾಣಿಕೆ ಕಡಿಮೆ ಇರುವುದರಿಂದ, ಮುಂದುವರಿಯುವ ಮೊದಲು ಪರಸ್ಪರ ಅರಿವು, ಕುಟುಂಬದ ಚರ್ಚೆ ಮತ್ತು ಹಿರಿಯರ ಸಲಹೆಗೆ ಮಹತ್ವ ನೀಡಿ.","ta":"பாரம்பரிய பொருத்த விதிகளின்படி, இந்தப் பொருத்தத்தைக் கவனத்துடன் அணுகுவது நல்லது. சில முக்கிய அம்சங்களில் மதிப்பெண் குறைவாக இருப்பதால், முன்னேறுவதற்கு முன் பரஸ்பர புரிதல், நேர்மையான குடும்பப் பேச்சு, பெரியோர் ஆலோசனைக்கு முக்கியத்துவம் கொடுங்கள்.","bn":"শাস্ত্রীয় মিলনের নীতি অনুসারে এই মিলটি একটু ভেবেচিন্তে এগোনোই ভালো। কয়েকটি গুরুত্বপূর্ণ দিকে নম্বর কম, তাই এগোনোর আগে পারস্পরিক বোঝাপড়া, দুই পরিবারের খোলাখুলি আলোচনা আর গুরুজনদের পরামর্শকে গুরুত্ব দিন।","mr":"शास्त्रीय मेलनाच्या तत्त्वांनुसार या जुळणीचा थोडा विचार करून पुढे जाणे चांगले. काही महत्त्वाच्या बाबींत गुण कमी आहेत, त्यामुळे पुढे जाण्यापूर्वी परस्पर समजूत, दोन्ही कुटुंबांतील मोकळा संवाद आणि वडीलधाऱ्यांचा सल्ला यांना महत्त्व द्या.","gu":"શાસ્ત્રીય મેળાપકના સિદ્ધાંતો પ્રમાણે આ મેળનો થોડો વિચાર કરીને આગળ વધવું સારું. કેટલીક મહત્ત્વની બાબતોમાં ગુણ ઓછા છે, તેથી આગળ વધતાં પહેલાં પરસ્પર સમજ, બંને પરિવારો વચ્ચે ખુલ્લો સંવાદ અને વડીલોની સલાહને મહત્ત્વ આપો.","as":"শাস্ত্ৰীয় মিলনৰ নীতি অনুসৰি এই মিলটোৰ অলপ বিচাৰ কৰি আগবাঢ়া ভাল। কিছুমান গুৰুত্বপূৰ্ণ দিশত গুণ কম, সেয়েহে আগবাঢ়াৰ আগতে পাৰস্পৰিক বুজাবুজি, দুয়ো পৰিয়ালৰ মাজত মুকলি কথা-বতৰা আৰু বয়োজ্যেষ্ঠসকলৰ পৰামৰ্শক গুৰুত্ব দিয়ক।"},"confirmBoth":{"en":"If both match known details, generate. (Do double-check AM/PM!)","hi": వివాహ ఫలితం మరియు సలహా","kn":"ವಿವಾಹ ಫಲ ಮತ್ತು ಸಲಹೆ","ta":"திருமண எதிர்நோக்கும் பரிந்துரையும்","bn":"বিবাহের সম্ভাবনা ও পরামর্শ","mr":"विवाहाची शक्यता आणि सल्ला","gu":"વિવાહની શક્યતા અને સલાહ","as":"বিবাহৰ সম্ভাৱনা আৰু পৰামৰ্শ"},"koota":{"en":"Koota","hi":"कूट","te":"కూటం","kn":"ಕೂಟ","ta":"பொருத்தம்","bn":"কূট","mr":"कूट","gu":"કૂટ","as":"কূট"},"meaning":{"en":"Meaning","hi":"अर्थ","te":"అర్థం","kn":"ಅರ್ಥ","ta":"பொருள்","bn":"অর্থ","mr":"अर्थ","gu":"અર્થ","as":"অৰ্থ"},"points":{"en":"Points","hi":"अंक","te":"పాయింట్లు","kn":"ಅಂಕಗಳು","ta":"புள்ளிகள்","bn":"নম্বর","mr":"गुण","gu":"ગુણ","as":"গুণ"},"dosha":{"en":"Dosha","hi":"दोष","te":"దోషం","kn":"ದೋಷ","ta":"தோஷம்","bn":"দোষ","mr":"दोष","gu":"દોષ","as":"দোষ"},"nadiBhakoot":{"en":"Nadi and Bhakoot — no dosha ✓","hi":"नाड़ी और भकूट — कोई दोष नहीं ✓","te":"నాడి, భకూట — దోషం లేదు ✓","kn":"ನಾಡಿ ಮತ್ತು ಭಕೂಟ — ದೋಷ ಇಲ್ಲ ✓","ta":"நாடி மற்றும் பகூடம் — தோஷம் இல்லை ✓","bn":"নাড়ী ও ভকূট — কোনো দোষ নেই ✓","mr":"नाडी आणि भकूट — कोणताही दोष नाही ✓","gu":"નાડી અને ભકૂટ — કોઈ દોષ નથી ✓","as":"নাড়ী আৰু ভকূট — কোনো দোষ নাই ✓"},"mangalDosha":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ","ta":"செவ்வாய் தோஷம்","bn":"মঙ্গলদোষ","mr":"मंगळ दोष","gu":"મંગળ દોષ","as":"মঙ্গল দোষ"},"cancelFactors":{"en":"Cancellation factors","hi":"दोष कटने के कारण","te":"దోషం తొలగే కారణాలు","kn":"ದೋಷ ನಿವಾರಣೆಯ ಕಾರಣಗಳು","ta":"நீக்கும் காரணிகள்","bn":"দোষ খণ্ডনের কারণ","mr":"दोष परिहाराची कारणे","gu":"દોષ પરિહારનાં કારણો","as":"দোষ খণ্ডনৰ কাৰণ"},"noneSignificant":{"en":"None significant ✓","hi":"कोई बड़ा कारण नहीं ✓","te":"గణనీయమైనవి లేవు ✓","kn":"ಗಮನಾರ್ಹವಾದವು ಇಲ್ಲ ✓","ta":"குறிப்பிடத்தக்கவை இல்லை ✓","bn":"উল্লেখযোগ্য কিছু নেই ✓","mr":"उल्लेखनीय काही नाही ✓","gu":"ઉલ્લેખનીય કંઈ નથી ✓","as":"উল্লেখযোগ্য একো নাই ✓"},"yes":{"en":"Yes","hi":"हाँ","te":"అవును","kn":"ಹೌದು","ta":"ஆம்","bn":"হ্যাঁ","mr":"होय","gu":"હા","as":"হয়"},"no":{"en":"No","hi":"नहीं","te":"లేదు","kn":"ಇಲ್ಲ","ta":"இல்லை","bn":"না","mr":"नाही","gu":"ના","as":"নহয়"}},"manglik":{"none":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం లేదు — ఈ సంబంధానికి కుజుడి వల్ల ఎలాంటి అడ్డంకీ లేదు.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇಲ್ಲ — ಈ ಸಂಬಂಧಕ್ಕೆ ಕುಜನಿಂದ ಯಾವ ಅಡ್ಡಿಯೂ ಇಲ್ಲ.","ta":"இரண்டு ஜாதகங்களிலும் செவ்வாய் தோஷம் இல்லை — இந்த சம்பந்தத்திற்கு செவ்வாயால் எந்தத் தடையும் இல்லை.","bn":"দুই কোষ্ঠীর কোনোটিতেই মঙ্গলদোষ নেই — এই সম্পর্কে মঙ্গলের দিক থেকে কোনো বাধা নেই।","mr":"दोन्ही पत्रिकांपैकी कोणत्याही एकात मंगळ दोष नाही — या नात्यात मंगळाकडून कोणताही अडथळा नाही.","gu":"બંને કુંડળીઓમાંથી કોઈમાં પણ મંગળ દોષ નથી — આ સંબંધમાં મંગળ તરફથી કોઈ અડચણ નથી.","as":"দুয়োখন কুণ্ডলীৰ কোনো এখনতে মঙ্গল দোষ নাই — এই সম্পৰ্কত মঙ্গলৰ পৰা কোনো বাধা নাই।"},"neutralized":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం ఉంది — శాస్త్ర నియమం ప్రకారం దోషం పరస్పరం తొలగిపోతుంది.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ — ಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ದೋಷ ಪರಸ್ಪರ ನಿವಾರಣೆಯಾಗುತ್ತದೆ.","ta":"இரண்டு ஜாதகங்களிலும் செவ்வாய் தோஷம் உள்ளது — சாஸ்திர விதிப்படி தோஷம் பரஸ்பரம் நீங்குகிறது.","bn":"দুই কোষ্ঠীতেই মঙ্গলদোষ রয়েছে — শাস্ত্রীয় নিয়ম অনুসারে দোষ পরস্পর কেটে যায়।","mr":"दोन्ही पत्रिकांत मंगळ दोष आहे — शास्त्रीय नियमानुसार दोष परस्पर रद्द होतो.","gu":"બંને કુંડળીઓમાં મંગળ દોષ છે — શાસ્ત્રીય નિયમ પ્રમાણે દોષ પરસ્પર રદ થાય છે.","as":"দুয়োখন কুণ্ডলীতে মঙ্গল দোষ আছে — শাস্ত্ৰীয় নিয়ম অনুসৰি দোষ পৰস্পৰ খণ্ডিত হয়।"},"softened":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, కానీ కింద చెప్పిన శాస్త్ర పరిహార కారణాల వల్ల అది తగ్గింది; సంప్రదాయ పరిహారాలతో ఈ సంబంధం ముందుకు సాగవచ్చు.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ಆದರೆ ಕೆಳಗೆ ಹೇಳಿದ ಶಾಸ್ತ್ರೀಯ ಪರಿಹಾರ ಕಾರಣಗಳಿಂದ ಅದು ಕಡಿಮೆಯಾಗಿದೆ; ಸಂಪ್ರದಾಯದ ಪರಿಹಾರಗಳೊಂದಿಗೆ ಈ ಸಂಬಂಧ ಮುಂದುವರಿಯಬಹುದು.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, ஆனால் கீழே சொல்லப்பட்ட சாஸ்திரப் பரிகார காரணங்களால் அது குறைந்துள்ளது; பாரம்பரியப் பரிகாரங்களுடன் இந்த சம்பந்தம் முன்னேறலாம்.","bn":"একটি কোষ্ঠীতে মঙ্গলদোষ রয়েছে, তবে নিচে বলা শাস্ত্রীয় খণ্ডনের কারণগুলিতে তা অনেকটাই কমে গেছে; প্রচলিত প্রতিকার মেনে এই সম্পর্ক এগোতে পারে।","mr":"एका पत्रिकेत मंगळ दोष आहे, पण खाली दिलेल्या शास्त्रीय परिहारांमुळे तो बराच कमी झाला आहे; प्रचलित उपाय करून हे नाते पुढे जाऊ शकते.","gu":"એક કુંડળીમાં મંગળ દોષ છે, પણ નીચે આપેલા શાસ્ત્રીય પરિહારોને કારણે તે ઘણો ઓછો થયો છે; પ્રચલિત ઉપાય કરીને આ સંબંધ આગળ વધી શકે છે.","as":"এখন কুণ্ডলীত মঙ্গল দোষ আছে, কিন্তু তলত দিয়া শাস্ত্ৰীয় খণ্ডনৰ বাবে ই বহুত লঘু হৈছে; প্ৰচলিত উপায় কৰি এই সম্পৰ্ক আগবাঢ়িব পাৰে।"},"present":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, తొలగించే కారణాలేవీ లేవు — ముందుకు వెళ్లేముందు కుజ శాంతి (హనుమాన్ ఉపాసన, మంగళవార వ్రతం) చేసి పెద్దల సలహా తీసుకోవాలని సంప్రదాయం చెబుతోంది.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ನಿವಾರಣೆಯ ಕಾರಣಗಳಿಲ್ಲ — ಮುಂದುವರಿಯುವ ಮೊದಲು ಕುಜ ಶಾಂತಿ (ಹನುಮಂತನ ಉಪಾಸನೆ, ಮಂಗಳವಾರದ ವ್ರತ) ಮಾಡಿ ಹಿರಿಯರ ಸಲಹೆ ಪಡೆಯಬೇಕೆಂದು ಸಂಪ್ರದಾಯ ಹೇಳುತ್ತದೆ.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, நீக்கும் காரணங்கள் எதுவும் இல்லை — முன்னேறுவதற்கு முன் செவ்வாய் சாந்தி (அனுமன் உபாசனை, செவ்வாய்க்கிழமை விரதம்) செய்து பெரியோர் ஆலோசனை பெறுமாறு சம்பிரதாயம் கூறுகிறது.","bn":"একটি কোষ্ঠীতে মঙ্গলদোষ রয়েছে, খণ্ডনের কোনো কারণ নেই — এগোনোর আগে মঙ্গল শান্তি (হনুমান উপাসনা, মঙ্গলবারের ব্রত) করে গুরুজনদের পরামর্শ নেওয়ার কথা শাস্ত্র বলে।","mr":"एका पत्रिकेत मंगळ दोष आहे आणि परिहाराचे कारण नाही — पुढे जाण्यापूर्वी मंगळ शांती (हनुमान उपासना, मंगळवारचे व्रत) करून वडीलधाऱ्यांचा सल्ला घ्यावा असे शास्त्र सांगते.","gu":"એક કુંડળીમાં મંગળ દોષ છે અને પરિહારનું કારણ નથી — આગળ વધતાં પહેલાં મંગળ શાંતિ (હનુમાન ઉપાસના, મંગળવારનું વ્રત) કરીને વડીલોની સલાહ લેવી જોઈએ એમ શાસ્ત્ર કહે છે.","as":"এখন কুণ্ডলীত মঙ্গল দোষ আছে আৰু খণ্ডনৰ কাৰণ নাই — আগবাঢ়ি যোৱাৰ আগতে মঙ্গল শান্তি (হনুমান উপাসনা, মঙ্গলবাৰৰ ব্ৰত) কৰি বয়োজ্যেষ্ঠসকলৰ পৰামৰ্শ লোৱা উচিত বুলি শাস্ত্ৰই কয়।"},"note":{"en":"Note: Mangal Dosha strength reflects Mars’ house position and aggravating or softening factors — which is why we show it as Mild / Moderate / Strong rather than a raw number.","hi":"नोट: मंगल दोष की तीव्रता मंगल की भाव-स्थिति से आँकी जाती है; एकाधिक कारक इसे बढ़ा या घटा सकते हैं।","te":"గమనిక: కుజ దోష తీవ్రత కుజుడి భావ స్థితిని బట్టి, దాన్ని పెంచే లేదా తగ్గించే అంశాలను బట్టి లెక్కిస్తారు — అందుకే దీన్ని ఒక సంఖ్యగా కాకుండా అల్ప / మధ్యమ / తీవ్ర అని చూపిస్తున్నాం.","kn":"ಗಮನಿಸಿ: ಕುಜ ದೋಷದ ತೀವ್ರತೆಯನ್ನು ಕುಜನ ಭಾವ ಸ್ಥಿತಿ ಮತ್ತು ಅದನ್ನು ಹೆಚ್ಚಿಸುವ ಅಥವಾ ಕಡಿಮೆ ಮಾಡುವ ಅಂಶಗಳಿಂದ ಲೆಕ್ಕ ಹಾಕುತ್ತಾರೆ — ಆದ್ದರಿಂದ ಇದನ್ನು ಸಂಖ್ಯೆಯಾಗಿ ಅಲ್ಲದೆ ಅಲ್ಪ / ಮಧ್ಯಮ / ತೀವ್ರ ಎಂದು ತೋರಿಸಿದ್ದೇವೆ.","ta":"குறிப்பு: செவ்வாய் தோஷத்தின் தீவிரம் செவ்வாயின் பாவ நிலையையும், அதை அதிகரிக்கும் அல்லது குறைக்கும் அம்சங்களையும் பொறுத்தே கணக்கிடப்படுகிறது — அதனால் இதை ஒரு எண்ணாக அல்லாமல் லேசு / மிதம் / தீவிரம் என்று காட்டுகிறோம்.","bn":"টীকা: মঙ্গলদোষের মাত্রা নির্ভর করে মঙ্গলের ভাব-অবস্থান আর তা বাড়ানো বা কমানোর কারণগুলির উপর — সেই কারণেই আমরা এটিকে কাঁচা সংখ্যার বদলে হালকা / মাঝারি / প্রবল হিসেবে দেখাই।","mr":"टीप: मंगळ दोषाची तीव्रता मंगळाच्या भावस्थितीवर आणि तो वाढवणाऱ्या किंवा कमी करणाऱ्या घटकांवर अवलंबून असते — म्हणूनच आम्ही तो कच्च्या आकड्याऐवजी सौम्य / मध्यम / तीव्र असा दाखवतो.","gu":"નોંધ: મંગળ દોષની તીવ્રતા મંગળની ભાવસ્થિતિ અને તેને વધારનારા કે ઘટાડનારા ઘટકો પર આધારિત છે — તેથી જ અમે તેને કાચા આંકડાને બદલે હળવો / મધ્યમ / તીવ્ર તરીકે બતાવીએ છીએ.","as":"টোকা: মঙ্গল দোষৰ তীব্ৰতা মঙ্গলৰ ভাৱস্থিতি আৰু তাক বঢ়োৱা বা কমোৱা উপাদানৰ ওপৰত নিৰ্ভৰ কৰে — সেয়েহে আমি ইয়াক কেঁচা সংখ্যাৰ সলনি লঘু / মধ্যম / তীব্ৰ হিচাপে দেখুৱাওঁ।"},"Mild":{"en":"Mild","hi":"अल्प","te":"అల్ప","kn":"ಅಲ್ಪ","ta":"லேசு","bn":"হালকা","mr":"सौम्य","gu":"હળવો","as":"লঘু"},"Moderate":{"en":"Moderate","hi":"मध्यम","te":"మధ్యమ","kn":"ಮಧ್ಯಮ","ta":"மிதம்","bn":"মাঝারি","mr":"मध्यम","gu":"મધ્યમ","as":"মধ্যম"},"Strong":{"en":"Strong","hi":"प्रबल","te":"తీవ్ర","kn":"ತೀವ್ರ","ta":"தீவிரம்","bn":"প্রবল","mr":"तीव्र","gu":"તીવ્ર","as":"তীব্ৰ"}},"career":{"barLeadership":{"en":"Leadership Ability","hi":"नेतृत्व क्षमता","te":"నాయకత్వ శక్తి","kn":"ನಾಯಕತ್ವ ಸಾಮರ್ಥ್ಯ","ta":"தலைமைத் திறன்","bn":"নেতৃত্বের ক্ষমতা","mr":"नेतृत्वक्षमता","gu":"નેતૃત્વક્ષમતા","as":"নেতৃত্বৰ ক্ষমতা"},"barEntre":{"en":"Entrepreneurship","hi":"अपना काम शुरू करने की क्षमता","te":"సొంత వ్యాపార శక్తి","kn":"ಸ್ವಂತ ಉದ್ಯಮ ಶಕ್ತಿ","ta":"தொழில்முனைவு","bn":"ব্যবসার ক্ষমতা","mr":"व्यवसायक्षमता","gu":"વ્યવસાયક્ષમતા","as":"ব্যৱসায়ৰ ক্ষমতা"},"barWealth":{"en":"Wealth Potential","hi":"धन संभावना","te":"సంపద అవకాశం","kn":"ಸಂಪತ್ತಿನ ಸಾಧ್ಯತೆ","ta":"செல்வ வாய்ப்பு","bn":"সম্পদের সম্ভাবনা","mr":"संपत्तीची शक्यता","gu":"સંપત્તિની શક્યતા","as":"সম্পত্তিৰ সম্ভাৱনা"},"barGovt":{"en":"Govt Sector Fit","hi":"सरकारी नौकरी में सफलता","te":"ప్రభుత్వ ఉద్యోగంలో విజయం","kn":"ಸರ್ಕಾರಿ ಉದ್ಯೋಗದಲ್ಲಿ ಯಶಸ್ಸು","ta":"அரசு துறை பொருத்தம்","bn":"সরকারি ক্ষেত্রে মানানসই","mr":"सरकारी क्षेत्रात योग्यता","gu":"સરકારી ક્ષેત્રમાં યોગ્યતા","as":"চৰকাৰী ক্ষেত্ৰত উপযুক্ততা"},"barPriv":{"en":"Private Sector Fit","hi":"प्राइवेट सेक्टर में सफलता","te":"ప్రైవేట్ సెక్టార్‌లో విజయం","kn":"ಪ್ರೈವೇಟ್ ಸೆಕ್ಟರ್‌ನಲ್ಲಿ ಯಶಸ್ಸು","ta":"தனியார் துறை பொருத்தம்","bn":"প্রাইভেট ক্ষেত্রে মানানসই","mr":"खासगी क्षेत्रात योग्यता","gu":"ખાનગી ક્ષેત્રમાં યોગ્યતા","as":"ব্যক্তিগত ক্ষেত্ৰত উপযুক্ততা"},"confirmGen":{"en":"If correct, generate (check AM/PM)","hi":"सही हो तो रिपोर्ट बनाएँ (AM/PM जाँचें)","te":"సరిగ్గా ఉంటే రిపోర్ట్ తయారు చేయండి (AM/PM చూడండి)","kn":"ಸರಿಯಾಗಿದ್ದರೆ ವರದಿ ತಯಾರಿಸಿ (AM/PM ಪರಿಶೀಲಿಸಿ)","ta":"சரியெனில், உருவாக்கவும் (AM/PM சரிபார்க்கவும்)","bn":"ঠিক থাকলে রিপোর্ট তৈরি করুন (AM/PM মিলিয়ে নিন)","mr":"बरोबर असेल तर अहवाल तयार करा (AM/PM तपासा)","gu":"બરાબર હોય તો અહેવાલ તૈયાર કરો (AM/PM તપાસો)","as":"শুদ্ধ হ'লে প্ৰতিবেদন প্ৰস্তুত কৰক (AM/PM চাওক)"},"primarySig":{"en":"PRIMARY CAREER SIGNATURE","hi":"आपकी करियर पहचान","te":"మీ కెరీర్ స్వభావం","kn":"ನಿಮ್ಮ ಕೆರಿಯರ್ ಸ್ವಭಾವ","ta":"முதன்மை தொழில் சுபாவம்","bn":"আপনার মূল কর্মপ্রকৃতি","mr":"तुमचा मुख्य कर्मस्वभाव","gu":"તમારો મુખ્ય કર્મસ્વભાવ","as":"আপোনাৰ মূল কৰ্মস্বভাৱ"},"topFields":{"en":"TOP FIELDS","hi":"सबसे अच्छे क्षेत्र","te":"ఉత్తమ రంగాలు","kn":"ಅತ್ಯುತ್ತಮ ಕ್ಷೇತ್ರಗಳು","ta":"சிறந்த துறைகள்","bn":"সবচেয়ে উপযুক্ত ক্ষেত্র","mr":"सर्वात योग्य क्षेत्रे","gu":"સૌથી યોગ્ય ક્ષેત્રો","as":"আটাইতকৈ উপযুক্ত ক্ষেত্ৰ"},"keyIndicators":{"en":"KEY INDICATORS","hi":"मुख्य संकेत","te":"ముఖ్య సూచికలు","kn":"ಪ್ರಮುಖ ಸೂಚಕಗಳು","ta":"முக்கிய அறிகுறிகள்","bn":"প্রধান সূচক","mr":"प्रमुख सूचक","gu":"મુખ્ય સૂચક","as":"মুখ্য সূচক"},"leadership":{"en":"Leadership","hi":"नेतृत्व","te":"నాయకత్వం","kn":"ನಾಯಕತ್ವ","ta":"தலைமை","bn":"নেতৃত্ব","mr":"नेतृत्व","gu":"નેતૃત્વ","as":"নেতৃত্ব"},"entrepreneurship":{"en":"Entrepreneurship","hi":"अपना काम","te":"సొంత వ్యాపారం","kn":"ಸ್ವಂತ ಉದ್ಯಮ","ta":"தொழில்முனைவு","bn":"ব্যবসা","mr":"व्यवसाय","gu":"વ્યવસાય","as":"ব্যৱসায়"},"wealth":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು","ta":"செல்வம்","bn":"সম্পদ","mr":"संपत्ती","gu":"સંપત્તિ","as":"সম্পত্তি"},"recommendation":{"en":"RECOMMENDATION","hi":"सलाह","te":"సలహా","kn":"ಸಲಹೆ","ta":"பரிந்துரை","bn":"পরামর্শ","mr":"सल्ला","gu":"સલાહ","as":"পৰামৰ্শ"},"leadStrong":{"en":"Your leadership potential is strong — people accept your guidance naturally. Management, team-lead or founder roles suit you well.","hi":"आपमें स्वाभाविक नेतृत्व-क्षमता प्रबल है — लोग आपका मार्गदर्शन सहज स्वीकार करते हैं। प्रबंधन, टीम-नेतृत्व या संस्थापक भूमिकाएँ आपके अनुकूल हैं।","te":"మీలో సహజమైన నాయకత్వ శక్తి బలంగా ఉంది — మీ మార్గదర్శనాన్ని జనం సులభంగా అంగీకరిస్తారు. మేనేజ్‌మెంట్, టీమ్ లీడ్ లేదా వ్యవస్థాపక పాత్రలు మీకు బాగా సరిపోతాయి.","kn":"ನಿಮ್ಮಲ್ಲಿ ಸಹಜ ನಾಯಕತ್ವ ಶಕ್ತಿ ಬಲವಾಗಿದೆ — ನಿಮ್ಮ ಮಾರ್ಗದರ್ಶನವನ್ನು ಜನ ಸಹಜವಾಗಿ ಒಪ್ಪುತ್ತಾರೆ. ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್, ಟೀಮ್ ಲೀಡ್ ಅಥವಾ ಸಂಸ್ಥಾಪಕ ಪಾತ್ರಗಳು ನಿಮಗೆ ಚೆನ್ನಾಗಿ ಹೊಂದುತ್ತವೆ.","ta":"உங்கள் தலைமைத் திறன் பலமானது — மக்கள் இயல்பாகவே உங்கள் வழிகாட்டுதலை ஏற்கிறார்கள். மேலாண்மை, குழுத் தலைமை அல்லது நிறுவனர் பொறுப்புகள் உங்களுக்கு நன்கு பொருந்தும்.","bn":"আপনার নেতৃত্বের ক্ষমতা শক্তিশালী — মানুষ সহজেই আপনার কথা মেনে নেয়। ম্যানেজমেন্ট, টিম-লিড বা প্রতিষ্ঠাতার ভূমিকা আপনার জন্য ভালো মানায়।","mr":"तुमची नेतृत्वक्षमता मजबूत आहे — लोक सहज तुमचे ऐकतात. व्यवस्थापन, टीम-लीड किंवा संस्थापकाची भूमिका तुम्हाला चांगली मानवते.","gu":"તમારી નેતૃત્વક્ષમતા મજબૂત છે — લોકો સહજ તમારું સાંભળે છે. વ્યવસ્થાપન, ટીમ-લીડ કે સ્થાપકની ભૂમિકા તમને સારી રીતે માફક આવે છે.","as":"আপোনাৰ নেতৃত্বৰ ক্ষমতা শক্তিশালী — মানুহে সহজেই আপোনাৰ কথা শুনে। পৰিচালনা, টিম-লিড বা প্ৰতিষ্ঠাপকৰ ভূমিকা আপোনাক ভালকৈ খাপ খায়।"},"leadMid":{"en":"You have solid leadership ability that grows with experience. Starting with a small team and building toward larger responsibility suits you.","hi":"आपमें अच्छी नेतृत्व-क्षमता है जो अनुभव के साथ निखरती है। छोटी टीम से आरंभ कर बड़ी ज़िम्मेदारी की ओर बढ़ना उपयुक्त रहेगा।","te":"మీలో మంచి నాయకత్వ శక్తి ఉంది, అది అనుభవంతో మెరుగవుతుంది. చిన్న టీమ్‌తో మొదలుపెట్టి పెద్ద బాధ్యతల వైపు వెళ్లడం మీకు సరిపోతుంది.","kn":"ನಿಮ್ಮಲ್ಲಿ ಒಳ್ಳೆಯ ನಾಯಕತ್ವ ಶಕ್ತಿ ಇದೆ, ಅದು ಅನುಭವದೊಂದಿಗೆ ಬೆಳೆಯುತ್ತದೆ. ಸಣ್ಣ ತಂಡದಿಂದ ಆರಂಭಿಸಿ ದೊಡ್ಡ ಜವಾಬ್ದಾರಿಯತ್ತ ಸಾಗುವುದು ನಿಮಗೆ ಸರಿ.","ta":"அனுபவத்துடன் வளரும் உறுதியான தலைமைத் திறன் உங்களிடம் உள்ளது. சிறிய குழுவில் தொடங்கி, பெரிய பொறுப்பை நோக்கி வளர்வது உங்களுக்கு ஏற்றது.","bn":"আপনার নেতৃত্বের ক্ষমতা ভালো, অভিজ্ঞতার সঙ্গে তা আরও বাড়বে। ছোট দল দিয়ে শুরু করে ধীরে ধীরে বড় দায়িত্বের দিকে এগোনোই আপনার পক্ষে ভালো।","mr":"तुमची नेतृत्वक्षमता चांगली आहे आणि अनुभवाबरोबर ती अधिक वाढेल. लहान संघापासून सुरुवात करून हळूहळू मोठ्या जबाबदारीकडे जाणे तुमच्यासाठी योग्य.","gu":"તમારી નેતૃત્વક્ષમતા સારી છે અને અનુભવ સાથે વધુ વધશે. નાની ટીમથી શરૂ કરીને ધીરે ધીરે મોટી જવાબદારી તરફ જવું તમારા માટે યોગ્ય.","as":"আপোনাৰ নেতৃত্বৰ ক্ষমতা ভাল আৰু অভিজ্ঞতাৰ সৈতে ই আৰু বাঢ়িব। সৰু দলৰ পৰা আৰম্ভ কৰি লাহে লাহে ডাঙৰ দায়িত্বলৈ যোৱাটোৱে আপোনাৰ বাবে উপযুক্ত।"},"leadExpert":{"en":"Your strength lies more in expertise than command — leading through deep skill is your natural path. Leadership can be learned, but you shine most as a specialist.","hi":"आपकी शक्ति नेतृत्व से अधिक विशेषज्ञता में है — गहरी दक्षता से प्रभाव बनाना आपका स्वाभाविक मार्ग है। नेतृत्व सीखा जा सकता है, पर विशेषज्ञ के रूप में आप अधिक चमकते हैं।","te":"మీ బలం ఆజ్ఞాపించడంలో కాదు, నైపుణ్యంలో ఉంది — లోతైన నైపుణ్యంతో ప్రభావం చూపడమే మీ సహజ మార్గం. నాయకత్వం నేర్చుకోవచ్చు, కానీ నిపుణుడిగానే మీరు ఎక్కువ మెరుస్తారు.","kn":"ನಿಮ್ಮ ಬಲ ಆಜ್ಞೆ ಮಾಡುವುದರಲ್ಲಿ ಅಲ್ಲ, ಪರಿಣತಿಯಲ್ಲಿ — ಆಳವಾದ ಕೌಶಲದಿಂದ ಪ್ರಭಾವ ಬೀರುವುದೇ ನಿಮ್ಮ ಸಹಜ ದಾರಿ. ನಾಯಕತ್ವ ಕಲಿಯಬಹುದು, ಆದರೆ ಪರಿಣಿತರಾಗಿಯೇ ನೀವು ಹೆಚ್ಚು ಮಿಂಚುತ್ತೀರಿ.","ta":"உங்கள் பலம் அதிகாரத்தை விட நிபுணத்துவத்திலேயே அதிகம் — ஆழமான திறமையால் வழிநடத்துவதே உங்கள் இயல்பான பாதை. தலைமையைக் கற்றுக்கொள்ளலாம், ஆனால் ஒரு நிபுணராகவே நீங்கள் மிகவும் பிரகாசிக்கிறீர்கள்.","bn":"আপনার শক্তি হুকুম চালানোর চেয়ে দক্ষতায় বেশি — গভীর জ্ঞান দিয়ে পথ দেখানোই আপনার স্বাভাবিক পথ। নেতৃত্ব শেখা যায়, তবে বিশেষজ্ঞ হিসেবেই আপনি সবচেয়ে বেশি উজ্জ্বল।","mr":"तुमचे बळ हुकूम गाजवण्यापेक्षा कौशल्यात जास्त आहे — सखोल ज्ञानाने वाट दाखवणे हा तुमचा स्वाभाविक मार्ग. नेतृत्व शिकता येते, पण तज्ज्ञ म्हणूनच तुम्ही सर्वाधिक चमकता.","gu":"તમારું બળ હુકમ ચલાવવા કરતાં કૌશલ્યમાં વધારે છે — ઊંડા જ્ઞાનથી રસ્તો બતાવવો એ તમારો સ્વાભાવિક માર્ગ. નેતૃત્વ શીખી શકાય, પણ નિષ્ણાત તરીકે જ તમે સૌથી વધુ ચમકો છો.","as":"আপোনাৰ বল হুকুম চলোৱাতকৈ দক্ষতাত বেছি — গভীৰ জ্ঞানেৰে বাট দেখুওৱাটোৱেই আপোনাৰ স্বাভাৱিক পথ। নেতৃত্ব শিকিব পাৰি, কিন্তু বিশেষজ্ঞ হিচাপেহে আপুনি আটাইতকৈ বেছি উজ্জ্বল।"},"whatToDo":{"en":"What to do in each period — direct guidance on putting astrology to use:","hi":"हर अवधि में क्या करें — ज्योतिष को काम में लाने की सीधी सलाह:","te":"ప్రతి కాలంలో ఏమి చేయాలి — జ్యోతిష్యాన్ని ఆచరణలో పెట్టే స్పష్టమైన సూచనలు:","kn":"ಪ್ರತಿ ಕಾಲದಲ್ಲಿ ಏನು ಮಾಡಬೇಕು — ಜ್ಯೋತಿಷ್ಯವನ್ನು ಆಚರಣೆಗೆ ತರುವ ಸ್ಪಷ್ಟ ಸಲಹೆಗಳು:","ta":"ஒவ்வொரு காலத்திலும் என்ன செய்வது — ஜோதிடத்தை செயலில் பயன்படுத்த நேரடி வழிகாட்டுதல்:","bn":"কোন সময়ে কী করবেন — জ্যোতিষকে কাজে লাগানোর সরাসরি পরামর্শ:","mr":"कोणत्या वेळी काय करावे — ज्योतिष प्रत्यक्षात वापरण्याचा सरळ सल्ला:","gu":"કયા સમયે શું કરવું — જ્યોતિષને વ્યવહારમાં વાપરવાની સીધી સલાહ:","as":"কোন সময়ত কি কৰিব — জ্যোতিষক ব্যৱহাৰিকভাৱে প্ৰয়োগ কৰাৰ পোনপটীয়া পৰামৰ্শ:"},"avoidFields":{"en":"These fields rest mainly on the same less-supported planet(s) in your chart, which is why they group together.","hi":"ये क्षेत्र मुख्यतः उन्हीं ग्रहों पर आधारित हैं जो आपकी कुंडली में कम बली हैं — इसलिए एक साथ समूहित हैं।","te":"ఈ రంగాలు మీ జాతకంలో తక్కువ బలం ఉన్న గ్రహాల మీదే ఆధారపడతాయి — అందుకే ఇవి ఒకే గుంపుగా ఉన్నాయి.","kn":"ಈ ಕ್ಷೇತ್ರಗಳು ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಕಡಿಮೆ ಬಲ ಇರುವ ಗ್ರಹಗಳ ಮೇಲೆಯೇ ಅವಲಂಬಿತ, ಆದ್ದರಿಂದ ಇವು ಒಂದೇ ಗುಂಪಾಗಿವೆ.","ta":"இந்தத் துறைகள் பெரும்பாலும் உங்கள் ஜாதகத்தில் குறைவான ஆதரவுள்ள அதே ிகளை இப்போதே எடுங்கள். வாய்ப்பின் கதவு திறந்திருக்கிறது.","bn":"এই বছরের গতিকে পুরোপুরি কাজে লাগান — বড় সিদ্ধান্ত, বিনিয়োগ আর নতুন উদ্যোগ এখনই নিন। সুযোগের দরজা খোলা আছে।","mr":"या वर्षाचा वेग पूर्णपणे वापरा — मोठे निर्णय, गुंतवणूक आणि नवे उपक्रम आताच घ्या. संधीचे दार उघडे आहे.","gu":"આ વર્ષની ગતિ પૂરેપૂરી વાપરો — મોટા નિર્ણય, રોકાણ અને નવા ઉપક્રમ અત્યારે જ લો. તકનું દ્વાર ખુલ્લું છે.","as":"এই বছৰৰ গতি সম্পূৰ্ণৰূপে ব্যৱহাৰ কৰক — ডাঙৰ সিদ্ধান্ত, বিনিয়োগ আৰু নতুন উদ্যোগ এতিয়াই লওক। সুযোগৰ দুৱাৰ মুকলি আছে।"},"stratCaution":{"en":"Protect your gains, increase savings, prioritize health, and avoid big risks. This is a year to cross with patience.","hi":"लाभ सुरक्षित रखें, बचत बढ़ाएँ, स्वास्थ्य को प्राथमिकता दें और बड़े जोखिम टालें। यह वर्ष धैर्य से पार करने का है।","te":"మీ లాభాలను కాపాడుకోండి, పొదుపు పెంచండి, ఆరోగ్యానికి ప్రాధాన్యం ఇవ్వండి, పెద్ద రిస్క్‌లు వద్దు. ఈ సంవత్సరాన్ని ఓపికతో దాటాల్సి ఉంది.","kn":"ನಿಮ್ಮ ಲಾಭಗಳನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಿ, ಉಳಿತಾಯ ಹೆಚ್ಚಿಸಿ, ಆರೋಗ್ಯಕ್ಕೆ ಆದ್ಯತೆ ಕೊಡಿ, ದೊಡ್ಡ ರಿಸ್ಕ್ ಬೇಡ. ಈ ವರ್ಷವನ್ನು ತಾಳ್ಮೆಯಿಂದ ದಾಟಬೇಕು.","ta":"உங்கள் சம்பாதித்ததைக் காத்துக்கொள்ளுங்கள், சேமிப்பை அதிகரியுங்கள், ஆரோக்கியத்திற்கு முன்னுரிமை கொடுங்கள், பெரிய ரிஸ்க்குகளைத் தவிருங்கள். இது பொறுமையுடன் கடக்க வேண்டிய ஆண்டு.","bn":"যা অর্জন করেছেন তা রক্ষা করুন, সঞ্চয় বাড়ান, স্বাস্থ্যকে অগ্রাধিকার দিন আর বড় ঝুঁকি এড়িয়ে চলুন। এই বছরটি ধৈর্য ধরে পার করার।","mr":"जे मिळवले आहे ते जपा, बचत वाढवा, आरोग्याला प्राधान्य द्या आणि मोठी जोखीम टाळा. हे वर्ष संयमाने पार करण्याचे.","gu":"જે મેળવ્યું છે તે સાચવો, બચત વધારો, આરોગ્યને પ્રાધાન્ય આપો અને મોટું જોખમ ટાળો. આ વર્ષ ધીરજથી પસાર કરવાનું.","as":"যি পাইছে সেয়া ৰক্ষা কৰক, সঞ্চয় বঢ়াওক, স্বাস্থ্যক প্ৰাধান্য দিয়ক আৰু ডাঙৰ ধৰণৰ ৰিস্ক এৰক। এই বছৰ ধৈৰ্যৰে পাৰ কৰাৰ।"},"age":{"en":"Age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು","ta":"வயது","bn":"বয়স","mr":"वय","gu":"વય","as":"বয়স"},"ageLower":{"en":"age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು","ta":"வயது","bn":"বয়স","mr":"वय","gu":"વય","as":"বয়স"},"alsoJoin":{"en":"; also ","hi":"; साथ ही ","te":"; అలాగే ","kn":"; ಜೊತೆಗೆ ","ta":"; மேலும் ","bn":"; সেই সঙ্গে ","mr":"; त्याचबरोबर ","gu":"; તેની સાથે ","as":"; তাৰ সৈতে "},"yearByYear":{"en":"Year by Year","hi":"वर्ष-दर-वर्ष","te":"సంవత్సరం వారీగా","kn":"ವರ್ಷವಾರು","ta":"ஆண்டுவாரியாக","bn":"বছরের পর বছর","mr":"वर्षानुवर्ष","gu":"વર્ષે વર્ષે","as":"বছৰে বছৰে"},"yearByYearContd":{"en":"Year by Year (contd.)","hi":"वर्ष-दर-वर्ष (क्रमशः)","te":"సంవత్సరం వారీగా (కొనసాగింపు)","kn":"ವರ್ಷವಾರು (ಮುಂದುವರಿಕೆ)","ta":"ஆண்டுவாரியாக (தொடர்ச்சி)","bn":"বছরের পর বছর (চলছে)","mr":"वर्षानुवर्ष (पुढे चालू)","gu":"વર્ષે વર્ષે (ચાલુ)","as":"বছৰে বছৰে (আগবাঢ়িছে)"},"closing":{"en":"Closing","hi":"समापन","te":"ముగింపు","kn":"ಮುಕ್ತಾಯ","ta":"நிறைவாக","bn":"শেষ কথা","mr":"शेवटचे शब्द","gu":"છેલ્લા શબ્દો","as":"শেষ কথা"},"closingText":{"en":"This decade blends auspicious and testing years — as every life does. Move boldly in the bright years, lean on patience and remedies in the testing ones. Astrology shows the road; the walking is yours.","hi":"यह दशक शुभ और परीक्षा दोनों वर्षों का मिश्रण है — जैसा हर जीवन होता है। शुभ वर्षों में साहस से आगे बढ़ें, परीक्षा के वर्षों में धैर्य और उपायों का सहारा लें। ज्योतिष मार्ग दिखाता है; चलना आपको है।","te":"ఈ దశాబ్దంలో శుభ సంవత్సరాలూ, పరీక్షించే సంవత్సరాలూ రెండూ ఉన్నాయి — ప్రతి జీవితంలో ఉన్నట్టే. మంచి సంవత్సరాల్లో ధైర్యంగా ముందుకు వెళ్లండి, పరీక్షా కాలంలో ఓపిక, పరిహారాల ఆసరా తీసుకోండి. జ్యోతిష్యం దారి చూపిస్తుంది; నడవాల్సింది మీరే.","kn":"ಈ ದಶಕದಲ್ಲಿ ಶುಭ ವರ್ಷಗಳೂ ಪರೀಕ್ಷಿಸುವ ವರ್ಷಗಳೂ ಎರಡೂ ಇವೆ — ಪ್ರತಿ ಬದುಕಿನಲ್ಲೂ ಇರುವಂತೆ. ಒಳ್ಳೆಯ ವರ್ಷಗಳಲ್ಲಿ ಧೈರ್ಯದಿಂದ ಮುಂದೆ ಹೋಗಿ, ಪರೀಕ್ಷೆಯ ಕಾಲದಲ್ಲಿ ತಾಳ್ಮೆ ಮತ್ತು ಪರಿಹಾರಗಳ ಆಸರೆ ಪಡೆಯಿರಿ. ಜ್ಯೋತಿಷ್ಯ ದಾರಿ ತೋರಿಸುತ್ತದೆ; ನಡೆಯಬೇಕಾದವರು ನೀವೇ.","ta":"இந்த தசாப்தம் சுபமான, சோதனையான ஆண்டுகளைக் கலந்திருக்கிறது — ஒவ்வொரு வாழ்க்கையையும் போலவே. பிரகாசமான ஆண்டுகளில் தைரியமாக நகருங்கள், சோதனையான ஆண்டுகளில் பொறுமையையும் பரிகாரங்களையும் சார்ந்திருங்கள். ஜோதிடம் பாதையைக் காட்டுகிறது; நடப்பது உங்கள் கையில்.","bn":"এই দশকে শুভ আর পরীক্ষার বছর মিলেমিশে আছে — প্রতিটি জীবনেই যেমন থাকে। উজ্জ্বল বছরগুলিতে সাহস নিয়ে এগোন, পরীক্ষার বছরে ধৈর্য আর প্রতিকারের উপর ভরসা রাখুন। জ্যোতিষ পথ দেখায়; হাঁটাটা আপনারই।","mr":"या दशकात शुभ आणि परीक्षा घेणारी वर्षे मिसळलेली आहेत — प्रत्येक आयुष्यात असतात तशीच. तेजस्वी वर्षांत धैर्याने पुढे जा, परीक्षेच्या वर्षांत संयम आणि परिहारांवर भरवसा ठेवा. ज्योतिष वाट दाखवते; चालणे तुमचेच.","gu":"આ દશકમાં શુભ અને કસોટી કરનારાં વર્ષો ભળેલાં છે — દરેક જીવનમાં હોય છે તેમ જ. તેજસ્વી વર્ષોમાં હિંમતથી આગળ વધો, કસોટીનાં વર્ષોમાં ધીરજ અને પરિહારો પર ભરોસો રાખો. જ્યોતિષ રસ્તો બતાવે છે; ચાલવાનું તમારે જ.","as":"এই দশকত শুভ আৰু পৰীক্ষা লোৱা বছৰ মিহলি হৈ আছে — প্ৰতিটো জীৱনতে যেনেকৈ থাকে। উজ্জ্বল বছৰত সাহসেৰে আগবাঢ়ক, পৰীক্ষাৰ বছৰত ধৈৰ্য আৰু প্ৰতিকাৰৰ ওপৰত ভাৰসা ৰাখক। জ্যোতিষে বাট দেখুৱায়; খোজ কাঢ়িব লাগে আপুনিয়েই।"},"yearRange":{"en":"A forecast cannot begin in a past year. Please choose the current year or later.","hi":"भविष्यफल बीते हुए साल से शुरू नहीं हो सकता। कृपया मौजूदा साल या उसके बाद का साल चुनें।","te":"భవిష్యఫలం గడిచిన సంవత్సరం నుండి మొదలవదు. దయచేసి ప్రస్తుత సంవత్సరం లేదా తర్వాతిది ఎంచుకోండి.","kn":"ಭವಿಷ್ಯಫಲ ಕಳೆದ ವರ್ಷದಿಂದ ಆರಂಭವಾಗುವುದಿಲ್ಲ. ದಯವಿಟ್ಟು ಪ್ರಸ್ತುತ ವರ್ಷ ಅಥವಾ ನಂತರದ್ದನ್ನು ಆರಿಸಿ.","ta":"கடந்த ஆண்டிலிருந்து பலன் தொடங்க முடியாது. நடப்பு ஆண்டு அல்லது அதற்குப் பிறகான ஆண்டைத் தேர்ந்தெடுங்கள்.","bn":"গত বছর থেকে ভবিষ্যদ্বাণী শুরু হতে পারে না। চলতি বছর বা তার পরের কোনো বছর বেছে নিন।","mr":"गेल्या वर्षापासून भविष्य सुरू होऊ शकत नाही. कृपया चालू वर्ष किंवा त्यानंतरचे वर्ष निवडा.","gu":"ગયા વર્ષથી ભવિષ્ય શરૂ થઈ શકતું નથી. કૃપા કરીને ચાલુ વર્ષ કે તે પછીનું વર્ષ પસંદ કરો.","as":"যোৱা বছৰৰ পৰা ভৱিষ্যত আৰম্ভ হ'ব নোৱাৰে। অনুগ্ৰহ কৰি চলিত বছৰ বা তাৰ পিছৰ বছৰ বাছনি কৰক।"}},"annual":{"turningAge":{"en":"Turning age","hi":"आयु","te":"వయసు","kn":"ವಯಸ್ಸು","ta":"நிறைவடையும் வயது","bn":"যে বয়সে পা দিচ্ছেন","mr":"पूर्ण होणारे वय","gu":"પૂરું થતું વય","as":"সম্পূৰ্ণ হোৱা বয়স"},"confirmVarsha":{"en":"Varshaphal (check AM/PM)","hi":"का वर्षफल बनाएँ (AM/PM जाँचें)","te":"వర్షఫలం తయారు చేయండి (AM/PM చూడండి)","kn":"ವರ್ಷಫಲ ತಯಾರಿಸಿ (AM/PM ಪರಿಶೀಲಿಸಿ)","ta":"வர்ஷபலன் (AM/PM ச ಪ್ರದಾಯದ ಮಂತ್ರ. ಗುರುವಾರದಿಂದ ಆರಂಭಿಸಿ ನಿತ್ಯ ಜಪ ಮತ್ತು ಬಾಲ ಗೋಪಾಲನ ಸೇವೆ ಶುಭ ಎಂದು ನಂಬಲಾಗಿದೆ.","ta":"குழந்தை பாக்கியத்திற்கான பாரம்பரிய மந்திரம். வியாழக்கிழமை தொடங்கி, தினமும் ஜபமும் பால கோபாலனை வழிபடுவதும் சுபமாகக் கருதப்படுகிறது.","bn":"সন্তানলাভের আশীর্বাদের জন্য প্রচলিত মন্ত্র। বৃহস্পতিবার থেকে শুরু করে প্রতিদিন জপ আর বাল গোপালের পূজা শুভ বলে মানা হয়।","mr":"संततीच्या आशीर्वादासाठी प्रचलित मंत्र. गुरुवारपासून सुरुवात करून रोज जप आणि बाळकृष्णाची पूजा शुभ मानली जाते.","gu":"સંતાનના આશીર્વાદ માટે પ્રચલિત મંત્ર. ગુરુવારથી શરૂ કરીને રોજ જપ અને બાળકૃષ્ણની પૂજા શુભ મનાય છે.","as":"সন্তানৰ আশীৰ্বাদৰ বাবে প্ৰচলিত মন্ত্ৰ। বৃহস্পতিবাৰৰ পৰা আৰম্ভ কৰি দৈনিক জপ আৰু বালকৃষ্ণৰ পূজা শুভ বুলি ধৰা হয়।"}},"muReason":{"auspNak":{"en":"Auspicious nakshatra","hi":"शुभ नक्षत्र","te":"శుభ నక్షత్రం","kn":"ಶುಭ ನಕ್ಷತ್ರ","ta":"சுப நட்சத்திரம்","bn":"শুভ নক্ষত্র","mr":"शुभ नक्षत्र","gu":"શુભ નક્ષત્ર","as":"শুভ নক্ষত্ৰ"},"auspTithi":{"en":"Auspicious tithi","hi":"शुभ तिथि","te":"శుభ తిథి","kn":"ಶುಭ ತಿಥಿ","ta":"சுப திதி","bn":"শুভ তিথি","mr":"शुभ तिथी","gu":"શુભ તિથિ","as":"শুভ তিথি"},"favWeekday":{"en":"Favourable weekday","hi":"शुभ वार","te":"అనుకూల వారం","kn":"ಅನುಕೂಲ ವಾರ","ta":"சாதகமான வாரம்","bn":"অনুকূল বার","mr":"अनुकूल वार","gu":"અનુકૂળ વાર","as":"অনুকূল বাৰ"},"strongTara":{"en":"Strong Tarabalam for you","hi":"आपके लिए प्रबल ताराबल","te":"మీకు బలమైన తారాబలం","kn":"ನಿಮಗೆ ಬಲವಾದ ತಾರಾಬಲ","ta":"உங்களுக்கு பலமான தாராபலம்","bn":"আপনার জন্য তারাবল শক্তিশালী","mr":"तुमच्यासाठी ताराबल मजबूत","gu":"તમારા માટે તારાબળ મજબૂત","as":"আপোনাৰ বাবে তাৰাবল শক্তিশালী"},"strongChandra":{"en":"Strong Chandrabalam for you","hi":"आपके लिए प्रबल चंद्रबल","te":"మీకు బలమైన చంద్రబలం","kn":"ನಿಮಗೆ ಬಲವಾದ ಚಂದ್ರಬಲ","ta":"உங்களுக்கு பலமான சந்திரபலம்","bn":"আপনার জন্য চন্দ্রবল শক্তিশালী","mr":"तुमच्यासाठी चंद्रबल मजबूत","gu":"તમારા માટે ચંદ્રબળ મજબૂત","as":"আপোনাৰ বাবে চন্দ্ৰবল শক্তিশালী"},"avoidTithi":{"en":"Avoid tithi","hi":"वर्ज्य तिथि","te":"వర్జ్య తిథి","kn":"ವರ್ಜ್ಯ ತಿಥಿ","ta":"தவிர்க்க வேண்டிய திதி","bn":"এই তিথি এড়িয় a":["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"],"bn":["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"],"mr":["जानेवारी","फेब्रुवारी","मार्च","एप्रिल","मे","जून","जुलै","ऑगस्ट","सप्टेंबर","ऑक्टोबर","नोव्हेंबर","डिसेंबर"],"gu":["જાન્યુઆરી","ફેબ્રુઆરી","માર્ચ","એપ્રિલ","મે","જૂન","જુલાઈ","ઑગસ્ટ","સપ્ટેમ્બર","ઑક્ટોબર","નવેમ્બર","ડિસેમ્બર"],"as":["জানুৱাৰী","ফেব্ৰুৱাৰী","মাৰ্চ","এপ্ৰিল","মে","জুন","জুলাই","আগষ্ট","ছেপ্টেম্বৰ","অক্টোবৰ","নৱেম্বৰ","ডিচেম্বৰ"]},"kundli":{"k001":{"en":"CHAPTER","hi":"अध्याय","te":"అధ్యాయం","kn":"ಅಧ್ಯಾಯ","ta":"அத்தியாயம்","bn":"অধ্যায়","mr":"अध्याय","gu":"પ્રકરણ","as":"অধ্যায়"},"k002":{"en":"Your Spiritual Snapshot","hi":"आपका आध्यात्मिक दर्पण","te":"మీ ఆధ్యాత్మిక చిత్రం","kn":"ನಿಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಚಿತ್ರ","ta":"உங்கள் ஆன்மிகச் சித்திரம்","bn":"আপনার আধ্যাত্মিক পরিচয়","mr":"तुमचे आध्यात्मिक चित्र","gu":"તમારું આધ્યાત્મિક ચિત્ર","as":"আপোনাৰ আধ্যাত্মিক ছবি"},"k003":{"en":"The essence of your chart at a glance — every rating below is derived from your actual planetary dignities, house strengths (Ashtakavarga) and yogas. Nothing is invented.","hi":"आपकी कुंडली से गणना से निकाला गया सार — हर अंक ग्रह-गरिमा, भाव-बल और योगों से व्युत्पन्न है।","te":"మీ జాతకం సారాంశం ఒక్క చూపులో — కింద ఇచ్చిన ప్రతి రేటింగూ మీ అసలు గ్రహ స్థితులు, భావ బలాలు (అష్టకవర్గం), యోగాల ఆధారంగా వచ్చినది. ఏదీ ఊహించి రాసినది కాదు.","kn":"ನಿಮ್ಮ ಜಾತಕದ ಸಾರಾಂಶ ಒಂದೇ ನೋಟದಲ್ಲಿ — ಕೆಳಗಿನ ಪ್ರತಿ ರೇಟಿಂಗ್ ಕೂಡ ನಿಮ್ಮ ನಿಜವಾದ ಗ್ರಹ ಸ್ಥಿತಿಗಳು, ಭಾವ ಬಲಗಳು (ಅಷ್ಟಕವರ್ಗ), ಯೋಗಗಳ ಆಧಾರದ ಮೇಲೆ ಬಂದಿದೆ. ಯಾವುದೂ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ.","ta":"உங்கள் ஜாதகத்தின் சாரம் ஒரே பார்வையில் — கீழே உள்ள ஒவ்வொரு மதிப்பீடும் உங்கள் உண்மையான கிரக நிலைகள், பாவ பலங்கள் (அஷ்டகவர்க்கம்), யோகங்களின் அடிப்படையில் வந்தது. எதுவும் கற்பனையானது அல்ல.","bn":"এক নজরে আপনার কোষ্ঠীর সারকথা — নিচের প্রতিটি মূল্যায়ন এসেছে আপনার প্রকৃত গ্রহবল, ভাববল (অষ্টকবর্গ) আর যোগ থেকে। কিছুই কল্পনা করে লেখা নয়।","mr":"एका दृष्टिक्षेपात तुमच्या पत्रिकेचे सार — खालील प्रत्येक मूल्यमापन तुमच्या प्रत्यक्ष ग्रहस्थिती, भावबल (अष्टकवर्ग) आणि योगांवर आधारित आहे. काहीही काल्पनिक नाही.","gu":"એક નજરમાં તમારી કુંડળીનો સાર — નીચેનું દરેક મૂલ્યાંકન તમારી વાસ્તવિક ગ્રહસ્થિતિ, ભાવબળ (અષ્ટકવર્ગ) અને યોગો પર આધારિત છે. કશું કાલ્પનિક નથી.","as":"এক নজৰত আপোনাৰ কুণ্ডলীৰ সাৰ — তলৰ প্ৰতিটো মূল্যায়ন আপোনাৰ প্ৰকৃত গ্ৰহস্থিতি, ভাৱবল (অষ্টকবৰ্গ) আৰু যোগৰ ওপৰত আধাৰিত। একোৱেই কল্পনা নহয়।"},"k004":{"en":"YOUR STRONGEST QUALITIES","hi":"आपकी प्रबल शक्तियाँ","te":"మీ బలమైన లక్షణాలు","kn":"ನಿಮ್ಮ ಪ್ರಬಲ ಗುಣಗಳು","ta":"உங்கள் பலமான குணங்கள்","bn":"আপনার সবচেয়ে শক্তিশালী গুণ","mr":"तुमचे सर्वात बलवान गुण","gu":"તમારા સૌથી બળવાન ગુણ","as":"আপোনাৰ আটাইতকৈ বলৱান গুণ"},"k005":{"en":"CURRENT LIFE PHASE","hi":"वर्तमान जीवन-चरण","te":"ప్రస్తుత జీవిత దశ","kn":"ಪ್ರಸ್ತುತ ಜೀವನ ಹಂತ","ta":"தற்போதைய வாழ்க்கை நிலை","bn":"বর্তমান জীবনদশা","mr":"सध्याचा जीवनकाळ","gu":"હાલનો જીવનકાળ","as":"বৰ্তমানৰ জীৱনকাল"},"k006":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ","ta":"மகாதசை","bn":"মহাদশা","mr":"महादशा","gu":"મહાદશા","as":"মহাদশা"},"k007":{"en":"Antar","hi":"अंतर","te":"అంతర్దశ","kn":"ಅಂತರ್ದಶಾ","ta":"அந்தர்தசை","bn":"অন্তর্দশা","mr":"अंतर्दशा","gu":"અંતર્દશા","as":"অন্তৰ্দশা"},"k008":{"en":"OVERALL LIFE ENERGY","hi":"समग्र जीवन-ऊर्जा","te":"మొత్తం జీవన శక్తి","kn":"ಒಟ್ಟು ಜೀವನ ಶಕ್ತಿ","ta":"ஒட்டுமொத்த வாழ்க்கை சக்தி","bn":"সামগ্রিক জীবনশক্তি","mr":"एकूण जीवनशक्ती","gu":"કુલ જીવનશક્તિ","as":"সামগ্ৰিক জীৱনশক্তি"},"k009":{"en":"Formula: Ashtakavarga strength of your 1st, 9th and 10th houses + auspicious yogas + planetary dignities — every input verifiable in the chapters ahead.","hi":"सूत्र: लग्न-भाग्य-कर्म भावों का अष्टकवर्ग बल + शुभ योग","te":"సూత్రం: మీ 1వ, 9వ, 10వ భావాల అష్టకవర్గ బలం + శుభ యోగాలు + గ్రహ స్థితులు — ప్రతి అంశాన్నీ ముందున్న అధ్యాయాల్లో సరిచూసుకోవచ్చు.","kn":"ಸೂತ್ರ: ನಿಮ್ಮ 1, 9, 10ನೇ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಶುಭ ಯೋಗಗಳು + ಗ್ರಹ ಸ್ಥಿತಿಗಳು — ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು.","ta":"சூத்திரம்: உங்கள் 1, 9, 10ஆம் பாவங்களின் அஷ்டகவர்க்க பலம் + சுப யோகங்கள் + கிரக நிலைகள் — ஒவ்வொரு அம்சத்தையும் அடுத்த அத்தியாயங்களில் சரிபார்த்துக் கொள்ளலாம்.","bn":"সূত্র: আপনার 1, 9 ও 10 নম্বর ভাবের অষ্টকবর্গ বল + শুভ যোগ + গ্রহবল — প্রতিটি উপাদান পরের অধ্যায়গুলিতে মিলিয়ে দেখা যায়।","mr":"सूत्र: तुमच्या 1, 9 आणि 10 व्या भावांचे अष्टकवर्ग बल + शुभ योग + ग्रहस्थिती — प्रत्येक घटक पुढील अध्यायांत तपासून पाहता येतो.","gu":"સૂત્ર: તમારા 1, 9 અને 10મા ભાવોનું અષ્ટકવર્ગ બળ + શુભ યોગ + ગ્રહસ્થિતિ — દરેક ઘટક આગળનાં પ્રકરણોમાં તપાસી શકાય છે.","as":"সূত্ৰ: আপোনাৰ 1, 9 আৰু 10 নং ভাৱৰ অষ্টকবৰ্গ বল + শুভ যোগ + গ্ৰহস্থিতি — প্ৰতিটো উপাদান পিছৰ অধ্যায়সমূহত চাব পাৰি।"},"k010":{"en":"Career","hi":"करियर","te":"కెరీర్","kn":"ಕೆರಿಯರ್","ta":"தொழில்","bn":"কর্মজীবন","mr":"करिअर","gu":"કરિયર","as":"কেৰিয়াৰ"},"k011":{"en":"Marriage & Love","hi":"विवाह व संबंध","te":"వివాహం, ప్రేమ","kn":"ಮದುವೆ, ಪ್ರೀತಿ","ta":"திருமணம், அன்பு","bn":"বিয়ে ও ভালোবাসা","mr":"विवाह आणि प्रेम","gu":"વિવાહ અને પ્રેમ","as":"বিবাহ আৰু প্ৰেম"},"k012":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು","ta":"செல்வம்","bn":"সম্পদ","mr":"संपत्ती","gu":"સંપત્તિ","as":"সম্পত্তি"},"k013":{"en":"Health & Vitality","hi":"स्वास्थ्य","te":"ఆరోగ్యం, శక్తి","kn":"ಆರೋಗ್ಯ, ಶಕ್ತಿ","ta":"ஆரோக்கியம், சக்தி","bn":"স্বাস্থ্য ও শক্তি","mr":"आरोग्य आणि शक्ती","gu":"આરોગ્ય અને શક્તિ","as":"স্বাস্থ্য আৰু শক্তি"},"k014":{"en":"Learning & Children","hi":"विद्या-संतान","te":"విద్య, సంతానం","kn":"ವಿದ್ಯೆ, ಮಕ್ಕಳು","ta":"கல்வி, குழந்தைகள்","bn":"শিক্ষা ও সন্তান","mr":"शिक्षण आणि संतती","gu":"શિક્ષણ અને સંતાન","as":"শিক্ষা আৰু সন্তান"},"k015":{"en":"Spiritual Growth","hi":"आध्यात्म","te":"ఆధ్యాత్మిక ఎదుగుదల","kn":"ಆಧ್ಯಾತ್ಮಿಕ ಬೆಳವಣಿಗೆ","ta":"ஆன்மிக வளர்ச்சி","bn":"আধ্যাত্মিক উন্নতি","mr":"आध्यात्मिक वाढ","gu":"આધ્યાત્મિક વિકાસ","as":"আধ্যাত্মিক বিকাশ"},"k016":{"en":"Your Life Dashboard","hi":"जीवन डैशबोर्ड","te":"మీ జీవిత డాష్‌బోర్డ్","kn":"ನಿಮ್ಮ ಜೀವನ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್","ta":"உங்கள் வாழ்க்கை பார்வை","bn":"আপনার জীবনের সারচিত্র","mr":"तुमच्या आयुष्याचा आढावा","gu":"તમારા જીવનનો સારાંશ","as":"আপোনাৰ জীৱনৰ চমু চিত্ৰ"},"k017":{"en":"Each score = Ashtakavarga strength of the relevant houses + house-lord dignity + karaka planet condition. Every input is verifiable in the tables that follow — no score is invented.","hi":"प्रत्येक अंक = संबंधित भावों का अष्टकवर्ग बल + भावेश गरिमा + कारक ग्रह स्थिति — सभी आंकड़े आगे की सारणियों में सत्यापन-योग्य।","te":"ప్రతి స్కోరు = సంబంధిత భావాల అష్టకవర్గ బలం + భావాధిపతి స్థితి + కారక గ్రహ స్థితి. ప్రతి అంశాన్నీ తర్వాతి పట్టికల్లో సరిచూసుకోవచ్చు — ఏ స్కోరూ ఊహించి రాసినది కాదు.","kn":"ಪ್ರತಿ ಸ್ಕೋರ್ = ಸಂಬಂಧಿತ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಭಾವಾಧಿಪತಿಯ ಸ್ಥಿತಿ + ಕಾರಕ ಗ್ರಹದ ಸ್ಥಿತಿ. ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಕೋಷ್ಟಕಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು — ಯಾವ ಸ್ಕೋರ್ ಕೂಡ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ.","ta":"ஒவ்வொரு மதிப்பெண்ணும் = சம்பந்தப்பட்ட பாவங்களின் அஷ்டகவர்க்க பலம் + பாவாதிபதி நிலை + காரக கிரக நிலை. ஒவ்வொரு அம்சத்தையும் அடுத்து வரும் அட்டவணைகளில் சரிபார்த்துக் கொள்ளலாம் — எந்த மதிப்பெண்ணும் கற்பனையானது அல்ல.","bn":"প্রতিটি স্কোর = সংশ্লিষ্ট ভাবের অষ্টকবর্গ বল + ভাবাধিপতির অবস্থা + কারক গ্রহের অবস্থা। প্রতিটি উপাদান পরের সারণিগুলিতে মিলিয়ে দেখা যায় — কোনো স্কোরই বানানো নয়।","mr":"प्रत्येक गुण = संबंधित भावांचे अष्टकवर्ग बल + भावाधिपतीची स्थिती + कारक ग्रहाची स्थिती. प्रत्येक घटक पुढील तक्त्यांत तपासता येतो — कोणताही गुण काल्पनिक नाही.","gu":"દરેક ગુણ = સંબંધિત ભાવોનું અષ્ટકવર્ગ બળ + ભાવાધિપતિની સ્થિતિ + કારક ગ્રહની સ્થિતિ. દરેક ઘટક આગળનાં કોષ્ટકોમાં તપાસી શકાય છે — કોઈ ગુણ કાલ્પનિક નથી.","as":"প্ৰতিটো গুণ = সম্পৰ্কিত ভাৱৰ অষ্টকবৰ্গ বল + ভাৱাধিপতিৰ স্থিতি + কাৰক গ্ৰহৰ স্থিতি। প্ৰতিটো উপাদান পিছৰ তালিকাসমূহত চাব পাৰি — কোনো গুণেই কল্পনা নহয়।"},"k018":{"en":"Table of Contents","hi":"विषय-सूची","te":"విషయ సూచిక","kn":"ಪರಿವಿಡಿ","ta":"பொருளடக்கம்","bn":"সূচিপত্র","mr":"अनुक्रमणिका","gu":"અનુક્રમણિકા","as":"সূচীপত্ৰ"},"k019":{"en":"Graha","hi":"ग्रह","te":"గ్రహం","kn":"ಗ್ರಹ","ta":"கிரகம்","bn":"গ্রহ","mr":"ग्रह","gu":"ગ્રહ","as":"গ্ৰহ"},"k020":{"en":"Nakshatra","hi":"नक्षत्र","te":"నక్షత్రం","kn":"ನಕ್ಷತ್ರ","ta":"நட்சத்திரம்","bn":"নক্ষত্র","mr":"नक्षत्र","gu":"નક્ષત્ર","as":"নক্ষত্ৰ"},"k021":{"en":"Retro","hi":"वक्री","te":"వక్రం","kn":"ವಕ್ರ","ta":"வக்ரம்","bn":"বক্রী","mr":"वक्री","gu":"વક્રી","as":"বক্ৰী"},"k022":{"en":"Combust","hi":"अस्त","te":"అస్తం","kn":"ಅಸ್ತ","ta":"அஸ்தம்","bn":"অস্ত","mr":"अस्त","gu":"અસ્ત","as":"অস্ত"},"k023":{"en":"Houses scoring 30+ are your power zones; those below 22 reward conscious effort. (Grand total 337 — the classical checksum.)","hi":"30+ बिंदु वाले भाव जीवन के प्रबल क्षेत्र हैं; 22 से कम वाले भावों में सचेत प्रयास फलदायी होता है। (कुल 337 — शास्त्रीय मानक)","te":"30కి పైగా బిందువులున్న భావాలు మీ బలమైన రంగాలు; 22 కంటే తక్కువ ఉన్నవి శ్రద్ధతో కృషి చేస్తే ఫలిస్తాయి. (మొత్తం 337 — శాస్త్రీయ లెక్క.)","kn":"30ಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಿಂದುಗಳಿರುವ ಭಾವಗಳು ನಿಮ್ಮ ಬಲದ ಕ್ಷೇತ್ರಗಳು; 22ಕ್ಕಿಂತ ಕಡಿಮೆ ಇರುವವು ಶ್ರದ್ಧೆಯಿಂದ ಶ್ರಮಿಸಿದರೆ ಫಲ ಕೊಡುತ್ತವೆ. (ಒಟ್ಟು 337 — ಶಾಸ್ತ್ರೀಯ ಲೆಕ್ಕ.)","ta":"30க்கு மேல் பிந்துக்கள் உள்ள பாவங்கள் உங்கள் பலமான பகுதிகள்; 22க்கும் குறைவானவை கவனமான முயற்சியால் பலன் தரும். (மொத்தம் 337 — சாஸ்திரக் கணக்கு.)","bn":"30-এর বেশি বিন্দুযুক্ত ভাবগুলিই আপনার শক্তির জায়গা; 22-এর নিচে যেগুলি, সেখানে সচেতন চেষ্টা ফল দেয়। (মোট 337 — শাস্ত্রীয় হিসাব।)","mr":"30 पेक्षा जास्त बिंदू असलेले भाव तुमची बलस्थाने; 22 पेक्षा कमी असलेल्यांना जाणीवपूर्वक प्रयत्न लागतात. (एकूण 337 — शास्त्रीय हिशेब.)","gu":"30થી વધુ બિંદુ ધરાવતા ભાવ તમારાં બળસ્થાન; 22થી ઓછા ધરાવતાને સભાન પ્રયત્ન જોઈએ. (કુલ 337 — શાસ્ત્રીય ગણતરી.)","as":"30ৰ অধিক বিন্দু থকা ভাৱ আপোনাৰ বলস্থান; 22তকৈ কম থকাবোৰে সচেতন প্ৰচেষ্টা বিচাৰে। (মুঠ 337 — শাস্ত্ৰীয় হিচাপ।)"},"k024":{"en":"House ","hi":"भाव ","te":"భావం ","kn":"ಭಾವ ","ta":"பாவம் ","bn":"ভাব ","mr":"भाव ","gu":"ભાવ ","as":"ভাৱ "},"k025":{"en":"bindus","hi":"बिंदु","te":"బిందువులు","kn":"ಬಿಂದುಗಳು","ta":"பிந்துக்கள்","bn":"বিন্দু","mr":"बिंदू","gu":"બિંદુ","as":"বিন্দু"},"k026":{"en":"House-Strength Reading (Sarvashtakavarga)","hi":"भाव-बल विवेचन (सर्वाष्टकवर्ग)","te":"భావ బల విశ్లేషణ (సర్వాష్టకవర్గం)","kn":"ಭಾವ ಬಲ ವಿಶ್ಲೇಷಣೆ (ಸರ್ವಾಷ್ಟಕವರ್ಗ)","ta":"பாவ பல ஆய்வு (சர்வாஷ்டகவர்க்கம்)","bn":"ভাববল বিশ্লেষণ (সর্বাষ্টকবর্গ)","mr":"भावबल विश्लेषण (सर्वाष्टकवर्ग)","gu":"ભાવબળ વિશ્લેષણ (સર્વાષ્ટકવર્ગ)","as":"ভাৱবল বিশ্লেষণ (সৰ্বাষ্টকবৰ্গ)"},"k027":{"en":"Retrograde","hi":"वक्री","te":"వక్ర గతి","kn":"ವಕ್ರ ಗತಿ","ta":"வக்ர கதி","bn":"বক্রগতি","mr":"वक्री गती","gu":"વક્રી ગતિ","as":"বক্ৰী গতি"},"k028":{"en":"Combust","hi":"अस्त","te":"అస్తంగతం","kn":"ಅಸ್ತಂಗತ","ta":"அஸ்தங்கதம்","bn":"অস্তগত","mr":"अस्तंगत","gu":"અસ્તંગત","as":"অস্তংগত"},"k029":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव","gu":"ભાવ","as":"ভাৱ"},"k030":{"en":"Planet Strength Cards","hi":"ग्रह-शक्ति कार्ड","te":"గ్రహ బల కార్డులు","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು","ta":"கிரக பல அட்டைகள்","bn":"গ্রহবল কার্ড","mr":"ग्रहबल कार्ड","gu":"ગ્રહબળ કાર્ડ","as":"গ্ৰহবল কাৰ্ড"},"k031":{"en":"Star ratings derived from dignity + Ashtakavarga + combustion state.","hi":"तारांकन = गरिमा + अष्टकवर्ग + अस्त/वक्री स्थिति से","te":"స్థితి + అష్టకవర్గం + అస్తంగత స్థితి ఆధారంగా ఇచ్చిన నక్షత్ర రేటింగ్‌లు.","kn":"ಸ್ಥಿತಿ + ಅಷ್ಟಕವರ್ಗ + ಅಸ್ತಂಗತ ಸ್ಥಿತಿಯ ಆಧಾರದ ಮೇಲೆ ನೀಡಿದ ನಕ್ಷತ್ರ ರೇಟಿಂಗ್‌ಗಳು.","ta":"நிலை + அஷ்டகவர்க்கம் + அஸ்தங்கத நிலையின் அடிப்படையில் தரப்பட்ட நட்சத்திர மதிப்பீடுகள்.","bn":"গ্রহবল, অষ্টকবর্গ ও অস্ত অবস্থা থেকে পাওয়া তারকা রেটিং।","mr":"स्थिती, अष्टकवर्ग आणि अस्तंगत स्थितीवरून दिलेली तारांकित मूल्यमापने.","gu":"સ્થિતિ, અષ્ટકવર્ગ અને અસ્તંગત સ્થિતિ પરથી આપેલાં તારાંકિત મૂલ્યાંકનો.","as":"স্থিতি, অষ্টকবৰ্গ আৰু অস্তংগত অৱস্থাৰ ওপৰত আধাৰিত তৰাচিহ্নিত মূল্যায়ন।"},"k032":{"en":"Planet Strength Cards (contd.)","hi":"ग्रह-शक्ति कार्ड (क्रमशः)","te":"గ్రహ బల కార్డులు (కొనసాగింపు)","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು (ಮುಂದುವರಿಕೆ)","ta":"கிரக பல அட்டைகள் (தொடர்ச்சி)","bn":"গ্রহবল কার্ড (চলছে)","mr":"ग्रहबल कार्ड (पुढे चालू)","gu":"ગ્રહબળ કાર્ડ (ચાલુ)","as":"গ্ৰহবল কাৰ্ড (আগবাঢ়িছে)"},"k033":{"en":"no planets","hi":"कोई ग्रह नहीं","te":"గ్రహాలు లేవు","kn":"ಗ್ರಹಗಳಿಲ್ಲ","ta":"கிரகங்கள் இல்லை","bn":"কোনো গ্রহ নেই","mr":"ग्रह नाहीत","gu":"ગ્રહ નથી","as":"গ্ৰহ নাই"},"k034":{"en":"Lord","hi":"भावेश","te":"అధిపతి","kn":"ಅಧಿಪತಿ","ta":"அதிபதி","bn":"অধিপতি","mr":"अधिपती","gu":"અધિપતિ","as":"অধিপতি"},"k035":{"en":"house","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव","gu":"ભાવ","as":"ভাৱ"},"k036":{"en":"Occupants","hi":"स्थित ग्रह","te":"ఉన్న గ్రహాలు","kn":"ಇರುವ ಗ್ರಹಗಳು","ta":"உள்ள கிரகங்கள்","bn":"অবস্থানকারী গ্রহ","mr":"असलेले ग्रह","gu":"રહેલા ગ્રહ","as":"থকা গ্ৰহ"},"k037":{"en":"The Twelve Bhavas — Domains of Life","hi":"द्वादश भाव — जीवन के बारह क्षेत्र","te":"పన్నెండు భావాలు — జీవిత రంగాలు","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು — ಜೀವನದ ಕ್ಷೇತ್ರಗಳು","ta":"பன்னிரண்டு பாவங்கள் — வாழ்க்கைப் பகுதிகள்","bn":"দ্বাদশ ভাব — জীবনের ক্ষেত্রসমূহ","mr":"बारा भाव — आयुष्याची क्षेत्रे","gu":"બાર ભાવ — જીવનનાં ક્ષેત્રો","as":"বাৰটা ভাৱ — জীৱনৰ ক্ষেত্ৰসমূহ"},"k038":{"en":"Twelve Bhavas (contd.)","hi":"द्वादश भाव (क्रमशः)","te":"పన్నెండు భావాలు (కొనసాగింపు)","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು (ಮುಂದುವರಿಕೆ)","ta":"பன்னிரண்டு பாவங்கள் (தொடர்ச்சி)","bn":"দ্বাদশ ভাব (চলছে)","mr":"बारा भाव (पुढे चालू)","gu":"બાર ભાવ (ચાલુ)","as":"বাৰটা ভাৱ (আগবাঢ়িছে)"},"k039":{"en":"Ancient Note","hi":"प्राचीन संकेत","te":"ప్రాచీన విశేషం","kn":"ಪ್ರಾಚೀನ ವಿಶೇಷ","ta":"பாரம்பரியக் குறிப்பு","bn":"শাস্ত্রীয় টীকা","mr":"पारंपरिक टीप","gu":"પરંપરાગત નોંધ","as":"পৰম্পৰাগত টোকা"},"k040":{"en":"The Sarvashtakavarga of every chart always totals exactly 337 bindus — verified in your own tables here; count them yourself!","hi":"अष्टकवर्ग का सर्वयोग सदा 337 बिंदु होता है — यह आपकी रिपोर्ट में भी सत्यापित है, गिनकर देख सकते हैं!","te":"ఏ జాతకంలోనైనా సర్వాష్టకవర్గం మొత్తం సరిగ్గా 337 బిందువులే — మీ పట్టికల్లోనే సరిచూసుకోవచ్చు; మీరే లెక్కించి చూడండి!","kn":"ಯಾವುದೇ ಜಾತಕದಲ್ಲೂ ಸರ್ವಾಷ್ಟಕವರ್ಗದ ಒಟ್ಟು ನಿಖರವಾಗಿ 337 ಬಿಂದುಗಳೇ — ನಿಮ್ಮ ಕೋಷ್ಟಕಗಳಲ್ಲೇ ಪರಿಶೀಲಿಸಬಹುದು; ನೀವೇ ಲೆಕ್ಕ ಹಾಕಿ ನೋಡಿ!","ta":"எந்த ஜாதகத்திலும் சர்வாஷ்டகவர்க்கம் மொத்தம் சரியாக 337 பிந்துக்களே — உங்கள் அட்டவணைகளிலேயே சரிபார்த்துக் கொள்ளலாம்; நீங்களே எண்ணிப் பாருங்கள்!","bn":"যেকোনো কোষ্ঠীর সর্বাষ্টকবর্গের মোট সবসময় ঠিক 337 বিন্দু — আপনার নিজের সারণিতেই মিলিয়ে দেখুন, নিজে গুনে দেখুন!","mr":"कोणत्याही पत्रिकेत सर्वाष्टकवर्गाची बेरीज नेमकी 337 बिंदूच येते — तुमच्याच तक्त्यांत तपासून पाहा; स्वतः मोजा!","gu":"કોઈ પણ કુંડળીમાં સર્વાષ્ટકવર્ગનો સરવાળો બરાબર 337 બિંદુ જ આવે છે — તમારાં જ કોષ્ટકોમાં તપાસી જુઓ; જાતે ગણો!","as":"যিকোনো কুণ্ডলীত সৰ্বাষ্টকবৰ্গৰ যোগফল ঠিক 337 বিন্দুয়েই হয় — আপোনাৰ নিজৰ তালিকাতেই চাই লওক; নিজে গণনা কৰক!"},"k041":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव","gu":"ભાવ","as":"ভাৱ"},"k042":{"en":"Graha Phala — House Placements","hi":"ग्रह फल — भाव स्थिति","te":"గ్రహ ఫలం — భావ స్థితులు","kn":"ಗ್ರಹ ಫಲ — ಭಾವ ಸ್ಥಿತಿಗಳು","ta":"கிரக பலன் — பாவ நிலைகள்","bn":"গ্রহফল — ভাবে অবস্থান","mr":"ग्रहफल — भावस्थिती","gu":"ગ્રહફળ — ભાવસ્થિતિ","as":"গ্ৰহফল — ভাৱস্থিতি"},"k043":{"en":"Graha Phala (contd.)","hi":"ग्रह फल (क्रमशः)","te":"గ్రహ ఫలం (కొనసాగింపు)","kn":"ಗ್ರಹ ಫಲ (ಮುಂದುವರಿಕೆ)","ta":"கிரக பலன் (தொடர்ச்சி)","bn":"গ্রহফল (চলছে)","mr":"ग्रहफल (पुढे चालू)","gu":"ગ્રહફળ (ચાલુ)","as":"গ্ৰহফল (আগবাঢ়িছে)"},"k044":{"en":"Did You Know?","hi":"क्या आप जानते हैं?","te":"మీకు తెలుసా?","kn":"ನಿಮಗೆ ಗೊತ್ತೇ?","ta":"உங்களுக்குத் தெரியுமா?","bn":"জানেন কি?","mr":"तुम्हाला माहीत आहे का?","gu":"તમને ખબર છે?","as":"আপুনি জানেনে?"},"k045":{"en":"In the Parashara tradition, Venus rules the longest mahadasha (20 years) and the Sun the shortest (6 years) — the full cycle spans exactly 120 years.","hi":"पराशर परंपरा में शुक्र की महादशा सबसे लंबी (20 वर्ष) और सूर्य की सबसे छोटी (6 वर्ष) होती है — पूरा चक्र ठीक 120 वर्ष का है।","te":"పరాశర సంప్రదాయంలో శుక్రుడికి అత్యధిక మహాదశ (20 సంవత్సరాలు), సూర్యుడికి అత్యల్పం (6 సంవత్సరాలు) — మొత్తం చక్రం సరిగ్గా 120 సంవత్సరాలు.","kn":"ಪರಾಶರ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಶುಕ್ರನಿಗೆ ಅತಿ ಹೆಚ್ಚು ಮಹಾದಶಾ (20 ವರ್ಷ), ಸೂರ್ಯನಿಗೆ ಅತಿ ಕಡಿಮೆ (6 ವರ್ಷ) — ಒಟ್ಟು ಚಕ್ರ ನಿಖರವಾಗಿ 120 ವರ್ಷ.","ta":"பராசர சம்பிரதாயத்தில் சுக்கிரனுக்கு மிக நீண்ட மகாதசை (20 ஆண்டுகள்), சூரியனுக்கு மிகக் குறைவு (6 ஆண்டுகள்) — முழு சுழற்சி சரியாக 120 ஆண்டுகள்.","bn":"পরাশর মতে শুক্রের মহাদশা সবচেয়ে দীর্ঘ (20 বছর), সূর্যের সবচেয়ে ছোট (6 বছর) — পুরো চক্র ঠিক 120 বছরের।","mr":"पराशर परंपरेत शुक्राची महादशा सर्वात मोठी (20 वर्षे) आणि सूर्याची सर्वात लहान (6 वर्षे) — पूर्ण चक्र नेमके 120 वर्षांचे.","gu":"પરાશર પરંપરામાં શુક્રની મહાદશા સૌથી લાંબી (20 વર્ષ) અને સૂર્યની સૌથી ટૂંકી (6 વર્ષ) — સંપૂર્ણ ચક્ર બરાબર 120 વર્ષનું.","as":"পৰাশৰ পৰম্পৰাত শুক্ৰৰ মহাদশা আটাইতকৈ দীঘল (20 বছৰ) আৰু সূৰ্যৰ আটাইতকৈ চুটি (6 বছৰ) — সম্পূৰ্ণ চক্ৰ ঠিক 120 বছৰৰ।"},"k046":{"en":"Marriage Matching, done properly","hi":"विवाह मिलान गहन विश्लेषण","te":"వివాహ మ్యాచింగ్ — సరైన పద్ధతిలో","kn":"ವಿವಾಹ ಹೊಂದಾಣಿಕೆ — ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ","ta":"திருமணப் பொருத்தம் — சரியான முறையில்","bn":"যোটক বিচার, সঠিক পদ্ধতিতে","mr":"गुण जुळवणी, योग्य पद्धतीने","gu":"વિવાહ મેળાપક, યોગ્ય રીતે","as":"বিবাহৰ গুণমিলন, শুদ্ধ পদ্ধতিৰে"},"k047":{"en":"Free tools stop at the Guna score. The paid Marriage Report adds classical dosha-CANCELLATION analysis, two-chart Manglik matching and marriage-timing windows — what no free tool checks.","hi":"निःशुल्क गुण-मिलान अंक देता है। सशुल्क विवाह रिपोर्ट दोष-परिहार नियम, दोनों कुंडलियों का मंगल-मिलान और विवाह-समय खिड़कियाँ जोड़ती है — जो कोई निःशुल्क टूल नहीं जाँचता।","te":"ఉచిత సాధనాలు గుణ స్కోరు దగ్గరే ఆగిపోతాయి. చెల్లింపు వివాహ రిపోర్ట్ శాస్త్రీయ దోష-పరిహార విశ్లేషణ, రెండు జాతకాల కుజ దోష పరిశీలన, వివాహ శుభ సమయాలు కూడా ఇస్తుంది — ఏ ఉచిత సాధనమూ చూడని అంశాలు.","kn":"ಉಚಿತ ಸಾಧನಗಳು ಗುಣ ಸ್ಕೋರ್‌ನಲ್ಲೇ ನಿಲ್ಲುತ್ತವೆ. ಪಾವತಿಸಿದ ವಿವಾಹ ವರದಿ ಶಾಸ್ತ್ರೀಯ ದೋಷ-ಪರಿಹಾರ ವಿಶ್ಲೇಷಣೆ, ಎರಡೂ ಜಾತಕಗಳ ಕುಜ ದೋಷ ಪರಿಶೀಲನೆ, ವಿವಾಹಕ್ಕೆ ಶುಭ ಸಮಯಗಳನ್ನೂ ಕೊಡುತ್ತದೆ — ಯಾವ ಉಚಿತ ಸಾಧನವೂ ನೋಡದ ಅಂಶಗಳು.","ta":"இலவச கருவிகள் குண மதிப்பெண்ணோடு நின்றுவிடுகின்றன. கட்டணத் திருமண அறிக்கை சாஸ்திரப்படி தோஷ-பரிகார ஆய்வு, இரு ஜாதக செவ்வாய் தோஷ பரிசீலனை, திருமணத்திற்கான சுப காலங்கள் ஆகியவற்றையும் தருகிறது — எந்த இலவச கருவியும் பார்க்காத அம்சங்கள்.","bn":"বিনামূল্যের টুল গুণ মিলনেই থেমে যায়। সবেতন বিবাহ রিপোর্টে থাকে শাস্ত্রীয় দোষ-খণ্ডন বিশ্লেষণ, দুই কোষ্ঠীর মঙ্গলদোষ বিচার আর বিয়ের শুভ সময় — যা কোনো বিনামূল্যের টুল দেখে না।","mr":"मोफत साधने गुण जुळवणीपाशीच थांबतात. सशुल्क विवाह अहवालात शास्त्रीय दोष-परिहार विश्लेषण, दोन्ही पत्रिकांचा मंगळ दोष विचार आणि विवाहासाठी शुभ काळ यांचाही समावेश आहे — जे कोणतेही मोफत साधन पाहत नाही.","gu":"મફત સાધનો ગુણ મેળાપક પર જ અટકે છે. સશુલ્ક વિવાહ અહેવાલમાં શાસ્ત્રીય દોષ-પરિહાર વિશ્લેષણ, બંને કુંડળીઓનો મંગળ દોષ વિચાર અને વિવાહ માટે શુભ સમય પણ સામેલ છે — જે કોઈ મફત સાધન જોતું નથી.","as":"বিনামূলীয়া সঁজুলিবোৰ গুণমিলনতে ৰৈ যায়। সবেতন বিবাহ প্ৰতিবেদনত থাকে শাস্ত্ৰীয় দোষ-খণ্ডন বিশ্লেষণ, দুয়োখন কুণ্ডলীৰ মঙ্গল দোষ বিচাৰ আৰু বিবাহৰ শুভ সময় — যিবোৰ কোনো বিনামূলীয়া সঁজুলিয়ে নাচায়।"},"k048":{"en":"Classical significance","hi":"शास्त्रीय महत्त्व","te":"శాస్త్రీయ ప్రాముఖ్యత","kn":"ಶಾಸ್ತ್ರೀಯ ಮಹತ್ವ","ta":"சாஸ்திர முக்கியத்துவம்","bn":"শাস্ত্রীয় গুরুত্ব","mr":"शास्त्रीय महत्त्व","gu":"શાસ્ત્રીય મહત્ત્વ","as":"শাস্ত্ৰীয় গুৰুত্ব"},"k049":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ","ta":"செவ்வாய் தோஷம்","bn":"মঙ্গলদোষ","mr":"मंगळ दोष","gu":"મંગળ દોષ","as":"মঙ্গল দোষ"},"k050":{"en":"Kaal Sarpa","hi":"कालसर्प","te":"కాల సర్ప","kn":"ಕಾಲ ಸರ್ಪ","ta":"கால சர்ப்பம்","bn":"কালসর্প","mr":"कालसर्प","gu":"કાલસર્પ","as":"কালসৰ্প"},"k051":{"en":"Sade Sati","hi":"साढ़े साती","te":"సాడే సాతి","kn":"ಸಾಡೇ ಸಾತಿ","ta":"ஏழரைச் சனி","bn":"সাড়েসাতি","mr":"साडेसाती","gu":"સાડાસાતી","as":"সাদে সতী"},"k052":{"en":"Phase","hi":"चरण","te":"దశ","kn":"ದಶಾ","ta":"நிலை","bn":"পর্যায়","mr":"टप्पा","gu":"તબક્કો","as":"পৰ্যায়"},"k053":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ","ta":"மகாதசை","bn":"মহাদশা","mr":"महादशा","gu":"મહાદશા","as":"মহাদশা"},"k054":{"en":"balance","hi":"शेष","te":"మిగిలిన కాలం","kn":"ಉಳಿದ ಕಾಲ","ta":"மீதமுள்ள காலம்","bn":"বাকি সময়","mr":"शिल्लक काळ","gu":"બાકી સમય","as":"বাকী সময়"},"k055":{"en":"Today","hi":"आज","te":"ఈరోజు","kn":"ಇಂದು","ta":"இன்று","bn":"আজ","mr":"आज","gu":"આજે","as":"আজি"},"k056":{"en":"Birth nakshatra","hi":"जन्म नक्षत्र","te":"జన్మ నక్షత్రం","kn":"ಜನ್ಮ ನಕ್ಷತ್ರ","ta":"பிறப்பு நட்சத்திரம்","bn":"জন্মনক্ষত্র","mr":"जन्मनक्षत्र","gu":"જન્મ નક્ષત્ર","as":"জন্ম নক্ষত্ৰ"},"k057":{"en":"Period Predictions","hi":"दशा फल","te":"దశా ఫలితాలు","kn":"ದಶಾ ಫಲಗಳು","ta":"தசைப் பலன்கள்","bn":"দশাফল","mr":"दशाफल","gu":"દશાફળ","as":"দশাফল"},"k058":{"en":"Mahadasha and Antardasha, fully dated","hi":"महादशा एवं अंतर्दशा — तिथियों सहित","te":"మహాదశ, అంతర్దశ — పూర్తి తేదీలతో","kn":"ಮಹಾದಶಾ, ಅಂತರ್ದಶಾ — ಪೂರ್ಣ ದಿನಾಂಕಗಳೊಂದಿಗೆ","ta":"மகாதசை, அந்தர்தசை — முழு தேதிகளுடன்","bn":"মহাদশা ও অন্তর্দশা, সম্পূর্ণ তারিখসহ","mr":"महादशा आणि अंतर्दशा, संपूर्ण तारखांसह","gu":"મહાદશા અને અંતર્દશા, સંપૂર્ણ તારીખો સાથે","as":"মহাদশা আৰু অন্তৰ্দশা, সম্পূৰ্ণ তাৰিখৰ সৈতে"},"k059":{"en":"Want decision-grade timing?","hi":"निर्णय-स्तर का समय जानना चाहते हैं?","te":"నిర్ణయాలకు సరిపోయే కచ్చితమైన సమయం కావాలా?","kn":"ನಿರ್ಧಾರಗಳಿಗೆ ಸರಿಯಾದ ನಿಖರ ಸಮಯ ಬೇಕೇ?","ta":"முடிவெடுக்கத் தகுந்த துல்லியமான நேரம் வேண்டுமா?","bn":"সিদ্ধান্ত নেওয়ার মতো নিখুঁত সময় চান?","mr":"निर्णय घेण्याइतकी अचूक वेळ हवी आहे?","gu":"નિર્ણય લેવા જેટલો ચોક્કસ સમય જોઈએ છે?","as":"সিদ্ধান্ত ল'বলৈ প্ৰয়োজনীয় সঠিক সময় বিচাৰিছেনে?"},"k060":{"en":"This free report shows every dated period with general guidance. The paid 10-Year Deep Prediction weaves your specific house-lords, yogas and transits into each pratyantar — a personal consultant on paper.","hi":"यह निःशुल्क रिपोर्ट हर अवधि तिथियों सहित देती है। सशुल्क 10-वर्षीय गहन फलादेश प्रत्येक प्रत्यंतर में आपके भावेश-योग-गोचर बुनता है।","te":"ఈ ఉచిత రిపోర్ట్ ప్రతి కాలాన్నీ తేదీలతో, సాధారణ సూచనలతో చూపిస్తుంది. చెల్లింపు 10 సంవత్సరాల లోతైన అంచనా మీ భావాధిపతులు, యోగాలు, గోచారాలను ప్రతి ప్రత్యంతర దశలోనూ కలిపి చెబుతుంది — కాగితం మీద ఒక వ్యక్తిగత సలహాదారు.","kn":"ಈ ಉಚಿತ ವರದಿ ಪ್ರತಿ ಕಾಲವನ್ನೂ ದಿನಾಂಕಗಳೊಂದಿಗೆ, ಸಾಮಾನ್ಯ ಸೂಚನೆಗಳೊಂದಿಗೆ ತೋರಿಸುತ್ತದೆ. ಪಾವತಿಸಿದ 10 ವರ್ಷಗಳ ಆಳವಾದ ಅಂದಾಜು ನಿಮ್ಮ ಭಾವಾಧಿಪತಿಗಳು, ಯೋಗಗಳು, ಗೋಚಾರಗಳನ್ನು ಪ್ರತಿ ಪ್ರತ್ಯಂತರ ದಶೆಯಲ್ಲೂ ಸೇರಿಸಿ ಹೇಳುತ್ತದೆ — ಕಾಗದದ ಮೇಲೊಬ್ಬ ವೈಯಕ್ತಿಕ ಸಲಹೆಗಾರ.","ta":"இந்த இலவச அறிக்கை ஒவ்வொரு காலத்தையும் தேதிகளுடன், பொதுவான வழிகாட்டுதலுடன் காட்டுகிறது. கட்டண 10 ஆண்டு ஆழ்ந்த முன்னறிவிப்பு உங்கள் குறிப்பிட்ட பாவாதிபதிகள், யோகங்கள், கோசாரங்களை ஒவ்வொரு பிரத்யந்தரத்திலும் இணைத்துச் சொல்கிறது — காகிதத்தில் ஒரு தனிப்பட்ட ஆலோசகர்.","bn":"এই বিনামূল্যের রিপোর্টে প্রতিটি সময়কাল তারিখসহ, সাধারণ পরামর্শসহ দেওয়া আছে। সবেতন 10 বছরের গভীর ভবিষ্যদ্বাণীতে আপনার নিজস্ব ভাবাধিপতি, যোগ আর গোচর প্রতিটি প্রত্যন্তরে মিলিয়ে বলা হয় — কাগজে লেখা আপনার ব্যক্তিগত জ্যোতিষ পরামর্শদাতা।","mr":"हा मोफत अहवाल प्रत्येक काळ तारखांसह आणि सर्वसाधारण मार्गदर्शनासह दाखवतो. सशुल्क 10 वर्षांचे सखोल भविष्य तुमचे स्वतःचे भावाधिपती, योग आणि गोचर प्रत्येक प्रत्यंतरात जोडून सांगते — कागदावर लिहिलेला तुमचा वैयक्तिक ज्योतिष सल्लागार.","gu":"આ મફત અહેવાલ દરેક કાળ તારીખો સાથે અને સામાન્ય માર્ગદર્શન સાથે બતાવે છે. સશુલ્ક 10 વર્ષનું ઊંડું ભવિષ્ય તમારા પોતાના ભાવાધિપતિ, યોગ અને ગોચરને દરેક પ્રત્યંતરમાં જોડીને કહે છે — કાગળ પર લખાયેલો તમારો અંગત જ્યોતિષ સલાહકાર.","as":"এই বিনামূলীয়া প্ৰতিবেদনে প্ৰতিটো কাল তাৰিখৰ সৈতে আৰু সাধাৰণ পৰামৰ্শৰ সৈতে দেখুৱায়। সবেতন 10 বছৰীয়া গভীৰ ভৱিষ্যতে আপোনাৰ নিজৰ ভাৱাধিপতি, যোগ আৰু গোচৰ প্ৰতিটো প্ৰত্যন্তৰত সংযোগ কৰি কয় — কাগজত লিখা আপোনাৰ ব্যক্তিগত জ্যোতিষ পৰামৰ্শদাতা।"},"k061":{"en":"Period Predictions — ","hi":"दशा फल — ","te":"దశా ఫలితాలు — ","kn":"ದಶಾ ಫಲಗಳು — ","ta":"தசைப் பலன்கள் — ","bn":"দশাফল — ","mr":"दशाफल — ","gu":"દશાફળ — ","as":"দশাফল — "},"k062":{"en":"Mahadasha (contd.)","hi":"महादशा (क्रमशः)","te":"మహాదశ (కొనసాగింపు)","kn":"ಮಹಾದಶಾ (ಮುಂದುವರಿಕೆ)","ta":"மகாதசை (தொடர்ச்சி)","bn":"মহাদশা (চলছে)","mr":"महादशा (पुढे चालू)","gu":"મહાદશા (ચાલુ)","as":"মহাদশা (আগবাঢ়িছে)"},"k063":{"en":"Detailed Period Predictions","hi":"सूक्ष्म दशा फल","te":"వివరమైన దశా ఫలితాలు","kn":"ವಿವರವಾದ ದಶಾ ಫಲಗಳು","ta":"விரிவான தசைப் பலன்கள்","bn":"বিস্তারিত দশাফল","mr":"सविस्तर दशाफल","gu":"વિગતવાર દશાફળ","as":"বিশদ দশাফল"},"k064":{"en":"Pratyantar level, lifetime coverage","hi":"प्रत्यंतर स्तर — जीवन-पर्यंत","te":"ప్రత్యంతర స్థాయి, జీవితకాల వివరాలు","kn":"ಪ್ರತ್ಯಂತರ ಮಟ್ಟ, ಜೀವಮಾನದ ವಿವರಗಳು","ta":"பிரத்யந்தர நிலை, வாழ்நாள் முழுவதும்","bn":"প্রত্যন্তর স্তর, সারাজীবনের হিসাব","mr":"प्रत्यंतर पातळी, संपूर्ण आयुष्यभर","gu":"પ્રત્યંતર સ્તર, સંપૂર્ણ જીવનભર","as":"প্ৰত্যন্তৰ স্ত
