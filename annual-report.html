ntya","hi":"अंत्य","te":"అంత్య","kn":"ಅಂತ್ಯ","ta":"அந்த்ய","bn":"অন্ত্য","mr":"अंत्य","gu":"અંત્ય","as":"অন্ত্য"}},"manglikFactor":{"Jupiter influences Mars (conjunction/aspect)":{"en":"Jupiter influences Mars (conjunction/aspect)","hi":"बृहस्पति का मंगल पर प्रभाव (युति/दृष्टि)","te":"కుజుడిపై గురువు ప్రభావం (కలయిక/దృష్టి)","kn":"ಕುಜನ ಮೇಲೆ ಗುರುವಿನ ಪ್ರಭಾವ (ಕೂಟ/ದೃಷ್ಟಿ)","ta":"செவ்வாய் மீது குருவின் தாக்கம் (சேர்க்கை/பார்வை)","bn":"মঙ্গলের উপর বৃহস্পতির প্রভাব (যুতি/দৃষ্টি)","mr":"मंगळावर गुरूचा प्रभाव (युती/दृष्टी)","gu":"મંગળ પર ગુરુનો પ્રભાવ (યુતિ/દૃષ્ટિ)","as":"মঙ্গলৰ ওপৰত বৃহস্পতিৰ প্ৰভাৱ (যুতি/দৃষ্টি)"},"Mars exalted in Makara":{"en":"Mars exalted in Makara","hi":"मंगल मकर में उच्च","te":"మకరంలో కుజుడు ఉచ్ఛస్థితిలో","kn":"ಮಕರದಲ್ಲಿ ಕುಜ ಉಚ್ಚಸ್ಥಿತಿಯಲ್ಲಿ","ta":"மகரத்தில் செவ்வாய் உச்சம்","bn":"মকরে মঙ্গল উচ্চস্থ","mr":"मकरेत मंगळ उच्च","gu":"મકરમાં મંગળ ઉચ્ચ","as":"মকৰত মঙ্গল উচ্চ"},"Mars in own sign (Mesha)":{"en":"Mars in own sign (Mesha)","hi":"मंगल स्वराशि में (मेष)","te":"కుజుడు స్వరాశిలో (మేషం)","kn":"ಕುಜ ಸ್ವರಾಶಿಯಲ್ಲಿ (ಮೇಷ)","ta":"செவ்வாய் சொந்த ராசியில் (மேஷம்)","bn":"মঙ্গল স্বরাশিতে (মেষ)","mr":"मंगळ स्वराशीत (मेष)","gu":"મંગળ સ્વરાશિમાં (મેષ)","as":"মঙ্গল স্বৰাশিত (মেষ)"},"Mars in own sign (Vrishchika)":{"en":"Mars in own sign (Vrishchika)","hi":"मंगल स्वराशि में (वृश्चिक)","te":"కుజుడు స్వరాశిలో (వృశ్చికం)","kn":"ಕುಜ ಸ್ವರಾಶಿಯಲ್ಲಿ (ವೃಶ್ಚಿಕ)","ta":"செவ்வாய் சொந்த ராசியில் (விருச்சிகம்)","bn":"মঙ্গল স্বরাশিতে (বৃশ্চিক)","mr":"मंगळ स्वराशीत (वृश्चिक)","gu":"મંગળ સ્વરાશિમાં (વૃશ્ચિક)","as":"মঙ্গল স্বৰাশিত (বৃশ্চিক)"},"Age above 28 — traditional attenuation":{"en":"Age above 28 — traditional attenuation","hi":"28 वर्ष से अधिक आयु — परंपरागत रूप से दोष क्षीण","te":"28 ఏళ్ళు దాటిన వయస్సు — సంప్రదాయ ప్రకారం దోషం తగ్గుతుంది","kn":"28 ವರ್ಷ ಮೀರಿದ ವಯಸ್ಸು — ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ದೋಷ ಕಡಿಮೆ","ta":"28 வயதுக்கு மேல் — மரபுப்படி தோஷம் குறைகிறது","bn":"28 বছরের বেশি বয়স — পরম্পরাগতভাবে দোষ ক্ষীণ","mr":"28 वर्षांवरील वय — परंपरेने दोष क्षीण","gu":"28 વર્ષથી વધુ ઉંમર — પરંપરાગત રીતે દોષ ક્ષીણ","as":"28 বছৰৰ ওপৰৰ বয়স — পৰম্পৰাগতভাৱে দোষ ক্ষীণ"}},"manglikVerdict":{"No Mangal Dosha in either chart — Mars poses no obstacle to this match.":{"en":"No Mangal Dosha in either chart — Mars poses no obstacle to this match.","hi":"दोनों में से किसी कुंडली में मंगल दोष नहीं — इस मेल में मंगल की ओर से कोई बाधा नहीं।","te":"రెండు జాతకాల్లోనూ కుజ దోషం లేదు — ఈ సంబంధానికి కుజుడి వల్ల ఎలాంటి అడ్డంకీ లేదు.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷವಿಲ್ಲ — ಈ ಸಂಬಂಧಕ್ಕೆ ಕುಜನಿಂದ ಯಾವುದೇ ಅಡ್ಡಿಯಿಲ್ಲ.","ta":"இரு ஜாதகங்களிலும் செவ்வாய் தோஷம் இல்லை — இந்தப் பொருத்தத்திற்குச் செவ்வாயால் எந்தத் தடையும் இல்லை.","bn":"দুই কোষ্ঠীর কোনোটিতেই মঙ্গলদোষ নেই — এই মিলনে মঙ্গলের দিক থেকে কোনো বাধা নেই।","mr":"दोन्हीपैकी कोणत्याही पत्रिकेत मंगळ दोष नाही — या जुळणीत मंगळाकडून कोणतीही अडचण नाही.","gu":"બંનેમાંથી કોઈ કુંડળીમાં મંગળ દોષ નથી — આ મેળમાં મંગળ તરફથી કોઈ અડચણ નથી.","as":"দুয়োখন কুণ্ডলীৰ কোনোটাতে মঙ্গল দোষ নাই — এই মিলত মঙ্গলৰ ফালৰ পৰা কোনো বাধা নাই।"},"Both charts carry Mangal Dosha — by classical rule the dosha is mutually neutralized.":{"en":"Both charts carry Mangal Dosha — by classical rule the dosha is mutually neutralized.","hi":"दोनों कुंडलियों में मंगल दोष है — शास्त्रीय नियम से दोष परस्पर कट जाता है।","te":"రెండు జాతకాల్లోనూ కుజ దోషం ఉంది — శాస్త్ర నియమం ప్రకారం దోషం పరస్పరం తొలగిపోతుంది.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷವಿದೆ — ಶಾಸ್ತ್ರ ನಿಯಮದಂತೆ ದೋಷ ಪರಸ್ಪರ ನಿವಾರಣೆಯಾಗುತ್ತದೆ.","ta":"இரு ஜாதகங்களிலும் செவ்வாய் தோஷம் உள்ளது — சாஸ்திர விதிப்படி தோஷம் பரஸ்பரம் நீங்குகிறது.","bn":"দুই কোষ্ঠীতেই মঙ্গলদোষ আছে — শাস্ত্রীয় নিয়মে দোষ পরস্পর খণ্ডিত হয়।","mr":"दोन्ही पत्रिकांत मंगळ दोष आहे — शास्त्रीय नियमाने दोष परस्पर निवृत्त होतो.","gu":"બંને કુંડળીમાં મંગળ દોષ છે — શાસ્ત્રીય નિયમ પ્રમાણે દોષ પરસ્પર ખંડિત થાય છે.","as":"দুয়োখন কুণ্ডলীতে মঙ্গল দোষ আছে — শাস্ত্ৰীয় নিয়ম অনুসৰি দোষ পৰস্পৰ খণ্ডিত হয়।"},"Mangal Dosha present in one chart but softened by classical cancellation factors listed; the match may proceed with the traditional remedies.":{"en":"Mangal Dosha present in one chart but softened by classical cancellation factors listed; the match may proceed with the traditional remedies.","hi":"एक कुंडली में मंगल दोष है, पर ऊपर दिए शास्त्रीय कारणों से वह हल्का हो जाता है; परंपरागत उपायों के साथ यह मेल आगे बढ़ सकता है।","te":"ఒక జాతకంలో కుజ దోషం ఉంది, కానీ పైన చూపిన శాస్త్ర కారణాల వల్ల అది తగ్గుతుంది; సంప్రదాయ పరిహారాలతో ఈ సంబంధం ముందుకు సాగవచ్చు.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷವಿದೆ, ಆದರೆ ಮೇಲೆ ತೋರಿಸಿದ ಶಾಸ್ತ್ರ ಕಾರಣಗಳಿಂದ ಅದು ಕಡಿಮೆಯಾಗುತ್ತದೆ; ಸಂಪ್ರದಾಯದ ಪರಿಹಾರಗಳೊಂದಿಗೆ ಈ ಸಂಬಂಧ ಮುಂದುವರಿಯಬಹುದು.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, ஆனால் மேலே காட்டப்பட்ட சாஸ்திரக் காரணிகளால் அது மென்மையாகிறது; பாரம்பரியப் பரிகாரங்களுடன் இந்தப் பொருத்தம் தொடரலாம்.","bn":"এক কোষ্ঠীতে মঙ্গলদোষ আছে, তবে উপরে দেওয়া শাস্ত্রীয় কারণে তা লঘু হয়েছে; পরম্পরাগত প্রতিকারের সঙ্গে এই মিলন এগোতে পারে।","mr":"एका पत्रिकेत मंगळ दोष आहे, पण वर दिलेल्या शास्त्रीय कारणांनी तो सौम्य होतो; परंपरागत परिहारांसह ही जुळणी पुढे जाऊ शकते.","gu":"એક કુંડળીમાં મંગળ દોષ છે, પણ ઉપર આપેલા શાસ્ત્રીય કારણોથી એ હળવો થાય છે; પરંપરાગત પરિહાર સાથે આ મેળ આગળ વધી શકે છે.","as":"এখন কুণ্ডলীত মঙ্গল দোষ আছে, কিন্তু ওপৰত দিয়া শাস্ত্ৰীয় কাৰণবোৰৰ বাবে ই লঘু হৈছে; পৰম্পৰাগত প্ৰতিকাৰৰ সৈতে এই মিল আগবাঢ়িব পাৰে।"},"Mangal Dosha present in one chart without listed cancellations — tradition advises Mangal shanti (Hanuman upasana, Tuesday vrat) and elder consultation before proceeding.":{"en":"Mangal Dosha present in one chart without listed cancellations — tradition advises Mangal shanti (Hanuman upasana, Tuesday vrat) and elder consultation before proceeding.","hi":"एक कुंडली में मंगल दोष है और कोई शास्त्रीय कटाव नहीं — परंपरा आगे बढ़ने से पहले मंगल शांति (हनुमान उपासना, मंगलवार व्रत) और बड़ों के परामर्श की सलाह देती है।","te":"ఒక జాతకంలో కుజ దోషం ఉంది, తొలగింపు కారణాలేవీ లేవు — ముందుకు వెళ్ళే ముందు కుజ శాంతి (హనుమాన్ ఉపాసన, మంగళవారం వ్రతం) చేసి పెద్దల సలహా తీసుకోమని సంప్రదాయం చెబుతుంది.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷವಿದೆ, ನಿವಾರಣೆಯ ಕಾರಣಗಳಿಲ್ಲ — ಮುಂದುವರಿಯುವ ಮೊದಲು ಕುಜ ಶಾಂತಿ (ಹನುಮಾನ್ ಉಪಾಸನೆ, ಮಂಗಳವಾರ ವ್ರತ) ಮಾಡಿ ಹಿರಿಯರ ಸಲಹೆ ಪಡೆಯಬೇಕೆಂದು ಸಂಪ್ರದಾಯ ಹೇಳುತ್ತದೆ.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, நீக்கும் காரணிகள் இல்லை — தொடர்வதற்கு முன் செவ்வாய் சாந்தி (அனுமன் உபாசனை, செவ்வாய்க்கிழமை விரதம்) செய்து பெரியவர்களின் ஆலோசனை பெறுமாறு மரபு சொல்கிறது.","bn":"এক কোষ্ঠীতে মঙ্গলদোষ আছে, কোনো শাস্ত্রীয় খণ্ডন নেই — এগোনোর আগে পরম্পরা মঙ্গল শান্তি (হনুমান উপাসনা, মঙ্গলবারের ব্রত) ও গুরুজনের পরামর্শের কথা বলে।","mr":"एका पत्रिकेत मंगळ दोष आहे, कोणतेही शास्त्रीय परिहार नाहीत — पुढे जाण्याआधी परंपरा मंगळ शांती (हनुमान उपासना, मंगळवार व्रत) आणि वडीलधाऱ्यांचा सल्ला सांगते.","gu":"એક કુંડળીમાં મંગળ દોષ છે, કોઈ શાસ્ત્રીય ખંડન નથી — આગળ વધતાં પહેલાં પરંપરા મંગળ શાંતિ (હનુમાન ઉપાસના, મંગળવારનું વ્રત) અને વડીલોની સલાહ કહે છે.","as":"এখন কুণ্ডলীত মঙ্গল দোষ আছে, কোনো শাস্ত্ৰীয় খণ্ডন নাই — আগবাঢ়াৰ আগতে পৰম্পৰাই মঙ্গল শান্তি (হনুমান উপাসনা, মঙ্গলবাৰৰ ব্ৰত) আৰু বয়োজ্যেষ্ঠসকলৰ পৰামৰ্শৰ কথা কয়।"}},"planetAlias":{"Surya":{"en":"Sun","hi":"सूर्य","te":"సూర్యుడు","kn":"ಸೂರ್ಯ","ta":"சூரியன்","bn":"সূর্য","mr":"सूर्य","gu":"સૂર્ય","as":"সূৰ্য"},"Chandra":{"en":"Moon","hi":"चंद्र","te":"చంద్రుడు","kn":"ಚಂದ್ರ","ta":"சந்திரன்","bn":"চন্দ্র","mr":"चंद्र","gu":"ચંદ્ર","as":"চন্দ্ৰ"},"Mangal":{"en":"Mars","hi":"मंगल","te":"కుజుడు","kn":"ಕುಜ","ta":"செவ்வாய்","bn":"মঙ্গল","mr":"मंगळ","gu":"મંગળ","as":"মঙ্গল"},"Budh":{"en":"Mercury","hi":"बुध","te":"బుధుడు","kn":"ಬುಧ","ta":"புதன்","bn":"বুধ","mr":"बुध","gu":"બુધ","as":"বুধ"},"Guru":{"en":"Jupiter","hi":"बृहस्पति","te":"గురువు","kn":"ಗುರು","ta":"குரு","bn":"বৃহস্পতি","mr":"गुरु","gu":"ગુરુ","as":"বৃহস্পতি"},"Shukra":{"en":"Venus","hi":"शुक्र","te":"శుక్రుడు","kn":"ಶುಕ್ರ","ta":"சுக்கிரன்","bn":"শুক্র","mr":"शुक्र","gu":"શુક્ર","as":"শুক্ৰ"},"Shani":{"en":"Saturn","hi":"शनि","te":"శని","kn":"ಶನಿ","ta":"சனி","bn":"শনি","mr":"शनि","gu":"શનિ","as":"শনি"}},"yogaDetail":{"planetInRashiHouse":{"en":"{P} in {R} ({D}), house {N}","hi":"{P} {R} में ({D}), भाव {N}","te":"{P} {R}లో ({D}), భావం {N}","kn":"{P} {R}ದಲ್ಲಿ ({D}), ಭಾವ {N}","ta":"{P} {R}த்தில் ({D}), பாவம் {N}","bn":"{P} ர்க்கக்கூடிய நிலைகளில் நீக்கப்பட்டதாகக் கருதுகிறது. உங்கள் அறிக்கை ஒவ்வொரு நிலையையும் தெளிவாகக் கணக்கிடுகிறது, ஊகத்திற்கு விடுவதில்லை — கீழே உள்ளது இந்த இரு ஜாதகங்களுக்கு உண்மையில் பொருந்துவது.","bn":"শাস্ত্র এই দোষগুলিকে নির্দিষ্ট, যাচাইযোগ্য শর্তে খণ্ডিত বলে ধরে। আপনার রিপোর্ট প্রতিটি শর্ত স্পষ্টভাবে গণনা করে, অনুমানের উপর ছাড়ে না — নিচে যা আছে তা এই দুই কোষ্ঠীর ক্ষেত্রে সত্যিই প্রযোজ্য।","mr":"शास्त्र या दोषांना ठराविक, तपासता येण्याजोग्या स्थितींत खंडित मानतात. तुमचा अहवाल प्रत्येक स्थिती स्पष्टपणे मोजतो, अंदाजावर सोडत नाही — खाली आहे ते या दोन पत्रिकांना खरोखर लागू होणारे.","gu":"શાસ્ત્ર આ દોષોને ચોક્કસ, ચકાસી શકાય એવી સ્થિતિઓમાં ખંડિત ગણે છે. તમારો અહેવાલ દરેક સ્થિતિની ગણતરી સ્પષ્ટ રીતે કરે છે, અનુમાન પર છોડતો નથી — નીચે જે છે તે આ બે કુંડળીને ખરેખર લાગુ પડે છે.","as":"শাস্ত্ৰই এই দোষবোৰক নিৰ্দিষ্ট, পৰীক্ষা কৰিব পৰা চৰ্তত খণ্ডিত বুলি ধৰে। আপোনাৰ প্ৰতিবেদনে প্ৰতিটো চৰ্ত স্পষ্টকৈ গণনা কৰে, অনুমানৰ ওপৰত এৰি নিদিয়ে — তলত থকাখিনি এই দুখন কুণ্ডলীৰ ক্ষেত্ৰত সঁচাকৈ প্ৰযোজ্য।"}},"winLbl":{"whyFavourable":{"en":"Why this period is favourable","hi":"यह काल क्यों अनुकूल है","te":"ఈ కాలం ఎందుకు అనుకూలం","kn":"ಈ ಕಾಲ ಏಕೆ ಅನುಕೂಲ","ta":"இந்தக் காலம் ஏன் சாதகமானது","bn":"এই সময় কেন অনুকূল","mr":"हा काळ का अनुकूल आहे","gu":"આ સમય કેમ અનુકૂળ છે","as":"এই সময় কিয় অনুকূল"},"strength":{"en":"Strength","hi":"बल","te":"బలం","kn":"ಬಲ","ta":"பலம்","bn":"বল","mr":"बल","gu":"બળ","as":"বল"},"method":{"en":"Each window is scored by counting how many classical significators support it — the dasha lords' relationship to your 7th house and to Venus, the D9 chart, Jupiter's transit, and the traditional age range. Nothing here is a guarantee; it is where the classical indicators agree.","hi":"हर काल को इस आधार पर अंक मिलते हैं कि कितने शास्त्रीय कारक उसका समर्थन करते हैं — दशाधिपतियों का आपके सप्तम भाव और शुक्र से संबंध, नवांश कुंडली, बृहस्पति का गोचर, और परंपरागत आयु सीमा। यहाँ कुछ भी गारंटी नहीं; यह वह समय है जहाँ शास्त्रीय संकेत सहमत होते हैं।","te":"ప్రతి కాలానికీ ఎన్ని శాస్త్ర కారకాలు మద్దతిస్తున్నాయో లెక్కించి మార్కులు ఇవ్వబడతాయి — దశాధిపతులకు మీ సప్తమ భావం, శుక్రుడితో సంబంధం, నవాంశ జాతకం, గురు గోచారం, సంప్రదాయ వయో పరిధి. ఇక్కడ ఏదీ హామీ కాదు; ఇది శాస్త్ర సూచనలు ఏకీభవించే కాలం.","kn":"ಪ್ರತಿ ಕಾಲಕ್ಕೂ ಎಷ್ಟು ಶಾಸ್ತ್ರ ಕಾರಕಗಳು ಬೆಂಬಲಿಸುತ್ತವೆ ಎಂದು ಎಣಿಸಿ ಅಂಕ ನೀಡಲಾಗುತ್ತದೆ — ದಶಾಧಿಪತಿಗಳಿಗೆ ನಿಮ್ಮ ಸಪ್ತಮ ಭಾವ ಮತ್ತು ಶುಕ್ರನೊಂದಿಗಿನ ಸಂಬಂಧ, ನವಾಂಶ ಜಾತಕ, ಗುರುವಿನ ಗೋಚಾರ, ಸಂಪ್ರದಾಯದ ವಯೋಮಿತಿ. ಇಲ್ಲಿ ಯಾವುದೂ ಖಾತರಿಯಲ್ಲ; ಇದು ಶಾಸ್ತ್ರ ಸೂಚನೆಗಳು ಒಪ್ಪುವ ಕಾಲ.","ta":"ஒவ்வொரு காலத்திற்கும் எத்தனை சாஸ்திரக் காரகங்கள் ஆதரிக்கின்றன என்பதைக் கணக்கிட்டு மதிப்பெண் அளிக்கப்படுகிறது — தசாதிபதிகளுக்கு உங்கள் ஏழாம் பாவம் மற்றும் சுக்கிரனுடனான தொடர்பு, நவாம்ச ஜாதகம், குருவின் பெயர்ச்சி, மரபுவழி வயது வரம்பு. இங்கே எதுவும் உத்தரவாதம் அல்ல; இது சாஸ்திர அறிகுறிகள் ஒத்துப்போகும் காலம்.","bn":"প্রতিটি সময়কে এই ভিত্তিতে নম্বর দেওয়া হয় যে কতগুলি শাস্ত্রীয় কারক তাকে সমর্থন করে — দশাধিপতিদের সঙ্গে আপনার সপ্তম ভাব ও শুক্রের সম্পর্ক, নবাংশ কোষ্ঠী, বৃহস্পতির গোচর, এবং পরম্পরাগত বয়সসীমা। এখানে কিছুই নিশ্চয়তা নয়; এটি সেই সময় যেখানে শাস্ত্রীয় ইঙ্গিতগুলি একমত হয়।","mr":"प्रत्येक काळाला किती शास्त्रीय कारक त्याला पाठिंबा देतात यावरून गुण दिले जातात — दशाधिपतींचा तुमच्या सप्तम भावाशी आणि शुक्राशी संबंध, नवमांश पत्रिका, गुरूचे गोचर, आणि परंपरागत वयोमर्यादा. इथे काहीही हमी नाही; हा तो काळ आहे जिथे शास्त्रीय संकेत सहमत होतात.","gu":"દરેક સમયને એ આધારે ગુણ મળે છે કે કેટલા શાસ્ત્રીય કારક તેને ટેકો આપે છે — દશાધિપતિઓનો તમારા સપ્તમ ભાવ અને શુક્ર સાથેનો સંબંધ, નવમાંશ કુંડળી, ગુરુનું ગોચર, અને પરંપરાગત વયમર્યાદા. અહીં કશું ગેરંટી નથી; આ એ સમય છે જ્યાં શાસ્ત્રીય સંકેત સહમત થાય છે.","as":"প্ৰতিটো সময়ক কিমান শাস্ত্ৰীয় কাৰকে সমৰ্থন কৰে তাৰ ওপৰত নম্বৰ দিয়া হয় — দশাধিপতিৰ সৈতে আপোনাৰ সপ্তম ভাৱ আৰু শুক্ৰৰ সম্পৰ্ক, নৱাংশ কুণ্ডলী, বৃহস্পতিৰ গোচৰ, আৰু পৰম্পৰাগত বয়সসীমা। ইয়াত একোৱেই নিশ্চয়তা নহয়; এইটো সেই সময় য'ত শাস্ত্ৰীয় ইংগিতবোৰ একমত হয়।"}},"mSec":{"d9Title":{"en":"Navamsa (D9) — The Marriage Chart","hi":"नवांश (D9) — विवाह की कुंडली","te":"నవాంశ (D9) — వివాహ జాతకం","kn":"ನವಾಂಶ (D9) — ವಿವಾಹ ಜಾತಕ","ta":"நவாம்சம் (D9) — திருமண ஜாதகம்","bn":"নবাংশ (D9) — বিবাহের কোষ্ঠী","mr":"नवमांश (D9) — विवाहाची पत्रिका","gu":"નવમાંશ (D9) — વિવાહની કુંડળી","as":"নৱাংশ (D9) — বিবাহৰ কুণ্ডলী"},"d9Intro":{"en":"In classical practice the ninth divisional chart is read for marriage specifically — the D1 shows the promise, the D9 shows what it becomes. Both charts are set out below with their D9 ascendants and the lord of the 7th from each.","hi":"शास्त्रीय परंपरा में नवम वर्ग कुंडली विशेष रूप से विवाह के लिए देखी जाती है — जन्मकुंडली संभावना दिखाती है, नवांश दिखाता है कि वह क्या बनती है। नीचे दोनों कुंडलियाँ अपने नवांश लग्न और प्रत्येक के सप्तमेश के साथ दी गई हैं।","te":"శాస్త్ర సంప్రదాయంలో నవమ వర్గ జాతకాన్ని ప్రత్యేకంగా వివాహం కోసం చూస్తారు — జన్మ జాతకం వాగ్దానాన్ని చూపితే, నవాంశ అది ఏమవుతుందో చూపుతుంది. క్రింద రెండు జాతకాలూ వాటి నవాంశ లగ్నాలతో, ఒక్కొక్కదాని సప్తమాధిపతితో ఇవ్వబడ్డాయి.","kn":"ಶಾಸ್ತ್ರ ಸಂಪ್ರದಾಯದಲ್ಲಿ ನವಮ ವರ್ಗ ಜಾತಕವನ್ನು ವಿಶೇಷವಾಗಿ ವಿವಾಹಕ್ಕಾಗಿ ನೋಡಲಾಗುತ್ತದೆ — ಜನ್ಮ ಜಾತಕ ಭರವಸೆಯನ್ನು ತೋರಿಸಿದರೆ, ನವಾಂಶ ಅದು ಏನಾಗುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ. ಕೆಳಗೆ ಎರಡೂ ಜಾತಕಗಳು ಅವುಗಳ ನವಾಂಶ ಲಗ್ನಗಳೊಂದಿಗೆ, ಪ್ರತಿಯೊಂದರ ಸಪ್ತಮಾಧಿಪತಿಯೊಂದಿಗೆ ನೀಡಲಾಗಿದೆ.","ta":"சாஸ்திர மரபில் ஒன்பதாம் வர்க ஜாதகம் திருமணத்திற்கெனவே பார்க்கப்படுகிறது — ஜென்ம ஜாதகம் வாக்குறுதியைக் காட்டினால், நவாம்சம் அது எதுவாகிறது என்பதைக் காட்டுகிறது. கீழே இரு ஜாதகங்களும் அவற்றின் நவாம்ச லக்னங்களுடன், ஒவ்வொன்றின் ஏழாம் அதிபதியுடன் தரப்பட்டுள்ளன.","bn":"শাস্ত্রীয় রীতিতে নবম বর্গ কোষ্ঠী বিশেষভাবে বিবাহের জন্য দেখা হয় — জন্মকোষ্ঠী সম্ভাবনা দেখায়, নবাংশ দেখায় সেটা কী হয়ে ওঠে। নিচে দুটি কোষ্ঠীই তাদের নবাংশ লগ্ন ও প্রত্যেকের সপ্তমাধিপতি সহ দেওয়া হল।","mr":"शास्त्रीय परंपरेत नवम वर्ग पत्रिका विशेषतः विवाहासाठी पाहिली जाते — जन्मपत्रिका शक्यता दाखवते, नवमांश दाखवते ती काय होते. खाली दोन्ही पत्रिका त्यांच्या नवमांश लग्नांसह आणि प्रत्येकीच्या सप्तमेशासह दिल्या आहेत.","gu":"શાસ્ત્રીય પરંપરામાં નવમ વર્ગ કુંડળી ખાસ કરીને વિવાહ માટે જોવાય છે — જન્મકુંડળી શક્યતા બતાવે છે, નવમાંશ બતાવે છે એ શું બને છે. નીચે બંને કુંડળી તેમના નવમાંશ લગ્ન સાથે અને દરેકના સપ્તમેશ સાથે આપી છે.","as":"শাস্ত্ৰীয় পৰম্পৰাত নৱম বৰ্গ কুণ্ডলী বিশেষকৈ বিবাহৰ বাবে চোৱা হয় — জন্মকুণ্ডলীয়ে সম্ভাৱনা দেখুৱায়, নৱাংশই দেখুৱায় সেয়া কি হৈ উঠে। তলত দুয়োখন কুণ্ডলী সিহঁতৰ নৱাংশ লগ্ন আৰু প্ৰত্যেকৰ সপ্তমাধিপতিৰ সৈতে দিয়া হৈছে।"},"avTitle":{"en":"Seventh-House Strength (Ashtakavarga)","hi":"सप्तम भाव का बल (अष्टकवर्ग)","te":"సప్తమ భావ బలం (అష్టకవర్గం)","kn":"ಸಪ್ತಮ ಭಾವ ಬಲ (ಅಷ್ಟಕವರ್ಗ)","ta":"ஏழாம் பாவ பலம் (அஷ்டகவர்க்கம்)","bn":"সপ্তম ভাবের বল (অষ্টকবর্গ)","mr":"सप्तम भावाचे बल (अष्टकवर्ग)","gu":"સપ્તમ ભાવનું બળ (અષ્ટકવર્ગ)","as":"সপ্তম ভাৱৰ বল (অষ্টকবৰ্গ)"},"avIntro":{"en":"Ashtakavarga scores every house out of a fixed total of 337 points across the twelve. The seventh house governs marriage; its score below shows how much natural support each chart gives to partnership. Venus and Jupiter — the two planets classical texts weigh most for marriage — are shown separately.","hi":"अष्टकवर्ग बारह भावों में कुल 337 बिंदुओं के आधार पर प्रत्येक भाव को अंक देता है। सप्तम भाव विवाह का है; नीचे उसका अंक दिखाता है कि प्रत्येक कुंडली अंशीदारी को कितना स्वाभाविक सहारा देती है। शुक्र और बृहस्पति — विवाह के लिए शास्त्र जिन्हें सबसे अधिक महत्व देते हैं — अलग से दिखाए गए हैं।","te":"అష్టకవర్గం పన్నెండు భావాలకు కలిపి మొత్తం 337 బిందువుల ఆధారంగా ప్రతి భావానికీ మార్కులు ఇస్తుంది. సప్తమ భావం వివాహానిది; క్రింద దాని స్కోరు ప్రతి జాతకం భాగస్వామ్యానికి ఎంత సహజ మద్దతు ఇస్తుందో చూపుతుంది. వివాహానికి శాస్త్రం ఎక్కువ ప్రాధాన్యమిచ్చే శుక్రుడు, గురువు వేరుగా చూపబడ్డారు.","kn":"ಅಷ್ಟಕವರ್ಗ ಹನ್ನೆರಡು ಭಾವಗಳಿಗೆ ಸೇರಿ ಒಟ್ಟು 337 ಬಿಂದುಗಳ ಆಧಾರದಲ್ಲಿ ಪ್ರತಿ ಭಾವಕ್ಕೂ ಅಂಕ ನೀಡುತ್ತದೆ. ಸಪ್ತಮ ಭಾವ ವಿವಾಹದ್ದು; ಕೆಳಗಿನ ಅದರ ಅಂಕ ಪ್ರತಿ ಜಾತಕ ಪಾಲುದಾರಿಕೆಗೆ ಎಷ್ಟು ಸಹಜ ಬೆಂಬಲ ನೀಡುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ. ವಿವಾಹಕ್ಕೆ ಶಾಸ್ತ್ರ ಹೆಚ್ಚು ಮಹತ್ವ ನೀಡುವ ಶುಕ್ರ ಮತ್ತು ಗುರು ಪ್ರತ್ಯೇಕವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.","ta":"அஷ்டகவர்க்கம் பன்னிரண்டு பாவங்களுக்கும் சேர்த்து மொத்தம் 337 புள்ளிகள் அடிப்படையில் ஒவ்வொரு பாவத்திற்கும் மதிப்பெண் அளிக்கிறது. ஏழாம் பாவம் திருமணத்தினுடையது; கீழே அதன் மதிப்பெண் ஒவ்வொரு ஜாதகமும் கூட்டாண்மைக்கு எவ்வளவு இயற்கை ஆதரவு தருகிறது என்பதைக் காட்டுகிறது. திருமணத்திற்குச் சாஸ்திரம் அதிக முக்கியத்துவம் தரும் சுக்கிரனும் குருவும் தனியாகக் காட்டப்பட்டுள்ளனர்.","bn":"অষ্টকবর্গ বারোটি ভাবে মোট 337 বিন্দুর ভিত্তিতে প্রতিটি ভাবকে নম্বর দেয়। সপ্তম ভাব বিবাহের; নিচে তার নম্বর দেখায় প্রতিটি কোষ্ঠী অংশীদারিত্বকে কতটা স্বাভাবিক সমর্থন দেয়। বিবাহের জন্য শাস্ত্র যাঁদের সবচেয়ে গুরুত্ব দেয় — শুক্র ও বৃহস্পতি — আলাদা করে দেখানো হয়েছে।","mr":"अष्टकवर्ग बारा भावांत मिळून एकूण 337 बिंदूंच्या आधारे प्रत्येक भावाला गुण देतो. सप्तम भाव विवाहाचा; खाली त्याचे गुण दाखवतात की प्रत्येक पत्रिका भागीदारीला किती नैसर्गिक आधार देते. विवाहासाठी शास्त्र ज्यांना सर्वाधिक महत्त्व देतात ते शुक्र आणि गुरु स्वतंत्रपणे दाखवले आहेत.","gu":"અષ્ટકવર્ગ બાર ભાવમાં મળીને કુલ 337 બિંદુના આધારે દરેક ભાવને ગુણ આપે છે. સપ્તમ ભાવ વિવાહનો; નીચે તેના ગુણ બતાવે છે કે દરેક કુંડળી ભાગીદારીને કેટલો સ્વાભાવિક ટેકો આપે છે. વિવાહ માટે શાસ્ત્ર જેમને સૌથી વધુ મહત્ત્વ આપે છે એ શુક્ર અને ગુરુ અલગથી બતાવ્યા છે.","as":"অষ্টকবৰ্গই বাৰটা ভাৱত মুঠ 337 বিন্দুৰ ভিত্তিত প্ৰতিটো ভাৱক নম্বৰ দিয়ে। সপ্তম ভাৱ বিবাহৰ; তলত তাৰ নম্বৰে দেখুৱায় প্ৰতিখন কুণ্ডলীয়ে অংশীদাৰিত্বক কিমান স্বাভাৱিক সমৰ্থন দিয়ে। বিবাহৰ বাবে শাস্ত্ৰই যিসকলক আটাইতকৈ গুৰুত্ব দিয়ে — শুক্ৰ আৰু বৃহস্পতি — পৃথককৈ দেখুওৱা হৈছে।"},"chartsTitle":{"en":"Both Birth Charts, Side by Side","hi":"दोनों जन्मकुंडलियाँ, आमने-सामने","te":"రెండు జన్మ జాతకాలు, పక్కపక్కనే","kn":"ಎರಡೂ ಜನ್ಮ ಜಾತಕಗಳು, ಅಕ್ಕಪಕ್ಕದಲ್ಲಿ","ta":"இரு ஜென்ம ஜாதகங்கள், அருகருகே","bn":"দুটি জন্মকোষ্ঠী, পাশাপাশি","mr":"दोन्ही जन्मपत्रिका, शेजारी शेजारी","gu":"બંને જન્મકુંડળી, સાથે સાથે","as":"দুয়োখন জন্মকুণ্ডলী, কাষাকাষি"},"methodTitle":{"en":"How This Report Was Computed","hi":"यह रिपोर्ट कैसे बनी","te":"ఈ నివేదిక ఎలా తయారైంది","kn":"ಈ ವರದಿ ಹೇಗೆ ತಯಾರಾಯಿತು","ta":"இந்த அறிக்கை எப்படி உருவானது","bn":"এই রিপোর্ট কীভাবে তৈরি হল","mr":"हा अहवाल कसा तयार झाला","gu":"આ અહેવાલ કેવી રીતે બન્યો","as":"এই প্ৰতিবেদন কেনেকৈ প্ৰস্তুত হ'ল"},"methodBody":{"en":"Every number in this report comes from your two birth charts, computed by Drik Ganita with the Lahiri ayanamsa — the same standard a printed panchang uses. The 36 gunas follow the classical Ashtakoota method; the dosha cancellations follow the conditions the texts actually name, each checked rather than assumed. Nothing here is a template: change one birth minute and the tables change with it. You can verify any planetary position against any reliable panchang. What the report cannot do is decide for you — that stays with the two families, and with the two people.","hi":"इस रिपोर्ट का हर अंक आपकी दोनों जन्मकुंडलियों से आया है, जो दृक्गणित और लाहिरी अयनांश से गणना की गई हैं — वही मानक जो छपे पंचांग में होता है। छत्तीस गुण शास्त्रीय अष्टकूट पद्धति से हैं; दोष खंडन उन्हीं स्थितियों से जो शास्त्र में नाम से कही गई हैं, हर एक जाँची गई, मानी नहीं गई। यहाँ कुछ भी बना-बनाया नहीं: जन्म का एक मिनट बदलिए, तालिकाएँ बदल जाएँगी। कोई भी ग्रहस्थिति आप किसी विश्वसनीय पंचांग से मिला सकते हैं। रिपोर्ट जो नहीं कर सकती वह है आपके लिए निर्णय — वह दोनों परिवारों का है, और उन दो व्यक्तियों का।","te":"ఈ నివేదికలోని ప్రతి సంఖ్యా మీ రెండు జన్మ జాతకాల నుండి వచ్చినది, దృక్ గణితం, లాహిరి అయనాంశంతో లెక్కించబడినది — ముద్రిత పంచాంగం వాడే అదే ప్రమాణం. ముప్పై ఆరు గుణాలు శాస్త్రీయ అష్టకూట పద్ధతి ప్రకారం; దోష ఖండనలు శాస్త్రం పేర్కొన్న పరిస్థితుల ప్రకారం, ప్రతిదీ పరిశీలించబడినది, ఊహించబడలేదు. ఇక్కడ ఏదీ మూస కాదు: పుట్టిన నిమిషం మార్చండి, పట్టికలు మారతాయి. ఏ గ్రహస్థితినైనా మీరు నమ్మదగిన పంచాంగంతో సరిపోల్చవచ్చు. నివేదిక చేయలేనిది ఒక్కటే — మీ తరపున నిర్ణయించడం. అది రెండు కుటుంబాలది, ఆ ఇద్దరిది.","kn":"ಈ ವರದಿಯ ಪ್ರತಿ ಸಂಖ್ಯೆಯೂ ನಿಮ್ಮ ಎರಡು ಜನ್ಮ ಜಾತಕಗಳಿಂದ ಬಂದದ್ದು, ದೃಕ್ ಗಣಿತ ಮತ್ತು ಲಾಹಿರಿ ಅಯನಾಂಶದಿಂದ ಲೆಕ್ಕಿಸಲಾಗಿದೆ — ಮುದ್ರಿತ ಪಂಚಾಂಗ ಬಳಸುವ ಅದೇ ಮಾನದಂಡ. ಮೂವತ್ತಾರು ಗುಣಗಳು ಶಾಸ್ತ್ರೀಯ ಅಷ್ಟಕೂಟ ಪದ್ಧತಿಯಂತೆ; ದೋಷ ಖಂಡನೆಗಳು ಶಾಸ್ತ್ರ ಹೆಸರಿಸಿದ ಸ್ಥಿತಿಗಳಂತೆ, ಪ್ರತಿಯೊಂದನ್ನೂ ಪರಿಶೀಲಿಸಲಾಗಿದೆ, ಊಹಿಸಿಲ್ಲ. ಇಲ್ಲಿ ಯಾವುದೂ ಸಿದ್ಧ ಮಾದರಿಯಲ್ಲ: ಹುಟ್ಟಿದ ಒಂದು ನಿಮಿಷ ಬದಲಿಸಿ, ಕೋಷ್ಟಕಗಳು ಬದಲಾಗುತ್ತವೆ. ಯಾವುದೇ ಗ್ರಹಸ್ಥಿತಿಯನ್ನು ನೀವು ವಿಶ್ವಾಸಾರ್ಹ ಪಂಚಾಂಗದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಬಹುದು. ವರದಿ ಮಾಡಲಾಗದ್ದು ಒಂದೇ — ನಿಮ್ಮ ಪರವಾಗಿ ನಿರ್ಧರಿಸುವುದು. ಅದು ಎರಡು ಕುಟುಂಬಗಳದ್ದು, ಆ ಇಬ್ಬರದ್ದು.","ta":"இந்த அறிக்கையின் ஒவ்வொரு எண்ணும் உங்கள் இரு ஜென்ம ஜாதகங்களிலிருந்து வந்தது, திருக்கணிதம் மற்றும் லாஹிரி அயனாம்சத்தால் கணக்கிடப்பட்டது — அச்சிடப்பட்ட பஞ்சாங்கம் பயன்படுத்தும் அதே தரநிலை. முப்பத்தாறு குணங்கள் சாஸ்திர அஷ்டகூட முறைப்படி; தோஷ நீக்கங்கள் சாஸ்திரம் பெயரிட்ட நிலைகளின்படி, ஒவ்வொன்றும் சரிபார்க்கப்பட்டது, ஊகிக்கப்படவில்லை. இங்கே எதுவும் வார்ப்புரு அல்ல: பிறந்த ஒரு நிமிடத்தை மாற்றுங்கள், அட்டவணைகள் மாறும். எந்தக் கிரக நிலையையும் நீங்கள் நம்பகமான பஞ்சாங்கத்துடன் சரிபார்க்கலாம். அறிக்கையால் செய்ய முடியாதது ஒன்றே — உங்களுக்காக முடிவெடுப்பது. அது இரு குடும்பங்களுடையது, அந்த இருவருடையது.","bn":"এই রিপোর্টের প্রতিটি সংখ্যা এসেছে আপনাদের দুই জন্মকোষ্ঠী থেকে, দৃকগণিত ও লাহিড়ী অয়নাংশে গণনা করা — ছাপা পঞ্জিকা যে মানই ব্যবহার করে। ছত্রিশ গুণ শাস্ত্রীয় অষ্টকূট পদ্ধতিতে; দোষ খণ্ডন শাস্ত্রে নাম করে বলা শর্ত অনুযায়ী, প্রতিটি যাচাই করা, ধরে নেওয়া নয়। এখানে কিছুই ছাঁচে ঢালা নয়: জন্মের এক মিনিট বদলান, টেবিল বদলে যাবে। যেকোনো গ্রহস্থিতি আপনি বিশ্বাসযোগ্য পঞ্জিকার সঙ্গে মিলিয়ে নিতে পারেন। রিপোর্ট যা পারে না তা হল আপনাদের হয়ে সিদ্ধান্ত নেওয়া — সেটা দুই পরিবারের, আর ওই দুজনের।","mr":"या अहवालातील प्रत्येक आकडा तुमच्या दोन जन्मपत्रिकांमधून आला आहे, दृक्गणित आणि लाहिरी अयनांशाने मोजलेला — छापील पंचांग वापरते तोच मानक. छत्तीस गुण शास्त्रीय अष्टकूट पद्धतीने; दोष परिहार शास्त्रात नावाने सांगितलेल्या स्थितींनुसार, प्रत्येक तपासलेला, गृहीत धरलेला नाही. इथे काहीही साचेबद्ध नाही: जन्माचे एक मिनिट बदला, तक्ते बदलतील. कोणतीही ग्रहस्थिती तुम्ही विश्वसनीय पंचांगाशी ताडून पाहू शकता. अहवाल जे करू शकत नाही ते म्हणजे तुमच्यासाठी निर्णय — तो दोन्ही कुटुंबांचा आहे, आणि त्या दोघांचा.","gu":"આ અહેવાલનો દરેક આંકડો તમારી બે જન્મકુંડળીમાંથી આવ્યો છે, દૃકગણિત અને લાહિરી અયનાંશથી ગણેલો — છપાયેલું પંચાંગ વાપરે છે એ જ ધોરણ. છત્રીસ ગુણ શાસ્ત્રીય અષ્ટકૂટ પદ્ધતિથી; દોષ ખંડન શાસ્ત્રમાં નામ લઈને કહેલી સ્થિતિઓ પ્રમાણે, દરેક તપાસેલી, માની લીધેલી નહીં. અહીં કશું ઢાળેલું નથી: જન્મની એક મિનિટ બદલો, કોષ્ટકો બદલાશે. કોઈ પણ ગ્રહસ્થિતિ તમે વિશ્વસનીય પંચાંગ સાથે મેળવી શકો છો. અહેવાલ જે નથી કરી શકતો તે છે તમારા વતી નિર્ણય — એ બંને પરિવારોનો છે, અને એ બે વ્યક્તિઓનો.","as":"এই প্ৰতিবেদনৰ প্ৰতিটো সংখ্যা আপোনালোকৰ দুখন জন্মকুণ্ডলীৰ পৰা অহা, দৃকগণিত আৰু লাহিৰী অয়নাংশেৰে গণনা কৰা — ছপা পঞ্জিকাই ব্যৱহাৰ কৰা সেই একেই মানদণ্ড। ছয়ত্ৰিশ গুণ শাস্ত্ৰীয় অষ্টকূট পদ্ধতিৰে; দোষ খণ্ডন শাস্ত্ৰই নাম লৈ কোৱা চৰ্ত অনুসৰি, প্ৰতিটো পৰীক্ষা কৰা, ধৰি লোৱা নহয়। ইয়াত একোৱেই সাঁচত ঢলা নহয়: জন্মৰ এক মিনিট সলনি কৰক, তালিকাবোৰ সলনি হ'ব। যিকোনো গ্ৰহস্থিতি আপুনি বিশ্বাসযোগ্য পঞ্জিকাৰ সৈতে মিলাই চাব পাৰে। প্ৰতিবেদনে কৰিব নোৱাৰাটো হ'ল আপোনালোকৰ হৈ সিদ্ধান্ত লোৱা — সেয়া দুয়ো পৰিয়ালৰ, আৰু সেই দুজনৰ।"},"groom":{"en":"Groom","hi":"वर","te":"వరుడు","kn":"ವರ","ta":"மணமகன்","bn":"পাত্র","mr":"वर","gu":"વર","as":"পাত্ৰ"},"bride":{"en":"Bride","hi":"वधू","te":"వధువు","kn":"ವಧು","ta":"மணமகள்","bn":"পাত্রী","mr":"वधू","gu":"કન્યા","as":"পাত্ৰী"},"seventhLordIs":{"en":"Lord of the 7th","hi":"सप्तमेश","te":"సప్తమాధిపతి","kn":"ಸಪ್ತಮಾಧಿಪತಿ","ta":"ஏழாம் அதிபதி","bn":"সপ্তমাধিপতি","mr":"सप्तमेश","gu":"સપ્તમેશ","as":"সপ্তমাধিপতি"}},"cSec":{"d10Title":{"en":"Dashamsha (D10) — The Career Chart","hi":"दशमांश (D10) — कर्म की कुंडली","te":"దశాంశ (D10) — వృత్తి జాతకం","kn":"ದಶಾಂಶ (D10) — ವೃತ್ತಿ ಜಾತಕ","ta":"தசாம்சம் (D10) — தொழில் ஜாதகம்","bn":"দশমাংশ (D10) — কর্মজীবনের কোষ্ঠী","mr":"दशमांश (D10) — कर्माची पत्रिका","gu":"દશમાંશ (D10) — કર્મની કુંડળી","as":"দশমাংশ (D10) — কৰ্মজীৱনৰ কুণ্ডলী"},"d10Intro":{"en":"Classical practice reads the tenth divisional chart for work specifically. The birth chart shows what you are capable of; the D10 shows what that becomes in the world — the standing you build, and the kind of work that actually holds you.","hi":"शास्त्रीय परंपरा कर्म के लिए विशेष रूप से दशम वर्ग कुंडली देखती है। जन्मकुंडली बताती है कि आप किस योग्य हैं; दशमांश बताता है कि वह जगत में क्या बनता है — आप जो स्थान बनाते हैं, और वह काम जो सचमुच आपको थामे रखता है।","te":"శాస్త్ర సంప్రదాయం వృత్తి కోసం ప్రత్యేకంగా దశమ వర్గ జాతకాన్ని చూస్తుంది. జన్మ జాతకం మీరు దేనికి సమర్థులో చెబితే, దశాంశ అది లోకంలో ఏమవుతుందో చూపుతుంది — మీరు నిర్మించుకునే స్థానం, నిజంగా మిమ్మల్ని నిలబెట్టే పని.","kn":"ಶಾಸ್ತ್ರ ಸಂಪ್ರದಾಯ ವೃತ್ತಿಗಾಗಿ ವಿಶೇಷವಾಗಿ ದಶಮ ವರ್ಗ ಜಾತಕವನ್ನು ನೋಡುತ್ತದೆ. ಜನ್ಮ ಜಾತಕ ನೀವು ಯಾವುದಕ್ಕೆ ಸಮರ್ಥರು ಎಂದು ಹೇಳಿದರೆ, ದಶಾಂಶ ಅದು ಲೋಕದಲ್ಲಿ ಏನಾಗುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ — ನೀವು ಕಟ್ಟಿಕೊಳ್ಳುವ ಸ್ಥಾನ, ನಿಜವಾಗಿ ನಿಮ್ಮನ್ನು ಹಿಡಿದಿಡುವ ಕೆಲಸ.","ta":"சாஸ்திர மரபு தொழிலுக்கெனவே பத்தாம் வர்க ஜாதகத்தைப் பார்க்கிறது. ஜென்ம ஜாதகம் நீங்கள் எதற்குத் தகுதியானவர் என்று சொன்னால், தசாம்சம் அது உலகில் எதுவாகிறது என்பதைக் காட்டுகிறது — நீங்கள் கட்டியெழுப்பும் இடம், உண்மையில் உங்களைத் தாங்கிப் பிடிக்கும் வேலை.","bn":"শাস্ত্রীয় রীতি কর্মজীবনের জন্য বিশেষভাবে দশম বর্গ কোষ্ঠী দেখে। জন্মকোষ্ঠী বলে আপনি কীসের যোগ্য; দশমাংশ বলে সেটা জগতে কী হয়ে ওঠে — আপনি যে স্থান গড়েন, আর যে কাজ সত্যিই আপনাকে ধরে রাখে।","mr":"शास्त्रीय परंपरा कर्मासाठी विशेषतः दशम वर्ग पत्रिका पाहते. जन्मपत्रिका सांगते तुम्ही कशाला योग्य आहात; दशमांश सांगतो ते जगात काय होते — तुम्ही उभे करता ते स्थान, आणि जे काम खरोखर तुम्हाला धरून ठेवते.","gu":"શાસ્ત્રીય પરંપરા કર્મ માટે ખાસ કરીને દશમ વર્ગ કુંડળી જુએ છે. જન્મકુંડળી કહે છે તમે શેને લાયક છો; દશમાંશ કહે છે એ જગતમાં શું બને છે — તમે જે સ્થાન ઊભું કરો છો, અને જે કામ ખરેખર તમને ટકાવી રાખે છે.","as":"শাস্ত্ৰীয় পৰম্পৰাই কৰ্মজীৱনৰ বাবে বিশেষকৈ দশম বৰ্গ কুণ্ডলী চায়। জন্মকুণ্ডলীয়ে কয় আপুনি কিহৰ যোগ্য; দশমাংশই কয় সেয়া জগতত কি হৈ উঠে — আপুনি গঢ়া স্থান, আৰু যি কামে সঁচাকৈ আপোনাক ধৰি ৰাখে।"},"avTitle":{"en":"Tenth-House Strength (Ashtakavarga)","hi":"दशम भाव का बल (अष्टकवर्ग)","te":"దశమ భావ బలం (అష్టకవర్గం)","kn":"ದಶಮ ಭಾವ ಬಲ (ಅಷ್ಟಕವರ್ಗ)","ta":"பத்தாம் பாவ பலம் (அஷ்டகவர்க்கம்)","bn":"দশম ভাবের বল (অষ্টকবর্গ)","mr":"दशम भावाचे बल (अष्टकवर्ग)","gu":"દશમ ભાવનું બળ (અષ્ટકવર્ગ)","as":"দশম ভাৱৰ বল (অষ্টকবৰ্গ)"},"avIntro":{"en":"Ashtakavarga distributes a fixed 337 points across the twelve houses. The tenth house is the house of work, so its score shows how much natural support your chart gives to a public career. The four planets classical texts weigh most for livelihood — Sun for standing, Mercury for skill, Jupiter for counsel, Saturn for endurance — are shown separately below.","hi":"अष्टकवर्ग बारह भावों में कुल 337 बिंदु बाँटता है। दशम भाव कर्म का है, इसलिए उसका अंक बताता है कि आपकी कुंडली सार्वजनिक कर्मजीवन को कितना स्वाभाविक सहारा देती है। जीविका के लिए शास्त्र जिन चार ग्रहों को सबसे अधिक महत्व देते हैं — प्रतिष्ठा के लिए सूर्य, कौशल के लिए बुध, परामर्श के लिए बृहस्पति, सहनशीलता के लिए शनि — वे नीचे अलग दिखाए गए हैं।","te":"అష్టకవర్గం పన్నెండు భావాలకు మొత్తం 337 బిందువులను పంచుతుంది. దశమ భావం వృత్తిది, కాబట్టి దాని స్కోరు మీ జాతకం బహిరంగ వృత్తికి ఎంత సహజ మద్దతు ఇస్తుందో చూపుతుంది. జీవనోపాధికి శాస్త్రం ఎక్కువ ప్రాధాన్యమిచ్చే నాలుగు గ్రహాలు — స్థానానికి సూర్యుడు, నైపుణ్యానికి బుధుడు, సలహాకు గురువు, ఓర్పుకు శని — క్రింద వేరుగా చూపబడ్డాయి.","kn":"ಅಷ್ಟಕವರ್ಗ ಹನ್ನೆರಡು ಭಾವಗಳಿಗೆ ಒಟ್ಟು 337 ಬಿಂದುಗಳನ್ನು ಹಂಚುತ್ತದೆ. ದಶಮ ಭಾವ ಕೆಲಸದ್ದು, ಆದ್ದರಿಂದ ಅದರ ಅಂಕ ನಿಮ್ಮ ಜಾತಕ ಸಾರ್ವಜನಿಕ ವೃತ್ತಿಗೆ ಎಷ್ಟು ಸಹಜ ಬೆಂಬಲ ನೀಡುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ. ಜೀವನೋಪಾಯಕ್ಕೆ ಶಾಸ್ತ್ರ ಹೆಚ್ಚು ಮಹತ್ವ ನೀಡುವ ನಾಲ್ಕು ಗ್ರಹಗಳು — ಸ್ಥಾನಕ್ಕೆ ಸೂರ್ಯ, ಕೌಶಲಕ್ಕೆ ಬುಧ, ಸಲಹೆಗೆ ಗುರು, ಸಹನೆಗೆ ಶನಿ — ಕೆಳಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.","ta":"அஷ்டகவர்க்கம் பன்னிரண்டு பாவங்களுக்கு மொத்தம் 337 புள்ளிகளைப் பகிர்கிறது. பத்தாம் பாவம் வேலையினுடையது, எனவே அதன் மதிப்பெண் உங்கள் ஜாதகம் பொதுத் தொழிலுக்கு எவ்வளவு இயற்கை ஆதரவு தருகிறது என்பதைக் காட்டுகிறது. வாழ்வாதாரத்திற்குச் சாஸ்திரம் அதிக முக்கியத்துவம் தரும் நான்கு கிரகங்கள் — நிலைக்குச் சூரியன், திறனுக்குப் புதன், ஆலோசனைக்குக் குரு, சகிப்புக்குச் சனி — கீழே தனியாகக் காட்டப்பட்டுள்ளன.","bn":"অষ্টকবর্গ বারোটি ভাবে মোট 337 বিন্দু ভাগ করে। দশম ভাব কর্মের, তাই তার নম্বর দেখায় আপনার কোষ্ঠী প্রকাশ্য কর্মজীবনকে কতটা স্বাভাবিক সমর্থন দেয়। জীবিকার জন্য শাস্ত্র যে চার গ্রহকে সবচেয়ে গুরুত্ব দেয় — প্রতিষ্ঠার জন্য সূর্য, দক্ষতার জন্য বুধ, পরামর্শের জন্য বৃহস্পতি, সহনশীলতার জন্য শনি — নিচে আলাদা করে দেখানো হয়েছে।","mr":"अष्टकवर्ग बारा भावांत एकूण 337 बिंदू वाटतो. दशम भाव कर्माचा आहे, म्हणून त्याचे गुण दाखवतात की तुमची पत्रिका सार्वजनिक कर्मजीवनाला किती नैसर्गिक आधार देते. उपजीविकेसाठी शास्त्र ज्या चार ग्रहांना सर्वाधिक महत्त्व देतात — प्रतिष्ठेसाठी सूर्य, कौशल्यासाठी बुध, सल्ल्यासाठी गुरु, सहनशीलतेसाठी शनि — ते खाली स्वतंत्रपणे दाखवले आहेत.","gu":"અષ્ટકવર્ગ બાર ભાવમાં કુલ 337 બિંદુ વહેંચે છે. દશમ ભાવ કર્મનો છે, એટલે તેના ગુણ બતાવે છે કે તમારી કુંડળી જાહેર કર્મજીવનને કેટલો સ્વાભાવિક ટેકો આપે છે. આજીવિકા માટે શાસ્ત્ર જે ચાર ગ્રહોને સૌથી વધુ મહત્ત્વ આપે છે — પ્રતિષ્ઠા માટે સૂર્ય, કૌશલ્ય માટે બુધ, સલાહ માટે ગુરુ, સહનશીલતા માટે શનિ — તે નીચે અલગથી બતાવ્યા છે.","as":"অষ্টকবৰ্গই বাৰটা ভাৱত মুঠ 337 বিন্দু ভাগ কৰে। দশম ভাৱ কৰ্মৰ, সেয়েহে তাৰ নম্বৰে দেখুৱায় আপোনাৰ কুণ্ডলীয়ে ৰাজহুৱা কৰ্মজীৱনক কিমান স্বাভাৱিক সমৰ্থন দিয়ে। জীৱিকাৰ বাবে শাস্ত্ৰই যি চাৰিটা গ্ৰহক আটাইতকৈ গুৰুত্ব দিয়ে — মৰ্যাদাৰ বাবে সূৰ্য, দক্ষতাৰ বাবে বুধ, পৰামৰ্শৰ বাবে বৃহস্পতি, সহনশীলতাৰ বাবে শনি — তলত পৃথককৈ দেখুওৱা হৈছে।"},"dashaTitle":{"en":"Your Next Ten Years, Period by Period","hi":"आपके अगले दस वर्ष, काल दर काल","te":"మీ రాబోయే పదేళ్ళు, కాలం వారీగా","kn":"ನಿಮ್ಮ ಮುಂದಿನ ಹತ್ತು ವರ್ಷ, ಕಾಲ ಕಾಲಕ್ಕೆ","ta":"உங்கள் அடுத்த பத்து ஆண்டுகள், காலம் வாரியாக","bn":"আপনার পরবর্তী দশ বছর, সময় ধরে ধরে","mr":"तुमची पुढील दहा वर्षे, काळानुसार","gu":"તમારાં આગામી દસ વર્ષ, સમયવાર","as":"আপোনাৰ অহা দহ বছৰ, সময় অনুসৰি"},"dashaIntro":{"en":"The Vimshottari dasha divides a life into periods ruled by each planet in turn, and each period into sub-periods. Work rarely changes on a date; it changes when the ruling period changes. Below are your sub-periods for the next ten years, with the planet governing each — read them as weather, not as instructions.","hi":"विंशोत्तरी दशा जीवन को बारी-बारी से हर ग्रह के कालों में बाँटती है, और हर काल को उपकालों में। कर्मजीवन किसी तारीख पर नहीं बदलता; वह तब बदलता है जब चलता काल बदलता है। नीचे अगले दस वर्षों के आपके उपकाल दिए हैं, हर एक का स्वामी ग्रह सहित — इन्हें आदेश नहीं, मौसम की तरह पढ़िए।","te":"వింశోత్తరి దశ జీవితాన్ని ఒక్కో గ్రహం పాలించే కాలాలుగా, ప్రతి కాలాన్నీ ఉప కాలాలుగా విభజిస్తుంది. వృత్తి ఏదో ఒక తేదీన మారదు; పాలించే కాలం మారినప్పుడు మారుతుంది. క్రింద రాబోయే పదేళ్ళ మీ ఉప కాలాలు, ఒక్కొక్కదాని అధిపతి గ్రహంతో ఇవ్వబడ్డాయి — వీటిని ఆదేశాలుగా కాక వాతావరణంగా చదవండి.","kn":"ವಿಂಶೋತ್ತರಿ ದಶಾ ಜೀವನವನ್ನು ಒಂದೊಂದು ಗ್ರಹ ಆಳುವ ಕಾಲಗಳಾಗಿ, ಪ್ರತಿ ಕಾಲವನ್ನೂ ಉಪಕಾಲಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ. ಕೆಲಸ ಯಾವುದೋ ದಿನಾಂಕದಲ್ಲಿ ಬದಲಾಗುವುದಿಲ್ಲ; ಆಳುವ ಕಾಲ ಬದಲಾದಾಗ ಬದಲಾಗುತ್ತದೆ. ಕೆಳಗೆ ಮುಂದಿನ ಹತ್ತು ವರ್ಷಗಳ ನಿಮ್ಮ ಉಪಕಾಲಗಳು, ಪ್ರತಿಯೊಂದರ ಅಧಿಪತಿ ಗ್ರಹದೊಂದಿಗೆ — ಇವನ್ನು ಆದೇಶಗಳಾಗಿ ಅಲ್ಲ, ಹವಾಮಾನವಾಗಿ ಓದಿ.","ta":"விம்சோத்தரி தசை வாழ்க்கையை ஒவ்வொரு கிரகமும் ஆளும் காலங்களாகவும், ஒவ்வொரு காலத்தையும் உட்காலங்களாகவும் பிரிக்கிறது. வேலை ஏதோ ஒரு தேதியில் மாறுவதில்லை; ஆளும் காலம் மாறும்போது மாறுகிறது. கீழே அடுத்த பத்து ஆண்டுகளுக்கான உங்கள் உட்காலங்கள், ஒவ்வொன்றின் அதிபதி கிரகத்துடன் — இவற்றைக் கட்டளைகளாக அல்ல, வானிலையாகப் படியுங்கள்.","bn":"বিংশোত্তরী দশা জীবনকে পালা করে প্রতিটি গ্রহের শাসিত সময়ে ভাগ করে, আর প্রতিটি সময়কে উপসময়ে। কর্মজীবন কোনো তারিখে বদলায় না; বদলায় যখন চলতি সময় বদলায়। নিচে আগামী দশ বছরের আপনার উপসময় দেওয়া হল, প্রতিটির অধিপতি গ্রহ সহ — এগুলো নির্দেশ নয়, আবহাওয়ার মতো পড়ুন।","mr":"विंशोत्तरी दशा आयुष्याला आळीपाळीने प्रत्येक ग्रहाच्या काळांत आणि प्रत्येक काळाला उपकाळांत विभागते. कर्मजीवन एखाद्या तारखेला बदलत नाही; चालू काळ बदलतो तेव्हा बदलते. खाली पुढील दहा वर्षांचे तुमचे उपकाळ दिले आहेत, प्रत्येकाचा स्वामी ग्रह देऊन — हे आदेश नव्हे, हवामान म्हणून वाचा.","gu":"વિંશોત્તરી દશા જીવનને વારાફરતી દરેક ગ્રહના કાળમાં અને દરેક કાળને ઉપકાળમાં વહેંચે છે. કર્મજીવન કોઈ તારીખે બદલાતું નથી; ચાલુ કાળ બદલાય ત્યારે બદલાય છે. નીચે આગામી દસ વર્ષના તમારા ઉપકાળ આપ્યા છે, દરેકનો સ્વામી ગ્રહ સાથે — આને આદેશ નહીં, હવામાન તરીકે વાંચો.","as":"বিংশোত্তৰী দশাই জীৱনক পালি পাতি প্ৰতিটো গ্ৰহে শাসন কৰা কালত, আৰু প্ৰতিটো কালক উপকালত ভাগ কৰে। কৰ্মজীৱন কোনো তাৰিখত সলনি নহয়; চলি থকা কাল সলনি হ'লেহে সলনি হয়। তলত অহা দহ বছৰৰ আপোনাৰ উপকাল দিয়া হৈছে, প্ৰতিটোৰে অধিপতি গ্ৰহৰ সৈতে — এইবোৰ আদেশ নহয়, বতৰৰ দৰে পঢ়ক।"},"period":{"en":"Period","hi":"काल","te":"కాలం","kn":"ಕಾಲ","ta":"காலம்","bn":"সময়","mr":"काळ","gu":"કાળ","as":"কাল"},"ruledBy":{"en":"Ruled by","hi":"स्वामी","te":"అధిపతి","kn":"ಅಧಿಪತಿ","ta":"அதிபதி","bn":"অধিপতি","mr":"स्वामी","gu":"સ્વામી","as":"অধিপতি"},"methodBody":{"en":"Every figure in this report is computed from your birth chart by Drik Ganita with the Lahiri ayanamsa — the same standard a printed panchang uses. The divisional charts follow the classical varga divisions; the ashtakavarga totals to 337 points across twelve houses, exactly as the texts require, which is itself a check that the arithmetic is sound. Nothing here is a template: change one birth minute and every table changes with it. What the report cannot do is choose your work for you — it can only show you where your chart is already strong.","hi":"इस रिपोर्ट का हर आँकड़ा आपकी जन्मकुंडली से दृक्गणित और लाहिरी अयनांश द्वारा गणना किया गया है — वही मानक जो छपे पंचांग में होता है। वर्ग कुंडलियाँ शास्त्रीय वर्ग विभाजन से हैं; अष्टकवर्ग बारह भावों में ठीक 337 बिंदुओं तक जुड़ता है, जैसा शास्त्र कहते हैं — यह स्वयं इस बात की जाँच है कि गणित सही है। यहाँ कुछ भी बना-बनाया नहीं: जन्म का एक मिनट बदलिए, हर तालिका बदल जाएगी। रिपोर्ट जो नहीं कर सकती वह है आपका काम आपके लिए चुनना — वह केवल दिखा सकती है कि आपकी कुंडली कहाँ पहले से मज़बूत है।","te":"ఈ నివేదికలోని ప్రతి అంకె మీ జన్మ జాతకం నుండి దృక్ గణితం, లాహిరి అయనాంశంతో లెక్కించబడినది — ముద్రిత పంచాంగం వాడే అదే ప్రమాణం. వర్గ జాతకాలు శాస్త్రీయ వర్గ విభజన ప్రకారం; అష్టకవర్గం పన్నెండు భావాలకు సరిగ్గా 337 బిందువులకు కలుస్తుంది, శాస్త్రం చెప్పినట్టే — ఇదే గణితం సరిగ్గా ఉందనడానికి ఒక పరీక్ష. ఇక్కడ ఏదీ మూస కాదు: పుట్టిన నిమిషం మార్చండి, ప్రతి పట్టికా మారుతుంది. నివేదిక చేయలేనిది ఒక్కటే — మీ పనిని మీ కోసం ఎంచుకోవడం. మీ జాతకం ఎక్కడ ఇప్పటికే బలంగా ఉందో మాత్రమే అది చూపగలదు.","kn":"ಈ ವರದಿಯ ಪ್ರತಿ ಅಂಕಿಯೂ ನಿಮ್ಮ ಜನ್ಮ ಜಾತಕದಿಂದ ದೃಕ್ ಗಣಿತ ಮತ್ತು ಲಾಹಿರಿ ಅಯನಾಂಶದಿಂದ ಲೆಕ್ಕಿಸಲಾಗಿದೆ — ಮುದ್ರಿತ ಪಂಚಾಂಗ ಬಳಸುವ ಅದೇ ಮಾನದಂಡ. ವರ್ಗ ಜಾತಕಗಳು ಶಾಸ್ತ್ರೀಯ ವರ್ಗ ವಿಭಜನೆಯಂತೆ; ಅಷ್ಟಕವರ್ಗ ಹನ್ನೆರಡು ಭಾವಗಳಿಗೆ ನಿಖರವಾಗಿ 337 ಬಿಂದುಗಳಿಗೆ ಸೇರುತ್ತದೆ, ಶಾಸ್ತ್ರ ಹೇಳಿದಂತೆಯೇ — ಇದೇ ಗಣಿತ ಸರಿಯಿದೆ ಎಂಬುದಕ್ಕೆ ಒಂದು ಪರೀಕ್ಷೆ. ಇಲ್ಲಿ ಯಾವುದೂ ಸಿದ್ಧ ಮಾದರಿಯಲ್ಲ: ಹುಟ್ಟಿದ ಒಂದು ನಿಮಿಷ ಬದಲಿಸಿ, ಪ್ರತಿ ಕೋಷ್ಟಕವೂ ಬದಲಾಗುತ್ತದೆ. ವರದಿ ಮಾಡಲಾಗದ್ದು ಒಂದೇ — ನಿಮ್ಮ ಕೆಲಸವನ್ನು ನಿಮಗಾಗಿ ಆರಿಸುವುದು. ನಿಮ್ಮ ಜಾತಕ ಎಲ್ಲಿ ಈಗಾಗಲೇ ಬಲವಾಗಿದೆ ಎಂದಷ್ಟೇ ಅದು ತೋರಿಸಬಲ್ಲದು.","ta":"இந்த அறிக்கையின் ஒவ்வொரு எண்ணும் உங்கள் ஜென்ம ஜாதகத்திலிருந்து திருக்கணிதம் மற்றும் லாஹிரி அயனாம்சத்தால் கணக்கிடப்பட்டது — அச்சிடப்பட்ட பஞ்சாங்கம் பயன்படுத்தும் அதே தரநிலை. வர்க ஜாதகங்கள் சாஸ்திர வர்க பிரிவுகளின்படி; அஷ்டகவர்க்கம் பன்னிரண்டு பாவங்களுக்குச் சரியாக 337 புள்ளிகளாகச் சேர்கிறது, சாஸ்திரம் சொல்வது போலவே — இதுவே கணிதம் சரியானது என்பதற்கான ஒரு சோதனை. இங்கே எதுவும் வார்ப்புரு அல்ல: பிறந்த ஒரு நிமிடத்தை மாற்றுங்கள், ஒவ்வொரு அட்டவணையும் மாறும். அறிக்கையால் செய்ய முடியாதது ஒன்றே — உங்கள் வேலையை உங்களுக்காகத் தேர்ந்தெடுப்பது. உங்கள் ஜாதகம் எங்கே ஏற்கெனவே வலிமையாக உள்ளது என்பதை மட்டுமே அது காட்ட முடியும்.","bn":"এই রিপোর্টের প্রতিটি সংখ্যা আপনার জন্মকোষ্ঠী থেকে দৃকগণিত ও লাহিড়ী অয়নাংশে গণনা করা — ছাপা পঞ্জিকা যে মানই ব্যবহার করে। বর্গ কোষ্ঠীগুলি শাস্ত্রীয় বর্গ বিভাজন অনুযায়ী; অষ্টকবর্গ বারোটি ভাবে ঠিক 337 বিন্দুতে যোগ হয়, শাস্ত্র যেমন বলে — এটাই নিজে একটা প্রমাণ যে হিসেব ঠিক আছে। এখানে কিছুই ছাঁচে ঢালা নয়: জন্মের এক মিনিট বদলান, প্রতিটি টেবিল বদলে যাবে। রিপোর্ট যা পারে না তা হল আপনার কাজ আপনার হয়ে বেছে নেওয়া — সে শুধু দেখাতে পারে আপনার কোষ্ঠী কোথায় আগে থেকেই শক্তিশালী।","mr":"या अहवालातील प्रत्येक आकडा तुमच्या जन्मपत्रिकेतून दृक्गणित आणि लाहिरी अयनांशाने मोजलेला आहे — छापील पंचांग वापरते तोच मानक. वर्ग पत्रिका शास्त्रीय वर्ग विभाजनानुसार; अष्टकवर्ग बारा भावांत नेमके 337 बिंदूंपर्यंत जुळतो, शास्त्र सांगते तसेच — हीच स्वतः एक तपासणी आहे की गणित बरोबर आहे. इथे काहीही साचेबद्ध नाही: जन्माचे एक मिनिट बदला, प्रत्येक तक्ता बदलेल. अहवाल जे करू शकत नाही ते म्हणजे तुमचे काम तुमच्यासाठी निवडणे — तो फक्त दाखवू शकतो की तुमची पत्रिका कुठे आधीच मजबूत आहे.","gu":"આ અહેવાલનો દરેક આંકડો તમારી જન્મકુંડળીમાંથી દૃકગણિત અને લાહિરી અયનાંશથી ગણેલો છે — છપાયેલું પંચાંગ વાપરે છે એ જ ધોરણ. વર્ગ કુંડળી શાસ્ત્રીય વર્ગ વિભાજન પ્રમાણે; અષ્ટકવર્ગ બાર ભાવમાં બરાબર 337 બિંદુ સુધી ઉમેરાય છે, શાસ્ત્ર કહે છે તેમ જ — આ પોતે જ એક ચકાસણી છે કે ગણિત સાચું છે. અહીં કશું ઢાળેલું નથી: જન્મની એક મિનિટ બદલો, દરેક કોષ્ટક બદલાશે. અહેવાલ જે નથી કરી શકતો તે છે તમારું કામ તમારા વતી પસંદ કરવું — એ માત્ર બતાવી શકે છે કે તમારી કુંડળી ક્યાં પહેલેથી મજબૂત છે.","as":"এই প্ৰতিবেদনৰ প্ৰতিটো সংখ্যা আপোনাৰ জন্মকুণ্ডলীৰ পৰা দৃকগণিত আৰু লাহিৰী অয়নাংশেৰে গণনা কৰা — ছপা পঞ্জিকাই ব্যৱহাৰ কৰা সেই একেই মানদণ্ড। বৰ্গ কুণ্ডলীবোৰ শাস্ত্ৰীয় বৰ্গ বিভাজন অনুসৰি; অষ্টকবৰ্গ বাৰটা ভাৱত ঠিক 337 বিন্দুত যোগ হয়, শাস্ত্ৰই কোৱাৰ দৰেই — এইটোৱেই নিজে এটা পৰীক্ষা যে গণিত শুদ্ধ। ইয়াত একোৱেই সাঁচত ঢলা নহয়: জন্মৰ এক মিনিট সলনি কৰক, প্ৰতিখন তালিকা সলনি হ'ব। প্ৰতিবেদনে কৰিব নোৱাৰাটো হ'ল আপোনাৰ কাম আপোনাৰ হৈ বাছি লোৱা — ই কেৱল দেখুৱাব পাৰে আপোনাৰ কুণ্ডলী ক'ত আগৰে পৰাই মজবুত।"},"windowsTitle":{"en":"Your Career Windows — and Why","hi":"आपके कर्मजीवन के काल — और क्यों","te":"మీ వృత్తి కాలాలు — ఎందుకో కూడా","kn":"ನಿಮ್ಮ ವೃತ್ತಿ ಕಾಲಗಳು — ಏಕೆಂದೂ","ta":"உங்கள் தொழில் காலங்கள் — ஏன் என்பதுடன்","bn":"আপনার কর্মজীবনের সময় — এবং কেন","mr":"तुमच्या कर्मजीवनाचे काळ — आणि का","gu":"તમારા કર્મજીવનના સમય — અને શા માટે","as":"আপোনাৰ কৰ্মজীৱনৰ সময় — আৰু কিয়"},"windowsIntro":{"en":"Each window below is scored by counting how many classical significators support it — the dasha lords' relationship to your 10th house, the D10 chart, Jupiter's transit from your Moon. The reasons are listed so you can weigh them yourself rather than take the score on trust.","hi":"नीचे दिए हर काल को इस आधार पर अंक मिले हैं कि कितने शास्त्रीय कारक उसका समर्थन करते हैं — दशाधिपतियों का आपके दशम भाव से संबंध, दशांश कुंडली, आपके चंद्र से बृहस्पति का गोचर। कारण साथ में दिए हैं ताकि आप अंक पर भरोसा करने के बजाय खुद तौल सकें।","te":"క్రింది ప్రతి కాలానికీ ఎన్ని శాస్త్ర కారకాలు మద్దతిస్తున్నాయో లెక్కించి మార్కులు ఇవ్వబడ్డాయి — దశాధిపతులకు మీ దశమ భావంతో సంబంధం, దశాంశ జాతకం, మీ చంద్రుని నుండి గురు గోచారం. మార్కుపై నమ్మకం ఉంచే బదులు మీరే బేరీజు వేసుకోవడానికి కారణాలు కూడా ఇవ్వబడ్డాయి.","kn":"ಕೆಳಗಿನ ಪ್ರತಿ ಕಾಲಕ್ಕೂ ಎಷ್ಟು ಶಾಸ್ತ್ರ ಕಾರಕಗಳು ಬೆಂಬಲಿಸುತ್ತವೆ ಎಂದು ಎಣಿಸಿ ಅಂಕ ನೀಡಲಾಗಿದೆ — ದಶಾಧಿಪತಿಗಳಿಗೆ ನಿಮ್ಮ ದಶಮ ಭಾವದೊಂದಿಗಿನ ಸಂಬಂಧ, ದಶಾಂಶ ಜಾತಕ, ನಿಮ್ಮ ಚಂದ್ರನಿಂದ ಗುರುವಿನ ಗೋಚಾರ. ಅಂಕದ ಮೇಲೆ ನಂಬಿಕೆ ಇಡುವ ಬದಲು ನೀವೇ ತೂಗಿ ನೋಡಲು ಕಾರಣಗಳನ್ನೂ ಕೊಡಲಾಗಿದೆ.","ta":"கீழே உள்ள ஒவ்வொரு காலத்திற்கும் எத்தனை சாஸ்திரக் காரகங்கள் ஆதரிக்கின்றன என்பதைக் கணக்கிட்டு மதிப்பெண் அளித்துள்ளோம் — தசாதிபதிகளுக்கு உங்கள் பத்தாம் பாவத்துடனான தொடர்பு, தசாம்ச ஜாதகம், உங்கள் சந்திரனிலிருந்து குருவின் பெயர்ச்சி. மதிப்பெண்ணை நம்புவதற்குப் பதிலாக நீங்களே எடைபோட்டுப் பார்க்கக் காரணங்களையும் தந்துள்ளோம்.","bn":"নিচের প্রতিটি সময়কে এই ভিত্তিতে নম্বর দেওয়া হয়েছে যে কতগুলি শাস্ত্রীয় কারক তাকে সমর্থন করে — দশাধিপতিদের সঙ্গে আপনার দশম ভাবের সম্পর্ক, দশাংশ কোষ্ঠী, আপনার চন্দ্র থেকে বৃহস্পতির গোচর। নম্বরের উপর ভরসা করার বদলে আপনি নিজে বিচার করতে পারেন বলে কারণগুলিও দেওয়া হল।","mr":"खालील प्रत्येक काळाला किती शास्त्रीय कारक त्याला पाठिंबा देतात यावरून गुण दिले आहेत — दशाधिपतींचा तुमच्या दशम भावाशी संबंध, दशांश पत्रिका, तुमच्या चंद्रापासून गुरूचे गोचर. गुणांवर विश्वास ठेवण्याऐवजी तुम्ही स्वतः तोलून पाहावे म्हणून कारणेही दिली आहेत.","gu":"નીચેના દરેક સમયને એ આધારે ગુણ આપ્યા છે કે કેટલા શાસ્ત્રીય કારક તેને ટેકો આપે છે — દશાધિપતિઓનો તમારા દશમ ભાવ સાથેનો સંબંધ, દશાંશ કુંડળી, તમારા ચંદ્રથી ગુરુનું ગોચર. ગુણ પર ભરોસો રાખવાને બદલે તમે જાતે તોલી શકો એ માટે કારણો પણ આપ્યાં છે.","as":"তলৰ প্ৰতিটো সময়ক কিমান শাস্ত্ৰীয় কাৰকে সমৰ্থন কৰে তাৰ ভিত্তিত নম্বৰ দিয়া হৈছে — দশাধিপতিৰ সৈতে আপোনাৰ দশম ভাৱৰ সম্পৰ্ক, দশাংশ কুণ্ডলী, আপোনাৰ চন্দ্ৰৰ পৰা বৃহস্পতিৰ গোচৰ। নম্বৰৰ ওপৰত ভাৰসা কৰাৰ সলনি আপুনি নিজে জোখ-মাখ কৰিব পাৰে বুলি কাৰণবোৰো দিয়া হৈছে।"},"bavTitle":{"en":"Which Planets Back Your Tenth House","hi":"आपके दशम भाव को कौन से ग्रह बल देते हैं","te":"మీ దశమ భావానికి ఏ గ్రహాలు బలం ఇస్తున్నాయి","kn":"ನಿಮ್ಮ ದಶಮ ಭಾವಕ್ಕೆ ಯಾವ ಗ್ರಹಗಳು ಬಲ ನೀಡುತ್ತವೆ","ta":"உங்கள் பத்தாம் பாவத்திற்கு எந்தக் கிரகங்கள் பலம் தருகின்றன","bn":"আপনার দশম ভাবকে কোন গ্রহগুলি বল দেয়","mr":"तुमच्या दशम भावाला कोणते ग्रह बल देतात","gu":"તમારા દશમ ભાવને કયા ગ્રહ બળ આપે છે","as":"আপোনাৰ দশম ভাৱক কোনবোৰ গ্ৰহই বল দিয়ে"},"bavIntro":{"en":"Sarvashtakavarga gives the tenth house one combined score. Bhinnashtakavarga breaks it apart, planet by planet, so you can see which ones actually carry your working life. Saturn shows discipline and endurance, the Sun status and authority, Mercury skill and dealing, Jupiter growth and counsel. A planet with 5 or more points in the tenth is doing real work for you.","hi":"सर्वाष्टकवर्ग दशम भाव को एक कुल अंक देता है। भिन्नाष्टकवर्ग उसे ग्रह-दर-ग्रह खोलकर दिखाता है, ताकि आप देख सकें कि आपके कार्यजीवन को असल में कौन सँभाल रहा है। शनि अनुशासन और सहनशक्ति दिखाता है, सूर्य पद और अधिकार, बुध कौशल और लेन-देन, बृहस्पति वृद्धि और परामर्श। दशम भाव में 5 या अधिक बिंदु वाला ग्रह आपके लिए वास्तव में काम कर रहा है।","te":"సర్వాష్టకవర్గం దశమ భావానికి ఒక మొత్తం స్కోరు ఇస్తుంది. భిన్నాష్టకవర్గం దాన్ని గ్రహం వారీగా విడదీసి చూపుతుంది — మీ పని జీవితాన్ని నిజంగా ఎవరు మోస్తున్నారో తెలుసుకోవడానికి. శని క్రమశిక్షణ, సహనం చూపిస్తే, సూర్యుడు హోదా, అధికారం; బుధుడు నైపుణ్యం, వ్యవహారం; గురువు వృద్ధి, సలహా. దశమ భావంలో 5 లేదా అంతకంటే ఎక్కువ బిందువులున్న గ్రహం మీ కోసం నిజంగా పని చేస్తోంది.","kn":"ಸರ್ವಾಷ್ಟಕವರ್ಗ ದಶಮ ಭಾವಕ್ಕೆ ಒಂದು ಒಟ್ಟು ಅಂಕ ನೀಡುತ್ತದೆ. ಭಿನ್ನಾಷ್ಟಕವರ್ಗ ಅದನ್ನು ಗ್ರಹವಾರು ಬಿಡಿಸಿ ತೋರಿಸುತ್ತದೆ — ನಿಮ್ಮ ಕೆಲಸದ ಬದುಕನ್ನು ನಿಜವಾಗಿ ಯಾರು ಹೊತ್ತಿದ್ದಾರೆ ಎಂದು ತಿಳಿಯಲು. ಶನಿ ಶಿಸ್ತು ಮತ್ತು ಸಹನೆ ತೋರಿಸಿದರೆ, ಸೂರ್ಯ ಸ್ಥಾನ ಮತ್ತು ಅಧಿಕಾರ; ಬುಧ ಕೌಶಲ ಮತ್ತು ವ್ಯವಹಾರ; ಗುರು ಬೆಳವಣಿಗೆ ಮತ್ತು ಸಲಹೆ. ದಶಮ ಭಾವದಲ್ಲಿ 5 ಅಥವಾ ಹೆಚ್ಚು ಬಿಂದುಗಳಿರುವ ಗ್ರಹ ನಿಮಗಾಗಿ ನಿಜವಾಗಿ ಕೆಲಸ ಮಾಡುತ್ತಿದೆ.","ta":"சர்வாஷ்டகவர்க்கம் பத்தாம் பாவத்திற்கு ஒரே மொத்த மதிப்பெண் தருகிறது. பின்னாஷ்டகவர்க்கம் அதைக் கிரகம் வாரியாகப் பிரித்துக் காட்டுகிறது — உங்கள் வேலை வாழ்க்கையை உண்மையில் யார் தாங்குகிறார்கள் என்று அறிய. சனி ஒழுக்கமும் சகிப்பும் காட்டினால், சூரியன் அந்தஸ்தும் அதிகாரமும்; புதன் திறமையும் பரிவர்த்தனையும்; குரு வளர்ச்சியும் ஆலோசனையும். பத்தாம் பாவத்தில் 5 அல்லது அதற்கு மேல் புள்ளிகள் உள்ள கிரகம் உங்களுக்காக உண்மையிலேயே உழைக்கிறது.","bn":"সর্বাষ্টকবর্গ দশম ভাবকে একটি মোট নম্বর দেয়। ভিন্নাষ্টকবর্গ সেটাকে গ্রহ ধরে ধরে ভেঙে দেখায় — আপনার কাজের জীবনকে আসলে কে বইছে তা বোঝার জন্য। শনি দেখায় শৃঙ্খলা ও সহনশীলতা, সূর্য পদ ও কর্তৃত্ব, বুধ দক্ষতা ও লেনদেন, বৃহস্পতি বৃদ্ধি ও পরামর্শ। দশম ভাবে 5 বা তার বেশি বিন্দু থাকা গ্রহ আপনার জন্য সত্যিই কাজ করছে।","mr":"सर्वाष्टकवर्ग दशम भावाला एक एकूण गुण देतो. भिन्नाष्टकवर्ग तो ग्रहानुसार उलगडून दाखवतो — तुमचे कामाचे आयुष्य खरोखर कोण पेलतो आहे हे कळण्यासाठी. शनी शिस्त आणि सहनशक्ती दाखवतो, सूर्य पद आणि अधिकार, बुध कौशल्य आणि व्यवहार, गुरु वाढ आणि सल्ला. दशम भावात 5 किंवा अधिक बिंदू असलेला ग्रह तुमच्यासाठी खरोखर काम करतो आहे.","gu":"સર્વાષ્ટકવર્ગ દશમ ભાવને એક કુલ ગુણ આપે છે. ભિન્નાષ્ટકવર્ગ એને ગ્રહ પ્રમાણે ખોલીને બતાવે છે — તમારું કામનું જીવન ખરેખર કોણ ઉપાડે છે એ જાણવા. શનિ શિસ્ત અને સહનશક્તિ બતાવે, સૂર્ય પદ અને અધિકાર, બુધ કૌશલ્ય અને વ્યવહાર, ગુરુ વૃદ્ધિ અને સલાહ. દશમ ભાવમાં 5 કે વધુ બિંદુ ધરાવતો ગ્રહ તમારા માટે ખરેખર કામ કરે છે.","as":"সৰ্বাষ্টকবৰ্গই দশম ভাৱক এটা মুঠ নম্বৰ দিয়ে। ভিন্নাষ্টকবৰ্গই সেয়া গ্ৰহ ধৰি ধৰি ভাঙি দেখুৱায় — আপোনাৰ কামৰ জীৱন সঁচাকৈ কোনে বৈ আছে জানিবলৈ। শনিয়ে শৃংখলা আৰু সহনশীলতা দেখুৱায়, সূৰ্যই পদ আৰু অধিকাৰ, বুধে দক্ষতা আৰু লেনদেন, বৃহস্পতিয়ে বিকাশ আৰু পৰামৰ্শ। দশম ভাৱত 5 বা তাতোধিক বিন্দু থকা গ্ৰহই আপোনাৰ বাবে সঁচাকৈ কাম কৰি আছে।"},"dashaTitleV2":{"en":"Your Dasha Periods Ahead","hi":"आगे आने वाली आपकी दशाएँ","te":"మీ రాబోయే దశలు","kn":"ನಿಮ್ಮ ಮುಂದಿನ ದಶೆಗಳು","ta":"உங்கள் வரவிருக்கும் தசைகள்","bn":"আপনার আসন্ন দশা","mr":"तुमच्या पुढील दशा","gu":"તમારી આગામી દશા","as":"আপোনাৰ অহা দশাবোৰ"},"dashaIntroV2":{"en":"The Vimshottari dasha divides a life into periods ruled by each planet in turn. Below are your sub-periods ahead, with the planet governing each — read them as weather, not as instructions.","hi":"विंशोत्तरी दशा जीवन को उन कालों में बाँटती है जिन पर बारी-बारी से हर ग्रह का शासन होता है। नीचे आगे आने वाली आपकी अंतर्दशाएँ हैं, हर एक पर शासन करने वाले ग्रह के साथ — इन्हें निर्देश नहीं, मौसम की तरह पढ़िए।","te":"వింశోత్తరి దశ జీవితాన్ని ఒక్కో గ్రహం వంతుల వారీగా పాలించే కాలాలుగా విభజిస్తుంది. క్రింద మీ రాబోయే అంతర్దశలు ఉన్నాయి, ప్రతిదానినీ పాలించే గ్రహంతో సహా — వీటిని ఆదేశాలుగా కాక వాతావరణంలా చదవండి.","kn":"ವಿಂಶೋತ್ತರಿ ದಶಾ ಬದುಕನ್ನು ಒಂದೊಂದು ಗ್ರಹವೂ ಸರದಿಯಂತೆ ಆಳುವ ಕಾಲಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ. ಕೆಳಗೆ ನಿಮ್ಮ ಮುಂದಿನ ಅಂತರ್ದಶೆಗಳಿವೆ, ಪ್ರತಿಯೊಂದನ್ನೂ ಆಳುವ ಗ್ರಹದೊಂದಿಗೆ — ಇವನ್ನು ಆದೇಶಗಳಾಗಿ ಅಲ್ಲ, ಹವಾಮಾನದಂತೆ ಓದಿ.","ta":"விம்சோத்தரி தசை வாழ்க்கையை ஒவ்வொரு கிரகமும் முறையாக ஆளும் காலங்களாகப் பிரிக்கிறது. கீழே உங்கள் வரவிருக்கும் அந்தர்தசைகள் உள்ளன, ஒவ்வொன்றையும் ஆளும் கிரகத்துடன் — இவற்றைக் கட்டளைகளாக அல்ல, வானிலையாகப் படியுங்கள்.","bn":"বিংশোত্তরী দশা জীবনকে সেই কালে ভাগ করে যেখানে পালা করে প্রতিটি গ্রহ শাসন করে। নিচে আপনার আসন্ন অন্তর্দশাগুলি, প্রতিটির শাসক গ্রহ সহ — এগুলিকে নির্দেশ নয়, আবহাওয়ার মতো পড়ুন।","mr":"विंशोत्तरी दशा आयुष्याला अशा काळांत विभागते जिथे आळीपाळीने प्रत्येक ग्रह राज्य करतो. खाली तुमच्या पुढील अंतर्दशा आहेत, प्रत्येकावर राज्य करणाऱ्या ग्रहासह — त्या सूचना म्हणून नव्हे, हवामानासारख्या वाचा.","gu":"વિંશોત્તરી દશા જીવનને એવા કાળમાં વહેંચે છે જ્યાં વારાફરતી દરેક ગ્રહ શાસન કરે છે. નીચે તમારી આગામી અંતર્દશા છે, દરેક પર શાસન કરતા ગ્રહ સાથે — એને સૂચના તરીકે નહીં, હવામાનની જેમ વાંચો.","as":"বিংশোত্তৰী দশাই জীৱনক এনে কালত ভাগ কৰে য'ত পাল পাতি প্ৰতিটো গ্ৰহই শাসন কৰে। তলত আপোনাৰ অহা অন্তৰ্দশাবোৰ আছে, প্ৰতিটোৰ শাসক গ্ৰহৰ সৈতে — এইবোৰক নিৰ্দেশ নহয়, বতৰৰ দৰে পঢ়ক।"}},"jp":{"page1Title":{"en":"Your Birth Identity","hi":"आपका जन्म परिचय","te":"మీ జన్మ పరిచయం","kn":"ನಿಮ್ಮ ಜನ್ಮ ಪರಿಚಯ","ta":"உங்கள் ஜென்ம அறிமுகம்","bn":"আপনার জন্ম পরিচয়","mr":"तुमचा जन्म परिचय","gu":"તમારો જન્મ પરિચય","as":"আপোনাৰ জন্ম পৰিচয়"},"page1Intro":{"en":"Every calculation in this report starts from the five rows below. They are the traditional Avakahada Chakra — the block a printed kundli has opened with for generations — and each value is computed from your birth moment, not selected from a list.","hi":"इस रिपोर्ट की हर गणना नीचे दी गई पंक्तियों से शुरू होती है। यह पारंपरिक अवकहड़ा चक्र है — वही खंड जिससे छपी कुंडली पीढ़ियों से आरंभ होती आई है — और हर मान आपके जन्म क्षण से गणना किया गया है, किसी सूची से चुना नहीं गया।","te":"ఈ నివేదికలోని ప్రతి లెక్కా క్రింది వరుసల నుండే మొదలవుతుంది. ఇది సంప్రదాయ అవకహడ చక్రం — ముద్రిత జాతకం తరతరాలుగా దీనితోనే మొదలవుతూ వచ్చింది — ప్రతి విలువా మీ జన్మ క్షణం నుండి లెక్కించినది, ఏ జాబితా నుండీ ఎంచుకున్నది కాదు.","kn":"ಈ ವರದಿಯ ಪ್ರತಿ ಲೆಕ್ಕವೂ ಕೆಳಗಿನ ಸಾಲುಗಳಿಂದಲೇ ಆರಂಭವಾಗುತ್ತದೆ. ಇದು ಸಂಪ್ರದಾಯದ ಅವಕಹಡ ಚಕ್ರ — ಮುದ್ರಿತ ಜಾತಕ ತಲೆಮಾರುಗಳಿಂದ ಇದರಿಂದಲೇ ಆರಂಭವಾಗುತ್ತಾ ಬಂದಿದೆ — ಪ್ರತಿ ಮೌಲ್ಯವೂ ನಿಮ್ಮ ಜನ್ಮ ಕ್ಷಣದಿಂದ ಲೆಕ್ಕಿಸಿದ್ದು, ಯಾವುದೇ ಪಟ್ಟಿಯಿಂದ ಆರಿಸಿದ್ದಲ್ಲ.","ta":"இந்த அறிக்கையின் ஒவ்வொரு கணக்கும் கீழே உள்ள வரிசைகளிலிருந்தே தொடங்குகிறது. இது பாரம்பரிய அவகஹட சக்கரம் — அச்சிடப்பட்ட ஜாதகம் தலைமுறைகளாக இதிலிருந்தே தொடங்கி வருகிறது — ஒவ்வொரு மதிப்பும் உங்கள் பிறந்த கணத்திலிருந்து கணக்கிடப்பட்டது, எந்தப் பட்டியலிலிருந்தும் தேர்ந்தெடுக்கப்பட்டதல்ல.","bn":"এই রিপোর্টের প্রতিটি গণনা নিচের সারিগুলি থেকেই শুরু হয়। এটি পরম্পরাগত অবকহড় চক্র — ছাপা কোষ্ঠী প্রজন্মের পর প্রজন্ম এটি দিয়েই শুরু হয়ে আসছে — আর প্রতিটি মান আপনার জন্মমুহূর্ত থেকে গণনা করা, কোনো তালিকা থেকে বেছে নেওয়া নয়।","mr":"या अहवालातील प्रत्येक गणना खालील ओळींपासूनच सुरू होते. हे पारंपरिक अवकहडा चक्र आहे — छापील पत्रिका पिढ्यानपिढ्या याच्यानेच सुरू होत आली आहे — आणि प्रत्येक मूल्य तुमच्या जन्मक्षणापासून मोजलेले आहे, कोणत्याही यादीतून निवडलेले नाही.","gu":"આ અહેવાલની દરેક ગણતરી નીચેની પંક્તિઓથી જ શરૂ થાય છે. આ પરંપરાગત અવકહડા ચક્ર છે — છપાયેલી કુંડળી પેઢી દર પેઢી આનાથી જ શરૂ થતી આવી છે — અને દરેક મૂલ્ય તમારી જન્મક્ષણથી ગણેલું છે, કોઈ યાદીમાંથી પસંદ કરેલું નથી.","as":"এই প্ৰতিবেদনৰ প্ৰতিটো গণনা তলৰ শাৰীবোৰৰ পৰাই আৰম্ভ হয়। এইটো পৰম্পৰাগত অৱকহড় চক্ৰ — ছপা কুণ্ডলী প্ৰজন্মৰ পাছত প্ৰজন্ম ইয়াৰ পৰাই আৰম্ভ হৈ আহিছে — আৰু প্ৰতিটো মান আপোনাৰ জন্ম মুহূৰ্তৰ পৰা গণনা কৰা, কোনো তালিকাৰ পৰা বাছি লোৱা নহয়।"},"page2Title":{"en":"The Sky at Your Birth","hi":"आपके जन्म के समय का आकाश","te":"మీ జన్మ సమయంలోని ఆకాశం","kn":"ನಿಮ್ಮ ಜನ್ಮ ಸಮಯದ ಆಕಾಶ","ta":"உங்கள் பிறந்த நேரத்து வானம்","bn":"আপনার জন্মের সময়কার আকাশ","mr":"तुमच्या जन्मवेळचे आकाश","gu":"તમારા જન્મ સમયનું આકાશ","as":"আপোনাৰ জন্মৰ সময়ৰ আকাশ"},"page2Intro":{"en":"Your birth panchang is permanent — a cosmic timestamp that never changes and belongs to no one else. Below is the sky exactly as it stood, with the nine grahas in their signs and houses.","hi":"आपका जन्म पंचांग स्थायी है — एक ऐसी खगोलीय मुहर जो कभी नहीं बदलती और किसी और की नहीं होती। नीचे आकाश ठीक वैसा ही है जैसा उस क्षण था, नौ ग्रह अपनी राशियों और भावों में।","te":"మీ జన్మ పంచాంగం శాశ్వతం — ఎప్పటికీ మారని, మరెవరికీ చెందని ఖగోళ ముద్ర. క్రింద ఆ క్షణంలో ఆకాశం ఎలా ఉందో అలాగే ఉంది, తొమ్మిది గ్రహాలూ వాటి రాశులు, భావాలతో.","kn":"ನಿಮ್ಮ ಜನ್ಮ ಪಂಚಾಂಗ ಶಾಶ್ವತ — ಎಂದಿಗೂ ಬದಲಾಗದ, ಬೇರೆ ಯಾರಿಗೂ ಸೇರದ ಖಗೋಳ ಮುದ್ರೆ. ಕೆಳಗೆ ಆ ಕ್ಷಣದಲ್ಲಿ ಆಕಾಶ ಹೇಗಿತ್ತೋ ಹಾಗೆಯೇ ಇದೆ, ಒಂಬತ್ತು ಗ್ರಹಗಳೂ ಅವುಗಳ ರಾಶಿ ಮತ್ತು ಭಾವಗಳೊಂದಿಗೆ.","ta":"உங்கள் ஜென்ம பஞ்சாங்கம் நிரந்தரம் — ஒருபோதும் மாறாத, வேறு யாருக்கும் சொந்தமில்லாத வானியல் முத்திரை. கீழே அந்தக் கணத்தில் வானம் எப்படி இருந்ததோ அப்படியே உள்ளது, ஒன்பது கிரகங்களும் அவற்றின் ராசிகள், பாவங்களுடன்.","bn":"আপনার জন্ম পঞ্জিকা স্থায়ী — এমন এক মহাজাগতিক ছাপ যা কখনও বদলায় না এবং অন্য কারও নয়। নিচে আকাশ ঠিক তেমনই আছে যেমন সেই মুহূর্তে ছিল, নয়টি গ্রহ তাদের রাশি ও ভাবে।","mr":"तुमचे जन्म पंचांग कायमस्वरूपी आहे — कधीही न बदलणारी, दुसऱ्या कोणाचीही नसलेली एक खगोलीय मुद्रा. खाली आकाश अगदी तसेच आहे जसे त्या क्षणी होते, नऊ ग्रह त्यांच्या राशी आणि भावांसह.","gu":"તમારું જન્મ પંચાંગ કાયમી છે — ક્યારેય ન બદલાતી, બીજા કોઈની ન હોય એવી ખગોળીય મુદ્રા. નીચે આકાશ બરાબર એવું જ છે જેવું એ ક્ષણે હતું, નવ ગ્રહ તેમની રાશિ અને ભાવ સાથે.","as":"আপোনাৰ জন্ম পঞ্জিকা স্থায়ী — কেতিয়াও নসলোৱা, আন কাৰো নহয় এনে এক খগোলীয় ছাপ। তলত আকাশ ঠিক তেনেকুৱাই আছে যেনেকুৱা সেই মুহূৰ্তত আছিল, ন টা গ্ৰহ সিহঁতৰ ৰাশি আৰু ভাৱত।"},"lagnaLbl":{"en":"Ascendant (Lagna)","hi":"लग्न","te":"లగ్నం","kn":"ಲಗ್ನ","ta":"லக்னம்","bn":"লগ্ন","mr":"लग्न","gu":"લગ્ન","as":"লগ্ন"},"moonRashiLbl":{"en":"Moon Sign (Rashi)","hi":"चंद्रराशि","te":"చంద్రరాశి","kn":"ಚಂದ್ರರಾಶಿ","ta":"சந்திர ராசி","bn":"চন্দ্ররাশি","mr":"चंद्रराशी","gu":"ચંદ્રરાશિ","as":"চন্দ্ৰৰাশি"},"nakLbl":{"en":"Birth Star (Nakshatra) & Pada","hi":"जन्म नक्षत्र और पाद","te":"జన్మ నక్షత్రం, పాదం","kn":"ಜನ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ಪಾದ","ta":"ஜென்ம நட்சத்திரமும் பாதமும","bn":"জন্ম নক্ষত্র ও পাদ","mr":"जन्म नक्षत्र आणि चरण","gu":"જન્મ નક્ષત્ર અને પાદ","as":"জন্ম নক্ষত্ৰ আৰু পাদ"},"namLbl":{"en":"Naming Syllable","hi":"नामाक्षर","te":"నామాక్షరం","kn":"ನಾಮಾಕ್ಷರ","ta":"நாமாட்சரம்","bn":"নামাক্ষর","mr":"नामाक्षर","gu":"નામાક્ષર","as":"নামাক্ষৰ"},"dashaBalLbl":{"en":"Dasha Balance at Birth","hi":"जन्म के समय दशा शेष","te":"జన్మ సమయంలో దశా శేషం","kn":"ಜನ್ಮ ಸಮಯದಲ್ಲಿ ದಶಾ ಶೇಷ","ta":"பிறக்கும்போது தசை மீதம்","bn":"জন্মের সময় দশা শেষ","mr":"जन्मवेळी दशा शिल्लक","gu":"જન્મ સમયે દશા બાકી","as":"জন্মৰ সময়ত দশা বাকী"},"yearsLbl":{"en":"years","hi":"वर्ष","te":"సంవత్సరాలు","kn":"ವರ್ಷ","ta":"ஆண்டுகள்","bn":"বছর","mr":"वर्षे","gu":"વર્ષ","as":"বছৰ"},"panchangLbl":{"en":"Birth Panchang","hi":"जन्म पंचांग","te":"జన్మ పంచాంగం","kn":"ಜನ್ಮ ಪಂಚಾಂಗ","ta":"ஜென்ம பஞ்சாங்கம்","bn":"জন্ম পঞ্জিকা","mr":"जन्म पंचांग","gu":"જન્મ પંચાંગ","as":"জন্ম পঞ্জিকা"},"masaLbl":{"en":"Lunar Month","hi":"चांद्र मास","te":"చాంద్ర మాసం","kn":"ಚಾಂದ್ರ ಮಾಸ","ta":"சாந்திர மாதம்","bn":"চান্দ্র মাস","mr":"चांद्र मास","gu":"ચાંદ્ર માસ","as":"চান্দ্ৰ মাহ"},"samvatLbl":{"en":"Vikram Samvat","hi":"विक्रम संवत","te":"వિక్రమ శకం","kn":"ವಿಕ್ರಮ ಶಕ","ta":"விக்ரம சகம்","bn":"বিক্রম সংবৎ","mr":"विक्रम संवत","gu":"વિક્રમ સંવત","as":"বিক্ৰম সংবৎ"},"grahaTableLbl":{"en":"The Nine Grahas at Birth","hi":"जन्म के समय नौ ग्रह","te":"జన్మ సమయంలో నవగ్రహాలు","kn":"ಜನ್ಮ ಸಮಯದಲ್ಲಿ ನವಗ್ರಹಗಳು","ta":"பிறக்கும்போது நவகிரகங்கள்","bn":"জন্মের সময় নবগ্রহ","mr":"जन्मवेळी नवग्रह","gu":"જન્મ સમયે નવગ્રહ","as":"জন্মৰ সময়ত নৱগ্ৰহ"},"methodNote":{"en":"Computed by Drik Ganita using the Lahiri (Chitrapaksha) ayanamsa — the same standard a printed panchang follows. Every value above can be checked against any reliable panchang.","hi":"दृक्गणित द्वारा लाहिरी (चित्रपक्ष) अयनांश से गणना — वही मानक जो छपे पंचांग में होता है। ऊपर दिया गया हर मान किसी भी विश्वसनीय पंचांग से मिलाया जा सकता है।","te":"దృక్ గణితం, లాహిరి (చిత్రపక్ష) అయనాంశంతో లెక్కించినది — ముద్రిత పంచాంగం అనుసరించే అదే ప్రమాణం. పైన ఉన్న ప్రతి విలువనూ మీరు నమ్మదగిన ఏ పంచాంగంతోనైనా సరిపోల్చుకోవచ్చు.","kn":"ದೃಕ್ ಗಣಿತ, ಲಾಹಿರಿ (ಚಿತ್ರಪಕ್ಷ) ಅಯನಾಂಶದಿಂದ ಲೆಕ್ಕಿಸಿದ್ದು — ಮುದ್ರಿತ ಪಂಚಾಂಗ ಅನುಸರಿಸುವ ಅದೇ ಮಾನದಂಡ. ಮೇಲಿನ ಪ್ರತಿ ಮೌಲ್ಯವನ್ನೂ ನೀವು ವಿಶ್ವಾಸಾರ್ಹ ಪಂಚಾಂಗದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಬಹುದು.","ta":"திருக்கணிதம், லாஹிரி (சித்திரபக்ஷ) அயனாம்சத்துடன் கணக்கிடப்பட்டது — அச்சிடப்பட்ட பஞ்சாங்கம் பின்பற்றும் அதே தரநிலை. மேலே உள்ள ஒவ்வொரு மதிப்பையும் நீங்கள் நம்பகமான பஞ்சாங்கத்துடன் சரிபார்க்கலாம்.","bn":"দৃকগণিতে, লাহিড়ী (চিত্রপক্ষ) অয়নাংশ দিয়ে গণনা করা — ছাপা পঞ্জিকা যে মানই অনুসরণ করে। উপরের প্রতিটি মান আপনি বিশ্বাসযোগ্য যেকোনো পঞ্জিকার সঙ্গে মিলিয়ে নিতে পারেন।","mr":"दृक्गणिताने, लाहिरी (चित्रपक्ष) अयनांशासह मोजलेले — छापील पंचांग जो मानक पाळते तोच. वरील प्रत्येक मूल्य तुम्ही विश्वसनीय पंचांगाशी ताडून पाहू शकता.","gu":"દૃકગણિતથી, લાહિરી (ચિત્રપક્ષ) અયનાંશ સાથે ગણેલું — છપાયેલું પંચાંગ જે ધોરણ પાળે છે એ જ. ઉપરનું દરેક મૂલ્ય તમે વિશ્વસનીય પંચાંગ સાથે મેળવી શકો છો.","as":"দৃকগণিতেৰে, লাহিৰী (চিত্ৰপক্ষ) অয়নাংশৰ সৈতে গণনা কৰা — ছপা পঞ্জিকাই মানি চলা সেই একেই মানদণ্ড। ওপৰৰ প্ৰতিটো মান আপুনি বিশ্বাসযোগ্য যিকোনো পঞ্জিকাৰ সৈতে মিলাই চাব পাৰে।"},"careerHighlight":{"en":"Your nakshatra and ascendant are highlighted: the D10 career analysis later in this report is computed from exactly these two rows.","hi":"आपका नक्षत्र और लग्न रेखांकित हैं: इस रिपोर्ट में आगे दिया गया दशांश कर्मजीवन विश्लेषण ठीक इन्हीं दो पंक्तियों से गणना किया गया है।","te":"మీ నక్షత్రం, లగ్నం గుర్తించబడ్డాయి: ఈ నివేదికలో ముందుకు వచ్చే దశాంశ వృత్తి విశ్లేషణ సరిగ్గా ఈ రెండు వరుసల నుండే లెక్కించినది.","kn":"ನಿಮ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ಲಗ್ನ ಗುರುತಿಸಲಾಗಿದೆ: ಈ ವರದಿಯಲ್ಲಿ ಮುಂದೆ ಬರುವ ದಶಾಂಶ ವೃತ್ತಿ ವಿಶ್ಲೇಷಣೆ ನಿಖರವಾಗಿ ಈ ಎರಡು ಸಾಲುಗಳಿಂದಲೇ ಲೆಕ್ಕಿಸಿದ್ದು.","ta":"உங்கள் நட்சத்திரமும் லக்னமும் குறிக்கப்பட்டுள்ளன: இந்த அறிக்கையில் பின்னர் வரும் தசாம்ச தொழில் பகுப்பாய்வு சரியாக இந்த இரு வரிசைகளிலிருந்தே கணக்கிடப்பட்டது.","bn":"আপনার নক্ষত্র ও লগ্ন চিহ্নিত: এই রিপোর্টে পরে আসা দশাংশ কর্মজীবন বিশ্লেষণ ঠিক এই দুটি সারি থেকেই গণনা করা।","mr":"तुमचे नक्षत्र आणि लग्न अधोरेखित आहेत: या अहवालात पुढे येणारे दशांश कर्मजीवन विश्लेषण नेमके याच दोन ओळींपासून मोजलेले आहे.","gu":"તમારું નક્ષત્ર અને લગ્ન અધોરેખિત છે: આ અહેવાલમાં આગળ આવતું દશાંશ કર્મજીવન વિશ્લેષણ બરાબર આ જ બે પંક્તિઓથી ગણેલું છે.","as":"আপোনাৰ নক্ষত্ৰ আৰু লগ্ন চিহ্নিত: এই প্ৰতিবেদনত পিছত অহা দশাংশ কৰ্মজীৱন বিশ্লেষণ ঠিক এই দুটা শাৰীৰ পৰাই গণনা কৰা।"},"page1IntroV2":{"en":"Every calculation in this report starts from the key birth details below. They are the traditional Avakahada Chakra — the block a printed kundli has opened with for generations — and each value is computed from your birth moment, not selected from a list.","hi":"इस रिपोर्ट की हर गणना नीचे दिए गए मुख्य जन्म विवरणों से शुरू होती है। यह पारंपरिक अवकहड़ा चक्र है — वही खंड जिससे छपी कुंडली पीढ़ियों से आरंभ होती आई है — और हर मान आपके जन्म क्षण से गणना किया गया है, किसी सूची से चुना नहीं गया।","te":"ఈ నివేదికలోని ప్రతి లెక్కా క్రింది ముఖ్య జనన వివరాల నుండే మొదలవుతుంది. ఇది సంప్రదాయ అవకహడ చక్రం — ముద్రిత జాతకం తరతరాలుగా దీనితోనే మొదలవుతూ వచ్చింది — ప్రతి విలువా మీ జన్మ క్షణం నుండి లెక్కించినది, ఏ జాబితా నుండీ ఎంచుకున్నది కాదు.","kn":"ಈ ವರದಿಯ ಪ್ರತಿ ಲೆಕ್ಕವೂ ಕೆಳಗಿನ ಮುಖ್ಯ ಜನನ ವಿವರಗಳಿಂದಲೇ ಆರಂಭವಾಗುತ್ತದೆ. ಇದು ಸಂಪ್ರದಾಯದ ಅವಕಹಡ ಚಕ್ರ — ಮುದ್ರಿತ ಜಾತಕ ತಲೆಮಾರುಗಳಿಂದ ಇದರಿಂದಲೇ ಆರಂಭವಾಗುತ್ತಾ ಬಂದಿದೆ — ಪ್ರತಿ ಮೌಲ್ಯವೂ ನಿಮ್ಮ ಜನ್ಮ ಕ್ಷಣದಿಂದ ಲೆಕ್ಕಿಸಿದ್ದು, ಯಾವುದೇ ಪಟ್ಟಿಯಿಂದ ಆರಿಸಿದ್ದಲ್ಲ.","ta":"இந்த அறிக்கையின் ஒவ்வொரு கணக்கும் கீழே உள்ள முக்கியப் பிறப்பு விவரங்களிலிருந்தே தொடங்குகிறது. இது பாரம்பரிய அவகஹட சக்கரம் — அச்சிடப்பட்ட ஜாதகம் தலைமுறைகளாக இதிலிருந்தே தொடங்கி வருகிறது — ஒவ்வொரு மதிப்பும் உங்கள் பிறந்த கணத்திலிருந்து கணக்கிடப்பட்டது, எந்தப் பட்டியலிலிருந்தும் தேர்ந்தெடுக்கப்பட்டதல்ல.","bn":"এই রিপোর্টের প্রতিটি গণনা নিচের মূল জন্মবিবরণ থেকেই শুরু হয়। এটি পরম্পরাগত অবকহড় চক্র — ছাপা কোষ্ঠী প্রজন্মের পর প্রজন্ম এটি দিয়েই শুরু হয়ে আসছে — আর প্রতিটি মান আপনার জন্মমুহূর্ত থেকে গণনা করা, কোনো তালিকা থেকে বেছে নেওয়া নয়।","mr":"या अहवालातील प्रत्येक गणना खालील मुख्य जन्मतपशिलांपासूनच सुरू होते. हे पारंपरिक अवकहडा चक्र आहे — छापील पत्रिका पिढ्यानपिढ्या याच्यानेच सुरू होत आली आहे — आणि प्रत्येक मूल्य तुमच्या जन्मक्षणापासून मोजलेले आहे, कोणत्याही यादीतून निवडलेले नाही.","gu":"આ અહેવાલની દરેક ગણતરી નીચેની મુખ્ય જન્મવિગતોથી જ શરૂ થાય છે. આ પરંપરાગત અવકહડા ચક્ર છે — છપાયેલી કુંડળી પેઢી દર પેઢી આનાથી જ શરૂ થતી આવી છે — અને દરેક મૂલ્ય તમારી જન્મક્ષણથી ગણેલું છે, કોઈ યાદીમાંથી પસંદ કરેલું નથી.","as":"এই প্ৰতিবেদনৰ প্ৰতিটো গণনা তলৰ মুখ্য জন্মবিৱৰণৰ পৰাই আৰম্ভ হয়। এইটো পৰম্পৰাগত অৱকহড় চক্ৰ — ছপা কুণ্ডলী প্ৰজন্মৰ পাছত প্ৰজন্ম ইয়াৰ পৰাই আৰম্ভ হৈ আহিছে — আৰু প্ৰতিটো মান আপোনাৰ জন্ম মুহূৰ্তৰ পৰা গণনা কৰা, কোনো তালিকাৰ পৰা বাছি লোৱা নহয়।"},"muhurtaHighlight":{"en":"Your nakshatra and Moon sign are highlighted: every window in this report is screened against these two rows — the same birth star and Moon sign a family priest would ask for first.","hi":"आपका नक्षत्र और चंद्रराशि रेखांकित हैं: इस रिपोर्ट का हर मुहूर्त इन्हीं दो पंक्तियों के विरुद्ध जाँचा गया है — वही जन्म नक्षत्र और चंद्रराशि जो घर के पुरोहित सबसे पहले पूछते हैं।","te":"మీ నక్షత్రం, చంద్రరాశి గుర్తించబడ్డాయి: ఈ నివేదికలోని ప్రతి ముహూర్తమూ ఈ రెండు వరుసలతో సరిచూడబడింది — ఇంటి పురోహితుడు ముందుగా అడిగే అదే జన్మ నక్షత్రం, చంద్రరాశి.","kn":"ನಿಮ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ಚಂದ್ರರಾಶಿ ಗುರುತಿಸಲಾಗಿದೆ: ಈ ವರದಿಯ ಪ್ರತಿ ಮುಹೂರ್ತವನ್ನೂ ಈ ಎರಡು ಸಾಲುಗಳ ವಿರುದ್ಧ ಪರಿಶೀಲಿಸಲಾಗಿದೆ — ಮನೆಯ ಪುರೋಹಿತರು ಮೊದಲು ಕೇಳುವ ಅದೇ ಜನ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ಚಂದ್ರರಾಶಿ.","ta":"உங்கள் நட்சத்திரமும் சந்திர ராசியும் குறிக்கப்பட்டுள்ளன: இந்த அறிக்கையின் ஒவ்வொரு முகூர்த்தமும் இந்த இரு வரிசைகளுக்கு எதிராகச் சரிபார்க்கப்பட்டது — வீட்டுப் புரோகிதர் முதலில் கேட்கும் அதே ஜென்ம நட்சத்திரமும் சந்திர ராசியும்.","bn":"আপনার নক্ষত্র ও চন্দ্ররাশি চিহ্নিত: এই রিপোর্টের প্রতিটি মুহূর্ত এই দুটি সারির সঙ্গে মিলিয়ে যাচাই করা — বাড়ির পুরোহিত যে জন্ম নক্ষত্র ও চন্দ্ররাশি প্রথমেই জানতে চান, সেই দুটিই।","mr":"तुमचे नक्षत्र आणि चंद्रराशी अधोरेखित आहेत: या अहवालातील प्रत्येक मुहूर्त याच दोन ओळींशी ताडून पाहिलेला आहे — घरचे गुरुजी सर्वात आधी विचारतात तेच जन्म नक्षत्र आणि चंद्रराशी.","gu":"તમારું નક્ષત્ર અને ચંદ્રરાશિ અધોરેખિત છે: આ અહેવાલનું દરેક મુહૂર્ત આ જ બે પંક્તિઓ સામે ચકાસેલું છે — ઘરના ગોર મહારાજ સૌથી પહેલાં પૂછે છે એ જ જન્મ નક્ષત્ર અને ચંદ્રરાશિ.","as":"আপোনাৰ নক্ষত্ৰ আৰু চন্দ্ৰৰাশি চিহ্নিত: এই প্ৰতিবেদনৰ প্ৰতিটো মুহূৰ্ত এই দুটা শাৰীৰ সৈতে মিলাই পৰীক্ষা কৰা — ঘৰৰ পুৰোহিতে প্ৰথমেই সোধা সেই জন্ম নক্ষত্ৰ আৰু চন্দ্ৰৰাশিয়েই।"},"childHighlight":{"en":"The naming syllable row is highlighted: it comes from the birth star and pada above, and the naming page later in this report is built from exactly that.","hi":"नामाक्षर की पंक्ति रेखांकित है: वह ऊपर दिए जन्म नक्षत्र और पाद से आती है, और इस रिपोर्ट में आगे दिया गया नामकरण पृष्ठ ठीक उसी से बना है।","te":"నామాక్షర వరుస గుర్తించబడింది: అది పైన ఉన్న జన్మ నక్షత్రం, పాదం నుండి వచ్చినది, ఈ నివేదికలో ముందుకు వచ్చే నామకరణ పేజీ సరిగ్గా దాని నుండే రూపొందింది.","kn":"ನಾಮಾಕ್ಷರ ಸಾಲು ಗುರುತಿಸಲಾಗಿದೆ: ಅದು ಮೇಲಿನ ಜನ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ಪಾದದಿಂದ ಬಂದಿದೆ, ಈ ವರದಿಯಲ್ಲಿ ಮುಂದೆ ಬರುವ ನಾಮಕರಣ ಪುಟ ನಿಖರವಾಗಿ ಅದರಿಂದಲೇ ರೂಪುಗೊಂಡಿದೆ.","ta":"நாமாட்சர வரிசை குறிக்கப்பட்டுள்ளது: அது மேலே உள்ள ஜென்ம நட்சத்திரம் மற்றும் பாதத்திலிருந்து வருகிறது, இந்த அறிக்கையில் பின்னர் வரும் நாமகரணப் பக்கம் சரியாக அதிலிருந்தே உருவானது.","bn":"নামাক্ষরের সারিটি চিহ্নিত: সেটি উপরের জন্ম নক্ষত্র ও পাদ থেকে আসে, আর এই রিপোর্টে পরে আসা নামকরণ পাতাটি ঠিক সেখান থেকেই তৈরি।","mr":"नामाक्षराची ओळ अधोरेखित आहे: ती वरील जन्म नक्षत्र आणि चरणापासून येते, आणि या अहवालात पुढे येणारे नामकरण पान नेमके त्यातूनच बनले आहे.","gu":"નામાક્ષરની પંક્તિ અધોરેખિત છે: એ ઉપરના જન્મ નક્ષત્ર અને પાદથી આવે છે, અને આ અહેવાલમાં આગળ આવતું નામકરણ પાનું બરાબર એમાંથી જ બન્યું છે.","as":"নামাক্ষৰৰ শাৰীটো চিহ্নিত: সেয়া ওপৰৰ জন্ম নক্ষত্ৰ আৰু পাদৰ পৰা আহে, আৰু এই প্ৰতিবেদনত পিছত অহা নামকৰণ পৃষ্ঠাটো ঠিক তাৰ পৰাই তৈয়াৰ।"},"annualHighlight":{"en":"Your birth star is highlighted: the Mudda dasha later in this report opens from it — the year's first period is decided by your nakshatra and the number of years you have completed.","hi":"आपका जन्म नक्षत्र रेखांकित है: इस रिपोर्ट में आगे दी गई मुद्दा दशा इसी से आरंभ होती है — वर्ष का पहला काल आपके नक्षत्र और आपकी पूरी हो चुकी आयु से तय होता है।","te":"మీ జన్మ నక్షత్రం గుర్తించబడింది: ఈ నివేదికలో ముందుకు వచ్చే ముద్దా దశ దీని నుండే మొదలవుతుంది — సంవత్సరపు మొదటి కాలాన్ని మీ నక్షత్రం, మీరు పూర్తి చేసిన సంవత్సరాల సంఖ్య నిర్ణయిస్తాయి.","kn":"ನಿಮ್ಮ ಜನ್ಮ ನಕ್ಷತ್ರ ಗುರುತಿಸಲಾಗಿದೆ: ಈ ವರದಿಯಲ್ಲಿ ಮುಂದೆ ಬರುವ ಮುದ್ದಾ ದಶಾ ಇದರಿಂದಲೇ ಆರಂಭವಾಗುತ್ತದೆ — ವರ್ಷದ ಮೊದಲ ಕಾಲವನ್ನು ನಿಮ್ಮ ನಕ್ಷತ್ರ ಮತ್ತು ನೀವು ಪೂರ್ಣಗೊಳಿಸಿದ ವರ್ಷಗಳ ಸಂಖ್ಯೆ ನಿರ್ಧರಿಸುತ್ತವೆ.","ta":"உங்கள் ஜென்ம நட்சத்திரம் குறிக்கப்பட்டுள்ளது: இந்த அறிக்கையில் பின்னர் வரும் முத்தா தசை இதிலிருந்தே தொடங்குகிறது — ஆண்டின் முதல் காலத்தை உங்கள் நட்சத்திரமும் நீங்கள் நிறைவு செய்த ஆண்டுகளின் எண்ணிக்கையும் தீர்மானிக்கின்றன.","bn":"আপনার জন্ম নক্ষত্র চিহ্নিত: এই রিপোর্টে পরে আসা মুদ্দা দশা এখান থেকেই শুরু হয় — বছরের প্রথম কালটি আপনার নক্ষত্র ও আপনার সম্পূর্ণ হওয়া বছরের সংখ্যা দিয়ে ঠিক হয়।","mr":"तुमचे जन्म नक्षत्र अधोरेखित आहे: या अहवालात पुढे येणारी मुद्दा दशा याच्यापासूनच सुरू होते — वर्षाचा पहिला काळ तुमचे नक्षत्र आणि तुमची पूर्ण झालेली वर्षे यावरून ठरतो.","gu":"તમારું જન્મ નક્ષત્ર અધોરેખિત છે: આ અહેવાલમાં આગળ આવતી મુદ્દા દશા આનાથી જ શરૂ થાય છે — વર્ષનો પહેલો કાળ તમારા નક્ષત્ર અને તમે પૂરાં કરેલાં વર્ષોની સંખ્યાથી નક્કી થાય છે.","as":"আপোনাৰ জন্ম নক্ষত্ৰ চিহ্নিত: এই প্ৰতিবেদনত পিছত অহা মুদ্দা দশা ইয়াৰ পৰাই আৰম্ভ হয় — বছৰৰ প্ৰথম কালটো আপোনাৰ নক্ষত্ৰ আৰু আপুনি সম্পূৰ্ণ কৰা বছৰৰ সংখ্যাৰে ঠিক হয়।"},"forecastHighlight":{"en":"Your Moon sign is highlighted: every year in this forecast is rated by where Jupiter, Saturn and Rahu stand relative to it — the classical gochara method, counted from the Moon rather than the ascendant.","hi":"आपकी चंद्रराशि रेखांकित है: इस भविष्यवाणी का हर वर्ष इसी के सापेक्ष बृहस्पति, शनि और राहु की स्थिति से आँका गया है — यही शास्त्रीय गोचर पद्धति है, जो लग्न से नहीं, चंद्र से गिनी जाती है।","te":"మీ చంద్రరాశి గుర్తించబడింది: ఈ అంచనాలోని ప్రతి సంవత్సరమూ దీని సాపేక్షంగా గురువు, శని, రాహువుల స్థానాల ఆధారంగా మదింపు చేయబడింది — ఇదే శాస్త్రీయ గోచార పద్ధతి, లగ్నం నుండి కాక చంద్రుని నుండి లెక్కించేది.","kn":"ನಿಮ್ಮ ಚಂದ್ರರಾಶಿ ಗುರುತಿಸಲಾಗಿದೆ: ಈ ಮುನ್ಸೂಚನೆಯ ಪ್ರತಿ ವರ್ಷವನ್ನೂ ಇದರ ಸಾಪೇಕ್ಷವಾಗಿ ಗುರು, ಶನಿ ಮತ್ತು ರಾಹುವಿನ ಸ್ಥಾನಗಳಿಂದ ಅಳೆಯಲಾಗಿದೆ — ಇದೇ ಶಾಸ್ತ್ರೀಯ ಗೋಚಾರ ಪದ್ಧತಿ, ಲಗ್ನದಿಂದಲ್ಲ ಚಂದ್ರನಿಂದ ಎಣಿಸುವುದು.","ta":"உங்கள் சந்திர ராசி குறிக்கப்பட்டுள்ளது: இந்த முன்னறிவிப்பின் ஒவ்வொரு ஆண்டும் இதற்கு ஒப்பிட்டு குரு, சனி, ராகுவின் நிலைகளால் மதிப்பிடப்பட்டுள்ளது — இதுவே சாஸ்திரக் கோசார முறை, லக்னத்திலிருந்து அல்லாமல் சந்திரனிலிருந்து கணக்கிடுவது.","bn":"আপনার চন্দ্ররাশি চিহ্নিত: এই পূর্বাভাসের প্রতিটি বছর এর সাপেক্ষে বৃহস্পতি, শনি ও রাহুর অবস্থান দিয়ে বিচার করা — এটিই শাস্ত্রীয় গোচর পদ্ধতি, লগ্ন থেকে নয়, চন্দ্র থেকে গোনা।","mr":"तुमची चंद्रराशी अधोरेखित आहे: या भाकितातील प्रत्येक वर्ष तिच्या सापेक्ष गुरु, शनी आणि राहूच्या स्थानांवरून जोखलेले आहे — हीच शास्त्रीय गोचर पद्धत, लग्नापासून नव्हे तर चंद्रापासून मोजलेली.","gu":"તમારી ચંદ્રરાશિ અધોરેખિત છે: આ આગાહીનું દરેક વર્ષ એની સાપેક્ષે ગુરુ, શનિ અને રાહુનાં સ્થાનોથી આંકેલું છે — આ જ શાસ્ત્રીય ગોચર પદ્ધતિ, લગ્નથી નહીં પણ ચંદ્રથી ગણેલી.","as":"আপোনাৰ চন্দ্ৰৰাশি চিহ্নিত: এই পূৰ্বাভাসৰ প্ৰতিটো বছৰ ইয়াৰ সাপেক্ষে বৃহস্পতি, শনি আৰু ৰাহুৰ অৱস্থানেৰে বিচাৰ কৰা — এইটোৱেই শাস্ত্ৰীয় গোচৰ পদ্ধতি, লগ্নৰ পৰা নহয়, চন্দ্ৰৰ পৰা গণনা কৰা।"},"loveHighlight":{"en":"Venus and your Moon sign are highlighted: everything in this report is read from those two — Venus for how you love, the Moon for what makes you feel safe. The rest of the chart shapes the details; these two set the terms.","hi":"शुक्र और आपकी चंद्रराशि रेखांकित हैं: इस रिपोर्ट का सब कुछ इन्हीं दो से पढ़ा गया है — शुक्र से यह कि आप प्रेम कैसे करते हैं, चंद्र से यह कि आपको सुरक्षित क्या लगता है। शेष कुंडली विवरण गढ़ती है; ये दो शर्तें तय करते हैं।","te":"శుక్రుడు, మీ చంద్రరాశి గుర్తించబడ్డాయి: ఈ నివేదికలోని ప్రతిదీ ఈ రెండింటి నుండే చదవబడింది — మీరు ఎలా ప్రేమిస్తారో శుక్రుడు చెబితే, మీకు ఏది సురక్షితంగా అనిపిస్తుందో చంద్రుడు చెబుతాడు. మిగతా జాతకం వివరాలను తీర్చిదిద్దుతుంది; ఈ రెండూ నియమాలను నిర్ణయిస్తాయి.","kn":"ಶುಕ್ರ ಮತ್ತು ನಿಮ್ಮ ಚಂದ್ರರಾಶಿ ಗುರುತಿಸಲಾಗಿದೆ: ಈ ವರದಿಯ ಎಲ್ಲವನ್ನೂ ಈ ಎರಡರಿಂದಲೇ ಓದಲಾಗಿದೆ — ನೀವು ಹೇಗೆ ಪ್ರೀತಿಸುತ್ತೀರಿ ಎಂದು ಶುಕ್ರ ಹೇಳಿದರೆ, ನಿಮಗೆ ಯಾವುದು ಸುರಕ್ಷಿತ ಎನಿಸುತ್ತದೆ ಎಂದು ಚಂದ್ರ ಹೇಳುತ್ತಾನೆ. ಉಳಿದ ಜಾತಕ ವಿವರಗಳನ್ನು ರೂಪಿಸುತ್ತದೆ; ಈ ಎರಡು ನಿಯಮಗಳನ್ನು ನಿರ್ಧರಿಸುತ್ತವೆ.","ta":"சுக்கிரனும் உங்கள் சந்திர ராசியும் குறிக்கப்பட்டுள்ளன: இந்த அறிக்கையின் அனைத்தும் இவ்விரண்டிலிருந்தே படிக்கப்பட்டது — நீங்கள் எப்படி நேசிக்கிறீர்கள் என்பதைச் சுக்கிரனும், உங்களுக்கு எது பாதுகாப்பாகத் தோன்றுகிறது என்பதைச் சந்திரனும் சொல்கின்றனர். மீதி ஜாதகம் விவரங்களை வடிவமைக்கிறது; இவ்விரண்டு நிபந்தனைகளை நிர்ணயிக்கின்றன.","bn":"শুক্র আর আপনার চন্দ্ররাশি চিহ্নিত: এই রিপোর্টের সবকিছু এই দুটি থেকেই পড়া — আপনি কীভাবে ভালোবাসেন তা শুক্র বলেন, আর কীসে আপনি নিরাপদ বোধ করেন তা চন্দ্র। বাকি কোষ্ঠী খুঁটিনাটি গড়ে; এই দুটি শর্ত ঠিক করে।","mr":"शुक्र आणि तुमची चंद्रराशी अधोरेखित आहेत: या अहवालातील सर्व काही याच दोघांतून वाचलेले आहे — तुम्ही कसे प्रेम करता हे शुक्र सांगतो, आणि तुम्हाला कशात सुरक्षित वाटते हे चंद्र. उरलेली पत्रिका तपशील घडवते; हे दोघे अटी ठरवतात.","gu":"શુક્ર અને તમારી ચંદ્રરાશિ અધોરેખિત છે: આ અહેવાલનું બધું જ આ બેમાંથી વાંચેલું છે — તમે કેવી રીતે પ્રેમ કરો છો એ શુક્ર કહે છે, અને તમને શેમાં સલામતી લાગે છે એ ચંદ્ર. બાકીની કુંડળી વિગતો ઘડે છે; આ બે શરતો નક્કી કરે છે.","as":"শুক্ৰ আৰু আপোনাৰ চন্দ্ৰৰাশি চিহ্নিত: এই প্ৰতিবেদনৰ সকলোবোৰ এই দুটাৰ পৰাই পঢ়া — আপুনি কেনেকৈ প্ৰেম কৰে সেয়া শুক্ৰই কয়, আৰু কিহত আপুনি সুৰক্ষিত অনুভৱ কৰে সেয়া চন্দ্ৰই। বাকী কুণ্ডলীয়ে সূক্ষ্মতা গঢ়ে; এই দুটাই চৰ্ত ঠিক কৰে।"}},"dashaCareer":{"sun":{"en":"A Sun period puts your name in front of people. Recognition, authority, dealings with government or senior management — this is when a title arrives, or is finally deserved. Work that needs you to be visible does well; work that needs you to be invisible does not.","hi":"सूर्य का काल आपका नाम लोगों के सामने रखता है। पहचान, अधिकार, सरकार या वरिष्ठ प्रबंधन से काम — इसी समय पद मिलता है, या अंततः उसका हक बनता है। जिस काम में आपका दिखना ज़रूरी है वह चलता है; जिसमें छिपे रहना ज़रूरी है वह नहीं।","te":"సూర్య కాలం మీ పేరును జనం ముందు నిలబెడుతుంది. గుర్తింపు, అధికారం, ప్రభుత్వం లేదా పై స్థాయి యాజమాన్యంతో పని — ఈ సమయంలోనే పదవి వస్తుంది, లేదా చివరికి దానికి అర్హత వస్తుంది. మీరు కనిపించాల్సిన పని బాగా సాగుతుంది; కనిపించకూడని పని సాగదు.","kn":"ಸೂರ್ಯ ಕಾಲ ನಿಮ್ಮ ಹೆಸರನ್ನು ಜನರ ಮುಂದೆ ನಿಲ್ಲಿಸುತ್ತದೆ. ಗುರುತಿಸುವಿಕೆ, ಅಧಿಕಾರ, ಸರ್ಕಾರ ಅಥವಾ ಹಿರಿಯ ಆಡಳಿತದೊಂದಿಗೆ ಕೆಲಸ — ಈ ಸಮಯದಲ್ಲೇ ಹುದ್ದೆ ಬರುತ್ತದೆ, ಅಥವಾ ಕೊನೆಗೂ ಅದಕ್ಕೆ ಅರ್ಹತೆ ಸಿಗುತ್ತದೆ. ನೀವು ಕಾಣಿಸಿಕೊಳ್ಳಬೇಕಾದ ಕೆಲಸ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತದೆ; ಕಾಣಿಸಿಕೊಳ್ಳಬಾರದ ಕೆಲಸ ಸಾಗುವುದಿಲ್ಲ.","ta":"சூரிய காலம் உங்கள் பெயரை மக்கள் முன் நிறுத்துகிறது. அங்கீகாரம், அதிகாரம், அரசு அல்லது மூத்த நிர்வாகத்துடன் பணி — இந்தக் காலத்திலேயே பதவி வருகிறது, அல்லது இறுதியில் அதற்குத் தகுதி வருகிறது. நீங்கள் தெரிய வேண்டிய வேலை நன்றாகச் செல்லும்; மறைந்திருக்க வேண்டிய வேலை செல்லாது.","bn":"সূর্যের কাল আপনার নাম মানুষের সামনে রাখে। স্বীকৃতি, কর্তৃত্ব, সরকার বা ঊর্ধ্বতন ব্যবস্থাপনার সঙ্গে কাজ — এই সময়েই পদ আসে, অথবা শেষ পর্যন্ত তার যোগ্যতা তৈরি হয়। যে কাজে আপনার দেখা যাওয়া দরকার তা চলে; যাতে আড়ালে থাকা দরকার তা নয়।","mr":"सूर्याचा काळ तुमचे नाव लोकांसमोर ठेवतो. ओळख, अधिकार, सरकार किंवा वरिष्ठ व्यवस्थापनाशी काम — याच वेळी पद मिळते, किंवा अखेर त्याची पात्रता येते. ज्या कामात तुमचे दिसणे गरजेचे आहे ते चालते; ज्यात लपून राहणे गरजेचे आहे ते नाही.","gu":"સૂર્યનો કાળ તમારું નામ લોકો સામે મૂકે છે. ઓળખ, અધિકાર, સરકાર કે વરિષ્ઠ સંચાલન સાથે કામ — આ જ સમયે પદ મળે છે, અથવા છેવટે તેની પાત્રતા આવે છે. જે કામમાં તમારું દેખાવું જરૂરી છે તે ચાલે છે; જેમાં છુપાયેલા રહેવું જરૂરી છે તે નહીં.","as":"সূৰ্যৰ কালে আপোনাৰ নাম মানুহৰ সন্মুখত ৰাখে। স্বীকৃতি, অধিকাৰ, চৰকাৰ বা ওপৰৰ স্তৰৰ ব্যৱস্থাপনাৰ সৈতে কাম — এই সময়তেই পদ আহে, নহ'লে শেষত তাৰ যোগ্যতা গঢ় লয়। যি কামত আপুনি দেখা পোৱাটো দৰকাৰ সেয়া চলে; যিটোত আঁৰত থকাটো দৰকাৰ সেয়া নচলে।"},"moon":{"en":"A Moon period moves work toward people. Public dealing, care, hospitality, anything where being trusted matters more than being clever. It also moves you — job changes and relocations cluster here. Steady, but rarely still.","hi":"चंद्र का काल काम को लोगों की ओर मोड़ता है। जनसंपर्क, देखभाल, आतिथ्य — जहाँ चतुर होने से अधिक भरोसेमंद होना मायने रखता है। यह आपको हिलाता भी है: नौकरी बदलना और स्थान बदलना इसी समय जुड़ते हैं। स्थिर, पर शायद ही कभी शांत।","te":"చంద్ర కాలం పనిని జనం వైపు మళ్ళిస్తుంది. ప్రజా సంబంధాలు, సేవ, ఆతిథ్యం — తెలివిగా ఉండటం కంటే నమ్మకంగా ఉండటం ముఖ్యమైన చోట. ఇది మిమ్మల్ని కదిలిస్తుంది కూడా: ఉద్యోగ మార్పులు, స్థల మార్పులు ఈ కాలంలోనే గుమిగూడతాయి. స్థిరం, కానీ అరుదుగా నిశ్చలం.","kn":"ಚಂದ್ರ ಕಾಲ ಕೆಲಸವನ್ನು ಜನರ ಕಡೆಗೆ ತಿರುಗಿಸುತ್ತದೆ. ಜನಸಂಪರ್ಕ, ಆರೈಕೆ, ಆತಿಥ್ಯ — ಜಾಣರಾಗಿರುವುದಕ್ಕಿಂತ ನಂಬಿಕಸ್ಥರಾಗಿರುವುದು ಮುಖ್ಯವಾದಲ್ಲಿ. ಇದು ನಿಮ್ಮನ್ನು ಅಲುಗಾಡಿಸುತ್ತದೆ ಕೂಡ: ಕೆಲಸ ಬದಲಾವಣೆ, ಸ್ಥಳ ಬದಲಾವಣೆ ಈ ಕಾಲದಲ್ಲೇ ಸೇರುತ್ತವೆ. ಸ್ಥಿರ, ಆದರೆ ಅಪರೂಪಕ್ಕೆ ನಿಶ್ಚಲ.","ta":"சந்திர காலம் வேலையை மக்கள் பக்கம் திருப்புகிறது. பொதுத் தொடர்பு, பராமரிப்பு, விருந்தோம்பல் — புத்திசாலியாக இருப்பதைவிட நம்பகமாக இருப்பது முக்கியமான இடத்தில். இது உங்களை அசைக்கவும் செய்யும்: வேலை மாற்றமும் இட மாற்றமும் இந்தக் காலத்திலேயே சேரும். நிலையானது, ஆனால் அரிதாகவே அமைதியானது.","bn":"চন্দ্রের কাল কাজকে মানুষের দিকে ঘোরায়। জনসংযোগ, সেবা, আতিথেয়তা — যেখানে চতুর হওয়ার চেয়ে বিশ্বাসযোগ্য হওয়া বেশি জরুরি। এটি আপনাকে নাড়ায়ও: চাকরি বদল আর জায়গা বদল এই সময়েই জড়ো হয়। স্থির, কিন্তু কদাচিৎ নিশ্চল।","mr":"चंद्राचा काळ काम लोकांकडे वळवतो. जनसंपर्क, काळजी, आदरातिथ्य — जिथे हुशार असण्यापेक्षा विश्वासार्ह असणे महत्त्वाचे. तो तुम्हाला हलवतोही: नोकरी बदल आणि स्थलांतर याच काळात जमतात. स्थिर, पण क्वचितच शांत.","gu":"ચંદ્રનો કાળ કામને લોકો તરફ વાળે છે. જનસંપર્ક, સંભાળ, આતિથ્ય — જ્યાં હોશિયાર હોવા કરતાં ભરોસાપાત્ર હોવું વધુ મહત્ત્વનું. એ તમને હલાવે પણ છે: નોકરી બદલવી અને સ્થળ બદલવું આ જ સમયે ભેગાં થાય. સ્થિર, પણ ભાગ્યે જ શાંત.","as":"চন্দ্ৰৰ কালে কামক মানুহৰ ফালে ঘূৰায়। জনসংযোগ, যতন, আতিথ্য — য'ত চতুৰ হোৱাতকৈ বিশ্বাসযোগ্য হোৱাটো বেছি দৰকাৰী। ই আপোনাক লৰচৰো কৰায়: চাকৰি সলনি আৰু ঠাই সলনি এই সময়তেই গোট খায়। স্থিৰ, কিন্তু কমেইহে নিশ্চল।"},"mars":{"en":"A Mars period gives you the appetite for a fight and usually finds one. Competition, technical work, land and property, anything where speed and nerve decide the outcome. Promotions come by winning them. Keep the temper out of the office and this period is very productive.","hi":"मंगल का काल लड़ने की भूख देता है और आमतौर पर लड़ाई ढूँढ भी लेता है। प्रतिस्पर्धा, तकनीकी काम, भूमि और संपत्ति — जहाँ गति और हिम्मत परिणाम तय करते हैं। पदोन्नति जीतकर मिलती है। गुस्सा दफ़्तर से बाहर रखिए, यह काल बहुत उपजाऊ है।","te":"కుజ కాలం పోరాడే ఆకలిని ఇస్తుంది, సాధారణంగా పోరాటాన్ని వెతికి పట్టుకుంటుంది కూడా. పోటీ, సాంకేతిక పని, భూమి, ఆస్తి — వేగం, ధైర్యం ఫలితాన్ని నిర్ణయించే చోట. పదోన్నతులు గెలుచుకుని వస్తాయి. కోపాన్ని ఆఫీసు బయట ఉంచండి, ఈ కాలం చాలా ఫలవంతం.","kn":"ಕುಜ ಕಾಲ ಹೋರಾಡುವ ಹಸಿವನ್ನು ಕೊಡುತ್ತದೆ, ಸಾಮಾನ್ಯವಾಗಿ ಹೋರಾಟವನ್ನು ಹುಡುಕಿ ಹಿಡಿಯುತ್ತದೆ ಕೂಡ. ಸ್ಪರ್ಧೆ, ತಾಂತ್ರಿಕ ಕೆಲಸ, ಭೂಮಿ ಮತ್ತು ಆಸ್ತಿ — ವೇಗ ಮತ್ತು ಧೈರ್ಯ ಫಲಿತಾಂಶ ನಿರ್ಧರಿಸುವಲ್ಲಿ. ಬಡ್ತಿ ಗೆದ್ದು ಬರುತ್ತದೆ. ಕೋಪವನ್ನು ಕಚೇರಿಯ ಹೊರಗಿಡಿ, ಈ ಕಾಲ ಬಹಳ ಫಲಪ್ರದ.","ta":"செவ்வாய் காலம் போராடும் பசியைத் தருகிறது, பொதுவாகப் போரையும் தேடிக் கண்டுபிடிக்கிறது. போட்டி, தொழில்நுட்பப் பணி, நிலம் மற்றும் சொத்து — வேகமும் துணிவும் முடிவை நிர்ணயிக்கும் இடத்தில். பதவி உயர்வு வென்று வருகிறது. கோபத்தை அலுவலகத்திற்கு வெளியே வையுங்கள், இந்தக் காலம் மிகவும் பயனுள்ளது.","bn":"মঙ্গলের কাল লড়ার খিদে দেয়, আর সাধারণত লড়াই খুঁজেও নেয়। প্রতিযোগিতা, কারিগরি কাজ, জমি ও সম্পত্তি — যেখানে গতি আর সাহস ফল ঠিক করে। পদোন্নতি জিতে আসে। রাগ অফিসের বাইরে রাখুন, এই কাল খুব ফলপ্রসূ।","mr":"मंगळाचा काळ लढण्याची भूक देतो आणि सहसा लढाई शोधूनही काढतो. स्पर्धा, तांत्रिक काम, जमीन आणि मालमत्ता — जिथे वेग आणि धैर्य निकाल ठरवतात. बढती जिंकून मिळते. राग कार्यालयाबाहेर ठेवा, हा काळ खूप उत्पादक आहे.","gu":"મંગળનો કાળ લડવાની ભૂખ આપે છે અને સામાન્ય રીતે લડાઈ શોધી પણ કાઢે છે. સ્પર્ધા, ટેકનિકલ કામ, જમીન અને મિલકત — જ્યાં ઝડપ અને હિંમત પરિણામ નક્કી કરે. બઢતી જીતીને મળે છે. ગુસ્સો ઓફિસની બહાર રાખો, આ કાળ ખૂબ ફળદાયી છે.","as":"মঙ্গলৰ কালে যুঁজিবলৈ ভোক দিয়ে, আৰু সাধাৰণতে যুঁজ বিচাৰিও উলিয়ায়। প্ৰতিযোগিতা, কাৰিকৰী কাম, মাটি আৰু সম্পত্তি — য'ত বেগ আৰু সাহসে ফল নিৰ্ধাৰণ কৰে। পদোন্নতি জিকি আহে। খং কাৰ্যালয়ৰ বাহিৰত ৰাখক, এই কাল বহুত ফলপ্ৰসূ।"},"mercury":{"en":"A Mercury period rewards skill and dealing. Trade, analysis, writing, teaching, anything with paperwork and negotiation in it. Multiple income lines open, and side work often outgrows the main job. Read every contract twice — this period gives you many, and not all are what they seem.","hi":"बुध का काल कौशल और लेन-देन को फल देता है। व्यापार, विश्लेषण, लेखन, शिक्षण — जिसमें कागज़ी काम और मोल-भाव हो। आय के कई रास्ते खुलते हैं, और अतिरिक्त काम अक्सर मुख्य नौकरी से बड़ा हो जाता है। हर अनुबंध दो बार पढ़िए — यह काल बहुत देता है, और सब वैसे नहीं होते जैसे दिखते हैं।","te":"బుధ కాలం నైపుణ్యానికీ వ్యవహారానికీ ఫలమిస్తుంది. వ్యాపారం, విశ్లేషణ, రచన, బోధన — కాగితపు పని, బేరసారాలు ఉన్న చోట. ఆదాయ మార్గాలు అనేకం తెరుచుకుంటాయి, పక్క పని తరచుగా ప్రధాన ఉద్యోగాన్ని మించిపోతుంది. ప్రతి ఒప్పందాన్నీ రెండుసార్లు చదవండి — ఈ కాలం చాలా ఇస్తుంది, అన్నీ కనిపించినట్టు ఉండవు.","kn":"ಬುಧ ಕಾಲ ಕೌಶಲ ಮತ್ತು ವ್ಯವಹಾರಕ್ಕೆ ಫಲ ಕೊಡುತ್ತದೆ. ವ್ಯಾಪಾರ, ವಿಶ್ಲೇಷಣೆ, ಬರವಣಿಗೆ, ಬೋಧನೆ — ಕಾಗದದ ಕೆಲಸ ಮತ್ತು ಚೌಕಾಸಿ ಇರುವಲ್ಲಿ. ಆದಾಯದ ಹಲವು ದಾರಿಗಳು ತೆರೆಯುತ್ತವೆ, ಪಕ್ಕದ ಕೆಲಸ ಆಗಾಗ ಮುಖ್ಯ ಉದ್ಯೋಗವನ್ನು ಮೀರುತ್ತದೆ. ಪ್ರತಿ ಒಪ್ಪಂದವನ್ನೂ ಎರಡು ಬಾರಿ ಓದಿ — ಈ ಕಾಲ ಬಹಳ ಕೊಡುತ್ತದೆ, ಎಲ್ಲವೂ ಕಾಣಿಸಿದಂತೆ ಇರುವುದಿಲ್ಲ.","ta":"புதன் காலம் திறமைக்கும் பரிவர்த்தனைக்கும் பலன் தருகிறது. வணிகம், பகுப்பாய்வு, எழுத்து, கற்பித்தல் — காகிதப் பணியும் பேரமும் உள்ள இடத்தில். வருமான வழிகள் பல திறக்கும், பக்கவேலை பெரும்பாலும் முதன்மை வேலையை மிஞ்சும். ஒவ்வொரு ஒப்பந்தத்தையும் இருமுறை படியுங்கள் — இந்தக் காலம் நிறையத் தரும், எல்லாம் தெரிவது போல் இருக்காது.","bn":"বুধের কাল দক্ষতা আর লেনদেনকে ফল দেয়। ব্যবসা, বিশ্লেষণ, লেখা, শিক্ষকতা — যাতে কাগজপত্র আর দরকষাকষি আছে। আয়ের একাধিক পথ খোলে, আর পাশের কাজ প্রায়ই মূল চাকরিকে ছাড়িয়ে যায়। প্রতিটি চুক্তি দুবার পড়ুন — এই কাল অনেক দেয়, সব যেমন দেখায় তেমন নয়।","mr":"बुधाचा काळ कौशल्य आणि व्यवहाराला फळ देतो. व्यापार, विश्लेषण, लेखन, अध्यापन — ज्यात कागदपत्रे आणि घासाघीस आहे. उत्पन्नाचे अनेक मार्ग उघडतात, आणि जोडकाम अनेकदा मुख्य नोकरीपेक्षा मोठे होते. प्रत्येक करार दोनदा वाचा — हा काळ खूप देतो, आणि सगळेच दिसते तसे नसते.","gu":"બુધનો કાળ કૌશલ્ય અને વ્યવહારને ફળ આપે છે. વેપાર, વિશ્લેષણ, લેખન, શિક્ષણ — જેમાં કાગળકામ અને ભાવતાલ હોય. આવકના અનેક રસ્તા ખૂલે છે, અને બાજુનું કામ ઘણી વાર મુખ્ય નોકરીથી મોટું થઈ જાય છે. દરેક કરાર બે વાર વાંચો — આ કાળ ઘણું આપે છે, બધું દેખાય એવું હોતું નથી.","as":"বুধৰ কালে দক্ষতা আৰু লেনদেনক ফল দিয়ে। ব্যৱসায়, বিশ্লেষণ, লিখা, শিক্ষকতা — যিটোত কাগজ-পত্ৰ আৰু দৰদাম আছে। আয়ৰ একাধিক পথ খোল খায়, আৰু কাষৰ কাম প্ৰায়ে মূল চাকৰিতকৈ ডাঙৰ হৈ পৰে। প্ৰতিটো চুক্তি দুবাৰ পঢ়ক — এই কালে বহুত দিয়ে, সকলো দেখাৰ দৰে নহয়।"},"jupiter":{"en":"A Jupiter period is the one people remember fondly. Teaching, advising, finance, law, anything where judgement is the product. Seniors back you, and growth comes without having to force it. The risk is comfort — take the bigger role while it is being offered.","hi":"बृहस्पति का काल वही है जिसे लोग स्नेह से याद रखते हैं। शिक्षण, परामर्श, वित्त, कानून — जहाँ निर्णय-क्षमता ही उत्पाद है। बड़े लोग साथ देते हैं, और वृद्धि बिना ज़ोर लगाए आती है। जोखिम है आराम — बड़ी भूमिका जब मिल रही हो तभी ले लीजिए।","te":"గురు కాలాన్నే జనం ఆప్యాయంగా గుర్తుంచుకుంటారు. బోధన, సలహా, ఆర్థిక రంగం, న్యాయం — విచక్షణే ఉత్పత్తి అయిన చోట. పెద్దలు అండగా ఉంటారు, వృద్ధి బలవంతం చేయకుండానే వస్తుంది. ప్రమాదం సౌకర్యం — పెద్ద బాధ్యత అందిస్తున్నప్పుడే తీసుకోండి.","kn":"ಗುರು ಕಾಲವನ್ನೇ ಜನ ಪ್ರೀತಿಯಿಂದ ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತಾರೆ. ಬೋಧನೆ, ಸಲಹೆ, ಹಣಕಾಸು, ಕಾನೂನು — ವಿವೇಚನೆಯೇ ಉತ್ಪನ್ನವಾದಲ್ಲಿ. ಹಿರಿಯರು ಬೆಂಬಲಿಸುತ್ತಾರೆ, ಬೆಳವಣಿಗೆ ಒತ್ತಾಯಿಸದೆಯೇ ಬರುತ್ತದೆ. ಅಪಾಯ ಸೌಕರ್ಯ — ದೊಡ್ಡ ಜವಾಬ್ದಾರಿ ನೀಡುತ್ತಿರುವಾಗಲೇ ತೆಗೆದುಕೊಳ್ಳಿ.","ta":"குரு காலத்தையே மக்கள் அன்புடன் நினைவில் வைத்திருப்பார்கள். கற்பித்தல், ஆலோசனை, நிதி, சட்டம் — தீர்ப்பாற்றலே பொருளாக இருக்கும் இடத்தில். பெரியவர்கள் ஆதரிக்கிறார்கள், வளர்ச்சி வலியுறுத்தாமலே வருகிறது. ஆபத்து வசதி — பெரிய பொறுப்பு வழங்கப்படும்போதே எடுத்துக்கொள்ளுங்கள்.","bn":"বৃহস্পতির কালই সেই কাল যা মানুষ স্নেহভরে মনে রাখে। শিক্ষকতা, পরামর্শ, অর্থ, আইন — যেখানে বিচারবুদ্ধিই পণ্য। বড়রা পাশে থাকেন, আর বৃদ্ধি জোর না করেই আসে। ঝুঁকি হল স্বাচ্ছন্দ্য — বড় দায়িত্ব যখন দেওয়া হচ্ছে তখনই নিয়ে নিন।","mr":"गुरूचा काळ तोच जो लोक प्रेमाने लक्षात ठेवतात. अध्यापन, सल्ला, वित्त, कायदा — जिथे विवेक हेच उत्पादन आहे. वडीलधारे पाठिंबा देतात, आणि वाढ जोर न लावता येते. धोका आहे आराम — मोठी जबाबदारी देत असतानाच घ्या.","gu":"ગુરુનો કાળ એ જ છે જેને લોકો પ્રેમથી યાદ રાખે છે. શિક્ષણ, સલાહ, નાણાં, કાયદો — જ્યાં વિવેક જ ઉત્પાદન છે. વડીલો સાથ આપે છે, અને વૃદ્ધિ જોર લગાવ્યા વગર આવે છે. જોખમ છે આરામ — મોટી જવાબદારી જ્યારે અપાઈ રહી હોય ત્યારે જ લઈ લો.","as":"বৃহস্পতিৰ কালটোৱেই মানুহে মৰমেৰে মনত ৰাখে। শিক্ষকতা, পৰামৰ্শ, বিত্ত, আইন — য'ত বিবেচনাই সামগ্ৰী। বয়োজ্যেষ্ঠসকলে সমৰ্থন কৰে, আৰু বিকাশ জোৰ নকৰাকৈয়ে আহে। বিপদ হ'ল আৰাম — ডাঙৰ দায়িত্ব যেতিয়া দিয়া হৈ আছে তেতিয়াই লওক।"},"venus":{"en":"A Venus period makes work pleasant and profitable at once. Design, media, luxury, finance, anything where taste is part of the product. Relationships at work turn into opportunities. Money comes easily enough that saving it becomes the discipline to watch.","hi":"शुक्र का काल काम को एक साथ सुखद और लाभदायक बनाता है। डिज़ाइन, मीडिया, विलासिता, वित्त — जहाँ रुचि भी उत्पाद का हिस्सा है। काम के रिश्ते अवसरों में बदलते हैं। पैसा इतनी आसानी से आता है कि उसे बचाना ही देखने योग्य अनुशासन बन जाता है।","te":"శుక్ర కాలం పనిని ఒకేసారి ఆహ్లాదకరంగానూ లాభదాయకంగానూ చేస్తుంది. డిజైన్, మీడియా, విలాసం, ఆర్థిక రంగం — అభిరుచి కూడా ఉత్పత్తిలో భాగమైన చోట. పనిలోని సంబంధాలు అవకాశాలుగా మారతాయి. డబ్బు తేలికగా వస్తుంది కాబట్టి దాచుకోవడమే గమనించాల్సిన క్రమశిక్షణ.","kn":"ಶುಕ್ರ ಕಾಲ ಕೆಲಸವನ್ನು ಒಮ್ಮೆಗೇ ಹಿತಕರವಾಗಿಯೂ ಲಾಭದಾಯಕವಾಗಿಯೂ ಮಾಡುತ್ತದೆ. ವಿನ್ಯಾಸ, ಮಾಧ್ಯಮ, ವೈಭವ, ಹಣಕಾಸು — ಅಭಿರುಚಿಯೂ ಉತ್ಪನ್ನದ ಭಾಗವಾದಲ್ಲಿ. ಕೆಲಸದ ಸಂಬಂಧಗಳು ಅವಕಾಶಗಳಾಗಿ ಬದಲಾಗುತ್ತವೆ. ಹಣ ಸುಲಭವಾಗಿ ಬರುವುದರಿಂದ ಅದನ್ನು ಉಳಿಸುವುದೇ ಗಮನಿಸಬೇಕಾದ ಶಿಸ್ತು.","ta":"சுக்கிர காலம் வேலையை ஒரே சமயத்தில் இனிமையாகவும் லாபகரமாகவும் ஆக்குகிறது. வடிவமைப்பு, ஊடகம், ஆடம்பரம், நிதி — ரசனையும் பொருளின் பகுதியாக இருக்கும் இடத்தில். வேலையிலுள்ள உறவுகள் வாய்ப்புகளாக மாறும். பணம் எளிதாக வருவதால் அதைச் சேமிப்பதே கவனிக்க வேண்டிய ஒழுக்கம்.","bn":"শুক্রের কাল কাজকে একসঙ্গে আনন্দদায়ক আর লাভজনক করে। ডিজাইন, মিডিয়া, বিলাস, অর্থ — যেখানে রুচিও পণ্যের অংশ। কাজের সম্পর্ক সুযোগে বদলায়। টাকা এত সহজে আসে যে তা জমানোই দেখার মতো শৃঙ্খলা হয়ে দাঁড়ায়।","mr":"शुक्राचा काळ काम एकाच वेळी सुखद आणि फायदेशीर करतो. डिझाइन, माध्यम, चैन, वित्त — जिथे अभिरुची हाही उत्पादनाचा भाग आहे. कामातील नाती संधींमध्ये बदलतात. पैसा इतक्या सहज येतो की तो वाचवणे हीच पाहण्याजोगी शिस्त बनते.","gu":"શુક્રનો કાળ કામને એકસાથે સુખદ અને નફાકારક બનાવે છે. ડિઝાઇન, માધ્યમ, વૈભવ, નાણાં — જ્યાં રુચિ પણ ઉત્પાદનનો ભાગ છે. કામના સંબંધો તકોમાં બદલાય છે. પૈસા એટલી સહેલાઈથી આવે છે કે એ બચાવવું જ જોવા જેવી શિસ્ત બની જાય છે.","as":"শুক্ৰৰ কালে কামক একেলগে আনন্দদায়ক আৰু লাভজনক কৰে। ডিজাইন, সংবাদ মাধ্যম, বিলাসিতা, বিত্ত — য'ত ৰুচিও সামগ্ৰীৰ অংশ। কামৰ সম্পৰ্ক সুযোগলৈ সলনি হয়। ধন ইমান সহজে আহে যে সেয়া জমা কৰাটোৱেই চাবলগীয়া শৃংখলা হৈ পৰে।"},"saturn":{"en":"A Saturn period is the long one, and the one that builds what lasts. Progress is slow, responsibility is heavy, and recognition arrives later than it is earned. But nothing built here falls down afterwards. Classical texts are direct about this: Saturn takes its time and then pays in full.","hi":"शनि का काल लंबा है, और वही है जो टिकने वाला बनाता है। उन्नति धीमी, ज़िम्मेदारी भारी, और पहचान अर्जित होने के बाद देर से आती है। पर यहाँ जो बनता है वह बाद में गिरता नहीं। शास्त्र इस बारे में स्पष्ट हैं: शनि समय लेता है, फिर पूरा चुकाता है।","te":"శని కాలం సుదీర్ఘమైనది, నిలిచేదాన్ని కట్టేదీ అదే. పురోగతి నెమ్మది, బాధ్యత బరువు, గుర్తింపు సంపాదించిన తర్వాత ఆలస్యంగా వస్తుంది. కానీ ఇక్కడ కట్టినది తర్వాత కూలదు. శాస్త్రం దీని గురించి స్పష్టం: శని సమయం తీసుకుంటాడు, ఆ తర్వాత పూర్తిగా చెల్లిస్తాడు.","kn":"ಶನಿ ಕಾಲ ಸುದೀರ್ಘವಾದದ್ದು, ಉಳಿಯುವುದನ್ನು ಕಟ್ಟುವುದೂ ಅದೇ. ಪ್ರಗತಿ ನಿಧಾನ, ಜವಾಬ್ದಾರಿ ಭಾರ, ಗುರುತಿಸುವಿಕೆ ಗಳಿಸಿದ ನಂತರ ತಡವಾಗಿ ಬರುತ್ತದೆ. ಆದರೆ ಇಲ್ಲಿ ಕಟ್ಟಿದ್ದು ನಂತರ ಬೀಳುವುದಿಲ್ಲ. ಶಾಸ್ತ್ರ ಈ ಬಗ್ಗೆ ಸ್ಪಷ್ಟ: ಶನಿ ಸಮಯ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾನೆ, ನಂತರ ಪೂರ್ಣವಾಗಿ ಸಲ್ಲಿಸುತ್ತಾನೆ.","ta":"சனி காலம் நீண்டது, நிலைப்பதைக் கட்டுவதும் அதுவே. முன்னேற்றம் மெதுவானது, பொறுப்பு கனமானது, அங்கீகாரம் சம்பாதித்த பிறகு தாமதமாக வருகிறது. ஆனால் இங்கே கட்டியது பிறகு விழுவதில்லை. சாஸ்திரம் இதைப் பற்றித் தெளிவாகச் சொல்கிறது: சனி நேரம் எடுத்துக்கொள்கிறார், பிறகு முழுமையாகச் செலுத்துகிறார்.","bn":"শনির কাল দীর্ঘ, আর যা টেকে তা গড়েও সেটাই। উন্নতি ধীর, দায়িত্ব ভারী, আর স্বীকৃতি অর্জিত হওয়ার পরে দেরিতে আসে। কিন্তু এখানে যা গড়ে ওঠে তা পরে ভেঙে পড়ে না। শাস্ত্র এ বিষয়ে সরাসরি: শনি সময
