ৱা সাহস"},"gaurava":{"en":"Honour received, and recognition from those above you","hi":"प्राप्त सम्मान और वरिष्ठों से मिली पहचान","te":"లభించే గౌరవం, పెద్దల నుండి వచ్చే గుర్తింపు","kn":"ದೊರೆಯುವ ಗೌರವ ಮತ್ತು ಹಿರಿಯರಿಂದ ಬರುವ ಮನ್ನಣೆ","ta":"கிடைக்கும் மரியாதை, மேலிடத்திலிருந்து வரும் அங்கீகாரம்","bn":"প্রাপ্ত সম্মান ও ঊর্ধ্বতনদের থেকে পাওয়া স্বীকৃতি","mr":"मिळणारा सन्मान आणि वरिष्ठांकडून मिळालेली ओळख","gu":"મળતું સન્માન અને ઉપરીઓ તરફથી મળેલી ઓળખ","as":"পোৱা সন্মান আৰু ওপৰৰ পৰা অহা স্বীকৃতি"},"pitri":{"en":"The father, and what comes down from the paternal line","hi":"पिता और पितृ पक्ष से आने वाला","te":"తండ్రి, పితృ వంశం నుండి వచ్చేది","kn":"ತಂದೆ ಮತ್ತು ಪಿತೃ ವಂಶದಿಂದ ಬರುವುದು","ta":"தந்தை, தந்தை வழியில் வருவது","bn":"পিতা ও পিতৃকুল থেকে যা আসে","mr":"वडील आणि पितृकुळाकडून येणारे","gu":"પિતા અને પિતૃપક્ષથી આવતું","as":"পিতৃ আৰু পিতৃকুলৰ পৰা অহা"},"matri":{"en":"The mother, and the shelter the maternal line gives","hi":"माता और मातृ पक्ष से मिलने वाला आश्रय","te":"తల్లి, మాతృ వంశం ఇచ్చే ఆశ్రయం","kn":"ತಾಯಿ ಮತ್ತು ಮಾತೃ ವಂಶ ನೀಡುವ ಆಶ್ರಯ","ta":"தாய், தாய் வழி தரும் அடைக்கலம்","bn":"মাতা ও মাতৃকুল থেকে পাওয়া আশ্রয়","mr":"आई आणि मातृकुळाकडून मिळणारा आधार","gu":"માતા અને માતૃપક્ષથી મળતો આશરો","as":"মাতৃ আৰু মাতৃকুলে দিয়া আশ্ৰয়"},"putra":{"en":"Children, and the continuation of the line","hi":"संतान और वंश की निरंतरता","te":"సంతానం, వంశ కొనసాగింపు","kn":"ಸಂತಾನ ಮತ್ತು ವಂಶದ ಮುಂದುವರಿಕೆ","ta":"சந்ததி, வம்சத்தின் தொடர்ச்சி","bn":"সন্তান ও বংশের ধারাবাহিকতা","mr":"संतती आणि वंशाचे सातत्य","gu":"સંતાન અને વંશની સાતત્યતા","as":"সন্তান আৰু বংশৰ ধাৰাবাহিকতা"},"jeeva":{"en":"Vitality, health, and the body's staying power","hi":"प्राणशक्ति, स्वास्थ्य और शरीर की सहनशक्ति","te":"ప్రాణశక్తి, ఆరోగ్యం, శరీర సహన శక్తి","kn":"ಪ್ರಾಣಶಕ್ತಿ, ಆರೋಗ್ಯ ಮತ್ತು ದೇಹದ ಸಹನಶಕ್ತಿ","ta":"உயிர்ச்சக்தி, உடல்நலம், உடலின் தாங்கும் திறன்","bn":"প্রাণশক্তি, স্বাস্থ্য ও শরীরের সহনক্ষমতা","mr":"प्राणशक्ती, आरोग्य आणि शरीराची सहनशक्ती","gu":"પ્રાણશક્તિ, આરોગ્ય અને શરીરની સહનશક્તિ","as":"প্ৰাণশক্তি, স্বাস্থ্য আৰু শৰীৰৰ সহন ক্ষমতা"},"karma":{"en":"Work, occupation, and the effort the year asks of you","hi":"कर्म, व्यवसाय और वर्ष जो परिश्रम माँगता है","te":"పని, వృత్తి, సంవత్సరం కోరే శ్రమ","kn":"ಕೆಲಸ, ವೃತ್ತಿ ಮತ್ತು ವರ್ಷ ಕೇಳುವ ಶ್ರಮ","ta":"வேலை, தொழில், ஆண்டு கேட்கும் உழைப்பு","bn":"কর্ম, পেশা ও বছর যে পরিশ্রম চায়","mr":"कर्म, व्यवसाय आणि वर्ष जी मेहनत मागते ती","gu":"કર્મ, વ્યવસાય અને વર્ષ જે મહેનત માંગે છે","as":"কৰ্ম, বৃত্তি আৰু বছৰে বিচৰা পৰিশ্ৰম"},"roga":{"en":"Illness and the areas where the body needs watching","hi":"रोग और वे क्षेत्र जहाँ शरीर पर ध्यान चाहिए","te":"రోగం, శరీరంపై శ్రద్ధ అవసరమైన విషయాలు","kn":"ರೋಗ ಮತ್ತು ದೇಹದ ಮೇಲೆ ಗಮನ ಬೇಕಾದ ವಿಷಯಗಳು","ta":"நோய், உடலில் கவனம் தேவைப்படும் இடங்கள்","bn":"রোগ ও যেসব দিকে শরীরের দিকে নজর দরকার","mr":"रोग आणि जिथे शरीराकडे लक्ष हवे ते","gu":"રોગ અને જ્યાં શરીર પર ધ્યાન જોઈએ એ ક્ષેત્રો","as":"ৰোগ আৰু য'ত শৰীৰৰ প্ৰতি চকু দিব লাগে"},"kali":{"en":"Strife and the friction the year does not let you avoid","hi":"कलह और वह टकराव जिससे वर्ष बचने नहीं देता","te":"కలహం, ఈ సంవత్సరం తప్పించుకోనివ్వని ఘర్షణ","kn":"ಕಲಹ ಮತ್ತು ಈ ವರ್ಷ ತಪ್ಪಿಸಿಕೊಳ್ಳಲು ಬಿಡದ ಘರ್ಷಣೆ","ta":"சச்சரவு, இந்த ஆண்டு தவிர்க்க விடாத உரசல்","bn":"কলহ ও যে ঘর্ষণ বছর এড়াতে দেয় না","mr":"कलह आणि जो संघर्ष वर्ष टाळू देत नाही","gu":"કલહ અને જે ઘર્ષણ વર્ષ ટાળવા દેતું નથી","as":"কলহ আৰু যি ঘৰ্ষণ বছৰে এৰাব নিদিয়ে"},"vivaha":{"en":"Marriage, partnership, and the bond of two households","hi":"विवाह, साझेदारी और दो घरों का बंधन","te":"వివాహం, భాగస్వామ్యం, రెండు కుటుంబాల బంధం","kn":"ವಿವಾಹ, ಪಾಲುದಾರಿಕೆ ಮತ್ತು ಎರಡು ಮನೆಗಳ ಬಂಧ","ta":"திருமணம், கூட்டாண்மை, இரு குடும்பங்களின் பிணைப்பு","bn":"বিবাহ, অংশীদারিত্ব ও দুই পরিবারের বন্ধন","mr":"विवाह, भागीदारी आणि दोन घरांचे नाते","gu":"વિવાહ, ભાગીદારી અને બે ઘરનું બંધન","as":"বিবাহ, অংশীদাৰিত্ব আৰু দুই ঘৰৰ বান্ধোন"}},"sahamLbl":{"house":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்","bn":"ভাব","mr":"भाव","gu":"ભાવ","as":"ভাৱ"},"meaning":{"en":"What it governs","hi":"किसका विषय","te":"దేని విషయం","kn":"ಯಾವುದರ ವಿಷಯ","ta":"எதைச் சார்ந்தது","bn":"কীসের বিষয়","mr":"कशाचा विषय","gu":"શેનો વિષય","as":"কিহৰ বিষয়"},"houseNote":{"en":"The house column counts from your varshaphal ascendant, not your birth ascendant — it shows where in this particular year each theme falls. A saham in an angular house tends to be more prominent through the year; the house says where attention goes, not whether the matter goes well.","hi":"भाव स्तंभ आपके वर्षफल लग्न से गिना गया है, जन्म लग्न से नहीं — यह दिखाता है कि इस विशेष वर्ष में हर विषय कहाँ पड़ता है। केंद्र भावों में स्थित सहम वर्ष भर अधिक मुखर रहता है; भाव यह बताता है कि ध्यान कहाँ जाएगा, यह नहीं कि विषय अच्छा रहेगा या नहीं।","te":"భావ కాలమ్ మీ వర్షఫల లగ్నం నుండి లెక్కించినది, జన్మ లగ్నం నుండి కాదు — ఈ నిర్దిష్ట సంవత్సరంలో ప్రతి విషయం ఎక్కడ పడుతుందో ఇది చూపుతుంది. కేంద్ర భావాల్లోని సహమ్ ఏడాది పొడవునా ఎక్కువ ప్రస్ఫుటంగా ఉంటుంది; భావం చెప్పేది దృష్టి ఎక్కడ పడుతుందో, ఆ విషయం బాగుంటుందో లేదో కాదు.","kn":"ಭಾವ ಕಾಲಮ್ ನಿಮ್ಮ ವರ್ಷಫಲ ಲಗ್ನದಿಂದ ಎಣಿಸಿದ್ದು, ಜನ್ಮ ಲಗ್ನದಿಂದಲ್ಲ — ಈ ನಿರ್ದಿಷ್ಟ ವರ್ಷದಲ್ಲಿ ಪ್ರತಿ ವಿಷಯ ಎಲ್ಲಿ ಬೀಳುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ. ಕೇಂದ್ರ ಭಾವಗಳಲ್ಲಿನ ಸಹಮ್ ವರ್ಷವಿಡೀ ಹೆಚ್ಚು ಪ್ರಮುಖವಾಗಿರುತ್ತದೆ; ಭಾವ ಹೇಳುವುದು ಗಮನ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ ಎಂದು, ಆ ವಿಷಯ ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತದೋ ಇಲ್ಲವೋ ಎಂದಲ್ಲ.","ta":"பாவ நெடுவரிசை உங்கள் வர்ஷபல லக்னத்திலிருந்து கணக்கிடப்பட்டது, ஜென்ம லக்னத்திலிருந்து அல்ல — இந்தக் குறிப்பிட்ட ஆண்டில் ஒவ்வொரு கருப்பொருளும் எங்கே விழுகிறது என்பதைக் காட்டுகிறது. கேந்திர பாவங்களில் உள்ள ஸஹம் ஆண்டு முழுவதும் மிகுந்த முக்கியத்துவம் பெறும்; பாவம் சொல்வது கவனம் எங்கே செல்கிறது என்பதே, அந்த விஷயம் நன்றாகச் செல்லுமா என்பதல்ல.","bn":"ভাব কলামটি আপনার বর্ষফল লগ্ন থেকে গোনা, জন্মলগ্ন থেকে নয় — এটি দেখায় এই নির্দিষ্ট বছরে প্রতিটি বিষয় কোথায় পড়ে। কেন্দ্র ভাবে থাকা সহম সারা বছর বেশি প্রকট থাকে; ভাব বলে মনোযোগ কোথায় যাবে, বিষয়টি ভালো যাবে কিনা তা নয়।","mr":"भाव स्तंभ तुमच्या वर्षफल लग्नापासून मोजलेला आहे, जन्मलग्नापासून नव्हे — तो दाखवतो की या विशिष्ट वर्षात प्रत्येक विषय कुठे येतो. केंद्र भावांतील सहम वर्षभर अधिक ठळक राहतो; भाव सांगतो लक्ष कुठे जाईल, विषय चांगला जाईल की नाही हे नव्हे.","gu":"ભાવ સ્તંભ તમારા વર્ષફળ લગ્નથી ગણેલો છે, જન્મલગ્નથી નહીં — એ બતાવે છે કે આ ચોક્કસ વર્ષમાં દરેક વિષય ક્યાં પડે છે. કેન્દ્ર ભાવમાં રહેલો સહમ આખું વર્ષ વધુ ઠળક રહે છે; ભાવ કહે છે ધ્યાન ક્યાં જશે, વિષય સારો જશે કે નહીં એ નહીં.","as":"ভাৱ স্তম্ভটো আপোনাৰ বৰ্ষফল লগ্নৰ পৰা গণনা কৰা, জন্মলগ্নৰ পৰা নহয় — ই দেখুৱায় এই নিৰ্দিষ্ট বছৰত প্ৰতিটো বিষয় ক'ত পৰে। কেন্দ্ৰ ভাৱত থকা সহম গোটেই বছৰ অধিক প্ৰকট থাকে; ভাৱে কয় মনোযোগ ক'লৈ যাব, বিষয়টো ভাল যাব নে নাযায় সেয়া নহয়।"}},"annLbl":{"castFor":{"en":"Your varshaphal chart is cast for the city you live in now, not your birthplace — this is the classical Tajika method, and it is why the degrees here differ slightly from a chart cast at your birth coordinates.","hi":"आपकी वर्षफल कुंडली उस नगर के लिए बनाई गई है जहाँ आप अभी रहते हैं, जन्मस्थान के लिए नहीं — यही शास्त्रीय ताजिक पद्धति है, और इसी कारण यहाँ के अंश जन्मस्थान पर बनी कुंडली से थोड़े भिन्न हैं।","te":"మీ వర్షఫల జాతకం మీరు ఇప్పుడు నివసించే నగరానికి వేయబడింది, జన్మస్థానానికి కాదు — ఇదే శాస్త్రీయ తాజిక పద్ధతి, అందుకే ఇక్కడి అంశాలు జన్మస్థాన నిర్దేశాంకాల వద్ద వేసిన జాతకం కంటే కొద్దిగా వేరుగా ఉంటాయి.","kn":"ನಿಮ್ಮ ವರ್ಷಫಲ ಜಾತಕವನ್ನು ನೀವು ಈಗ ವಾಸಿಸುವ ನಗರಕ್ಕೆ ಹಾಕಲಾಗಿದೆ, ಜನ್ಮಸ್ಥಳಕ್ಕಲ್ಲ — ಇದೇ ಶಾಸ್ತ್ರೀಯ ತಾಜಿಕ ಪದ್ಧತಿ, ಅದಕ್ಕಾಗಿಯೇ ಇಲ್ಲಿನ ಅಂಶಗಳು ಜನ್ಮಸ್ಥಳದ ನಿರ್ದೇಶಾಂಕಗಳಲ್ಲಿ ಹಾಕಿದ ಜಾತಕಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಭಿನ್ನವಾಗಿವೆ.","ta":"உங்கள் வர்ஷபல ஜாதகம் நீங்கள் இப்போது வசிக்கும் நகரத்திற்குக் கணிக்கப்பட்டது, பிறந்த இடத்திற்கு அல்ல — இதுவே சாஸ்திர தாஜிக முறை, அதனாலேயே இங்குள்ள பாகைகள் பிறந்த இட ஆயத்தொலைவுகளில் கணித்த ஜாதகத்திலிருந்து சற்று வேறுபடுகின்றன.","bn":"আপনার বর্ষফল কোষ্ঠী আপনি এখন যে শহরে থাকেন তার জন্য গণনা করা, জন্মস্থানের জন্য নয় — এটিই শাস্ত্রীয় তাজিক পদ্ধতি, আর সেই কারণেই এখানকার অংশ জন্মস্থানের স্থানাঙ্কে গণনা করা কোষ্ঠী থেকে সামান্য আলাদা।","mr":"तुमची वर्षफल पत्रिका तुम्ही आता जिथे राहता त्या शहरासाठी मांडलेली आहे, जन्मस्थानासाठी नव्हे — हीच शास्त्रीय ताजिक पद्धत आहे, आणि म्हणूनच इथले अंश जन्मस्थानाच्या निर्देशांकांवर मांडलेल्या पत्रिकेपेक्षा थोडे वेगळे आहेत.","gu":"તમારી વર્ષફળ કુંડળી તમે અત્યારે જ્યાં રહો છો એ શહેર માટે માંડેલી છે, જન્મસ્થાન માટે નહીં — આ જ શાસ્ત્રીય તાજિક પદ્ધતિ છે, અને એટલે જ અહીંના અંશ જન્મસ્થાનના નિર્દેશાંક પર માંડેલી કુંડળી કરતાં થોડા અલગ છે.","as":"আপোনাৰ বৰ্ষফল কুণ্ডলী আপুনি এতিয়া য'ত থাকে সেই চহৰৰ বাবে গণনা কৰা, জন্মস্থানৰ বাবে নহয় — এইটোৱেই শাস্ত্ৰীয় তাজিক পদ্ধতি, আৰু সেয়েহে ইয়াৰ অংশবোৰ জন্মস্থানৰ স্থানাংকত গণনা কৰা কুণ্ডলীতকৈ অলপ বেলেগ।"},"dashaSource":{"en":"The planet pair on each month comes from your running Vimshottari dasha. The Mudda dasha later in this report divides the same year by a different classical method, so the two will name different lords for the same month — both are correct, and read together they show where the systems agree.","hi":"हर माह पर दिया ग्रह-युग्म आपकी चल रही विंशोत्तरी दशा से आया है। इस रिपोर्ट में आगे दी गई मुद्दा दशा उसी वर्ष को एक भिन्न शास्त्रीय पद्धति से बाँटती है, इसलिए दोनों एक ही माह के लिए अलग स्वामी बताएँगी — दोनों सही हैं, और साथ पढ़ने पर वे दिखाती हैं कि दोनों पद्धतियाँ कहाँ सहमत होती हैं।","te":"ప్రతి నెలపై ఇచ్చిన గ్రహ జంట మీ ప్రస్తుతం నడుస్తున్న వింశోత్తరి దశ నుండి వచ్చినది. ఈ నివేదికలో ముందుకు వచ్చే ముద్దా దశ అదే సంవత్సరాన్ని వేరే శాస్త్ర పద్ధతిలో విభజిస్తుంది, కాబట్టి రెండూ ఒకే నెలకు వేర్వేరు అధిపతులను చెబుతాయి — రెండూ సరైనవే, కలిపి చదివితే ఏ చోట రెండు పద్ధతులూ ఏకీభవిస్తాయో తెలుస్తుంది.","kn":"ಪ್ರತಿ ತಿಂಗಳ ಮೇಲಿನ ಗ್ರಹ ಜೋಡಿ ನಿಮ್ಮ ಈಗ ನಡೆಯುತ್ತಿರುವ ವಿಂಶೋತ್ತರಿ ದಶೆಯಿಂದ ಬಂದದ್ದು. ಈ ವರದಿಯಲ್ಲಿ ಮುಂದೆ ಬರುವ ಮುದ್ದಾ ದಶಾ ಅದೇ ವರ್ಷವನ್ನು ಬೇರೆ ಶಾಸ್ತ್ರ ಪದ್ಧತಿಯಿಂದ ವಿಭಜಿಸುತ್ತದೆ, ಆದ್ದರಿಂದ ಎರಡೂ ಒಂದೇ ತಿಂಗಳಿಗೆ ಬೇರೆ ಅಧಿಪತಿಗಳನ್ನು ಹೇಳುತ್ತವೆ — ಎರಡೂ ಸರಿ, ಜೊತೆಗೆ ಓದಿದರೆ ಎಲ್ಲಿ ಎರಡೂ ಪದ್ಧತಿಗಳು ಒಪ್ಪುತ್ತವೆ ಎಂದು ತಿಳಿಯುತ್ತದೆ.","ta":"ஒவ்வொரு மாதத்திலும் உள்ள கிரக ஜோடி உங்கள் தற்போது நடக்கும் விம்சோத்தரி தசையிலிருந்து வருகிறது. இந்த அறிக்கையில் பின்னர் வரும் முத்தா தசை அதே ஆண்டை வேறொரு சாஸ்திர முறையில் பிரிக்கிறது, எனவே இரண்டும் ஒரே மாதத்திற்கு வெவ்வேறு அதிபதிகளைச் சொல்லும் — இரண்டும் சரி, சேர்த்துப் படித்தால் இரு முறைகளும் எங்கே ஒத்துப்போகின்றன என்பது தெரியும்.","bn":"প্রতিটি মাসের গ্রহ-জোড়া আপনার চলতি বিংশোত্তরী দশা থেকে এসেছে। এই রিপোর্টে পরে আসা মুদ্দা দশা সেই একই বছরকে ভিন্ন শাস্ত্রীয় পদ্ধতিতে ভাগ করে, তাই দুটি একই মাসের জন্য আলাদা অধিপতি বলবে — দুটিই ঠিক, আর একসঙ্গে পড়লে বোঝা যায় দুই পদ্ধতি কোথায় একমত।","mr":"प्रत्येक महिन्यावरील ग्रहजोडी तुमच्या चालू विंशोत्तरी दशेतून आली आहे. या अहवालात पुढे येणारी मुद्दा दशा त्याच वर्षाला वेगळ्या शास्त्रीय पद्धतीने विभागते, म्हणून दोन्ही एकाच महिन्यासाठी वेगळे स्वामी सांगतील — दोन्ही बरोबर, आणि एकत्र वाचल्यास दोन्ही पद्धती कुठे सहमत होतात ते दिसते.","gu":"દરેક મહિના પરની ગ્રહજોડી તમારી ચાલુ વિંશોત્તરી દશામાંથી આવી છે. આ અહેવાલમાં આગળ આવતી મુદ્દા દશા એ જ વર્ષને જુદી શાસ્ત્રીય પદ્ધતિથી વહેંચે છે, એટલે બંને એક જ મહિના માટે જુદા સ્વામી કહેશે — બંને સાચાં છે, અને સાથે વાંચતાં દેખાય છે કે બંને પદ્ધતિ ક્યાં સહમત થાય છે.","as":"প্ৰতিটো মাহৰ গ্ৰহ-যুটি আপোনাৰ চলি থকা বিংশোত্তৰী দশাৰ পৰা আহিছে। এই প্ৰতিবেদনত পিছত অহা মুদ্দা দশাই সেই একেই বছৰক বেলেগ শাস্ত্ৰীয় পদ্ধতিৰে ভাগ কৰে, সেয়েহে দুয়োটাই একেটা মাহৰ বাবে বেলেগ অধিপতি ক'ব — দুয়োটাই শুদ্ধ, আৰু একেলগে পঢ়িলে দেখা যায় দুয়োটা পদ্ধতি ক'ত একমত।"}},"fcGo":{"intro":{"en":"The ten-year table gives each year one line. This one opens the nearest twelve months, because that is the stretch you can actually plan around. Each row counts how many planetary movements sit in favourable houses from your birth Moon that month, and flags Jupiter and Saturn separately — they hold a position for months, so they colour a whole season rather than a week.","hi":"दस वर्ष की तालिका हर वर्ष को एक पंक्ति देती है। यह तालिका निकटतम बारह महीनों को खोलती है, क्योंकि यही वह अवधि है जिसकी योजना आप वास्तव में बना सकते हैं। हर पंक्ति गिनती है कि उस माह आपकी जन्म चंद्रराशि से कितने ग्रह-गोचर शुभ भावों में हैं, और बृहस्पति तथा शनि को अलग दिखाती है — वे महीनों तक एक स्थान पर रहते हैं, इसलिए वे किसी सप्ताह को नहीं, पूरी ऋतु को रंग देते हैं।","te":"పదేళ్ళ పట్టిక ప్రతి సంవత్సరానికీ ఒక వరుస ఇస్తుంది. ఈ పట్టిక సమీప పన్నెండు నెలలను విప్పుతుంది, ఎందుకంటే మీరు నిజంగా ప్రణాళిక వేసుకోగలిగే కాలం అదే. ఆ నెలలో మీ జన్మ చంద్రరాశి నుండి ఎన్ని గ్రహ చలనాలు శుభ భావాల్లో ఉన్నాయో ప్రతి వరుస లెక్కిస్తుంది, గురువు, శనిని వేరుగా చూపుతుంది — వారు నెలల తరబడి ఒకే స్థానంలో ఉంటారు కాబట్టి ఒక వారాన్ని కాక ఒక ఋతువునే రంగు వేస్తారు.","kn":"ಹತ್ತು ವರ್ಷಗಳ ಕೋಷ್ಟಕ ಪ್ರತಿ ವರ್ಷಕ್ಕೂ ಒಂದು ಸಾಲು ನೀಡುತ್ತದೆ. ಈ ಕೋಷ್ಟಕ ಹತ್ತಿರದ ಹನ್ನೆರಡು ತಿಂಗಳುಗಳನ್ನು ತೆರೆಯುತ್ತದೆ, ಏಕೆಂದರೆ ನೀವು ನಿಜವಾಗಿ ಯೋಜಿಸಬಹುದಾದ ಅವಧಿ ಅದೇ. ಆ ತಿಂಗಳಲ್ಲಿ ನಿಮ್ಮ ಜನ್ಮ ಚಂದ್ರರಾಶಿಯಿಂದ ಎಷ್ಟು ಗ್ರಹ ಚಲನೆಗಳು ಶುಭ ಭಾವಗಳಲ್ಲಿವೆ ಎಂದು ಪ್ರತಿ ಸಾಲು ಎಣಿಸುತ್ತದೆ, ಗುರು ಮತ್ತು ಶನಿಯನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ತೋರಿಸುತ್ತದೆ — ಅವರು ತಿಂಗಳುಗಟ್ಟಲೆ ಒಂದೇ ಸ್ಥಾನದಲ್ಲಿರುತ್ತಾರೆ, ಆದ್ದರಿಂದ ಒಂದು ವಾರವನ್ನಲ್ಲ ಇಡೀ ಋತುವನ್ನೇ ಬಣ್ಣಿಸುತ್ತಾರೆ.","ta":"பத்தாண்டு அட்டவணை ஒவ்வொரு ஆண்டுக்கும் ஒரு வரி தருகிறது. இந்த அட்டவணை அடுத்த பன்னிரண்டு மாதங்களை விரிக்கிறது, ஏனெனில் நீங்கள் உண்மையில் திட்டமிடக்கூடிய காலம் அதுவே. அந்த மாதத்தில் உங்கள் ஜென்ம சந்திர ராசியிலிருந்து எத்தனை கிரக நகர்வுகள் சுப பாவங்களில் உள்ளன என்பதை ஒவ்வொரு வரியும் கணக்கிடுகிறது, குரு மற்றும் சனியைத் தனியாகக் காட்டுகிறது — அவர்கள் மாதக்கணக்கில் ஒரே இடத்தில் இருப்பதால் ஒரு வாரத்தை அல்ல, ஒரு பருவத்தையே நிறமூட்டுகிறார்கள்.","bn":"দশ বছরের টেবিল প্রতিটি বছরকে একটি লাইন দেয়। এই টেবিলটি নিকটতম বারো মাস খুলে দেয়, কারণ সেটাই সেই সময় যা নিয়ে আপনি সত্যিই পরিকল্পনা করতে পারেন। প্রতিটি সারি গোনে সেই মাসে আপনার জন্ম চন্দ্ররাশি থেকে কতগুলি গ্রহচলন শুভ ভাবে আছে, আর বৃহস্পতি ও শনিকে আলাদা করে দেখায় — তাঁরা মাসের পর মাস এক জায়গায় থাকেন, তাই কোনো সপ্তাহ নয়, গোটা ঋতুকে রঙ দেন।","mr":"दहा वर्षांचा तक्ता प्रत्येक वर्षाला एक ओळ देतो. हा तक्ता जवळचे बारा महिने उलगडतो, कारण तोच काळ आहे ज्याचे तुम्ही खरोखर नियोजन करू शकता. प्रत्येक ओळ मोजते की त्या महिन्यात तुमच्या जन्म चंद्रराशीपासून किती ग्रहगती शुभ भावांत आहेत, आणि गुरु व शनी वेगळे दाखवते — ते महिनोन्महिने एकाच स्थानी राहतात, म्हणून ते एखाद्या आठवड्याला नव्हे तर संपूर्ण ऋतूला रंग देतात.","gu":"દસ વર્ષનું કોષ્ટક દરેક વર્ષને એક લીટી આપે છે. આ કોષ્ટક નજીકના બાર મહિના ખોલે છે, કારણ કે એ જ સમય છે જેનું તમે ખરેખર આયોજન કરી શકો. દરેક પંક્તિ ગણે છે કે એ મહિનામાં તમારી જન્મ ચંદ્રરાશિથી કેટલી ગ્રહગતિ શુભ ભાવોમાં છે, અને ગુરુ તથા શનિ અલગ બતાવે છે — એ મહિનાઓ સુધી એક જ સ્થાને રહે છે, એટલે એ કોઈ અઠવાડિયાને નહીં પણ આખી ઋતુને રંગ આપે છે.","as":"দহ বছৰৰ তালিকাই প্ৰতিটো বছৰক এটা শাৰী দিয়ে। এই তালিকাই ওচৰৰ বাৰ মাহ মেলি দিয়ে, কাৰণ সেইটোৱেই সেই সময় যাক লৈ আপুনি সঁচাকৈ পৰিকল্পনা কৰিব পাৰে। প্ৰতিটো শাৰীয়ে গণনা কৰে সেই মাহত আপোনাৰ জন্ম চন্দ্ৰৰাশিৰ পৰা কিমান গ্ৰহচলন শুভ ভাৱত আছে, আৰু বৃহস্পতি আৰু শনিক পৃথককৈ দেখুৱায় — তেওঁলোকে মাহৰ পিছত মাহ এটাই ঠাইত থাকে, সেয়েহে কোনো সপ্তাহক নহয়, গোটেই ঋতুক ৰং দিয়ে।"},"title":{"en":"The Next Twelve Months, Month by Month","hi":"आने वाले बारह महीने, माह दर माह","te":"రాబోయే పన్నెండు నెలలు, నెల నెలకూ","kn":"ಮುಂದಿನ ಹನ್ನೆರಡು ತಿಂಗಳು, ತಿಂಗಳಿಂದ ತಿಂಗಳಿಗೆ","ta":"அடுத்த பன்னிரண்டு மாதங்கள், மாதம் மாதமாக","bn":"আগামী বারো মাস, মাসে মাসে","mr":"पुढील बारा महिने, महिन्यामागून महिना","gu":"આવતા બાર મહિના, મહિને મહિને","as":"অহা বাৰ মাহ, মাহে মাহে"}},"fcYr":{"transits":{"en":"From your Moon","hi":"आपके चंद्र से","te":"మీ చంద్రుని నుండి","kn":"ನಿಮ್ಮ ಚಂದ್ರನಿಂದ","ta":"உங்கள் சந்திரனிலிருந்து","bn":"আপনার চন্দ্র থেকে","mr":"तुमच्या चंद्रापासून","gu":"તમારા ચંદ્રથી","as":"আপোনাৰ চন্দ্ৰৰ পৰা"},"transitNote":{"en":"Each year's rating comes from where Jupiter, Saturn and Rahu stand relative to your birth Moon that year — the house numbers beside each year are those positions. Two years can share the same reading when the three stand in the same houses under the same dasha lord; that repetition is the calculation being honest, not a shortcut.","hi":"हर वर्ष का आकलन इस बात से आता है कि उस वर्ष बृहस्पति, शनि और राहु आपकी जन्म चंद्रराशि के सापेक्ष कहाँ हैं — हर वर्ष के आगे दिए भाव-अंक वही स्थितियाँ हैं। जब तीनों एक ही भावों में हों और दशा स्वामी भी वही हो, तो दो वर्षों का पाठ एक जैसा हो सकता है; वह दोहराव गणना की ईमानदारी है, कोई शॉर्टकट नहीं।","te":"ప్రతి సంవత్సరపు అంచనా ఆ ఏడాది గురువు, శని, రాహువులు మీ జన్మ చంద్రరాశి సాపేక్షంగా ఎక్కడ ఉన్నారనే దాని నుండి వస్తుంది — ప్రతి సంవత్సరం పక్కన ఉన్న భావ సంఖ్యలే ఆ స్థానాలు. ముగ్గురూ ఒకే భావాల్లో ఉండి దశాధిపతి కూడా ఒకటే అయితే రెండు సంవత్సరాల పఠనం ఒకేలా ఉండవచ్చు; ఆ పునరావృత్తి లెక్క నిజాయితీగా ఉందని అర్థం, అడ్డదారి కాదు.","kn":"ಪ್ರತಿ ವರ್ಷದ ಮೌಲ್ಯಮಾಪನ ಆ ವರ್ಷ ಗುರು, ಶನಿ ಮತ್ತು ರಾಹು ನಿಮ್ಮ ಜನ್ಮ ಚಂದ್ರರಾಶಿಗೆ ಸಾಪೇಕ್ಷವಾಗಿ ಎಲ್ಲಿದ್ದಾರೆ ಎಂಬುದರಿಂದ ಬರುತ್ತದೆ — ಪ್ರತಿ ವರ್ಷದ ಪಕ್ಕದ ಭಾವ ಸಂಖ್ಯೆಗಳೇ ಆ ಸ್ಥಾನಗಳು. ಮೂವರೂ ಒಂದೇ ಭಾವಗಳಲ್ಲಿದ್ದು ದಶಾಧಿಪತಿಯೂ ಒಂದೇ ಆದಾಗ ಎರಡು ವರ್ಷಗಳ ಓದು ಒಂದೇ ಆಗಬಹುದು; ಆ ಪುನರಾವರ್ತನೆ ಲೆಕ್ಕ ಪ್ರಾಮಾಣಿಕವಾಗಿರುವುದರ ಸಂಕೇತ, ಅಡ್ಡದಾರಿಯಲ್ಲ.","ta":"ஒவ்வொரு ஆண்டின் மதிப்பீடும் அந்த ஆண்டு குரு, சனி, ராகு உங்கள் ஜென்ம சந்திர ராசிக்கு ஒப்பிட்டு எங்கே உள்ளனர் என்பதிலிருந்து வருகிறது — ஒவ்வொரு ஆண்டுக்கும் அருகில் உள்ள பாவ எண்களே அந்த நிலைகள். மூவரும் ஒரே பாவங்களில் இருந்து தசாதிபதியும் ஒன்றாக இருக்கும்போது இரு ஆண்டுகளின் வாசிப்பு ஒன்றாக இருக்கலாம்; அந்த மீள்வு கணக்கு நேர்மையாக இருப்பதன் அறிகுறி, குறுக்குவழி அல்ல.","bn":"প্রতিটি বছরের মূল্যায়ন আসে সেই বছর বৃহস্পতি, শনি ও রাহু আপনার জন্ম চন্দ্ররাশির সাপেক্ষে কোথায় আছেন তা থেকে — প্রতিটি বছরের পাশের ভাব সংখ্যাগুলিই সেই অবস্থান। তিনজনই একই ভাবে থাকলে এবং দশা অধিপতিও এক হলে দুই বছরের পাঠ একই হতে পারে; সেই পুনরাবৃত্তি গণনার সততা, কোনো শর্টকাট নয়।","mr":"प्रत्येक वर्षाचे मूल्यमापन त्या वर्षी गुरु, शनी आणि राहू तुमच्या जन्म चंद्रराशीच्या सापेक्ष कुठे आहेत यावरून येते — प्रत्येक वर्षाशेजारील भाव क्रमांक हीच ती स्थाने. तिघेही एकाच भावांत असून दशा स्वामीही तोच असेल तेव्हा दोन वर्षांचे वाचन सारखे असू शकते; ती पुनरावृत्ती म्हणजे गणनेचा प्रामाणिकपणा, शॉर्टकट नव्हे.","gu":"દરેક વર્ષનું મૂલ્યાંકન એ વર્ષે ગુરુ, શનિ અને રાહુ તમારી જન્મ ચંદ્રરાશિની સાપેક્ષે ક્યાં છે એના પરથી આવે છે — દરેક વર્ષની બાજુના ભાવ ક્રમાંક એ જ સ્થાનો છે. ત્રણેય એક જ ભાવમાં હોય અને દશા સ્વામી પણ એ જ હોય ત્યારે બે વર્ષનું વાચન સરખું હોઈ શકે; એ પુનરાવર્તન ગણતરીની પ્રામાણિકતા છે, શોર્ટકટ નહીં.","as":"প্ৰতিটো বছৰৰ মূল্যায়ন সেই বছৰ বৃহস্পতি, শনি আৰু ৰাহু আপোনাৰ জন্ম চন্দ্ৰৰাশিৰ সাপেক্ষে ক'ত আছে তাৰ পৰা আহে — প্ৰতিটো বছৰৰ কাষৰ ভাৱ সংখ্যাবোৰেই সেই অৱস্থান। তিনিওজন একেটা ভাৱত থাকিলে আৰু দশা অধিপতিও একেই হ'লে দুবছৰৰ পাঠ একে হ'ব পাৰে; সেই পুনৰাবৃত্তি গণনাৰ সততা, কোনো চৰ্টকাট নহয়।"}},"ssLbl":{"title":{"en":"Saturn's Long Passages Through Your Decade","hi":"आपके दशक में शनि के दीर्घ काल","te":"మీ దశాబ్దంలో శని దీర్ఘ కాలాలు","kn":"ನಿಮ್ಮ ದಶಕದಲ್ಲಿ ಶನಿಯ ದೀರ್ಘ ಕಾಲಗಳು","ta":"உங்கள் பத்தாண்டில் சனியின் நீண்ட காலங்கள்","bn":"আপনার দশকে শনির দীর্ঘ পর্ব","mr":"तुमच्या दशकातील शनीचे दीर्घ काळ","gu":"તમારા દાયકામાં શનિના દીર્ઘ કાળ","as":"আপোনাৰ দশকত শনিৰ দীঘলীয়া পৰ্ব"},"intro":{"en":"Saturn takes about two and a half years to cross a single sign, so its passages are measured in years rather than months. Three of those passages are named in classical practice: Sade Sati, when Saturn moves through the sign before your Moon, your Moon's own sign, and the one after; and the Dhaiyas, its shorter transits of the 4th and 8th from your Moon. The periods below are the ones that fall inside this forecast.","hi":"शनि एक राशि पार करने में लगभग ढाई वर्ष लेता है, इसलिए उसके काल महीनों में नहीं, वर्षों में गिने जाते हैं। शास्त्र में इनमें से तीन काल विशेष रूप से नामित हैं: साढ़े साती, जब शनि आपकी चंद्रराशि से पहले वाली, स्वयं चंद्रराशि और उसके बाद वाली राशि से गुजरता है; और ढैया, जो चंद्र से चतुर्थ और अष्टम में उसके छोटे गोचर हैं। नीचे वही काल हैं जो इस भविष्यवाणी की अवधि में पड़ते हैं।","te":"శని ఒక రాశిని దాటడానికి దాదాపు రెండున్నర సంవత్సరాలు తీసుకుంటాడు, కాబట్టి అతని కాలాలు నెలల్లో కాక సంవత్సరాల్లో లెక్కించబడతాయి. శాస్త్రంలో వీటిలో మూడు కాలాలకు ప్రత్యేక పేర్లు ఉన్నాయి: ఏలినాటి శని — శని మీ చంద్రరాశికి ముందు రాశి, చంద్రరాశి, తర్వాతి రాశి గుండా వెళ్ళే కాలం; ధైయ్యలు — చంద్రుని నుండి నాలుగవ, ఎనిమిదవ రాశుల్లో అతని చిన్న గోచారాలు. క్రింద ఈ అంచనా కాలంలో పడే కాలాలు ఉన్నాయి.","kn":"ಶನಿ ಒಂದು ರಾಶಿಯನ್ನು ದಾಟಲು ಸುಮಾರು ಎರಡೂವರೆ ವರ್ಷ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾನೆ, ಆದ್ದರಿಂದ ಅವನ ಕಾಲಗಳನ್ನು ತಿಂಗಳಲ್ಲಲ್ಲ ವರ್ಷಗಳಲ್ಲಿ ಎಣಿಸಲಾಗುತ್ತದೆ. ಶಾಸ್ತ್ರದಲ್ಲಿ ಇವುಗಳಲ್ಲಿ ಮೂರಕ್ಕೆ ವಿಶೇಷ ಹೆಸರುಗಳಿವೆ: ಏಳರ ಶನಿ — ಶನಿ ನಿಮ್ಮ ಚಂದ್ರರಾಶಿಯ ಹಿಂದಿನ ರಾಶಿ, ಚಂದ್ರರಾಶಿ ಮತ್ತು ಮುಂದಿನ ರಾಶಿಯ ಮೂಲಕ ಸಾಗುವ ಕಾಲ; ಧೈಯ್ಯಗಳು — ಚಂದ್ರನಿಂದ ನಾಲ್ಕನೇ ಮತ್ತು ಎಂಟನೇ ರಾಶಿಗಳಲ್ಲಿ ಅವನ ಚಿಕ್ಕ ಗೋಚಾರಗಳು. ಕೆಳಗೆ ಈ ಮುನ್ಸೂಚನೆಯ ಅವಧಿಯಲ್ಲಿ ಬರುವ ಕಾಲಗಳಿವೆ.","ta":"சனி ஒரு ராசியைக் கடக்க ஏறத்தாழ இரண்டரை ஆண்டுகள் எடுக்கிறார், எனவே அவரது காலங்கள் மாதங்களில் அல்ல ஆண்டுகளில் அளக்கப்படுகின்றன. சாஸ்திரத்தில் இவற்றுள் மூன்றுக்குச் சிறப்புப் பெயர்கள் உள்ளன: ஏழரைச் சனி — சனி உங்கள் சந்திர ராசிக்கு முந்தைய ராசி, சந்திர ராசி, அடுத்த ராசி வழியே செல்லும் காலம்; தையாக்கள் — சந்திரனிலிருந்து நான்காம், எட்டாம் ராசிகளில் அவரது குறுகிய பெயர்ச்சிகள். கீழே இந்த முன்னறிவிப்புக் காலத்தில் வரும் காலங்கள் உள்ளன.","bn":"শনি একটি রাশি পার হতে প্রায় আড়াই বছর নেন, তাই তাঁর পর্বগুলি মাসে নয়, বছরে মাপা হয়। শাস্ত্রে এর মধ্যে তিনটির বিশেষ নাম আছে: সাড়ে সাতি — যখন শনি আপনার চন্দ্ররাশির আগের রাশি, চন্দ্ররাশি এবং পরের রাশি দিয়ে যান; আর ঢাইয়া — চন্দ্র থেকে চতুর্থ ও অষ্টম রাশিতে তাঁর ছোট গোচর। নিচে সেই পর্বগুলি যা এই পূর্বাভাসের সময়ের মধ্যে পড়ে।","mr":"शनी एक राशी ओलांडायला जवळपास अडीच वर्षे घेतो, म्हणून त्याचे काळ महिन्यांत नव्हे तर वर्षांत मोजले जातात. शास्त्रात यांपैकी तिघांना विशेष नावे आहेत: साडेसाती — जेव्हा शनी तुमच्या चंद्रराशीच्या आधीच्या राशीतून, चंद्रराशीतून आणि नंतरच्या राशीतून जातो; आणि ढय्या — चंद्रापासून चतुर्थ आणि अष्टम राशीतले त्याचे लहान गोचर. खाली तेच काळ आहेत जे या भाकिताच्या कालावधीत येतात.","gu":"શનિ એક રાશિ પાર કરવામાં લગભગ અઢી વર્ષ લે છે, એટલે એના કાળ મહિનામાં નહીં પણ વર્ષોમાં મપાય છે. શાસ્ત્રમાં એમાંથી ત્રણને ખાસ નામ છે: સાડાસાતી — જ્યારે શનિ તમારી ચંદ્રરાશિની આગલી રાશિ, ચંદ્રરાશિ અને પછીની રાશિમાંથી પસાર થાય; અને ઢૈયા — ચંદ્રથી ચતુર્થ અને અષ્ટમ રાશિમાં એનાં નાનાં ગોચર. નીચે એ જ કાળ છે જે આ આગાહીના સમયગાળામાં આવે છે.","as":"শনিয়ে এটা ৰাশি পাৰ হ'বলৈ প্ৰায় আঢ়ৈ বছৰ লয়, সেয়েহে তেওঁৰ পৰ্ববোৰ মাহত নহয়, বছৰত জোখা হয়। শাস্ত্ৰত ইয়াৰে তিনিটাৰ বিশেষ নাম আছে: সাদে সতী — যেতিয়া শনি আপোনাৰ চন্দ্ৰৰাশিৰ আগৰ ৰাশি, চন্দ্ৰৰাশি আৰু পিছৰ ৰাশিৰে যায়; আৰু ঢাইয়া — চন্দ্ৰৰ পৰা চতুৰ্থ আৰু অষ্টম ৰাশিত তেওঁৰ চুটি গোচৰ। তলত সেই পৰ্ববোৰ যিবোৰ এই পূৰ্বাভাসৰ সময়ৰ ভিতৰত পৰে।"},"none":{"en":"None of Saturn's named passages fall within these ten years. That is simply what the calculation shows for your Moon sign in this decade — Saturn is still moving through your chart, and its year-by-year positions are marked on the decade table above.","hi":"इन दस वर्षों में शनि का कोई नामित काल नहीं पड़ता। आपकी चंद्रराशि के लिए इस दशक में गणना यही दिखाती है — शनि आपकी कुंडली में चलता तो रहता है, और उसकी वर्ष-दर-वर्ष स्थितियाँ ऊपर की दशक तालिका में अंकित हैं।","te":"ఈ పదేళ్ళలో శని పేరున్న కాలాలేవీ రావు. మీ చంద్రరాశికి ఈ దశాబ్దంలో లెక్క చూపేది ఇదే — శని మీ జాతకంలో కదులుతూనే ఉంటాడు, అతని సంవత్సరాల వారీ స్థానాలు పైన దశాబ్ద పట్టికలో గుర్తించబడ్డాయి.","kn":"ಈ ಹತ್ತು ವರ್ಷಗಳಲ್ಲಿ ಶನಿಯ ಹೆಸರಿಸಿದ ಯಾವ ಕಾಲವೂ ಬರುವುದಿಲ್ಲ. ನಿಮ್ಮ ಚಂದ್ರರಾಶಿಗೆ ಈ ದಶಕದಲ್ಲಿ ಲೆಕ್ಕ ತೋರಿಸುವುದು ಇದನ್ನೇ — ಶನಿ ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಚಲಿಸುತ್ತಲೇ ಇರುತ್ತಾನೆ, ಅವನ ವರ್ಷವಾರು ಸ್ಥಾನಗಳನ್ನು ಮೇಲಿನ ದಶಕ ಕೋಷ್ಟಕದಲ್ಲಿ ಗುರುತಿಸಲಾಗಿದೆ.","ta":"இந்தப் பத்தாண்டுகளில் சனியின் பெயரிடப்பட்ட எந்தக் காலமும் வரவில்லை. உங்கள் சந்திர ராசிக்கு இந்தப் பத்தாண்டில் கணக்குக் காட்டுவது இதுவே — சனி உங்கள் ஜாதகத்தில் நகர்ந்து கொண்டேதான் இருக்கிறார், அவரது ஆண்டு வாரியான நிலைகள் மேலே உள்ள பத்தாண்டு அட்டவணையில் குறிக்கப்பட்டுள்ளன.","bn":"এই দশ বছরে শনির কোনো নামাঙ্কিত পর্ব পড়ে না। আপনার চন্দ্ররাশির জন্য এই দশকে গণনা এটাই দেখায় — শনি আপনার কোষ্ঠীতে চলতেই থাকেন, আর তাঁর বছর-ভিত্তিক অবস্থান উপরের দশক তালিকায় চিহ্নিত।","mr":"या दहा वर्षांत शनीचा कोणताही नामांकित काळ येत नाही. तुमच्या चंद्रराशीसाठी या दशकात गणना हेच दाखवते — शनी तुमच्या पत्रिकेत चालतच असतो, आणि त्याची वर्षानुवर्षे स्थाने वरील दशक तक्त्यात नोंदवली आहेत.","gu":"આ દસ વર્ષમાં શનિનો કોઈ નામાંકિત કાળ આવતો નથી. તમારી ચંદ્રરાશિ માટે આ દાયકામાં ગણતરી એ જ બતાવે છે — શનિ તમારી કુંડળીમાં ચાલતો જ રહે છે, અને એનાં વર્ષવાર સ્થાનો ઉપરના દાયકા કોષ્ટકમાં નોંધ્યાં છે.","as":"এই দহ বছৰত শনিৰ কোনো নামাংকিত পৰ্ব নপৰে। আপোনাৰ চন্দ্ৰৰাশিৰ বাবে এই দশকত গণনাই এইটোৱেই দেখুৱায় — শনি আপোনাৰ কুণ্ডলীত চলিয়েই থাকে, আৰু তেওঁৰ বছৰ অনুসৰি অৱস্থান ওপৰৰ দশক তালিকাত চিহ্নিত।"},"note":{"en":"Classical texts read these passages as periods of tested endurance, not misfortune — Saturn asks for patience, honest work and care of the body, and rewards those who give them. Knowing the dates lets you plan around them rather than be surprised by them.","hi":"शास्त्र इन कालों को दुर्भाग्य नहीं, धैर्य की परीक्षा का समय मानते हैं — शनि धैर्य, ईमानदार परिश्रम और शरीर की देखभाल माँगता है, और जो ये देते हैं उन्हें फल भी देता है। तिथियाँ जान लेने से आप उनके अनुसार योजना बना सकते हैं, चौंकने के बजाय।","te":"శాస్త్రం ఈ కాలాలను దురదృష్టంగా కాక సహనం పరీక్షించే కాలాలుగా చదువుతుంది — శని ఓర్పు, నిజాయితీ కృషి, శరీర సంరక్షణ కోరతాడు, ఇచ్చినవారికి ఫలమూ ఇస్తాడు. తేదీలు తెలిస్తే ఆశ్చర్యపోయే బదులు వాటిని బట్టి ప్రణాళిక వేసుకోవచ్చు.","kn":"ಶಾಸ್ತ್ರ ಈ ಕಾಲಗಳನ್ನು ದುರದೃಷ್ಟವೆಂದಲ್ಲ, ಸಹನೆಯನ್ನು ಪರೀಕ್ಷಿಸುವ ಕಾಲಗಳೆಂದು ಓದುತ್ತದೆ — ಶನಿ ತಾಳ್ಮೆ, ಪ್ರಾಮಾಣಿಕ ಶ್ರಮ ಮತ್ತು ದೇಹದ ಆರೈಕೆ ಕೇಳುತ್ತಾನೆ, ಕೊಟ್ಟವರಿಗೆ ಫಲವನ್ನೂ ನೀಡುತ್ತಾನೆ. ದಿನಾಂಕಗಳು ಗೊತ್ತಿದ್ದರೆ ಆಶ್ಚರ್ಯಪಡುವ ಬದಲು ಅವುಗಳಿಗೆ ತಕ್ಕಂತೆ ಯೋಜಿಸಬಹುದು.","ta":"சாஸ்திரம் இந்தக் காலங்களைத் துரதிர்ஷ்டம் என்று அல்லாமல் சகிப்புத்தன்மையைச் சோதிக்கும் காலங்களாகப் படிக்கிறது — சனி பொறுமை, நேர்மையான உழைப்பு, உடல் பராமரிப்பு கேட்கிறார், தருபவர்களுக்குப் பலனும் தருகிறார். தேதிகள் தெரிந்தால் திடுக்கிடுவதற்குப் பதிலாக அவற்றுக்கேற்பத் திட்டமிடலாம்.","bn":"শাস্ত্র এই পর্বগুলিকে দুর্ভাগ্য নয়, সহনশীলতার পরীক্ষার সময় বলে পড়ে — শনি ধৈর্য, সৎ পরিশ্রম আর শরীরের যত্ন চান, আর যাঁরা তা দেন তাঁদের ফলও দেন। তারিখ জানা থাকলে চমকে ওঠার বদলে সেই অনুযায়ী পরিকল্পনা করা যায়।","mr":"शास्त्र या काळांना दुर्दैव नव्हे तर सहनशक्तीची परीक्षा मानतात — शनी संयम, प्रामाणिक कष्ट आणि शरीराची काळजी मागतो, आणि जे हे देतात त्यांना फळही देतो. तारखा माहीत असल्या की चकित होण्याऐवजी त्यानुसार नियोजन करता येते.","gu":"શાસ્ત્ર આ કાળોને દુર્ભાગ્ય નહીં પણ ધીરજની કસોટીનો સમય ગણે છે — શનિ ધીરજ, પ્રામાણિક મહેનત અને શરીરની સંભાળ માંગે છે, અને જે આપે એને ફળ પણ આપે છે. તારીખો જાણી લેવાથી ચોંકી જવાને બદલે એ પ્રમાણે આયોજન કરી શકાય.","as":"শাস্ত্ৰই এই পৰ্ববোৰক দুৰ্ভাগ্য নহয়, সহনশীলতাৰ পৰীক্ষাৰ সময় বুলি পঢ়ে — শনিয়ে ধৈৰ্য, সৎ পৰিশ্ৰম আৰু শৰীৰৰ যতন বিচাৰে, আৰু যিয়ে দিয়ে তেওঁলোকক ফলো দিয়ে। তাৰিখ জানিলে আচৰিত হোৱাৰ সলনি সেই অনুসৰি পৰিকল্পনা কৰিব পাৰি।"}},"lvD9":{"title":{"en":"Navamsa (D9) — The Marriage Chart","hi":"नवांश (D9) — विवाह की कुंडली","te":"నవాంశ (D9) — వివాహ జాతకం","kn":"ನವಾಂಶ (D9) — ವಿವಾಹ ಜಾತಕ","ta":"நவாம்சம் (D9) — திருமண ஜாதகம்","bn":"নবাংশ (D9) — বিবাহের কোষ্ঠী","mr":"नवमांश (D9) — विवाहाची पत्रिका","gu":"નવમાંશ (D9) — વિવાહની કુંડળી","as":"নৱাংশ (D9) — বিবাহৰ কুণ্ডলী"},"intro":{"en":"The birth chart shows what you are drawn to. The ninth divisional chart shows what partnership actually becomes — classical practice reads it for marriage specifically, which is why a Navamsa is cast before any match is considered. Yours is below, with its ascendant and all nine grahas.","hi":"जन्मकुंडली दिखाती है कि आप किसकी ओर खिंचते हैं। नवम वर्ग कुंडली दिखाती है कि साथ वास्तव में क्या बनता है — शास्त्र इसे विशेष रूप से विवाह के लिए पढ़ते हैं, इसीलिए कोई भी संबंध विचारने से पहले नवांश बनाया जाता है। आपका नवांश नीचे है, उसके लग्न और नौ ग्रहों के साथ।","te":"జన్మ జాతకం మీరు దేని వైపు ఆకర్షితులవుతారో చూపుతుంది. నవమ వర్గ జాతకం ఆ సాంగత్యం నిజంగా ఏమవుతుందో చూపుతుంది — శాస్త్రం దీన్ని ప్రత్యేకంగా వివాహం కోసం చదువుతుంది, అందుకే ఏ సంబంధాన్ని ఆలోచించే ముందైనా నవాంశ వేస్తారు. మీ నవాంశ క్రింద ఉంది, దాని లగ్నం, తొమ్మిది గ్రహాలతో సహా.","kn":"ಜನ್ಮ ಜಾತಕ ನೀವು ಯಾವುದರತ್ತ ಆಕರ್ಷಿತರಾಗುತ್ತೀರಿ ಎಂದು ತೋರಿಸುತ್ತದೆ. ನವಮ ವರ್ಗ ಜಾತಕ ಆ ಒಡನಾಟ ನಿಜವಾಗಿ ಏನಾಗುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ — ಶಾಸ್ತ್ರ ಇದನ್ನು ವಿಶೇಷವಾಗಿ ವಿವಾಹಕ್ಕಾಗಿ ಓದುತ್ತದೆ, ಅದಕ್ಕಾಗಿಯೇ ಯಾವುದೇ ಸಂಬಂಧವನ್ನು ಪರಿಗಣಿಸುವ ಮೊದಲು ನವಾಂಶ ಹಾಕಲಾಗುತ್ತದೆ. ನಿಮ್ಮ ನವಾಂಶ ಕೆಳಗಿದೆ, ಅದರ ಲಗ್ನ ಮತ್ತು ಒಂಬತ್ತು ಗ್ರಹಗಳೊಂದಿಗೆ.","ta":"ஜென்ம ஜாதகம் நீங்கள் எதன் மீது ஈர்க்கப்படுகிறீர்கள் என்பதைக் காட்டுகிறது. ஒன்பதாம் வர்க ஜாதகம் அந்தத் துணைமை உண்மையில் எதுவாகிறது என்பதைக் காட்டுகிறது — சாஸ்திரம் இதைத் திருமணத்திற்கெனவே படிக்கிறது, அதனாலேயே எந்தப் பொருத்தத்தையும் பரிசீலிக்கும் முன் நவாம்சம் அமைக்கப்படுகிறது. உங்கள் நவாம்சம் கீழே உள்ளது, அதன் லக்னம் மற்றும் ஒன்பது கிரகங்களுடன்.","bn":"জন্মকোষ্ঠী দেখায় আপনি কীসের দিকে টানেন। নবম বর্গ কোষ্ঠী দেখায় সেই সঙ্গ আসলে কী হয়ে ওঠে — শাস্ত্র একে বিশেষভাবে বিবাহের জন্য পড়ে, তাই কোনো সম্বন্ধ বিবেচনার আগেই নবাংশ তৈরি করা হয়। আপনার নবাংশ নিচে, তার লগ্ন ও নয়টি গ্রহ সহ।","mr":"जन्मपत्रिका दाखवते तुम्ही कशाकडे ओढले जाता. नवम वर्ग पत्रिका दाखवते ती सोबत प्रत्यक्षात काय होते — शास्त्र हिला विशेषतः विवाहासाठी वाचतात, म्हणूनच कोणतेही स्थळ विचारात घेण्याआधी नवमांश मांडला जातो. तुमचा नवमांश खाली आहे, त्याच्या लग्नासह आणि नऊ ग्रहांसह.","gu":"જન્મકુંડળી બતાવે છે તમે શેની તરફ ખેંચાઓ છો. નવમ વર્ગ કુંડળી બતાવે છે એ સાથ ખરેખર શું બને છે — શાસ્ત્ર એને ખાસ કરીને વિવાહ માટે વાંચે છે, એટલે જ કોઈ પણ સંબંધ વિચારતાં પહેલાં નવમાંશ માંડવામાં આવે છે. તમારો નવમાંશ નીચે છે, એના લગ્ન અને નવ ગ્રહો સાથે.","as":"জন্মকুণ্ডলীয়ে দেখুৱায় আপুনি কিহৰ ফালে আকৰ্ষিত হয়। নৱম বৰ্গ কুণ্ডলীয়ে দেখুৱায় সেই সংগ প্ৰকৃততে কি হৈ উঠে — শাস্ত্ৰই ইয়াক বিশেষকৈ বিবাহৰ বাবে পঢ়ে, সেয়েহে কোনো সম্বন্ধ বিবেচনা কৰাৰ আগতেই নৱাংশ সজা হয়। আপোনাৰ নৱাংশ তলত, ইয়াৰ লগ্ন আৰু ন টা গ্ৰহৰ সৈতে।"},"seventhTitle":{"en":"What Your Seventh House Says","hi":"आपका सप्तम भाव क्या कहता है","te":"మీ సప్తమ భావం ఏమి చెబుతుంది","kn":"ನಿಮ್ಮ ಸಪ್ತಮ ಭಾವ ಏನು ಹೇಳುತ್ತದೆ","ta":"உங்கள் ஏழாம் பாவம் என்ன சொல்கிறது","bn":"আপনার সপ্তম ভাব কী বলে","mr":"तुमचा सप्तम भाव काय सांगतो","gu":"તમારો સપ્તમ ભાવ શું કહે છે","as":"আপোনাৰ সপ্তম ভাৱে কি কয়"},"lordLine":{"en":"The seventh house governs partnership, and its lord carries that house's signature into your life. This is not a description of a person — it is the flavour the chart gives to partnership itself.","hi":"सप्तम भाव साझेदारी का है, और उसका स्वामी उस भाव का स्वर आपके जीवन में लाता है। यह किसी व्यक्ति का वर्णन नहीं है — यह वह रंग है जो कुंडली स्वयं साझेदारी को देती है।","te":"సప్తమ భావం భాగస్వామ్యానిది, దాని అధిపతి ఆ భావపు స్వరాన్ని మీ జీవితంలోకి తెస్తాడు. ఇది ఒక వ్యక్తి వర్ణన కాదు — జాతకం భాగస్వామ్యానికే ఇచ్చే రంగు ఇది.","kn":"ಸಪ್ತಮ ಭಾವ ಪಾಲುದಾರಿಕೆಯದು, ಅದರ ಅಧಿಪತಿ ಆ ಭಾವದ ಧ್ವನಿಯನ್ನು ನಿಮ್ಮ ಬದುಕಿಗೆ ತರುತ್ತಾನೆ. ಇದು ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ವರ್ಣನೆಯಲ್ಲ — ಜಾತಕ ಪಾಲುದಾರಿಕೆಗೇ ನೀಡುವ ಬಣ್ಣ ಇದು.","ta":"ஏழாம் பாவம் துணைமையினுடையது, அதன் அதிபதி அந்தப் பாவத்தின் தன்மையை உங்கள் வாழ்வுக்குக் கொண்டுவருகிறார். இது ஒரு நபரின் விவரணை அல்ல — ஜாதகம் துணைமைக்கே தரும் நிறம் இது.","bn":"সপ্তম ভাব অংশীদারিত্বের, আর তার অধিপতি সেই ভাবের সুর আপনার জীবনে আনেন। এটি কোনো ব্যক্তির বর্ণনা নয় — কোষ্ঠী নিজেই অংশীদারিত্বকে যে রং দেয়, এটি তা-ই।","mr":"सप्तम भाव भागीदारीचा आहे, आणि त्याचा स्वामी त्या भावाचा सूर तुमच्या आयुष्यात आणतो. हे कोणत्या व्यक्तीचे वर्णन नाही — पत्रिका स्वतः भागीदारीला जो रंग देते तो हा.","gu":"સપ્તમ ભાવ ભાગીદારીનો છે, અને એનો સ્વામી એ ભાવનો સૂર તમારા જીવનમાં લાવે છે. આ કોઈ વ્યક્તિનું વર્ણન નથી — કુંડળી પોતે ભાગીદારીને જે રંગ આપે છે એ આ.","as":"সপ্তম ভাৱ অংশীদাৰিত্বৰ, আৰু ইয়াৰ অধিপতিয়ে সেই ভাৱৰ সুৰ আপোনাৰ জীৱনলৈ আনে। এইটো কোনো ব্যক্তিৰ বৰ্ণনা নহয় — কুণ্ডলীয়ে নিজেই অংশীদাৰিত্বক যি ৰং দিয়ে, এইটো সেয়াই।"},"empty7":{"en":"No graha occupies your seventh house. This is the ordinary case — more charts have an empty seventh than a tenanted one — and it means the house is carried by its lord alone rather than coloured by a guest. Nothing is missing; the reading simply follows the lord.","hi":"आपके सप्तम भाव में कोई ग्रह नहीं है। यह सामान्य स्थिति है — रिक्त सप्तम भाव वाली कुंडलियाँ भरे हुए से अधिक होती हैं — और इसका अर्थ है कि भाव को केवल उसका स्वामी सँभालता है, कोई अतिथि उसे रंग नहीं देता। कुछ कम नहीं है; पाठ बस स्वामी का अनुसरण करता है।","te":"మీ సప్తమ భావంలో ఏ గ్రహమూ లేదు. ఇది సాధారణ స్థితి — ఖాళీ సప్తమ భావం ఉన్న జాతకాలే ఎక్కువ — దీని అర్థం ఆ భావాన్ని దాని అధిపతి ఒక్కడే మోస్తాడు, ఏ అతిథీ దానికి రంగు వేయడు. ఏదీ లోపించలేదు; పఠనం అధిపతిని అనుసరిస్తుంది అంతే.","kn":"ನಿಮ್ಮ ಸಪ್ತಮ ಭಾವದಲ್ಲಿ ಯಾವ ಗ್ರಹವೂ ಇಲ್ಲ. ಇದು ಸಾಮಾನ್ಯ ಸ್ಥಿತಿ — ಖಾಲಿ ಸಪ್ತಮ ಭಾವವಿರುವ ಜಾತಕಗಳೇ ಹೆಚ್ಚು — ಇದರ ಅರ್ಥ ಆ ಭಾವವನ್ನು ಅದರ ಅಧಿಪತಿಯೊಬ್ಬನೇ ಹೊರುತ್ತಾನೆ, ಯಾವ ಅತಿಥಿಯೂ ಅದಕ್ಕೆ ಬಣ್ಣ ಹಚ್ಚುವುದಿಲ್ಲ. ಏನೂ ಕೊರತೆಯಿಲ್ಲ; ಓದು ಅಧಿಪತಿಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ ಅಷ್ಟೆ.","ta":"உங்கள் ஏழாம் பாவத்தில் எந்தக் கிரகமும் இல்லை. இது சாதாரண நிலை — காலி ஏழாம் பாவம் உள்ள ஜாதகங்களே அதிகம் — இதன் பொருள் அந்தப் பாவத்தை அதன் அதிபதி மட்டுமே சுமக்கிறார், எந்த விருந்தாளியும் அதற்கு நிறம் தரவில்லை. எதுவும் குறையவில்லை; வாசிப்பு அதிபதியைப் பின்பற்றுகிறது அவ்வளவே.","bn":"আপনার সপ্তম ভাবে কোনো গ্রহ নেই। এটি সাধারণ অবস্থা — খালি সপ্তম ভাবের কোষ্ঠীই বেশি — আর এর অর্থ ভাবটিকে কেবল তার অধিপতিই বহন করেন, কোনো অতিথি তাকে রং দেন না। কিছুই কম নেই; পাঠ কেবল অধিপতিকে অনুসরণ করে।","mr":"तुमच्या सप्तम भावात कोणताही ग्रह नाही. ही सामान्य स्थिती आहे — रिकाम्या सप्तम भावाच्या पत्रिका भरलेल्यांपेक्षा जास्त असतात — आणि याचा अर्थ भाव फक्त त्याचा स्वामीच पेलतो, कोणी पाहुणा त्याला रंग देत नाही. काहीही कमी नाही; वाचन फक्त स्वामीचे अनुसरण करते.","gu":"તમારા સપ્તમ ભાવમાં કોઈ ગ્રહ નથી. આ સામાન્ય સ્થિતિ છે — ખાલી સપ્તમ ભાવવાળી કુંડળી ભરેલી કરતાં વધુ હોય છે — અને એનો અર્થ ભાવને ફક્ત એનો સ્વામી જ ઉપાડે છે, કોઈ મહેમાન એને રંગ આપતો નથી. કશું ઓછું નથી; વાચન ફક્ત સ્વામીને અનુસરે છે.","as":"আপোনাৰ সপ্তম ভাৱত কোনো গ্ৰহ নাই। এইটো সাধাৰণ অৱস্থা — খালী সপ্তম ভাৱৰ কুণ্ডলীয়েই বেছি — আৰু ইয়াৰ অৰ্থ ভাৱটো কেৱল ইয়াৰ অধিপতিয়েই বহন কৰে, কোনো অতিথিয়ে ইয়াক ৰং নিদিয়ে। একোৱেই কম নাই; পাঠে কেৱল অধিপতিক অনুসৰণ কৰে।"},"occupied7":{"en":"A graha sitting in the seventh adds its own colour to partnership, on top of the lord's. Both are shown below — the lord sets the terms, the occupant tints them.","hi":"सप्तम भाव में बैठा ग्रह स्वामी के ऊपर अपना रंग भी साझेदारी को देता है। दोनों नीचे दिए हैं — स्वामी शर्तें तय करता है, स्थित ग्रह उन्हें रंग देता है।","te":"సప్తమ భావంలో కూర్చున్న గ్రహం అధిపతి రంగుపై తన రంగునూ భాగస్వామ్యానికి కలుపుతుంది. రెండూ క్రింద ఇవ్వబడ్డాయి — అధిపతి నియమాలను నిర్ణయిస్తే, అందులోని గ్రహం వాటికి ఛాయ ఇస్తుంది.","kn":"ಸಪ್ತಮ ಭಾವದಲ್ಲಿ ಕುಳಿತ ಗ್ರಹ ಅಧಿಪತಿಯ ಮೇಲೆ ತನ್ನದೇ ಬಣ್ಣವನ್ನೂ ಪಾಲುದಾರಿಕೆಗೆ ಸೇರಿಸುತ್ತದೆ. ಎರಡನ್ನೂ ಕೆಳಗೆ ತೋರಿಸಲಾಗಿದೆ — ಅಧಿಪತಿ ನಿಯಮಗಳನ್ನು ನಿರ್ಧರಿಸಿದರೆ, ಒಳಗಿನ ಗ್ರಹ ಅವಕ್ಕೆ ಛಾಯೆ ನೀಡುತ್ತದೆ.","ta":"ஏழாம் பாவத்தில் அமர்ந்துள்ள கிரகம் அதிபதியின் மேல் தன் நிறத்தையும் துணைமைக்குச் சேர்க்கிறது. இரண்டும் கீழே காட்டப்பட்டுள்ளன — அதிபதி நிபந்தனைகளை நிர்ணயித்தால், உள்ளிருக்கும் கிரகம் அவற்றுக்குச் சாயம் தருகிறது.","bn":"সপ্তমে বসা গ্রহ অধিপতির উপরে নিজের রংও অংশীদারিত্বে যোগ করেন। দুটোই নিচে দেওয়া — অধিপতি শর্ত ঠিক করেন, অবস্থানকারী গ্রহ তাতে ছোঁয়া দেন।","mr":"सप्तमात बसलेला ग्रह स्वामीच्या वर स्वतःचा रंगही भागीदारीला जोडतो. दोन्ही खाली दिले आहेत — स्वामी अटी ठरवतो, स्थित ग्रह त्यांना छटा देतो.","gu":"સપ્તમમાં બેઠેલો ગ્રહ સ્વામી ઉપરાંત પોતાનો રંગ પણ ભાગીદારીમાં ઉમેરે છે. બંને નીચે બતાવ્યા છે — સ્વામી શરતો નક્કી કરે છે, સ્થિત ગ્રહ એને છાંય આપે છે.","as":"সপ্তমত বহা গ্ৰহে অধিপতিৰ ওপৰত নিজৰ ৰংও অংশীদাৰিত্বত যোগ কৰে। দুয়োটাই তলত দিয়া — অধিপতিয়ে চৰ্ত ঠিক কৰে, অৱস্থানকাৰী গ্ৰহে তাত ছাঁ দিয়ে।"},"elementNote":{"en":"The seventh sign's element and its lord's element are counted separately, and on most charts they differ. Together they describe the texture partnership takes — steady earth, moving air, warm fire, deep water — not the person who arrives.","hi":"सप्तम राशि का तत्व और उसके स्वामी का तत्व अलग-अलग गिने जाते हैं, और अधिकांश कुंडलियों में ये भिन्न होते हैं। दोनों मिलकर बताते हैं कि साझेदारी किस बनावट की होती है — स्थिर पृथ्वी, चलती वायु, ऊष्ण अग्नि, गहरा जल — न कि यह कि कौन आएगा।","te":"సప్తమ రాశి తత్వం, దాని అధిపతి తత్వం వేరువేరుగా లెక్కించబడతాయి, చాలా జాతకాల్లో ఇవి భిన్నంగా ఉంటాయి. రెండూ కలిసి భాగస్వామ్యం ఏ ఆకృతి తీసుకుంటుందో చెబుతాయి — స్థిరమైన భూమి, కదిలే వాయువు, వెచ్చని అగ్ని, లోతైన నీరు — ఎవరు వస్తారో కాదు.","kn":"ಸಪ್ತಮ ರಾಶಿಯ ತತ್ವ ಮತ್ತು ಅದರ ಅಧಿಪತಿಯ ತತ್ವ ಪ್ರತ್ಯೇಕವಾಗಿ ಎಣಿಸಲಾಗುತ್ತದೆ, ಹೆಚ್ಚಿನ ಜಾತಕಗಳಲ್ಲಿ ಇವು ಬೇರೆಯಾಗಿರುತ್ತವೆ. ಎರಡೂ ಸೇರಿ ಪಾಲುದಾರಿಕೆ ಯಾವ ವಿನ್ಯಾಸ ಪಡೆಯುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತವೆ — ಸ್ಥಿರ ಭೂಮಿ, ಚಲಿಸುವ ವಾಯು, ಬೆಚ್ಚನೆಯ ಅಗ್ನಿ, ಆಳವಾದ ನೀರು — ಯಾರು ಬರುತ್ತಾರೆ ಎಂದಲ್ಲ.","ta":"ஏழாம் ராசியின் தத்துவமும் அதன் அதிபதியின் தத்துவமும் தனித்தனியே கணக்கிடப்படுகின்றன, பெரும்பாலான ஜாதகங்களில் இவை வேறுபடுகின்றன. இரண்டும் சேர்ந்து துணைமை எந்த அமைப்பைப் பெறுகிறது என்பதைச் சொல்கின்றன — நிலையான பூமி, நகரும் காற்று, சூடான நெருப்பு, ஆழமான நீர் — யார் வருவார் என்பதல்ல.","bn":"সপ্তম রাশির উপাদান আর তার অধিপতির উপাদান আলাদাভাবে গোনা হয়, আর বেশিরভাগ কোষ্ঠীতে এ দুটি আলাদা। দুটি মিলে বলে অংশীদারিত্ব কেমন বুনটের হয় — স্থির মাটি, চলমান বাতাস, উষ্ণ আগুন, গভীর জল — কে আসবেন তা নয়।","mr":"सप्तम राशीचे तत्त्व आणि तिच्या स्वामीचे तत्त्व वेगवेगळे मोजले जातात, आणि बहुतांश पत्रिकांत ती भिन्न असतात. दोन्ही मिळून सांगतात की भागीदारी कोणत्या पोताची असते — स्थिर पृथ्वी, वाहती वायू, ऊबदार अग्नी, खोल जल — कोण येईल ते नव्हे.","gu":"સપ્તમ રાશિનું તત્ત્વ અને એના સ્વામીનું તત્ત્વ અલગ અલગ ગણાય છે, અને મોટા ભાગની કુંડળીમાં એ જુદાં હોય છે. બંને મળીને કહે છે કે ભાગીદારી કેવા પોતની હોય છે — સ્થિર પૃથ્વી, વહેતી વાયુ, હૂંફાળો અગ્નિ, ઊંડું જળ — કોણ આવશે એ નહીં.","as":"সপ্তম ৰাশিৰ উপাদান আৰু ইয়াৰ অধিপতিৰ উপাদান পৃথককৈ গণনা কৰা হয়, আৰু বেছিভাগ কুণ্ডলীত এই দুটা বেলেগ। দুয়োটা মিলি কয় অংশীদাৰিত্ব কেনে বুননৰ হয় — স্থিৰ মাটি, বৈ যোৱা বতাহ, উষ্ণ জুই, গভীৰ পানী — কোন আহিব সেয়া নহয়।"},"d9SeventhLbl":{"en":"Lord of the 7th in D9","hi":"नवांश में सप्तमेश","te":"నవాంశలో సప్తమాధిపతి","kn":"ನವಾಂಶದಲ್ಲಿ ಸಪ್ತಮಾಧಿಪತಿ","ta":"நவாம்சத்தில் ஏழாம் அதிபதி","bn":"নবাংশে সপ্তমাধিপতি","mr":"नवमांशातील सप्तमेश","gu":"નવમાંશમાં સપ્તમેશ","as":"নৱাংশত সপ্তমাধিপতি"},"signElement":{"en":"Sign element","hi":"राशि का तत्व","te":"రాశి తత్వం","kn":"ರಾಶಿ ತತ್ವ","ta":"ராசி தத்துவம்","bn":"রাশির উপাদান","mr":"राशीचे तत्त्व","gu":"રાશિનું તત્ત્વ","as":"ৰাশিৰ উপাদান"},"lordElement":{"en":"Lord's element","hi":"स्वामी का तत्व","te":"అధిపతి తత్వం","kn":"ಅಧಿಪತಿಯ ತತ್ವ","ta":"அதிபதியின் தத்துவம்","bn":"অধিপতির উপাদান","mr":"स्वामीचे तत्त्व","gu":"સ્વામીનું તત્ત્વ","as":"অধিপতিৰ উপাদান"}},"element":{"fire":{"en":"Fire","hi":"अग्नि","te":"అగ్ని","kn":"ಅಗ್ನಿ","ta":"அக்னி","bn":"অগ্নি","mr":"अग्नी","gu":"અગ્નિ","as":"অগ্নি"},"earth":{"en":"Earth","hi":"पृथ्वी","te":"పృథ్వి","kn":"ಪೃಥ್ವಿ","ta":"பிருதிவி","bn":"পৃথিবী","mr":"पृथ्वी","gu":"પૃથ્વી","as":"পৃথিৱী"},"air":{"en":"Air","hi":"वायु","te":"వాయువు","kn":"ವಾಯು","ta":"வாயு","bn":"বায়ু","mr":"वायू","gu":"વાયુ","as":"বায়ু"},"water":{"en":"Water","hi":"जल","te":"జలం","kn":"ಜಲ","ta":"ஜலம்","bn":"জল","mr":"जल","gu":"જળ","as":"জল"}},"lvTm":{"title":{"en":"When the Chart Leans Toward Partnership","hi":"कुंडली कब साझेदारी की ओर झुकती है","te":"జాతకం ఎప్పుడు భాగస్వామ్యం వైపు మొగ్గుతుంది","kn":"ಜಾತಕ ಯಾವಾಗ ಪಾಲುದಾರಿಕೆಯತ್ತ ವಾಲುತ್ತದೆ","ta":"ஜாதகம் எப்போது துணைமையை நோக்கிச் சாய்கிறது","bn":"কোষ্ঠী কখন অংশীদারিত্বের দিকে ঝোঁকে","mr":"पत्रिका कधी भागीदारीकडे झुकते","gu":"કુંડળી ક્યારે ભાગીદારી તરફ ઢળે છે","as":"কুণ্ডলী কেতিয়া অংশীদাৰিত্বৰ ফালে হালে"},"intro":{"en":"Two grahas govern partnership in your chart: Venus, and the lord of your seventh house. When either of them rules a dasha period, the chart's own attention turns toward relationship. The stretches below are those periods in the next ten years — they say when the chart leans that way, not when something will happen.","hi":"आपकी कुंडली में साझेदारी के दो अधिकारी हैं: शुक्र, और आपके सप्तम भाव का स्वामी। जब इनमें से कोई दशा काल का स्वामी होता है, तब कुंडली का अपना ध्यान संबंध की ओर मुड़ता है। नीचे दिए काल अगले दस वर्षों में वही अवधियाँ हैं — ये बताते हैं कि कुंडली कब उस ओर झुकती है, यह नहीं कि कब कुछ घटेगा।","te":"మీ జాతకంలో భాగస్వామ్యానికి ఇద్దరు అధికారులు: శుక్రుడు, మీ సప్తమ భావాధిపతి. వీరిలో ఎవరైనా దశా కాలానికి అధిపతి అయినప్పుడు, జాతకపు దృష్టి సంబంధం వైపు తిరుగుతుంది. క్రింది కాలాలు రాబోయే పదేళ్ళలో ఆ కాలాలే — జాతకం ఎప్పుడు ఆ వైపు మొగ్గుతుందో ఇవి చెబుతాయి, ఎప్పుడు ఏదో జరుగుతుందో కాదు.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಪಾಲುದಾರಿಕೆಗೆ ಇಬ್ಬರು ಅಧಿಕಾರಿಗಳು: ಶುಕ್ರ ಮತ್ತು ನಿಮ್ಮ ಸಪ್ತಮ ಭಾವಾಧಿಪತಿ. ಇವರಲ್ಲಿ ಯಾರಾದರೂ ದಶಾ ಕಾಲದ ಅಧಿಪತಿಯಾದಾಗ, ಜಾತಕದ ಗಮನ ಸಂಬಂಧದತ್ತ ತಿರುಗುತ್ತದೆ. ಕೆಳಗಿನ ಕಾಲಗಳು ಮುಂದಿನ ಹತ್ತು ವರ್ಷಗಳಲ್ಲಿ ಆ ಅವಧಿಗಳೇ — ಜಾತಕ ಯಾವಾಗ ಆ ಕಡೆ ವಾಲುತ್ತದೆ ಎಂದು ಇವು ಹೇಳುತ್ತವೆ, ಯಾವಾಗ ಏನೋ ನಡೆಯುತ್ತದೆ ಎಂದಲ್ಲ.","ta":"உங்கள் ஜாதகத்தில் துணைமைக்கு இரு அதிகாரிகள்: சுக்கிரன், மற்றும் உங்கள் ஏழாம் பாவ அதிபதி. இவர்களில் யாராவது ஒரு தசைக் காலத்தை ஆளும்போது, ஜாதகத்தின் கவனம் உறவை நோக்கித் திரும்புகிறது. கீழ்க்கண்ட காலங்கள் அடுத்த பத்தாண்டுகளில் அந்தக் காலங்களே — ஜாதகம் எப்போது அந்தப் பக்கம் சாய்கிறது என்பதை இவை சொல்கின்றன, எப்போது ஏதோ நடக்கும் என்பதல்ல.","bn":"আপনার কোষ্ঠীতে অংশীদারিত্বের দুই অধিকারী: শুক্র, আর আপনার সপ্তম ভাবের অধিপতি। এঁদের কেউ যখন দশা কালের অধিপতি হন, তখন কোষ্ঠীর নিজের মনোযোগ সম্পর্কের দিকে ফেরে। নিচের সময়গুলি আগামী দশ বছরে সেই পর্বই — এগুলি বলে কোষ্ঠী কখন সেদিকে ঝোঁকে, কখন কিছু ঘটবে তা নয়।","mr":"तुमच्या पत्रिकेत भागीदारीचे दोन अधिकारी: शुक्र, आणि तुमच्या सप्तम भावाचा स्वामी. यांपैकी कोणी दशा काळाचा स्वामी असतो तेव्हा पत्रिकेचे स्वतःचे लक्ष नात्याकडे वळते. खालील काळ पुढील दहा वर्षांतील तेच कालखंड आहेत — ते सांगतात पत्रिका कधी तिकडे झुकते, कधी काही घडेल हे नव्हे.","gu":"તમારી કુંડળીમાં ભાગીદારીના બે અધિકારી: શુક્ર, અને તમારા સપ્તમ ભાવનો સ્વામી. એમાંથી કોઈ દશા કાળનો સ્વામી હોય ત્યારે કુંડળીનું પોતાનું ધ્યાન સંબંધ તરફ વળે છે. નીચેના સમય આવતાં દસ વર્ષમાં એ જ ગાળા છે — એ કહે છે કુંડળી ક્યારે એ તરફ ઢળે છે, ક્યારે કંઈ બનશે એ નહીં.","as":"আপোনাৰ কুণ্ডলীত অংশীদাৰিত্বৰ দুজন অধিকাৰী: শুক্ৰ, আৰু আপোনাৰ সপ্তম ভাৱৰ অধিপতি। ইয়াৰে কোনোবাই যেতিয়া দশা কালৰ অধিপতি হয়, তেতিয়া কুণ্ডলীৰ নিজৰ মনোযোগ সম্পৰ্কৰ ফালে ঘূৰে। তলৰ সময়বোৰ অহা দহ বছৰত সেই পৰ্বকেইটাই — এইবোৰে কয় কুণ্ডলী কেতিয়া সেইফালে হালে, কেতিয়া কিবা ঘটিব সেয়া নহয়।"},"single":{"en":"One such stretch falls in the next ten years. That is the ordinary case — Venus and the seventh lord do not come round often, and most charts have one clear window rather than several. A single stretch is not a smaller opportunity; it is a longer, less divided one.","hi":"अगले दस वर्षों में ऐसा एक ही काल पड़ता है। यह सामान्य स्थिति है — शुक्र और सप्तमेश बार-बार नहीं आते, और अधिकांश कुंडलियों में कई नहीं, एक ही स्पष्ट अवधि होती है। एक ही अवधि का अर्थ कम अवसर नहीं; वह लंबी और कम बँटी हुई अवधि है।","te":"రాబోయే పదేళ్ళలో అలాంటి కాలం ఒక్కటే వస్తుంది. ఇది సాధారణ స్థితి — శుక్రుడు, సప్తమాధిపతి తరచుగా రారు, చాలా జాతకాల్లో అనేకం కాక ఒకే స్పష్టమైన కాలం ఉంటుంది. ఒకే కాలం అంటే తక్కువ అవకాశం కాదు; అది పొడవైన, తక్కువ విభజితమైన కాలం.","kn":"ಮುಂದಿನ ಹತ್ತು ವರ್ಷಗಳಲ್ಲಿ ಅಂತಹ ಒಂದೇ ಕಾಲ ಬರುತ್ತದೆ. ಇದು ಸಾಮಾನ್ಯ ಸ್ಥಿತಿ — ಶುಕ್ರ ಮತ್ತು ಸಪ್ತಮಾಧಿಪತಿ ಪದೇ ಪದೇ ಬರುವುದಿಲ್ಲ, ಹೆಚ್ಚಿನ ಜಾತಕಗಳಲ್ಲಿ ಹಲವಲ್ಲ ಒಂದೇ ಸ್ಪಷ್ಟ ಕಾಲವಿರುತ್ತದೆ. ಒಂದೇ ಕಾಲ ಎಂದರೆ ಕಡಿಮೆ ಅವಕಾಶವಲ್ಲ; ಅದು ಉದ್ದವಾದ, ಕಡಿಮೆ ವಿಭಜಿತ ಕಾಲ.","ta":"அடுத்த பத்தாண்டுகளில் அத்தகைய ஒரே காலம் வருகிறது. இது சாதாரண நிலை — சுக்கிரனும் ஏழாம் அதிபதியும் அடிக்கடி வருவதில்லை, பெரும்பாலான ஜாதகங்களில் பலவல்ல ஒரே தெளிவான காலம் இருக்கும். ஒரே காலம் என்பது குறைந்த வாய்ப்பு அல்ல; அது நீளமான, குறைவாகப் பிரிந்த காலம்.","bn":"আগামী দশ বছরে এমন একটিই পর্ব পড়ে। এটি সাধারণ অবস্থা — শুক্র আর সপ্তমাধিপতি ঘন ঘন আসেন না, বেশিরভাগ কোষ্ঠীতে অনেক নয়, একটিই স্পষ্ট সময় থাকে। একটিমাত্র পর্ব মানে কম সুযোগ নয়; সেটি দীর্ঘতর, কম ভাগ হওয়া একটি সময়।","mr":"पुढील दहा वर्षांत असा एकच काळ येतो. ही सामान्य स्थिती आहे — शुक्र आणि सप्तमेश वारंवार येत नाहीत, आणि बहुतांश पत्रिकांत अनेक नव्हे तर एकच स्पष्ट कालावधी असतो. एकच कालावधी म्हणजे कमी संधी नव्हे; तो अधिक लांब आणि कमी विभागलेला असतो.","gu":"આવતાં દસ વર્ષમાં એવો એક જ ગાળો આવે છે. આ સામાન્ય સ્થિતિ છે — શુક્ર અને સપ્તમેશ વારંવાર આવતા નથી, અને મોટા ભાગની કુંડળીમાં અનેક નહીં પણ એક જ સ્પષ્ટ ગાળો હોય છે. એક જ ગાળો એટલે ઓછી તક નહીં; એ લાંબો અને ઓછો વહેંચાયેલો ગાળો છે.","as":"অহা দহ বছৰত এনে এটাই পৰ্ব পৰে। এইটো সাধাৰণ অৱস্থা — শুক্ৰ আৰু সপ্তমাধিপতি সঘনাই নাহে, আৰু বেছিভাগ কুণ্ডলীত বহুতো নহয়, এটাই স্পষ্ট সময় থাকে। এটাই পৰ্ব মানে কম সুযোগ নহয়; সেয়া দীঘলীয়া আৰু কম ভাগ হোৱা এটা সময়।"},"multiple":{"en":"Several such stretches fall in the next ten years. They are not ranked — the chart does not say one is better than another, only that its partnership significators are forward during each. Read them alongside the year ratings elsewhere in this report.","hi":"अगले दस वर्षों में ऐसे कई काल पड़ते हैं। इनमें कोई श्रेणी नहीं — कुंडली यह नहीं कहती कि कोई दूसरे से बेहतर है, केवल यह कि हर काल में उसके साझेदारी कारक आगे रहते हैं। इन्हें इस रिपोर्ट के वार्षिक आकलनों के साथ पढ़िए।","te":"రాబోయే పదేళ్ళలో అలాంటి కాలాలు కొన్ని వస్తాయి. వీటిలో వరుస క్రమం లేదు — ఒకటి మరొకదాని కంటే మెరుగని జాతకం చెప్పదు, ప్రతి కాలంలోనూ దాని భాగస్వామ్య కారకాలు ముందుంటాయని మాత్రమే. వీటిని ఈ నివేదికలోని వార్షిక అంచనాలతో కలిపి చదవండి.","kn":"ಮುಂದಿನ ಹತ್ತು ವರ್ಷಗಳಲ್ಲಿ ಅಂತಹ ಹಲವು ಕಾಲಗಳು ಬರುತ್ತವೆ. ಇವುಗಳಲ್ಲಿ ಶ್ರೇಣಿಯಿಲ್ಲ — ಒಂದು ಇನ್ನೊಂದಕ್ಕಿಂತ ಉತ್ತಮ ಎಂದು ಜಾತಕ ಹೇಳುವುದಿಲ್ಲ, ಪ್ರತಿ ಕಾಲದಲ್ಲೂ ಅದರ ಪಾಲುದಾರಿಕೆ ಕಾರಕಗಳು ಮುಂದಿರುತ್ತವೆ ಎಂದಷ್ಟೇ. ಇವನ್ನು ಈ ವರದಿಯ ವಾರ್ಷಿಕ ಮೌಲ್ಯಮಾಪನಗಳೊಂದಿಗೆ ಓದಿ.","ta":"அடுத்த பத்தாண்டுகளில் அத்தகைய பல காலங்கள் வருகின்றன. இவற்றுக்கு வரிசைமுறை இல்லை — ஒன்று மற்றொன்றைவிடச் சிறந்தது என்று ஜாதகம் சொல்லவில்லை, ஒவ்வொரு காலத்திலும் அதன் துணைமைக் காரகங்கள் முன்னிற்கின்றன என்பது மட்டுமே. இவற்றை இந்த அறிக்கையின் ஆண்டு மதிப்பீடுகளுடன் சேர்த்துப் படியுங்கள்.","bn":"আগামী দশ বছরে এমন কয়েকটি পর্ব পড়ে। এদের কোনো ক্রম নেই — কোষ্ঠী বলে না যে একটি অন্যটির চেয়ে ভালো, কেবল বলে প্রতিটিতে তার অংশীদারিত্বের কারকগুলি এগিয়ে থাকে। এগুলি এই রিপোর্টের বার্ষিক মূল্যায়নের সঙ্গে মিলিয়ে পড়ুন।","mr":"पुढील दहा वर्षांत असे अनेक काळ येतात. यांना क्रम नाही — एक दुसऱ्यापेक्षा चांगला असे पत्रिका सांगत नाही, फक्त प्रत्येक काळात तिचे भागीदारी कारक पुढे असतात एवढेच. हे या अहवालातील वार्षिक मूल्यमापनांसोबत वाचा.","gu":"આવતાં દસ વર્ષમાં એવા કેટલાક ગાળા આવે છે. એમાં કોઈ ક્રમ નથી — એક બીજા કરતાં સારો છે એવું કુંડળી કહેતી નથી, ફક્ત દરેકમાં એના ભાગીદારી કારક આગળ હોય છે એટલું જ. આને આ અહેવાલનાં વાર્ષિક મૂલ્યાંકનો સાથે વાંચો.","as":"অহা দহ বছৰত এনে কেইবাটাও পৰ্ব পৰে। ইয়াৰ কোনো ক্ৰম নাই — এটা আনটোতকৈ ভাল বুলি কুণ্ডলীয়ে নকয়, কেৱল প্ৰতিটোত ইয়াৰ অংশীদাৰিত্বৰ কাৰকবোৰ আগত থাকে ইমানেই। এইবোৰ এই প্ৰতিবেদনৰ বাৰ্ষিক মূল্যায়নৰ সৈতে মিলাই পঢ়ক।"},"why":{"en":"Why this period","hi":"यह काल क्यों","te":"ఈ కాలం ఎందుకు","kn":"ಈ ಕಾಲ ಏಕೆ","ta":"இந்தக் காலம் ஏன்","bn":"এই সময় কেন","mr":"हा काळ का","gu":"આ સમય કેમ","as":"এই সময় কিয়"},"venusRules":{"en":"Venus, the natural significator of love, rules this period","hi":"प्रेम का नैसर्गिक कारक शुक्र इस काल का स्वामी है","te":"ప్రేమకు నైసర్గిక కారకుడైన శుక్రుడు ఈ కాలానికి అధిపతి","kn":"ಪ್ರೀತಿಯ ನೈಸರ್ಗಿಕ ಕಾರಕ ಶುಕ್ರ ಈ ಕಾಲದ ಅಧಿಪತಿ","ta":"காதலின் நைசர்கிக காரகரான சுக்கிரன் இந்தக் காலத்தின் அதிபதி","bn":"প্রেমের নৈসর্গিক কারক শুক্র এই সময়ের অধিপতি","mr":"प्रेमाचा नैसर्गिक कारक शुक्र या काळाचा स्वामी आहे","gu":"પ્રેમનો નૈસર્ગિક કારક શુક્ર આ સમયનો સ્વામી છે","as":"প্ৰেমৰ নৈসৰ্গিক কাৰক শুক্ৰ এই সময়ৰ অধিপতি"},"seventhRules":{"en":"The lord of your seventh house rules this period","hi":"आपके सप्तम भाव का स्वामी इस काल का अधिपति है","te":"మీ సప్తమ భావాధిపతి ఈ కాలానికి అధిపతి","kn":"ನಿಮ್ಮ ಸಪ್ತಮ ಭಾವಾಧಿಪತಿ ಈ ಕಾಲದ ಅಧಿಪತಿ","ta":"உங்கள் ஏழாம் பாவ அதிபதி இந்தக் காலத்தின் அதிபதி","bn":"আপনার সপ্তম ভাবের অধিপতি এই সময়ের অধিপতি","mr":"तुमच्या सप्तम भावाचा स्वामी या काळाचा अधिपती आहे","gu":"તમારા સપ્તમ ભાવનો સ્વામી આ સમયનો અધિપતિ છે","as":"আপোনাৰ সপ্তম ভাৱৰ অধিপতি এই সময়ৰ অধিপতি"},"criteria":{"en":"The seasons listed earlier blend several signals — Jupiter's transits from your Moon, the traditional age window, the D9 lords. This page counts only two: Venus, and the lord of your seventh house. That is why it names fewer stretches, and why the ones it names are the narrowest.","hi":"पहले दी गई ऋतुएँ कई संकेतों को मिलाकर बनी हैं — चंद्र से बृहस्पति के गोचर, पारंपरिक आयु-अवधि, नवांश के स्वामी। यह पृष्ठ केवल दो को गिनता है: शुक्र, और आपके सप्तम भाव का स्वामी। इसीलिए यहाँ कम काल दिखते हैं, और जो दिखते हैं वे सबसे सटीक हैं।","te":"ముందు ఇచ్చిన కాలాలు అనేక సంకేతాలను కలిపి రూపొందాయి — చంద్రుని నుండి గురువు గోచారాలు, సంప్రదాయ వయో పరిధి, నవాంశ అధిపతులు. ఈ పేజీ కేవలం రెండింటినే లెక్కిస్తుంది: శుక్రుడు, మీ సప్తమ భావాధిపతి. అందుకే ఇక్కడ తక్కువ కాలాలు కనిపిస్తాయి, కనిపించేవి అత్యంత నిర్దిష్టమైనవి.","kn":"ಮೊದಲು ನೀಡಿದ ಋತುಗಳು ಹಲವು ಸಂಕೇತಗಳನ್ನು ಬೆರೆಸಿ ರೂಪುಗೊಂಡಿವೆ — ಚಂದ್ರನಿಂದ ಗುರುವಿನ ಗೋಚಾರಗಳು, ಸಂಪ್ರದಾಯದ ವಯೋ ಅವಧಿ, ನವಾಂಶದ ಅಧಿಪತಿಗಳು. ಈ ಪುಟ ಕೇವಲ ಎರಡನ್ನೇ ಎಣಿಸುತ್ತದೆ: ಶುಕ್ರ ಮತ್ತು ನಿಮ್ಮ ಸಪ್ತಮ ಭಾವಾಧಿಪತಿ. ಅದಕ್ಕಾಗಿಯೇ ಇಲ್ಲಿ ಕಡಿಮೆ ಕಾಲಗಳು ಕಾಣುತ್ತವೆ, ಕಾಣುವವು ಅತ್ಯಂತ ನಿರ್ದಿಷ್ಟವಾದವು.","ta":"முன்பு தரப்பட்ட பருவங்கள் பல அறிகுறிகளைக் கலந்து உருவானவை — சந்திரனிலிருந்து குருவின் பெயர்ச்சிகள், மரபுவழி வயதுக் காலம், நவாம்ச அதிபதிகள். இந்தப் பக்கம் இரண்டை மட்டுமே கணக்கிடுகிறது: சுக்கிரன், மற்றும் உங்கள் ஏழாம் பாவ அதிபதி. அதனாலேயே இங்கே குறைவான காலங்கள் தெரிகின்றன, தெரிபவை மிகத் துல்லியமானவை.","bn":"আগে দেওয়া ঋতুগুলি অনেক সংকেত মিলিয়ে তৈরি — চন্দ্র থেকে বৃহস্পতির গোচর, পরম্পরাগত বয়সের সময়, নবাংশের অধিপতি। এই পাতাটি কেবল দুটি গোনে: শুক্র, আর আপনার সপ্তম ভাবের অধিপতি। সেই কারণেই এখানে কম পর্ব দেখা যায়, আর যেগুলি দেখা যায় সেগুলি সবচেয়ে নির্দিষ্ট।","mr":"आधी दिलेले ऋतू अनेक संकेत मिळून बनलेले आहेत — चंद्रापासून गुरुचे गोचर, पारंपरिक वयाचा कालावधी, नवमांशाचे स्वामी. हे पान फक्त दोन मोजते: शुक्र, आणि तुमच्या सप्तम भावाचा स्वामी. म्हणूनच इथे कमी काळ दिसतात, आणि जे दिसतात ते सर्वात नेमके आहेत.","gu":"પહેલાં આપેલી ઋતુઓ અનેક સંકેત ભેળવીને બની છે — ચંદ્રથી ગુરુનાં ગોચર, પરંપરાગત ઉંમરનો ગાળો, નવમાંશના સ્વામી. આ પાનું ફક્ત બે ગણે છે: શુક્ર, અને તમારા સપ્તમ ભાવનો સ્વામી. એટલે જ અહીં ઓછા ગાળા દેખાય છે, અને જે દેખાય છે એ સૌથી ચોક્કસ છે.","as":"আগতে দিয়া ঋতুবোৰ বহুতো সংকেত মিহলি হৈ গঢ়া — চন্দ্ৰৰ পৰা বৃহস্পতিৰ গোচৰ, পৰম্পৰাগত বয়সৰ সময়, নৱাংশৰ অধিপতি। এই পৃষ্ঠাই কেৱল দুটা গণনা কৰে: শুক্ৰ, আৰু আপোনাৰ সপ্তম ভাৱৰ অধিপতি। সেয়েহে ইয়াত কম পৰ্ব দেখা যায়, আৰু যিবোৰ দেখা যায় সেইবোৰ আটাইতকৈ নিৰ্দিষ্ট।"}}};})(typeof window!=='undefined'?window:global);

          return '<div style="font-size:10.5px;color:#8B5A2B;margin-top:5px;'

               + U('annGo.fav')+' '+(sm.favorableCount||0)
               + ' \u00b7 '+U('annGo.care')+' '+(sm.unfavorableCount||0)
               + slow
               + (ing.length ? '<br>' + ing.map(function(x){
                     return term('planet',x.graha)+' \u2192 '+term('rashi',x.to.en); }).join(', ') : '')
               + '</div>';
        })()
      +'</div>');
  }
  // SPLIT 6+6. Merging the gochar counts and ingresses into each card made the
  // 12-card grid ~1158px against a ~1055px sheet, so its tail would spill onto
  // a near-empty page. Measured before shipping rather than found in a PDF —
  // the Career pagination lesson. Two half-pages also give each card room.
  pg('<h2 class="sec">📆 '+T(L.months)+'</h2><div class="mgrid">'+mcards.slice(0,6).join('')+'</div>'
    + '<div style="font-size:11.5px;color:#8B5A2B;margin-top:10px;">'+U('annLbl.dashaSource')+'</div>');
  pg('<h2 class="sec">📆 '+T(L.months)+'</h2><div class="mgrid">'+mcards.slice(6).join('')+'</div>');
  // AUSPICIOUS DATES (griha/business-neutral: use business rules as general auspicious)
  // BUG FIX: this used Jan 1 - Dec 31 of forYear, a CALENDAR year, while the
  // varshaphal year runs solar return to solar return. On the test chart the
  // return is 7 Dec 2026, so the calendar window overlapped the real year by
  // 24 days out of 365 — the page listed dates from a year that had ENDED
  // before the report's own year began, and mostly already in the past at
  // generation time. Now anchored to vp.returnInstant like every other page.
  var fromD = vp && vp.returnInstant ? new Date(vp.returnInstant)
                                     : new Date(Date.UTC(CTX.forYear,0,1));
  var toD = new Date(fromD.getTime() + 365.25*86400000);
  var mh2=PE.findMuhurta('business',b,CTX.clat,CTX.clng,fromD,toD,6);
  var dts=mh2.results.slice(0,6).map(function(r){
    return '<div class="yog ok" style="font-size:13.5px;"><b>'+fD(r.date)+'</b> · '+term('nakshatra',r.nakshatra.en)+' · '+term('weekday',r.weekday.en)+'</div>';
  }).join('');
  pg('<h2 class="sec">🗓️ '+T(L.bestDates)+'</h2>'
    +'<div class="prose" style="font-size:13px;color:#8B5A2B;">'+U('annual.auspiciousIntro')+'</div>'+dts);


  // (standalone gochar page merged into the monthly cards above)


    // ---- MUDDA DASHA PAGE ----
  (function(){
    var md;
    try{ md = PE.getMuddaDasha(b, CTX.forYear); }catch(e){ return; }
    if(!md || !md.periods || !md.periods.length) return;
    var now = new Date();
    var rows = md.periods.map(function(p){
      var st = new Date(p.start), en = new Date(p.end);
      var isNow = st <= now && en >= now;
      return '<tr'+(isNow?' style="background:#FFF6E3;"':'')+'>'
        + '<td><b>'+term('planet', p.lord)+'</b>'+(isNow?' \u00b7 '+U('annU3.running'):'')+'</td>'
        + '<td>'+fD(st)+'</td><td>'+fD(en)+'</td>'
        + '<td>'+Math.round(p.days)+' '+U('annU3.days')+'</td></tr>';
    }).join('');
    pg('<h2 class="sec">'+U('annU3.muddaTitle')+'</h2>'
      + '<div class="prose">'+U('annU3.muddaIntro')+'</div>'
      + '<table><tr><th>'+U('cSec.ruledBy')+'</th><th>'+U('tblLbl.from')+'</th>'
      +   '<th>'+U('tblLbl.to')+'</th><th>'+U('annU3.days')+'</th></tr>'
      + rows + '</table>'
      + '<div style="font-size:11.5px;color:#8B5A2B;margin-top:10px;">'+U('annU3.muddaNote')+'</div>');
  })();


  // ---- ANTARDASHA PAGES (the 81) ----
  (function(){
    var md2;
    try{ md2 = PE.getMuddaDasha(b, CTX.forYear); }catch(e){ return; }
    if(!md2 || !md2.periods) return;
    var C2 = window.SD_CONTENT || {};
    var now = new Date();
    var loc = function(tbl, key){
      var o = C2[tbl] && C2[tbl][key];
      return o ? (o[LANG] || o.en || '') : '';
    };
    // TWO maha periods per page. Three was measured at ~1270px against a
    // ~1055px sheet — 18 rows plus two sub-headings plus the intro overflows,
    // and the tail would be orphaned onto a near-empty page. That is the exact
    // defect that cost six review rounds on Career, so the weight is checked
    // here rather than discovered in a PDF.
    var PER_PAGE = 2, first = true;
    for(var i = 0; i < md2.periods.length; i += PER_PAGE){
      var chunk = md2.periods.slice(i, i + PER_PAGE);
      var body = chunk.map(function(p){
        var subs = p.antardashas || [];
        if(!subs.length) return '';
        var rows = subs.map(function(a){
          var st = new Date(a.start), en = new Date(a.end);
          var isNow = st <= now && en >= now;
          var d = Math.max(1, Math.round((en - st) / 86400000));
          return '<tr'+(isNow?' style="background:#FFF6E3;"':'')+'>'
            + '<td>'+term('planet', a.lord)+(isNow?' \u00b7 '+U('annU3.running'):'')+'</td>'
            + '<td>'+fD(st)+'</td><td>'+fD(en)+'</td>'
            + '<td>'+d+'</td>'
            + '<td style="font-size:11px;">'+loc('prFlavor', a.lord)+'</td></tr>';
        }).join('');
        return '<h2 class="sec" style="font-size:15px;margin-top:14px;">'
             +   term('planet', p.lord)+' \u00b7 '+U('muddaLbl.antardasha')+'</h2>'
             + '<table><tr><th>'+U('cSec.ruledBy')+'</th><th>'+U('tblLbl.from')+'</th>'
             +   '<th>'+U('tblLbl.to')+'</th><th>'+U('annU3.days')+'</th>'
             +   '<th>'+U('dsh.emphasis')+'</th></tr>'+rows+'</table>';
      }).join('');
      if(!body) continue;
      pg((first ? '<h2 class="sec">'+U('annU3.antarTitle')+'</h2>'
                + '<div class="prose">'+U('annU3.antarIntro')+'</div>' : '')
        + body);
      first = false;
    }
  })();

    // ---- SAHAMS PAGE ----
  (function(){
    var sh;
    try{ sh = PE.getSahams(b, CTX.lat, CTX.lng, CTX.forYear, CTX.clat, CTX.clng); }catch(e){ return; }
    if(!sh || !sh.sahams || !sh.sahams.length) return;
    // HOUSE from the VARSHAPHAL ascendant, not the birth ascendant — this is a
    // year chart, so the year's lagna is the reference. One subtraction, no
    // engine work: ((sahamRashi - varshaLagna + 12) % 12) + 1. Verified on the
    // test chart: varsha lagna Dhanu(8), Vivaha in Simha(4) -> H9.
    var _vl = (vp && vp.chart && vp.chart.lagna) ? vp.chart.lagna.rashiIndex : null;
    var rows = sh.sahams.map(function(x){
      var h = (_vl == null) ? null : (((x.rashiIndex - _vl + 12) % 12) + 1);
      return '<tr><td><b>'+U('saham.'+x.key)+'</b></td>'
        + '<td>'+term('rashi', x.rashi.en)+' '+x.degreesInRashi.toFixed(1)+'\u00b0</td>'
        + '<td>'+(h == null ? '\u2014' : h)+'</td>'
        + '<td style="font-size:11px;">'+U('sahamMean.'+x.key)+'</td></tr>';
    }).join('');
    pg('<h2 class="sec">'+U('annU3.sahamTitle')+'</h2>'
      + '<div class="prose">'+U('annU3.sahamIntro')+'</div>'
      + '<table><tr><th>'+U('muddaLbl.sahamTitle')+'</th><th>'+U('tblLbl.sign')+'</th>'
      +   '<th>'+U('sahamLbl.house')+'</th><th>'+U('sahamLbl.meaning')+'</th></tr>'
      + rows + '</table>'
      + '<div style="font-size:11.5px;color:#8B5A2B;margin-top:10px;">'+U('sahamLbl.houseNote')+'</div>'
      + '<div style="font-size:11.5px;color:#8B5A2B;margin-top:8px;">'+U('annLbl.castFor')+'</div>');
  })();

    // REMEDIES + FOOTER (year lord remedy)
  var rem=[vLord].map(function(k){var r=C.remedy[k];return r?'<div class="yog"><b>'+(U('mantraLabel.'+k)||r.name)+'</b> — <span style="color:#8B2B33;">'+r.mantra+'</span><br>'+((window.SD_UI&&SD_UI.remedy&&SD_UI.remedy[k]&&SD_UI.remedy[k][LANG])||(LANG==='hi'?r.hi:r.en))+'</div>':'';}).join('');
  pg('<h2 class="sec">🙏 '+T(L.remedies)+'</h2>'
    +'<div class="prose" style="font-size:13px;">'+U('annual.remedyIntroPre')+gname2(vLord)+U('annual.remedyIntroPost')+'</div>'+rem
    +'<div class="foot">'+T(L.disclaimer)+'<br><b>'+U('brand.name')+' · shubhdin.app</b> · '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+'</div>');
  document.getElementById('report').innerHTML=H;
  var rep=document.getElementById('report');
  rep.className='lang-'+LANG;
  rep.setAttribute('lang',LANG);
  rep.style.display='block';
  document.getElementById('printbar').style.display='block';
  document.getElementById('inputScreen').style.display='none';
  window.scrollTo(0,0);
} catch(err){ alert('Report generation error: '+err.message+'\n\nLikely an outdated cached file — hard-refresh (Ctrl+Shift+R) and retry.'); console.error(err); } }
</script>
