<!-- ════════════════════════════════════════════════════════════════════════
     DISPATCH — Ram's control room. Admin-only, English-only (internal tool;
     WhatsApp templates below are in the BUYER's language).

     Security model: this file holds no secrets. It signs in with the same
     Google OAuth as buy.html; the server (api/order.js ?dispatch=1 …) verifies
     the session AND checks the uid against env SD_ADMIN_UIDS before the
     service key touches anything. A non-admin who finds this URL sees their
     own uid and an access-denied line, nothing else.

     The gate: every paid order is born dispatch_status='pending'. Nothing —
     no Download button, no pdf_url from ?list=1 — reaches the buyer until the
     order is moved to 'sent' HERE. Approve & Send opens WhatsApp with the
     message in the buyer's language; Mark Sent closes the loop.
     ════════════════════════════════════════════════════════════════════════ -->

var SESSION=null, ORDERS=[], LEADS=[], FO='pending', FL='waiting';

function show(id){['stAuth','stDenied','stMain'].forEach(function(x){document.getElementById(x).style.display=(x===id)?'block':'none';});}
function $(id){return document.getElementById(id);}
function signIn(){ if(!sb)return alert('Supabase CDN did not load — check the connection and reload.');
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}); }

/* Supabase returns tokens in the URL hash on OAuth redirect */
(function boot(){
  if(!sb){show('stAuth');return;}
  var h=location.hash;
  var fin=function(){ sb.auth.getSession().then(function(r){
    SESSION=r.data&&r.data.session;
    if(!SESSION){show('stAuth');return;}
    loadAll();
  });};
  if(h.indexOf('access_token=')>-1){
    var p={}; h.slice(1).split('&').forEach(function(kv){var a=kv.split('=');p[a[0]]=decodeURIComponent(a[1]||'');});
    sb.auth.setSession({access_token:p.access_token,refresh_token:p.refresh_token})
      .then(function(){try{history.replaceState(null,'',location.pathname);}catch(e){} fin();});
  } else fin();
})();

function api(qs){return fetch('/api/order?'+qs+'&uid='+SESSION.user.id+'&access_token='+encodeURIComponent(SESSION.access_token)).then(function(r){return r.json();});}
function apiPost(qs,body){body.admin_uid=SESSION.user.id;body.access_token=SESSION.access_token;
  return fetch('/api/order?'+qs,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();});}

function copyUid(){
  var u=SESSION&&SESSION.user?SESSION.user.id:'';
  try{navigator.clipboard.writeText(u);alert('Copied:\n'+u);}catch(e){prompt('Copy this uid:',u);}
}
/* Any answer that is not a real order list means we are not in yet — an
   unrecognised error, an older api/order.js that has no ?dispatch=1 mode, or
   a network failure. Every one of those paths must show the uid, because the
   uid is what Ram needs to unlock access. An empty board would look like
   "zero orders" and hide the actual problem. */
function cannotLoad(reason,detail){
  $('deniedUid').textContent=(SESSION&&SESSION.user)?SESSION.user.id:'(no session)';
  $('deniedMsg').textContent=reason;
  $('deniedRaw').textContent=detail?('Server said: '+detail):'';
  show('stDenied');
}
function loadAll(){
  $('subLine').textContent='Loading…';
  api('dispatch=1').then(function(j){
    if(j&&j.error==='admin only'){
      $('deniedIco').textContent='⛔';
      cannotLoad('This account is not on the admin list yet.',null); return; }
    if(!j||!Array.isArray(j.orders)){
      /* the giveaway: an api/order.js without the dispatch mode answers the
         plain GET contract instead ("uid and report required"). */
      var stale=j&&/report required/i.test(String(j.error||''));
      $('deniedIco').textContent=stale?'📦':'⚠️';
      cannotLoad(stale
        ? 'The new api/order.js is not deployed yet — upload it (Step 3), then reload this page.'
        : 'Could not read the orders list.',
        (j&&(j.error||j.detail))||'no orders array in the response');
      return; }
    ORDERS=j.orders;
    show('stMain');
    $('subLine').textContent=(SESSION.user.email||'')+' · uid '+SESSION.user.id+' · '+new Date().toLocaleString('en-IN');
    renderOrders();
    api('leads=1').then(function(k){ LEADS=(k&&k.leads)||[]; renderLeads(); });
  }).catch(function(e){ $('deniedIco').textContent='⚠️'; cannotLoad('Could not reach /api/order.',e.message); });
}

function showTab(t){
  $('paneO').style.display=t==='o'?'block':'none';
  $('paneL').style.display=t==='l'?'block':'none';
  $('tabO').className='tab'+(t==='o'?' on':''); $('tabL').className='tab'+(t==='l'?' on':'');
}

function fillTpl(kind,lang,vars){
  var t=(TPL[kind]&&(TPL[kind][lang]||TPL[kind].hi))||'';
  return t.replace('{name}',vars.name?(' '+vars.name):'')
          .replace('{report}',vars.report||'').replace('{code}',vars.code||'')
          .replace('{link}',vars.link||'');
}
function waLink(phone,text){return 'https://wa.me/'+phone+'?text='+encodeURIComponent(text);}

/* ── size floors: below this, a PDF is almost certainly broken/blank ──
   These are deliberately conservative; eyeball the PDF from the card anyway. */
var MIN_BYTES={marriage:150000,love:120000,career:120000,child:120000,annual:120000,forecast:130000,muhurta:100000,kundli:400000};

function hoursSince(iso){return Math.floor((Date.now()-new Date(iso).getTime())/36e5);}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ══ ORDERS ══ */
function orderChecks(o){
  var t=[];
  t.push({ok:true,txt:'Payment verified — ₹'+o.amount+' · '+(o.payment_id||'?')});
  if(o.pdf_url){
    var big=(o.pdf_bytes||0)>=(MIN_BYTES[o.report]||120000);
    t.push({ok:big,txt:'PDF exists · '+Math.round((o.pdf_bytes||0)/1024)+' KB'+(big?'':' — SUSPICIOUSLY SMALL, open it')});
    t.push({ok:!!o.pdf_lang_scoped,warn:!o.pdf_lang_scoped,txt:o.pdf_lang_scoped?('Language-correct PDF ('+o.lang+')'):('Only a LEGACY PDF found — language unknown; ask the buyer to reopen the report in the app to re-render in '+o.lang)});
  } else {
    t.push({ok:false,txt:'No PDF yet — buyer\'s device renders it in the background after payment; if this stays red, WhatsApp them to reopen the report in the app (birth details never touch the server, so it cannot be re-rendered from here)'});
  }
  t.push({ok:!!o.phone,txt:o.phone?('WhatsApp number +'+o.phone):'No phone on the order — older purchase or form skipped; get it on WhatsApp/email first'});
  return t;
}
function renderOrders(){
  var counts={pending:0,approved:0,sent:0,problem:0};
  ORDERS.forEach(function(o){counts[o.dispatch_status||'pending']=(counts[o.dispatch_status||'pending']||0)+1;});
  $('cntO').textContent='('+ORDERS.length+')';
  $('sumO').innerHTML='<span class="pill">⏳ Pending <b>'+(counts.pending||0)+'</b></span>'
    +'<span class="pill">✅ Approved <b>'+(counts.approved||0)+'</b></span>'
    +'<span class="pill">📤 Sent <b>'+(counts.sent||0)+'</b></span>'
    +'<span class="pill">⚠️ Problem <b>'+(counts.problem||0)+'</b></span>';
  $('filtO').innerHTML=['pending','approved','sent','problem','all'].map(function(f){
    return '<button class="f'+(FO===f?' on':'')+'" onclick="FO=\''+f+'\';renderOrders()">'+f+'</button>';}).join('');
  var q=($('qO').value||'').toLowerCase();
  var rows=ORDERS.filter(function(o){
    if(FO!=='all'&&(o.dispatch_status||'pending')!==FO)return false;
    if(q&&((o.email||'')+(o.order_code||'')+o.report+(o.phone||'')).toLowerCase().indexOf(q)<0)return false;
    return true;});
  if(!rows.length){$('listO').innerHTML='<div class="empty">Nothing here.<br>New paid orders arrive as ⏳ pending.</div>';return;}
  $('listO').innerHTML=rows.map(function(o){
    var st=o.dispatch_status||'pending';
    var age=hoursSince(o.created_at);
    var stale=(st==='pending'||st==='approved')&&age>=36;   /* 48h promise at risk */
    var ticks=orderChecks(o);
    var allGreen=ticks.every(function(t){return t.ok;});
    var name=(o.email||'').split('@')[0];
    var msg=fillTpl('report',o.lang,{name:name,report:(REPORT_NAME[o.report]&&(REPORT_NAME[o.report][o.lang]||REPORT_NAME[o.report].en))||o.report,code:o.order_code,link:o.pdf_url||''});
    var key=esc(o.uid)+'|'+esc(o.report);
    var b='';
    if(o.pdf_url)b+='<a class="b grey" href="'+esc(o.pdf_url)+'" target="_blank">👁️ Open PDF</a>';
    if(st==='pending')
      b+='<button class="b gold" '+(allGreen?'':'disabled title="fix the red ticks first"')+' onclick="approveSend(\''+key+'\')">✅ Approve &amp; WhatsApp</button>';
    if(st==='approved'){
      b+='<a class="b gold" href="'+(o.phone?waLink(o.phone,msg):'#')+'" target="_blank">💬 WhatsApp again</a>';
      b+='<button class="b green" onclick="setState(\''+key+'\',\'sent\')">📤 Mark Sent — buyer has it</button>';}
    if(st!=='sent'&&st!=='problem')b+='<button class="b red" onclick="setProblem(\''+key+'\')">⚠️ Problem</button>';
    if(st==='problem')b+='<button class="b grey" onclick="setState(\''+key+'\',\'pending\')">↩︎ Back to pending</button>';
    if(st==='sent')b+='<span class="tick ok" style="font-size:11px;align-self:center;">Sent '+(o.sent_at?new Date(o.sent_at).toLocaleString('en-IN'):'')+'</span>';
    return '<div class="card'+(st==='problem'?' problem':'')+(stale?' stale':'')+'">'
      +'<div class="row1"><span class="rep">'+esc(o.report)+'</span><span class="amt">₹'+o.amount+'</span>'
      +'<span class="lang">'+esc(o.lang)+'</span><span class="state st-'+st+'">'+st+'</span>'
      +'<span class="age'+(stale?' hot':'')+'">'+(stale?'⏰ ':'')+age+'h ago</span></div>'
      +'<div class="who">'+esc(o.email||o.uid)+' · '+esc(o.order_code||'')+'</div>'
      +'<div class="ticks">'+ticks.map(function(t){return '<div class="tick '+(t.ok?'ok':(t.warn?'warn':'bad'))+'">'+(t.ok?'✓':(t.warn?'△':'✗'))+' <span>'+esc(t.txt)+'</span></div>';}).join('')+'</div>'
      +(o.note?'<div class="note">📝 '+esc(o.note)+'</div>':'')
      +'<div class="btns">'+b+'</div></div>';
  }).join('');
}
function findO(key){var a=key.split('|');return ORDERS.filter(function(o){return o.uid===a[0]&&o.report===a[1];})[0];}
/* Approve = record 'approved', then open WhatsApp with the filled template.
   Two explicit steps (Approve → Mark Sent) so "did it actually go?" always
   has a truthful answer in the ledger. */
function approveSend(key){
  var o=findO(key); if(!o)return;
  apiPost('dispatch_set=1',{uid:o.uid,report:o.report,dispatch_status:'approved'}).then(function(j){
    if(!j||!j.ok)return alert('Could not save: '+((j&&j.error)||'?'));
    o.dispatch_status='approved';renderOrders();
    var name=(o.email||'').split('@')[0];
    var msg=fillTpl('report',o.lang,{name:name,report:(REPORT_NAME[o.report]&&(REPORT_NAME[o.report][o.lang]||REPORT_NAME[o.report].en))||o.report,code:o.order_code,link:o.pdf_url||''});
    if(o.phone)window.open(waLink(o.phone,msg),'_blank');
  });
}
function setState(key,st){
  var o=findO(key); if(!o)return;
  apiPost('dispatch_set=1',{uid:o.uid,report:o.report,dispatch_status:st}).then(function(j){
    if(!j||!j.ok)return alert('Could not save: '+((j&&j.error)||'?'));
    o.dispatch_status=st; if(st==='sent')o.sent_at=new Date().toISOString();
    renderOrders();
  });
}
function setProblem(key){
  var o=findO(key); if(!o)return;
  var note=prompt('What is wrong? (saved on the order)','');
  if(note===null)return;
  apiPost('dispatch_set=1',{uid:o.uid,report:o.report,dispatch_status:'problem',note:note}).then(function(j){
    if(!j||!j.ok)return alert('Could not save: '+((j&&j.error)||'?'));
    o.dispatch_status='problem';o.note=note;renderOrders();
  });
}

/* ══ LEADS ══ */
function renderLeads(){
  $('cntL').textContent='('+LEADS.length+')';
  var waiting=LEADS.filter(function(l){return !l.kundli_sent_at;}).length;
  $('sumL').innerHTML='<span class="pill">🪔 Waiting for Kundli <b>'+waiting+'</b></span>'
    +'<span class="pill">📤 Kundli sent <b>'+(LEADS.length-waiting)+'</b></span>'
    +'<span class="pill">👥 Total opt-ins <b>'+LEADS.length+'</b></span>';
  $('filtL').innerHTML=[['waiting','waiting for kundli'],['sent','kundli sent'],['all','all']].map(function(f){
    return '<button class="f'+(FL===f[0]?' on':'')+'" onclick="FL=\''+f[0]+'\';renderLeads()">'+f[1]+'</button>';}).join('');
  var q=($('qL').value||'').toLowerCase();
  var rows=LEADS.filter(function(l){
    if(FL==='waiting'&&l.kundli_sent_at)return false;
    if(FL==='sent'&&!l.kundli_sent_at)return false;
    if(q&&((l.name||'')+(l.phone||'')).toLowerCase().indexOf(q)<0)return false;
    return true;});
  if(!rows.length){$('listL').innerHTML='<div class="empty">No leads here yet.<br>They arrive when someone ticks the WhatsApp box on the free Kundli form.</div>';return;}
  $('listL').innerHTML=rows.map(function(l){
    var kmsg=fillTpl('kundli',l.lang,{name:l.name||'',link:l.kundli_pdf_url||''});
    var ticks=[
      {ok:!!l.kundli_pdf_url,txt:l.kundli_pdf_url?('Kundli PDF ready · '+Math.round((l.kundli_pdf_bytes||0)/1024)+' KB'):'Kundli PDF not rendered yet — it appears after they finish generating in the app'},
      {ok:!!l.phone,txt:'+'+(l.phone||'?')+' · '+(l.lang||'hi').toUpperCase()}];
    var b='';
    if(l.kundli_pdf_url&&!l.kundli_sent_at)
      b+='<a class="b gold" href="'+waLink(l.phone,kmsg)+'" target="_blank" onclick="leadMark(\''+esc(l.uid)+'\',\'kundli_sent\')">🪔 Send Kundli on WhatsApp</a>';
    if(l.kundli_sent_at)
      b+='<span class="tick ok" style="font-size:11px;align-self:center;">Kundli sent '+new Date(l.kundli_sent_at).toLocaleDateString('en-IN')+'</span>';
    b+='<button class="b grey" onclick="notifyLead(\''+esc(l.uid)+'\')">🔔 Notify</button>';
    return '<div class="card">'
      +'<div class="row1"><span class="rep">'+esc(l.name||'(no name)')+'</span><span class="lang">'+esc(l.lang)+'</span>'
      +'<span class="age">'+(l.last_notified_at?('last notified '+new Date(l.last_notified_at).toLocaleDateString('en-IN')):'never notified')+'</span></div>'
      +'<div class="ticks">'+ticks.map(function(t){return '<div class="tick '+(t.ok?'ok':'bad')+'">'+(t.ok?'✓':'✗')+' <span>'+esc(t.txt)+'</span></div>';}).join('')+'</div>'
      +'<div class="btns">'+b+'</div>'
      +'<select class="tsel" id="tpl_'+esc(l.uid)+'" style="display:none;">'
      +'<option value="jap">🪔 Jap reminder</option><option value="panchang">🌅 Panchang nudge</option></select>'
      +'</div>';
  }).join('');
}
function findL(uid){return LEADS.filter(function(l){return l.uid===uid;})[0];}
function leadMark(uid,action){
  apiPost('lead_set=1',{uid:uid,action:action}).then(function(j){
    var l=findL(uid); if(l&&j&&j.ok){if(action==='kundli_sent')l.kundli_sent_at=new Date().toISOString();
      if(action==='notified')l.last_notified_at=new Date().toISOString(); renderLeads();}
  });
}
/* Notify: pick a template, WhatsApp opens, mark notified. One person, one
   tap, no bulk blast — that restraint is what keeps the number alive. */
function notifyLead(uid){
  var l=findL(uid); if(!l)return;
  var sel=$('tpl_'+uid);
  if(sel.style.display==='none'){sel.style.display='block';sel.focus();
    sel.onchange=function(){
      var msg=fillTpl(sel.value,l.lang,{name:l.name||''});
      window.open(waLink(l.phone,msg),'_blank');
      leadMark(uid,'notified'); sel.style.display='none';};
    return;}
  sel.style.display='none';
}
</script>
