<head>
<meta charset="UTF-8">

<title>Shubh Din — Marriage Compatibility Report</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada:wght@400;500;600;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;500;600;700&display=block" rel="stylesheet">

<style>
:root{--ink:#5C1A1B;--gold:#B8860B;--gold2:#D4A843;--paper:#FFFDF6;--soft:#8B5A2B;--saffron:#E8730C;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
body{background:#EFE9DC;font-family:'Noto Serif Devanagari',serif;color:var(--ink);}
.screen{max-width:860px;margin:24px auto;background:var(--paper);border:1px solid var(--gold2);border-radius:12px;padding:28px;}
h1.brand{font-size:24px;text-align:center;}
.sub{text-align:center;color:var(--soft);font-size:13px;margin:4px 0 16px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.pcol{border:1px dashed var(--gold2);border-radius:10px;padding:12px;}
.pcol h3{color:var(--saffron);font-size:16px;margin-bottom:6px;text-align:center;}
label{display:block;font-size:12px;color:var(--soft);margin:8px 0 3px;}
input,select,button{font-family:inherit;font-size:14px;padding:8px 9px;border:1px solid var(--gold2);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
button{background:linear-gradient(135deg,#8B2B33,#5C1A1B);color:#FFE8C8;border:none;cursor:pointer;margin-top:14px;font-size:15px;}
.confirm{background:#FFF6E3;border:1px dashed var(--gold);border-radius:10px;padding:12px;margin-top:14px;display:none;font-size:14px;line-height:1.8;}
.langToggle{display:flex;gap:8px;margin-top:8px;}
.langToggle button{margin:0;background:#fff;color:var(--ink);border:1px solid var(--gold2);}
.langToggle button.on{background:var(--ink);color:#FFE8C8;}
#report{display:none;}
.page{max-width:794px;margin:16px auto;background:var(--paper);padding:46px 50px;box-shadow:0 2px 14px rgba(92,26,27,.12);position:relative;min-height:1000px;}
.page::before{content:"";position:absolute;inset:14px;border:1.5px solid var(--gold2);border-radius:4px;pointer-events:none;}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
h2.sec{font-size:21px;color:var(--saffron);border-bottom:2px solid var(--gold2);padding-bottom:6px;margin:6px 0 14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 16px;}
th,td{border:1px solid #E4D3AE;padding:6px 8px;text-align:left;}
th{background:#F8EFD8;font-weight:600;}
tr:nth-child(even) td{background:#FDF8EC;}
.prose{font-size:15px;line-height:1.85;text-align:justify;margin-bottom:12px;}
.idcard{background:#FFF6E3;border:1px solid var(--gold2);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.idcard .t{font-size:11.5px;color:var(--soft);}
.idcard .v{font-size:18px;color:#8B2B33;font-weight:700;margin-top:2px;}
.yog{background:#FDF8EC;border-left:4px solid var(--gold);padding:10px 13px;margin-bottom:10px;font-size:14.5px;line-height:1.75;}
.ok{background:#F2F8EF;border-left-color:#5A8B2B;}
.care{background:#FFF3F0;border-left-color:#B8434A;}
.foot{font-size:12px;color:var(--soft);border-top:1px solid var(--gold2);padding-top:10px;margin-top:20px;line-height:1.7;}
.printbar{max-width:794px;margin:10px auto;text-align:center;}
.printbar button{width:auto;padding:10px 26px;}
@media print{body{background:#fff;}.screen,.printbar{display:none !important;}#report{display:block !important;}
.page{box-shadow:none;margin:0;page-break-after:always;min-height:auto;padding:34px 40px;}.page:last-child{page-break-after:auto;}}
@page{size:A4;margin:10mm;}

/* devanagari-print-safety: letter-spacing splits matras/conjuncts (दि ल). Never apply to Indic text. */
body,.page,.prose,.idcard,.yog,td,th,h1,h2,div,span{letter-spacing:normal;}
.stars,.scorepill{letter-spacing:2px;}
@media print{*{-webkit-font-feature-settings:"liga" 1,"kern" 1;font-feature-settings:"liga" 1,"kern" 1;}}

/* ── DEVANAGARI SHAPING SAFETY ──────────────────────────────────────────────
   A Latin-first font stack (e.g. 'Cormorant Garamond' first) forces the browser
   into PER-CHARACTER font fallback for Hindi. Shaping a syllable cluster across
   two font runs splits matras/conjuncts:  करियर → "करि यर",  बातचीत → "बा तची त".
   Fix: when the report renders in Hindi, use ONE complete Devanagari font for
   everything, and disable anything that can insert space inside a cluster. */
#report.lang-hi, #report.lang-hi *{
  font-family:'Noto Serif Devanagari','Nirmala UI','Mangal','Kokila',serif !important;
  letter-spacing:normal !important;
  word-spacing:normal !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-synthesis:none;               /* faux-bold can break conjunct shaping */
  text-rendering:auto;
}
#report.lang-hi .prose{text-align:left;}   /* justify stretches Indic awkwardly */
@media print{
  #report.lang-hi, #report.lang-hi *{
    font-family:'Noto Serif Devanagari','Nirmala UI','Mangal',serif !important;
    letter-spacing:normal !important;
  }
}

/* Telugu: same single-font shaping law as Devanagari (§10.2 / §T6) */
#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-te .prose{text-align:left;}
@media print{#report.lang-te, #report.lang-te *{
  font-family:'Noto Serif Telugu','Gautami','Nirmala UI',serif !important;letter-spacing:normal !important;}}

/* Indic print hardening: some print engines duplicate glyph clusters when
   ligature/kerning features are re-resolved. Lock them and disable synthesis. */
@media print{
  #report.lang-hi, #report.lang-hi *, #report.lang-te, #report.lang-te *{
    text-rendering:auto !important;
    font-variant-ligatures:normal !important;
    font-feature-settings:normal !important;
    font-synthesis:none !important;
    -webkit-font-smoothing:antialiased;
  }
}

/* Kannada: same single-font shaping law as Devanagari/Telugu (§10.2 / §K6) */
#report.lang-kn, #report.lang-kn *{
  font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-kn .prose{text-align:left;}
@media print{
  #report.lang-kn, #report.lang-kn *{
    font-family:'Noto Serif Kannada','Tunga','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}

/* Tamil: same single-font shaping law as Devanagari/Telugu/Kannada (§10.2 / §K6) */
#report.lang-ta, #report.lang-ta *{
  font-family:'Noto Serif Tamil','Latha','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-ta .prose{text-align:left;}
@media print{
  #report.lang-ta, #report.lang-ta *{
    font-family:'Noto Serif Tamil','Latha','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}

/* bn: single-font shaping law (§10.2 / §K6) */
#report.lang-bn, #report.lang-bn *{
  font-family:'Noto Serif Bengali','Vrinda','Nirmala UI',serif !important;
  letter-spacing:normal !important; word-spacing:normal !important;
  word-break:normal !important; overflow-wrap:normal !important;
  font-synthesis:none; text-rendering:auto;
}
#report.lang-bn .prose{text-align:left;}
@media print{
  #report.lang-bn, #report.lang-bn *{
    font-family:'Noto Serif Bengali','Vrinda','Nirmala UI',serif !important;
    letter-spacing:normal !important; text-rendering:auto !important;
    font-variant-ligatures:normal !important; font-feature-settings:normal !important;
    font-synthesis:none !important;
  }
}
</style>
</head>

हराई भी देता है और रंग भी।","te":" స్వభావంతో అనుభవిస్తుంది. ఈ రెండింటి కలయికే మీ ప్రేమకు లోతునూ, అందాన్నీ ఇస్తుంది.","kn":" ಸ್ವಭಾವದಿಂದ ಅನುಭವಿಸುತ್ತದೆ. ಈ ಎರಡರ ಸಂಗಮವೇ ನಿಮ್ಮ ಪ್ರೀತಿಗೆ ಆಳವನ್ನೂ ಬಣ್ಣವನ್ನೂ ಕೊಡುತ್ತದೆ.","ta":" விதமாக உணர்கிறது. இந்த இரண்டும் சேர்வது உங்கள் காதலுக்கு ஆழத்தையும் நிறத்தையும் தருகிறது."},"venusStrong":{"en":"Your Venus is especially strong — love, attraction and beauty flow naturally through your life.","hi":"आपका शुक्र बहुत मज़बूत है — प्यार, आकर्षण और सुंदरता आपकी ज़िंदगी में सहज बहते हैं।","te":"మీ జాతకంలో శుక్రుడు బలంగా ఉన్నాడు — ప్రేమ, ఆకర్షణ, అందం మీ జీవితంలో సహజంగా ప్రవహిస్తాయి.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಬಲವಾಗಿದ್ದಾರೆ — ಪ್ರೀತಿ, ಆಕರ್ಷಣೆ, ಸೌಂದರ್ಯ ನಿಮ್ಮ ಬದುಕಿನಲ್ಲಿ ಸಹಜವಾಗಿ ಹರಿಯುತ್ತವೆ.","ta":"உங்கள் சுக்கிரன் மிகவும் பலமாக இருக்கிறார் — காதல், கவர்ச்சி, அழகு உங்கள் வாழ்க்கையில் இயல்பாக வெளிப்படுகின்றன."},"venusWeak":{"en":"Your Venus rests in a tender placement — offering white or pink flowers on Fridays and cultivating beauty strengthens it.","hi":"आपका शुक्र थोड़ी कोमल स्थिति में है — शुक्रवार को सफ़ेद या गुलाबी फूल चढ़ाना और सुंदरता को अपनाना इसे मज़बूत करता है।","te":"మీ జాతకంలో శుక్రుడు కొంచెం సున్నితమైన స్థితిలో ఉన్నాడు — శుక్రవారం తెలుపు లేదా గులాబీ పూలు సమర్పించడం, అందాన్ని ఆదరించడం దీన్ని బలపరుస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸ್ವಲ್ಪ ಸೂಕ್ಷ್ಮ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ — ಶುಕ್ರವಾರ ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸುವುದು, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸುವುದು ಅದನ್ನು ಬಲಪಡಿಸುತ್ತದೆ.","ta":"உங்கள் சுக்கிரன் மென்மையான நிலையில் இருக்கிறார் — வெள்ளிக்கிழமைகளில் வெள்ளை அல்லது இளஞ்சிவப்பு மலர்களை அர்ப்பணிப்பதும், அழகை வளர்ப்பதும் அதை பலப்படுத்தும்."},"venusNeutral":{"en":"Your Venus holds a balanced placement, giving love a steady foundation.","hi":"आपका शुक्र संतुलित स्थिति में है, जो प्यार को मज़बूत नींव देता है।","te":"మీ జాతకంలో శుక్రుడు సమతుల్య స్థితిలో ఉన్నాడు, ఇది ప్రేమకు స్థిరమైన పునాది ఇస్తుంది.","kn":"ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಶುಕ್ರ ಸಮತೋಲಿತ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದಾರೆ, ಇದು ಪ್ರೀತಿಗೆ ಸ್ಥಿರ ಅಡಿಪಾಯ ಕೊಡುತ್ತದೆ.","ta":"உங்கள் சுக்கிரன் சமநிலையில் இருக்கிறார், காதலுக்கு ஒரு உறுதியான அடித்தளத்தைத் தருகிறார்."},"venusRemedyIntro":{"en":"Venus is the planet of love, beauty and sweetness. Honouring it brings tenderness to your relationships:","hi":"शुक्र प्यार, सुंदरता और मिठास का ग्रह है। इसे प्रसन्न रखना रिश्तों में मिठास लाता है:","te":"శుక్రుడు ప్రేమ, అందం, మాధుర్యానికి అధిపతి. ఆయనను ఆరాధించడం బంధాల్లో మాధుర్యాన్ని తెస్తుంది:","kn":"ಶುಕ್ರ ಪ್ರೀತಿ, ಸೌಂದರ್ಯ ಮತ್ತು ಮಾಧುರ್ಯದ ಅಧಿಪತಿ. ಅವರನ್ನು ಆರಾಧಿಸುವುದು ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ತರುತ್ತದೆ:","ta":"சுக்கிரன் காதல், அழகு, இனிமையின் கிரகம். அவரை வழிபடுவது உங்கள் உறவுகளுக்கு மென்மையைக் கொண்டு வரும்:"},"closingQuote":{"en":"\"The stars incline; they do not compel. Your open heart writes the truest love story of all.\"","hi":"\"सितारे राह दिखाते हैं, मजबूर नहीं करते। सबसे सच्ची प्रेम कहानी आपका खुला दिल ही लिखता है।\"","te":"\"గ్రహాలు దారి చూపిస్తాయి, బలవంతం చేయవు. అత్యంత నిజమైన ప్రేమ కథను రాసేది మీ తెరిచిన మనసే.\"","kn":"\"ಗ್ರಹಗಳು ದಾರಿ ತೋರಿಸುತ್ತವೆ, ಒತ್ತಾಯ ಮಾಡುವುದಿಲ್ಲ. ಅತ್ಯಂತ ನಿಜವಾದ ಪ್ರೀತಿಯ ಕಥೆಯನ್ನು ಬರೆಯುವುದು ನಿಮ್ಮ ತೆರೆದ ಮನಸ್ಸೇ.\"","ta":"\"நட்சத்திரங்கள் வழிகாட்டுகின்றன; கட்டாயப்படுத்துவதில்லை. உங்கள் திறந்த மனமே எல்லாவற்றிலும் உண்மையான காதல் கதையை எழுதுகிறது.\""}},"reason":{"d7fifth":{"en":"D7 5th lord","hi":"सप्तांश पंचमेश","te":"సప్తాంశ పంచమాధిపతి","kn":"ಸಪ್ತಾಂಶ ಪಂಚಮಾಧಿಪತಿ","ta":"D7 5ஆம் அதிபதி"},"d7lagna":{"en":"D7 lagna lord","hi":"सप्तांश लग्नेश","te":"సప్తాంశ లగ్నాధిపతి","kn":"ಸಪ್ತಾಂಶ ಲಗ್ನಾಧಿಪತಿ","ta":"D7 லக்ன அதிபதி"},"occupies5":{"en":"occupies your 5th house","hi":"आपके पाँचवें भाव में स्थित","te":"మీ ఐదవ భావంలో ఉన్నారు","kn":"ನಿಮ್ಮ ಐದನೇ ಭಾವದಲ್ಲಿದ್ದಾರೆ","ta":"உங்கள் 5ஆம் பாவத்தில் அமர்ந்துள்ளார்"},"fifthLordRole":{"en":"lord of your 5th house","hi":"आपके पाँचवें भाव का स्वामी","te":"మీ ఐదవ భావ అధిపతి","kn":"ನಿಮ್ಮ ಐದನೇ ಭಾವದ ಅಧಿಪತಿ","ta":"உங்கள் 5ஆம் பாவ அதிபதி"},"ageWindow":{"en":"Within the traditional age window","hi":"पारंपरिक आयु-सीमा के भीतर","te":"సంప్రదాయ వయో పరిధిలో","kn":"ಸಂಪ್ರದಾಯದ ವಯೋಮಿತಿಯಲ್ಲಿ","ta":"பாரம்பரிய வயது எல்லைக்குள்"},"antarLord":{"en":"Antar lord","hi":"अंतर्दशा स्वामी","te":"అంతర్దశ అధిపతి","kn":"ಅಂತರ್ದಶಾ ಅಧಿಪತಿ","ta":"அந்தர் அதிபதி"},"mahaLord":{"en":"Maha lord","hi":"महादशा स्वामी","te":"మహాదశ అధిపతి","kn":"ಮಹಾದಶಾ ಅಧಿಪತಿ","ta":"மகா அதிபதி"},"jupTransit":{"en":"Jupiter transits house","hi":"गुरु गोचर भाव","te":"గురు గోచారం భావం","kn":"ಗುರು ಗೋಚಾರ ಭಾವ","ta":"குரு பெயர்ச்சி பாவம்"},"fromMoon":{"en":"from your Moon","hi":"आपके चंद्र से","te":"మీ చంద్రుని నుండి","kn":"ನಿಮ್ಮ ಚಂದ್ರನಿಂದ","ta":"உங்கள் சந்திரனிலிருந்து"},"seventhLord":{"en":"lord of your 7th house","hi":"आपके सातवें भाव का स्वामी","te":"మీ ఏడవ భావ అధిపతి","kn":"ನಿಮ್ಮ ಏಳನೇ ಭಾವದ ಅಧಿಪತಿ","ta":"உங்கள் 7ஆம் பாவ அதிபதி"},"karaka":{"en":"natural karaka","hi":"नैसर्गिक कारक","te":"సహజ కారకుడు","kn":"ಸಹಜ ಕಾರಕ","ta":"இயற்கை காரகன்"},"occupies":{"en":"occupies your 7th house","hi":"आपके सातवें भाव में स्थित","te":"మీ ఏడవ భావంలో ఉన్నారు","kn":"ನಿಮ್ಮ ಏಳನೇ ಭಾವದಲ್ಲಿದ್ದಾರೆ","ta":"உங்கள் 7ஆம் பாவத்தில் அமர்ந்துள்ளார்"},"d9lagna":{"en":"D9 lagna lord","hi":"नवांश लग्नेश","te":"నవాంశ లగ్నాధిపతి","kn":"ನವಾಂಶ ಲಗ್ನಾಧಿಪತಿ","ta":"D9 லக்ன அதிபதி"},"d9seventh":{"en":"D9 7th lord","hi":"नवांश सप्तमेश","te":"నవాంశ సప్తమాధిపతి","kn":"ನವಾಂಶ ಸಪ್ತಮಾಧಿಪತಿ","ta":"D9 7ஆம் அதிபதி"}},"remedy":{"sun":{"te":"ఆదివారం సూర్యుడికి నమస్కరించండి, ఉదయపు ఎండలో కొద్దిసేపు నిలబడండి. ఆత్మవిశ్వాసం, గౌరవం పెరుగుతాయి.","kn":"ಭಾನುವಾರ ಸೂರ್ಯನಿಗೆ ನಮಸ್ಕರಿಸಿ, ಬೆಳಗಿನ ಬಿಸಿಲಿನಲ್ಲಿ ಸ್ವಲ್ಪ ಹೊತ್ತು ನಿಲ್ಲಿ. ಆತ್ಮವಿಶ್ವಾಸ, ಗೌರವ ಹೆಚ್ಚುತ್ತವೆ.","ta":"ஞாயிற்றுக்கிழமை உதயசூரியனுக்கு அர்க்கியம் தரவும், தந்தை மற்றும் பெரியோரை மதிக்கவும், கோதுமை அல்லது வெல்லம் தானம் செய்யவும். தன்னம்பிக்கையும் மதிப்பும் வளரும்."},"moon":{"te":"సోమవారం శివుడిని ఆరాధించండి, తెల్లని వస్తువులు దానం చేయండి. మనసుకు ప్రశాంతత కలుగుతుంది.","kn":"ಸೋಮವಾರ ಶಿವನನ್ನು ಆರಾಧಿಸಿ, ಬಿಳಿ ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ. ಮನಸ್ಸಿಗೆ ಶಾಂತಿ ಸಿಗುತ್ತದೆ.","ta":"திங்கட்கிழமையை அமைதியாக, தூய்மையாகக் கழிக்கவும், தாயை மதிக்கவும், அரிசி அல்லது பால் தானம் செய்யவும். மனம் அமைதி பெறும்."},"mars":{"te":"మంగళవారం హనుమంతుడిని ఆరాధించండి, ఓపికను అలవరచుకోండి. ధైర్యం సరైన దిశలో పని చేస్తుంది.","kn":"ಮಂಗಳವಾರ ಹನುಮಂತನನ್ನು ಆರಾಧಿಸಿ, ತಾಳ್ಮೆ ಬೆಳೆಸಿಕೊಳ್ಳಿ. ಧೈರ್ಯ ಸರಿಯಾದ ದಿಕ್ಕಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ.","ta":"செவ்வாய்க்கிழமை அனுமன் சாலீசா ஓதவும், உடல் ஒழுக்கம் காக்கவும், துவரம்பருப்பு அல்லது சிவப்பு துணி தானம் செய்யவும். தைரியமும் ஆற்றலும் வளரும்."},"mercury":{"te":"బుధవారం విష్ణువును స్మరించండి, పచ్చని వస్తువులు దానం చేయండి. మాటలో, వ్యవహారంలో స్పష్టత వస్తుంది.","kn":"ಬುಧವಾರ ವಿಷ್ಣುವನ್ನು ಸ್ಮರಿಸಿ, ಹಸಿರು ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ. ಮಾತಿನಲ್ಲಿ, ವ್ಯವಹಾರದಲ್ಲಿ ಸ್ಪಷ್ಟತೆ ಬರುತ್ತದೆ.","ta":"புதன்கிழமை பசுக்களுக்கு பசும்புல் தரவும், பேச்சை உண்மையாகவும் இனிமையாகவும் வைக்கவும், பாசிப்பருப்பு தானம் செய்யவும். புத்திசாலித்தனமும் தொடர்புகளும் வளரும்."},"jupiter":{"te":"గురువారం గురువును ఆరాధించండి, పసుపు పచ్చని వస్తువులు దానం చేయండి, పెద్దలను గౌరవించండి. జ్ఞానం, అదృష్టం పెరుగుతాయి.","kn":"ಗುರುವಾರ ಗುರುವನ್ನು ಆರಾಧಿಸಿ, ಹಳದಿ ವಸ್ತುಗಳನ್ನು ದಾನ ಮಾಡಿ, ಹಿರಿಯರನ್ನು ಗೌರವಿಸಿ. ಜ್ಞಾನ, ಅದೃಷ್ಟ ಹೆಚ್ಚುತ್ತವೆ.","ta":"வியாழக்கிழமை குருமார்களை சேவிக்கவும், ஞானத்தைப் பகிரவும், மஞ்சள், கடலைப்பருப்பு அல்லது புத்தகம் தானம் செய்யவும். ஞானமும் அதிர்ஷ்டமும் வளரும்."},"venus":{"te":"శుక్రవారం లక్ష్మీదేవిని ఆరాధించండి, తెలుపు లేదా గులాబీ పూలు సమర్పించండి, అందాన్ని ఆదరించండి, ఉదారంగా ఇవ్వండి. ప్రేమలో, బంధాల్లో మాధుర్యం పెరుగుతుంది.","kn":"ಶುಕ್ರವಾರ ಲಕ್ಷ್ಮಿಯನ್ನು ಆರಾಧಿಸಿ, ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಹೂ ಅರ್ಪಿಸಿ, ಸೌಂದರ್ಯವನ್ನು ಆದರಿಸಿ, ಉದಾರವಾಗಿ ಕೊಡಿ. ಪ್ರೀತಿಯಲ್ಲಿ, ಸಂಬಂಧಗಳಲ್ಲಿ ಮಾಧುರ್ಯ ಹೆಚ್ಚುತ್ತದೆ.","ta":"வெள்ளிக்கிழமை லக்ஷ்மியை வழிபடவும், வெள்ளை அல்லது இளஞ்சிவப்பு மலர்களை அர்ப்பணிக்கவும், அழகை ஆதரிக்கவும், உதாரமாக கொடுக்கவும். காதலிலும் உறவுகளிலும் இனிமை பெருகும்."},"saturn":{"te":"శనివారం శనిదేవుడిని ఆరాధించండి, నల్ల నువ్వులు దానం చేయండి, పేదలకు సాయం చేయండి. ఓపిక ఫలిస్తుంది.","kn":"ಶನಿವಾರ ಶನಿದೇವರನ್ನು ಆರಾಧಿಸಿ, ಕಪ್ಪು ಎಳ್ಳು ದಾನ ಮಾಡಿ, ಬಡವರಿಗೆ ಸಹಾಯ ಮಾಡಿ. ತಾಳ್ಮೆ ಫಲ ಕೊಡುತ್ತದೆ.","ta":"சனிக்கிழமை முதியோர், தொழிலாளர், மாற்றுத்திறனாளிகளுக்கு சேவை செய்யவும், எள்ளெண்ணெய் விளக்கேற்றவும், கருப்பு எள் அல்லது இரும்பு தானம் செய்யவும். பொறுமையும் நிலைத்த வெற்றியும் கிடைக்கும்."},"rahu":{"te":"దుర్గాదేవిని ఆరాధించండి, శనివారం దానం చేయండి, నిజాయితీగా ఉండండి. అనవసర గందరగోళం తగ్గుతుంది.","kn":"ದುರ್ಗಾದೇವಿಯನ್ನು ಆರಾಧಿಸಿ, ಶನಿವಾರ ದಾನ ಮಾಡಿ, ಪ್ರಾಮಾಣಿಕರಾಗಿರಿ. ಅನಗತ್ಯ ಗೊಂದಲ ಕಡಿಮೆಯಾಗುತ್ತದೆ.","ta":"ஆசைகளில் நேர்மையான தெளிவு வைக்கவும், பறவைகளுக்கு உணவளிக்கவும், சனிக்கிழமை ஏழைகளுக்கு போர்வை தானம் செய்யவும். திடீர் தடைகள் விலகும்."},"ketu":{"te":"గణపతిని ఆరాధించండి, ధ్యానం అలవరచుకోండి, సాధువులకు సేవ చేయండి. మనసు స్థిరపడుతుంది.","kn":"ಗಣಪತಿಯನ್ನು ಆರಾಧಿಸಿ, ಧ್ಯಾನ ರೂಢಿಸಿಕೊಳ್ಳಿ, ಸಾಧುಗಳಿಗೆ ಸೇವೆ ಮಾಡಿ. ಮನಸ್ಸು ಸ್ಥಿರವಾಗುತ್ತದೆ.","ta":"தினமும் தியானம் அல்லது ஜபம் செய்யவும், தெரு நாய்களைப் பராமரிக்கவும், பல வண்ணப் போர்வை அல்லது எள் தானம் செய்யவும். ஆன்மிகத் தெளிவு பெருகும்."}},"marriage":{"boyDefault":{"en":"Boy","hi":"वर","te":"వరుడు","kn":"ವರ","ta":"மணமகன்"},"girlDefault":{"en":"Girl","hi":"वधू","te":"వధువు","kn":"ವಧು","ta":"மணமகள்"},"outlookText":{"en":"This is a favourable match according to classical compatibility principles. The emotional foundation is strong, and the identified challenges are manageable through communication, mutual respect, and the suggested remedies.","hi":"शास्त्रीय अनुकूलता सिद्धांतों के अनुसार यह एक शुभ संबंध है। भावनात्मक नींव सुदृढ़ है, और उल्लिखित चुनौतियाँ संवाद, परस्पर सम्मान तथा सुझाए गए उपायों से सहज प्रबंधनीय हैं।","te":"శాస్త్రీయ అనుకూలత సూత్రాల ప్రకారం ఇది ఒక శుభమైన బంధం. మనసుల పునాది బలంగా ఉంది, గుర్తించిన ఇబ్బందులు మాటలతో, పరస్పర గౌరవంతో, సూచించిన పరిహారాలతో సులభంగా సర్దుకుంటాయి.","kn":"ಶಾಸ್ತ್ರೀಯ ಹೊಂದಾಣಿಕೆ ತತ್ವಗಳ ಪ್ರಕಾರ ಇದು ಶುಭ ಸಂಬಂಧ. ಮನಸ್ಸುಗಳ ಅಡಿಪಾಯ ಬಲವಾಗಿದೆ, ಗುರುತಿಸಿದ ತೊಂದರೆಗಳು ಮಾತು, ಪರಸ್ಪರ ಗೌರವ ಮತ್ತು ಸೂಚಿಸಿದ ಪರಿಹಾರಗಳಿಂದ ಸುಲಭವಾಗಿ ಸರಿಹೋಗುತ್ತವೆ.","ta":"பாரம்பரிய பொருத்த விதிகளின்படி இது ஒரு சாதகமான பொருத்தம். உணர்வுபூர்வ அடித்தளம் பலமாக உள்ளது, கண்டறியப்பட்ட சவால்கள் பேச்சு, பரஸ்பர மரியாதை, பரிந்துரைக்கப்பட்ட பரிகாரங்கள் மூலம் சமாளிக்கக்கூடியவை."},"outlookCare":{"en":"According to classical compatibility principles, this match is best approached with care. Because several key areas score low, give importance to mutual understanding, honest family discussion and elder counsel before proceeding.","hi":"शास्त्रीय अनुकूलता सिद्धांतों के अनुसार इस संबंध पर सोच-विचार के "ta":"சவால்கள்"},"outlook":{"en":"MARRIAGE OUTLOOK & RECOMMENDATION","hi":"विवाह का निष्कर्ष एवं सलाह","te":"వివాహ ఫలితం మరియు సలహా","kn":"ವಿವಾಹ ಫಲ ಮತ್ತು ಸಲಹೆ","ta":"திருமண எதிர்நோக்கும் பரிந்துரையும்"},"koota":{"en":"Koota","hi":"कूट","te":"కూటం","kn":"ಕೂಟ","ta":"பொருத்தம்"},"meaning":{"en":"Meaning","hi":"अर्थ","te":"అర్థం","kn":"ಅರ್ಥ","ta":"பொருள்"},"points":{"en":"Points","hi":"अंक","te":"పాయింట్లు","kn":"ಅಂಕಗಳು","ta":"புள்ளிகள்"},"dosha":{"en":"Dosha","hi":"दोष","te":"దోషం","kn":"ದೋಷ","ta":"தோஷம்"},"nadiBhakoot":{"en":"Nadi and Bhakoot — no dosha ✓","hi":"नाड़ी और भकूट — कोई दोष नहीं ✓","te":"నాడి, భకూట — దోషం లేదు ✓","kn":"ನಾಡಿ ಮತ್ತು ಭಕೂಟ — ದೋಷ ಇಲ್ಲ ✓","ta":"நாடி மற்றும் பகூடம் — தோஷம் இல்லை ✓"},"mangalDosha":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ","ta":"செவ்வாய் தோஷம்"},"cancelFactors":{"en":"Cancellation factors","hi":"दोष कटने के कारण","te":"దోషం తొలగే కారణాలు","kn":"ದೋಷ ನಿವಾರಣೆಯ ಕಾರಣಗಳು","ta":"நீக்கும் காரணிகள்"},"noneSignificant":{"en":"None significant ✓","hi":"कोई बड़ा कारण नहीं ✓","te":"గణనీయమైనవి లేవు ✓","kn":"ಗಮನಾರ್ಹವಾದವು ಇಲ್ಲ ✓","ta":"குறிப்பிடத்தக்கவை இல்லை ✓"},"yes":{"en":"Yes","hi":"हाँ","te":"అవును","kn":"ಹೌದು","ta":"ஆம்"},"no":{"en":"No","hi":"नहीं","te":"లేదు","kn":"ಇಲ್ಲ","ta":"இல்லை"}},"manglik":{"none":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం లేదు — ఈ సంబంధానికి కుజుడి వల్ల ఎలాంటి అడ్డంకీ లేదు.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇಲ್ಲ — ಈ ಸಂಬಂಧಕ್ಕೆ ಕುಜನಿಂದ ಯಾವ ಅಡ್ಡಿಯೂ ಇಲ್ಲ.","ta":"இரண்டு ஜாதகங்களிலும் செவ்வாய் தோஷம் இல்லை — இந்த சம்பந்தத்திற்கு செவ்வாயால் எந்தத் தடையும் இல்லை."},"neutralized":{"te":"రెండు జాతకాల్లోనూ కుజ దోషం ఉంది — శాస్త్ర నియమం ప్రకారం దోషం పరస్పరం తొలగిపోతుంది.","kn":"ಎರಡೂ ಜಾತಕಗಳಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ — ಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ದೋಷ ಪರಸ್ಪರ ನಿವಾರಣೆಯಾಗುತ್ತದೆ.","ta":"இரண்டு ஜாதகங்களிலும் செவ்வாய் தோஷம் உள்ளது — சாஸ்திர விதிப்படி தோஷம் பரஸ்பரம் நீங்குகிறது."},"softened":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, కానీ కింద చెప్పిన శాస్త్ర పరిహార కారణాల వల్ల అది తగ్గింది; సంప్రదాయ పరిహారాలతో ఈ సంబంధం ముందుకు సాగవచ్చు.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ಆದರೆ ಕೆಳಗೆ ಹೇಳಿದ ಶಾಸ್ತ್ರೀಯ ಪರಿಹಾರ ಕಾರಣಗಳಿಂದ ಅದು ಕಡಿಮೆಯಾಗಿದೆ; ಸಂಪ್ರದಾಯದ ಪರಿಹಾರಗಳೊಂದಿಗೆ ಈ ಸಂಬಂಧ ಮುಂದುವರಿಯಬಹುದು.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, ஆனால் கீழே சொல்லப்பட்ட சாஸ்திரப் பரிகார காரணங்களால் அது குறைந்துள்ளது; பாரம்பரியப் பரிகாரங்களுடன் இந்த சம்பந்தம் முன்னேறலாம்."},"present":{"te":"ఒక జాతకంలో కుజ దోషం ఉంది, తొలగించే కారణాలేవీ లేవు — ముందుకు వెళ్లేముందు కుజ శాంతి (హనుమాన్ ఉపాసన, మంగళవార వ్రతం) చేసి పెద్దల సలహా తీసుకోవాలని సంప్రదాయం చెబుతోంది.","kn":"ಒಂದು ಜಾತಕದಲ್ಲಿ ಕುಜ ದೋಷ ಇದೆ, ನಿವಾರಣೆಯ ಕಾರಣಗಳಿಲ್ಲ — ಮುಂದುವರಿಯುವ ಮೊದಲು ಕುಜ ಶಾಂತಿ (ಹನುಮಂತನ ಉಪಾಸನೆ, ಮಂಗಳವಾರದ ವ್ರತ) ಮಾಡಿ ಹಿರಿಯರ ಸಲಹೆ ಪಡೆಯಬೇಕೆಂದು ಸಂಪ್ರದಾಯ ಹೇಳುತ್ತದೆ.","ta":"ஒரு ஜாதகத்தில் செவ்வாய் தோஷம் உள்ளது, நீக்கும் காரணங்கள் எதுவும் இல்லை — முன்னேறுவதற்கு முன் செவ்வாய் சாந்தி (அனுமன் உபாசனை, செவ்வாய்க்கிழமை விரதம்) செய்து பெரியோர் ஆலோசனை பெறுமாறு சம்பிரதாயம் கூறுகிறது."},"note":{"en":"Note: Mangal Dosha strength reflects Mars’ house position and aggravating or softening factors — which is why we show it as Mild / Moderate / Strong rather than a raw number.","hi":"नोट: मंगल दोष की तीव्रता मंगल की भाव-स्थिति से आँकी जाती है; एकाधिक कारक इसे बढ़ा या घटा सकते हैं।","te":"గమనిక: కుజ దోష తీవ్రత కుజుడి భావ స్థితిని బట్టి, దాన్ని పెంచే లేదా తగ్గించే అంశాలను బట్టి లెక్కిస్తారు — అందుకే దీన్ని ఒక సంఖ్యగా కాకుండా అల్ప / మధ్యమ / తీవ్ర అని చూపిస్తున్నాం.","kn":"ಗಮನಿಸಿ: ಕುಜ ದೋಷದ ತೀವ್ರತೆಯನ್ನು ಕುಜನ ಭಾವ ಸ್ಥಿತಿ ಮತ್ತು ಅದನ್ನು ಹೆಚ್ಚಿಸುವ ಅಥವಾ ಕಡಿಮೆ ಮಾಡುವ ಅಂಶಗಳಿಂದ ಲೆಕ್ಕ ಹಾಕುತ್ತಾರೆ — ಆದ್ದರಿಂದ ಇದನ್ನು ಸಂಖ್ಯೆಯಾಗಿ ಅಲ್ಲದೆ ಅಲ್ಪ / ಮಧ್ಯಮ / ತೀವ್ರ ಎಂದು ತೋರಿಸಿದ್ದೇವೆ.","ta":"குறிப்பு: செவ்வாய் தோஷத்தின் தீவிரம் செவ்வாயின் பாவ நிலையையும், அதை அதிகரிக்கும் அல்லது குறைக்கும் அம்சங்களையும் பொறுத்தே கணக்கிடப்படுகிறது — அதனால் இதை ஒரு எண்ணாக அல்லாமல் லேசு / மிதம் / தீவிரம் என்று காட்டுகிறோம்."},"Mild":{"en":"Mild","hi":"अल्प","te":"అల్ప","kn":"ಅಲ್ಪ","ta":"லேசு"},"Moderate":{"en":"Moderate","hi":"मध्यम","te":"మధ్యమ","kn":"ಮಧ್ಯಮ","ta":"மிதம்"},"Strong":{"en":"Strong","hi":"प्रबल","te":"తీవ్ర","kn":"ತೀವ್ರ","ta":"தீவிரம்"}},"career":{"barLeadership":{"en":"Leadership Ability","hi":"नेतृत्व क्षमता","te":"నాయకత్వ శక్తి","kn":"ನಾಯಕತ್ವ ಸಾಮರ್ಥ್ಯ","ta":"தலைமைத் திறன்"},"barEntre":{"en":"Entrepreneurship","hi":"अपना काम शुरू करने की क्षमता","te":"సొంత వ్యాపార శక్తి","kn":"ಸ್ವಂತ ಉದ್ಯಮ ಶಕ್ತಿ","ta":"தொழில்முனைவு"},"barWealth":{"en":"Wealth Potential","hi":"धन संभावना","te":"సంపద అవకాశం","kn":"ಸಂಪತ್ತಿನ ಸಾಧ್ಯತೆ","ta":"செல்வ வாய்ப்பு"},"barGovt":{"en":"Govt Sector Fit","hi":"सरकारी नौकरी में सफलता","te":"ప్రభుత్వ ఉద్యోగంలో విజయం","kn":"ಸರ್ಕಾರಿ ಉದ್ಯೋಗದಲ್ಲಿ ಯಶಸ್ಸು","ta":"அரசு துறை பொருத்தம்"},"barPriv":{"en":"Private Sector Fit","hi":"प्राइवेट सेक्टर में सफलता","te":"ప్రైవేట్ సెక్టార్‌లో విజయం","kn":"ಪ್ರೈವೇಟ್ ಸೆಕ್ಟರ್‌ನಲ್ಲಿ ಯಶಸ್ಸು","ta":"தனியார் துறை பொருத்தம்"},"confirmGen":{"en":"If correct, generate (check AM/PM)","hi":"सही हो तो रिपोर्ट बनाएँ (AM/PM जाँचें)","te":"సరిగ్గా ఉంటే రిపోర్ట్ తయారు చేయండి (AM/PM చూడండి)","kn":"ಸರಿಯಾಗಿದ್ದರೆ ವರದಿ ತಯಾರಿಸಿ (AM/PM ಪರಿಶೀಲಿಸಿ)","ta":"சரியெனில், உருவாக்கவும் (AM/PM சரிபார்க்கவும்)"},"primarySig":{"en":"PRIMARY CAREER SIGNATURE","hi":"आपकी करियर पहचान","te":"మీ కెరీర్ స్వభావం","kn":"ನಿಮ್ಮ ಕೆರಿಯರ್ ಸ್ವಭಾವ","ta":"முதன்மை தொழில் சுபாவம்"},"topFields":{"en":"TOP FIELDS","hi":"सबसे अच्छे क्षेत्र","te":"ఉత్తమ రంగాలు","kn":"ಅತ್ಯುತ್ತಮ ಕ್ಷೇತ್ರಗಳು","ta":"சிறந்த துறைகள்"},"keyIndicators":{"en":"KEY INDICATORS","hi":"मुख्य संकेत","te":"ముఖ్య సూచికలు","kn":"ಪ್ರಮುಖ ಸೂಚಕಗಳು","ta":"முக்கிய அறிகுறிகள்"},"leadership":{"en":"Leadership","hi":"नेतृत्व","te":"నాయకత్వం","kn":"ನಾಯಕತ್ವ","ta":"தலைமை"},"entrepreneurship":{"en":"Entrepreneurship","hi":"अपना काम","te":"సొంత వ్యాపారం","kn":"ಸ್ವಂತ ಉದ್ಯಮ","ta":"தொழில்முனைவு"},"wealth":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು","ta":"செல்வம்"},"recommendation":{"en":"RECOMMENDATION","hi":"सलाह","te":"సలహా","kn":"ಸಲಹೆ","ta":"பரிந்துரை"},"leadStrong":{"en":"Your leadership potential is strong — people accept your guidance naturally. Management, team-lead or founder roles suit you well.","hi":"आपमें स्वाभाविक नेतृत्व-क्षमता प्रबल है — लोग आपका मार्गदर्शन सहज स्वीकार करते हैं। प्रबंधन, टीम-नेतृत्व या संस्थापक भूमिकाएँ आपके अनुकूल हैं।","te":"మీలో సహజమైన నాయకత్వ శక్తి బలంగా ఉంది — మీ మార్గదర్శనాన్ని జనం సులభంగా అంగీకరిస్తారు. మేనేజ్‌మెంట్, టీమ్ లీడ్ లేదా వ్యవస్థాపక పాత్రలు మీకు బాగా సరిపోతాయి.","kn":"ನಿಮ್ಮಲ್ಲಿ ಸಹಜ ನಾಯಕತ್ವ ಶಕ್ತಿ ಬಲವಾಗಿದೆ — ನಿಮ್ಮ ಮಾರ್ಗದರ್ಶನವನ್ನು ಜನ ಸಹಜವಾಗಿ ಒಪ್ಪುತ್ತಾರೆ. ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್, ಟೀಮ್ ಲೀಡ್ ಅಥವಾ ಸಂಸ್ಥಾಪಕ ಪಾತ್ರಗಳು ನಿಮಗೆ ಚೆನ್ನಾಗಿ ಹೊಂದುತ್ತವೆ.","ta":"உங்கள் தலைமைத் திறன் பலமானது — மக்கள் இயல்பாகவே உங்கள் வழிகாட்டுதலை ஏற்கிறார்கள். மேலாண்மை, குழுத் தலைமை அல்லது நிறுவனர் பொறுப்புகள் உங்களுக்கு நன்கு பொருந்தும்."},"leadMid":{"en":"You have solid leadership ability that grows with experience. Starting with a small team and building toward larger responsibility suits you.","hi":"आपमें अच्छी नेतृत्व-क्षमता है जो अनुभव के साथ निखरती है। छोटी टीम से आरंभ कर बड़ी ज़िम्मेदारी की ओर बढ़ना उपयुक्त रहेगा।","te":"మీలో మంచి నాయకత్వ శక్తి ఉంది, అది అనుభవంతో మెరుగవుతుంది. చిన్న టీమ్‌తో మొదలుపెట్టి పెద్ద బాధ్యతల వైపు వెళ్లడం మీకు సరిపోతుంది.","kn":"ನಿಮ್ಮಲ್ಲಿ ಒಳ್ಳೆಯ ನಾಯಕತ್ವ ಶಕ್ತಿ ಇದೆ, ಅದು ಅನುಭವದೊಂದಿಗೆ ಬೆಳೆಯುತ್ತದೆ. ಸಣ್ಣ ತಂಡದಿಂದ ಆರಂಭಿಸಿ ದೊಡ್ಡ ಜವಾಬ್ದಾರಿಯತ್ತ ಸಾಗುವುದು ನಿಮಗೆ ಸರಿ.","ta":"அனுபவத்துடன் வளரும் உறுதியான தலைமைத் திறன் உங்களிடம் உள்ளது. சிறிய குழுவில் தொடங்கி, பெரிய பொறுப்பை நோக்கி வளர்வது உங்களுக்கு ஏற்றது."},"leadExpert":{"en":"Your strength lies more in expertise than command — leading through deep skill is your natural path. Leadership can be learned, but you shine most as a specialist.","hi":"आपकी शक्ति नेतृत्व से अधिक विशेषज्ञता में है — गहरी दक्षता से प्रभाव बनाना आपका स्वाभाविक मार्ग है। नेतृत्व सीखा जा सकता है, पर विशेषज्ञ के रूप में आप अधिक चमकते हैं।","te":"మీ బలం ఆజ్ఞాపించడంలో కాదు, నైపుణ్యంలో ఉంది — లోతైన నైపుణ్యంతో ప్రభావం చూపడమే మీ సహజ మార్గం. నాయకత్వం నేర్చుకోవచ్చు, కానీ నిపుణుడిగానే మీరు ఎక్కువ మెరుస్తారు.","kn":"ನಿಮ್ಮ ಬಲ ಆಜ್ಞೆ ಮಾಡುವುದರಲ್ಲಿ ಅಲ್ಲ, ಪರಿಣತಿಯಲ್ಲಿ — ಆಳವಾದ ಕೌಶಲದಿಂದ ಪ್ರಭಾವ ಬೀರುವುದೇ ನಿಮ್ಮ ಸಹಜ ದಾರಿ. ನಾಯಕತ್ವ ಕಲಿಯಬಹುದು, ಆದರೆ ಪರಿಣಿತರಾಗಿಯೇ ನೀವು ಹೆಚ್ಚು ಮಿಂಚುತ್ತೀರಿ.","ta":"உங்கள் பலம் அதிகாரத்தை விட நிபுணத்துவத்திலேயே அதிகம் — ஆழமான திறமையால் வழிநடத்துவதே உங்கள் இயல்பான பாதை. தலைமையைக் கற்றுக்கொள்ளலாம், ஆனால் ஒரு நிபுணராகவே நீங்கள் மிகவும் பிரகாசிக்கிறீர்கள்."},"whatToDo":{"en":"What to do in each period — direct guidance on putting astrology to use:","hi":"हर अवधि में क्या करें — ज्योतिष को काम में लाने की सीधी सलाह:","te":"ప్రతి కాలంలో ఏమి చేయాలి — జ్యోతిష్యాన్ని ఆచరణలో పెట్టే స్పష్టమైన సూచనలు:","kn":"ಪ್ರತಿ ಕಾಲದಲ್ಲಿ ಏನು ಮಾಡಬೇಕು — ಜ್ಯೋತಿಷ್ಯವನ್ನು ಆಚರಣೆಗೆ ತರುವ ಸ್ಪಷ್ಟ ಸಲಹೆಗಳು:","ta":"ஒவ்வொரு காலத்திலும் என்ன செய்வது — ஜோதிடத்தை செயலில் பயன்படுத்த நேரடி வழிகாட்டுதல்:"},"avoidFields":{"en":"These fields rest mainly on the same less-supported planet(s) in your chart, which is why they group together.","hi":"ये क्षेत्र मुख्यतः उन्हीं ग्रहों पर आधारित हैं जो आपकी कुंडली में कम बली हैं — इसलिए एक साथ समूहित हैं।","te":"ఈ రంగాలు మీ జాతకంలో తక్కువ బలం ఉన్న గ్రహాల మీదే ఆధారపడతాయి — అందుకే ఇవి ఒకే గుంపుగా ఉన్నాయి.","kn":"ಈ ಕ್ಷೇತ್ರಗಳು ನಿಮ್ಮ ಜಾತಕದಲ್ಲಿ ಕಡಿಮೆ ಬಲ ಇರುವ ಗ್ರಹಗಳ ಮೇಲೆಯೇ ಅವಲಂಬಿತ, ಆದ್ದರಿಂದ ಇವು ಒಂದೇ ಗುಂಪಾಗಿವೆ.","ta":"இந்தத் துறைகள் பெரும்பாலும் உங்கள் ஜாதகத்தில் குறைவான ஆதரவுள்ள அதே கிரகத்தை (கிரகங்களை) சார்ந்திருப்பதால், அவை ஒன்றாகக் குழுவாகின்றன."}},"careerFields":{"sun":{"te":["ప్రభుత్వ రంగం","పరిపాలన","నాయకత్వ పదవులు","రాజకీయాలు","వైద్యం"],"kn":["ಸರ್ಕಾರಿ ರಂಗ","ಆಡಳಿತ","ನಾಯಕತ್ವ ಪದವಿಗಳು","ರಾಜಕೀಯ","ವೈದ್ಯಕೀಯ"],"ta":["அரசு துறை","நிர்வாகம்","தலைமைப் பதவிகள்","அரசியல்","மருத்துவம்"]},"moon":{"te":["ప్రజలతో ముడిపడిన పని","ఆతిథ్య రంగం","ఆరోగ్య సంరక్షణ","ఆహారం, పాడి","ప్రయాణం, పర్యాటకం"],"kn":["ಜನರೊಂದಿಗೆ ಬೆಸೆದ ಕೆಲಸ","ಆತಿಥ್ಯ ರಂಗ","ಆರೋಗ್ಯ ಸೇವೆ","ಆಹಾರ, ಹೈನುಗಾರಿಕೆ","ಪ್ರಯಾಣ, ಪ್ರವಾಸೋದ್ಯಮ"],"ta":["மக்களுடன் இணைந்த வேலை","விருந்தோம்பல் துறை","சுகாதாரம்","உணவு, பால் பொருட்கள்","பயணம், சுற்றுலா"]},"mars":{"te":["ఇంజనీరింగ్","రక్షణ, పోలీసు","టెక్నాలజీ","సర్జరీ","స్థిరాస్తి"],"kn":["ಇಂಜಿನಿಯರಿಂಗ್","ರಕ್ಷಣೆ, ಪೊಲೀಸ್","ತಂತ್ರಜ್ಞಾನ","ಶಸ್ತ್ರಚಿಕಿತ್ಸೆ","ಸ್ಥಿರಾಸ್ತಿ"],"ta":["இன்ஜினியரிங்","ராணுவம், போலீஸ்","தொழில்நுட்பம்","அறுவை சிகிச்சை","ரியல் எஸ்டேட்"]},"mercury":{"te":["వాణిజ్యం, వ్యాపారం", ானது அல்ல."},"k004":{"en":"YOUR STRONGEST QUALITIES","hi":"आपकी प्रबल शक्तियाँ","te":"మీ బలమైన లక్షణాలు","kn":"ನಿಮ್ಮ ಪ್ರಬಲ ಗುಣಗಳು","ta":"உங்கள் பலமான குணங்கள்"},"k005":{"en":"CURRENT LIFE PHASE","hi":"वर्तमान जीवन-चरण","te":"ప్రస్తుత జీవిత దశ","kn":"ಪ್ರಸ್ತುತ ಜೀವನ ಹಂತ","ta":"தற்போதைய வாழ்க்கை நிலை"},"k006":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ","ta":"மகாதசை"},"k007":{"en":"Antar","hi":"अंतर","te":"అంతర్దశ","kn":"ಅಂತರ್ದಶಾ","ta":"அந்தர்தசை"},"k008":{"en":"OVERALL LIFE ENERGY","hi":"समग्र जीवन-ऊर्जा","te":"మొత్తం జీవన శక్తి","kn":"ಒಟ್ಟು ಜೀವನ ಶಕ್ತಿ","ta":"ஒட்டுமொத்த வாழ்க்கை சக்தி"},"k009":{"en":"Formula: Ashtakavarga strength of your 1st, 9th and 10th houses + auspicious yogas + planetary dignities — every input verifiable in the chapters ahead.","hi":"सूत्र: लग्न-भाग्य-कर्म भावों का अष्टकवर्ग बल + शुभ योग","te":"సూత్రం: మీ 1వ, 9వ, 10వ భావాల అష్టకవర్గ బలం + శుభ యోగాలు + గ్రహ స్థితులు — ప్రతి అంశాన్నీ ముందున్న అధ్యాయాల్లో సరిచూసుకోవచ్చు.","kn":"ಸೂತ್ರ: ನಿಮ್ಮ 1, 9, 10ನೇ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಶುಭ ಯೋಗಗಳು + ಗ್ರಹ ಸ್ಥಿತಿಗಳು — ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು.","ta":"சூத்திரம்: உங்கள் 1, 9, 10ஆம் பாவங்களின் அஷ்டகவர்க்க பலம் + சுப யோகங்கள் + கிரக நிலைகள் — ஒவ்வொரு அம்சத்தையும் அடுத்த அத்தியாயங்களில் சரிபார்த்துக் கொள்ளலாம்."},"k010":{"en":"Career","hi":"करियर","te":"కెరీర్","kn":"ಕೆರಿಯರ್","ta":"தொழில்"},"k011":{"en":"Marriage & Love","hi":"विवाह व संबंध","te":"వివాహం, ప్రేమ","kn":"ಮದುವೆ, ಪ್ರೀತಿ","ta":"திருமணம், அன்பு"},"k012":{"en":"Wealth","hi":"धन","te":"సంపద","kn":"ಸಂಪತ್ತು","ta":"செல்வம்"},"k013":{"en":"Health & Vitality","hi":"स्वास्थ्य","te":"ఆరోగ్యం, శక్తి","kn":"ಆರೋಗ್ಯ, ಶಕ್ತಿ","ta":"ஆரோக்கியம், சக்தி"},"k014":{"en":"Learning & Children","hi":"विद्या-संतान","te":"విద్య, సంతానం","kn":"ವಿದ್ಯೆ, ಮಕ್ಕಳು","ta":"கல்வி, குழந்தைகள்"},"k015":{"en":"Spiritual Growth","hi":"आध्यात्म","te":"ఆధ్యాత్మిక ఎదుగుదల","kn":"ಆಧ್ಯಾತ್ಮಿಕ ಬೆಳವಣಿಗೆ","ta":"ஆன்மிக வளர்ச்சி"},"k016":{"en":"Your Life Dashboard","hi":"जीवन डैशबोर्ड","te":"మీ జీవిత డాష్‌బోర్డ్","kn":"ನಿಮ್ಮ ಜೀವನ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್","ta":"உங்கள் வாழ்க்கை பார்வை"},"k017":{"en":"Each score = Ashtakavarga strength of the relevant houses + house-lord dignity + karaka planet condition. Every input is verifiable in the tables that follow — no score is invented.","hi":"प्रत्येक अंक = संबंधित भावों का अष्टकवर्ग बल + भावेश गरिमा + कारक ग्रह स्थिति — सभी आंकड़े आगे की सारणियों में सत्यापन-योग्य।","te":"ప్రతి స్కోరు = సంబంధిత భావాల అష్టకవర్గ బలం + భావాధిపతి స్థితి + కారక గ్రహ స్థితి. ప్రతి అంశాన్నీ తర్వాతి పట్టికల్లో సరిచూసుకోవచ్చు — ఏ స్కోరూ ఊహించి రాసినది కాదు.","kn":"ಪ್ರತಿ ಸ್ಕೋರ್ = ಸಂಬಂಧಿತ ಭಾವಗಳ ಅಷ್ಟಕವರ್ಗ ಬಲ + ಭಾವಾಧಿಪತಿಯ ಸ್ಥಿತಿ + ಕಾರಕ ಗ್ರಹದ ಸ್ಥಿತಿ. ಪ್ರತಿ ಅಂಶವನ್ನೂ ಮುಂದಿನ ಕೋಷ್ಟಕಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು — ಯಾವ ಸ್ಕೋರ್ ಕೂಡ ಊಹೆಯಿಂದ ಬರೆದದ್ದಲ್ಲ.","ta":"ஒவ்வொரு மதிப்பெண்ணும் = சம்பந்தப்பட்ட பாவங்களின் அஷ்டகவர்க்க பலம் + பாவாதிபதி நிலை + காரக கிரக நிலை. ஒவ்வொரு அம்சத்தையும் அடுத்து வரும் அட்டவணைகளில் சரிபார்த்துக் கொள்ளலாம் — எந்த மதிப்பெண்ணும் கற்பனையானது அல்ல."},"k018":{"en":"Table of Contents","hi":"विषय-सूची","te":"విషయ సూచిక","kn":"ಪರಿವಿಡಿ","ta":"பொருளடக்கம்"},"k019":{"en":"Graha","hi":"ग्रह","te":"గ్రహం","kn":"ಗ್ರಹ","ta":"கிரகம்"},"k020":{"en":"Nakshatra","hi":"नक्षत्र","te":"నక్షత్రం","kn":"ನಕ್ಷತ್ರ","ta":"நட்சத்திரம்"},"k021":{"en":"Retro","hi":"वक्री","te":"వక్రం","kn":"ವಕ್ರ","ta":"வக்ரம்"},"k022":{"en":"Combust","hi":"अस्त","te":"అస్తం","kn":"ಅಸ್ತ","ta":"அஸ்தம்"},"k023":{"en":"Houses scoring 30+ are your power zones; those below 22 reward conscious effort. (Grand total 337 — the classical checksum.)","hi":"30+ बिंदु वाले भाव जीवन के प्रबल क्षेत्र हैं; 22 से कम वाले भावों में सचेत प्रयास फलदायी होता है। (कुल 337 — शास्त्रीय मानक)","te":"30కి పైగా బిందువులున్న భావాలు మీ బలమైన రంగాలు; 22 కంటే తక్కువ ఉన్నవి శ్రద్ధతో కృషి చేస్తే ఫలిస్తాయి. (మొత్తం 337 — శాస్త్రీయ లెక్క.)","kn":"30ಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಿಂದುಗಳಿರುವ ಭಾವಗಳು ನಿಮ್ಮ ಬಲದ ಕ್ಷೇತ್ರಗಳು; 22ಕ್ಕಿಂತ ಕಡಿಮೆ ಇರುವವು ಶ್ರದ್ಧೆಯಿಂದ ಶ್ರಮಿಸಿದರೆ ಫಲ ಕೊಡುತ್ತವೆ. (ಒಟ್ಟು 337 — ಶಾಸ್ತ್ರೀಯ ಲೆಕ್ಕ.)","ta":"30க்கு மேல் பிந்துக்கள் உள்ள பாவங்கள் உங்கள் பலமான பகுதிகள்; 22க்கும் குறைவானவை கவனமான முயற்சியால் பலன் தரும். (மொத்தம் 337 — சாஸ்திரக் கணக்கு.)"},"k024":{"en":"House ","hi":"भाव ","te":"భావం ","kn":"ಭಾವ ","ta":"பாவம் "},"k025":{"en":"bindus","hi":"बिंदु","te":"బిందువులు","kn":"ಬಿಂದುಗಳು","ta":"பிந்துக்கள்"},"k026":{"en":"House-Strength Reading (Sarvashtakavarga)","hi":"भाव-बल विवेचन (सर्वाष्टकवर्ग)","te":"భావ బల విశ్లేషణ (సర్వాష్టకవర్గం)","kn":"ಭಾವ ಬಲ ವಿಶ್ಲೇಷಣೆ (ಸರ್ವಾಷ್ಟಕವರ್ಗ)","ta":"பாவ பல ஆய்வு (சர்வாஷ்டகவர்க்கம்)"},"k027":{"en":"Retrograde","hi":"वक्री","te":"వక్ర గతి","kn":"ವಕ್ರ ಗತಿ","ta":"வக்ர கதி"},"k028":{"en":"Combust","hi":"अस्त","te":"అస్తంగతం","kn":"ಅಸ್ತಂಗತ","ta":"அஸ்தங்கதம்"},"k029":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்"},"k030":{"en":"Planet Strength Cards","hi":"ग्रह-शक्ति कार्ड","te":"గ్రహ బల కార్డులు","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು","ta":"கிரக பல அட்டைகள்"},"k031":{"en":"Star ratings derived from dignity + Ashtakavarga + combustion state.","hi":"तारांकन = गरिमा + अष्टकवर्ग + अस्त/वक्री स्थिति से","te":"స్థితి + అష్టకవర్గం + అస్తంగత స్థితి ఆధారంగా ఇచ్చిన నక్షత్ర రేటింగ్‌లు.","kn":"ಸ್ಥಿತಿ + ಅಷ್ಟಕವರ್ಗ + ಅಸ್ತಂಗತ ಸ್ಥಿತಿಯ ಆಧಾರದ ಮೇಲೆ ನೀಡಿದ ನಕ್ಷತ್ರ ರೇಟಿಂಗ್‌ಗಳು.","ta":"நிலை + அஷ்டகவர்க்கம் + அஸ்தங்கத நிலையின் அடிப்படையில் தரப்பட்ட நட்சத்திர மதிப்பீடுகள்."},"k032":{"en":"Planet Strength Cards (contd.)","hi":"ग्रह-शक्ति कार्ड (क्रमशः)","te":"గ్రహ బల కార్డులు (కొనసాగింపు)","kn":"ಗ್ರಹ ಬಲ ಕಾರ್ಡ್‌ಗಳು (ಮುಂದುವರಿಕೆ)","ta":"கிரக பல அட்டைகள் (தொடர்ச்சி)"},"k033":{"en":"no planets","hi":"कोई ग्रह नहीं","te":"గ్రహాలు లేవు","kn":"ಗ್ರಹಗಳಿಲ್ಲ","ta":"கிரகங்கள் இல்லை"},"k034":{"en":"Lord","hi":"भावेश","te":"అధిపతి","kn":"ಅಧಿಪತಿ","ta":"அதிபதி"},"k035":{"en":"house","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்"},"k036":{"en":"Occupants","hi":"स्थित ग्रह","te":"ఉన్న గ్రహాలు","kn":"ಇರುವ ಗ್ರಹಗಳು","ta":"உள்ள கிரகங்கள்"},"k037":{"en":"The Twelve Bhavas — Domains of Life","hi":"द्वादश भाव — जीवन के बारह क्षेत्र","te":"పన్నెండు భావాలు — జీవిత రంగాలు","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು — ಜೀವನದ ಕ್ಷೇತ್ರಗಳು","ta":"பன்னிரண்டு பாவங்கள் — வாழ்க்கைப் பகுதிகள்"},"k038":{"en":"Twelve Bhavas (contd.)","hi":"द्वादश भाव (क्रमशः)","te":"పన్నెండు భావాలు (కొనసాగింపు)","kn":"ಹನ್ನೆರಡು ಭಾವಗಳು (ಮುಂದುವರಿಕೆ)","ta":"பன்னிரண்டு பாவங்கள் (தொடர்ச்சி)"},"k039":{"en":"Ancient Note","hi":"प्राचीन संकेत","te":"ప్రాచీన విశేషం","kn":"ಪ್ರಾಚೀನ ವಿಶೇಷ","ta":"பாரம்பரியக் குறிப்பு"},"k040":{"en":"The Sarvashtakavarga of every chart always totals exactly 337 bindus — verified in your own tables here; count them yourself!","hi":"अष्टकवर्ग का सर्वयोग सदा 337 बिंदु होता है — यह आपकी रिपोर्ट में भी सत्यापित है, गिनकर देख सकते हैं!","te":"ఏ జాతకంలోనైనా సర్వాష్టకవర్గం మొత్తం సరిగ్గా 337 బిందువులే — మీ పట్టికల్లోనే సరిచూసుకోవచ్చు; మీరే లెక్కించి చూడండి!","kn":"ಯಾವುದೇ ಜಾತಕದಲ್ಲೂ ಸರ್ವಾಷ್ಟಕವರ್ಗದ ಒಟ್ಟು ನಿಖರವಾಗಿ 337 ಬಿಂದುಗಳೇ — ನಿಮ್ಮ ಕೋಷ್ಟಕಗಳಲ್ಲೇ ಪರಿಶೀಲಿಸಬಹುದು; ನೀವೇ ಲೆಕ್ಕ ಹಾಕಿ ನೋಡಿ!","ta":"எந்த ஜாதகத்திலும் சர்வாஷ்டகவர்க்கம் மொத்தம் சரியாக 337 பிந்துக்களே — உங்கள் அட்டவணைகளிலேயே சரிபார்த்துக் கொள்ளலாம்; நீங்களே எண்ணிப் பாருங்கள்!"},"k041":{"en":"House","hi":"भाव","te":"భావం","kn":"ಭಾವ","ta":"பாவம்"},"k042":{"en":"Graha Phala — House Placements","hi":"ग्रह फल — भाव स्थिति","te":"గ్రహ ఫలం — భావ స్థితులు","kn":"ಗ್ರಹ ಫಲ — ಭಾವ ಸ್ಥಿತಿಗಳು","ta":"கிரக பலன் — பாவ நிலைகள்"},"k043":{"en":"Graha Phala (contd.)","hi":"ग्रह फल (क्रमशः)","te":"గ్రహ ఫలం (కొనసాగింపు)","kn":"ಗ್ರಹ ಫಲ (ಮುಂದುವರಿಕೆ)","ta":"கிரக பலன் (தொடர்ச்சி)"},"k044":{"en":"Did You Know?","hi":"क्या आप जानते हैं?","te":"మీకు తెలుసా?","kn":"ನಿಮಗೆ ಗೊತ್ತೇ?","ta":"உங்களுக்குத் தெரியுமா?"},"k045":{"en":"In the Parashara tradition, Venus rules the longest mahadasha (20 years) and the Sun the shortest (6 years) — the full cycle spans exactly 120 years.","hi":"पराशर परंपरा में शुक्र की महादशा सबसे लंबी (20 वर्ष) और सूर्य की सबसे छोटी (6 वर्ष) होती है — पूरा चक्र ठीक 120 वर्ष का है।","te":"పరాశర సంప్రదాయంలో శుక్రుడికి అత్యధిక మహాదశ (20 సంవత్సరాలు), సూర్యుడికి అత్యల్పం (6 సంవత్సరాలు) — మొత్తం చక్రం సరిగ్గా 120 సంవత్సరాలు.","kn":"ಪರಾಶರ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಶುಕ್ರನಿಗೆ ಅತಿ ಹೆಚ್ಚು ಮಹಾದಶಾ (20 ವರ್ಷ), ಸೂರ್ಯನಿಗೆ ಅತಿ ಕಡಿಮೆ (6 ವರ್ಷ) — ಒಟ್ಟು ಚಕ್ರ ನಿಖರವಾಗಿ 120 ವರ್ಷ.","ta":"பராசர சம்பிரதாயத்தில் சுக்கிரனுக்கு மிக நீண்ட மகாதசை (20 ஆண்டுகள்), சூரியனுக்கு மிகக் குறைவு (6 ஆண்டுகள்) — முழு சுழற்சி சரியாக 120 ஆண்டுகள்."},"k046":{"en":"Marriage Matching, done properly","hi":"विवाह मिलान गहन विश्लेषण","te":"వివాహ మ్యాచింగ్ — సరైన పద్ధతిలో","kn":"ವಿವಾಹ ಹೊಂದಾಣಿಕೆ — ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ","ta":"திருமணப் பொருத்தம் — சரியான முறையில்"},"k047":{"en":"Free tools stop at the Guna score. The paid Marriage Report adds classical dosha-CANCELLATION analysis, two-chart Manglik matching and marriage-timing windows — what no free tool checks.","hi":"निःशुल्क गुण-मिलान अंक देता है। सशुल्क विवाह रिपोर्ट दोष-परिहार नियम, दोनों कुंडलियों का मंगल-मिलान और विवाह-समय खिड़कियाँ जोड़ती है — जो कोई निःशुल्क टूल नहीं जाँचता।","te":"ఉచిత సాధనాలు గుణ స్కోరు దగ్గరే ఆగిపోతాయి. చెల్లింపు వివాహ రిపోర్ట్ శాస్త్రీయ దోష-పరిహార విశ్లేషణ, రెండు జాతకాల కుజ దోష పరిశీలన, వివాహ శుభ సమయాలు కూడా ఇస్తుంది — ఏ ఉచిత సాధనమూ చూడని అంశాలు.","kn":"ಉಚಿತ ಸಾಧನಗಳು ಗುಣ ಸ್ಕೋರ್‌ನಲ್ಲೇ ನಿಲ್ಲುತ್ತವೆ. ಪಾವತಿಸಿದ ವಿವಾಹ ವರದಿ ಶಾಸ್ತ್ರೀಯ ದೋಷ-ಪರಿಹಾರ ವಿಶ್ಲೇಷಣೆ, ಎರಡೂ ಜಾತಕಗಳ ಕುಜ ದೋಷ ಪರಿಶೀಲನೆ, ವಿವಾಹಕ್ಕೆ ಶುಭ ಸಮಯಗಳನ್ನೂ ಕೊಡುತ್ತದೆ — ಯಾವ ಉಚಿತ ಸಾಧನವೂ ನೋಡದ ಅಂಶಗಳು.","ta":"இலவச கருவிகள் குண மதிப்பெண்ணோடு நின்றுவிடுகின்றன. கட்டணத் திருமண அறிக்கை சாஸ்திரப்படி தோஷ-பரிகார ஆய்வு, இரு ஜாதக செவ்வாய் தோஷ பரிசீலனை, திருமணத்திற்கான சுப காலங்கள் ஆகியவற்றையும் தருகிறது — எந்த இலவச கருவியும் பார்க்காத அம்சங்கள்."},"k048":{"en":"Classical significance","hi":"शास्त्रीय महत्त्व","te":"శాస్త్రీయ ప్రాముఖ్యత","kn":"ಶಾಸ್ತ್ರೀಯ ಮಹತ್ವ","ta":"சாஸ்திர முக்கியத்துவம்"},"k049":{"en":"Mangal Dosha","hi":"मंगल दोष","te":"కుజ దోషం","kn":"ಕುಜ ದೋಷ","ta":"செவ்வாய் தோஷம்"},"k050":{"en":"Kaal Sarpa","hi":"कालसर्प","te":"కాల సర్ప","kn":"ಕಾಲ ಸರ್ಪ","ta":"கால சர்ப்பம்"},"k051":{"en":"Sade Sati","hi":"साढ़े साती","te":"సాడే సాతి","kn":"ಸಾಡೇ ಸಾತಿ","ta":"ஏழரைச் சனி"},"k052":{"en":"Phase","hi":"चरण","te":"దశ","kn":"ದಶಾ","ta":"நிலை"},"k053":{"en":"Mahadasha","hi":"महादशा","te":"మహాదశ","kn":"ಮಹಾದಶಾ","ta":"மகாதசை"},"k054":{"en":"balance",   if(o&&(o[LANG]||o.en||o.hi))return o[LANG]||o.en||o.hi;
  return UI_FB[path]||'';
}
function TT(obj){if(!obj)return '';return obj['t_'+LANG]||obj.t_hi||obj.t_en||'';}

function locReason(r){
  if(!r)return '';
  if(LANG==='en'||LANG==='hi')return T(r);
  var e=r.en||'';
  function role(t){
    if(/7th house/.test(t)&&/lord/.test(t))return U('reason.seventhLord');
    if(/natural karaka/.test(t))return U('reason.karaka');
    if(/occupies/.test(t))return U('reason.occupies');
    if(/D9 lagna/.test(t))return U('reason.d9lagna');
    if(/D9 7th/.test(t))return U('reason.d9seventh');
    return t;
  }
  var m1=e.match(/^Antar lord (\w+) — (.+)$/); if(m1)return U('reason.antarLord')+' '+gname2(m1[1])+' — '+role(m1[2]);
  var m2=e.match(/^Maha lord (\w+) — (.+)$/);  if(m2)return U('reason.mahaLord')+' '+gname2(m2[1])+' — '+role(m2[2]);
  var m3=e.match(/^Jupiter transits house (\d+) from your Moon$/);
  if(m3)return U('reason.jupTransit')+' '+m3[1]+' '+U('reason.fromMoon');
  if(/traditional age window/.test(e))return U('reason.ageWindow');
  return T(r);
}

function mangVerdict(v){
  if(!v)return '';
  var o=window.SD_UI&&SD_UI.manglik&&SD_UI.manglik[v.key];
  if(o&&o[LANG])return o[LANG];
  return T(v);
}
function term(kind,val){if(!UI)UI=window.SD_UI||{};var m=UI[kind]&&UI[kind][val];return m?(m[LANG]||m.en||val):val;}

var GR_HI={sun:'सूर्य',moon:'चंद्र',mars:'मंगल',mercury:'बुध',jupiter:'गुरु',venus:'शुक्र',saturn:'शनि',rahu:'राहु',ketu:'केतु'};
function gname2(k){if(!k)return '';var t=term('planet',k);return t!==k?t:(k.charAt(0).toUpperCase()+k.slice(1));}
function ist(d){return new Date(d.getTime()+5.5*3600000);}
function fD(d){return fD2(d);}
function fD2(d){
  var dt=ist(d);
  var mo=(window.SD_UI&&SD_UI.monFull&&SD_UI.monFull[LANG])?SD_UI.monFull[LANG][dt.getUTCMonth()]:null;
  if(LANG!=='en'&&mo)return dt.getUTCDate()+' '+mo+' '+dt.getUTCFullYear();
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
}
function locPari(r){
  if(!r)return '';
  if(LANG==='en')return r.en||'';
  var ov=window.SD_UI&&SD_UI.parihara&&SD_UI.parihara[r.en];
  if(ov&&ov[LANG])return ov[LANG];
  return T(r);
}

function bd(p){ // read person inputs p='b'|'g'
  var dv=document.getElementById(p+'date').value.split('-').map(Number);
  var tv=document.getElementById(p+'time').value.split(':').map(Number);
  return { date:new Date(Date.UTC(dv[0],dv[1]-1,dv[2],tv[0],tv[1],0)-5.5*3600000),
           lat:+document.getElementById(p+'lat').value, lng:+document.getElementById(p+'lng').value,
           name:document.getElementById(p+'name').value||(p==='b'?U('marriage.boyDefault'):U('marriage.girlDefault')),
           place:document.getElementById(p+'place').value };
}
function chartLine(bc,moon){
  return '<b>'+U('kundli.k084')+':</b> '+term('rashi',bc.lagna.en)+' · <b>'+U('confirm.moonSign')+':</b> '+term('rashi',moon.rashi.en)+' · <b>'+U('kundli.k020')+':</b> '+term('nakshatra',moon.nakshatra.en)+' ('+U('confirm.pada')+' '+moon.nakshatra.pada+')';
}
function confirmStep(){
  var PE=window.PanchangEngine;
  var B=bd('b'), G=bd('g');
  B.bc=PE.getBirthChart(B.date,B.lat,B.lng); B.moon=B.bc.grahas.find(function(x){return x.key==='moon';});
  G.bc=PE.getBirthChart(G.date,G.lat,G.lng); G.moon=G.bc.grahas.find(function(x){return x.key==='moon';});
  CTX={B:B,G:G};
  document.getElementById('confirmText').innerHTML=
    '<b>'+B.name+':</b> '+chartLine(B.bc,B.moon)+'<br><b>'+G.name+':</b> '+chartLine(G.bc,G.moon)
    +'<br>'+U('marriage.confirmBoth');
  document.getElementById('confirmBox').style.display='block';
}
function generate(){ try {
  var PE=window.PanchangEngine, M=window.SD_MARRIAGE, C=window.SD_CONTENT;
  if(!PE||!PE.getGunaMilanFull){alert('Engine not fully loaded. Please refresh the page (Ctrl+Shift+R) so the latest panchang-engine.js loads.');return;}
  if(!M||!C){alert('Content files not loaded. Ensure report-content.js and marriage-content.js are in the same folder.');return;}
  if(!CTX){alert('Please click "Check Both Charts" first.');return;}
  if(LANG!=='en'){var _p=(window.SD_MARRIAGE&&window.SD_MARRIAGE.labels&&window.SD_MARRIAGE.labels.title)||null;
    if(!_p||!_p[LANG]){alert('The file marriage-content.js on the server does not contain '+(LANG==='te'?'Telugu':LANG)+' text.\n\nUpload the latest marriage-content.js beside this page and hard-refresh (Ctrl+Shift+R).\n\nThe report will render in English until then.');}}
  var B=CTX.B, G=CTX.G, L=M.labels, H='';
  function pg(inner){H+='<div class="page">'+inner+'</div>';}
  var gm=PE.getGunaMilanFull(B.date,G.date);
  var mk=PE.getManglikMatch(B.date,B.lat,B.lng,G.date,G.lat,G.lng);
  // Local fallbacks so the page never depends on late engine exports (avoids browser-cache crashes)
  var RL=PE.RASHI_LORD||['mars','venus','mercury','moon','sun','mercury','venus','mars','jupiter','saturn','saturn','jupiter'];
  var MT=PE.MAITRI||{sun:{sun:2,moon:2,mars:2,mercury:1,jupiter:2,venus:0,saturn:0},moon:{sun:2,moon:2,mars:1,mercury:2,jupiter:1,venus:1,saturn:1},mars:{sun:2,moon:2,mars:2,mercury:0,jupiter:2,venus:1,saturn:1},mercury:{sun:2,moon:0,mars:1,mercury:2,jupiter:1,venus:2,saturn:1},jupiter:{sun:2,moon:2,mars:2,mercury:0,jupiter:2,venus:0,saturn:1},venus:{sun:0,moon:0,mars:1,mercury:2,jupiter:1,venus:2,saturn:2},saturn:{sun:0,moon:0,mars:0,mercury:2,jupiter:1,venus:2,saturn:2}};
  function mai(l1,l2){if(!l1||!l2||!MT[l1]||!MT[l2])return 2;return (MT[l1][l2]||0)+(MT[l2][l1]||0);} // 0-4, safe
  var KO=(gm&&gm.kootas)?gm.kootas:[];
  function kpts(name){var k=KO.find(function(x){return x.koota===name;});return k?(k.obtained||0):0;}
  function lordOfHouse(bc,h){return RL[bc.d1[h-1].rashiIndex];}
  var d7b=PE.getVarga(B.date,B.lat,B.lng,7), d7g=PE.getVarga(G.date,G.lat,G.lng,7);
  function clamp(x){return Math.max(52,Math.min(96,Math.round(x)));}
  var scores={
    emotional: clamp(48+mai(RL[B.moon.rashi.index],RL[G.moon.rashi.index])*8+kpts('Gana')*3),
    communication: clamp(50+mai(RL[B.bc.grahas.find(function(x){return x.key==='mercury';}).rashi.index],RL[G.bc.grahas.find(function(x){return x.key==='mercury';}).rashi.index])*9+kpts('Tara')*2),
    romance: clamp(46+kpts('Yoni')*8+((mai(RL[B.bc.grahas.find(function(x){return x.key==='venus';}).rashi.index],RL[G.bc.grahas.find(function(x){return x.key==='mars';}).rashi.index])+mai(RL[G.bc.grahas.find(function(x){return x.key==='venus';}).rashi.index],RL[B.bc.grahas.find(function(x){return x.key==='mars';}).rashi.index]))/2)*4),
    family: clamp(44+kpts('Vashya')*8+kpts('Gana')*3+((gm.parihara.bhakoot.dosha&&!gm.parihara.bhakoot.cancelled)?0:8)),
    finance: clamp(52+mai(lordOfHouse(B.bc,2),lordOfHouse(G.bc,2))*9+kpts('Graha Maitri')),
    children: clamp(50+mai(RL[d7b.lagna.rashiIndex],RL[d7g.lagna.rashiIndex])*8+kpts('Tara')*3)
  };
  function band(v){return v>=74?'strong':(v>=60?'avg':'care');}
  var overall=Math.round(gm.effectiveTotal/36*100);
  var vkey=gm.effectiveTotal>=33?'excellent':gm.effectiveTotal>=25?'verygood':gm.effectiveTotal>=18?'acceptable':'care';
  // COVER
  pg('<div class="cover" style="min-height:900px;"><div style="font-size:50px;color:var(--gold);">🕉️</div>'
    +'<h1 style="font-size:34px;margin:10px 0;">'+T(L.title)+'</h1>'
    +'<div class="sub" style="font-size:14px;">'+U('brand.name')+' · shubhdin.app</div>'
    +'<div style="font-size:26px;color:#8B2B33;font-weight:700;margin:22px 0 4px;">'+B.name+' ❀ '+G.name+'</div>'
    +'<div class="sub">'+fD(B.date)+' · '+B.place+' &nbsp;|&nbsp; '+fD(G.date)+' · '+G.place+'</div>'
    +'<div class="idcard" style="margin-top:30px;min-width:300px;"><div class="t">'+U('marriage.effectiveGuna')+'</div>'
    +'<div class="v" style="font-size:30px;">'+gm.effectiveTotal+' / 36 &nbsp;<span style="font-size:15px;color:#2B8B5A;">('+overall+'%)</span></div></div>'
    +'<div class="prose" style="max-width:520px;">'+T(M.verdict[vkey])+'</div></div>');
  // EXECUTIVE SUMMARY (the most-read page)
  (function(){
    var sorted=Object.keys(scores).map(function(k){return {k:k,v:scores[k]};}).sort(function(a,b){return b.v-a.v;});
    var best=sorted.slice(0,3).map(function(x){return '\u2713 '+TT(M.domains[x.k]);});
    var chall=sorted.filter(function(x){return x.v<66;}).slice(-2).map(function(x){return '\u26A0 '+TT(M.domains[x.k]);});
    var starN=gm.effectiveTotal>=33?5:gm.effectiveTotal>=27?4:gm.effectiveTotal>=20?3:2;
    var starStr='<span style="color:#E8730C;font-size:26px;letter-spacing:3px;">'+'\u2605'.repeat(starN)+'</span><span style="color:#D4A843;font-size:26px;letter-spacing:3px;">'+'\u2606'.repeat(5-starN)+'</span>';
    var challTxt=chall.length?chall.join('<br>'):U('marriage.noMajor');
    var outlook=U(vkey==='care'?'marriage.outlookCare':'marriage.outlookText');
    pg('<h2 class="sec">\u2728 '+U('marriage.execSummary')+'</h2>'
      +'<div style="text-align:center;margin:6px 0 18px;"><div class="t" style="font-size:12px;color:#8B5A2B;">'+U('marriage.overallMatch')+'</div>'+starStr+'</div>'
      +'<div class="two" style="margin-bottom:14px;">'
      +'<div class="idcard ok" style="background:#F2F8EF;border:1px solid #B7D9A8;"><div class="t" style="color:#2B7A4B;">'+U('marriage.bestQualities')+'</div><div style="font-size:15px;line-height:1.9;margin-top:4px;">'+best.join('<br>')+'</div></div>'
      +'<div class="idcard" style="background:#FFF6E3;border:1px solid var(--gold2);"><div class="t" style="color:#B8434A;">'+U('marriage.challenges')+'</div><div style="font-size:15px;line-height:1.9;margin-top:4px;">'+challTxt+'</div></div>'
      +'</div>'
      +'<div class="idcard"><div class="t">'+U('marriage.outlook')+'</div><div class="prose" style="margin:6px 0 0;">'+outlook+'</div></div>');
  })();
  // DASHBOARD
  var bars=Object.keys(scores).map(function(k){
    var v=scores[k], col=v>=74?'#2B8B5A':(v>=60?'#E8730C':'#B8434A');
    return '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:15px;"><span><b>'+TT(M.domains[k])+'</b></span><b style="color:'+col+';">'+v+'/100</b></div>'
      +'<div style="background:#EFE9DC;border-radius:7px;height:12px;overflow:hidden;margin-top:4px;"><div style="width:'+v+'%;height:100%;background:'+col+';"></div></div></div>';
  }).join('');
  pg('<h2 class="sec">📊 '+T(L.dash)+'</h2>'+bars+'<div class="prose" style="font-size:11.5px;color:#8B5A2B;">'+T(L.method)+'</div>');
  // GUNA MILAN + PARIHARA
  var kt='<table><tr><th>'+U('marriage.koota')+'</th><th>'+U('marriage.meaning')+'</th><th>'+U('marriage.points')+'</th></tr>';
  gm.kootas.forEach(function(k){kt+='<tr><td><b>'+term('koota',k.koota)+'</b></td><td style="font-size:12px;">'+T(M.koota[k.koota])+'</td><td>'+k.obtained+' / '+k.max+'</td></tr>';});
  kt+='<tr style="font-weight:700;"><td colspan="2">'+T(L.raw)+'</td><td>'+gm.total+' / 36</td></tr>';
  kt+='<tr style="font-weight:700;background:#F2F8EF;"><td colspan="2">'+T(L.eff)+'</td><td>'+gm.effectiveTotal+' / 36</td></tr></table>';
  var pariH='';
  [['Nadi',gm.parihara.nadi],['Bhakoot',gm.parihara.bhakoot]].forEach(function(pr){
    if(!pr[1].dosha)return;
    pariH+='<div class="yog '+(pr[1].cancelled?'ok':'care')+'"><b>'+term('koota',pr[0])+' '+U('marriage.dosha')+': '+(pr[1].cancelled?T(L.cancelled):T(L.stands))+'</b>'
      +(pr[1].reasons.length?('<br>'+pr[1].reasons.map(function(r){return '• '+locPari(r);}).join('<br>')):'')+'</div>';
  });
  if(!pariH)pariH='<div class="yog ok">'+U('marriage.nadiBhakoot')+'</div>';
  pg('<h2 class="sec">🔢 '+T(L.guna)+'</h2>'+kt+pariH);
  // MANGLIK
  function manglikLabel(pct){
    // Internal model can exceed 100% due to aggravation multipliers; show intuitive words.
    if(pct<=0)return U('marriage.no');
    var lvl,hi;
    if(pct>=150){lvl='Strong';hi='प्रबल';}
    else if(pct>=90){lvl='Moderate';hi='मध्यम';}
    else{lvl='Mild';hi='अल्प';}
    return U('marriage.yes')+' · '+U('manglik.'+lvl);
  }
  function mkRow(p,label){return '<tr><td><b>'+label+'</b></td><td>'+manglikLabel(p.present?p.percent:0)+'</td><td style="font-size:12px;">'+(p.factors.map(function(f){return T(f);}).join('; ')||'\u2014')+'</td></tr>';}
  pg('<h2 class="sec">⚖️ '+T(L.manglik)+'</h2>'
    +'<table><tr><th></th><th>'+U('marriage.mangalDosha')+'</th><th>'+U('marriage.cancelFactors')+'</th></tr>'
    +mkRow(mk.boy,B.name)+mkRow(mk.girl,G.name)+'</table>'
    +'<div class="yog '+(mk.verdict.key==='present'?'care':'ok')+'">'+mangVerdict(mk.verdict)+'</div>'+'<div class="prose" style="font-size:11.5px;color:#8B5A2B;">'+U('manglik.note')+'</div>');
  // DOMAIN CHAPTERS
  Object.keys(scores).forEach(function(k){
    var v=scores[k];
    pg('<h2 class="sec">'+TT(M.domains[k])+' — '+v+'/100</h2>'
      +'<div class="prose">'+T(M.domains[k][band(v)])+'</div>');
  });
  // WINDOWS
  var to=new Date(Date.now()+12*365.25*86400000);
  var wb=PE.getEventWindows('marriage',B.date,B.lat,B.lng,new Date(),to);
  var wg=PE.getEventWindows('marriage',G.date,G.lat,G.lng,new Date(),to);
  function winH(w,nm){
    return '<h2 class="sec" style="font-size:17px;">'+nm+'</h2>'+w.windows.slice(0,3).map(function(x){
      return '<div class="yog ok"><b>'+gname2(x.maha)+' – '+gname2(x.antar)+'</b> · '+fD(x.start)+' → '+fD(x.end)
        +'<br><span style="font-size:12px;color:#8B5A2B;">'+T(L.whyWin)+': '+x.reasons.map(function(r){return locReason(r);}).join('; ')+'</span></div>';
    }).join('');
  }
  pg('<h2 class="sec">📅 '+T(L.windows)+'</h2>'+winH(wb,B.name)+winH(wg,G.name));
  // STRENGTHS / CARE + REMEDIES + FOOTER
  var strengths=gm.kootas.filter(function(k){return k.obtained>=k.max*0.75;}).map(function(k){return '✦ '+term('koota',k.koota)+': '+T(M.koota[k.koota]);});
  var cares=gm.kootas.filter(function(k){return k.obtained<=k.max*0.3;}).map(function(k){return '• '+term('koota',k.koota)+': '+T(M.koota[k.koota]);});
  var rem=['venus','mars','moon','jupiter'].map(function(k){var r=C.remedy[k];
    var ov=(window.SD_UI&&SD_UI.remedy&&SD_UI.remedy[k]&&SD_UI.remedy[k][LANG])||null;
    var txt=ov||(LANG==='hi'?r.hi:r.en);
    return '<div class="yog"><b>'+(U('mantraLabel.'+k)||r.name)+'</b> — <span style="color:#8B2B33;">'+r.mantra+'</span><br>'+txt+'</div>';}).join('');
  pg('<h2 class="sec">✨ '+T(L.strengths)+'</h2><div class="prose">'+(strengths.join('<br>')||'—')+'</div>'
    +'<h2 class="sec">🪔 '+T(L.carePts)+'</h2><div class="prose">'+(cares.join('<br>')||U('marriage.noneSignificant'))+'</div>'
    +'<h2 class="sec">🙏 '+T(L.remedies)+'</h2>'+rem
    +'<div class="foot">'+T(L.disclaimer)+'<br><b>'+U('brand.name')+' · shubhdin.app</b> · '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+'</div>');
  document.getElementById('report').innerHTML=H;
  var rep=document.getElementById('report');
  rep.className='lang-'+LANG;
  rep.setAttribute('lang',LANG);
  rep.style.display='block';
  document.getElementById('printbar').style.display='block';
  document.getElementById('inputScreen').style.display='none';
  window.scrollTo(0,0);
} catch(err){ alert('Report generation error: '+err.message+'\n\nMost likely an outdated cached file — please hard-refresh (Ctrl+Shift+R) and try again.'); console.error(err); } }
