<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark only">
<title>Astrology Today — शुभ दिन</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   ASTROLOGY TODAY · Phase 1 (hub · rashifal · panchang · times)
   Consumes PanchangEngine READ-ONLY. IST display. hi/en.
   Palette: ink #0A0300 · ember #2C1208 · gold #D4A843 ·
   brightGold #E8BE5A · saffron #FF6B1A · shubh #4A7C59 ·
   ashubh #C8452E · cream #FFF4DE
────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--ink:#0A0300;--gold:#D4A843;--bgold:#E8BE5A;--saffron:#FF6B1A;
  --shubh:#4A7C59;--shubhT:#8FD4A5;--ashubh:#C8452E;--ashubhT:#F2A08F;--cream:#FFF4DE;}
html,body{background:var(--ink);}
body{min-height:100vh;font-family:'Poppins',sans-serif;color:rgba(255,244,222,0.9);
  background:linear-gradient(165deg,#0D0500 0%,#241005 40%,#0D0500 100%);
  padding:0 14px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden;}
.dev{font-family:'Tiro Devanagari Hindi',serif;}

/* header */
.hdr{display:flex;align-items:center;gap:11px;padding:16px 0 4px;}
.back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;
  color:rgba(212,168,67,0.85);font-size:18px;cursor:pointer;flex-shrink:0;}
.h-t{font-size:17.5px;color:var(--gold);font-weight:600;}
.h-s{font-size:9.5px;color:rgba(255,244,222,0.45);letter-spacing:0.4px;margin-top:1px;}
.h-city{margin-left:auto;font-size:10px;color:rgba(212,168,67,0.7);text-align:right;line-height:1.5;}

/* ── SIGNATURE · the living day-ribbon ── */
.dial{border:1px solid rgba(212,168,67,0.3);border-radius:18px;padding:15px 14px 13px;margin-top:12px;
  background:linear-gradient(160deg,rgba(212,168,67,0.10),rgba(255,107,26,0.04) 60%,transparent);
  position:relative;overflow:hidden;}
.dial::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--saffron),var(--gold),transparent);}
.d-now-lbl{font-size:9.5px;letter-spacing:1.6px;color:rgba(212,168,67,0.85);}
.d-state{display:flex;align-items:baseline;gap:9px;margin-top:5px;flex-wrap:wrap;}
.d-seg{font-size:23px;font-weight:600;color:var(--cream);}
.d-seg.g{color:var(--shubhT);} .d-seg.b{color:var(--ashubhT);}
.d-until{font-size:11px;color:rgba(255,244,222,0.55);}
.d-count{font-size:11px;color:var(--bgold);font-weight:600;}
.ribbon{position:relative;height:26px;border-radius:8px;overflow:hidden;margin:12px 0 5px;
  background:rgba(255,255,255,0.05);}
.rb-seg{position:absolute;top:0;bottom:0;}
.rb-seg.g{background:rgba(74,124,89,0.55);} .rb-seg.b{background:rgba(90,38,28,0.55);}
.rb-seg.night{opacity:0.45;}
.rb-now{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--bgold);border-radius:2px;
  box-shadow:0 0 10px rgba(232,190,90,0.9);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(232,190,90,0.7);}50%{box-shadow:0 0 16px rgba(232,190,90,1);}}
.rb-x{display:flex;justify-content:space-between;font-size:8.5px;color:rgba(255,244,222,0.4);}
.d-next{margin-top:9px;font-size:10.5px;color:rgba(255,244,222,0.6);}
.d-next b{color:var(--shubhT);font-weight:600;}
.d-tara{margin-top:8px;font-size:10.5px;padding-top:8px;border-top:1px dashed rgba(212,168,67,0.2);}
.d-tara.ok{color:var(--shubhT);} .d-tara.no{color:var(--ashubhT);}

/* section cards */
.grid{display:flex;flex-direction:column;gap:11px;margin-top:14px;}
.sec{display:flex;align-items:center;gap:13px;border:1px solid rgba(212,168,67,0.2);border-radius:16px;
  padding:14px 15px;cursor:pointer;background:linear-gradient(150deg,rgba(255,255,255,0.035),transparent);
  transition:transform .12s;}
.sec:active{transform:scale(0.985);}
.s-ico{font-size:25px;flex-shrink:0;width:34px;text-align:center;}
.s-b{flex:1;min-width:0;}
.s-t{font-size:15px;font-weight:600;color:var(--gold);}
.s-live{font-size:10.5px;color:rgba(255,244,222,0.6);margin-top:2px;line-height:1.5;}
.s-live b{color:rgba(255,244,222,0.85);font-weight:500;}
.s-go{color:rgba(212,168,67,0.55);font-size:17px;}

/* mini limbs strip */
.limbs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px;}
.limb{border:1px solid rgba(212,168,67,0.16);border-radius:12px;padding:9px 3px;text-align:center;
  background:rgba(255,255,255,0.025);}
.l-k{font-size:8px;letter-spacing:0.8px;color:rgba(212,168,67,0.7);}
.l-v{font-size:10.5px;color:var(--cream);margin-top:3px;line-height:1.3;}

/* ad slot placeholder */
.ad{margin-top:13px;border:1px dashed rgba(255,244,222,0.14);border-radius:14px;height:84px;
  display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:2px;
  color:rgba(255,244,222,0.22);}

/* generic page bits */
.pg-h{display:flex;align-items:center;gap:11px;padding:16px 0 10px;}
.pg-t{font-size:17px;color:var(--gold);font-weight:600;}
.pg-s{font-size:9.5px;color:rgba(255,244,222,0.45);margin-top:1px;}
.card{border:1px solid rgba(212,168,67,0.2);border-radius:16px;padding:14px 15px;margin-bottom:11px;
  background:linear-gradient(150deg,rgba(255,255,255,0.035),transparent);}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px dashed rgba(212,168,67,0.13);}
.row:last-child{border-bottom:none;}
.r-k{font-size:12px;color:rgba(255,244,222,0.65);}
.r-v{font-size:12.5px;color:var(--cream);text-align:right;}
.r-v small{display:block;font-size:9.5px;color:rgba(255,244,222,0.45);}
.good{color:var(--shubhT);} .bad{color:var(--ashubhT);}
.tag{display:inline-block;font-size:9px;padding:2.5px 8px;border-radius:12px;margin-left:6px;vertical-align:1px;}
.tag.g{background:rgba(74,124,89,0.25);color:var(--shubhT);}
.tag.b{background:rgba(200,69,46,0.2);color:var(--ashubhT);}
.tag.now{background:rgba(232,190,90,0.2);color:var(--bgold);animation:pulse 2s infinite;}
.note{font-size:9.5px;color:rgba(255,244,222,0.35);text-align:center;margin:16px 0 4px;line-height:1.7;}

/* rashi grid */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.rt{border:1px solid rgba(212,168,67,0.18);border-radius:14px;padding:13px 4px 11px;text-align:center;
  cursor:pointer;background:rgba(255,255,255,0.025);transition:transform .12s;position:relative;}
.rt:active{transform:scale(0.95);}
.rt.mine{border-color:var(--gold);background:linear-gradient(160deg,rgba(212,168,67,0.13),transparent);}
.rt .em{font-size:21px;}
.rt .nm{font-size:12.5px;color:var(--cream);margin-top:4px;}
.rt .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;}
.rt .dot.g{background:var(--shubhT);} .rt .dot.b{background:var(--ashubhT);}
.rt .you{position:absolute;top:5px;left:7px;font-size:7.5px;color:var(--bgold);letter-spacing:0.6px;}

/* rashi detail */
.verdict{text-align:center;padding:18px 12px 14px;}
.v-em{font-size:36px;}
.v-name{font-size:21px;color:var(--cream);font-weight:600;margin-top:6px;}
.v-stars{font-size:16px;letter-spacing:3px;margin-top:6px;color:var(--bgold);}
.v-line{font-size:12px;margin-top:8px;line-height:1.6;}
.factor{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed rgba(212,168,67,0.13);}
.factor:last-child{border-bottom:none;}
.f-i{font-size:17px;width:24px;text-align:center;flex-shrink:0;}
.f-t{font-size:11.5px;line-height:1.6;color:rgba(255,244,222,0.75);}
.f-t b{color:var(--cream);font-weight:600;}
.brandline{font-size:9px;letter-spacing:1px;color:rgba(212,168,67,0.55);text-align:center;margin-top:12px;}

/* limb segments */
.seg{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(212,168,67,0.13);font-size:12px;}
.seg:last-child{border-bottom:none;}
.seg .sv{color:var(--cream);} .seg .st{color:rgba(255,244,222,0.5);font-size:11px;}
.hide{display:none;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ── EXPLORE GATEWAY ── */
.xcard{display:flex;align-items:center;gap:13px;margin:14px 0 4px;padding:15px 16px;border-radius:16px;cursor:pointer;
 background:linear-gradient(135deg,rgba(212,168,67,0.14),rgba(255,107,26,0.05));
 border:1px solid rgba(212,168,67,0.38);transition:transform .12s;}
.xcard:active{transform:scale(0.99);}
.xc-ic{font-size:25px;flex-shrink:0;}
.xc-t{font-size:15px;color:var(--gold,#D4A843);font-weight:600;}
.xc-s{font-size:10.5px;color:rgba(255,244,222,0.60);margin-top:2px;line-height:1.45;}
.xc-go{margin-left:auto;color:rgba(212,168,67,0.62);font-size:19px;}
.xgrp{margin:18px 2px 9px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
 color:rgba(212,168,67,0.72);font-weight:700;}
.xgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
.xt{background:#2E1B14;border:1px solid rgba(212,168,67,0.16);border-radius:14px;padding:12px 8px 10px;
 text-align:center;cursor:pointer;min-width:0;transition:all .12s;}
.xt:active{transform:scale(0.96);border-color:rgba(212,168,67,0.5);}
.xt-i{font-size:22px;line-height:1;}
.xt-n{font-size:11.5px;color:#F7EED8;font-weight:600;margin-top:6px;line-height:1.25;}
.xt-s{font-size:8.5px;color:rgba(212,168,67,0.68);margin-top:3px;line-height:1.3;
 overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.seglist{margin-top:4px;}
.sgrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;margin-bottom:6px;
 background:#2A1912;border:1px solid rgba(212,168,67,0.12);}
.sgrow.g{border-color:rgba(90,190,120,0.30);}
.sgrow.b{border-color:rgba(230,110,90,0.28);}
.sgrow.now{background:#4A3114;border-color:rgba(232,190,90,0.85);}
.sg-n{font-size:13px;color:#F7EED8;font-weight:600;flex:1;min-width:0;}
.sg-t{font-size:11.5px;color:rgba(255,244,222,0.72);white-space:nowrap;}
.sg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sg-now{font-size:8px;font-weight:700;color:#FFD98A;letter-spacing:0.5px;}
.subh{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(212,168,67,0.65);
 font-weight:700;margin:16px 2px 8px;}

/* ── SHARED BIRTH-PROFILE FORM ── */
.bpf{background:#2A1912;border:1px solid rgba(212,168,67,0.18);border-radius:14px;padding:14px;margin-bottom:10px;}
.bpl{display:block;font-size:10px;letter-spacing:0.8px;text-transform:uppercase;
 color:rgba(212,168,67,0.80);margin:11px 2px 5px;font-weight:600;}
.bpl:first-child{margin-top:0;}
.bpi{width:100%;background:#3A241C;border:1px solid rgba(212,168,67,0.26);border-radius:10px;
 padding:11px 12px;color:#F7EED8;font-size:14.5px;font-family:inherit;color-scheme:dark;outline:none;}
.bpi:focus{border-color:rgba(232,190,90,0.8);}
.bprow{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.bpdd{position:absolute;left:0;right:0;top:100%;background:#1F120D;border:1px solid rgba(212,168,67,0.3);
 border-radius:10px;max-height:190px;overflow-y:auto;z-index:60;margin-top:4px;display:none;
 box-shadow:0 8px 24px rgba(0,0,0,0.6);}
.bpdd div{padding:10px 13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);}
.bpdd .n1{font-size:13.5px;color:#F7EED8;font-weight:600;}
.bpdd .n2{font-size:10px;color:rgba(212,168,67,0.6);margin-top:2px;}
.bpbtn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:13px;cursor:pointer;
 background:linear-gradient(120deg,#D4A843,#B8892F);color:#1A0D00;font-size:15px;font-weight:600;font-family:inherit;}
.bperr{font-size:11.5px;color:#F2A08F;margin-top:9px;text-align:center;display:none;}
.bpwhy{font-size:11.5px;color:rgba(255,244,222,0.62);line-height:1.6;margin:0 2px 12px;}
/* profile summary chips */
.pcard{display:flex;align-items:center;gap:12px;background:#2E1B14;border:1px solid rgba(212,168,67,0.20);
 border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;}
.pcard.empty{border-style:dashed;border-color:rgba(212,168,67,0.32);}
.pc-i{font-size:23px;flex-shrink:0;}
.pc-n{font-size:14px;color:#F7EED8;font-weight:600;}
.pc-s{font-size:10.5px;color:rgba(212,168,67,0.72);margin-top:2px;}
.pc-go{margin-left:auto;color:rgba(212,168,67,0.6);font-size:18px;}
/* score + koota table */
.score{text-align:center;padding:18px 12px 14px;background:linear-gradient(150deg,rgba(212,168,67,0.16),rgba(255,107,26,0.05));
 border:1px solid rgba(212,168,67,0.35);border-radius:16px;margin-bottom:12px;}
.sc-n{font-size:40px;font-weight:700;color:#FFE9B8;line-height:1;}
.sc-m{font-size:16px;color:rgba(255,244,222,0.5);}
.sc-v{font-size:14px;color:var(--gold,#D4A843);margin-top:7px;font-weight:600;}
.sc-e{font-size:10.5px;color:rgba(255,244,222,0.58);margin-top:5px;}
.kt{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;margin-bottom:5px;background:#2A1912;
 border:1px solid rgba(212,168,67,0.10);}
.kt-n{flex:1;min-width:0;font-size:12.5px;color:#F7EED8;}
.kt-d{font-size:10px;color:rgba(212,168,67,0.62);margin-top:1px;}
.kt-p{font-size:12.5px;font-weight:700;white-space:nowrap;}
/* upsell */
.cta{margin-top:14px;padding:16px;border-radius:16px;cursor:pointer;
 background:linear-gradient(140deg,rgba(120,70,200,0.16),rgba(212,168,67,0.07));
 border:1px solid rgba(178,140,255,0.35);}
.cta-t{font-size:15px;color:#D9C4FF;font-weight:600;}
.cta-s{font-size:11.5px;color:rgba(255,244,222,0.66);margin-top:6px;line-height:1.65;}
.cta-b{display:inline-block;margin-top:11px;background:linear-gradient(120deg,#D4A843,#B8892F);
 color:#1A0D00;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:11px;}
</style>
</head>
<body>
<div id="app"></div>

<script src="astronomy.min.js"></script>
<script src="panchang-engine.js"></script>
<script>
'use strict';
/* ── user context ─────────────────────────────────────────── */
var U={}; try{U=JSON.parse(localStorage.getItem('shubhdin_user')||'{}');}catch(e){}
var H=(U.lang||'hi')==='hi';
var LAT=parseFloat(U.city_lat)||23.1793, LNG=parseFloat(U.city_lon)||75.7849; // fallback: Ujjain
var CITY=U.city||(H?'उज्जैन':'Ujjain');
var PE=window.PanchangEngine;

/* ── i18n micro-dict ─────────────────────────────────────── */
function t(hi,en){return H?hi:en;}

/* ── time helpers (IST display always) ───────────────────── */
function fT(d){if(!d)return '—';return new Date(d).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour12:false,hour:'2-digit',minute:'2-digit'});}
function fR(a,b){return fT(a)+'–'+fT(b);}
function mins(ms){var m=Math.max(0,Math.round(ms/60000));var h=Math.floor(m/60);m%=60;return h?(h+t(' घं ',' h ')+m+t(' मि',' m')):(m+t(' मिनट',' min'));}

/* ── today's panchang (one engine call, cached) ──────────── */
var P=null;
function panchang(){if(!P)P=PE.getPanchang(new Date(),LAT,LNG);return P;}

/* ── rashi table (display labels) ────────────────────────── */
var RASHI=[
 ['मेष','Mesha','Aries','♈'],['वृषभ','Vrishabha','Taurus','♉'],['मिथुन','Mithuna','Gemini','♊'],
 ['कर्क','Karka','Cancer','♋'],['सिंह','Simha','Leo','♌'],['कन्या','Kanya','Virgo','♍'],
 ['तुला','Tula','Libra','♎'],['वृश्चिक','Vrishchika','Scorpio','♏'],['धनु','Dhanu','Sagittarius','♐'],
 ['मकर','Makara','Capricorn','♑'],['कुंभ','Kumbha','Aquarius','♒'],['मीन','Meena','Pisces','♓']];
function myRashiIdx(){var r=(U.rashi||'').toLowerCase();if(!r)return -1;
  for(var i=0;i<12;i++){if(RASHI[i][1].toLowerCase()===r||RASHI[i][2].toLowerCase()===r)return i;}return -1;}

/* moon-transit house themes (neutral, display copy) */
var HOUSE=[
 ['मन ऊर्जावान — नई शुरुआत का दिन','an energetic mind — a day for beginnings'],
 ['धन-वाणी पर ध्यान — सोच-समझकर बोलें','focus on money and speech — choose words with care'],
 ['साहस और पहल का साथ — काम बनते हैं','courage and initiative are with you — things get done'],
 ['घर-परिवार मन में — भावुक क्षण संभव','home and family on the mind — an emotional day is possible'],
 ['रचनात्मक दिन — बच्चों/विद्या से जुड़े काम शुभ','a creative day — matters of children and learning are favoured'],
 ['काम का बोझ — सेहत का ध्यान रखें','a workload day — mind your health'],
 ['रिश्तों और साझेदारी का दिन','a day of relationships and partnerships'],
 ['धीमा दिन — जोखिम टालें','a slow day — avoid risks'],
 ['भाग्य साथ देता है — धर्म-यात्रा शुभ','fortune supports you — dharma and travel are favoured'],
 ['कार्यक्षेत्र में पहचान संभव','recognition possible at work'],
 ['लाभ का दिन — मित्रों का साथ','a day of gains — friends stand by you'],
 ['खर्च और थकान — विश्राम भी ज़रूरी','expenses and fatigue — rest matters too']];

/* ── router ──────────────────────────────────────────────── */
var app=document.getElementById('app');
window.addEventListener('hashchange',route);
var tick=null;
function route(){
  if(tick){clearInterval(tick);tick=null;}
  var h=(location.hash||'#hub').slice(1).split('/');
  if(h[0]==='rashifal'&&h[1]!==undefined)return vRashi(parseInt(h[1],10));
  if(h[0]==='rashifal')return vRashiGrid();
  if(h[0]==='panchang'&&h[1])return vLimb(h[1]);
  if(h[0]==='panchang')return vPanchang();
  if(h[0]==='times')return vTimes();
  if(h[0]==='explore')return vExplore();
  if(h[0]==='chogh')return vChogh();
  if(h[0]==='hora')return vHora();
  if(h[0]==='tara')return vTara();
  if(h[0]==='chandra')return vChandra();
  if(h[0]==='pick')return vPick(h[1]);
  if(h[0]==='muhurta'&&h[1])return vMuhurtaRun(h[1]);
  if(h[0]==='muhurta')return vMuhurtaPick();
  if(h[0]==='bp')return vBpForm(h[1]);
  if(h[0]==='match'&&h[1]==='result')return vMatchResult();
  if(h[0]==='match')return vMatch();
  if(h[0]==='hcal')return vHcal();
  if(h[0]==='lagna')return vLagna();
  if(h[0]==='vrats')return vVrats();
  if(h[0]==='fest')return vFest();
  return vHub();
}
function back(to){location.hash=to;}

/* ── ribbon builder (signature) ──────────────────────────── */
function ribbonHTML(){
  var p=panchang();
  var t0=new Date(p.sunrise).getTime(), t1=new Date(p.nextSunrise).getTime(), span=t1-t0;
  var segs=p.choghadiya.day.concat(p.choghadiya.night);
  var htm='';
  segs.forEach(function(s,i){
    var a=new Date(s.start).getTime(), b=new Date(s.end).getTime();
    htm+='<div class="rb-seg '+(s.good?'g':'b')+(i>=8?' night':'')+'" style="left:'
      +((a-t0)/span*100).toFixed(2)+'%;width:'+((b-a)/span*100).toFixed(2)+'%"></div>';
  });
  var nowF=Math.min(99.6,Math.max(0,(Date.now()-t0)/span*100));
  htm+='<div class="rb-now" id="rbNow" style="left:'+nowF.toFixed(2)+'%"></div>';
  return '<div class="ribbon">'+htm+'</div>'
    +'<div class="rb-x"><span>🌅 '+fT(p.sunrise)+'</span><span>🌇 '+fT(p.sunset)+'</span><span>🌅 '+fT(p.nextSunrise)+'</span></div>';
}
function currentSeg(){
  var p=panchang(),now=Date.now();
  var segs=p.choghadiya.day.concat(p.choghadiya.night);
  for(var i=0;i<segs.length;i++){var s=segs[i];
    if(now>=new Date(s.start).getTime()&&now<new Date(s.end).getTime())return {s:s,next:segs[i+1]||null};}
  return {s:null,next:segs[0]};
}
function nextGood(){
  var p=panchang(),now=Date.now();
  var segs=p.choghadiya.day.concat(p.choghadiya.night);
  for(var i=0;i<segs.length;i++){var s=segs[i];
    if(s.good&&new Date(s.end).getTime()>now)return s;}
  return null;
}

/* ═════════ SHARED BIRTH-PROFILE SYSTEM ═════════
   One store, used by every personal feature in the app. 'self' writes straight
   into shubhdin_user so Settings, Kundli and the buy flow all see the same
   details — a user enters their birth data once, anywhere, and never again. */
function bpRead(slot){
  if(slot==='self'){
    var u={}; try{u=JSON.parse(localStorage.getItem('shubhdin_user')||'{}');}catch(e){}
    if(!u.dob) return null;
    return {name:u.name||'', dob:u.dob, tob:u.tob||'12:00',
            place:u.birth_place||u.city||'',
            lat:(u.birth_lat!=null?u.birth_lat:u.city_lat),
            lng:(u.birth_lng!=null?u.birth_lng:u.city_lon)};
  }
  try{return JSON.parse(localStorage.getItem('sd_bp_'+slot)||'null');}catch(e){return null;}
}
function bpWrite(slot,pr){
  if(slot==='self'){
    var u={}; try{u=JSON.parse(localStorage.getItem('shubhdin_user')||'{}');}catch(e){}
    if(pr.name) u.name=pr.name;
    u.dob=pr.dob; u.tob=pr.tob; u.birth_place=pr.place; u.birth_lat=pr.lat; u.birth_lng=pr.lng;
    if(u.city_lat==null){u.city_lat=pr.lat; u.city_lon=pr.lng; u.city=u.city||pr.place;}
    localStorage.setItem('shubhdin_user',JSON.stringify(u)); U=u;
    return;
  }
  localStorage.setItem('sd_bp_'+slot,JSON.stringify(pr));
}
function bpDate(pr){ return pr? new Date(pr.dob+'T'+(pr.tob||'12:00')+':00+05:30') : null; }

     +prow('🚫 '+t('राहु काल','Rahu Kaal'),q.rahuKaal?fR(q.rahuKaal.start,q.rahuKaal.end):'—')

   +'<div class="card" style="padding:12px 14px;"><input id="pkD" type="date" value="'+val+'" '

/* ── Muhurta finder: scores real dates against YOUR birth chart ── */
var MUH_META={
  griha_pravesh:{i:'🏠',hi:'गृह प्रवेश',en:'Griha Pravesh'},
  marriage_muhurta:{i:'💍',hi:'विवाह',en:'Marriage'},
  business:{i:'💼',hi:'व्यापार आरंभ',en:'New Business'},
  vehicle:{i:'🚗',hi:'वाहन खरीद',en:'Vehicle Purchase'}
};
function vMuhurtaPick(){
  var g='';
  Object.keys(MUH_META).forEach(function(k){var m=MUH_META[k];
    g+=xt(m.i,H?m.hi:m.en,t('शुभ दिन खोजें','Find good dates'),'#muhurta/'+k);});
  app.innerHTML=pgHead(t('मुहूर्त खोजें','Find a Muhurta'),t('आपकी जन्म कुंडली से अगले 90 दिन','Next 90 days, scored against your chart'),'#explore')
   +'<div class="xgrid">'+g+'</div>';
}
function birthDT(){
  if(!U.dob) return null;
  return new Date(U.dob+'T'+(U.tob||'12:00')+':00+05:30');
}
function vMuhurtaRun(key){
  var m=MUH_META[key]; if(!m) return vMuhurtaPick();
  var head=pgHead((m.i+' ')+(H?m.hi:m.en),t('आपकी कुंडली से शुभ तिथियाँ','Auspicious dates from your own chart'),'#explore');
  var pr=bpRead('self');

  /* No birth details? Ask for them HERE, with the reason — never a detour to Settings. */
  if(!pr){
    app.innerHTML=head
     +'<div class="bpwhy">'+t('इस खोज में तिथि, नक्षत्र और वार तो सबके लिए एक जैसे हैं — पर ताराबल और चंद्रबल आपके अपने जन्म नक्षत्र से निकलते हैं। वही एक सामान्य सूची को <b>आपकी</b> सूची बनाते हैं।',
        'Tithi, nakshatra and weekday are the same for everyone — but tarabala and chandrabala are computed from <b>your</b> birth nakshatra. That is what turns a generic list into your list.')+'</div>'
     +'<div class="pcard empty" onclick="goBp(\'self\',\'#muhurta/'+key+'\')">'
     +'<div class="pc-i">🎂</div><div><div class="pc-n dev">'+t('जन्म विवरण भरें','Enter Birth Details')+'</div>'
     +'<div class="pc-s">'+t('एक बार — पूरे ऐप में काम आएगा','Once — used across the whole app')+'</div></div>'
     +'<div class="pc-go">+</div></div>';
    return;
  }

  var days=MUH_DAYS[key]||90;
  var res=null;
  try{ res=PE.findMuhurta(key,bpDate(pr),LAT,LNG,new Date(),new Date(Date.now()+days*86400000),8); }catch(e){}

  var rangeBar='<div class="subh">'+t('कितने दिनों में खोजें','Search window')+'</div><div class="xgrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:4px;">'
   +[30,90,180].map(function(d){
      return '<div class="xt" style="padding:9px 6px;'+(d===days?'border-color:rgba(232,190,90,0.9);background:#4A3114;':'')+'" '
       +'onclick="MUH_DAYS[\''+key+'\']='+d+';route();"><div class="xt-n">'+d+' '+t('दिन','days')+'</div></div>';
    }).join('')+'</div>'
   +'<div class="pcard" onclick="goBp(\'self\',\'#muhurta/'+key+'\')"><div class="pc-i">🎂</div>'
   +'<div><div class="pc-n dev">'+(pr.name||t('आपका विवरण','Your details'))+'</div>'
   +'<div class="pc-s">'+bpLine(pr)+'</div></div><div class="pc-go">✎</div></div>';

  var body;
  if(!res||!res.results||!res.results.length){
    body='<div class="note">'+t('इस अवधि में इस कार्य के लिए कोई पूर्ण शुभ दिन नहीं मिला। शर्तें ढीली करके दिन बनाना आसान था — नहीं किया। अवधि बढ़ाकर देखिए।',
      'No fully auspicious day for this in the chosen window. Loosening the rules to manufacture one would have been easy — we did not. Try a longer window.')+'</div>';
  } else {
    body=res.results.map(function(r){
      var d=new Date(r.date);
      var when=d.toLocaleDateString(H?'hi-IN':'en-IN',{weekday:'short',day:'numeric',month:'short'});
      var plus=(r.plus||[]).map(function(x){return '<div style="font-size:10.5px;color:rgba(150,220,170,0.88);line-height:1.6;">✓ '+(H?x.hi:x.en)+'</div>';}).join('');
      var minus=(r.minus||[]).map(function(x){return '<div style="font-size:10.5px;color:rgba(240,150,130,0.88);line-height:1.6;">△ '+(H?x.hi:x.en)+'</div>';}).join('');
      return '<div class="card" style="margin-bottom:9px;">'
        +'<div style="display:flex;align-items:baseline;gap:9px;margin-bottom:6px;">'
        +'<b style="font-size:15px;color:#F7EED8;">'+when+'</b>'
        +'<span class="dev" style="font-size:12px;color:rgba(212,168,67,0.85);">'+(H?r.nakshatra.hi:r.nakshatra.en)+' · '+(H?r.tithi.hi:r.tithi.en)+'</span></div>'
        +plus+minus
        +(r.abhijit?'<div style="font-size:10.5px;color:rgba(255,244,222,0.62);margin-top:5px;">⭐ '+t('अभिजित ','Abhijit ')+fR(r.abhijit.start,r.abhijit.end)+'</div>':'')
        +(r.amritKaal?'<div style="font-size:10.5px;color:rgba(255,244,222,0.62);">🍯 '+t('अमृत काल ','Amrit Kaal ')+fR(r.amritKaal.start,r.amritKaal.end)+'</div>':'')
        +'</div>';
    }).join('');
  }
  app.innerHTML=head+rangeBar
   +'<div class="subh">'+t('आपके लिए शुभ तिथियाँ','Auspicious dates for you')+'</div>'
   +body
   +'<div class="cta" onclick="location.href=\'buy.html?r=muhurta\'">'
   +'<div class="cta-t">'+t('इससे आगे का मुहूर्त चाहिए?','Need the full muhurta workup?')+'</div>'
   +'<div class="cta-s">'+t('विस्तृत मुहूर्त रिपोर्ट में हर तिथि का घंटा-दर-घंटा लग्न, चौघड़िया और होरा, वर्ज्य काल, और आपकी कुंडली के अनुसार क्रम में लगी सूची मिलती है।',
      'The detailed Muhurta Report adds hour-by-hour lagna for each date, choghadiya and hora windows, periods to avoid, and the dates ranked against your own chart.')+'</div>'
   +'<div class="cta-b">'+t('विस्तृत मुहूर्त रिपोर्ट देखें →','View Detailed Muhurta Report →')+'</div></div>'
   +'<div class="note">'+t('तिथि, नक्षत्र, वार, ताराबल और चंद्रबल — पाँचों जाँचे गए।','Tithi, nakshatra, weekday, tarabala and chandrabala all checked.')+'</div>';
}
var MUH_DAYS={};
/* ── shared segment-list renderer (choghadiya, hora) ── */
function segList(arr,label){
  var now=Date.now(),h='';
  arr.forEach(function(sg){
    var a=new Date(sg.start).getTime(), b=new Date(sg.end).getTime();
    var live=now>=a&&now<b;
    h+='<div class="sgrow '+(sg.good?'g':'b')+(live?' now':'')+'">'
      +'<div class="sg-d" style="background:'+(sg.good?'#5ABE78':'#E66E5A')+'"></div>'
      +'<div class="sg-n dev">'+(H?sg.hi:sg.en)+(live?' <span class="sg-now">'+t('अभी','NOW')+'</span>':'')+'</div>'
      +'<div class="sg-t">'+fR(sg.start,sg.end)+'</div></div>';
  });
  return '<div class="subh">'+label+'</div><div class="seglist">'+h+'</div>';
}
function vChogh(){
  var p=panchang();
  app.innerHTML=pgHead(t('चौघड़िया','Choghadiya'),t('सूर्योदय से सूर्योदय तक 16 खंड','16 slots, sunrise to sunrise'),'#explore')
   +segList(p.choghadiya.day,t('दिन के चौघड़िया','Day Choghadiya'))
   +segList(p.choghadiya.night,t('रात के चौघड़िया','Night Choghadiya'))
   +'<div class="note">'+t('हरा = शुभ खंड, लाल = वर्ज्य। खंड सूर्योदय-सूर्यास्त से बनते हैं, घड़ी से नहीं।','Green = auspicious, red = avoid. Slots derive from actual sunrise/sunset, not clock hours.')+'</div>';
}
function vHora(){
  var p=panchang();
  var day=p.hora.filter(function(x){return x.dayTime;}), night=p.hora.filter(function(x){return !x.dayTime;});
  app.innerHTML=pgHead(t('होरा','Hora'),t('24 ग्रह होरा — हर होरा का स्वामी','24 planetary hours and their lords'),'#explore')
   +segList(day,t('दिन की होरा','Daytime Hora'))
   +segList(night,t('रात की होरा','Night Hora'))
   +'<div class="note">'+t('हर होरा का स्वामी ग्रह उस समय शुरू किए कार्यों पर प्रभाव डालता है।','Each hora is ruled by a planet said to colour the work begun in it.')+'</div>';
}
function vTara(){
  var p=panchang(), tb=p.tarabalam&&p.tarabalam[0];
  if(!tb){app.innerHTML=pgHead(t('ताराबल','Tarabala'),'','#explore')+'<div class="note">—</div>';return;}
  var mine=(U.nakshatra||'').toLowerCase();
  var rows=tb.all.map(function(n){
    var me=n.en.toLowerCase()===mine;
    return '<div class="sgrow '+(n.good?'g':'b')+(me?' now':'')+'">'
      +'<div class="sg-d" style="background:'+(n.good?'#5ABE78':'#E66E5A')+'"></div>'
      +'<div class="sg-n dev">'+(H?n.hi:n.en)+(me?' <span class="sg-now">'+t('आपका','YOURS')+'</span>':'')+'</div>'
      +'<div class="sg-t">'+n.taraEn+' · '+n.verdict+'</div></div>';
  }).join('');
  app.innerHTML=pgHead(t('ताराबल','Tarabala'),t('आज का नक्षत्र ','Day nakshatra ')+'<span class="dev">'+(H?tb.dayNakshatra.hi:tb.dayNakshatra.en)+'</span>','#explore')
   +'<div class="subh">'+t('सभी 27 नक्षत्रों के लिए फल','Verdict for all 27 nakshatras')+'</div>'
   +'<div class="seglist">'+rows+'</div>'
   +'<div class="note">'+t('अपने जन्म नक्षत्र से गिनकर — तीसरा, पाँचवाँ और सातवाँ तारा वर्ज्य माने जाते हैं।','Counted from your birth nakshatra — the 3rd, 5th and 7th taras are the ones classical texts avoid.')+'</div>';
}
function vChandra(){
  var p=panchang(), cb=p.chandrabalam&&p.chandrabalam[0];
  if(!cb){app.innerHTML=pgHead(t('चंद्रबल','Chandrabala'),'','#explore')+'<div class="note">—</div>';return;}
  var goodSet={}; cb.good.forEach(function(r){goodSet[r.index]=1;});
  var mineIdx=myRashiIdx(), rows='';
  for(var i=0;i<12;i++){
    var g=!!goodSet[i], me=(i===mineIdx);
    rows+='<div class="sgrow '+(g?'g':'b')+(me?' now':'')+'">'
      +'<div class="sg-d" style="background:'+(g?'#5ABE78':'#E66E5A')+'"></div>'
      +'<div class="sg-n dev">'+(H?RASHI[i][0]:RASHI[i][1])+(me?' <span class="sg-now">'+t('आपकी','YOURS')+'</span>':'')+'</div>'
      +'<div class="sg-t">'+(g?t('अनुकूल','Favourable'):t('सामान्य','Neutral'))+'</div></div>';
  }
  app.innerHTML=pgHead(t('चंद्रबल','Chandrabala'),t('चंद्रमा आज ','Moon today in ')+'<span class="dev">'+(H?cb.dayRashi.hi:cb.dayRashi.en)+'</span>','#explore')
   +'<div class="subh">'+t('सभी 12 राशियों के लिए','For all 12 rashis')+'</div>'
   +'<div class="seglist">'+rows+'</div>'
   +'<div class="note">'+t('चंद्रबल गोचर चंद्रमा की आपकी जन्मराशि से स्थिति पर निर्भर करता है।','Chandrabala depends on where the transiting Moon sits from your birth rashi.')+'</div>';
}
function vHcal(){
  var p=panchang(), hc=p.hinduCalendar;
  app.innerHTML=pgHead(t('हिन्दू कैलेंडर','Hindu Calendar'),t('संवत्, मास, ऋतु और अयन','Samvat, masa, ritu and ayana'),'#explore')
   +'<div class="card">'
   +prow(t('अमांत मास','Amanta Month'),'<span class="dev">'+(H?hc.amantaMonth.hi:hc.amantaMonth.en)+'</span>')
   +prow(t('पूर्णिमांत मास','Purnimanta Month'),'<span class="dev">'+(H?hc.purnimantaMonth.hi:hc.purnimantaMonth.en)+'</span>')
   +prow(t('पक्ष','Paksha'),'<span class="dev">'+t(p.tithi.paksha==='Krishna'?'कृष्ण पक्ष':'शुक्ल पक्ष',p.tithi.paksha+' Paksha')+'</span>')
   +prow(t('विक्रम संवत्','Vikram Samvat'),hc.vikramSamvat)

   +(hc.gujaratiSamvat?prow(t('गुजराती संवत्','Gujarati Samvat'),hc.gujaratiSamvat):'')
   +(hc.samvatsara?prow(t('संवत्सर','Samvatsara'),'<span class="dev">'+(H?hc.samvatsara.hi:hc.samvatsara.en)+'</span>'):'')
   +(hc.ritu?prow(t('ऋतु','Ritu'),'<span class="dev">'+(H?hc.ritu.hi:hc.ritu.en)+'</span>'):'')
   +(hc.ayana?prow(t('अयन','Ayana'),'<span class="dev">'+(H?hc.ayana.hi:hc.ayana.en)+'</span>'):'')

}
function vLagna(){
  var tbl=[]; try{ tbl=PE.getLagnaTable(new Date(),LAT,LNG,5.5)||[]; }catch(e){}
  var now=Date.now(),rows='';
  tbl.forEach(function(l){
    var a=new Date(l.start).getTime(), b=new Date(l.end).getTime(), live=now>=a&&now<b;
    var nm=l.rashi?(H?l.rashi.hi:l.rashi.en):(H?l.hi:l.en);
    rows+='<div class="sgrow'+(live?' now':'')+'"><div class="sg-d" style="background:#D4A843"></div>'
      +'<div class="sg-n dev">'+(nm||'—')+(live?' <span class="sg-now">'+t('अभी','NOW')+'</span>':'')+'</div>'
      +'<div class="sg-t">'+fR(l.start,l.end)+'</div></div>';
  });
  app.innerHTML=pgHead(t('लग्न सारणी','Lagna Table'),t('आज दिन भर उदय होने वाले लग्न','Ascendants rising through today'),'#explore')
   +'<div class="seglist">'+(rows||'<div class="note">—</div>')+'</div>'
   +'<div class="note">'+t('मुहूर्त निकालते समय लग्न देखा जाता है — यही सारणी उसका आधार है।','Lagna is what a muhurta is finally judged on; this table is that basis.')+'</div>';
}
function obsList(list,icon,emptyMsg){
  var today=new Date(); today.setHours(0,0,0,0);
  var up=list.filter(function(x){return new Date(x.date+'T00:00:00')>=today;}).slice(0,24);
  if(!up.length) return '<div class="note">'+emptyMsg+'</div>';
  return '<div class="seglist">'+up.map(function(x){
    var d=new Date(x.date+'T00:00:00');
    var when=d.toLocaleDateString(H?'hi-IN':'en-IN',{day:'numeric',month:'short'});
    var days=Math.round((d-today)/86400000);
    var rel=days===0?t('आज','Today'):days===1?t('कल','Tomorrow'):(days+t(' दिन में',' days'));
    return '<div class="sgrow'+(days===0?' now':'')+'"><div class="sg-d" style="background:#D4A843"></div>'
      +'<div class="sg-n dev">'+icon+' '+(H?x.hi:x.en)+'</div>'
      +'<div class="sg-t">'+when+' · '+rel+'</div></div>';
  }).join('')+'</div>';
}
function vVrats(){
  var l=[]; try{ l=PE.getVrats(new Date().getFullYear(),LAT,LNG,5.5)||[]; }catch(e){}
  app.innerHTML=pgHead(t('व्रत','Vrats'),t('आने वाले व्रत — गणना से','Upcoming fasts, computed'),'#explore')
   +obsList(l,'🙏',t('इस वर्ष आगे कोई व्रत नहीं','No further vrats this year'));
}
function vFest(){
  var l=[]; try{ l=PE.getFestivals(new Date().getFullYear(),LAT,LNG,5.5)||[]; }catch(e){}
  app.innerHTML=pgHead(t('त्योहार','Festivals'),t('इस वर्ष के आने वाले पर्व','Upcoming festivals this year'),'#explore')
   +obsList(l,'🪔',t('इस वर्ष आगे कोई पर्व नहीं','No further festivals this year'));
}
