/* ─────────────────────────────────────────────────────────────
   ASTROLOGY TODAY · Phase 1 (hub · rashifal · panchang · times)

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{background:var(--ink);}

  background:linear-gradient(165deg,#0D0500 0%,#241005 40%,#0D0500 100%);
  padding:0 14px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden;}
.dev{font-family:'Tiro Devanagari Hindi',serif;}

/* header */

.back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;

.h-t{font-size:17.5px;color:var(--gold);font-weight:600;}
.h-s{font-size:9.5px;color:rgba(255,244,222,0.45);letter-spacing:0.4px;margin-top:1px;}
.h-city{margin-left:auto;font-size:10px;color:rgba(212,168,67,0.7);text-align:right;line-height:1.5;}

  position:relative;overflow:hidden;}
.dial::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;

<script>
/* Language tables must load BEFORE the page's own script runs. A dynamically
   appended <script> does not block the parser, so the chosen-language file
   arrived after the page had already painted and every A() call fell through
   to Hindi — verified by snapshotting all 46 screens, where every English
   screen came back in Hindi. document.write during initial parse IS parser-
   blocking, which is the ordering guarantee needed here.
   Hindi always loads as the fallback; the chosen language loads beside it. */
window.SD_LANG=(function(){try{return JSON.parse(localStorage.getItem('shubhdin_user')||'{}').lang||'hi';}catch(e){return 'hi';}})();
document.write('<scr'+'ipt src="app-strings-hi.js"></scr'+'ipt>');
if(window.SD_LANG&&window.SD_LANG!=='hi')
  document.write('<scr'+'ipt src="app-strings-'+window.SD_LANG+'.js"></scr'+'ipt>');
document.write('<scr'+'ipt src="app-strings-loader.js"></scr'+'ipt>');
/* If app-strings-loader.js itself fails to arrive, A() is undefined and EVERY
   call site throws — the page half-renders and stops. Verified by blocking the
   file: "A is not defined", and the screen died partway. This shim defines the
   minimum so the page completes; the real loader overwrites it when it lands. */
window.addEventListener('DOMContentLoaded',function(){},false);
if(typeof window.A!=='function'){
  window.A=function(k){return String(k).replace(/^[a-z]+\./,'').replace(/_/g,' ')
                        .replace(/^./,function(c){return c.toUpperCase();});};
  window.AF=function(k,v){return String(window.A(k)).replace(/\{(\w+)\}/g,function(_,n){
                        return (v&&v[n]!=null)?v[n]:'';});};
  window.AP=function(k,n,v){var o={};if(v)for(var p in v)o[p]=v[p];o.n=n;return window.AF(k,o);};
}
</script>

(U.lang||'hi')==='hi';
/* Date locale follows the reader's language. Every call passed H?'hi-IN':'en-IN',

   Inserted after the H STATEMENT — an earlier attempt anchored on "var H=" and

   script. Anchor on a complete statement, never a fragment. */
function sdLocale(){
  var l = (typeof window!=='undefined' && window.SD_LANG) || 'hi';
  return { hi:'hi-IN', en:'en-IN', te:'te-IN', kn:'kn-IN', ta:'ta-IN',

}

/* ══ SD-COORD-HONESTY ══════════════════════════════════════════════════════
   This read:
       var LAT = parseFloat(U.city_lat) || 23.1793;   // Ujjain
       var CITY = U.city || 'Ujjain';
   Two independent fallbacks, so a user whose coordinates were missing saw
   THEIR OWN CITY NAME sitting above UJJAIN'S timings. Measured: the page said
   "Machilipatnam" and computed lat 23.1793. Sunrise, rahu kaal and every
   muhurta on that screen were for a city 900km away, with nothing to tell them.

   That is the same fault as the settings bug — the screen agreeing with the
   user while the arithmetic does not — and it matters more here, because
   people plan weddings on these timings.

   The pair now moves together. If we fall back, we say we fell back. */
var SD_COORD_FALLBACK = !(isFinite(parseFloat(U.city_lat)) && isFinite(parseFloat(U.city_lon)));
var LAT = SD_COORD_FALLBACK ? 23.1793 : parseFloat(U.city_lat);
var LNG = SD_COORD_FALLBACK ? 75.7849 : parseFloat(U.city_lon);
var CITY = SD_COORD_FALLBACK ? A('astrol.ujjain') : (U.city || A('astrol.ujjain'));

/* And say it on the screen, once, where it cannot be missed. */
(function(){
  if(!SD_COORD_FALLBACK) return;
  try{

      if(document.getElementById('sdCoordWarn')) return;
      var L=(window.SD_LANG||'hi');
      var MSG={en:'Times shown are for Ujjain. Set your city for your own timings.',

// Engine objects are not uniformly {hi,en}: dishaShool is {en,hi},
// samvatsara is {en,shaka,vikram,gujarati}, and ritu/ayana are {vedic,drik}
// where .drik is ITSELF {en,hi}. Assuming one shape printed "undefined" and
// "[object Object]" at the user. Resolve by shape, and recurse.
function L(v,depth){
  depth=depth||0;
  if(v===null||v===undefined) return '';
  if(typeof v!=='object') return String(v);
  if(depth>3) return '';
  if(H&&v.hi) return L(v.hi,depth+1);
  if(v.en)     return L(v.en,depth+1);
  if(v.drik)   return L(v.drik,depth+1);     // ritu / ayana
  if(v.vikram) return L(v.vikram,depth+1);   // samvatsara
  if(v.hi)     return L(v.hi,depth+1);
  return '';
}

/* ══════════════════════════════════════════════════════════════════
   fmt() — string templates with tokens, for translation.

   The app used to build sentences by concatenation:
       [old]  "Moon today in " + rashiName + " rashi"      (three fragments)
   The extractor faithfully captured those fragments, and they cannot be
   translated. English puts "in" BEFORE the noun; Telugu, Kannada, Tamil,
   Bengali and Assamese suffix it ONTO the noun — కన్యలో, கன்னியில். There is
   no standalone Telugu word for "Moon today in ", so a translator can only
   return something wrong or return the English back.

   With a token the whole sentence is one translatable unit and word order
   becomes the translator's decision, which is the only place it can be made:
       [new]  "Moon today in {rashi}"  →  Telugu renders it {rashi}-first,
              with the postposition attached to the noun, verb last.

   Same for trailing fragments — "3" + " day streak" — where the number
   inflects the noun in several of these languages.
   ══════════════════════════════════════════════════════════════════ */
/* Counted nouns need one/other forms, not just a token: Telugu, Kannada and
   Tamil inflect the unit with the count (1 → రోజు, 3 → రోజులు). Hindi does not,
   so both slots hold the same string today — the slot is what matters, so the
   form can be supplied later without touching code. */
function plural(n, one, other){ return fmt(Number(n) === 1 ? one : other, {n:n}); }

function fmt(tpl, vals){
  return String(tpl).replace(/\{(\w+)\}/g, function(_, k){
    return (vals && vals[k] !== undefined && vals[k] !== null) ? vals[k] : '';
  });
}

/* ══════════════════════════════════════════════════════════════════
   ONE GOOD-WINDOW RULE — used everywhere a window is recommended.

   A choghadiya slot flagged `good` is only good in isolation. The same
   clock minutes are routinely also Rahu Kaal, Yamaganda, Gulika, Varjyam
   or Dur Muhurtam — on the test day "Shubh 09:47–11:21" was byte-identical
   to Rahu Kaal. Recommending and forbidding the same minutes is the one
   error a devotee will actually catch, so a window is never recommended
   until the forbidden periods have been cut out of it.

   recommended = shubh choghadiya  MINUS  (rahu ∪ yamaganda ∪ gulika
                                           ∪ varjyam ∪ dur muhurtam)
   ══════════════════════════════════════════════════════════════════ */
var GW_MIN_MINUTES = 12;   // a slice shorter than this is not worth naming

function badWindows(p){
  var out=[];
  function add(w, lbl){var hi=lbl,en=lbl; if(w&&w.start&&w.end) out.push({s:+new Date(w.start),e:+new Date(w.end),hi:hi,en:en}); }

  add(p.gulikaKaal, A('dashbo.gulika_kaal'));
  add(p.yamaganda, A('dashbo.yamaganda'));
  (p.durMuhurtam||[]).forEach(function(w){ add(w, A('dashbo.dur_muhurtam')); });
  (p.varjyamAll||(p.varjyam?[p.varjyam]:[])).forEach(function(w){ add(w, A('dashbo.varjyam')); });
  return out.sort(function(a,b){return a.s-b.s;});
}
/* Cut every bad window out of one span; returns the surviving pieces. */
function cutBad(startMs,endMs,bads){
  var pieces=[{s:startMs,e:endMs}];
  bads.forEach(function(b){
    var next=[];
    pieces.forEach(function(pc){
      if(b.e<=pc.s||b.s>=pc.e){ next.push(pc); return; }     // no overlap
      if(b.s>pc.s) next.push({s:pc.s,e:Math.min(b.s,pc.e)}); // head survives
      if(b.e<pc.e) next.push({s:Math.max(b.e,pc.s),e:pc.e}); // tail survives
    });
    pieces=next;
  });
  return pieces.filter(function(pc){ return (pc.e-pc.s) >= GW_MIN_MINUTES*60000; });
}
/* Which forbidden periods overlap this span (for honest labelling). */
function clashesWith(startMs,endMs,bads){
  return bads.filter(function(b){ return b.s<endMs && b.e>startMs; });

/* Every genuinely clean, still-upcoming window of the day, in time order. */
function cleanWindows(){
  var p=panchang(), bads=badWindows(p), now=Date.now(), out=[];
  p.choghadiya.day.concat(p.choghadiya.night).forEach(function(sg){
    if(!sg.good) return;
    cutBad(+new Date(sg.start), +new Date(sg.end), bads).forEach(function(pc){
      if(pc.e>now) out.push({start:new Date(pc.s),end:new Date(pc.e),
                             hi:sg.hi,en:sg.en,
                             trimmed:(pc.s!==+new Date(sg.start)||pc.e!==+new Date(sg.end))});
    });
  });
  // Abhijit is a recommended window too — and gets cut by the same rule.
  if(p.abhijit) cutBad(+new Date(p.abhijit.start),+new Date(p.abhijit.end),bads).forEach(function(pc){
    if(pc.e>now) out.push({start:new Date(pc.s),end:new Date(pc.e),hi:'अभिजित',en:'Abhijit',
                           trimmed:(pc.s!==+new Date(p.abhijit.start)||pc.e!==+new Date(p.abhijit.end))});
  });
  return out.sort(function(a,b){return a.start-b.start;});
}

/* ══ SD-LIMB-ORDER ══════════════════════════════════════════════════════════
   These rows were assembled as   <name> + "until {time}"   with the order
   fixed in the MARKUP. English is the only one of our nine languages where
   that order is right. Everywhere else the postposition follows the time:

       te  విదియ 09:37 వరకు        (not  విదియ వరకు 09:37)
       hi  द्वितीया 09:37 तक
       kn  ಬಿದಿಗೆ 09:37 ವರೆಗೆ
       ta  துவிதியை 09:37 வரை
       bn  দ্বিতীয়া 09:37 পর্যন্ত
       mr  द्वितीया 09:37 पर्यंत
       gu  બીજ 09:37 સુધી
       as  দ্বিতীয়া 09:37 লৈকে

   No translator could have fixed this: they were handed the fragment
   "until {time}" with no way to move it relative to a name they never saw.
   One template per language, with BOTH slots in it, so word order belongs to
   the language instead of to the code. */
function limbUntil(name,time){
  try{ if(typeof sdHas==='function'&&sdHas('astrol.limb_until'))
        return AF('astrol.limb_until',{name:name,time:time}); }catch(e){}
  var L=(window.SD_LANG||'hi');
  var T={en:'{name} until {time}',hi:'{name} {time} तक',te:'{name} {time} వరకు',
    kn:'{name} {time} ವರೆಗೆ',ta:'{name} {time} வரை',bn:'{name} {time} পর্যন্ত',
    mr:'{name} {time} पर्यंत',gu:'{name} {time} સુધી',as:'{name} {time} লৈকে'};
  return (T[L]||T.hi).replace('{name}',name).replace('{time}',time);
}
function thenNextUntil(name,time){
  try{ if(typeof sdHas==='function'&&sdHas('astrol.then_next_until'))
        return AF('astrol.then_next_until',{next:name,time:time}); }catch(e){}
  var L=(window.SD_LANG||'hi');
  var T={en:'then {name} until {time}',hi:'फिर {name} {time} तक',
    te:'ఆ తర్వాత {name} {time} వరకు',kn:'ನಂತರ {name} {time} ವರೆಗೆ',
    ta:'பின்னர் {name} {time} வரை',bn:'তারপর {name} {time} পর্যন্ত',
    mr:'त्यानंतर {name} {time} पर्यंत',gu:'પછી {name} {time} સુધી',
    as:'তাৰ পিছত {name} {time} লৈকে'};
  return (T[L]||T.hi).replace('{name}',name).replace('{time}',time);
}

/* ═════════ SHARED BIRTH-PROFILE SYSTEM ═════════
   One store, used by every personal feature in the app. 'self' writes straight
   into shubhdin_user so Settings, Kundli and the buy flow all see the same
   details — a user enters their birth data once, anywhere, and never again. */
function bpRead(slot){
  if(slot==='self'){
    var u={}; try{u=JSON.parse(localStorage.getItem('shubhdin_user')||'{}');}catch(e){}
    if(!u.dob) return null;
    return {name:u.name||'', dob:u.dob, tob:u.tob||'12:00',
            place:u.birth_place||u.city||'',
            lat:(u.birth_lat!=null?u.birth_lat:u.city_lat),
            lng:(u.birth_lng!=null?u.birth_lng:u.city_lon)};
  }
  try{return JSON.parse(localStorage.getItem('sd_bp_'+slot)||'null');}catch(e){return null;}
}
function bpWrite(slot,pr){
  if(slot==='self'){
    var u={}; try{u=JSON.parse(localStorage.getItem('shubhdin_user')||'{}');}catch(e){}
    if(pr.name) u.name=pr.name;
    u.dob=pr.dob; u.tob=pr.tob; u.birth_place=pr.place; u.birth_lat=pr.lat; u.birth_lng=pr.lng;
    if(u.city_lat==null){u.city_lat=pr.lat; u.city_lon=pr.lng; u.city=u.city||pr.place;}
    localStorage.setItem('shubhdin_user',JSON.stringify(u)); U=u;
    return;
  }
  localStorage.setItem('sd_bp_'+slot,JSON.stringify(pr));
}
function bpDate(pr){ return pr? new Date(pr.dob+'T'+(pr.tob||'12:00')+':00+05:30') : null; }

// Marriage is deliberately NOT here. A marriage muhurta needs both charts —

var MUH_META={

function birthDT(){
  if(!U.dob) return null;
  return new Date(U.dob+'T'+(U.tob||'12:00')+':00+05:30');
}
function vMuhurtaRun(key){
  var m=MUH_META[key]; if(!m) return vMuhurtaPick();
  var head=pgHead((m.i+' ')+L3(m.hi,m.en,m.key),A('astrol.auspicious_dates_from_your_own_cha'),'#explore');
  var pr=bpRead('self');

  /* No birth details? Ask for them HERE, with the reason — never a detour to Settings. */
  if(!pr){
    app.innerHTML=head
     +'<div class="bpwhy">'+A('astrol.tithi_nakshatra_and_weekday_are_th')+'</div>'
     +'<div class="pcard empty" onclick="goBp(\'self\',\'#muhurta/'+key+'\')">'
     +'<div class="pc-i">🎂</div><div><div class="pc-n dev">'+A('astrol.enter_birth_details')+'</div>'
     +'<div class="pc-s">'+A('astrol.once_used_across_the_whole_app')+'</div></div>'
     +'<div class="pc-go">+</div></div>';
    return;
  }

  var days=MUH_DAYS[key]||90, sortBy=MUH_SORT[key]||'score';
  var res=null;
  try{ res=PE.findMuhurta(key,bpDate(pr),LAT,LNG,new Date(),new Date(Date.now()+days*86400000),12); }catch(e){}

  var controls='<div class="subh">'+A('astrol.search_window')+'</div>'
   +'<div class="xgrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:9px;">'
   +[30,90,180].map(function(d){
      return '<div class="xt" style="padding:9px 6px;'+(d===days?'border-color:rgba(232,190,90,0.9);background:#4A3114;':'')+'" '
       +'onclick="MUH_DAYS[\''+key+'\']='+d+';route();"><div class="xt-n">'+d+' '+A('explor.days')+'</div></div>';
    }).join('')+'</div>'
   +'<div class="pcard" onclick="goBp(\'self\',\'#muhurta/'+key+'\')"><div class="pc-i">🎂</div>'
   +'<div><div class="pc-n dev">'+(pr.name||A('astrol.your_details'))+'</div>'
   +'<div class="pc-s">'+bpLine(pr)+'</div></div><div class="pc-go">✎</div></div>';

  if(!res||!res.results||!res.results.length){
    app.innerHTML=head+controls+'<div class="note">'+A('astrol.no_auspicious_day_for_this_in_the_')+'</div>';
    return;
  }

  /* ── ranking, stated out loud ──
     The engine returns score-ordered, so 11 Nov could sit above 13 Sept and
     look like a sorting bug. Tiers are relative to the best score this search
     actually found — no invented ceiling — and the order is labelled. */
  var top=Math.max.apply(null,res.results.map(function(r){return r.score;}));
  // A date carrying a ⚠ is never "Best", however high it scores — 22 Oct
  // scored top while flagged, and ★★★ beside a warning is exactly the kind of
  // contradiction this app cannot afford. Any ⚠ caps at ★★☆.
  function tier(sc,flawed){
    if(sc>=top   && !flawed) return {n:3,hi:'सर्वोत्तम',en:'Best',key:'tier.best'};
    if(sc>=top-2)            return {n:2,hi:'उत्तम',   en:'Very good',key:'tier.very_good'};
    return                          {n:1,hi:'ठीक',      en:'Workable',key:'tier.workable'};
  }
  var list=res.results.slice();
  if(sortBy==='date') list.sort(function(a,b){return new Date(a.date)-new Date(b.date);});

  function card(r,rank){
    var d=new Date(r.date), flawed=!!(r.minus||[]).length, tr=tier(r.score,flawed);
    var when=d.toLocaleDateString(sdLocale(),{weekday:'short',day:'numeric',month:'short'});
    var stars='★'.repeat(tr.n)+'☆'.repeat(3-tr.n);
    var plus=(r.plus||[]).map(function(x){return '<div style="font-size:10.5px;color:rgba(150,220,170,0.88);line-height:1.6;">✓ '+sdReason(x)+'</div>';}).join('');
    var minus=(r.minus||[]).map(function(x){return '<div style="font-size:10.5px;color:rgba(240,150,130,0.88);line-height:1.6;">⚠ '+sdReason(x)+'</div>';}).join('');
    return '<div class="card" style="margin-bottom:9px;'+(minus?'border-color:rgba(232,163,23,0.30);':'')+'">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
      +(rank?'<span style="font-size:10px;font-weight:700;color:rgba(212,168,67,0.75);min-width:18px;">#'+rank+'</span>':'')
      +'<b style="font-size:15px;color:#F7EED8;">'+when+'</b>'
      +'<span style="margin-left:auto;font-size:11px;color:'+(tr.n===3?'#8FE0A8':tr.n===2?'#E8BE5A':'rgba(255,244,222,0.55)')+';">'
      +stars+' '+L3(tr.hi,tr.en,tr.key)+'</span></div>'
      +'<div class="dev" style="font-size:12px;color:rgba(212,168,67,0.85);margin-bottom:5px;">'
      +sdNak(r.nakshatra)+' · '+sdTithi(r.tithi)+'</div>'
      +plus+minus
      +window_(r,'abhijit','⭐',A('dashbo.abhijit'))
      +window_(r,'amritKaal','🍯',A('dashbo.amrit_kaal'))
      +'</div>';
  }

  var body;
  if(sortBy==='date'){
    body=list.map(function(r){return card(r,0);}).join('');
  } else {
    var clean=list.filter(function(r){return !(r.minus||[]).length;});
    var caveat=list.filter(function(r){return (r.minus||[]).length;});
    body=(clean.length?'<div class="subh">'+A('astrol.clean_dates')+'</div>'
          +clean.map(function(r,i){return card(r,i+1);}).join(''):'')
        +(caveat.length?'<div class="subh">'+A('astrol.these_carry_a_caveat')+'</div>'
          +'<div class="note" style="margin:-2px 2px 8px;">'+A('astrol.still_auspicious_but_each_carries_')+'</div>'
          +caveat.map(function(r,i){return card(r,clean.length+i+1);}).join(''):'');
  }

  var sortBar='<div class="subh" style="display:flex;align-items:center;gap:8px;">'
   +'<span>'+(sortBy==='score'?A('astrol.order_best_first'):A('astrol.order_by_date'))+'</span>'
   +'<span style="margin-left:auto;font-weight:600;color:rgba(232,190,90,0.9);cursor:pointer;text-transform:none;letter-spacing:0;font-size:11px;" '
   +'onclick="MUH_SORT[\''+key+'\']=\''+(sortBy==='score'?'date':'score')+'\';route();">'
   +(sortBy==='score'?A('astrol.sort_by_date'):A('astrol.sort_by_best'))+'</span></div>';

  app.innerHTML=head+controls
   +'<div class="note" style="margin:2px 2px 4px;">'
   +AF('astrol.across_n_days_found_best_shown',{days:days,found:(res.totalFound||list.length),shown:list.length})+'</div>'
   +sortBar+body
   +'<div class="note">'+A('astrol.tithi_nakshatra_weekday_tarabala_a')+'</div>';
}
/* The paid Muhurta report was withdrawn from sale (see report-catalog.js), so
   the upsell that used to sit under these results is gone and muhurtaBuy() with
   it. Nothing here links to buy.html?r=muhurta any more — an upsell to a
   delisted report would take money for something no longer offered.

   The old CTA also promised more than the report delivered: "hour-by-hour lagna
   for each date, choghadiya and hora windows". The report prints none of those.

var MUH_DAYS={}, MUH_SORT={};
/* A suggested window inside a muhurta result goes through the same rule.
   That day's own forbidden periods are recomputed — a good window on the
   11th means nothing if the 11th's Rahu Kaal sits inside it. */
function window_(r,key,ico,label){
  var w=r[key];
  if(!w){
    var wd=new Date(r.date).getDay();
    var why = (key==='abhijit'&&wd===3)
      ? A('astrol.abhijit_is_not_taken_on_a_wednesda')
      : A('astrol.none_that_day');
    return '<div style="font-size:10.5px;color:rgba(255,244,222,0.42);margin-top:3px;">'+ico+' '+label+why+'</div>';
  }
  var day=new Date(r.date), pieces;
  try{
    var dp=PE.getPanchang(day,LAT,LNG,5.5);
    pieces=cutBad(+new Date(w.start),+new Date(w.end),badWindows(dp));
  }catch(e){ pieces=[{s:+new Date(w.start),e:+new Date(w.end)}]; }
  if(!pieces.length)
    return '<div style="font-size:10.5px;color:rgba(240,150,130,0.80);">'+ico+' '+label
      +A('astrol.fully_blocked_by_a_forbidden_perio')+'</div>';
  return pieces.map(function(pc){
    return '<div style="font-size:10.5px;color:rgba(255,244,222,0.62);margin-top:3px;">'
      +ico+' '+label+fR(new Date(pc.s),new Date(pc.e))+'</div>';
  }).join('');
}
/* ── shared segment-list renderer (choghadiya, hora) ── */
function segList(arr,label,bads,kind){
  /* kind: 'choghadiya' (default) or 'hora'. The hora rows used to go through
     sdChog(), miss on every planet name and fall back to Hindi. */
  var now=Date.now(),h='';
  arr.forEach(function(sg){
    var a=new Date(sg.start).getTime(), b=new Date(sg.end).getTime();
    var live=now>=a&&now<b;
    var hit=(bads&&sg.good)?clashesWith(a,b,bads):[];
    var ok=sg.good&&!hit.length;
    h+='<div class="sgrow '+(ok?'g':'b')+(live?' now':'')+'">'
      +'<div class="sg-d" style="background:'+(ok?'#5ABE78':(sg.good?'#E8A317':'#E66E5A'))+'"></div>'
      +'<div class="sg-n dev">'+(kind==='hora'?sdHora(sg):sdChog(sg))+(live?' <span class="sg-now">'+A('dashbo.now')+'</span>':'')
      +(hit.length?'<div style="font-size:9.5px;color:rgba(240,150,130,0.9);margin-top:2px;">⚠ '+AF('astrol.overlaps_what', {what:(hit[0].en)})+'</div>':'')+'</div>'
      +'<div class="sg-t">'+fR(sg.start,sg.end)+'</div></div>';
  });
  return '<div class="subh">'+label+'</div><div class="seglist">'+h+'</div>';
}

// prow, but the row disappears rather than printing an empty or "undefined"
function orow(k,v){ return v?prow(k,'<span class="dev">'+v+'</span>'):''; }

   +orow(A('astrol.ritu'),sdRitu((hc.ritu&&hc.ritu.drik)||hc.ritu))

/* Every dot used to be the same gold, which told the reader nothing. The one
   distinction that actually decides a muhurta is the sign's quality: chara
   (movable) suits travel and vehicles, sthira (fixed) suits anything meant to
   last — a house, a marriage — and dvisvabhava (dual) sits between. That is
   what the dot now encodes. Derived from rashiIndex % 3, the classical order. */
var LAGNA_QUALITY=[
  {useKey:'astrol.lagna_use_movable', hi:'चर',   en:'Movable', c:'#7FB3F5', use_hi:'यात्रा, वाहन, नई शुरुआत', use_en:'travel, vehicles, new starts'},
  {useKey:'astrol.lagna_use_fixed', hi:'स्थिर', en:'Fixed',   c:'#5ABE78', use_hi:'गृह प्रवेश, विवाह, स्थायी काम', use_en:'griha pravesh, marriage, lasting work'},
  {useKey:'astrol.lagna_use_dual', hi:'द्विस्वभाव', en:'Dual', c:'#E8BE5A', use_hi:'बातचीत, पढ़ाई, दोहरे काम', use_en:'talks, study, mixed work'}
];
/* Personalised pages must say WHY they are impersonal. Without a birth
   nakshatra, Tarabala is just a list of 27 rows and the user has no idea a
   "yours" row was ever meant to be there. */
function needBirth(what){
  return '<div class="pcard empty" onclick="goBp(\'self\',\''+location.hash+'\')">'
   +'<div class="pc-i">🎂</div><div><div class="pc-n dev">'+A('dashbo.add_your_birth_details')+'</div>'
   +'<div class="pc-s">'+what+'</div></div><div class="pc-go">+</div></div>';
}
/* Moon can change nakshatra within a single day, so an assumed birth time can
   land on the wrong one. Say so rather than presenting it as settled. */
function tobUnknownNote(){
  var u={}; try{u=JSON.parse(localStorage.getItem('shubhdin_user')||'{}');}catch(e){}
  if(!u.tobUnknown) return '';
  return '<div class="note" style="color:rgba(232,190,90,0.78);">'
   +A('astrol.your_birth_time_is_unknown_so_sunr')+'</div>';
}
function vLagna(){
  var tbl=[]; try{ tbl=PE.getLagnaTable(new Date(),LAT,LNG,5.5)||[]; }catch(e){}
  var now=Date.now(),rows='';
  tbl.forEach(function(l){
    var a=new Date(l.start).getTime(), b=new Date(l.end).getTime(), live=now>=a&&now<b;
    var nm=l.rashi?sdRashi(l.rashi):sdRashi(l);
    var q=LAGNA_QUALITY[(l.rashiIndex!=null?l.rashiIndex:0)%3];
    rows+='<div class="sgrow'+(live?' now':'')+'"><div class="sg-d" style="background:'+q.c+'"></div>'
      +'<div class="sg-n dev">'+(nm||'—')+(live?' <span class="sg-now">'+A('dashbo.now')+'</span>':'')
      +'<div style="font-size:9.5px;color:'+q.c+';opacity:0.85;margin-top:2px;">'+sdQuality(q.en)+'</div></div>'
      +'<div class="sg-t">'+fR(l.start,l.end)+'</div></div>';
  });
  var legend=LAGNA_QUALITY.map(function(q){
    return '<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">'
      +'<span style="width:8px;height:8px;border-radius:50%;background:'+q.c+';flex-shrink:0;"></span>'
      +'<span style="font-size:10.5px;color:rgba(255,244,222,0.72);"><b style="color:'+q.c+';">'+sdQuality(q.en)+'</b> — '
      +A(q.useKey)+'</span></div>';
  }).join('');
  app.innerHTML=pgHead(A('astrol.lagna_table'),A('astrol.ascendants_rising_through_today'),'#explore')
   +'<div class="subh">'+A('astrol.what_the_colours_mean')+'</div>'
   +'<div style="padding:2px 4px 10px;">'+legend+'</div>'
   +'<div class="seglist">'+(rows||'<div class="note">—</div>')+'</div>'
   +'<div class="note">'+A('explor.lagna_is_what_a_muhurta_is_finally')+'</div>';
}
function obsList(list,icon,emptyMsg){
  var today=new Date(); today.setHours(0,0,0,0);
  var up=list.filter(function(x){return new Date(x.date+'T00:00:00')>=today;}).slice(0,24);
  if(!up.length) return '<div class="note">'+emptyMsg+'</div>';
  return '<div class="seglist">'+up.map(function(x){
    var d=new Date(x.date+'T00:00:00');
    var when=d.toLocaleDateString(sdLocale(),{day:'numeric',month:'short'});
    var days=Math.round((d-today)/86400000);
    var rel=days===0?A('dashbo.today_3'):days===1?A('dashbo.tomorrow'):plural(days, A('astrol.in_n_day'), A('astrol.in_n_days'));
    return '<div class="sgrow'+(days===0?' now':'')+'"><div class="sg-d" style="background:#D4A843"></div>'
      +'<div class="sg-n dev">'+icon+' '+sdVrat(x)+'</div>'
      +'<div class="sg-t">'+when+' · '+rel+'</div></div>';
  }).join('')+'</div>';
}

   +obsList(l,'🙏',A('astrol.no_further_vrats_this_year'));

/* The engine is already on this page, so a user who has given a birth date
   should never see "add your birth details". Compute the moon rashi and
   nakshatra once, cache into the shared profile, and every personalised page
   downstream (Rashifal, Tarabala, Chandrabala) picks them up. */
(function ensureProfile(){
  try{
    if(!U.dob || (U.rashi && U.nakshatra)) return;
    var lat=(U.birth_lat!=null?U.birth_lat:U.city_lat), lng=(U.birth_lng!=null?U.birth_lng:U.city_lon);
    if(lat==null||lng==null) return;
    var d=new Date(U.dob+'T'+(U.tob||'06:00')+':00+05:30');
    var bc=PE.getBirthChart(d,lat,lng);
    var moon=bc.grahas.filter(function(g){return g.key==='moon';})[0];
    if(!moon) return;
    U.rashi=moon.rashi.en; U.nakshatra=moon.nakshatra.en;
    U.nakshatra_pada=moon.nakshatra.pada; U.lagna=bc.lagna.en;
    localStorage.setItem('shubhdin_user',JSON.stringify(U));
  }catch(e){}
})();
route();
