<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<title>Premium Reports — शुभ दिन</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--gold:#D4A843;--saffron:#FF6B1A;--ink:#0D0500;}
body{min-height:100vh;background:linear-gradient(155deg,#0D0500 0%,#2C1208 45%,#0D0500 100%);
  font-family:'Poppins',sans-serif;color:rgba(255,244,222,0.9);padding:0 14px 44px;}
.hdr{display:flex;align-items:center;gap:12px;padding:18px 2px 6px;}
.back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;
  color:rgba(212,168,67,0.85);font-size:18px;cursor:pointer;flex-shrink:0;}
.htitle{font-family:'Tiro Devanagari Hindi',serif;font-size:19px;color:var(--gold);font-weight:600;}
.htitle small{display:block;font-family:'Poppins',sans-serif;font-size:9.5px;color:rgba(255,244,222,0.45);letter-spacing:2px;font-weight:400;}
.crown{margin-left:auto;font-size:22px;}
.lead{font-size:11.5px;color:rgba(255,244,222,0.55);line-height:1.6;margin:8px 4px 16px;}

/* ── HERO: most popular ── */
.hero{position:relative;border-radius:20px;padding:18px 16px 16px;margin-bottom:18px;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg,rgba(212,168,67,0.17),rgba(255,107,26,0.07) 55%,rgba(212,168,67,0.03));
  border:1.5px solid rgba(212,168,67,0.55);display:block;text-decoration:none;color:inherit;}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--saffron),var(--gold),transparent);}
.hero:active{transform:scale(0.985);}
.ribbon{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(120deg,#B23A1A,#FF6B1A);
  color:#FFF3E8;font-size:9.5px;font-weight:700;letter-spacing:1.2px;padding:4px 11px;border-radius:20px;margin-bottom:11px;}
.h-row{display:flex;align-items:flex-start;gap:13px;}
.h-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:27px;
  background:radial-gradient(circle at 32% 28%,rgba(212,168,67,0.3),rgba(212,168,67,0.07));
  border:1px solid rgba(212,168,67,0.45);flex-shrink:0;}
.h-title{font-family:'Tiro Devanagari Hindi',serif;font-size:19px;color:#FFF4DE;font-weight:600;line-height:1.3;}
.h-en{font-size:11px;color:rgba(255,244,222,0.6);margin-top:1px;}
.hook{font-size:11.5px;color:rgba(255,244,222,0.72);line-height:1.55;margin:11px 2px 0;}
.r-hook{font-size:10.8px;margin-top:9px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 13px;}
.chip{font-size:9.8px;color:rgba(255,236,200,0.85);background:rgba(212,168,67,0.12);
  border:1px solid rgba(212,168,67,0.25);padding:4px 9px;border-radius:20px;}
.buy{display:flex;align-items:center;gap:10px;}
.was{font-size:14px;color:rgba(255,244,222,0.42);text-decoration:line-through;
  text-decoration-color:rgba(255,107,26,0.85);text-decoration-thickness:2px;}
.now{font-size:22px;font-weight:700;color:#7DE29A;}
.off{font-size:9.5px;font-weight:700;letter-spacing:0.6px;color:#FFD9A0;background:rgba(255,107,26,0.18);
  border:1px solid rgba(255,107,26,0.45);padding:3px 8px;border-radius:8px;}
.cta{margin-left:auto;background:linear-gradient(120deg,var(--gold),#B8892F);color:#1A0D00;
  font-size:12.5px;font-weight:600;padding:10px 15px;border-radius:12px;white-space:nowrap;}
.vline{font-size:9.5px;color:rgba(255,244,222,0.4);margin-top:10px;letter-spacing:0.4px;}

/* ── report cards ── */
.rep{position:relative;display:block;border:1px solid rgba(212,168,67,0.20);border-radius:18px;
  padding:14px;margin-bottom:12px;cursor:pointer;text-decoration:none;color:inherit;
  background:linear-gradient(150deg,rgba(255,255,255,0.035),rgba(255,255,255,0));transition:transform .12s;}
.rep:active{transform:scale(0.985);}
.r-top{display:flex;align-items:flex-start;gap:12px;}
.r-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:radial-gradient(circle at 32% 28%,rgba(212,168,67,0.25),rgba(212,168,67,0.06));
  border:1px solid rgba(212,168,67,0.35);flex-shrink:0;}
.r-title{font-family:'Tiro Devanagari Hindi',serif;font-size:15.5px;color:#FFF4DE;font-weight:600;}
.r-en{font-size:10px;color:rgba(255,244,222,0.55);margin-top:1px;}
.r-chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 11px;}
.r-chips .chip{font-size:9px;padding:3px 8px;}
.r-buy{display:flex;align-items:center;gap:9px;}
.r-buy .now{font-size:18px;}
.r-buy .cta{padding:8px 13px;font-size:11.5px;}
.note{text-align:center;font-size:10px;color:rgba(255,244,222,0.3);margin-top:24px;line-height:1.7;}
</style>
<!-- analytics first: it also reports uncaught errors from every script below,
     and this page has a document.write race in its history — if it ever fails
     again we will hear about it the same day instead of by accident. -->
<script src="analytics.js"></script>
<script>
/* The string tables must be in place before the inline render script runs,
   and before report-catalog.js so its helpers can see A() and sdHas().
   document.write during initial parse is parser-blocking; a dynamically
   appended script is not, and that race already shipped once. */
window.SD_LANG=(function(){try{return JSON.parse(localStorage.getItem('shubhdin_user')||'{}').lang||'hi';}catch(e){return 'hi';}})();
document.write('<scr'+'ipt src="app-strings-hi.js"></scr'+'ipt>');
if(window.SD_LANG&&window.SD_LANG!=='hi')
  document.write('<scr'+'ipt src="app-strings-'+window.SD_LANG+'.js"></scr'+'ipt>');
document.write('<scr'+'ipt src="app-langs.js"></scr'+'ipt>');
document.write('<scr'+'ipt src="app-strings-loader.js"></scr'+'ipt>');
</script>
<script src="report-catalog.js"></script>
<script src="font-loader.js"></script>
<script>try{sdLoadFonts();}catch(e){}</script>
</head>
<body>
<div class="hdr">
  <button class="back" onclick="sdBack('dashboard.html')">←</button>
  <div class="htitle"><span id="premTitle">प्रीमियम रिपोर्ट्स</span><small id="premGloss" data-gloss>PREMIUM REPORTS</small></div>
  <div class="crown">👑</div>
</div>
<div class="lead" id="premLead">Deeper, personalized astrology insights — every report prepared from your own Kundli.</div>

<div id="pageRoot"></div>

<div class="note" id="premNote">© शुभ दिन</div>

<script>
// ─────────────────────────────────────────────────────────────
/* Names and prices come from report-catalog.js — the single source shared with
   My Reports. They used to live here AND in buy.html, which meant the sales
   page could advertise a price the buy flow did not charge. */
/* reportsForSale() drops anything withdrawn from sale (muhurta today) while
   leaving reportById() intact, so a report someone already owns still resolves
   by name, price and page and their OWNED card below still renders.
   The typeof guard is deliberate: if this page is ever served against an older
   cached report-catalog.js that has no reportsForSale, it falls back to the
   full list and shows every card. A stale sales page is recoverable; a page
   that throws here renders NO cards at all. */
/* ══ SD-CATALOG-GUARD ══════════════════════════════════════════════════════
   The comment above already worried about a stale report-catalog.js. The
   sharper case is a MISSING one — one skipped upload, one bad cache, one
   dropped request. Then reportsForSale is undefined AND so is REPORT_CATALOG,
   this line throws, and every statement below it dies: the cards, the owned
   strip, the analytics, the page chrome.

   Measured: the sales page rendered ZERO cards. A customer arrived at
   "Premium Reports" and found nothing to buy, with no error and no retry.
   Every sale on that visit is lost, silently — and before analytics we would
   never have known it happened.

   Same failure family as reports.html. Say what happened, offer a way out. */
var REPORTS = (function () {
  try {
    if (typeof reportsForSale === 'function') return reportsForSale() || [];
    if (typeof REPORT_CATALOG !== 'undefined' && REPORT_CATALOG) return REPORT_CATALOG;
  } catch (e) {}
  return null;                     // null means "catalogue unavailable"
})();

/* Ownership is read from localStorage ONLY on this page — a deliberate call
   from owned-contract.md. No Supabase client on the sales page. The cost is
   that a cleared browser briefly shows an owned card as buyable until the next
   signed-in visit heals the record; the server-backed truth lives one tap away
   in My Reports. */
var OWNED = (function () {
  try { return (typeof sdOwnedIds === 'function') ? (sdOwnedIds() || {}) : {}; }
  catch (e) { return {}; }
})();
var ownedCount = Object.keys(OWNED).length;

/* A() comes from app-strings-loader.js, which normally falls back to
   humanised keys on its own. But if that FILE fails to load, A is undefined
   and the card builder below throws on its first label — zero cards on the
   sales page, same blank-page failure as the missing catalogue. One line of
   insurance on the page that takes money. */
if(typeof A!=='function'){
  window.A=function(k){ return String(k||'').split('.').pop().replace(/_/g,' '); };
}
var root=document.getElementById('pageRoot'), h='';

/* No catalogue means nothing can be priced or named. Show that honestly
   instead of an empty page that reads as "we have nothing to sell". */
if(!REPORTS || !REPORTS.length){
  var _L=(window.SD_LANG||'hi');
  var _M={en:'Could not load the reports just now.',hi:'अभी रिपोर्ट्स लोड नहीं हो सकीं।',
    te:'ప్రస్తుతం రిపోర్ట్‌లు లోడ్ కాలేదు.',kn:'ಸದ್ಯ ವರದಿಗಳನ್ನು ಲೋಡ್ ಮಾಡಲಾಗಲಿಲ್ಲ.',
    ta:'இப்போது அறிக்கைகளை ஏற்ற முடியவில்லை.',bn:'এই মুহূর্তে রিপোর্ট লোড করা গেল না।',
    mr:'सध्या रिपोर्ट लोड होऊ शकले नाहीत.',gu:'હાલ રિપોર્ટ લોડ થઈ શક્યા નથી.',
    as:"এই মুহূৰ্তত ৰিপ'ৰ্ট ল'ড কৰিব পৰা নগ'ল।"};
  var _S={en:'Check your connection and try again.',hi:'कनेक्शन जांचकर फिर कोशिश करें।',
    te:'కనెక్షన్ చూసి మళ్లీ ప్రయత్నించండి.',kn:'ಸಂಪರ್ಕ ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.',
    ta:'இணைப்பைச் சரிபார்த்து மீண்டும் முயலுங்கள்.',bn:'সংযোগ দেখে আবার চেষ্টা করুন।',
    mr:'कनेक्शन तपासून पुन्हा प्रयत्न करा.',gu:'કનેક્શન તપાસીને ફરી પ્રયાસ કરો.',
    as:'সংযোগ চাই পুনৰ চেষ্টা কৰক।'};
  var _R={en:'Try again',hi:'फिर कोशिश करें',te:'మళ్లీ ప్రయత్నించండి',kn:'ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ',
    ta:'மீண்டும் முயலுங்கள்',bn:'আবার চেষ্টা করুন',mr:'पुन्हा प्रयत्न करा',
    gu:'ફરી પ્રયાસ કરો',as:'পুনৰ চেষ্টা কৰক'};
  /* Write into h, NOT into root — `root.innerHTML=h` runs a few lines below
     and would overwrite anything set here with an empty string. It did
     exactly that on the first attempt: guard fired, message rendered, message
     erased, blank page. */
  h='<div style="text-align:center;padding:40px 18px;">'
    +'<div style="font-size:34px;margin-bottom:12px;">👑</div>'
    +'<div style="font-size:14.5px;color:#FFF4DE;line-height:1.6;">'+(_M[_L]||_M.hi)+'</div>'
    +'<div style="font-size:12px;color:rgba(255,244,222,0.6);margin-top:8px;">'+(_S[_L]||_S.hi)+'</div>'
    +'<button onclick="location.reload()" style="margin-top:18px;background:linear-gradient(120deg,#D4A843,#B8892F);'
    +'color:#1A0D00;border:none;font-family:inherit;font-size:13px;font-weight:600;'
    +'padding:11px 20px;border-radius:11px;cursor:pointer;">'+(_R[_L]||_R.hi)+'</button></div>';
  try{ sdTrack('js_error',{msg:'report-catalog missing',file:'premium.html'}); sdFlush(true); }catch(e){}
  REPORTS=[];   /* the forEach below then adds nothing, and h survives */
}

/* Door 1 — the strip. Nothing renders at zero owned, so the page stays pure
   sales for someone who has bought nothing. */
if(ownedCount>0){
  h+='<a href="reports.html" style="display:flex;align-items:center;gap:11px;margin:0 0 16px;'
   +'padding:13px 15px;border-radius:14px;text-decoration:none;'
   +'background:linear-gradient(135deg,rgba(74,124,89,0.18),rgba(212,168,67,0.06));'
   +'border:1px solid rgba(120,200,150,0.35);">'
   +'<span style="font-size:21px;">📁</span>'
   +'<span style="flex:1;"><span style="display:block;font-size:14.5px;font-weight:600;color:#BFEFD0;">'
   +A('report.my_reports')+' ('+ownedCount+')</span>'
   +'<span style="display:block;font-size:10.5px;color:rgba(255,244,222,0.60);margin-top:2px;">'
   +A('prem.openOwned')+'</span></span>'
   +'<span style="color:rgba(191,239,208,0.75);font-size:18px;">›</span></a>';
}

REPORTS.forEach(function(r){
  var owned=!!OWNED[r.id];
  var chips=r.chips.map(function(c){return '<span class="chip">'+reportChip(c)+'</span>';}).join('');
  // An owned card must never look buyable again: no price, no discount, and a
  // link into the report rather than into the buy flow.
  var href = owned ? 'reports.html#'+r.id : ('buy.html?r='+r.id);
  var priceBlock = owned
    ? '<span class="cta" style="background:linear-gradient(120deg,#4A7C59,#2E7D46);color:#EAFFEF;">'+A('prem.openYourReport')+'</span>'
    : '<span class="was">₹'+r.was+'</span><span class="now">₹'+r.now+'</span>'
      +'<span class="off">'+reportDiscount(r.id)+'</span>'
      +'<span class="cta">'+(r.hero?A('prem.getMyReport'):A('prem.view'))+'</span>';
  var ownedTag = owned
    ? '<div data-owned-badge style="position:absolute;top:12px;right:12px;background:rgba(74,124,89,0.90);color:#EAFFEF;'
      +'font-size:9.5px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:20px;">'+A('prem.owned')+'</div>' : '';
  if(r.hero){
    h+='<a class="hero" id="'+r.anchor+'" href="'+href+'" style="position:relative;">'
      +(owned?ownedTag:'<div class="ribbon">'+A('prem.mostPopular')+'</div>')
      +'<div class="h-row"><div class="h-ico">'+r.ico+'</div><div>'
      +'<div class="h-title">'+reportTitle(r)+'</div><div class="h-en" data-en-subtitle>'+r.en+'</div></div></div>'
      +'<div class="hook">'+reportHook(r)+'</div>'
      +'<div class="chips">'+chips+'</div>'
      +'<div class="buy">'+priceBlock+'</div>'
      +'<div class="vline">'+(owned?A('prem.alreadyYours')
                                    :A('prem.personalisedLine'))+'</div>'
      +'</a>';
  } else {
    h+='<a class="rep" id="'+r.anchor+'" href="'+href+'" style="position:relative;">'
      +ownedTag
      +'<div class="r-top"><div class="r-ico">'+r.ico+'</div><div>'
      +'<div class="r-title">'+reportTitle(r)+'</div><div class="r-en" data-en-subtitle>'+r.en+'</div></div></div>'
      +'<div class="hook r-hook">'+reportHook(r)+'</div>'
      +'<div class="r-chips">'+chips+'</div>'
      +'<div class="r-buy">'+priceBlock+'</div>'
      +'</a>';
  }
});
root.innerHTML=h;

/* ══ funnel · top ══════════════════════════════════════════════════════════
   report_view is fired once per report shown on this page, so the funnel has
   a real denominator. buy_click is fired on the tap that leaves for buy.html —
   and NOT on an owned card, which goes to My Reports and is not a purchase
   intent. Every call is wrapped: a sales page must never fail to sell because
   analytics broke. */
try{
  REPORTS.forEach(function(r){
    if(!OWNED[r.id]) sdTrack('report_view',{report:r.id});
  });
  sdTrack('premium_view',{count:REPORTS.length,n:ownedCount});
  root.addEventListener('click',function(e){
    try{
      var a=e.target; while(a&&a!==root&&a.tagName!=='A') a=a.parentNode;
      if(!a||!a.getAttribute) return;
      var href=a.getAttribute('href')||'';
      var m=href.match(/buy\.html\?r=([a-z_]+)/);
      if(m){ sdTrack('buy_click',{report:m[1],source:'premium'}); sdFlush(true); }
    }catch(x){}
  },true);
}catch(e){}
/* page chrome — set after render so A() is certainly resolved */
(function(){
  var set=function(id,k){var e=document.getElementById(id); if(e&&typeof A==='function') e.textContent=A(k);};
  set('premTitle','prem.pageTitle'); set('premGloss','prem.pageTitleGloss');
  set('premLead','prem.lead');
  var n=document.getElementById('premNote');
  if(n&&typeof A==='function') n.textContent='© '+A('dashbo.shubh_din')+' · '+A('prem.introPrices');
})();
</script>
<script src="nav-history.js"></script>
</body>
</html>
